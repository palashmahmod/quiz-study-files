: খ\r\n১২. $m_1$ এবং $m_2$ ভরের দুটি বস্তুকণা পরস্পর হতে $d$ দূরত্বে অবস্থিত হলে এবং তাদের মধ্যকার আকর্ষণ বল $F$ হলে, মহাকর্ষ সূত্রটির গাণিতিক রূপ কোনটি?\r\n(ক) $F = G \\frac{m_1 m_2}{d}$\r\n(খ) $F = G \\frac{m_1 m_2}{d^2}$\r\n(গ) $F = G \\frac{d^2}{m_1 m_2}$\r\n(ঘ) $F = \\frac{m_1 m_2}{d^2}$\r\nউত্তর: খ\r\n১৩. মহাকর্ষ সূত্রের সমীকরণে $G$ কে কী বলা হয়?\r\n(ক) অভিকর্ষজ ত্বরণ (খ) সর্বজনীন মহাকর্ষীয় ধ্রুবক \r\n(গ) মাধ্যমের ঘনত্ব (ঘ) কণার আধান\r\nউত্তর: খ\r\n১৪. সর্বজনীন মহাকর্ষীয় ধ্রুবক $G$ এর অর্থ হলো—\r\n(ক) $1\\text{ kg}$ ভরের দুটি বস্তু $1\\text{ m}$ দূরত্বে থাকলে তাদের আকর্ষণ বল \r\n(খ) $2\\text{ kg}$ ভরের দুটি বস্তু $2\\text{ m}$ দূরত্বে থাকলে তাদের আকর্ষণ বল \r\n(গ) $10\\text{ kg}$ ভরের দুটি বস্তু $1\\text{ m}$ দূরত্বে থাকলে তাদের আকর্ষণ বল \r\n(ঘ) $1\\text{ kg}$ ভরের দুটি বস্তু $2\\text{ m}$ দূরত্বে থাকলে তাদের আকর্ষণ বল\r\nউত্তর: ক\r\n১৫. নির্দিষ্ট দূরত্বে অবস্থিত দুটি বস্তুকণার ভরের গুণফল দ্বিগুণ করা হলে মহাকর্ষ বল কতগুণ হবে?\r\n(ক) অর্ধেক (খ) দ্বিগুণ (গ) চারগুণ (ঘ) তিনগুণ\r\nউত্তর: খ\r\n১৬. নির্দিষ্ট দূরত্বে অবস্থিত দুটি বস্তুকণার ভরের গুণফল তিনগুণ করা হলে মহাকর্ষ বল কতগুণ হবে?\r\n(ক) দ্বিগুণ (খ) তিনগুণ (গ) নয়গুণ (ঘ) এক-তৃতীয়াংশ\r\nউত্তর: খ\r\n১৭. নির্দিষ্ট ভরের দুটি বস্তুকণার মধ্যবর্তী দূরত্ব দ্বিগুণ করা হলে মহাকর্ষ বল কেমন হবে?\r\n(ক) এক-দ্বিতীয়াংশ (খ) এক-তৃতীয়াংশ \r\n(গ) এক-চতুর্থাংশ (ঘ) চারগুণ\r\nউত্তর: গ\r\n১৮. নির্দিষ্ট ভরের দুটি বস্তুকণার মধ্যবর্তী দূরত্ব তিনগুণ করা হলে মহাকর্ষ বল কত হবে?\r\n(ক) এক-নয় ভাগের এক ভাগ (খ) তিন ভাগের এক ভাগ \r\n(গ) ছয় ভাগের এক ভাগ (ঘ) নয়গুণ\r\nউত্তর: ক"},{"id":"block_17854807922068gz58","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\r\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<b> নিচের তথ্যের আলোকে (১৯ ও ২০) নং প্রশ্নের উত্তর দাও:   </b>\r\nতানভির ও তার ছোট ভাই বাগানে খেলা করছিল। হঠাৎ গাছ থেকে একটি আম নিচে পড়তে দেখে তানভির তার ভাইকে বলল, বিজ্ঞানী নিউটনও একদিন ঠিক একইভাবে আপেল মাটিতে পড়তে দেখে চিন্তাভাবনা শুরু করেছিলেন এবং এক যুগান্তকারী সূত্রে উপনীত হন।\r\n১৯. বিজ্ঞানী নিউটন গাছ থেকে মাটিতে আপেল পড়তে দেখে কোন সিদ্ধান্তে উপনীত হন?\r\n(ক) কেবল পৃথিবীই বস্তুসমূহকে টানে \r\n(খ) মহাবিশ্বের সকল বস্তুকণাই একে অপরকে আকর্ষণ করে \r\n(গ) বাতাস ফলটিকে নিচে ঠেলে দেয় \r\n(ঘ) বস্তুর ভর শূন্য হয়ে যায়\r\nউত্তর: খ\r\n২০. উদ্দীপকে উল্লিখিত মহাবিশ্বের যেকোনো দুটি বস্তুর মধ্যকার এই আকর্ষণ বলকে কী বলা হয়?\r\n(ক) অভিকর্ষ বল (খ) মহাকর্ষ বল \r\n(গ) তড়িৎ বল (ঘ) নিউক্লীয় বল\r\nউত্তর: খ\r\n<b> নিচের তথ্যের আলোকে (২১ ও ২২) নং প্রশ্নের উত্তর দাও:   </b>\r\nবিজ্ঞানাগারে দুটি নির্দিষ্ট ভরের বস্তুর মধ্যকার আকর্ষণ বল মেপে পাওয়া গেল $F$। এরপর শিক্ষক বস্তু দুটির ভর অপরিবর্তিত রেখে তাদের মধ্যবর্তী দূরত্ব আগের চেয়ে দ্বিগুণ করে দিলেন।\r\n২১. দুটি বস্তুকণার মধ্যকার এই আকর্ষণ বলের মান কিসের ওপর নির্ভর করে না?\r\n(ক) বস্তুর ভর (খ) মধ্যবর্তী দূরত্ব \r\n(গ) মাধ্যমের প্রকৃতি (ঘ) বস্তুর অবস্থান\r\nউত্তর: গ\r\n২২. উদ্দীপকে বস্তু দুটির মধ্যবর্তী দূরত্ব দ্বিগুণ করার পর পরিবর্তিত আকর্ষণ বলের মান কত হবে?\r\n(ক) $F$ এর দ্বিগুণ (খ) $F$ এর এক-চতুর্থাংশ \r\n(গ) $F$ এর চারগুণ (ঘ) $F$ এর অর্ধেক\r\nউত্তর: খ\r\n<b> নিচের তথ্যের আলোকে (২৩ ও ২৪) নং প্রশ্নের উত্তর দাও:   </b>\r\nল্যাবরেটরিতে সামিন $m_1 = 1\\text{ kg}$ এবং $m_2 = 1\\text{ kg}$ ভরের দুটি বস্তু $d = 1\\text{ m}$ দূরত্বে স্থাপন করল। সে তাদের মধ্যকার পারস্পরিক আকর্ষণ বল হিসাব করে দেখল যে এই বলের মান সর্বজনীন মহাকর্ষীয় ধ্রুবক $G$ এর মানের সমান।\r\n২৩. মহাকর্ষ সূত্রের গাণিতিক রূপ অনুসারে $G$ কে কী বলা হয়?\r\n(ক) অভিকর্ষজ ত্বরণ (খ) সর্বজনীন মহাকর্ষীয় ধ্রুবক \r\n(গ) মহাকর্ষীয় শক্তি (ঘ) ভরকেন্দ্র\r\nউত্তর: খ\r\n২৪. উদ্দীপকে যদি বস্তুদ্বয়ের দূরত্ব নির্দিষ্ট রেখে ভরের গুণফল ৩ গুণ করা হতো, তবে আকর্ষণ বলের কী পরিবর্তন ঘটত?\r\n(ক) বল ৩ গুণ হতো (খ) বল ৯ গুণ হতো \r\n(গ) বল ১/৩ গুণ হতো (ঘ) অপরিবর্তিত থাকত\r\nউত্তর: ক\r\n<b> নিচের তথ্যের আলোকে (২৫ ও ২৬) নং প্রশ্নের উত্তর দাও:   </b>\r\nরাফি ও শাফিন টেবিলের দুই পাশে দুটি গোলক রেখে পর্যবেক্ষণ করছিল। তাদের শিক্ষক বললেন, এই গোলক দুটি একে অপরকে একটি নির্দিষ্ট রেখা বরাবর আকর্ষণ করছে। নিউটনের মহাকর্ষ সূত্রানুসারে এই আকর্ষণ বলের মান গোলকদ্বয়ের ভরের গুণফলের সমানুপাতিক এবং দূরত্বের বর্গের ব্যস্তানুপাতিক।\r\n২৫. মহাকর্ষ বল বস্তুকণাদ্বয়ের কোন রেখা বরাবর ক্রিয়া করে?\r\n(ক) বক্ররেখা বরাবর (খ) সংযোজক সরলরেখা বরাবর (গ) লম্ব রেখা বরাবর (ঘ) স্পর্শক রেখা বরাবর\r\nউত্তর: খ\r\n২৬. উদ্দীপকের গোলক দুটির মধ্যবর্তী দূরত্ব ৩ গুণ করা হলে আকর্ষণ বল কত গুণ হবে?\r\n(ক) ৩ গুণ (খ) ৯ গুণ (গ) ৯ ভাগের এক ভাগ (ঘ) ৩ ভাগের এক ভাগ\r\nউত্তর: গ\r\n<b> নিচের চিত্রের আলোকে (২৭ ও ২৮) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785480841504r7ywn","type":"image","value":""},{"id":"block_1785480887864j7p4y","type":"text","value":"২৭. উদ্দীপকের চিত্রে প্রদর্শিত আপেলটি মাটিতে পড়ার পেছনে কাজ করা আকর্ষণ বলকে কী বলে?\r\n(ক) তড়িৎ বল (খ) মহাকর্ষ বল \r\n(গ) নিউক্লীয় বল (ঘ) চুম্বক বল\r\nউত্তর: খ\r\n২৮. উদ্দীপকের ঘটনাটি পর্যবেক্ষণ করে বিজ্ঞানী নিউটন মহাবিশ্বের যেকোনো দুটি বস্তুর আকর্ষণ সম্পর্কে কোন সিদ্ধান্ত উপনীত হন?\r\n(ক) কেবল পৃথিবীই বস্তুকে আকর্ষণ করে \r\n(খ) মহাবিশ্বের প্রতিটি বস্তুকণা একে অপরকে আকর্ষণ করে \r\n(গ) কেবল ভারী বস্তু হালকা বস্তুকে আকর্ষণ করে \r\n(ঘ) মাধ্যমের উপস্থিতি ছাড়া আকর্ষণ সম্ভব নয়\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785480901537crm9n","type":"image","value":""},{"id":"block_1785480905524xm9w5","type":"text","value":"২৯. চিত্রে প্রদর্শিত বস্তুদ্বয়ের মধ্যকার আকর্ষণ বল $F$ এর সঠিক গাণিতিক সূত্র কোনটি?\r\n(ক) $F = G \\frac{m_1 m_2}{d}$\r\n(খ) $F = G \\frac{m_1 m_2}{d^2}$\r\n(g) $F = \\frac{m_1 m_2}{d^2}$\r\n(ঘ) $F = G \\frac{d^2}{m_1 m_2}$\r\nউত্তর: খ\r\n৩০. চিত্রে প্রদর্শিত $m_1$ ও $m_2$ ভরের বস্তু দুটির ভর স্থির রেখে মধ্যবর্তী দূরত্ব $d$ দ্বিগুণ করা হলে আকর্ষণ বলের কী পরিবর্তন ঘটবে?\r\n(ক) বল দ্বিগুণ হবে (খ) বল চারগুণ হবে \r\n(গ) বল এক-চতুর্থাংশ হবে (ঘ) বল অর্ধেক হবে\r\nউত্তর: গ\r\n<b> নিচের চিত্রের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785480919592ps8t8","type":"image","value":""},{"id":"block_1785480923435b1kxd","type":"text","value":"৩১. চিত্রে বর্ণিত শর্ত অনুযায়ী $1\\text{ kg}$ ভরের দুটি বস্তু $1\\text{ m}$ দূরত্বে থাকলে তাদের পারস্পরিক আকর্ষণ বলের মান কার সমান হয়?\r\n(ক) $G$ এর সমান (খ) $g$ এর সমান \r\n(গ) শূন্যের সমান (ঘ) ভরের গুণফলের সমান\r\nউত্তর: ক\r\n৩২. উদ্দীপকে উল্লিখিত $G$ কে কী বলা হয়?\r\n(ক) অভিকর্ষজ ত্বরণ (খ) সর্বজনীন মহাকর্ষীয় ধ্রুবক \r\n(গ) মহাকর্ষীয় প্রাবল্য (ঘ) কেন্দ্রমুখী বল\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_178548094515704f99","type":"image","value":""},{"id":"block_17854809475117vc8n","type":"text","value":"৩৩. চিত্রে প্রদর্শিত বস্তু দুটির মধ্যবর্তী দূরত্ব তিনগুণ করা হলে তাদের মধ্যকার আকর্ষণ বল পূর্বের বলের কত গুণ হবে?\r\n(ক) তিনগুণ (খ) নয়গুণ \r\n(গ) তিন ভাগের এক ভাগ (ঘ) নয় ভাগের এক ভাগ\r\nউত্তর: ঘ\r\n৩৪. উদ্দীপকে বস্তুদ্বয়ের আকার বা মাধ্যমের কোনো পরিবর্তন করা হলে মহাকর্ষ বলের মান কেমন হবে?\r\n(ক) পরিবর্তিত হবে (খ) অপরিবর্তিত থাকবে \r\n(গ) শূন্য হয়ে যাবে (ঘ) দ্বিগুণ হবে\r\nউত্তর: খ"},{"id":"block_1785481015748gqwox","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩৫. গাছের ফল মাটিতে পড়ার ঘটনার কারণ হলো—\ni. পৃথিবী একে নিজের দিকে আকর্ষণ করে\nii. মহাবিশ্বের প্রতিটি বস্তুকণা পরস্পরকে আকর্ষণ করে\niii. বস্তুটির ওপর বায়ুর চাপ বেশি থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৬. মহাকর্ষ বল (Gravitational force) সম্পর্কিত সত্য উক্তি হলো—\ni. এ বিশ্বের যেকোনো দুটি বস্তুর মধ্যকার আকর্ষণ বলই মহাকর্ষ বল\nii. নিউটন গাছ থেকে আপেল মাটিতে পড়া দেখে এই চিন্তায় উপনীত হন\niii. এই বল কেবল ভারী বস্তুসমূহের ক্ষেত্রেই প্রযোজ্য, ক্ষুদ্র কণায় নয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৭. নিউটনের মহাকর্ষ সূত্রানুসারে—\ni. আকর্ষণ বলের মান বস্তুকণাদ্বয়ের ভরের গুণফলের সমানুপাতিক\nii. আকর্ষণ বলের মান বস্তুকণাদ্বয়ের দূরত্বের বর্গের ব্যস্তানুপাতিক\niii. এই বল বস্তুকণাদ্বয়ের সংযোজক সরলরেখা বরাবর ক্রিয়া করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৮. দুটি বস্তুকণার মধ্যকার আকর্ষণ বল কিসের ওপর নির্ভর করে?\ni. বস্তুকণাদ্বয়ের ভর ii. বস্তুকণাদ্বয়ের মধ্যকার দূরত্ব\niii. কণাগুলোর প্রকৃতি বা মাধ্যমের প্রকৃতি\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৯. সর্বজনীন মহাকর্ষীয় ধ্রুবক ($G$) সম্পর্কিত সঠিক তথ্য হলো—\ni. $1\\text{ kg}$ ভরের দুটি বস্তু $1\\text{ m}$ দূরত্বে স্থাপন করলে এরা পরস্পরকে যে বলে আকর্ষণ করে তা $G$ এর সমান\nii. এটি একটি সমানুপাতিক ধ্রুবক\niii. এর মান মাধ্যমের প্রকৃতির ওপর নির্ভর করে পরিবর্তিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪০. নির্দিষ্ট দূরত্বে অবস্থিত দুটি বস্তুকণার ক্ষেত্রে—\ni. ভরের গুণফল দ্বিগুণ হলে বল দ্বিগুণ হয়\nii. ভরের গুণফল তিনগুণ হলে বল তিনগুণ হয়\niii. ভর অপরিবর্তিত রেখে দূরত্ব দ্বিগুণ করলে বল এক-চতুর্থাংশ হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪১. নির্দিষ্ট ভরের দুটি বস্তুকণার মধ্যবর্তী দূরত্ব পরিবর্তন করলে—\ni. দূরত্ব দ্বিগুণ করলে বল চারগুণ বৃদ্ধি পায়\nii. দূরত্ব দ্বিগুণ করলে বল এক-চতুর্থাংশ হয়\niii. দূরত্ব তিনগুণ করলে বল নয় ভাগের এক ভাগ হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: গ"}]},{"id":"topic_1785481076937carg0","title":"পাঠ - (২-৩)","blocks":[{"id":"block_17854813338217ylf3","type":"text","value":"<span style=\"color:green;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. পৃথিবী এবং অন্য যেকোনো বস্তুর মধ্যে যে আকর্ষণ, তাকে কী বলে?\n(ক) মহাকর্ষ (খ) অভিকর্ষ (গ) তড়িৎ বল (ঘ) নিউক্লীয় বল\nউত্তর: খ\n২. দুটি বস্তুর একটি যদি পৃথিবী হয়, তবে পৃথিবী বস্তুটকে যে বলে আকর্ষণ করে তাকে কী বলে?\n(ক) মহাকর্ষ (খ) মাধ্যাকর্ষণ বা অভিকর্ষ \n(গ) স্বকর্ষ বল (ঘ) বিকর্ষণ বল\nউত্তর: খ\n৩. নিচের কোনটি অভিকর্ষের উদাহরণ?\n(ক) সূর্য ও পৃথিবীর মধ্যকার আকর্ষণ \n(খ) সূর্য ও চন্দ্রের মধ্যকার আকর্ষণ \n(গ) পৃথিবী এবং তোমার বিজ্ঞান বইয়ের মধ্যকার আকর্ষণ \n(ঘ) চন্দ্র ও মঙ্গল গ্রহের মধ্যকার আকর্ষণ\nউত্তর: গ\n৪. সূর্য ও চন্দ্রের মধ্যকার আকর্ষণকে কী বলা হয়?\n(ক) অভিকর্ষ (খ) মহাকর্ষ (গ) মাধ্যাকর্ষণ (ঘ) স্পর্শ বল\nউত্তর: খ\n৫. সময়ের সাথে কোনো বস্তুর বেগ বৃদ্ধির হারকে কী বলে?\n(ক) দ্রুতি (খ) সরণ (গ) ত্বরণ (ঘ) ভরবেগ\nউত্তর: গ\n৬. অভিকর্ষ বলের প্রভাবে মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ বৃদ্ধির হারকে কী বলে?\n(ক) মহাকর্ষীয় ত্বরণ (খ) অভিকর্ষজ ত্বরণ \n(গ) গড় বেগ (ঘ) সুষম দ্রুতি\nউত্তর: খ\n৭. অভিকর্ষজ ত্বরণকে কোন প্রতীক দ্বারা প্রকাশ করা হয়?\n(ক) $G$ (খ) $g$ (গ) $F$ (ঘ) $R$\nউত্তর: খ\n৮. অভিকর্ষজ ত্বরণের একক কোনটি?\n(ক) $\\text{মিটার/সেকেন্ড}$ (খ) $\\text{মিটার/সেকেন্ড}^2$ \n(গ) $\\text{নিউটন}$ (ঘ) $\\text{কিলোগ্রাম}$\nউত্তর: খ\n৯. পৃথিবীর ভর $M$, বস্তুর ভর $m$ এবং এদের মধ্যবর্তী দূরত্ব $d$ হলে, অভিকর্ষ বল $F$ এর সূত্র কোনটি?\n(ক) $F = G \\frac{M}{d^2}$ (খ) $F = G \\frac{Mm}{d^2}$\n(গ) $F = mg$ (ঘ) $F = \\frac{G}{Mm}$\nউত্তর: খ\n১০. বলের পরিমাপ থেকে পাই, অভিকর্ষ বল $F = ?$\n(ক) $\\text{ভর} \\times \\text{ত্বরণ}$ (বা $mg$) \n(খ) $\\text{ভর} \\div \\text{ত্বরণ}$ \n(গ) $\\text{ভর} + \\text{ত্বরণ}$ \n(ঘ) $\\text{ত্বরণ} \\div \\text{ভর}$\nউত্তর: ক\n১১. অভিকর্ষজ ত্বরণ $g$ নির্ণয়ের সঠিক সমীকরণ কোনটি?\n(ক) $g = \\frac{GM}{d^2}$ (খ) $g = \\frac{GMm}{d^2}$ \n(গ) $g = \\frac{Gd^2}{M}$ (ঘ) $g = \\frac{M}{d^2}$\nউত্তর: ক\n১২. অভিকর্ষজ ত্বরণ $g$ এর মান নিচের কোনটির ওপর নির্ভর করে না?\n(ক) পৃথিবীর ভর $M$ (খ) বস্তুর ভর $m$ \n(গ) কেন্দ্র হতে দূরত্ব $d$ (ঘ) মহাকর্ষীয় ধ্রুবক $G$\nউত্তর: খ\n১৩. $g$ এর মান বস্তু নিরপেক্ষ হলেও স্থান নিরপেক্ষ নয় কেন?\n(ক) পৃথিবীর ভর পরিবর্তনশীল বলে \n(খ) বস্তুর ভর স্থানভেদে পরিবর্তিত হয় বলে \n(গ) কেন্দ্র থেকে বিভিন্ন স্থানের দূরত্ব $d$ বিভিন্ন বলে \n(ঘ) $G$ এর মান স্থানভেদে বদলায় বলে\nউত্তর: গ\n১৪. পৃথিবীকে গোলাকার বিবেচনা করলে ভূপৃষ্ঠে $g$ এর সমীকরণ কোনটি হবে? (যেখানে $R =$ পৃথিবীর ব্যাসার্ধ)\n(ক) $g = \\frac{GM}{R}$ (খ) $g = \\frac{GM}{R^2}$ \n(গ) $g = \\frac{GR^2}{M}$ (ঘ) $g = \\frac{M}{R^2}$\nউত্তর: খ\n১৫. পৃথিবীর আকৃতি কেমন হওয়ায় কেন্দ্র থেকে দূরত্ব $R$ সর্বত্র সমান নয়?(ক) সম্পূর্ণ গোল (খ) মেরু অঞ্চলে কিছুটা চাপা \n(গ) বিষুব অঞ্চলে অত্যন্ত চাপা (ঘ) সম্পূর্ণ সমতল\nউত্তর: খ\n১৬. পৃথিবীর কোন অঞ্চলে কেন্দ্র থেকে দূরত্ব $R$ সবচেয়ে কম?\n(ক) বিষুব অঞ্চলে (খ) ক্রান্তীয় অঞ্চলে \n(গ) মেরু অঞ্চলে (ঘ) মধ্যরেখা অঞ্চলে\nউত্তর: গ\n১৭. মেরু অঞ্চলে $g$ এর মান কত?\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \n(খ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \n(ঘ) $৯.৮১ \\text{ মিটার/সেকেন্ড}^২$\nউত্তর: খ\n১৮. মেরু অঞ্চল থেকে বিষুব অঞ্চলের দিকে গেলে $g$ এর মান কেমন হতে থাকে?\n(ক) বাড়তে থাকে (খ) কমতে থাকে \n(গ) একই থাকে (ঘ) শূন্য হয়ে যায়\nউত্তর: খ\n১৯. বিষুব অঞ্চলে $g$ এর মান কত?\n(ক) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \n(খ) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \n(ঘ) $৯.৮২ \\text{ মিটার/সেকেন্ড}^২$\nউত্তর: খ\n২০. হিসাাবের সুবিধার জন্য ভূপৃষ্ঠে $g$ এর আদর্শ মান কত ধরা হয়?\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \n(খ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \n(ঘ) $৯.৮৫ \\text{ মিটার/সেকেন্ড}^২$\nউত্তর: গ\n২১. ভূপৃষ্ঠে $g$ এর মান $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ এর অর্থ হলো— মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ প্রতি সেকেন্ডে কত বৃদ্ধি পায়?\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}$ \n(খ) $৯.৮ \\text{ মিটার/সেকেন্ড}$ \n(গ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}$ \n(ঘ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$\nউত্তর: খ\n২২. বাতাসে বাধা না থাকলে একই উচ্চতা থেকে এক টুকরা পাথর ও এক টুকরা কাগজ ছেড়ে দিলে কী ঘটবে?\n(ক) পাথরটি আগে মাটিতে পৌঁছাবে \n(খ) কাগজটি আগে মাটিতে পৌঁছাবে \n(গ) দুটিই একই সময়ে মাটিতে পৌঁছাবে \n(ঘ) কোনোটিই মাটিতে পৌঁছাবে না\nউত্তর: গ\n২৩. বাস্তবে পাথরটি কাগজের আগে মাটিতে পৌঁছানোর কারণ কী?\n(ক) পাথরের ওপর অভিকর্ষজ ত্বরণ বেশি \n(খ) বাতাসের বাধার ভিন্নতার কারণে \n(গ) কাগজের ভর বেশি \n(ঘ) পৃথিবীর আকৃতির কারণে\nউত্তর: খ"},{"id":"block_1785481335939a0u32","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\r\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<b> নিচের তথ্যের আলোকে (২৪ ও ২৫) নং প্রশ্নের উত্তর দাও:   </b>\r\nরিসাদ ও তার ছোট বোন ছাদে দাঁড়িয়ে একটি ক্রিকেট বল ও একটি রবারের বল একসাথে নিচের দিকে ছেড়ে দিল। রিসাদ লক্ষ করল, দুটি বলের ভর ভিন্ন হওয়া সত্ত্বেও অভিকর্ষ বলের প্রভাবে নির্দিষ্ট সময়ে তারা মাটিতে গিয়ে পৌঁছাল।\r\n২৪. পৃথিবী এবং অন্য যেকোনো বস্তুর মধ্যকার এই আকর্ষণ বলকে কী বলা হয়?\r\n(ক) মহাকর্ষ (খ) অভিকর্ষ বা মাধ্যাকর্ষণ \r\n(গ) চৌম্বক বল (ঘ) তড়িৎ বল\r\nউত্তর: খ\r\n২৫. মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ বৃদ্ধির হারকে কী বলে?\r\n(ক) দ্রুতি (খ) সরণ (গ) অভিকর্ষজ ত্বরণ (ঘ) মন্দন\r\nউত্তর: গ\r\n<b> নিচের তথ্যের আলোকে (২৬ ও ২৭) নং প্রশ্নের উত্তর দাও:   </b>\r\nবিজ্ঞান ক্লাসে শিক্ষক বোর্ডে একটি সমীকরণ লিখলেন: $g = \\frac{GM}{d^2}$। শিক্ষক শিক্ষার্থীদের বললেন, পৃথিবীর কেন্দ্র থেকে বস্তুর দূরত্বের তারতম্যের কারণে পৃথিবীর বিভিন্ন স্থানে এই মানের পরিবর্তন ঘটে।\r\n২৬. সমীকরণে ব্যবহৃত $g$ এর একক নিচের কোনটি?\r\n(ক) মিটার/সেকেন্ড (খ) মিটার/সেকেন্ড$^2$ \r\n(গ) নিউটন (ঘ) কিলোগ্রাম\r\nউত্তর: খ\r\n২৭. সমীকরণটি বিশ্লেষণ করলে দেখা যায়, $g$ এর মান নিচের কোনটির ওপর নির্ভর করে না?\r\n(ক) পৃথিবীর ভর $M$ (খ) বস্তুর ভর $m$ \r\n(গ) কেন্দ্র থেকে দূরত্ব $d$ (ঘ) মহাকর্ষীয় ধ্রুবক $G$\r\nউত্তর: খ\r\n<b> নিচের তথ্যের আলোকে (২৮ ও ২৯) নং প্রশ্নের উত্তর দাও:   </b>\r\nরাহুল একটি ভারী পাথর ও একটি হালকা কাগজ একই উচ্চতা থেকে একসাথে ছেড়ে দিল। সে দেখল পাথরটি কাগজের আগেই মাটিতে পৌঁছে গেছে। তার শিক্ষক বললেন, উভয়ের ওপর অভিকর্ষজ ত্বরণ সমান হওয়া সত্ত্বেও অন্য একটি বাহ্যিক বাধার পার্থক্যের কারণে এমনটি ঘটেছে।\r\n২৮. শিক্ষক যে বাহ্যিক বাধার কথা বলেছেন তা হলো—\r\n(ক) চুম্বকের বাধা (খ) বাতাসের বাধা \r\n(গ) মাটির আকর্ষণ (ঘ) ঘর্ষণ বল\r\nউত্তর: খ\r\n২৯. যদি ওই বাহ্যিক বাধা না থাকত, তবে পাথর ও কাগজের ক্ষেত্রে কী ঘটেত?\r\n(ক) পাথর আগে মাটিতে পৌঁছাত \r\n(খ) কাগজ আগে মাটিতে পৌঁছাত \r\n(গ) উভয়ই একই সময়ে মাটিতে পৌঁছাত \r\n(ঘ) কোনোটিই নিচে নামত না\r\nউত্তর: গ\r\n<b> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও:   </b>\r\nপৃথিবীর আকৃতির ভিন্নতার কারণে মেরু অঞ্চলে অভিকর্ষজ ত্বরণ $g$ এর মান সবচেয়ে বেশি ($৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$) এবং বিষুব অঞ্চলে এর মান সবচেয়ে কম ($৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$) পাওয়া যায়। তবে হিসাবের সুবিধার জন্য ভূপৃষ্ঠে এর একটি আদর্শ মান ধরে নেওয়া হয়।\r\n৩০. হিসাবের সুবিধার জন্য ভূপৃষ্ঠে $g$ এর আদর্শ মান কত ধরা হয়?\r\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \r\n(খ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \r\n(গ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \r\n(ঘ) $৯.৮১ \\text{ মিটার/সেকেন্ড}^২$\r\nউত্তর: খ\r\n৩১. ভূপৃষ্ঠে $g$ এর মান $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ হওয়ার অর্থ কী?\r\n(ক) বস্তুর ভর প্রতি সেকেন্ডে $৯.৮$ কেজি বৃদ্ধি পায় \r\n(খ) মুক্তভাবে পড়ন্ত বস্তুর বেগ প্রতি সেকেন্ডে $৯.৮ \\text{ মিটার/সেকেন্ড}$ বৃদ্ধি পায় \r\n(গ) বস্তুর ওজন শূন্য হয় \r\n(ঘ) বস্তুর ত্বরণ সর্বদা শূন্য থাকে\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785481494050dy6qv","type":"image","value":""},{"id":"block_1785481498944hykps","type":"text","value":"৩২. চিত্রে পৃথিবীর কেন্দ্র থেকে 'P' স্থানের দূরত্ব কম হওয়ায় সেখানে $g$ এর মান কত?\r\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \r\n(খ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \r\n(গ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \r\n(ঘ) $৯.৮১ \\text{ মিটার/সেকেন্ড}^২$\r\nউত্তর: খ\r\n৩৩. চিত্রে 'P' স্থান থেকে 'E' স্থানের দিকে যেতে থাকলে অভিকর্ষজ ত্বরণ $g$ এর মানের কেমন পরিবর্তন ঘটবে?\r\n(ক) বাড়তে থাকবে (খ) কমতে থাকবে \r\n(গ) একই থাকবে (ঘ) শূন্য হয়ে যাবে\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17854815041976coqb","type":"image","value":""},{"id":"block_1785481508342hhnkt","type":"text","value":"৩৪. উদ্দীপকের চিত্রে প্রদর্শিত অবস্থায় পাথর ও পালক বা কাগজ একই সময়ে নিচে পড়ার কারণ কী?\r\n(ক) অভিকর্ষজ ত্বরণ বস্তুর ভরের ওপর নির্ভর করে না \r\n(খ) দুটির ভর সমান \r\n(গ) বস্তুর ওজন শূন্য (ঘ) পাথরটিতে অভিকর্ষ বল নেই\r\nউত্তর: ক\r\n৩৫. যদি চিত্রটির চারপাশে স্বাভাবিক বাতাসের উপস্থিতি থাকত, তবে বাস্তবে কী ঘটত?\r\n(ক) পালক বা কাগজটি আগে মাটিতে পৌঁছাত \r\n(খ) পাথরটি আগে মাটিতে পৌঁছাত \r\n(গ) দুটিই একই সাথে পৌঁছাত \r\n(ঘ) পালকটি ওপরে উঠে যেত\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17854815121853u7s3","type":"image","value":""},{"id":"block_1785481515865urjro","type":"text","value":"৩৬. চিত্রে প্রদর্শিত তথ্য অনুসারে অভিকর্ষজ ত্বরণ $g$ এর সঠিক গাণিতিক প্রকাশ কোনটি?\r\n(ক) $g = \\frac{GM}{d^2}$\r\n(খ) $g = \\frac{GMm}{d^2}$\r\n(গ) $g = \\frac{Gd^2}{M}$\r\n(ঘ) $g = \\frac{M}{d^2}$\r\nউত্তর: ক\r\n৩৭. উদ্দীপকের $m$ ভরের বস্তুটিকে পৃথিবীর কেন্দ্র থেকে দ্বিগুণ দূরত্বে নিয়ে গেলে $g$ এর মান কতগুণ হবে?\r\n(ক) দ্বিগুণ (খ) চারগুণ (গ) এক-চতুর্থাংশ (ঘ) অর্ধেক\r\nউত্তর: গ\r\n<b> নিচের চিত্রের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17854817038908t71n","type":"image","value":""},{"id":"block_17854816705661c3sp","type":"image","value":"৩৮. চিত্রে নির্দেশিত 'B' আকর্ষণ বলটিকে পদার্থবিজ্ঞানের ভাষায় কী বলে?\r\n(ক) মহাকর্ষ (খ) অভিকর্ষ (গ) চুম্বক বল (ঘ) তড়িৎ বল\r\nউত্তর: খ\r\n৩৯. উদ্দীপকের চিত্রানুসারে 'A' ও 'B' বলের ক্ষেত্রে সঠিক তথ্য কোনটি?\r\n(ক) 'A' ও 'B' উভয়ই অভিকর্ষ \r\n(খ) 'A' ও 'B' উভয়ই মহাকর্ষ, তবে 'B' একই সাথে অভিকর্ষ \r\n(গ) 'A' কেবল অভিকর্ষ এবং 'B' কেবল মহাকর্ষ \r\n(ঘ) এদের কোনোটিই মহাকর্ষ নয়\r\nউত্তর: খ"},{"id":"block_17854817198734uyxk","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৪০. অভিকর্ষ (Gravity) সম্পর্কে সঠিক তথ্য হলো—\ni. পৃথিবী এবং অন্য যেকোনো বস্তুর মধ্যে যে আকর্ষণ তাকে অভিকর্ষ বলে\nii. সূর্য ও চন্দ্রের মধ্যকার আকর্ষণকে অভিকর্ষ বলা হয়\niii. গাছের ফল মাটিতে পড়া বা ক্রিকেট বল নিচে পড়া অভিকর্ষের উদাহরণ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n৪১. অভিকর্ষজ ত্বরণ ($g$) সম্পর্কে সঠিক উক্তি হলো—\ni. অভিকর্ষ বলের প্রভাবে মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ বৃদ্ধির হারকে অভিকর্ষজ ত্বরণ বলে\nii. এর একক হলো $\\text{মিটার/সেকেন্ড}^২$\niii. এর মান বস্তুর ভর $m$ এর ওপর সরাসরি নির্ভর করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪২. অভিকর্ষজ ত্বরণের সমীকরণ $g = \\frac{GM}{d^2}$ বিশ্লেষণ করলে দেখা যায়—\ni. $g$ এর মান বস্তু নিরপেক্ষ হলেও স্থান নিরপেক্ষ নয়\nii. পৃথিবীর কেন্দ্র থেকে বিভিন্ন স্থানে দূরত্ব $d$ বিভিন্ন হওয়ার কারণে $g$ এর মান পরিবর্তিত হয়\niii. বস্তুর ভর বেশি হলে $g$ এর মান বৃদ্ধি পায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৩. পৃথিবীর আকৃতি ও অভিকর্ষজ ত্বরণের মান সম্পর্কিত সত্য তথ্য হলো—\ni. মেরু অঞ্চলে পৃথিবীর কেন্দ্র থেকে দূরত্ব সবচেয়ে কম হওয়ায় সেখানে $g$ এর মান সবচেয়ে বেশি ($৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$)\nii. বিষুব অঞ্চলে কেন্দ্র থেকে দূরত্ব সবচেয়ে বেশি হওয়ায় সেখানে $g$ এর মান সবচেয়ে কম ($৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$)\niii. হিসাবের সুবিধার জন্য ভূপৃষ্ঠে $g$ এর আদর্শ মান $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ ধরা হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৪. ভূপৃষ্ঠে $g = ৯.৮ \\text{ মিটার/সেকেন্ড}^২$ বলতে বোঝায়—\ni. মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ প্রতি সেকেন্ডে $৯.৮ \\text{ মিটার/সেকেন্ড}$ বৃদ্ধি পায়\nii. মুক্তভাবে পড়ন্ত কোনো বস্তুর ভর প্রতি সেকেন্ডে $৯.৮ \\text{ কেজি}$ বৃদ্ধি পায়\niii. বস্তুটির ত্বরণ প্রতি সেকেন্ডে $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ হারে বল প্রয়োগ করে\nনিচের কোনটি সঠিক?\n(ক) i (খ) ii (গ) i ও iii (ঘ) ii ও iii\nউত্তর: ক\n৪৫. একই উচ্চতা থেকে পাথর ও কাগজ একসাথে ছেড়ে দিলে—\ni. বাতাসের বাধা না থাকলে দুটি একই সময়ে মাটিতে পৌঁছাত\nii. অভিকর্ষজ ত্বরণ ভরের ওপর নির্ভর না করায় উভয়ের ওপর সক্রিয় $g$ এর মান একই\niii. বাস্তবে বাতাসের বাধার পার্থক্যের কারণে পাথরটি আগে মাটিতে পৌঁছায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"}]},{"id":"topic_17854810844460vcr2","title":"পাঠ - (৪)","blocks":[]},{"id":"topic_17854810895091uzcd","title":"পাঠ - (৫)","blocks":[]},{"id":"topic_1785481092269ok87f","title":"পাঠ - (৬)","blocks":[]},{"id":"topic_1785481099210g5l0o","title":"পাঠ - (৭-৮)","blocks":[]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
