: খ\r\n১২. $m_1$ এবং $m_2$ ভরের দুটি বস্তুকণা পরস্পর হতে $d$ দূরত্বে অবস্থিত হলে এবং তাদের মধ্যকার আকর্ষণ বল $F$ হলে, মহাকর্ষ সূত্রটির গাণিতিক রূপ কোনটি?\r\n(ক) $F = G \\frac{m_1 m_2}{d}$\r\n(খ) $F = G \\frac{m_1 m_2}{d^2}$\r\n(গ) $F = G \\frac{d^2}{m_1 m_2}$\r\n(ঘ) $F = \\frac{m_1 m_2}{d^2}$\r\nউত্তর: খ\r\n১৩. মহাকর্ষ সূত্রের সমীকরণে $G$ কে কী বলা হয়?\r\n(ক) অভিকর্ষজ ত্বরণ (খ) সর্বজনীন মহাকর্ষীয় ধ্রুবক \r\n(গ) মাধ্যমের ঘনত্ব (ঘ) কণার আধান\r\nউত্তর: খ\r\n১৪. সর্বজনীন মহাকর্ষীয় ধ্রুবক $G$ এর অর্থ হলো—\r\n(ক) $1\\text{ kg}$ ভরের দুটি বস্তু $1\\text{ m}$ দূরত্বে থাকলে তাদের আকর্ষণ বল \r\n(খ) $2\\text{ kg}$ ভরের দুটি বস্তু $2\\text{ m}$ দূরত্বে থাকলে তাদের আকর্ষণ বল \r\n(গ) $10\\text{ kg}$ ভরের দুটি বস্তু $1\\text{ m}$ দূরত্বে থাকলে তাদের আকর্ষণ বল \r\n(ঘ) $1\\text{ kg}$ ভরের দুটি বস্তু $2\\text{ m}$ দূরত্বে থাকলে তাদের আকর্ষণ বল\r\nউত্তর: ক\r\n১৫. নির্দিষ্ট দূরত্বে অবস্থিত দুটি বস্তুকণার ভরের গুণফল দ্বিগুণ করা হলে মহাকর্ষ বল কতগুণ হবে?\r\n(ক) অর্ধেক (খ) দ্বিগুণ (গ) চারগুণ (ঘ) তিনগুণ\r\nউত্তর: খ\r\n১৬. নির্দিষ্ট দূরত্বে অবস্থিত দুটি বস্তুকণার ভরের গুণফল তিনগুণ করা হলে মহাকর্ষ বল কতগুণ হবে?\r\n(ক) দ্বিগুণ (খ) তিনগুণ (গ) নয়গুণ (ঘ) এক-তৃতীয়াংশ\r\nউত্তর: খ\r\n১৭. নির্দিষ্ট ভরের দুটি বস্তুকণার মধ্যবর্তী দূরত্ব দ্বিগুণ করা হলে মহাকর্ষ বল কেমন হবে?\r\n(ক) এক-দ্বিতীয়াংশ (খ) এক-তৃতীয়াংশ \r\n(গ) এক-চতুর্থাংশ (ঘ) চারগুণ\r\nউত্তর: গ\r\n১৮. নির্দিষ্ট ভরের দুটি বস্তুকণার মধ্যবর্তী দূরত্ব তিনগুণ করা হলে মহাকর্ষ বল কত হবে?\r\n(ক) এক-নয় ভাগের এক ভাগ (খ) তিন ভাগের এক ভাগ \r\n(গ) ছয় ভাগের এক ভাগ (ঘ) নয়গুণ\r\nউত্তর: ক"},{"id":"block_17854807922068gz58","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\r\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<b> নিচের তথ্যের আলোকে (১৯ ও ২০) নং প্রশ্নের উত্তর দাও:   </b>\r\nতানভির ও তার ছোট ভাই বাগানে খেলা করছিল। হঠাৎ গাছ থেকে একটি আম নিচে পড়তে দেখে তানভির তার ভাইকে বলল, বিজ্ঞানী নিউটনও একদিন ঠিক একইভাবে আপেল মাটিতে পড়তে দেখে চিন্তাভাবনা শুরু করেছিলেন এবং এক যুগান্তকারী সূত্রে উপনীত হন।\r\n১৯. বিজ্ঞানী নিউটন গাছ থেকে মাটিতে আপেল পড়তে দেখে কোন সিদ্ধান্তে উপনীত হন?\r\n(ক) কেবল পৃথিবীই বস্তুসমূহকে টানে \r\n(খ) মহাবিশ্বের সকল বস্তুকণাই একে অপরকে আকর্ষণ করে \r\n(গ) বাতাস ফলটিকে নিচে ঠেলে দেয় \r\n(ঘ) বস্তুর ভর শূন্য হয়ে যায়\r\nউত্তর: খ\r\n২০. উদ্দীপকে উল্লিখিত মহাবিশ্বের যেকোনো দুটি বস্তুর মধ্যকার এই আকর্ষণ বলকে কী বলা হয়?\r\n(ক) অভিকর্ষ বল (খ) মহাকর্ষ বল \r\n(গ) তড়িৎ বল (ঘ) নিউক্লীয় বল\r\nউত্তর: খ\r\n<b> নিচের তথ্যের আলোকে (২১ ও ২২) নং প্রশ্নের উত্তর দাও:   </b>\r\nবিজ্ঞানাগারে দুটি নির্দিষ্ট ভরের বস্তুর মধ্যকার আকর্ষণ বল মেপে পাওয়া গেল $F$। এরপর শিক্ষক বস্তু দুটির ভর অপরিবর্তিত রেখে তাদের মধ্যবর্তী দূরত্ব আগের চেয়ে দ্বিগুণ করে দিলেন।\r\n২১. দুটি বস্তুকণার মধ্যকার এই আকর্ষণ বলের মান কিসের ওপর নির্ভর করে না?\r\n(ক) বস্তুর ভর (খ) মধ্যবর্তী দূরত্ব \r\n(গ) মাধ্যমের প্রকৃতি (ঘ) বস্তুর অবস্থান\r\nউত্তর: গ\r\n২২. উদ্দীপকে বস্তু দুটির মধ্যবর্তী দূরত্ব দ্বিগুণ করার পর পরিবর্তিত আকর্ষণ বলের মান কত হবে?\r\n(ক) $F$ এর দ্বিগুণ (খ) $F$ এর এক-চতুর্থাংশ \r\n(গ) $F$ এর চারগুণ (ঘ) $F$ এর অর্ধেক\r\nউত্তর: খ\r\n<b> নিচের তথ্যের আলোকে (২৩ ও ২৪) নং প্রশ্নের উত্তর দাও:   </b>\r\nল্যাবরেটরিতে সামিন $m_1 = 1\\text{ kg}$ এবং $m_2 = 1\\text{ kg}$ ভরের দুটি বস্তু $d = 1\\text{ m}$ দূরত্বে স্থাপন করল। সে তাদের মধ্যকার পারস্পরিক আকর্ষণ বল হিসাব করে দেখল যে এই বলের মান সর্বজনীন মহাকর্ষীয় ধ্রুবক $G$ এর মানের সমান।\r\n২৩. মহাকর্ষ সূত্রের গাণিতিক রূপ অনুসারে $G$ কে কী বলা হয়?\r\n(ক) অভিকর্ষজ ত্বরণ (খ) সর্বজনীন মহাকর্ষীয় ধ্রুবক \r\n(গ) মহাকর্ষীয় শক্তি (ঘ) ভরকেন্দ্র\r\nউত্তর: খ\r\n২৪. উদ্দীপকে যদি বস্তুদ্বয়ের দূরত্ব নির্দিষ্ট রেখে ভরের গুণফল ৩ গুণ করা হতো, তবে আকর্ষণ বলের কী পরিবর্তন ঘটত?\r\n(ক) বল ৩ গুণ হতো (খ) বল ৯ গুণ হতো \r\n(গ) বল ১/৩ গুণ হতো (ঘ) অপরিবর্তিত থাকত\r\nউত্তর: ক\r\n<b> নিচের তথ্যের আলোকে (২৫ ও ২৬) নং প্রশ্নের উত্তর দাও:   </b>\r\nরাফি ও শাফিন টেবিলের দুই পাশে দুটি গোলক রেখে পর্যবেক্ষণ করছিল। তাদের শিক্ষক বললেন, এই গোলক দুটি একে অপরকে একটি নির্দিষ্ট রেখা বরাবর আকর্ষণ করছে। নিউটনের মহাকর্ষ সূত্রানুসারে এই আকর্ষণ বলের মান গোলকদ্বয়ের ভরের গুণফলের সমানুপাতিক এবং দূরত্বের বর্গের ব্যস্তানুপাতিক।\r\n২৫. মহাকর্ষ বল বস্তুকণাদ্বয়ের কোন রেখা বরাবর ক্রিয়া করে?\r\n(ক) বক্ররেখা বরাবর (খ) সংযোজক সরলরেখা বরাবর (গ) লম্ব রেখা বরাবর (ঘ) স্পর্শক রেখা বরাবর\r\nউত্তর: খ\r\n২৬. উদ্দীপকের গোলক দুটির মধ্যবর্তী দূরত্ব ৩ গুণ করা হলে আকর্ষণ বল কত গুণ হবে?\r\n(ক) ৩ গুণ (খ) ৯ গুণ (গ) ৯ ভাগের এক ভাগ (ঘ) ৩ ভাগের এক ভাগ\r\nউত্তর: গ\r\n<b> নিচের চিত্রের আলোকে (২৭ ও ২৮) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785480841504r7ywn","type":"image","value":"https://iili.io/CSchHdb.jpg"},{"id":"block_1785480887864j7p4y","type":"text","value":"২৭. উদ্দীপকের চিত্রে প্রদর্শিত আপেলটি মাটিতে পড়ার পেছনে কাজ করা আকর্ষণ বলকে কী বলে?\r\n(ক) তড়িৎ বল (খ) মহাকর্ষ বল \r\n(গ) নিউক্লীয় বল (ঘ) চুম্বক বল\r\nউত্তর: খ\r\n২৮. উদ্দীপকের ঘটনাটি পর্যবেক্ষণ করে বিজ্ঞানী নিউটন মহাবিশ্বের যেকোনো দুটি বস্তুর আকর্ষণ সম্পর্কে কোন সিদ্ধান্ত উপনীত হন?\r\n(ক) কেবল পৃথিবীই বস্তুকে আকর্ষণ করে \r\n(খ) মহাবিশ্বের প্রতিটি বস্তুকণা একে অপরকে আকর্ষণ করে \r\n(গ) কেবল ভারী বস্তু হালকা বস্তুকে আকর্ষণ করে \r\n(ঘ) মাধ্যমের উপস্থিতি ছাড়া আকর্ষণ সম্ভব নয়\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785480901537crm9n","type":"image","value":"https://iili.io/CScOpJn.jpg"},{"id":"block_1785480905524xm9w5","type":"text","value":"২৯. চিত্রে প্রদর্শিত বস্তুদ্বয়ের মধ্যকার আকর্ষণ বল $F$ এর সঠিক গাণিতিক সূত্র কোনটি?\r\n(ক) $F = G \\frac{m_1 m_2}{d}$\r\n(খ) $F = G \\frac{m_1 m_2}{d^2}$\r\n(g) $F = \\frac{m_1 m_2}{d^2}$\r\n(ঘ) $F = G \\frac{d^2}{m_1 m_2}$\r\nউত্তর: খ\r\n৩০. চিত্রে প্রদর্শিত $m_1$ ও $m_2$ ভরের বস্তু দুটির ভর স্থির রেখে মধ্যবর্তী দূরত্ব $d$ দ্বিগুণ করা হলে আকর্ষণ বলের কী পরিবর্তন ঘটবে?\r\n(ক) বল দ্বিগুণ হবে (খ) বল চারগুণ হবে \r\n(গ) বল এক-চতুর্থাংশ হবে (ঘ) বল অর্ধেক হবে\r\nউত্তর: গ\r\n<b> নিচের চিত্রের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785480919592ps8t8","type":"image","value":"https://iili.io/CSceemG.jpg"},{"id":"block_1785480923435b1kxd","type":"text","value":"৩১. চিত্রে বর্ণিত শর্ত অনুযায়ী $1\\text{ kg}$ ভরের দুটি বস্তু $1\\text{ m}$ দূরত্বে থাকলে তাদের পারস্পরিক আকর্ষণ বলের মান কার সমান হয়?\r\n(ক) $G$ এর সমান (খ) $g$ এর সমান \r\n(গ) শূন্যের সমান (ঘ) ভরের গুণফলের সমান\r\nউত্তর: ক\r\n৩২. উদ্দীপকে উল্লিখিত $G$ কে কী বলা হয়?\r\n(ক) অভিকর্ষজ ত্বরণ (খ) সর্বজনীন মহাকর্ষীয় ধ্রুবক \r\n(গ) মহাকর্ষীয় প্রাবল্য (ঘ) কেন্দ্রমুখী বল\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_178548094515704f99","type":"image","value":"https://iili.io/CScethx.jpg"},{"id":"block_17854809475117vc8n","type":"text","value":"৩৩. চিত্রে প্রদর্শিত বস্তু দুটির মধ্যবর্তী দূরত্ব তিনগুণ করা হলে তাদের মধ্যকার আকর্ষণ বল পূর্বের বলের কত গুণ হবে?\r\n(ক) তিনগুণ (খ) নয়গুণ \r\n(গ) তিন ভাগের এক ভাগ (ঘ) নয় ভাগের এক ভাগ\r\nউত্তর: ঘ\r\n৩৪. উদ্দীপকে বস্তুদ্বয়ের আকার বা মাধ্যমের কোনো পরিবর্তন করা হলে মহাকর্ষ বলের মান কেমন হবে?\r\n(ক) পরিবর্তিত হবে (খ) অপরিবর্তিত থাকবে \r\n(গ) শূন্য হয়ে যাবে (ঘ) দ্বিগুণ হবে\r\nউত্তর: খ"},{"id":"block_1785481015748gqwox","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩৫. গাছের ফল মাটিতে পড়ার ঘটনার কারণ হলো—\ni. পৃথিবী একে নিজের দিকে আকর্ষণ করে\nii. মহাবিশ্বের প্রতিটি বস্তুকণা পরস্পরকে আকর্ষণ করে\niii. বস্তুটির ওপর বায়ুর চাপ বেশি থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৬. মহাকর্ষ বল (Gravitational force) সম্পর্কিত সত্য উক্তি হলো—\ni. এ বিশ্বের যেকোনো দুটি বস্তুর মধ্যকার আকর্ষণ বলই মহাকর্ষ বল\nii. নিউটন গাছ থেকে আপেল মাটিতে পড়া দেখে এই চিন্তায় উপনীত হন\niii. এই বল কেবল ভারী বস্তুসমূহের ক্ষেত্রেই প্রযোজ্য, ক্ষুদ্র কণায় নয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৭. নিউটনের মহাকর্ষ সূত্রানুসারে—\ni. আকর্ষণ বলের মান বস্তুকণাদ্বয়ের ভরের গুণফলের সমানুপাতিক\nii. আকর্ষণ বলের মান বস্তুকণাদ্বয়ের দূরত্বের বর্গের ব্যস্তানুপাতিক\niii. এই বল বস্তুকণাদ্বয়ের সংযোজক সরলরেখা বরাবর ক্রিয়া করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৮. দুটি বস্তুকণার মধ্যকার আকর্ষণ বল কিসের ওপর নির্ভর করে?\ni. বস্তুকণাদ্বয়ের ভর ii. বস্তুকণাদ্বয়ের মধ্যকার দূরত্ব\niii. কণাগুলোর প্রকৃতি বা মাধ্যমের প্রকৃতি\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৯. সর্বজনীন মহাকর্ষীয় ধ্রুবক ($G$) সম্পর্কিত সঠিক তথ্য হলো—\ni. $1\\text{ kg}$ ভরের দুটি বস্তু $1\\text{ m}$ দূরত্বে স্থাপন করলে এরা পরস্পরকে যে বলে আকর্ষণ করে তা $G$ এর সমান\nii. এটি একটি সমানুপাতিক ধ্রুবক\niii. এর মান মাধ্যমের প্রকৃতির ওপর নির্ভর করে পরিবর্তিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪০. নির্দিষ্ট দূরত্বে অবস্থিত দুটি বস্তুকণার ক্ষেত্রে—\ni. ভরের গুণফল দ্বিগুণ হলে বল দ্বিগুণ হয়\nii. ভরের গুণফল তিনগুণ হলে বল তিনগুণ হয়\niii. ভর অপরিবর্তিত রেখে দূরত্ব দ্বিগুণ করলে বল এক-চতুর্থাংশ হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪১. নির্দিষ্ট ভরের দুটি বস্তুকণার মধ্যবর্তী দূরত্ব পরিবর্তন করলে—\ni. দূরত্ব দ্বিগুণ করলে বল চারগুণ বৃদ্ধি পায়\nii. দূরত্ব দ্বিগুণ করলে বল এক-চতুর্থাংশ হয়\niii. দূরত্ব তিনগুণ করলে বল নয় ভাগের এক ভাগ হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: গ"}]},{"id":"topic_1785481076937carg0","title":"পাঠ - (২-৩)","blocks":[{"id":"block_17854813338217ylf3","type":"text","value":"<span style=\"color:green;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. পৃথিবী এবং অন্য যেকোনো বস্তুর মধ্যে যে আকর্ষণ, তাকে কী বলে?\n(ক) মহাকর্ষ (খ) অভিকর্ষ (গ) তড়িৎ বল (ঘ) নিউক্লীয় বল\nউত্তর: খ\n২. দুটি বস্তুর একটি যদি পৃথিবী হয়, তবে পৃথিবী বস্তুটকে যে বলে আকর্ষণ করে তাকে কী বলে?\n(ক) মহাকর্ষ (খ) মাধ্যাকর্ষণ বা অভিকর্ষ \n(গ) স্বকর্ষ বল (ঘ) বিকর্ষণ বল\nউত্তর: খ\n৩. নিচের কোনটি অভিকর্ষের উদাহরণ?\n(ক) সূর্য ও পৃথিবীর মধ্যকার আকর্ষণ \n(খ) সূর্য ও চন্দ্রের মধ্যকার আকর্ষণ \n(গ) পৃথিবী এবং তোমার বিজ্ঞান বইয়ের মধ্যকার আকর্ষণ \n(ঘ) চন্দ্র ও মঙ্গল গ্রহের মধ্যকার আকর্ষণ\nউত্তর: গ\n৪. সূর্য ও চন্দ্রের মধ্যকার আকর্ষণকে কী বলা হয়?\n(ক) অভিকর্ষ (খ) মহাকর্ষ (গ) মাধ্যাকর্ষণ (ঘ) স্পর্শ বল\nউত্তর: খ\n৫. সময়ের সাথে কোনো বস্তুর বেগ বৃদ্ধির হারকে কী বলে?\n(ক) দ্রুতি (খ) সরণ (গ) ত্বরণ (ঘ) ভরবেগ\nউত্তর: গ\n৬. অভিকর্ষ বলের প্রভাবে মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ বৃদ্ধির হারকে কী বলে?\n(ক) মহাকর্ষীয় ত্বরণ (খ) অভিকর্ষজ ত্বরণ \n(গ) গড় বেগ (ঘ) সুষম দ্রুতি\nউত্তর: খ\n৭. অভিকর্ষজ ত্বরণকে কোন প্রতীক দ্বারা প্রকাশ করা হয়?\n(ক) $G$ (খ) $g$ (গ) $F$ (ঘ) $R$\nউত্তর: খ\n৮. অভিকর্ষজ ত্বরণের একক কোনটি?\n(ক) $\\text{মিটার/সেকেন্ড}$ (খ) $\\text{মিটার/সেকেন্ড}^2$ \n(গ) $\\text{নিউটন}$ (ঘ) $\\text{কিলোগ্রাম}$\nউত্তর: খ\n৯. পৃথিবীর ভর $M$, বস্তুর ভর $m$ এবং এদের মধ্যবর্তী দূরত্ব $d$ হলে, অভিকর্ষ বল $F$ এর সূত্র কোনটি?\n(ক) $F = G \\frac{M}{d^2}$ (খ) $F = G \\frac{Mm}{d^2}$\n(গ) $F = mg$ (ঘ) $F = \\frac{G}{Mm}$\nউত্তর: খ\n১০. বলের পরিমাপ থেকে পাই, অভিকর্ষ বল $F = ?$\n(ক) $\\text{ভর} \\times \\text{ত্বরণ}$ (বা $mg$) \n(খ) $\\text{ভর} \\div \\text{ত্বরণ}$ \n(গ) $\\text{ভর} + \\text{ত্বরণ}$ \n(ঘ) $\\text{ত্বরণ} \\div \\text{ভর}$\nউত্তর: ক\n১১. অভিকর্ষজ ত্বরণ $g$ নির্ণয়ের সঠিক সমীকরণ কোনটি?\n(ক) $g = \\frac{GM}{d^2}$ (খ) $g = \\frac{GMm}{d^2}$ \n(গ) $g = \\frac{Gd^2}{M}$ (ঘ) $g = \\frac{M}{d^2}$\nউত্তর: ক\n১২. অভিকর্ষজ ত্বরণ $g$ এর মান নিচের কোনটির ওপর নির্ভর করে না?\n(ক) পৃথিবীর ভর $M$ (খ) বস্তুর ভর $m$ \n(গ) কেন্দ্র হতে দূরত্ব $d$ (ঘ) মহাকর্ষীয় ধ্রুবক $G$\nউত্তর: খ\n১৩. $g$ এর মান বস্তু নিরপেক্ষ হলেও স্থান নিরপেক্ষ নয় কেন?\n(ক) পৃথিবীর ভর পরিবর্তনশীল বলে \n(খ) বস্তুর ভর স্থানভেদে পরিবর্তিত হয় বলে \n(গ) কেন্দ্র থেকে বিভিন্ন স্থানের দূরত্ব $d$ বিভিন্ন বলে \n(ঘ) $G$ এর মান স্থানভেদে বদলায় বলে\nউত্তর: গ\n১৪. পৃথিবীকে গোলাকার বিবেচনা করলে ভূপৃষ্ঠে $g$ এর সমীকরণ কোনটি হবে? (যেখানে $R =$ পৃথিবীর ব্যাসার্ধ)\n(ক) $g = \\frac{GM}{R}$ (খ) $g = \\frac{GM}{R^2}$ \n(গ) $g = \\frac{GR^2}{M}$ (ঘ) $g = \\frac{M}{R^2}$\nউত্তর: খ\n১৫. পৃথিবীর আকৃতি কেমন হওয়ায় কেন্দ্র থেকে দূরত্ব $R$ সর্বত্র সমান নয়?(ক) সম্পূর্ণ গোল (খ) মেরু অঞ্চলে কিছুটা চাপা \n(গ) বিষুব অঞ্চলে অত্যন্ত চাপা (ঘ) সম্পূর্ণ সমতল\nউত্তর: খ\n১৬. পৃথিবীর কোন অঞ্চলে কেন্দ্র থেকে দূরত্ব $R$ সবচেয়ে কম?\n(ক) বিষুব অঞ্চলে (খ) ক্রান্তীয় অঞ্চলে \n(গ) মেরু অঞ্চলে (ঘ) মধ্যরেখা অঞ্চলে\nউত্তর: গ\n১৭. মেরু অঞ্চলে $g$ এর মান কত?\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \n(খ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \n(ঘ) $৯.৮১ \\text{ মিটার/সেকেন্ড}^২$\nউত্তর: খ\n১৮. মেরু অঞ্চল থেকে বিষুব অঞ্চলের দিকে গেলে $g$ এর মান কেমন হতে থাকে?\n(ক) বাড়তে থাকে (খ) কমতে থাকে \n(গ) একই থাকে (ঘ) শূন্য হয়ে যায়\nউত্তর: খ\n১৯. বিষুব অঞ্চলে $g$ এর মান কত?\n(ক) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \n(খ) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \n(ঘ) $৯.৮২ \\text{ মিটার/সেকেন্ড}^২$\nউত্তর: খ\n২০. হিসাাবের সুবিধার জন্য ভূপৃষ্ঠে $g$ এর আদর্শ মান কত ধরা হয়?\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \n(খ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \n(ঘ) $৯.৮৫ \\text{ মিটার/সেকেন্ড}^২$\nউত্তর: গ\n২১. ভূপৃষ্ঠে $g$ এর মান $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ এর অর্থ হলো— মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ প্রতি সেকেন্ডে কত বৃদ্ধি পায়?\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}$ \n(খ) $৯.৮ \\text{ মিটার/সেকেন্ড}$ \n(গ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}$ \n(ঘ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$\nউত্তর: খ\n২২. বাতাসে বাধা না থাকলে একই উচ্চতা থেকে এক টুকরা পাথর ও এক টুকরা কাগজ ছেড়ে দিলে কী ঘটবে?\n(ক) পাথরটি আগে মাটিতে পৌঁছাবে \n(খ) কাগজটি আগে মাটিতে পৌঁছাবে \n(গ) দুটিই একই সময়ে মাটিতে পৌঁছাবে \n(ঘ) কোনোটিই মাটিতে পৌঁছাবে না\nউত্তর: গ\n২৩. বাস্তবে পাথরটি কাগজের আগে মাটিতে পৌঁছানোর কারণ কী?\n(ক) পাথরের ওপর অভিকর্ষজ ত্বরণ বেশি \n(খ) বাতাসের বাধার ভিন্নতার কারণে \n(গ) কাগজের ভর বেশি \n(ঘ) পৃথিবীর আকৃতির কারণে\nউত্তর: খ"},{"id":"block_1785481335939a0u32","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\r\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<b> নিচের তথ্যের আলোকে (২৪ ও ২৫) নং প্রশ্নের উত্তর দাও:   </b>\r\nরিসাদ ও তার ছোট বোন ছাদে দাঁড়িয়ে একটি ক্রিকেট বল ও একটি রবারের বল একসাথে নিচের দিকে ছেড়ে দিল। রিসাদ লক্ষ করল, দুটি বলের ভর ভিন্ন হওয়া সত্ত্বেও অভিকর্ষ বলের প্রভাবে নির্দিষ্ট সময়ে তারা মাটিতে গিয়ে পৌঁছাল।\r\n২৪. পৃথিবী এবং অন্য যেকোনো বস্তুর মধ্যকার এই আকর্ষণ বলকে কী বলা হয়?\r\n(ক) মহাকর্ষ (খ) অভিকর্ষ বা মাধ্যাকর্ষণ \r\n(গ) চৌম্বক বল (ঘ) তড়িৎ বল\r\nউত্তর: খ\r\n২৫. মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ বৃদ্ধির হারকে কী বলে?\r\n(ক) দ্রুতি (খ) সরণ (গ) অভিকর্ষজ ত্বরণ (ঘ) মন্দন\r\nউত্তর: গ\r\n<b> নিচের তথ্যের আলোকে (২৬ ও ২৭) নং প্রশ্নের উত্তর দাও:   </b>\r\nবিজ্ঞান ক্লাসে শিক্ষক বোর্ডে একটি সমীকরণ লিখলেন: $g = \\frac{GM}{d^2}$। শিক্ষক শিক্ষার্থীদের বললেন, পৃথিবীর কেন্দ্র থেকে বস্তুর দূরত্বের তারতম্যের কারণে পৃথিবীর বিভিন্ন স্থানে এই মানের পরিবর্তন ঘটে।\r\n২৬. সমীকরণে ব্যবহৃত $g$ এর একক নিচের কোনটি?\r\n(ক) মিটার/সেকেন্ড (খ) মিটার/সেকেন্ড$^2$ \r\n(গ) নিউটন (ঘ) কিলোগ্রাম\r\nউত্তর: খ\r\n২৭. সমীকরণটি বিশ্লেষণ করলে দেখা যায়, $g$ এর মান নিচের কোনটির ওপর নির্ভর করে না?\r\n(ক) পৃথিবীর ভর $M$ (খ) বস্তুর ভর $m$ \r\n(গ) কেন্দ্র থেকে দূরত্ব $d$ (ঘ) মহাকর্ষীয় ধ্রুবক $G$\r\nউত্তর: খ\r\n<b> নিচের তথ্যের আলোকে (২৮ ও ২৯) নং প্রশ্নের উত্তর দাও:   </b>\r\nরাহুল একটি ভারী পাথর ও একটি হালকা কাগজ একই উচ্চতা থেকে একসাথে ছেড়ে দিল। সে দেখল পাথরটি কাগজের আগেই মাটিতে পৌঁছে গেছে। তার শিক্ষক বললেন, উভয়ের ওপর অভিকর্ষজ ত্বরণ সমান হওয়া সত্ত্বেও অন্য একটি বাহ্যিক বাধার পার্থক্যের কারণে এমনটি ঘটেছে।\r\n২৮. শিক্ষক যে বাহ্যিক বাধার কথা বলেছেন তা হলো—\r\n(ক) চুম্বকের বাধা (খ) বাতাসের বাধা \r\n(গ) মাটির আকর্ষণ (ঘ) ঘর্ষণ বল\r\nউত্তর: খ\r\n২৯. যদি ওই বাহ্যিক বাধা না থাকত, তবে পাথর ও কাগজের ক্ষেত্রে কী ঘটেত?\r\n(ক) পাথর আগে মাটিতে পৌঁছাত \r\n(খ) কাগজ আগে মাটিতে পৌঁছাত \r\n(গ) উভয়ই একই সময়ে মাটিতে পৌঁছাত \r\n(ঘ) কোনোটিই নিচে নামত না\r\nউত্তর: গ\r\n<b> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও:   </b>\r\nপৃথিবীর আকৃতির ভিন্নতার কারণে মেরু অঞ্চলে অভিকর্ষজ ত্বরণ $g$ এর মান সবচেয়ে বেশি ($৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$) এবং বিষুব অঞ্চলে এর মান সবচেয়ে কম ($৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$) পাওয়া যায়। তবে হিসাবের সুবিধার জন্য ভূপৃষ্ঠে এর একটি আদর্শ মান ধরে নেওয়া হয়।\r\n৩০. হিসাবের সুবিধার জন্য ভূপৃষ্ঠে $g$ এর আদর্শ মান কত ধরা হয়?\r\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \r\n(খ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \r\n(গ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \r\n(ঘ) $৯.৮১ \\text{ মিটার/সেকেন্ড}^২$\r\nউত্তর: খ\r\n৩১. ভূপৃষ্ঠে $g$ এর মান $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ হওয়ার অর্থ কী?\r\n(ক) বস্তুর ভর প্রতি সেকেন্ডে $৯.৮$ কেজি বৃদ্ধি পায় \r\n(খ) মুক্তভাবে পড়ন্ত বস্তুর বেগ প্রতি সেকেন্ডে $৯.৮ \\text{ মিটার/সেকেন্ড}$ বৃদ্ধি পায় \r\n(গ) বস্তুর ওজন শূন্য হয় \r\n(ঘ) বস্তুর ত্বরণ সর্বদা শূন্য থাকে\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785481494050dy6qv","type":"image","value":"https://iili.io/CSckCEN.jpg"},{"id":"block_1785481498944hykps","type":"text","value":"৩২. চিত্রে পৃথিবীর কেন্দ্র থেকে 'P' স্থানের দূরত্ব কম হওয়ায় সেখানে $g$ এর মান কত?\r\n(ক) $৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$ \r\n(খ) $৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$ \r\n(গ) $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ \r\n(ঘ) $৯.৮১ \\text{ মিটার/সেকেন্ড}^২$\r\nউত্তর: খ\r\n৩৩. চিত্রে 'P' স্থান থেকে 'E' স্থানের দিকে যেতে থাকলে অভিকর্ষজ ত্বরণ $g$ এর মানের কেমন পরিবর্তন ঘটবে?\r\n(ক) বাড়তে থাকবে (খ) কমতে থাকবে \r\n(গ) একই থাকবে (ঘ) শূন্য হয়ে যাবে\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17854815041976coqb","type":"image","value":"https://iili.io/CSckQat.jpg"},{"id":"block_1785481508342hhnkt","type":"text","value":"৩৪. উদ্দীপকের চিত্রে প্রদর্শিত অবস্থায় পাথর ও পালক বা কাগজ একই সময়ে নিচে পড়ার কারণ কী?\r\n(ক) অভিকর্ষজ ত্বরণ বস্তুর ভরের ওপর নির্ভর করে না \r\n(খ) দুটির ভর সমান \r\n(গ) বস্তুর ওজন শূন্য (ঘ) পাথরটিতে অভিকর্ষ বল নেই\r\nউত্তর: ক\r\n৩৫. যদি চিত্রটির চারপাশে স্বাভাবিক বাতাসের উপস্থিতি থাকত, তবে বাস্তবে কী ঘটত?\r\n(ক) পালক বা কাগজটি আগে মাটিতে পৌঁছাত \r\n(খ) পাথরটি আগে মাটিতে পৌঁছাত \r\n(গ) দুটিই একই সাথে পৌঁছাত \r\n(ঘ) পালকটি ওপরে উঠে যেত\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17854815121853u7s3","type":"image","value":"https://iili.io/CScvlov.jpg"},{"id":"block_1785481515865urjro","type":"text","value":"৩৬. চিত্রে প্রদর্শিত তথ্য অনুসারে অভিকর্ষজ ত্বরণ $g$ এর সঠিক গাণিতিক প্রকাশ কোনটি?\r\n(ক) $g = \\frac{GM}{d^2}$\r\n(খ) $g = \\frac{GMm}{d^2}$\r\n(গ) $g = \\frac{Gd^2}{M}$\r\n(ঘ) $g = \\frac{M}{d^2}$\r\nউত্তর: ক\r\n৩৭. উদ্দীপকের $m$ ভরের বস্তুটিকে পৃথিবীর কেন্দ্র থেকে দ্বিগুণ দূরত্বে নিয়ে গেলে $g$ এর মান কতগুণ হবে?\r\n(ক) দ্বিগুণ (খ) চারগুণ (গ) এক-চতুর্থাংশ (ঘ) অর্ধেক\r\nউত্তর: গ\r\n<b> নিচের চিত্রের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17854817038908t71n","type":"image","value":"https://iili.io/CSc8IzG.jpg"},{"id":"block_1785571300336pthdo","type":"text","value":"৩৮. চিত্রে নির্দেশিত 'B' আকর্ষণ বলটিকে পদার্থবিজ্ঞানের ভাষায় কী বলে?\n(ক) মহাকর্ষ (খ) অভিকর্ষ (গ) চুম্বক বল (ঘ) তড়িৎ বল\nউত্তর: খ\n৩৯. উদ্দীপকের চিত্রানুসারে 'A' ও 'B' বলের ক্ষেত্রে সঠিক তথ্য কোনটি?\n(ক) 'A' ও 'B' উভয়ই অভিকর্ষ \n(খ) 'A' ও 'B' উভয়ই মহাকর্ষ, তবে 'B' একই সাথে অভিকর্ষ \n(গ) 'A' কেবল অভিকর্ষ এবং 'B' কেবল মহাকর্ষ \n(ঘ) এদের কোনোটিই মহাকর্ষ নয়\nউত্তর: খ"},{"id":"block_17854817198734uyxk","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৪০. অভিকর্ষ (Gravity) সম্পর্কে সঠিক তথ্য হলো—\ni. পৃথিবী এবং অন্য যেকোনো বস্তুর মধ্যে যে আকর্ষণ তাকে অভিকর্ষ বলে\nii. সূর্য ও চন্দ্রের মধ্যকার আকর্ষণকে অভিকর্ষ বলা হয়\niii. গাছের ফল মাটিতে পড়া বা ক্রিকেট বল নিচে পড়া অভিকর্ষের উদাহরণ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n৪১. অভিকর্ষজ ত্বরণ ($g$) সম্পর্কে সঠিক উক্তি হলো—\ni. অভিকর্ষ বলের প্রভাবে মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ বৃদ্ধির হারকে অভিকর্ষজ ত্বরণ বলে\nii. এর একক হলো $\\text{মিটার/সেকেন্ড}^২$\niii. এর মান বস্তুর ভর $m$ এর ওপর সরাসরি নির্ভর করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪২. অভিকর্ষজ ত্বরণের সমীকরণ $g = \\frac{GM}{d^2}$ বিশ্লেষণ করলে দেখা যায়—\ni. $g$ এর মান বস্তু নিরপেক্ষ হলেও স্থান নিরপেক্ষ নয়\nii. পৃথিবীর কেন্দ্র থেকে বিভিন্ন স্থানে দূরত্ব $d$ বিভিন্ন হওয়ার কারণে $g$ এর মান পরিবর্তিত হয়\niii. বস্তুর ভর বেশি হলে $g$ এর মান বৃদ্ধি পায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৩. পৃথিবীর আকৃতি ও অভিকর্ষজ ত্বরণের মান সম্পর্কিত সত্য তথ্য হলো—\ni. মেরু অঞ্চলে পৃথিবীর কেন্দ্র থেকে দূরত্ব সবচেয়ে কম হওয়ায় সেখানে $g$ এর মান সবচেয়ে বেশি ($৯.৮৩ \\text{ মিটার/সেকেন্ড}^২$)\nii. বিষুব অঞ্চলে কেন্দ্র থেকে দূরত্ব সবচেয়ে বেশি হওয়ায় সেখানে $g$ এর মান সবচেয়ে কম ($৯.৭৮ \\text{ মিটার/সেকেন্ড}^২$)\niii. হিসাবের সুবিধার জন্য ভূপৃষ্ঠে $g$ এর আদর্শ মান $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ ধরা হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৪. ভূপৃষ্ঠে $g = ৯.৮ \\text{ মিটার/সেকেন্ড}^২$ বলতে বোঝায়—\ni. মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ প্রতি সেকেন্ডে $৯.৮ \\text{ মিটার/সেকেন্ড}$ বৃদ্ধি পায়\nii. মুক্তভাবে পড়ন্ত কোনো বস্তুর ভর প্রতি সেকেন্ডে $৯.৮ \\text{ কেজি}$ বৃদ্ধি পায়\niii. বস্তুটির ত্বরণ প্রতি সেকেন্ডে $৯.৮ \\text{ মিটার/সেকেন্ড}^২$ হারে বল প্রয়োগ করে\nনিচের কোনটি সঠিক?\n(ক) i (খ) ii (গ) i ও iii (ঘ) ii ও iii\nউত্তর: ক\n৪৫. একই উচ্চতা থেকে পাথর ও কাগজ একসাথে ছেড়ে দিলে—\ni. বাতাসের বাধা না থাকলে দুটি একই সময়ে মাটিতে পৌঁছাত\nii. অভিকর্ষজ ত্বরণ ভরের ওপর নির্ভর না করায় উভয়ের ওপর সক্রিয় $g$ এর মান একই\niii. বাস্তবে বাতাসের বাধার পার্থক্যের কারণে পাথরটি আগে মাটিতে পৌঁছায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"}]},{"id":"topic_17854810844460vcr2","title":"পাঠ - (৪)","blocks":[{"id":"block_1785571390971dt6q1","type":"text","value":"<span style=\"color:navy;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. কোনো বস্তুতে পদার্থের পরিমাণকে কী বলে?\n(ক) ওজন (খ) ভর (গ) আয়তন (ঘ) ঘনত্ব\nউত্তর: খ\n২. বস্তুর ভরের আন্তর্জাতিক একক (SI) কোনটি?\n(ক) গ্রাম (খ) টন \n(গ) কিলোগ্রাম বা কেজি ($\\text{kg}$) (ঘ) নিউটন\nউত্তর: গ\n৩. ১ টন সমান কত কিলোগ্রাম?\n(ক) ১০০ কিলোগ্রাম (খ) ৫০০ কিলোগ্রাম \n(গ) ১০০০ কিলোগ্রাম (ঘ) ১০,০০০ কিলোগ্রাম\nউত্তর: গ\n৪. ১ কেজি বা কিলোগ্রাম সমান কত গ্রাম?\n(ক) ১০০ গ্রাম (খ) ১০০০ গ্রাম \n(গ) ৫০০ গ্রাম (ঘ) ১০,০০০ গ্রাম\nউত্তর: খ\n৫. ক্ষুদ্র ভর মাপার জন্য নিচের কোন এককটি ব্যবহার করা হয়?\n(ক) টন (খ) কেজি (গ) গ্রাম ($\\text{g}$) (ঘ) নিউটন\nউত্তর: গ\n৬. বস্তুর ভর কিসের ওপর নির্ভর করে?\n(ক) বস্তুর অবস্থানের ওপর \n(খ) যে পরমাণু ও অণু দিয়ে বস্তুটি গঠিত তার সংখ্যা ও কাঠামোর ওপর \n(গ) ভূপৃষ্ঠের অভিকর্ষজ ত্বরণের ওপর \n(ঘ) বস্তুর ওজনের ওপর\nউত্তর: খ\n৭. কোনটির কারণে বস্তুর ভর পরিবর্তন হয় না?\n(ক) বস্তুর অবস্থান, আকৃতি ও গতি পরিবর্তন \n(খ) বস্তুর উষ্ণতা পরিবর্তন \n(গ) পদার্থের পরিমাণ পরিবর্তন \n(ঘ) পরমাণুর সংখ্যা পরিবর্তন\nউত্তর: ক\n৮. কোনো বস্তুকে পৃথিবী যে বল দ্বারা আকর্ষণ করে, তাকে ওই বস্তুর কী বলে?\n(ক) ভর (খ) ঘনত্ব (গ) ওজন (ঘ) ত্বরণ\nউত্তর: গ\n৯. কোনো বস্তুর ভর $m$ এবং কোনো স্থানে অভিকর্ষজ ত্বরণ $g$ হলে, ওই স্থানে বস্তুর ওজন $W$ এর গাণিতিক সূত্র কোনটি?\n(ক) $W = \\frac{m}{g}$ (খ) $W = mg$\n(গ) $W = m + g$ (ঘ) $W = \\frac{g}{m}$\nউত্তর: খ\n১০. ওজনের একক কোনটি?\n(ক) কিলোগ্রাম (খ) গ্রাম \n(গ) নিউটন (ঘ) মিটার/সেকেন্ড$^2$\nউত্তর: গ\n১১. ওজনের একক মূলত কিসের একক?\n(ক) ভরের একক (খ) বলের একক \n(গ) ত্বরণের একক (ঘ) কাজের একক\nউত্তর: খ\n১২. পৃথিবী পৃষ্ঠে $১০ \\text{ কেজি}$ ভরের বস্তুর ওজন কত হবে?\n(ক) $১০ \\text{ নিউটন}$ (খ) $৯৮ \\text{ নিউটন}$ \n(গ) $৯.৮ \\text{ নিউটন}$ (ঘ) $১০০ \\text{ নিউটন}$\nউত্তর: খ\n১৩. কিসের সাহায্যে কোনো বস্তুর ওজন পরিমাপ করা যায়?\n(ক) সাধারণ দাঁড়িপাল্লা (খ) স্প্রিং নিক্তি \n(গ) থার্মোমিটার (ঘ) স্কেল\nউত্তর: খ\n১৪. দৈনন্দিন জীবনে আমরা কোনো বস্তুর ভরকে ভুলবশত কী বলে থাকি?\n(ক) আয়তন (খ) ওজন (গ) ঘনত্ব (ঘ) বল\nউত্তর: খ\n১৫. আমরা যখন ৫০ কেজি চালের বস্তা কিনি, তখন আমরা আসলে ওই চালের কী বুঝি?\n(ক) চালের ওজন ৫০ কেজি (খ) চালের ভর ৫০ কেজি \n(গ) চালের ঘনত্ব ৫০ কেজি (ঘ) চালের আয়তন ৫০ কেজি\nউত্তর: খ"},{"id":"block_1785571461892524om","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:navy;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (১৬ ও ১৭) নং প্রশ্নের উত্তর দাও:   </b>\nতানভীর বাজার থেকে $৫০\\text{ kg}$ ভরের চালের বস্তা কিনে আনল। দোকানদার তাকে বলল চালের ওজন $৫০\\text{ kg}$। কিন্তু তানভীরের বিজ্ঞান শিক্ষক বললেন, দৈনন্দিন জীবনে আমরা ভুলবশত ভরকে ওজন বলি, প্রকৃতপক্ষে পদার্থবিজ্ঞানের ভাষায় ভর ও ওজন দুটি ভিন্ন রাশি।\n১৬. কোনো বস্তুতে পদার্থের মোট পরিমাণকে কী বলে?\n(ক) ওজন (খ) ভর (গ) আয়তন (ঘ) ঘনত্ব\nউত্তর: খ\n১৭. উদ্দীপকে উল্লিখিত চালের বস্তাটির পৃথিবী পৃষ্ঠে প্রকৃত ওজন কত হবে?\n(ক) $৫০\\text{ নিউটন}$ (খ) $৪৯০\\text{ নিউটন}$ \n(গ) $৯.৮\\text{ নিউটন}$ (ঘ) $৫০\\text{ কেজি}$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (১৮ ও ১৯) নং প্রশ্নের উত্তর দাও:   </b>\nবিজ্ঞানাগারে ল্যাব সহকারী একটি স্প্রিং নিক্তির সাহায্যে ২০ কেজি ভরের একটি বস্তুর ওজন মেপে দেখলেন $১৯৬\\text{ নিউটন}$। তিনি শিক্ষার্থীদের বললেন, বস্তুর ভর পৃথিবীর যেকোনো স্থানে স্থির থাকলেও অভিকর্ষজ ত্বরণের কারণে ওজন পরিবর্তিত হতে পারে।\n১৮. কোনো বস্তুর ওজন পরিমাপের জন্য নিচের কোনটি ব্যবহার করা হয়?\n(ক) সাধারণ দাঁড়িপাল্লা (খ) স্প্রিং নিক্তি \n(গ) থার্মোমিটার (ঘ) মেজারিং টেপ\nউত্তর: খ\n১৯. উদ্দীপকে বর্ণিত বস্তুর ওজন $১৯৬\\text{ নিউটন}$ হওয়ার কারণ এর ওপর ক্রিয়াশীল—\n(ক) মহাকর্ষীয় ধ্রুবক $G$ (খ) অভিকর্ষ বল \n(গ) বাতাসের চাপ (ঘ) চৌম্বক শক্তি\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২০ ও ২১) নং প্রশ্নের উত্তর দাও:   </b>\nস্বর্ণকার ল্যাবে খুব ক্ষুদ্র ভরের রাসায়নিক উপাদান মেপে কাজ করছিলেন। অন্যদিকে, একজন পাইকারি ব্যবসায়ী ট্রাকে করে বিশাল পরিমাণ চাল মেপে গুদামে পাঠাচ্ছিলেন। দুজনের ব্যবহৃত ভরের একক ছিল ভিন্ন।\n২০. অতি ক্ষুদ্র ভর মেপে প্রকাশের জন্য কোন এককটি ব্যবহার করা হয়?\n(ক) কিলোগ্রাম (খ) গ্রাম ($\\text{g}$) (গ) টন (ঘ) নিউটন\nউত্তর: খ\n২১. উদ্দীপকের ব্যবসায়ী যদি ১ ট্রাক চালের ভর $৫\\text{ টন}$ মেপে থাকেন, তবে কিলোগ্রামে তা কত হবে?\n(ক) $৫০০\\text{ কিলোগ্রাম}$ (খ) $৫০০০\\text{ কিলোগ্রাম}$ \n(গ) $৫০,০০০\\text{ কিলোগ্রাম}$ (ঘ) $৫০\\text{ কিলোগ্রাম}$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২২ ও ২৩) নং প্রশ্নের উত্তর দাও:   </b>\nপদার্থবিজ্ঞানের ক্লাসে স্যার বললেন, কোনো বস্তুর অবস্থান, আকৃতি বা গতি পরিবর্তন করলেও এর ভরের কোনো পরিবর্তন ঘটে না। কারণ ভর কেবল ওই বস্তুটি যে পরমাণু ও অণু দ্বারা গঠিত তার সংখ্যা ও কাঠামোর ওপর নির্ভর করে।\n২২. আন্তর্জাতিক নিয়মে (SI) ভরের একক কোনটি?\n(ক) গ্রাম (খ) কিলোগ্রাম বা কেজি ($\\text{kg}$) (গ) টন (ঘ) নিউটন\nউত্তর: খ\n২৩. উদ্দীপকে বর্ণিত $m$ ভরের কোনো বস্তু $g$ অভিকর্ষজ ত্বরণবিশিষ্ট স্থানে থাকলে তার ওজন $W$ এর সঠিক গাণিতিক প্রকাশ কোনটি?\n(ক) $W = \\frac{m}{g}$ (খ) $W = mg$\n(গ) $W = m + g$ (ঘ) $W = \\frac{g}{m}$\nউত্তর: খ\n<b> নিচের চিত্রের আলোকে (২৪ ও ২৫) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785571479210miwmi","type":"image","value":"https://iili.io/CSc8emg.jpg"},{"id":"block_17855715174438oa37","type":"text","value":"২৪. চিত্রে প্রদর্শিত যন্ত্রটির নাম কী এবং এর সাহায্যে কী পরিমাপ করা হচ্ছে?\r\n(ক) সাধারণ দাঁড়িপাল্লা, ভর (খ) স্প্রিং নিক্তি, ওজন \r\n(গ) স্কেল, দৈর্ঘ্য (ঘ) থার্মোমিটার, তাপমাত্রা\r\nউত্তর: খ\r\n২৫. উদ্দীপকে ঝুলানো বস্তুটির ভর কত কেজি ছিল?\r\n(ক) $১০\\text{ কেজি}$ (খ) $৯.৮\\text{ কেজি}$ \r\n(গ) $১০০\\text{ কেজি}$ (ঘ) $১\\text{ কেজি}$\r\nউত্তর: ক\r\n<b> নিচের চিত্রের আলোকে (২৬ ও ২৭) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785571542120di060","type":"image","value":"https://iili.io/CScSEvt.jpg"},{"id":"block_1785571547092979g8","type":"text","value":"২৬. উদ্দীপকের বস্তার গায়ে লেখা '$৫০\\text{ kg}$' দ্বারা পদার্থবিজ্ঞানের ভাষায় চালের কোন রাশিকে বোঝায়?\r\n(ক) ওজন (খ) ভর (গ) চাপ (ঘ) ত্বরণ\r\nউত্তর: খ\r\n২৭. উদ্দীপকে বর্ণিত ৫০ কেজি চালের বস্তাটির ওপর পৃথিবীর আকর্ষণ বল বা ওজন কত নিউটন হবে?\r\n(ক) $৫০\\text{ নিউটন}$ (খ) $৪৯০\\text{ নিউটন}$ \r\n(গ) $৯.৮\\text{ নিউটন}$ (ঘ) $৫০০\\text{ নিউটন}$\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (২৮ ও ২৯) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785571569858r3vtu","type":"image","value":"https://iili.io/CScSpta.jpg"},{"id":"block_17855715768082rq4v","type":"text","value":"২৮. উদ্দীপকের রাসায়নিক পদার্থের পাত্রে ব্যবহৃত ক্ষুদ্র এককটির সাথে কেজির (কিলোগ্রাম) সঠিক সম্পর্ক কোনটি?\r\n(ক) $১\\text{ কেজি} = ১০০০\\text{ গ্রাম}$ (খ) $১\\text{ গ্রাম} = ১০০০\\text{ কেজি}$ \r\n(গ) $১\\text{ কেজি} = ১০০\\text{ গ্রাম}$ (ঘ) $১\\text{ গ্রাম} = ১০০\\text{ কেজি}$\r\nউত্তর: ক\r\n২৯. উদ্দীপকের ট্রাকে থাকা ১ টন কয়লার ভরকে কিলোগ্রামে প্রকাশ করলে তা কত হবে?\r\n(ক) $১০০\\text{ কেজি}$ (খ) $১০০০\\text{ কেজি}$ \r\n(গ) $১০,০০০\\text{ কেজি}$ (ঘ) $৫০\\text{ কেজি}$\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785571611666uyj7k","type":"image","value":"https://iili.io/CScUSlp.jpg"},{"id":"block_1785571615574y5mx1","type":"text","value":"৩০. উদ্দীপকের চিত্রে প্রদর্শিত বস্তুটির ওজন $W$ নির্ণয়ের সঠিক সমীকরণ কোনটি?\r\n(ক) $W = \\frac{m}{g}$ (খ) $W = mg$\r\n(গ) $W = m + g$ (ঘ) $W = \\frac{g}{m}$\r\nউত্তর: খ\r\n৩১. উদ্দীপকের চিত্রানুযায়ী বস্তুটির ভর $m$ অপরিবর্তিত রেখে যদি অন্য কোনো স্থানে নেওয়া হয়, তবে নিচের কোন তথ্যটি সত্য?\r\n(ক) ভর ও ওজন দুটোই বদলে যাবে \r\n(খ) ভর অপরিবর্তিত থাকবে তবে ওজনের পরিবর্তন হতে পারে \r\n(গ) ভর বদলে যাবে কিন্তু ওজন অপরিবর্তিত থাকবে \r\n(ঘ) ভর ও ওজন কোনটিই পরিবর্তন হবে না\r\nউত্তর: খ"},{"id":"block_17855716453526hsoc","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:navy;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩২. বস্তুর ভর (Mass) সম্পর্কে সঠিক তথ্য হলো—\ni. কোনো বস্তুতে পদার্থের মোট পরিমাণকে ভর বলে\nii. বস্তুর অবস্থান, আকৃতি বা গতি পরিবর্তনের কারণে ভরের কোনো পরিবর্তন হয় না\niii. আন্তর্জাতিক পদ্ধতিতে ভরের একক কিলোগ্রাম (kg)\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৩. ভর পরিমাপের এককসমূহ সম্পর্কিত সঠিক তথ্য কোনটি?\ni. ১ টন = ১০০ কিলোগ্রাম ii. ১ কেজি = ১০০০০ গ্রাম\niii. অতি ক্ষুদ্র ভরকে গ্রামে (g) প্রকাশ করা হয়\nনিচের কোনটি সঠিক?\n(ক) iii (খ) i ও ii (গ) i ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৪. বস্তুর ওজন (Weight) সম্পর্কে সঠিক উক্তি হলো—\ni. কোনো বস্তুকে পৃথিবী যে বল দ্বারা নিজের দিকে আকর্ষণ করে তাকে ওই বস্তুর ওজন বলে\nii. ওজনের একক হলো বলের একক অর্থাৎ নিউটন\niii. স্প্রিং নিক্তির সাহায্যে কোনো বস্তুর ওজন পরিমাপ করা যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৫. ভর ও ওজনের মধ্যকার সম্পর্ক ও পার্থক্য বিবেচনা করলে—\ni. বস্তুর ভর $m$ এবং অভিকর্ষজ ত্বরণ $g$ হলে ওজন $W = mg$\nii. পৃথিবী পৃষ্ঠে ১০ কেজি ভরের বস্তুর ওজন ৯৮ নিউটন\niii. দৈনন্দিন জীবনে আমরা ভুলবশত ভরের পরিমাপকেই ওজন বলে থাকি\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"}]},{"id":"topic_17854810895091uzcd","title":"পাঠ - (৫)","blocks":[{"id":"block_1785647584454bsyxk","type":"text","value":"<span style=\"color:indigo;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. বস্তুর মধ্যে পদার্থের পরিমাপকে কী বলে?\n(ক) ওজন (খ) ভর (গ) আয়তন (ঘ) ঘনত্ব\nউত্তর: খ\n২. নিচের কোনটি ধ্রুব রাশি?\n(ক) ওজন (খ) অভিকর্ষজ ত্বরণ (গ) ভর (ঘ) অভিকর্ষ বল\nউত্তর: গ\n৩. ৭৫ কেজি ভরের একজন মহাশূন্যচারীর ভর চাঁদে বা পৃথিবীর কক্ষপথে কত কেজি হবে?\n(ক) ৭৫ কেজি (খ) ১২.৫ কেজি (গ) ০ কেজি (ঘ) ৭৩৫ নিউটন\nউত্তর: ক\n৪. স্থান পরিবর্তনের ফলে মহাশূন্যচারী বা বস্তুর কিসের কোনো পরিবর্তন হয় না?\n(ক) ওজনের (খ) পদার্থের পরিমাণের \n(গ) অভিকর্ষজ ত্বরণের (ঘ) আকর্ষণের\nউত্তর: খ\n৫. বস্তুর ওজন কিসের ওপর নির্ভর করে?\n(ক) কেবল ভরের ওপর (খ) অভিকর্ষজ ত্বরণ $g$ এর ওপর \n(গ) বাহ্যিক তাপমাত্রার ওপর (ঘ) বাতাসের চাপের ওপর\nউত্তর: খ\n৬. ভূপৃষ্ঠ থেকে যত ওপরে ওঠা যায়, বস্তুর ওজন কেমন হতে থাকে?\n(ক) বাড়তে থাকে (খ) কমতে থাকে \n(গ) একই থাকে (ঘ) শূন্য হয়ে যায়\nউত্তর: খ\n৭. কোনটি বস্তুর মৌলিক ধর্ম নয়?\n(ক) ভর (খ) ওজন (গ) পদার্থের পরিমাণ (ঘ) অণুর সংখ্যা\nউত্তর: খ\n৮. পৃথিবীর কেন্দ্রে অভিকর্ষজ ত্বরণ শূন্য বলে সেখানে বস্তুর ওজন কত?\n(ক) ৯.৮ নিউটন (খ) ১.৬৩ নিউটন \n(গ) শূন্য (ঘ) ৯.৮৩ নিউটন\nউত্তর: গ\n৯. মহাশূন্যে কোনো বস্তুর ওজন শূন্য হলে তখন বস্তুর ওপর কোনটি কাজ করে না?\n(ক) ভর (খ) কোনো মহাকর্ষ বল \n(গ) পদার্থের গঠন (ঘ) বস্তুর মৌলিক ধর্ম\nউত্তর: খ\n১০. চাঁদের অভিকর্ষজনিত ত্বরণের মান পৃথিবীতে অভিকর্ষজ ত্বরণের মান অপেক্ষা কত ভাগ?\n(ক) প্রায় $\\frac{১}{২}$ ভাগ (খ) প্রায় $\\frac{১}{৪}$ ভাগ \n(গ) প্রায় $\\frac{১}{৬}$ ভাগ (ঘ) প্রায় $\\frac{১}{৮}$ ভাগ\nউত্তর: গ\n১১. চাঁদে ১ কেজি ভরের বস্তুর ওজন হবে প্রায় কত?\n(ক) ৯.৮ নিউটন (খ) $\\frac{৯.৮}{৬}$ নিউটন \n(গ) ১.৭৯ নিউটন (ঘ) ৯.৮৩ নিউটন\nউত্তর: খ\n১২. $\\frac{৯.৮}{৬}$ নিউটন বলতে প্রায় কত নিউটনকে বোঝায়?\n(ক) ১.৬৩ নিউটন (খ) ১.৭৯ নিউটন \n(গ) ৯.৭৮ নিউটন (ঘ) ১.৮৩ নিউটন\nউত্তর: ক\n১৩. কোনো বস্তুর ওজন পৃথিবীর কেন্দ্র থেকে কিসের ওপর নির্ভর করে?\n(ক) বস্তুর আকৃতির ওপর (খ) তার দূরত্বের ওপর \n(গ) এর তাপমাত্রার ওপর (ঘ) এর আয়তনের ওপর\nউত্তর: খ\n১৪. পৃথিবীর কেন্দ্র থেকে দূরত্ব বাড়ানো হলে বস্তুর ওপর পৃথিবীর আকর্ষণ কেমন হয়?\n(ক) বৃদ্ধি পায় (খ) কমে যায় \n(গ) অপরিবর্তিত থাকে (ঘ) দ্বিগুণ হয়\nউত্তর: খ\n১৫. ভূপৃষ্ঠে ১ কেজি ভরের কোনো বস্তুর ওজন কত নিউটন?\n(ক) ১.৬৩ নিউটন (খ) ১.৭৯ নিউটন \n(গ) ৯.৮ নিউটন (ঘ) ৯.৮৩ নিউটন\nউত্তর: গ\n১৬. পৃথিবী সুষম গোলক না হওয়ার কারণে ভূপৃষ্ঠে কিসের তারতম্য ঘটে?\n(ক) ভরের (খ) ওজনের অতি সামান্য \n(গ) মোট পদার্থের (ঘ) বস্তুর অণুর সংখ্যার\nউত্তর: খ\n১৭. ভূপৃষ্ঠের অতি সামান্য ওজনের পার্থক্য পরিমাপ করার জন্য কীসের প্রয়োজন?\n(ক) সুবেদী ওজন মাপক যন্ত্র (খ) সাধারণ দাঁড়িপাল্লা \n(গ) সাধারণ স্কেল (ঘ) থার্মোমিটার\nউত্তর: ক\n১৮. ১ কেজি ভরের কোনো বস্তুর ওজন সবচেয়ে বেশি কোথায় হবে?\n(ক) বিষুবীয় অঞ্চলে (খ) ক্রান্তীয় অঞ্চলে \n(গ) পৃথিবীর দুই মেরুতে (ঘ) চাঁদের পৃষ্ঠে\nউত্তর: গ\n১৯. পৃথিবীর মেরু অঞ্চলে ১ কেজি ভরের বস্তুর ওজন কত?\n(ক) ৯.৭৮ নিউটন (খ) ৯.৭৯ নিউটন \n(গ) ৯.৮৩ নিউটন (ঘ) ১.৬৩ নিউটন\nউত্তর: গ\n২০. বিষুবীয় অঞ্চলে ১ কেজি ভরের বস্তুর ওজন সবচেয়ে কম হয়ে কত হয়?\n(ক) ৯.৭৮ নিউটন (খ) ৯.৭৯ নিউটন \n(গ) ৯.৮৩ নিউটন (ঘ) ৯.৮ নিউটন\nউত্তর: ক\n২১. ক্রান্তীয় অঞ্চলে ১ কেজি ভরের বস্তুর ওজন কত নিউটন?\n(ক) ৯.৭৮ নিউটন (খ) ৯.৭৯ নিউটন \n(গ) ৯.৮৩ নিউটন (ঘ) ১.৬৩ নিউটন\nউত্তর: খ\n২২. ওজন ভরের কেমন?\n(ক) ব্যস্তানুপাতিক (খ) সমানুপাতিক \n(গ) বর্গের ব্যস্তানুপাতিক (ঘ) অসমান\nউত্তর: খ\n২৩. স্প্রিং নিক্তি অনেক সময় কোন এককে দাগাঙ্কিত থাকে?\n(ক) নিউটন (খ) কিলোগ্রাম (গ) মিটার (ঘ) গ্রাম\nউত্তর: খ\n২৪. ওজন এক প্রকার কী?\n(ক) কাজ (খ) বল (গ) ভর (ঘ) ত্বরণ\nউত্তর: খ\n২৫. বৈজ্ঞানিক হিসাব-নিকাশের সময় ওজনকে অবশ্যই কোন এককে পরিমাপ করতে হবে?\n(ক) কিলোগ্রাম (খ) গ্রাম (গ) নিউটন (ঘ) মিটার/সেকেন্ড\nউত্তর: গ\n২৬. ১ কেজি লিখিত একটি চাউলের প্যাকেট বা দুধের টিনের ক্ষেত্রে ১ কেজি দ্বারা কী প্রকাশ পায়?\n(ক) চাল বা দুধের ওজন (খ) চাল বা দুধের ভর \n(গ) চাল বা দুধের আয়তন (ঘ) চাল বা দুধের চাপ\nউত্তর: খ\n২৭. পৃথিবীতে ১ কেজি চালের প্যাকেটের ওজন কত হবে?\n(ক) ১ কেজি (খ) ৯.৮ নিউটন \n(গ) ১.৬৩ নিউটন (ঘ) ৯.৮৩ নিউটন\nউত্তর: খ\n২৮. চালের প্যাকেটের ওজন গ্রহ থেকে গ্রহান্তরে বা চাঁদে পরিবর্তন হলেও কোনটি পরিবর্তিত হবে না?\n(ক) অভিকর্ষ বল (খ) ওজন (গ) ভর (ঘ) অভিকর্ষজ ত্বরণ\nউত্তর: গ"},{"id":"block_17856476627224adwa","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:indigo;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>\n৭৫ কেজি ভরের একজন নভোচারী গবেষণা কাজের জন্য পৃথিবী ছেড়ে চাঁদে গমন করলেন। তিনি লক্ষ করলেন যে চাঁদে পৌঁছানোর পর তাঁর শারীরিক গঠনের বা পদার্থের কোনো পরিবর্তন হয়নি, কিন্তু তাঁর ওজন উল্লেখযোগ্যভাবে কমে গেছে।\n২৯. উদ্দীপকের নভোচারীর চাঁদে ভর কত কেজি হবে?\n(ক) ১২.৫ কেজি (খ) ১২.৫ নিউটন \n(গ) ৭৫ কেজি (ঘ) ৭৩৫ নিউটন\nউত্তর: গ\n৩০. চাঁদে পৌঁছানোর পর নভোচারীর ওজন কমে যাওয়ার কারণ কোনটি?\n(ক) চাঁদে পদার্থের পরিমাণ কমে যাওয়া \n(খ) চাঁদে অভিকর্ষজ ত্বরণের মান পৃথিবীর চেয়ে কম থাকা \n(গ) নভোচারীর আয়তন ছোট হয়ে যাওয়া \n(ঘ) চাঁদে বাতাস বেশি থাকা\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>\nবিজ্ঞান শিক্ষক শ্রেণিকক্ষে পাঠদানের সময় একটি সুবেদী ওজন মাপক যন্ত্রের সাহায্যে ১ কেজি ভরের একটি বস্তুর ওজন তিনটি ভিন্ন স্থানে মেপে দেখালেন। স্থান তিনটিতে বস্তুটির ওজন পাওয়া গেল যথাক্রমে ৯.৮৩ নিউটন, ৯.৭৯ নিউটন এবং ৯.৭৮ নিউটন।\n৩১. উদ্দীপকে বর্ণিত বস্তুর ওজন সবচেয়ে বেশি (৯.৮৩ নিউটন) পাওয়া যাবে পৃথিবীর কোন অঞ্চলে?\n(ক) ক্রান্তীয় অঞ্চলে (খ) বিষুবীয় অঞ্চলে \n(গ) দুই মেরু অঞ্চলে (ঘ) পৃথিবীর কেন্দ্রে\nউত্তর: গ\n৩২. উদ্দীপকের তিনটি ভিন্ন স্থানে ১ কেজি ভরের একই বস্তুর ওজনের তারতম্যের মূল কারণ কী?\n(ক) পৃথিবী সুষম গোলক না হওয়া এবং দূরত্ব ভিন্ন হওয়া \n(খ) স্থানগুলোতে বস্তুর ভর পরিবর্তন হওয়া \n(গ) স্থানগুলোর বায়ুমণ্ডলীয় চাপ ভিন্ন হওয়া \n(ঘ) স্থানগুলোতে বস্তুর পরমাণুর সংখ্যা বদলে যাওয়া\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b>\nরাফি দোকান থেকে ১ কেজির একটি দুধের কোটা কিনে নিয়ে এলো। তার বন্ধু সামিন বিজ্ঞান বইয়ের তথ্য থেকে জানাল, প্যাকেট বা টিনের গায়ে লিখিত ১ কেজি প্রকৃতপক্ষে ভর নির্দেশ করে, কিন্তু এটি যখন পৃথিবীর কেন্দ্রে বা মহাশূন্যে নিয়ে যাওয়া হবে তখন এর ওজন শূন্য হয়ে যাবে।\n৩৩. উদ্দীপকের ১ কেজি দুধের টিনটির পৃথিবী পৃষ্ঠে প্রকৃত ওজন কত নিউটন?\n(ক) ১ নিউটন (খ) ১.৬৩ নিউটন \n(গ) ৯.৮ নিউটন (ঘ) ৯.৮৩ নিউটন\nউত্তর: গ\n৩৪. দুধের টিনটি পৃথিবীর কেন্দ্রে নিয়ে গেলে ওজন শূন্য হওয়ার সঠিক কারণ কোনটি?\n(ক) সেখানে ভর শূন্য হয়ে যায় \n(খ) সেখানে অভিকর্ষজ ত্বরণ $g$ এর মান শূন্য \n(গ) কেন্দ্র থেকে দূরত্ব অসীম \n(ঘ) সেখানে বস্তুটির গঠন নষ্ট হয়ে যায়\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও:   </b>\nএকটি বস্তুকে প্রথমে ভূপৃষ্ঠে রাখা হলো। এরপর বস্তুটিকে ধীরে ধীরে ভূপৃষ্ঠ থেকে অনেক ওপরে উঠানো হলো এবং পরবর্তীতে মহাশূন্যে নিয়ে যাওয়া হলো যেখানে কোনো মহাকর্ষ বল কাজ করে না।\n৩৫. ভূপৃষ্ঠ থেকে যত ওপরে উঠা যায়, বস্তুর ওজন কেমন হতে থাকে?\n(ক) কমতে থাকে (খ) বাড়তে থাকে \n(গ) একই থাকে (ঘ) হঠাৎ শূন্য হয়ে আবার বাড়ে\nউত্তর: ক\n৩৬. মহাশূন্যে বস্তুটির ওজন শূন্য হওয়ার কারণ কোনটি?\n(ক) বস্তুর ভর ধ্বংস হওয়া \n(খ) বস্তুটির ওপর কোনো মহাকর্ষ বল কাজ না করা \n(গ) বস্তুর উপাদান নষ্ট হয়ে যাওয়া \n(ঘ) বস্তুর ওপর বায়ুর চাপ বৃদ্ধি পাওয়া\nউত্তর: খ\n<b> নিচের চিত্রের আলোকে (৩৭ ও ৩৮) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785647754577kylgd","type":"image","value":"https://iili.io/CScg3sj.jpg"},{"id":"block_1785647758508yfez6","type":"text","value":"৩৭. উদ্দীপকের চিত্রে ১ কেজি ভরের বস্তুর ওজন সবচেয়ে কম হবে কোন চিহ্নিত স্থানে?\r\n(ক) $A$ স্থানে (খ) $B$ স্থানে \r\n(গ) $C$ স্থানে (ঘ) $A$ ও $C$ উভয় স্থানে\r\nউত্তর: গ\r\n৩৮. উদ্দীপকের $A$ চিহ্নিত স্থানে (মেরু অঞ্চলে) ১ কেজি ভরের বস্তুর ওজন কত নিউটন হবে?\r\n(ক) $৯.৭৮\\text{ নিউটন}$ (খ) $৯.৭৯\\text{ নিউটন}$ \r\n(গ) $৯.৮৩\\text{ নিউটন}$ (ঘ) $১.৬৩\\text{ নিউটন}$\r\nউত্তর: গ\r\n<b> নিচের চিত্রের আলোকে (৩৯ ও ৪০) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785647774523odnl9","type":"image","value":"https://iili.io/CScgOk7.jpg"},{"id":"block_1785647779277g3g6t","type":"text","value":"৩৯. উদ্দীপকে নির্দেশিত পৃথিবীর কেন্দ্রে বস্তুর ওজন কত হবে?\r\n(ক) $৯.৮\\text{ নিউটন}$ (খ) $১.৬৩\\text{ নিউটন}$ \r\n(গ) শূন্য (ঘ) $৯.৮৩\\text{ নিউটন}$\r\nউত্তর: গ\r\n৪০. পৃথিবীর কেন্দ্রে কোনো বস্তুর ওজন উক্ত মানের হওয়ার মূল কারণ কোনটি?\r\n(ক) সেখানে বস্তুর ভর থাকে না \r\n(খ) পৃথিবীর কেন্দ্রে অভিকর্ষজ ত্বরণ $g$ এর মান শূন্য \r\n(গ) সেখানে বস্তুর আকৃতি বদলে যায় \r\n(ঘ) বস্তুর ওপর বায়ুর চাপ বেশি থাকে\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৪১ ও ৪২) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17856477934837dp1c","type":"image","value":"https://iili.io/CScgthg.jpg"},{"id":"block_1785647796817ti2zz","type":"text","value":"৪১. উদ্দীপকের তথ্য অনুসারে চাঁদে ১ কেজি ভরের বস্তুর ওজন কত নিউটন হবে?\r\n(ক) $৯.৮\\text{ নিউটন}$ (খ) প্রায় $১.৬৩\\text{ নিউটন}$ \r\n(গ) $৯.৮৩\\text{ নিউটন}$ (ঘ) $৯.৭৯\\text{ নিউটন}$\r\nউত্তর: খ\r\n৪২. উক্ত চাঁদের পৃষ্ঠে কোনো বস্তুর ক্ষেত্রে নিচের কোন তথ্যটি সত্য?\r\n(ক) বস্তুর ভর ও ওজন দুটোই কমে যাবে \r\n(খ) বস্তুর ভর অপরিবর্তিত থাকবে কিন্তু ওজন কমে যাবে \r\n(গ) বস্তুর ভর কমে যাবে কিন্তু ওজন একই থাকবে \r\n(ঘ) বস্তুর ভর ও ওজন কোনটিই পরিবর্তন হবে না\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৪৩ ও ৪৪) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785647810182e5iph","type":"image","value":"https://iili.io/CScrc6x.jpg"},{"id":"block_1785647813738nu70g","type":"text","value":"৪৩. উদ্দীপকের দুধের টিনের গায়ে লেখা \"$১\\text{ kg}$\" প্রকৃতপক্ষে দুধের কোন রাশি নির্দেশ করে?\r\n(ক) ওজন (খ) ভর (গ) আয়তন (ঘ) ঘনত্ব\r\nউত্তর: খ\r\n৪৪. উদ্দীপকের টিনটি পৃথিবীর পৃষ্ঠে সাধারণ স্থানে ওজন মাপলে তা কত নিউটন পাওয়া যাবে?\r\n(ক) $১\\text{ নিউটন}$ (খ) $৯.৮\\text{ নিউটন}$ \r\n(গ) $১.৬৩\\text{ নিউটন}$ (ঘ) $৯.৮৩\\text{ নিউটন}$\r\nউত্তর: খ"},{"id":"block_1785647962379sxe2h","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:indigo;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৪৫. বস্তুর ভর সম্পর্কে সঠিক তথ্য হলো—\ni. বস্তুর মধ্যে পদার্থের মোট পরিমাপই হচ্ছে এর ভর\nii. ভর হচ্ছে একটি ধ্রুব রাশি\niii. স্থান পরিবর্তনের সাথে সাথে বস্তুর ভর পরিবর্তিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৬. বস্তুর ওজন পরিবর্তনের কারণসমূহ হলো—\ni. বস্তুর ওজন অভিকর্ষজ ত্বরণ $g$ এর ওপর নির্ভর করে\nii. ভূপৃষ্ঠ থেকে যত ওপরে ওঠা যায় বস্তুর ওজন তত কমতে থাকে\niii. পৃথিবীর কেন্দ্র থেকে দূরত্ব বাড়লে বস্তুর ওপর আকর্ষণ কমে যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৭. চাঁদে বস্তুর ভর ও ওজন সম্পর্কে বলা যায়—\ni. ৭৫ কেজি ভরের একজন মহাশূন্যচারীর ভর চাঁদে ৭৫ কেজিই থাকবে\nii. চাঁদের অভিকর্ষজনিত ত্বরণের মান পৃথিবীতে অভিকর্ষজ ত্বরণের প্রায় $\\frac{১}{৬}$ ভাগ\niii. চাঁদে ১ কেজি ভরের বস্তুর ওজন হবে প্রায় ১.৬৩ নিউটন\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৮. পৃথিবী পৃষ্ঠে ওজনের তারতম্য সম্পর্কে সঠিক তথ্য কোনটি?\ni. পৃথিবীর দুই মেরুতে ১ কেজি ভরের বস্তুর ওজন সবচেয়ে বেশি অর্থাৎ ৯.৮৩ নিউটন\nii. বিষুবীয় অঞ্চলে ১ কেজি ভরের বস্তুর ওজন সবচেয়ে কম অর্থাৎ ৯.৭৮ নিউটন\niii. ক্রান্তীয় অঞ্চলে ১ কেজি ভরের বস্তুর ওজন ৯.৭৯ নিউটন\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৯. ওজন ও ভরের সম্পর্ক বিবেচনা করলে—\ni. ওজন ভরের সমানুপাতিক\nii. বৈজ্ঞানিক হিসাব-নিকাশের সময় ওজনকে অবশ্যই নিউটন এককে পরিমাপ করতে হবে\niii. ১ কেজি চাউলের প্যাকেটের ওজন পৃথিবীতে ১ কেজি\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"}]},{"id":"topic_1785481092269ok87f","title":"পাঠ - (৬)","blocks":[{"id":"block_17856479355215ueqc","type":"text","value":"<span style=\"color:gold;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. বস্তুর ওজন কিসের ওপর নির্ভরশীল?\n(ক) ভরের ওপর (খ) অভিকর্ষজ ত্বরণ $g$ এর ওপর \n(গ) আয়তনের ওপর (ঘ) ঘনত্বের ওপর\nউত্তর: খ\n২. স্থানভেদে বস্তুর কোনটির পরিবর্তন হয়?\n(ক) ভর (খ) ওজন (গ) পদার্থের পরিমাণ (ঘ) অণুর সংখ্যা\nউত্তর: খ\n৩. কোনটি বস্তুর মৌলিক ধর্ম নয়?\n(ক) ভর (খ) আকার (গ) ওজন (ঘ) গঠন\nউত্তর: গ\n৪. ভূপৃষ্ঠের বিভিন্ন স্থানে বস্তুর ওজন বিভিন্ন হওয়ার মূল কারণ কী কী?\n(ক) পৃথিবীর আকৃতি ও আহ্নিক গতি \n(খ) পৃথিবীর বার্ষিক গতি ও ব্যাসার্ধ \n(গ) পৃথিবীর ভর ও বায়ুমণ্ডল \n(ঘ) পৃথিবীর তাপমাত্রা ও চাপ\nউত্তর: ক\n৫. $g$ এর মান পৃথিবীর কেন্দ্র থেকে কিসের ওপর নির্ভর করে?\n(ক) বস্তুর ভরের (খ) দূরত্বের (গ) আকৃতির (ঘ) ঘনত্বের\nউত্তর: খ\n৬. পৃথিবীর কোন অঞ্চলে কেন্দ্র থেকে ভূপৃষ্ঠের দূরত্ব সবচেয়ে বেশি?\n(ক) মেরু অঞ্চলে (খ) বিষুবীয় অঞ্চলে \n(গ) ক্রান্তীয় অঞ্চলে (ঘ) কেন্দ্রস্থলে\nউত্তর: খ\n৭. বিষুবীয় অঞ্চলে $g$ এর মান কত?\n(ক) $৯.৮৩\\text{ মিটার/সেকেন্ড}^২$ (খ) $৯.৭৮\\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮০\\text{ মিটার/সেকেন্ড}^২$ (ঘ) $০\\text{ মিটার/সেকেন্ড}^২$\nউত্তর: খ\n৮. বিষুবীয় অঞ্চলে বস্তুর ওজন কেমন হয়?\n(ক) সবচেয়ে বেশি (খ) সবচেয়ে কম (গ) শূন্য (ঘ) অসীম\nউত্তর: খ\n৯. বিষুবীয় অঞ্চল থেকে মেরু অঞ্চলের দিকে যত যাওয়া যায়, কেন্দ্র থেকে ভূপৃষ্ঠের দূরত্ব কেমন হতে থাকে?\n(ক) বাড়তে থাকে (খ) কমতে থাকে \n(গ) একই থাকে (ঘ) হঠাৎ বাড়ে\nউত্তর: খ\n১০. মেরু অঞ্চলে $g$ এর মান কত?\n(ক) $৯.৭৮\\text{ মিটার/সেকেন্ড}^২$ (খ) $৯.৮৩\\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮০\\text{ মিটার/সেকেন্ড}^২$ (ঘ) $০\\text{ মিটার/সেকেন্ড}^২$\nউত্তর: খ\n১১. পৃথিবীর কোন অঞ্চলে $g$ এর মান সবচেয়ে বেশি হওয়ার কারণে বস্তুর ওজনও সবচেয়ে বেশি হয়?\n(ক) বিষুবীয় অঞ্চলে (খ) মেরু অঞ্চলে \n(গ) পাহাড়ে (ঘ) খনিতে\nউত্তর: খ\n১২. নিজ অক্ষের চারদিকে ঘূর্ণন গতি বা আহ্নিক গতির জন্য অভিকর্ষজ ত্বরণ কেমন হয়?\n(ক) বৃদ্ধি পায় (খ) হ্রাস পায় \n(গ) অপরিবর্তিত থাকে (ঘ) শূন্য হয়ে যায়\nউত্তর: খ\n১৩. পৃথিবীতে আহ্নিক গতি না থাকলে বর্তমানের তুলনায় অভিকর্ষজ ত্বরণের মান কেমন হতো?\n(ক) কম হতো (খ) বেশি হতো \n(গ) শূন্য হতো (ঘ) সমান হতো\nউত্তর: খ\n১৪. বিষুবীয় অঞ্চল থেকে মেরু অঞ্চলের দিকে কৌণিক দূরত্ব (অক্ষাংশ) বাড়ার সাথে অভিকর্ষজ ত্বরণের মান কেমন হয়?\n(ক) ক্রমশ বৃদ্ধি পায় (খ) ক্রমশ হ্রাস পায় \n(গ) একই থাকে (ঘ) শূন্য হয়\nউত্তর: ক\n১৫. ভূপৃষ্ঠ থেকে যত ওপরে উঠা যায় অভিকর্ষজ ত্বরণের মান কেমন হয়?\n(ক) বাড়তে থাকে (খ) কমতে থাকে \n(গ) অপরিবর্তিত থাকে (ঘ) হঠাৎ বাড়ে\nউত্তর: খ\n১৬. পাহাড় বা পর্বতশীর্ষে বস্তুর ওজন কেমন হয়?\n(ক) বেশি হয় (খ) কম হয় (গ) শূন্য হয় (ঘ) অসীম হয়\nউত্তর: খ\n১৭. ভূপৃষ্ঠ থেকে যত নিচে বা পৃথিবীর অভ্যন্তরে যাওয়া যায়, অভিকর্ষজ ত্বরণের মান কেমন হতে থাকে?\n(ক) বাড়তে থাকে (খ) কমতে থাকে \n(গ) একই থাকে (ঘ) অসীম হতে থাকে\nউত্তর: খ\n১৮. খনিতে কোনো বস্তুর ওজন কেমন হয়?\n(ক) বেশি হয় (খ) কম হয় \n(গ) অসীম হয় (ঘ) অপরিবর্তিত থাকে\nউত্তর: খ\n১৯. পৃথিবীর কেন্দ্রে অভিকর্ষজ ত্বরণের মান কত?\n(ক) $৯.৮৩\\text{ মিটার/সেকেন্ড}^২$ (খ) $৯.৭৮\\text{ মিটার/সেকেন্ড}^২$ \n(গ) শূন্য (ঘ) $৯.৮\\text{ মিটার/সেকেন্ড}^২$\nউত্তর: গ\n২০. কোনো বস্তুকে পৃথিবীর কেন্দ্রে নিয়ে গেলে বস্তুর ওপর পৃথিবীর আকর্ষণ কেমন হবে?\n(ক) সবচেয়ে বেশি হবে (খ) আকর্ষণ থাকবে না \n(গ) আকর্ষণ দ্বিগুণ হবে (ঘ) অসীম হবে\nউত্তর: খ\n২১. পৃথিবীর কেন্দ্রে নিয়ে গেলে বস্তুর ওজন কত হবে?\n(ক) ৯.৮৩ নিউটন (খ) ৯.৭৮ নিউটন \n(গ) শূন্য (ঘ) ৯.৮ নিউটন\nউত্তর: গ"},{"id":"block_1785648040201hayhx","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:gold;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২২ ও ২৩) নং প্রশ্নের উত্তর দাও:   </b>\nতানভীর সাহেব তাঁর কাজের প্রয়োজনে একবার বাংলাদেশের উত্তর মেরু অঞ্চলের কাছাকাছি একটি দেশে গেলেন এবং পরবর্তীতে বিষুবীয় অঞ্চলের একটি দেশে ভ্রমণ করলেন। তিনি লক্ষ করলেন, একই ১ কেজি ভরের একটি বস্তুর ওজন বিষুবীয় অঞ্চলে কম কিন্তু মেরু অঞ্চলে গেলে বৃদ্ধি পায়।\n২২. উদ্দীপকে বর্ণিত বিষুবীয় অঞ্চলে অভিকর্ষজ ত্বরণ $g$ এর মান কত?\n(ক) $৯.৭৮\\text{ মিটার/সেকেন্ড}^২$ \n(খ) $৯.৮৩\\text{ মিটার/সেকেন্ড}^২$ \n(গ) $৯.৮০\\text{ মিটার/সেকেন্ড}^২$ \n(ঘ) $০\\text{ মিটার/সেকেন্ড}^২$\nউত্তর: ক\n২৩. বিষুবীয় অঞ্চল থেকে মেরু অঞ্চলের দিকে গেলে বস্তুর ওজন বৃদ্ধি পাওয়ার কারণ কী?\n(ক) পৃথিবীর কেন্দ্র থেকে ভূপৃষ্ঠের দূরত্ব কমতে থাকা এবং $g$ এর মান বৃদ্ধি পাওয়া (খ) স্থানটিতে বস্তুর ভর বৃদ্ধি পাওয়া \n(গ) পৃথিবীর আহ্নিক গতি বৃদ্ধি পাওয়া \n(ঘ) বস্তুর অণুর সংখ্যা বেড়ে যাওয়া\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (২৪ ও ২৫) নং প্রশ্নের উত্তর দাও:   </b>\nসাজিদ ভৌগোলিক গবেষণার অংশ হিসেবে প্রথমে এভারেস্ট পর্বতশীর্ষে একটি বস্তুর ওজন মেপে দেখলেন। এরপর তিনি সেই একই বস্তুকে নিয়ে একটি গভীর খনিতে নেমে পুনরায় ওজন মেপে পার্থক্য পর্যবেক্ষণ করলেন।\n২৪. এভারেস্ট পর্বতশীর্ষে বস্তুটির ওজন কম হওয়ার কারণ কী?\n(ক) ভূপৃষ্ঠ থেকে উঁচুতে থাকায় $g$ এর মান কম \n(খ) উঁচুতে বস্তুর ভর কমে যায় \n(গ) পর্বতে পৃথিবীর আহ্নিক গতি থাকে না \n(ঘ) অক্ষাংশের মান কমে যায়\nউত্তর: ক\n২৫. উদ্দীপকে বর্ণিত গভীর খনিতে বস্তুটির ওজনের ক্ষেত্রে কোন পরিবর্তন দেখা যাবে?\n(ক) ওজন বৃদ্ধি পাবে (খ) ওজন কম হবে \n(গ) ওজন অপরিবর্তিত থাকবে (ঘ) ওজন অসীম হবে\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২৬ ও ২৭) নং প্রশ্নের উত্তর দাও:   </b>\nশ্রেণিকক্ষে শিক্ষক শিক্ষার্থীদের উদ্দেশ্যে বললেন, \"মনে করো পৃথিবী হঠাৎ করে তার নিজ অক্ষের ওপর ঘোরা (আহ্নিক গতি) বন্ধ করে দিল।\" শিক্ষার্থীরা এর ফলে অভিকর্ষজ ত্বরণ ও ওজনের ওপর প্রভাব নিয়ে আলোচনা করতে লাগল।\n২৬. উদ্দীপকের বর্ণনা অনুযায়ী পৃথিবীতে আহ্নিক গতি থাকার কারণে অভিকর্ষজ ত্বরণের কী ঘটে?\n(ক) হ্রাস পায় (খ) বৃদ্ধি পায় \n(গ) অপরিবর্তিত থাকে (ঘ) শূন্য হয়ে যায়\nউত্তর: ক\n২৭. যদি হঠাৎ পৃথিবীর আহ্নিক গতি না থাকে, তবে বর্তমানের তুলনায় অভিকর্ষজ ত্বরণের মান কেমন হবে?\n(ক) বর্তমানের চেয়ে কম হবে \n(খ) বর্তমানের চেয়ে বেশি হবে \n(গ) শূন্য হয়ে যাবে (ঘ) কোনো পরিবর্তন হবে না\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২৮ ও ২৯) নং প্রশ্নের উত্তর দাও:   </b>\nএকটি বৈজ্ঞানিক কাল্পনিক গল্পের দূরসংবেদনশীল যন্ত্রকে ভ্রমণের জন্য প্রথমে ভূপৃষ্ঠে, এরপর মেরু অঞ্চল থেকে অন্য অক্ষাংশে এবং সবশেষে পৃথিবীর কেন্দ্রে পাঠোনো হলো। পৃথিবীর কেন্দ্রে পৌঁছানোর পর দেখা গেল যন্ত্রটির কোনো ওজনই আর মাপা যাচ্ছে না।\n২৮. উদ্দীপকে মেরু অঞ্চল থেকে অক্ষাংশ বা কৌণিক দূরত্ব পরিবর্তনের সাথে অভিকর্ষজ ত্বরণের মান কেমন হয়?\n(ক) পরিবর্তন ঘটে (খ) সর্বদা স্থির থাকে \n(গ) শূন্য হয়ে যায় (ঘ) দ্বিগুণ হয়ে যায়\nউত্তর: ক\n২৯. পৃথিবীর কেন্দ্রে যন্ত্রটির ওজন শূন্য হওয়ার কারণ কোনটি?\n(ক) কেন্দ্রে অভিকর্ষজ ত্বরণের মান শূন্য এবং পৃথিবীর কোনো আকর্ষণ থাকে না (খ) কেন্দ্রে যন্ত্রটির ভর ধ্বংস হয়ে যায় \n(গ) কেন্দ্রে বায়ুর চাপ তীব্র বৃদ্ধি পায় \n(ঘ) কেন্দ্রে বস্তুটির আকৃতি নষ্ট হয়ে যায়\nউত্তর: ক\n<b> নিচের চিত্রের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785648104930ohdbj","type":"image","value":"https://iili.io/CScrPMG.jpg"},{"id":"block_17856481093682q77w","type":"text","value":"৩০. উদ্দীপকের $A$ চিহ্নিত স্থানে (বিষুবীয় অঞ্চলে) বস্তুর ওজন সবচেয়ে কম হওয়ার মূল কারণ কোনটি?\r\n(ক) সেখানে কেন্দ্র থেকে ভূপৃষ্ঠের দূরত্ব সবচেয়ে কম \r\n(খ) সেখানে কেন্দ্র থেকে ভূপৃষ্ঠের দূরত্ব সবচেয়ে বেশি \r\n(গ) সেখানে বস্তুর ভর সবচেয়ে কম \r\n(ঘ) সেখানে কোনো আহ্নিক গতি নেই\r\nউত্তর: খ\r\n৩১. উদ্দীপকের $B$ চিহ্নিত স্থানে (মেরু অঞ্চলে) $১\\text{ kg}$ ভরের বস্তুর ওজন কত নিউটন হবে?\r\n(ক) $৯.৭৮\\text{ নিউটন}$ (খ) $৯.৮৩\\text{ নিউটন}$ \r\n(গ) $১.৬৩\\text{ নিউটন}$ (ঘ) $০\\text{ নিউটন}$\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17856481260293qdrd","type":"image","value":"https://iili.io/CSc42Kx.jpg"},{"id":"block_1785648129839okzp5","type":"text","value":"৩২. উদ্দীপকের $X$ চিহ্নিত স্থানে (পাহাড়ের শীর্ষে) বস্তুটির ওজন কম হওয়ার কারণ কী?\r\n(ক) ভূপৃষ্ঠ থেকে ওপরে ওঠায় $g$ এর মান কমে যায় \r\n(খ) ওপরে উঠলে বস্তুর ভর হ্রাস পায় \r\n(গ) ওপরে পাহাড়ে বাতাস থাকে না \r\n(ঘ) ওপরে বস্তুর আকার ছোট হয়ে যায়\r\nউত্তর: ক\r\n৩৩. যদি বস্তুটিকে $Y$ অবস্থান থেকে আরও গভীরে কোনো খনিতে নিয়ে যাওয়া হয়, তবে বস্তুটির ওজনের কী পরিবর্তন ঘটবে?\r\n(ক) ওজন বৃদ্ধি পাবে (খ) ওজন কমতে থাকবে \r\n(গ) ওজন অপরিবর্তিত থাকবে (ঘ) ওজন দ্বিগুণ হবে\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785648143647f8k20","type":"image","value":"https://iili.io/CSc4YNt.jpg"},{"id":"block_1785648147293g9xwt","type":"text","value":"৩৪. উদ্দীপকের $C$ চিহ্নিত স্থানে (পৃথিবীর কেন্দ্রে) কোনো বস্তুকে নিয়ে গেলে বস্তুর ওজন কত হবে?\r\n(ক) $৯.৭৮\\text{ নিউটন}$ (খ) $৯.৮৩\\text{ নিউটন}$ \r\n(গ) শূন্য (ঘ) $৯.৮\\text{ নিউটন}$\r\nউত্তর: গ\r\n৩৫. উদ্দীপকের $C$ স্থানে বস্তুর ওপর পৃথিবীর আকর্ষণ বল কেমন থাকে?\r\n(ক) কোনো আকর্ষণ থাকে না \r\n(খ) আকর্ষণের মান সবচেয়ে বেশি হয় \r\n(গ) আকর্ষণের মান দ্বিগুণ হয় \r\n(ঘ) আকর্ষণের মান অর্ধেক হয়\r\nউত্তর: ক\r\n<b> নিচের চিত্রের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17856481647267ouni","type":"image","value":"https://iili.io/CSc4S0x.jpg"},{"id":"block_17856481679020qf1v","type":"text","value":"৩৬. উদ্দীপকের $A$ চিহ্ন দ্বারা নির্দেশিত গতি বা আহ্নিক গতির জন্য অভিকর্ষজ ত্বরণের কী পরিবর্তন ঘটে?\r\n(ক) অভিকর্ষজ ত্বরণ বৃদ্ধি পায় \r\n(খ) অভিকর্ষজ ত্বরণ হ্রাস পায় \r\n(গ) অভিকর্ষজ ত্বরণ অপরিবর্তিত থাকে \r\n(ঘ) অভিকর্ষজ ত্বরণ শূন্য হয়\r\nউত্তর: খ\r\n৩৭. উদ্দীপকে প্রদর্শিত ঘূর্ণন গতি বা আহ্নিক গতি যদি না থাকত, তবে অভিকর্ষজ ত্বরণের মান কেমন হতো?\r\n(ক) বর্তমানের চেয়ে কম হতো \r\n(খ) বর্তমানের চেয়ে বেশি হতো \r\n(গ) শূন্য হতো (ঘ) কোনো পরিবর্তন হতো না\r\nউত্তর: খ"},{"id":"block_1785648183185wq6c5","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:gold;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩৮. পৃথিবীর বিভিন্ন স্থানে অভিকর্ষজ ত্বরণ $g$ ও বস্তুর ওজন সম্পর্কে বলা য কোনো স্থানে কোনো ব্যক্তির অনুভূত ওজন ও প্রকৃত ওজন একই রাশি হয় না?\n(ক) লিফটের গতি ও প্রতিক্রিয়াবল (খ) ভরের মান পরিবর্তন (গ) বস্তুর উপাদান পরিবর্তন (ঘ) পৃথিবীর কেন্দ্র থেকে দূরত্ব স্থির থাকা\nউত্তর: ক\n৩. স্থির লিফটের ভেতরে আরোহীর অনুভূত ওজন কেমন হয়?\n(ক) প্রকৃত ওজনের সমান (খ) প্রকৃত ওজনের চেয়ে বেশি (গ) প্রকৃত ওজনের চেয়ে কম (ঘ) শূন্য\nউত্তর: ক\n৪. সমবেগে ওপরে অথবা নিচে গতিশীল লিফটের ক্ষেত্রে কোনটি সঠিক?\n(ক) অনুভূত ওজন প্রকৃত ওজনের চেয়ে বেশি (খ) অনুভূত ওজন প্রকৃত ওজনের চেয়ে কম (গ) অনুভূত ওজন প্রকৃত ওজনের সমান (ঘ) অনুভূত ওজন শূন্য\nউত্তর: গ\n৫. স্থির অবস্থা থেকে ওপরে উঠতে শুরু করা ত্বরণযুক্ত লিফটে লিফটের মেঝে আরোহীর ওপর কীভাবে বল প্রয়োগ করে?\n(ক) প্রকৃত ওজনের চেয়ে কম (খ) প্রকৃত ওজনের চেয়ে বেশি (গ) কোনো বল প্রয়োগ করে না (ঘ) শূন্য বল\nউত্তর: খ\n৬. ওপরে ওঠার সময় ত্বরণযুক্ত লিফটে আরোহীর অনুভূত ওজন কেমন হয়?\n(ক) প্রকৃত ওজনের চেয়ে বেশি (খ) প্রকৃত ওজনের চেয়ে কম (গ) শূন্য (ঘ) অপরিবর্তিত\nউত্তর: ক\n৭. ওপরে ওঠার সময় লিফটে অনুভূত ওজনকে আমরা কী হিসেবে চিন্তা করতে পারি?\n(ক) মহাকর্ষ বল (খ) প্রতিক্রিয়া বল (গ) কেন্দ্রমুখী বল (ঘ) ঘর্ষণ বল\nউত্তর: খ\n৮. ওপরে অবস্থিত স্থির লিফটকে নিচের দিকে ত্বরণসহ গতিশীল করতে লিফটের তারের টান কী করতে হয়?\n(ক) বাড়িয়ে দিতে হয় (খ) কমিয়ে দিতে হয় (গ) স্থির রাখতে হয় (ঘ) শূন্য করে দিতে হয়\nউত্তর: খ\n৯. নিচের দিকে ত্বরণযুক্ত লিফটে আরোহীর অনুভূত ওজন কেমন হয়?\n(ক) প্রকৃত ওজনের চেয়ে বেশি (খ) প্রকৃত ওজনের চেয়ে কম (গ) প্রকৃত ওজনের সমান (ঘ) অসীম\nউত্তর: খ\n১০. মুক্তভাবে পড়ন্ত লিফটের ক্ষেত্রে দড়িতে বা তারে কোনো টান না থাকার কারণ কী?\n(ক) তারটি ছিড়ে যাওয়া (খ) লিফটটি স্থির থাকা (গ) লিফটটি ওপরে ওঠা (ঘ) লিফটটি সমবেগে চলা\nউত্তর: ক\n১১. মুক্তভাবে পড়ন্ত লিফটের মেঝে আরোহীর ওপর কতটুকু বল প্রয়োগ করে?\n(ক) সমমানের বল (খ) দ্বিগুণ বল (গ) কোনো বল প্রয়োগ করে না (ঘ) দ্বিগুণ প্রতিক্রিয়া বল\nউত্তর: গ\n১২. মুক্তভাবে পড়ন্ত লিফটের ভেতরে আরোহী নিজেকে কেমন অনুভব করেন?\n(ক) ভারী (খ) ওজনহীন (গ) সামান্য হালকা (ঘ) স্থির\nউত্তর: খ\n১৩. মহাশূন্যযানের পৃথিবীকে প্রদক্ষিণ করার সাথে লিফটের কোন অবস্থার সাদৃশ্য আছে?\n(ক) স্থির থাকার (খ) সমবেগে ওপরে ওঠার (গ) মুক্তভাবে নিচে পড়ার (ঘ) ত্বরণে ওপরে ওঠার\nউত্তর: গ\n১৪. মহাশূন্যচারীরা মহাশূন্যযানে করে পৃথিবীকে কীভাবে প্রদক্ষিণ করেন?\n(ক) নির্দিষ্ট উচ্চতায় বৃত্তাকার কক্ষপথে (খ) ডিম্বাকার পথে (গ) উপবৃত্তাকার পথে (ঘ) সরলরেখায়\nউত্তর: ক\n১৫. মহাশূন্যযানের বৃত্তাকার গতি সৃষ্টির জন্য মহাশূন্যযান ও মহাশূন্যচারী উভয়েই কোনটিতে গতিশীল থাকে?\n(ক) ভিন্ন ভিন্ন ত্বরণে (খ) একই ত্বরণে (গ) সমবেগে (ঘ) শূন্য ত্বরণে\nউত্তর: খ\n১৬. মহাশূন্যযানের দেয়ালের সাপেক্ষে মহাশূন্যচারীর ত্বরণ কত হয়?\n(ক) ৯.৮ $\\text{m/s}^2$ (খ) ৯.৮৩ $\\text{m/s}^2$ (গ) শূন্য (ঘ) ১.৬৩ $\\text{m/s}^2$\nউত্তর: গ\n১৭. মহাশূন্যযানে মহাশূন্যচারী নিজের ওজনের বিপরীতে কোনটি অনুভব করেন না?\n(ক) মহাকর্ষ বল (খ) প্রতিক্রিয়া বল (গ) ভর (ঘ) ত্বরণ\nউত্তর: খ\n১৮. মহাশূন্যযানে গ্লাসের পানি উপুড় করলে কী ঘটবে?\n(ক) নিচে পড়ে যাবে (খ) ভাসতে থাকবে বা পড়বে না (গ) বাষ্প হয়ে যাবে (ঘ) জমে বরফ হবে\nউত্তর: খ\n১৯. মহাশূন্যযানে আপাত ওজনহীনতার মূল কারণ কোনটি?\n(ক) মহাশূন্যচারীর ভর শূন্য হওয়া (খ) ওই স্থানে $g$ এর মান শূন্য হওয়া (গ) মহাশূন্যযানটি $g$ ত্বরণে গতিশীল থাকা (ঘ) কোনো আকর্ষণ বল না থাকা\nউত্তর: গ\n২০. মহাশূন্যযান যদি পৃথিবীকে প্রদক্ষিণ না করে বা নিচে না পড়ে স্থির দাঁড়িয়ে থাকে, তবে মহাশূন্যচারী—\n(ক) ওজন টের পাবেন (খ) নিজেকে ওজনহীন মনে করবেন (গ) ভাসতে থাকবেন (ঘ) ভর হারিয়ে ফেলবেন\nউত্তর: ক"},{"id":"block_1785648305406up8do","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<span style=\"color:chocolate;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\r\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<b> নিচের তথ্যের আলোকে (২১ ও ২২) নং প্রশ্নের উত্তর দাও:   </b>\r\nআরিফ একটি বহুতল ভবনের লিফটে চড়ে উপরে উঠছিলেন। লিফটটি স্থির অবস্থা থেকে হঠাৎ ওপরের দিকে ত্বরণসহ যাত্রা শুরু করায় আরিফ নিজেকে স্বাভাবিকের চেয়ে কিছুটা ভারী অনুভব করলেন। পরবর্তীতে নামার সময় লিফটের তার ছিড়ে গেলে তিনি এক অদ্ভুত অনুভূতি অর্জন করলেন।\r\n২১. স্থির অবস্থা থেকে ওপরে উঠতে শুরু করা ত্বরণযুক্ত লিফটে আরিফের নিজেকে ভারী মনে হওয়ার কারণ কী?\r\n(ক) লিফটের মেঝে তার ওপর প্রকৃত ওজনের চেয়ে বেশি প্রতিক্রিয়া বল প্রয়োগ করে (খ) আরিফের শরীরের ভর সাময়িকভাবে বৃদ্ধি পায় (গ) ওই স্থানে অভিকর্ষজ ত্বরণের মান দ্বিগুণ হয় (ঘ) লিফট আরিফকে নিচের দিকে টেনে নেয়\r\nউত্তর: ক\r\n২২. উদ্দীপকে উল্লিখিত লিফটের তার ছিড়ে মুক্তভাবে নিচে পড়ার সময় আরিফের অনুভূতি কেমন হবে?\r\n(ক) তিনি স্বাভাবিকের চেয়ে দ্বিগুণ ভারী অনুভব করবেন (খ) তিনি নিজেকে সম্পূর্ণ ওজনহীন অনুভব করবেন (গ) তাঁর ওজন অপরিবর্তিত থাকবে (ঘ) তিনি ওপরের দিকে উঠে যাবেন\r\nউত্তর: খ\r\n<b> নিচের তথ্যের আলোকে (২৩ ও ২৪) নং প্রশ্নের উত্তর দাও:   </b>\r\nসুমন ও তাঁর বন্ধুরা সমবেগে চলন্ত একটি লিফটে চড়ে নামছিল। সুমন ভাবছিল লিফট নিচে নামছে বলে তাদের ওজন হয়তো কমে গেছে, কিন্তু তার বন্ধু রাতুল বিজ্ঞান বইয়ের পাঠ থেকে সঠিক তথ্যটি বুঝিয়ে দিল।\r\n২৩. উদ্দীপকের মতো সমবেগে গতিশীল লিফটে আরোহীর অনুভূত ওজন কেমন হয়?\r\n(ক) প্রকৃত ওজনের চেয়ে কম (খ) প্রকৃত ওজনের চেয়ে বেশি (গ) প্রকৃত ওজনের সমান (ঘ) সম্পূর্ণ শূন্য\r\nউত্তর: গ\r\n২৪. রাতুল বিজ্ঞান বই থেকে যে ব্যাখ্যাটি দিয়েছিল, তা অনুসারে সমবেগে চলন্ত লিফটে ওজন অপরিবর্তিত থাকার কারণ কী?\r\n(ক) লিফটের ভেতরে $g$ এর মান শূন্য হয়ে যায় (খ) লিফট ও আরোহীর ওপর কেবল প্রকৃত ওজন বা পৃথিবীর আকর্ষণ বল ক্রিয়া করে (গ) লিফটের গতি আরোহীর ভরকে শূন্য করে দেয় (ঘ) লিফটটি কোনো বলই প্রয়োগ করে না\r\nউত্তর: খ\r\n<b> নিচের তথ্যের আলোকে (২৫ ও ২৬) নং প্রশ্নের উত্তর দাও:   </b>\r\nবিজ্ঞানী নভোচারীরা একটি মহাশূন্যযানে করে নির্দিষ্ট উচ্চতায় পৃথিবীকে বৃত্তাকার কক্ষপথে প্রদক্ষিণ করছেন। মহাশূন্যযানের ভেতরে থাকা অবস্থায় গ্লাসের পানি উপুড় করলেও পানি নিচে পড়ছে না এবং নভোচারীরা ভেসে থাকছেন।\r\n২৫. উদ্দীপকে বর্ণিত মহাশূন্যযানে পানি উপুড় করলেও না পড়ার কারণ কী?\r\n(ক) মহাশূন্যযানের ভেতর বাতাস ও মাধ্যাকর্ষণ একেবারেই নেই (খ) মহাশূন্যযান ও তার ভেতরের সব বস্তু একই ত্বরণে মুক্তভাবে পড়ন্ত অবস্থায় গতিশীল (গ) পানির ভর শূন্য হয়ে গেছে (ঘ) গ্লাসের আকর্ষণ শক্তি পানিকে ধরে রাখে\r\nউত্তর: খ\r\n২৬. মহাশূন্যযানে নভোচারীদের এই আপাত ওজনহীনতার মূল কারণ কোনটি?\r\n(ক) মহাশূন্যচারীর ভর শূন্য হওয়া (খ) ওই স্থানে পৃথিবীর আকর্ষণ না থাকা (গ) মহাশূন্যযানটি $g$ ত্বরণে গতিশীল থাকা (ঘ) মহাশূন্যযানের ক্ষেত্রফল বৃদ্ধি পাওয়া\r\nউত্তর: গ\r\n<b> নিচের তথ্যের আলোকে (২৭ ও ২৮) নং প্রশ্নের উত্তর দাও:   </b>\r\nরাফিদ লিফটে চড়ে দ্রুত নিচের দিকে নামছিল। লিফটটি স্থির অবস্থায় নামার জন্য প্রস্তুত হওয়ার পর যখন নিচের দিকে ত্বরণসহ চলতে শুরু করল, তখন সে খেয়াল করল তার শরীরের ওজন স্বাভাবিকের চেয়ে কম মনে হচ্ছে।\r\n২৭. নিচের দিকে ত্বরণযুক্ত লিফটে রাফিদের অনুভূত ওজন কেমন হয়?\r\n(ক) প্রকৃত ওজনের চেয়ে বেশি (খ) প্রকৃত ওজনের চেয়ে কম (গ) প্রকৃত ওজনের সমান (ঘ) অসীম\r\nউত্তর: খ\r\n২৮. নিচের দিকে ত্বরণযুক্ত লিফটে আরোহীর অনুভূত ওজন হ্রাস পাওয়ার মূল কারণ কোনটি?\r\n(ক) লিফটের তারের টান বাড়িয়ে দেওয়া (খ) লিফটের মেঝে আরোহীর ওপর প্রকৃত ওজনের চেয়ে কম মানের বল বা প্রতিক্রিয়া প্রয়োগ করা (গ) পৃথিবীর আকর্ষণ বল হঠাৎ বন্ধ হয়ে যাওয়া (ঘ) আরোহীর ভর সাময়িকভাবে কমে যাওয়া\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_17856484300619mwuo","type":"image","value":"https://iili.io/CSc4bgR.jpg"},{"id":"block_1785648433902yuf4i","type":"text","value":"২৯. উদ্দীপকের চিত্রানুসারে লিফটের তার ছিঁড়ে গেলে লিফটের মেঝে আরোহীর ওপর কতটুকু বল প্রয়োগ করবে?\r\n(ক) প্রকৃত ওজনের সমান বল (খ) প্রকৃত ওজনের চেয়ে বেশি বল (গ) কোনো বল প্রয়োগ করবে না (ঘ) দ্বিগুণ প্রতিক্রিয়া বল\r\nউত্তর: গ\r\n৩০. চিত্রে প্রদর্শিত অবস্থায় আরোহীর অনুভূত ওজন কেমন হবে?\r\n(ক) তিনি নিজেকে ভারী অনুভব করবেন (খ) তিনি নিজেকে সম্পূর্ণ ওজনহীন অনুভব করবেন (গ) তাঁর ওজন অপরিবর্তিত থাকবে (ঘ) তাঁর ভর শূন্য হয়ে যাবে\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785648446286s3v4k","type":"image","value":"https://iili.io/CSc67rx.jpg"},{"id":"block_178564846546298g8u","type":"text","value":"৩১. উদ্দীপকের চিত্রে লিফটটি স্থির অবস্থান হতে ওপরে উঠার সময় আরোহীর অনুভূত ওজন ($W_a$) কেমন হবে?\r\n(ক) প্রকৃত ওজনের চেয়ে বেশি (খ) প্রকৃত ওজনের চেয়ে কম (গ) শূন্য (ঘ) অপরিবর্তিত\r\nউত্তর: ক\r\n৩২. চিত্রে প্রদর্শিত অবস্থায় অনুভূত ওজনকে আমরা কী হিসেবে চিন্তা করতে পারি?\r\n(ক) মহাকর্ষ বল (খ) প্রতিক্রিয়া বল (গ) কেন্দ্রমুখী বল (ঘ) ঘর্ষণ বল\r\nউত্তর: খ\r\n<b> নিচের চিত্রের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785648482207gb3dr","type":"image","value":"https://iili.io/CSc6XEJ.jpg"},{"id":"block_17856484858984m7sd","type":"text","value":"৩৩. উদ্দীপকের চিত্রে নির্দেশিত মহাশূন্যযানের দেয়ালের সাপেক্ষে মহাশূন্যচারীর ত্বরণ কত?\r\n(ক) $৯.৮\\text{ m/s}^2$ (খ) $৯.৮৩\\text{ m/s}^2$ (গ) শূন্য (ঘ) $১.৬৩\\text{ m/s}^2$\r\nউত্তর: গ\r\n৩৪. চিত্রে গ্লাসের পানি উপুড় করলেও নিচে না পড়ার মূল কারণ কোনটি?\r\n(ক) মহাশূন্যযান ও তার ভেতরের বস্তু একই ত্বরণে গতিশীল থাকা (খ) পানির ভর শূন্য হয়ে যাওয়া (গ) ওই স্থানে পৃথিবীর কোনো মহাকর্ষ বল না থাকা (ঘ) পানির ঘনত্ব কমে যাওয়া\r\nউত্তর: ক\r\n<b> নিচের চিত্রের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1785648511460e6i92","type":"image","value":"https://iili.io/CSc6rEG.jpg"},{"id":"block_1785648515992e52a4","type":"text","value":"৩৫. উদ্দীপকের নির্দেশিত উপায়ে লিফট নিচে নামার সময় আরোহীর অনুভূত ওজন কেমন হয়?\r\n(ক) প্রকৃত ওজনের চেয়ে বেশি (খ) প্রকৃত ওজনের চেয়ে কম (গ) প্রকৃত ওজনের সমান (ঘ) অসীম\r\nউত্তর: খ\r\n৩৬. উক্ত অবস্থায় লিফটের তারের টান সম্পর্কে কোনটি সঠিক?\r\n(ক) টান বাড়িয়ে দিতে হয় (খ) টান কমিয়ে দিতে হয় (গ) টান অপরিবর্তিত রাখতে হয় (ঘ) টান শূন্য করে দিতে হয়\r\nউত্তর: খ"},{"id":"block_17856485266247n72i","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:chocolate;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩৭. স্থির ও সমবেগে গতিশীল লিফটে অনুভূত ওজন সম্পর্কে বলা যায়—\ni. স্থির লিফটের ভেতরে আরোহীর অনুভূত ওজন তাঁর প্রকৃত ওজনের সমান হয়\nii. সমবেগে ওপরে গতিশীল লিফটে আরোহীর অনুভূত ওজন তাঁর প্রকৃত ওজনের চেয়ে বেশি হয়\niii. সমবেগে নিচে গতিশীল লিফটে আরোহী শুধু তাঁর প্রকৃত ওজন বা পৃথিবীর আকর্ষণ বল অনুভব করেন\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n৩৮. ওপরে ওঠার সময় ত্বরণযুক্ত লিফটের ক্ষেত্রে বিবেচনা করলে—\ni. লিফটের কেবল বা তারের সাহায্যে একটি অতিরিক্ত ঊর্ধ্বমুখী বল প্রয়োগ করা হয়\nii. লিফটের মেঝে আরোহীর ওপর প্রকৃত ওজনের চেয়ে বেশি বল প্রয়োগ করে\niii. আরোহীর অনুভূত ওজন তাঁর প্রকৃত ওজনের চেয়ে বেশি হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৯. মুক্তভাবে পড়ন্ত লিফটের ক্ষেত্রে—\ni. লিফটের তার ছিড়ে গেলে লিফটটি মুক্তভাবে নিচে পড়ে\nii. দড়িতে টান না থাকায় লিফটের মেঝে আরোহীর ওপর কোনো প্রতিক্রিয়া বল প্রয়োগ করে না\niii. আরোহী নিজেকে সম্পূর্ণ ওজনহীন অনুভব করেন\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪০. মহাশূন্যযানে ওজনহীনতার অনুভূতির ক্ষেত্রে—\ni. মহাশূন্যযান ও মহাশূন্যচারী উভয়েই একই ত্বরণে গতিশীল থাকে\nii. মহাশূন্যযানের দেয়ালের সাপেক্ষে মহাশূন্যচারীর ত্বরণ শূন্য হয়\niii. প্রকৃতপক্ষে ওই স্থানে মহাশূন্যচারীর ভর বা অভিকর্ষজ ত্বরণ কোনোটিই থাকে না\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪১. মহাশূন্যযানে বস্তুর আচরণ সম্পর্কে বলা যায়—\ni. মহাশূন্যযান থেকে কোনো বস্তুকে ছেড়ে দিলে তা নিচে পড়ে না\nii. গ্লাসের পানি উপুড় করলেও নিচে পড়বে না\niii. মহাশূন্যযান যদি স্থির দাঁড়িয়ে থাকে তবুও মহাশূন্যচারী ওজনহীনতা অনুভব করবেন\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n\n\n\n<span style=\"color:red;\"><center><b>————————🌸 সমাপ্ত 🌸————————</b></center></span>\n"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
