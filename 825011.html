    var dataset = [{"id":"topic_1784984661144pu1yk","title":"পাঠ: (১-৩)","blocks":[{"id":"block_1784984785770kv2oz","type":"text","value":"<span style=\"color:red;\"><b>📑\"মেধাস্থান বা পাশ করার জন্য নয় বরং জানার আগ্রহ নিয়ে পড়ো\"</b></span>\n<span style=\"color:indigo;\"><center><b>🌸 ----------<u>সাধারণ MCQ</u>---------- 🌸</b></center></span>\n১. সমন্বয় না থাকলে উদ্ভিদের জীবনে কী দেখা দেবে?\n(ক) সুপ্তাবস্থা (খ) বার্ধক্য (গ) বিশৃঙ্খলা (ঘ) অঙ্কুরোদগম\nউত্তর: গ\n২. উদ্ভিদের জীবন চক্রের পর্যায়গুলোর ক্ষেত্রে নিচের কোনটি সঠিক?\n(ক) অঙ্কুরোদগম, পুষ্পায়ন, ফল সৃষ্টি, বার্ধক্য প্রাপ্তি, সুপ্তাবস্থা \n(খ) শুধুমাত্র অঙ্কুরোদগম ও ফল সৃষ্টি \n(গ) শুধুমাত্র পুষ্পায়ন ও বার্ধক্য \n(ঘ) শ্বসন, প্রস্বেদন ও সালোকসংশ্লেষণ\nউত্তর: ক\n৩. উদ্ভিদের বৃদ্ধি ও চলনসহ বিভিন্ন শারীরবৃত্তীয় কাজ নিয়ন্ত্রণের জন্য দায়ী বিশেষ জৈব রাসায়নিক পদার্থকে কী বলে?\n(ক) এনজাইম (খ) ফাইটোহরমোন (গ) ভিটামিন (ঘ) খনিজ লবণ\nউত্তর: খ\n৪. ফাইটোহরমোনের অপর নাম কী?\n(ক) বৃদ্ধি প্রতিবন্ধক বস্তু (খ) বৃদ্ধিকারক বস্তু \n(গ) রাসায়নিক সার (ঘ) উদ্দীপক পদার্থ\nউত্তর: খ\n৫. ফাইটোহরমোন কোথায় উৎপন্ন হয়?\n(ক) কোষে (খ) বাতাসের সংস্পর্শে \n(গ) মাটির নিচে (ঘ) শুধুমাত্র ফলের ত্বকে\nউত্তর: ক\n৬. নিচের কোনটি উদ্ভিদের বৃদ্ধি সহায়ক হরমোন?\n(ক) অ্যাবসিসিক অ্যাসিড (খ) ইথিলিন \n(গ) অক্সিন (ঘ) কার্বন ডাইঅক্সাইড\nউত্তর: গ\n৭. নিচের কোনটি উদ্ভিদের বৃদ্ধি প্রতিবন্ধক হরমোন হিসেবে কাজ করে?\n(ক) অক্সিন (খ) জিব্বেরেলিন (গ) সাইটোকাইনিন (ঘ) ইথিলিন\nউত্তর: ঘ\n৮. পাতায় কোন হরমোন উৎপন্ন হয়?\n(ক) অক্সিন (খ) ফ্লোরিজেন (গ) জিব্বেরেলিন (ঘ) ইথিলিন\nউত্তর: খ\n৯. ফ্লোরিজেন হরমোন পত্রমূলে স্থানান্তরিত হয়ে পত্র মুকুলকে কিসে পরিণত করে?\n(ক) ফুল মুকুলে (খ) পুষ্পমুকুলে (গ) কন্দাল মূলে (ঘ) ফল মুকুলে\nউত্তর: খ\n১০. উদ্ভিদে ফুল উৎপন্ন করে কোন হরমোন?\n(ক) অক্সিন (খ) জিব্বেরেলিন (গ) ফ্লোরিজেন (ঘ) ইথিলিন\nউত্তর: গ\n১১. অক্সিন হরমোন প্রথম কে আবিষ্কার করেন?\n(ক) চার্লস ডারউইন (খ) ল্যামার্ক (গ) অ্যারিস্টটল (ঘ) মেন্ডেল\nউত্তর: ক\n১২. চার্লস ডারউইন উদ্ভিদের কোন অংশের উপর আলোর প্রভাব লক্ষ্য করেন?\n(ক) মূলরোমের উপর (খ) ভ্রূণমুকুলাবরণীর উপর \n(গ) পত্ররন্ধ্রের উপর (ঘ) কাণ্ডের ত্বকের উপর\nউত্তর: খ\n১৩. যখন আলো তীর্যকভাবে একদিকে লাগে তখন ভ্রূণমুকুলাবরণী কোন দিকে বাঁকা হয়ে বৃদ্ধি লাভ করে?\n(ক) আলোর উৎসের বিপরীত দিকে (খ) আলোর উৎসের দিকে \n(গ) নিচের দিকে (ঘ) কোনো পরিবর্তন হয় না\nউত্তর: খ\n১৪. ভ্রূণমুকুলাবরণীর অগ্রভাগে অবস্থিত বৃদ্ধি সহায়ক রাসায়নিক পদার্থটি কী ছিল?\n(ক) জিব্বেরেলিন (খ) ইথিলিন (গ) অক্সিন (ঘ) ফ্লোরিজেন\nউত্তর: গ\n১৫. অক্সিন প্রয়োগে নিচের কোনটি ঘটে?\n(ক) শাখা কলমে মূল গজায় \n(খ) ফলের অকালে ঝরেপড়া ত্বরান্বিত হয় \n(গ) উদ্ভিদ খাটো হয় (ঘ) ফুল উৎপাদন বন্ধ হয়\nউত্তর: ক\n১৬. ফলের অকালে ঝরেপড়া রোধ করতে কোনটি প্রয়োগ করা হয়?\n(ক) ইথিলিন (খ) অক্সিন \n(গ) অ্যাবসিসিক অ্যাসিড (ঘ) জিব্বেরেলিন\nউত্তর: খ\n১৭. চারাগাছ, বীজপত্র ও পত্রের বর্ধিষ্ণু অঞ্চলে কোন হরমোন দেখা যায়?\n(ক) জিব্বেরেলিন (খ) ইথিলিন (গ) অক্সিন (ঘ) ফ্লোরিজেন\nউত্তর: ক\n১৮. কোন হরমোনের প্রভাবে উদ্ভিদের পর্বমধ্যগুলো দৈর্ঘ্যে বৃদ্ধি পায়?\n(ক) অক্সিন (খ) জিব্বেরেলিন (গ) ইথিলিন (ঘ) সাইটোকাইনিন\nউত্তর: খ\n১৯. খাটো উদ্ভিদে কোন হরমোন প্রয়োগ করলে উদ্ভিদটি অন্যান্য সাধারণ উদ্ভিদ থেকেও অধিক লম্বা হয়?\n(ক) ইথিলিন (খ) অ্যাবসিসিক অ্যাসিড \n(গ) জিব্বেরেলিন (ঘ) ফ্লোরিজেন\nউত্তর: গ\n২০. বীজের সুপ্তাবস্থা কাটাতে নিচের কোন হরমোনের কার্যকারিতা রয়েছে?\n(ক) জিব্বেরেলিন (খ) ফ্লোরিজেন (গ) অক্সিন (ঘ) নাইট্রোজেন\nউত্তর: ক\n২১. নিচের কোন হরমোনটি একটি গ্যাসীয় পদার্থ?\n(ক) অক্সিন (খ) জিব্বেরেলিন (গ) সাইটোকাইনিন (ঘ) ইথিলিন\nউত্তর: ঘ\n২২. ফল পাকাতে সাহায্য করে কোন হরমোন?\n(ক) অক্সিন (খ) জিব্বেরেলিন (গ) ইথিলিন (ঘ) ফ্লোরিজেন\nউত্তর: গ\n২৩. ইথিলিন বীজ এবং মুকুলের কী ভঙ্গ করে?\n(ক) কোষ প্রাচীর (খ) সুপ্তাবস্থা (গ) বার্ধক্য (ঘ) ফুল সৃষ্টি\nউত্তর: খ\n২৪. চারা গাছের কাণ্ডের বৃদ্ধি ঘটিয়ে চারা গাছকে লম্বা হতে সাহায্য করে কোন হরমোন?\n(ক) অক্সিন (খ) ইথিলিন (গ) ফ্লোরিজেন (ঘ) সাইটোকাইনিন\nউত্তর: ক\n২৫. ইথিলিন নিচের কোনটির ঝরে পড়া ত্বরান্বিত করে?\n(ক) পাতা (খ) ফুল (গ) ফল (ঘ) পাতা, ফুল এবং ফল\nউত্তর: ঘ\n২৬. অভ্যন্তরীণ বা বাহ্যউদ্দীপক উদ্ভিদদেহে যে উদ্দীপনা সৃষ্টি করে, তার ফলে সৃষ্ট চলনকে কী বলা হয়?\n(ক) ট্যাকটিক চলন (খ) ট্রপিক চলন \n(গ) ন্যাস্টিক চলন (ঘ) রসস্ফীতি চলন\nউত্তর: খ\n২৭. উদ্ভিদের আলোকমুখিতার পরীক্ষা করার জন্য কোন ধরনের বোতল ব্যবহার করা হয়?\n(ক) কালো প্লাস্টিকের বোতল (খ) অস্বচ্ছ মাটির বোতল \n(গ) স্বচ্ছ কাচের বড় মুখযুক্ত বোতল (ঘ) টিনের বোতল\nউত্তর: গ\n২৮. আলোকমুখিতার পরীক্ষায় বোতলে চারাগাছটি এমনভাবে ঢোকাতে হবে যাতে মূলগুলো কিসে ডুবে থাকে?\n(ক) পুষ্টি দ্রবণে (খ) বিশুদ্ধ পানিতে (গ) এসিডে (ঘ) ক্ষার দ্রবণে\nউত্তর: ক\n২৯. আলোকমুখিতার পরীক্ষায় কত দিন পর চারাগাছের কাণ্ডের অংশ জানালার বাইরের দিকে বেঁকে যায়?\n(ক) ১/২ দিন (খ) ২/৩ দিন (গ) ৪/৫ দিন (ঘ) ৭/৮ দিন\nউত্তর: গ\n৩০. আলোকমুখিতার পরীক্ষায় উদ্ভিদের মূলগুলো কোন দিকে বেঁকে থাকে?\n(ক) আলোক উৎসের দিকে \n(খ) আলোক উৎসের বিপরীত দিকে \n(গ) ছিপির সমান্তরালে (ঘ) জানালার কাচের দিকে\nউত্তর: খ\n৩১. উদ্ভিদের আলোকমুখিতার পরীক্ষণ থেকে কী প্রমাণিত হয়?\n(ক) কাণ্ডে আলোকমুখী ও মূলে আলোকবিমুখী বৃদ্ধি ও চলন ঘটে \n(খ) কাণ্ডে আলোকবিমুখী ও মূলে আলোকমুখী বৃদ্ধি ও চলন ঘটে \n(গ) কাণ্ড ও মূল উভয়ই আলোকমুখী \n(ঘ) কাণ্ড ও মূল উভয়ই আলোকবিমুখী\nউত্তর: ক\n৩২. নিচের কোনটি এক ধরনের অক্সিন?\n(ক) জিব্বেরেলিক এসিড (খ) ইন্ডোল অ্যাসেটিক এসিড \n(গ) অ্যাবসিসিক এসিড (ঘ) ইথানয়িক এসিড\nউত্তর: খ\n৩৩. উদ্ভিদের ক্ষতস্থান পূরণে সাহায্য করে কোনটি?\n(ক) ইন্ডোল অ্যাসেটিক এসিড (খ) ইথিলিন \n(গ) জিব্বেরেলিন (ঘ) ফ্লোরিজেন\nউত্তর: ক\n৩৪. অক্সিন প্রয়োগে ফলের কী বিলম্বিত হয়?\n(ক) পেকে যাওয়া (খ) মোচন \n(গ) বৃদ্ধি (ঘ) ঝরে পড়া ত্বরান্বিত হওয়া\nউত্তর: খ\n৩৫. নিচের কোন উদ্দীপকগুলো উদ্ভিদের বৃদ্ধিকে প্রভাবিত করে?\n(ক) আলো, বাতাস ও মাটি \n(খ) আলো, পানি ও অভিকর্ষ \n(গ) নাইট্রোজেন, ফসফরাস ও পটাশিয়াম \n(ঘ) তাপ, চাপ ও আর্দ্রতা\nউত্তর: খ"},{"id":"block_17849849810670gqww","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</center></b></span>\n<span style=\"color:indigo;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</center></b></span>\n<b><u> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </u></b>\nরনি তার বাগানের একটি টবে একটি চারাগাছ রোপণ করে ঘরের জানালার পাশে রেখে দিল। কয়েকদিন পর সে লক্ষ্য করল, গাছটির কাণ্ড জানালার বাইরের দিকে অর্থাৎ আলোর উৎসের দিকে বেঁকে গেছে। কিন্তু টবটি উল্টে গিয়ে যখন মূলটি দেখা গেল, তখন দেখা গেল মূলটি আলোর বিপরীত দিকে বেঁকে বৃদ্ধি পেয়েছে।\n৩৬. উদ্দীপকে চারাগাছটির কাণ্ডে ও মূলে যে চলন ঘটেছে তাকে কী বলে?\n(ক) ট্যাকটিক চলন (খ) ট্রপিক চলন \n(গ) ন্যাস্টিক চলন (ঘ) রসস্ফীতি চলন\nউত্তর: খ\n৩৭. উদ্দীপকের পরীক্ষাটি থেকে কী প্রমাণিত হয়?\n(ক) কাণ্ডে আলোকবিমুখী ও মূলে আলোকমুখী চলন ঘটে\n(খ) কাণ্ডে আলোকমুখী ও মূলে আলোকবিমুখী চলন ঘটে\n(গ) কাণ্ড ও মূল উভয়ই আলোকমুখী\n(ঘ) কাণ্ড ও মূল কোনোটিই আলো দ্বারা প্রভাবিত হয় না\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও: </u></b>  \nবিজ্ঞান শিক্ষক ক্লাসে দুই ধরনের হরমোন নিয়ে আলোচনা করছিলেন। প্রথম হরমোনটি উদ্ভিদের ভ্রূণমুকুলাবরণীর অগ্রভাগে থাকে, যা শাখা কলমে মূল গজাতে এবং অকালে ফল ঝরে পড়া রোধে সাহায্য করে। দ্বিতীয় হরমোনটি একটি গ্যাসীয় পদার্থ, যা ফল পাকাতে সাহায্য করে এবং পাতা, ফুল ও ফলের ঝরে পড়া ত্বরান্বিত করে।\n৩৮. উদ্দীপকের প্রথম হরমোনটি চার্লস ডারউইন আবিষ্কার করেন। এর নাম কী?\n(ক) জিব্বেরেলিন (খ) ইথিলিন (গ) অক্সিন (ঘ) ফ্লোরিজেন\nউত্তর: গ\n৩৯. উদ্দীপকে উল্লেখিত দ্বিতীয় গ্যাসীয় হরমোনটির নাম কী?\n(ক) অক্সিন (খ) ইথিলিন \n(গ) সাইটোকাইনিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও: </u></b>    \nটমি তার বাগানের একটি খাটো জাতের উদ্ভিদের দ্রুত বৃদ্ধির জন্য একটি বিশেষ ফাইটোহরমোন প্রয়োগ করল। এর ফলে উদ্ভিদটি অন্যান্য সাধারণ উদ্ভিদ থেকেও অনেক বেশি লম্বা হয়ে গেল। অন্যদিকে, সে দেখল বাগানের কিছু উদ্ভিদের পাতায় অন্য একটি হরমোন উৎপন্ন হওয়ার কারণে সেগুলো পুষ্পমুকুলে পরিণত হয়ে ফুল ফোটাচ্ছে।\n৪০. টমি খাটো উদ্ভিদটি লম্বা করার জন্য কোন হরমোনটি প্রয়োগ করেছিল?\n(খ) অক্সিন (খ) ইথিলিন \n(গ) জিব্বেরেলিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: গ\n৪১. উদ্দীপকের শেষের অংশে পাতার পত্রমূলে স্থানান্তরিত হয়ে ফুল উৎপন্নকারী হরমোনটির নাম কী?\n(ক) সাইটোকাইনিন (খ) ফ্লোরিজেন \n(গ) অক্সিন (ঘ) জিব্বেরেলিন\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও: </u></b>    \nকৃষিবিদ আসিফ সাহেব তার ল্যাবরেটরিতে উদ্ভিদের বৃদ্ধি ও চলনসহ বিভিন্ন শারীরবৃত্তীয় কাজ সুশৃঙ্খলভাবে নিয়ন্ত্রণের জন্য 'ফাইটোহরমোন' বা বৃদ্ধিকারক বস্তু নিয়ে গবেষণা করছেন। তিনি গবেষণায় এক ধরনের বিশেষ অক্সিন ব্যবহার করলেন যা উদ্ভিদের ক্ষতস্থান পূরণে দারুণ ভূমিকা রাখে।\n৪২. উদ্ভিদের জীবনের সকল কাজ নিয়ন্ত্রণকারী এই ফাইটোহরমোন বা জৈব রাসায়নিক পদার্থটি কোথায় উৎপন্ন হয়?\n(ক) কোষে (খ) মাটিতে (গ) ফলমূলে (ঘ) বাতাসে\nউত্তর: ক\n৪৩. আসিফ সাহেবের গবেষণায় ব্যবহৃত ক্ষতস্থান পূরণে সাহায্যকারী বিশেষ অক্সিনটির নাম কী?\n(ক) জিব্বেরেলিক এসিড (খ) ইন্ডোল অ্যাসেটিক এসিড \n(গ) অ্যাবসিসিক এসিড (ঘ) সাইট্রিক এসিড\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও: </u></b>   "},{"id":"block_1784985198550vxq1h","type":"image","value":"https://iili.io/CO4krGa.md.jpg\" alt=\"CO4krGa.md.jpg"},{"id":"block_1784985297607esm31","type":"text","value":"৪৪. উদ্দীপকের চিত্রে প্রদর্শিত শাখা কলমে মূল গজাতে এবং ফলের অকালে ঝরেপড়া রোধ করতে কোন হরমোনটি সাহায্য করে?\n(ক) জিব্বেরেলিন (খ) ইথিলিন \n(গ) অক্সিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: গ\n৪৫. চার্লস ডারউইন উদ্ভিদের কোন অংশের ওপর আলোর প্রভাব লক্ষ্য করে এই হরমোনটি প্রথম আবিষ্কার করেন?\n(ক) পত্ররন্ধ্র (খ) ভ্রূণমুকুলাবরণী (গ) কাণ্ডের ত্বক (ঘ) মূলরোম\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪৬ ও ৪৭) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1784985349601jf4t5","type":"image","value":"https://iili.io/CO6F2wl.md.jpg"},{"id":"block_1784985392368by2ls","type":"text","value":"৪৬. উদ্ভিদের চারাগাছ, বীজপত্র ও পত্রের বর্ধিষ্ণু অঞ্চলে নিচের কোন হরমোনটি দেখা যায়?\n(ক) ইথিলিন (খ) জিব্বেরেলিন (গ) ফ্লোরিজেন (ঘ) অক্সিন\nউত্তর: খ\n৪৭. উদ্দীপকের চিত্রে প্রদর্শিত হরমোনটির প্রধান কার্যকারিতা নিচের কোনটি?\n(ক) ফল পাকানো (খ) ফলের অকালে ঝরেপড়া রোধ \n(গ) বীজের সুপ্তাবস্থা কাটানো (ঘ) ফুল উৎপন্ন করা\nউত্তর: গ\n<b><u> নিচের চিত্রের আলোকে (৪৮ ও ৪৯) নং প্রশ্নের উত্তর দাও: </u></b>  "},{"id":"block_17849854165891wp0s","type":"image","value":"https://iili.io/CO6aMbV.md.jpg"},{"id":"block_17849855031561546r","type":"text","value":"৪৮. উদ্দীপকের চিত্রে ফল পাকাতে সাহায্যকারী গ্যাসীয় হরমোনটির নাম কী?\n(ক) অক্সিন (খ) ইথিলিন (গ) সাইটোকাইনিন (ঘ) জিব্বেরেলিন\nউ ীদেহের যে তন্ত্র দেহের বিভিন্ন অঙ্গের সংযোগ রক্ষা করে, বিভিন্ন জৈবিক কার্যাবলীর সমন্বয় সাধন করে এবং উদ্দীপনায় সাড়া দিয়ে উপযুক্ত প্রতিবেদন সৃষ্টি করে, তাকে কী বলে?\n(ক) পেশীতন্ত্র (খ) কঙ্কালতন্ত্র (গ) স্নায়ুতন্ত্র (ঘ) পরিপাকতন্ত্র\nউত্তর: গ\n৪. স্নায়ুতন্ত্রের প্রধান অংশ কোনটি?\n(ক) নিউরন (খ) মস্তিষ্ক (গ) অ্যাক্সন (ঘ) মেরুরজ্জু\nউত্তর: খ\n৫. মানুষ সৃষ্টির সেরা জীব হিসেবে পরিগণিত হয় কেন?\n(ক) উন্নত মস্তিষ্কের কারণে (খ) উন্নত মেরুদণ্ডের কারণে \n(গ) বড় হৃদপিণ্ডের কারণে (ঘ) বেশি ওজনের কারণে\nউত্তর: ক\n৬. মস্তিষ্ক অসংখ্য যে বিশেষ কোষ দ্বারা গঠিত, তাদের কী বলা হয়?\n(ক) নেফ্রন (খ) লোহিত রক্তকণিকা \n(গ) নিউরন বা স্নায়ুকোষ (ঘ) শ্বেত রক্তকণিকা\nউত্তর: গ\n৭. স্নায়ুতন্ত্রের গাঠনিক ও কার্যকরী একককে কী বলে?\n(ক) টিস্যু (খ) নেফ্রন (গ) নিউরন (ঘ) হরমোন\nউত্তর: গ\n৮. মানবদেহের দীর্ঘতম কোষ কোনটি?\n(ক) যকৃত কোষ (খ) নিউরন (গ) পেশী কোষ (ঘ) লোহিত রক্তকণিকা\nউত্তর: খ\n৯. একটি নিউরন কয়টি প্রধান অংশ নিয়ে গঠিত?\n(ক) দুটি (খ) তিনটি (গ) চারটি (ঘ) পাঁচটি\nউত্তর: ক\n১০. নিউরনের প্রধান দুটি অংশ কী কী?\n(ক) কোষদেহ ও নিউক্লিয়াস (খ) কোষদেহ ও প্রলম্বিত অংশ \n(গ) অ্যাক্সন ও ডেনড্রন (ঘ) সাইটোপ্লাজম ও সিন্যাপস\nউত্তর: খ\n১১. নিউরনের প্রধান অংশ কোনটি?\n(ক) অ্যাক্সন (খ) ডেনড্রন (গ) কোষদেহ (ঘ) ডেনড্রাইট\nউত্তর: গ\n১২. নিউরনের কোষদেহ নিচের কোন আকৃতির হতে পারে?\n(ক) গোলাকার, ডিম্বাকার বা নক্ষত্রাকার \n(খ) শুধুমাত্র চৌকোণাকার \n(গ) নলাকার বা সূত্রাকার (ঘ) ত্রিভুজাকার\nউত্তর: ক\n১৩. কোষদেহ নিচের কোন কোন অংশ দ্বারা গঠিত?\n(ক) কোষ আবরণী, সাইটোপ্লাজম ও নিউক্লিয়াস \n(খ) শুধুমাত্র নিউক্লিয়াস ও সেন্ট্রিওল \n(গ) ডেনড্রন ও ডেনড্রাইট (ঘ) অ্যাক্সন ও সিন্যাপস\nউত্তর: ক\n১৪. নিউরনের কোষদেহে কোনটি থাকে না, যার কারণে এরা অন্যান্য কোষের মতো বিভাজিত হয় না?\n(ক) নিউক্লিয়াস (খ) সেন্ট্রিওল \n(গ) সাইটোপ্লাজম (ঘ) কোষ আবরণী\nউত্তর: খ\n১৫. কোষদেহ থেকে উৎপন্ন শাখা-প্রশাখাকে কী বলে?\n(ক) অ্যাক্সন (খ) ডেনড্রন (গ) প্রলম্বিত অংশ (ঘ) সিন্যাপস\nউত্তর: গ\n১৬. প্রলম্বিত অংশ কয় প্রকার?\n(ক) দুই (খ) তিন (গ) চার (ঘ) পাঁচ\nউত্তর: ক\n১৭. প্রলম্বিত অংশের প্রকার দুটি কী কী?\n(ক) কোষদেহ ও নিউক্লিয়াস (খ) অ্যাক্সন ও ডেনড্রন \n(গ) সাইটোপ্লাজম ও ডেনড্রাইট (ঘ) সিন্যাপস ও মায়েলিন সিথ\nউত্তর: খ\n১৮. কোষদেহ থেকে উৎপন্ন লম্বা সুতার মতো অংশকে কী বলে?\n(ক) ডেনড্রন (খ) ডেনড্রাইট (গ) অ্যাক্সন (ঘ) সিন্যাপস\nউত্তর: গ\n১৯. সাধারণত একটি নিউরনে কয়টি অ্যাক্সন থাকে?\n(ক) একটি মাত্র (খ) দুটি (গ) তিনটি (ঘ) অসংখ্য\nউত্তর: ক\n২০. কোষদেহের চারদিক থেকে উৎপন্ন শাখাগুলোকে কী বলে?\n(ক) অ্যাক্সন (খ) ডেনড্রন (গ) সিন্যাপস (ঘ) মায়েলিন সিথ\nউত্তর: খ\n২১. ডেনড্রন থেকে সৃষ্ট শাখাগুলোকে কী বলে?\n(ক) অ্যাক্সন (খ) ডেনড্রাইট (গ) কোষদেহ (ঘ) সিন্যাপস\nউত্তর: খ\n২২. ডেনড্রাইটের মাধ্যমে স্নায়ুতাড়না কোন দিকে পরিবাহিত হয়?\n(ক) নিউরনের দেহের দিকে \n(খ) নিউরনের দেহের বিপরীত দিকে \n(গ) রক্তের দিকে (ঘ) শুধুমাত্র মায়েলিন সিথের দিকে\nউত্তর: ক\n২৩. একটি স্নায়ুকোষের অ্যাক্সন অন্য একটি স্নায়ুকোষের ডেনড্রাইটের সাথে মিলিত হওয়ার স্থানকে কী বলে?\n(ক) সিন্যাপস (খ) সেন্ট্রিওল (গ) ডেনড্রন (ঘ) কোষদেহ\nউত্তর: ক\n২৪. কিসের মাধ্যমে স্নায়ুতাড়না এক স্নায়ুকোষ থেকে অন্য স্নায়ুকোষে পরিবাহিত হয়?\n(ক) রক্ত (খ) লিম্ফ (গ) সিন্যাপস (ঘ) হরমোন\nউত্তর: গ\n২৫. উদ্দীপনা বহন করা, মস্তিষ্ক স্মৃতিধারণ করা, চিন্তা করা ও বিভিন্ন কাজের নির্দেশ দেওয়া কার কাজ?\n(ক) হৃদপিণ্ডের (খ) নিউরনের (গ) ফুসফুসের (ঘ) যকৃতের\nউত্তর: খ\n২৬. স্নায়ুতন্ত্রের উদ্দীপনা বহনের প্রবাহ চিত্রে চোখ, কান, নাক, জিহ্বা, ত্বক থেকে কেন্দ্রীয় স্নায়ুতন্ত্রে উদ্দীপনা পরিবহন করে কোন তন্তু?\n(ক) আজ্ঞাবাহী নিউরন তন্তু (খ) সংবেদী নিউরন তন্তু \n(গ) রক্তবাহিকা তন্তু (ঘ) পেশী তন্তু\nউত্তর: খ\n২৭. স্নায়ুতন্ত্রের উদ্দীপনা বহনের প্রবাহ চিত্রে কেন্দ্রীয় স্নায়ুতন্ত্র থেকে উদ্দীপনা শরীরের সংশ্লিষ্ট অংশে পরিবহন করে কোন তন্তু?\n(ক) সংবেদী নিউরন তন্তু (খ) আজ্ঞাবাহী নিউরন তন্তু \n(গ) লসিকা তন্তু (ঘ) পেশী তন্তু\nউত্তর: খ\n২৮. স্নায়ুতন্ত্রকে কয় ভাগে ভাগ করা হয়?\n(ক) দুই ভাগে (খ) তিন ভাগে (গ) চার ভাগে (ঘ) পাঁচ ভাগে\nউত্তর: খ\n২৯. নিচের কোনটি স্নায়ুতন্ত্রের ভাগের অন্তর্ভুক্ত?\n(ক) কেন্দ্রীয় স্নায়ুতন্ত্র, প্রান্তীয় স্নায়ুতন্ত্র ও স্বয়ংক্রিয় স্নায়ুতন্ত্র \n(খ) শুধুমাত্র কেন্দ্রীয় ও প্রান্তীয় স্নায়ুতন্ত্র \n(গ) রক্ত সংবহনতন্ত্র ও রেচনতন্ত্র \n(ঘ) ঐচ্ছিক ও অনৈচ্ছিক স্নায়ুতন্ত্র\nউত্তর: ক"},{"id":"block_1785084739009pi7wn","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b><u> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও: </u></b>    \nসিয়াম পরীক্ষায় ভালো ফল করায় তার বাবা-মা অনেক আনন্দিত হলেন এবং সিয়াম খুশিতে কেঁদে ফেলল। তার শিক্ষক বললেন, মানবদেহের একটি বিশেষ তন্ত্রের কারণে আমরা পরিবেশের উদ্দীপনায় এভাবে সাড়া দিতে পারি এবং এই তন্ত্রের প্রধান অংশের কারণেই মানুষ সৃষ্টির সেরা জীব।\n৩০. উদ্দীপকে সিয়ামের খুশিতে কেঁদে ফেলার মতো ঘটনাগুলো কিসের কার্যকারিতার ফলে ঘটে?\n(ক) হরমোনের (খ) বিভিন্ন উদ্দীপকের \n(গ) এনজাইমের (ঘ) রক্তচাপের\nউত্তর: খ\n৩১. শিক্ষকের ইঙ্গিত করা তন্ত্রটির প্রধান অংশের নাম কী?\n(ক) নিউরন (খ) মস্তিষ্ক (গ) মেরুরজ্জু (ঘ) অ্যাক্সন\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও: </u></b>    \nঅমি ল্যাবরেটরিতে মানবদেহের দীর্ঘতম কোষটি পর্যবেক্ষণ করছিল। সে দেখল কোষটির প্রধান অংশটি দেখতে নক্ষত্রাকার এবং এর ভেতরে সাইটোপ্লাজম ও নিউক্লিয়াস থাকলেও একটি বিশেষ অঙ্গাণু অনুপস্থিত। এই অনুপস্থিতির কারণে কোষটি অন্যান্য সাধারণ কোষের মতো বিভাজিত হতে পারে না।\n৩২. অমি ল্যাবরেটরিতে যে কোষটি দেখছিল, তার নাম কী?\n(ক) নেফ্রন (খ) লোহিত রক্তকণিকা \n(গ) নিউরন বা স্নায়ুকোষ (ঘ) পেশীকোষ\nউত্তর: গ\n৩৩. কোষটিতে কোন অঙ্গাণুটি না থাকার কারণে এটি বিভাজিত হয় না?\n(ক) নিউক্লিয়াস (খ) সেন্ট্রিওল \n(গ) মাইটোকন্ড্রিয়া (ঘ) সাইটোপ্লাজম\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও: </u></b>    \nসাজিদ বিজ্ঞানের বইয়ে একটি চিত্র দেখছিল যেখানে একটি স্নায়ুকোষের লম্বা সুতার মতো অংশটি আরেকটি স্নায়ুকোষের ডেনড্রন থেকে সৃষ্ট ছোট শাখাগুলোর সাথে মিলিত হয়েছে। শিক্ষক বললেন, এই বিশেষ মিলনস্থলের মাধ্যমেই স্নায়ুতাড়না এক কোষ থেকে অন্য কোষে পরিবাহিত হয়।\n৩৪. উদ্দীপকের বর্ণনা অনুযায়ী, স্নায়ুকোষের লম্বা সুতার মতো অংশটিকে কী বলা হয়?\n(ক) ডেনড্রন (খ) ডেনড্রাইট (গ) অ্যাক্সন (ঘ) মায়েলিন সিথ\nউত্তর: গ\n৩৫. উদ্দীপকে উল্লেখিত দুইটি স্নায়ুকোষের মিলনস্থলকে কী বলা হয়?\n(ক) সেন্ট্রিওল (খ) সিন্যাপস (গ) কোষদেহ (ঘ) প্রলম্বিত অংশ\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও: </u></b>    \nসুমি গরম চায়ের কাপে হাত দিতেই দ্রুত হাতটি সরিয়ে নিল। তার বিজ্ঞান শিক্ষক একটি প্রবাহচিত্রের সাহায্যে বোঝালেন যে, ত্বক থেকে একটি বিশেষ নিউরন তন্তুর মাধ্যমে উদ্দীপনা প্রথমে কেন্দ্রীয় স্নায়ুতন্ত্রে পৌঁছায় এবং সেখান থেকে অন্য একটি তন্তুর মাধ্যমে শরীরের সংশ্লিষ্ট অংশে নির্দেশ আসে। শিক্ষক আরও জানালেন, পুরো স্নায়ুতন্ত্রটি প্রধানত তিন ভাগে বিভক্ত।\n৩৬. উদ্দীপকের বর্ণনা ও বইয়ের প্রবাহচিত্র অনুযায়ী, ত্বক থেকে কেন্দ্রীয় স্নায়ুতন্ত্রে উদ্দীপনা পরিবহন করে কোন তন্তু?\n(ক) আজ্ঞাবাহী নিউরন তন্তু (খ) সংবেদী নিউরন তন্তু \n(গ) লসিকা তন্তু (ঘ) পেশী তন্তু\nউত্তর: খ\n৩৭. উদ্দীপকে শিক্ষকের উল্লেখিত স্নায়ুতন্ত্রের তিন ভাগের মধ্যে কেন্দ্রীয় স্নায়ুতন্ত্র ছাড়া বাকি দুটি ভাগ কী কী?\n(ক) ঐচ্ছিক ও অনৈচ্ছিক স্নায়ুতন্ত্র \n(খ) সংবেদী ও আজ্ঞাবাহী স্নায়ুতন্ত্র \n(গ) প্রান্তীয় স্নায়ুতন্ত্র ও স্বয়ংক্রিয় স্নায়ুতন্ত্র \n(ঘ) কোষদেহ ও প্রলম্বিত স্নায়ুতন্ত্র\nউত্তর: গ\n<b><u> নিচের চিত্রের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785084789466hhk6i","type":"image","value":"https://iili.io/CO6pt8Q.md.jpg"},{"id":"block_1785084806315v2cl5","type":"text","value":"৩৮. চিত্রে 'A' চিহ্নিত অংশের আকৃতি নিচের কোনটি হতে পারে?\n(ক) গোলাকার, ডিম্বাকার বা নক্ষত্রাকার (খ) শুধুমাত্র নলাকার \n(গ) চৌকোণাকার (ঘ) ত্রিভুজাকার\nউত্তর: ক\n৩৯. 'A' চিহ্নিত অংশে নিচের কোনটি থাকে না বলে এটি অন্যান্য সাধারণ কোষের মতো বিভাজিত হয় না?\n(ক) নিউক্লিয়াস (খ) সাইটোপ্লাজম \n(গ) সেন্ট্রিওল (ঘ) কোষ আবরণী\nউত্তর: গ\n<b><u> নিচের চিত্রের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785084847092djp0t","type":"image","value":"https://iili.io/COPdAL7.md.jpg"},{"id":"block_17850848513009z853","type":"text","value":"৪০. চিত্রে 'X' চিহ্নিত লম্বা সুতার মতো অংশটির নাম কী?\n(ক) ডেনড্রন (খ) ডেনড্রাইট (গ) অ্যাক্সন (ঘ) সিন্যাপস\nউত্তর: গ\n৪১. চিত্রে 'Y' চিহ্নিত ডেনড্রন থেকে সৃষ্ট শাখাগুলোকে কী বলে, যার দ্বারা স্নায়ুতাড়না নিউরনের দেহের দিকে পরিবাহিত হয়?\n(ক) অ্যাক্সন (খ) ডেনড্রাইট \n(গ) মায়েলিন সিথ (ঘ) র্যানভিয়ারের পর্ব\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785084904204h0aa9","type":"image","value":"https://iili.io/COPqQyu.md.jpg"},{"id":"block_1785084906557dxhap","type":"text","value":"৪২. চিত্রে 'P' দ্বারা নির্দেশিত মিলনস্থলটিকে কী বলা হয়?\n(ক) সেন্ট্রিওল (খ) ডেনড্রন (গ) সিন্যাপস (ঘ) কোষদেহ\nউত্তর: গ\n৪৩. উদ্দীপকের চিত্রে প্রদর্শিত 'P' এর প্রধান কাজ কী?\n(ক) কোষ বিভাজন করা \n(খ) এক স্নায়ুকোষ থেকে অন্য স্নায়ুকোষে স্নায়ুতাড়না পরিবাহিত করা \n(গ) রক্ত তৈরি করা (ঘ) হরমোন নিঃসরণ করা\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785084963671bdhnt","type":"image","value":"https://iili.io/COPoiVj.md.jpg"},{"id":"block_1785084966843k1204","type":"text","value":"৪৪. চিত্রে 'M' চিহ্নিত পথটি দিয়ে কোন তন্তু উদ্দীপনা পরিবহন করে?\n(ক) আজ্ঞাবাহী নিউরন তন্তু (খ) সংবেদী নিউরন তন্তু \n(গ) পেশী তন্তু (ঘ) রক্তবাহিকা তন্তু\nউত্তর: খ\n৪৫. চিত্রে 'N' চিহ্নিত পথটি মূলত কোন কাজটির নির্দেশ করে?\n(ক) চোখ বা ত্বক থেকে কেন্দ্রীয় স্নায়ুতন্ত্রে উদ্দীপনা নেওয়া \n(খ) কেন্দ্রীয় স্নায়ুতন্ত্র থেকে আজ্ঞাবাহী নিউরন তন্তুর মাধ্যমে উদ্দীপনা সংশ্লিষ্ট অংশে পরিবহন করা \n(গ) পরিবেশের তাপমাত্রা পরিমাপ করা \n(ঘ) রক্ত সংবহন সচল রাখা\nউত্তর: খ"},{"id":"block_178508498412762z7v","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৪৬. স্নায়ুতন্ত্রের প্রধান কাজগুলোর অন্তর্ভুক্ত হলো—\ni. দেহের বিভিন্ন অংশের উদ্দীপনা বহন করা\nii. দেহের বিভিন্ন অঙ্গের কাজের সমন্বয় সাধন করা\niii. পরিবেশের সাথে সম্পর্ক রাখা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৭. স্নায়ুকোষ বা নিউরনের বৈশিষ্ট্য হলো—\ni. এটি স্নায়ুতন্ত্রের গাঠনিক ও কার্যকরী একক\nii. এটি মানবদেহের দীর্ঘতম কোষ\niii. এটি কোষদেহ ও প্রলম্বিত অংশ নিয়ে গঠিত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৮. নিউরনের কোষদেহের ক্ষেত্রে কোন তথ্যগুলো সঠিক?\ni. এটি গোলাকার, ডিম্বাকার বা নক্ষত্রাকার হতে পারে\nii. এটি কোষ আবরণী, সাইটোপ্লাজম ও নিউক্লিয়াস দ্বারা গঠিত\niii. এতে সেন্ট্রিওল থাকে না বলে এটি বিভাজিত হয় না\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৯. প্রলম্বিত অংশের বিবরণ অনুযায়ী—\ni. কোষদেহ থেকে উৎপন্ন শাখা-প্রশাখাকে প্রলম্বিত অংশ বলে\nii. প্রলম্বিত অংশ দুই প্রকার, যথা- অ্যাক্সন ও ডেনড্রন\niii. সাধারণত একটি নিউরনে একাধিক অ্যাক্সন থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫০. ডেনড্রন ও ডেনড্রাইটের ক্ষেত্রে সঠিক তথ্য হলো—\ni. কোষদেহের চারদিক থেকে উৎপন্ন শাখাগুলোকে ডেনড্রন বলে\nii. ডেনড্রন থেকে সৃষ্ট শাখাগুলোকে ডেনড্রাইট বলে\niii. এদের দ্বারা স্নায়ুতাড়না নিউরনের দেহের দিকে পরিবাহিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫১. সিন্যাপস (Synapse) সম্পর্কে সঠিক উক্তি হলো—\ni. একটি স্নায়ুকোষের অ্যাক্সন অন্য একটি স্নায়ুকোষের ডেনড্রাইটের সাথে মিলিত হওয়ার স্থানকে সিন্যাপস বলে\nii. সিন্যাপসের মাধ্যমে স্নায়ুতাড়না এক স্নায়ুকোষ থেকে অন্য স্নায়ুকোষে পরিবাহিত হয়\niii. এটি কোষদেহকে সরাসরি বিভাজিত হতে সাহায্য করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫২. নিউরনের কাজগুলোর অন্তর্ভুক্ত হলো—\ni. উদ্দীপনা বহন করা ও স্মৃতিধারণ করা\nii. চিন্তা করা ও বিভিন্ন কাজের নির্দেশ দেওয়া\niii. রক্তের মাধ্যমে হরমোন উৎপাদন করা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৩. স্নায়ুতন্ত্রের উদ্দীপনা বহন প্রক্রিয়ায়—\ni. সংবেদী নিউরন তন্তু চোখ, কান, নাক, জিহ্বা, ত্বক থেকে উদ্দীপনা বহন করে\nii. আজ্ঞাবাহী নিউরন তন্তু কেন্দ্রীয় স্নায়ুতন্ত্র থেকে উদ্দীপনা পরিবহন করে\niii. উদ্দীপনা সরাসরি রক্তবাহিকার মাধ্যমে পরিবাহিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৪. স্নায়ুতন্ত্রকে যে যে ভাগে ভাগ করা হয়—\ni. কেন্দ্রীয় স্নায়ুতন্ত্র ii. প্রান্তীয় স্নায়ুতন্ত্র  iii. স্বয়ংক্রিয় স্নায়ুতন্ত্র\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৫. মানবদেহে বিভিন্ন উদ্দীপকের কার্যকারিতার ফলে ঘটে—\ni. কারো দুঃখে কান্না পাওয়া ii. কারো খুশিতে খুশি হওয়া\niii. পরীক্ষায় ভালো ফল করলে আনন্দ হওয়া\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"}]},{"id":"topic_1785085229159nzox3","title":"পাঠ: (৬-৭)","blocks":[{"id":"block_1785085419463exma8","type":"text","value":"<span style=\"color:royalblue;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. কেন্দ্রীয় স্নায়ুতন্ত্রের অংশ হলো কোনটি?\n(ক) মস্তিষ্ক ও মেরুরজ্জু (খ) হৃদপিণ্ড ও ফুসফুস \n(গ) অ্যাক্সন ও ডেনড্রন (ঘ) বৃক্ক ও যকৃত\nউত্তর: ক\n২. সমগ্র স্নায়ুতন্ত্রের চালক কোনটি?\n(ক) স্নায়ুকোষ (খ) মস্তিষ্ক (গ) রক্ত (ঘ) মেরুরজ্জু\nউত্তর: খ\n৩. মানুষের মস্তিষ্ক কিসের মধ্যে সুরক্ষিত থাকে?\n(ক) মেকি গহ্বর (খ) করোটি (গ) বক্ষগহ্বর (ঘ) মেসোডার্ম\nউত্তর: খ\n৪. মানুষের মস্তিষ্ক কোন পর্দা দ্বারা আবৃত থাকে?\n(ক) প্লেওরা (খ) পেরিকার্ডিয়াম (গ) মেটে (ঘ) মেনিনজেস\nউত্তর: ঘ\n৫. মানুষের মস্তিষ্কের প্রধান অংশ কয়টি?\n(ক) ২টি (খ) ৩টি (গ) ৪টি (ঘ) ৫টি\nউত্তর: খ\n৬. মস্তিষ্কের প্রধান অংশ কোনটি?\n(ক) গুরুমস্তিষ্ক বা সেরিব্রাম (খ) মধ্যমস্তিষ্ক \n(গ) পন্স (ঘ) মেডুলা\nউত্তর: ক\n৭. গুরুমস্তিষ্ক কোন দুই খণ্ডে বিভক্ত?\n(ক) ঊর্ধ্ব ও নিম্ন খণ্ড (খ) ডান ও বাম সেরিব্রাল সেমিফিয়ার \n(গ) ডান ও বাম সেরিব্রাল হেমিসফিয়ার \n(ঘ) অগ্র ও পশ্চাৎ খণ্ড\nউত্তর: গ\n৮. মানব মস্তিষ্কে সেরিব্রাল হেমিসফিয়ার কেমন?\n(ক) সুগঠিত ও চ্যাপ্টা (খ) অধিকতর উন্নত ও সুগঠিত \n(গ) অপেক্ষাকৃত ছোট ও অনুন্নত (ঘ) মসৃণ ও গোলাকার\nউত্তর: খ\n৯. গুরুমস্তিষ্কের উপরিভাগ দেখতে কেমন ও কোন বর্ণের?\n(ক) মসৃণ ও লাল বর্ণের (খ) ঢেউ তোলা ও ধূসর বর্ণের \n(গ) চ্যাপ্টা ও সাদা বর্ণের (ঘ) খাঁজকাটা ও কালো বর্ণের\nউত্তর: খ\n১০. গুরুমস্তিষ্কের উপরিভাগ ধূসর বর্ণের হওয়ায় একে কী বলে?\n(ক) হোয়াইট ম্যাটার (খ) গ্রে ম্যাটার বা ধূসর পদার্থ \n(গ) পন্স (ঘ) সেরেবেলাম\nউত্তর: খ\n১১. গুরুমস্তিষ্কের অন্তঃস্তরে কী থাকে?\n(ক) কেবলমাত্র স্নায়ুতন্তু (খ) রক্তকণিকা \n(গ) পন্স (ঘ) সাইটোপ্লাজম\nউত্তর: ক\n১২. গুরুমস্তিষ্কের ভেতরের স্তরের নাম কী?\n(ক) গ্রে ম্যাটার (খ) শ্বেত পদার্থ বা হোয়াইট ম্যাটার \n(গ) সেরিব্রাল হেমিসফিয়ার (ঘ) করোটি\nউত্তর: খ\n১৩. শ্বেত পদার্থের ভেতর দিয়ে কোনটি এক স্থান থেকে অন্য স্থানে যায়?\n(ক) রক্ত (খ) স্নায়ুতন্তু (গ) হরমোন (ঘ) সাইটোপ্লাজম\nউত্তর: খ\n১৪. দর্শন, শ্রবণ, ঘ্রাণ, চিন্তা-চেতনা, স্মৃতি, জ্ঞান, বুদ্ধি, বিবেক ও পেশি চালনার ক্রিয়াকেন্দ্র কোথায় অবস্থিত?\n(ক) লঘুমস্তিষ্কে (খ) মধ্যমস্তিষ্কে (গ) গুরুমস্তিষ্কে (ঘ) মেডুলায়\nউত্তর: গ\n১৫. সেরিব্রামের নিচের অংশ কোনটি?\n(ক) পন্স ও মেডুলা (খ) থালামাস ও হাইপোথালামাস \n(গ) সেরেবেলাম (ঘ) সুষুম্নাশীর্ষক\nউত্তর: খ\n১৬. ক্রোধ, লজ্জা, গরম, শীত, নিদ্রা, তাপ সংরক্ষণ ও শাসন কোন অংশের কাজ?\n(ক) সেরেবেলাম (খ) থালামাস ও হাইপোথালামাস \n(গ) পন্স (ঘ) মেডুলা\nউত্তর: খ\n১৭. গুরুমস্তিষ্ক ও পন্স-এর মাঝখানে কোনটি অবস্থিত?\n(ক) মধ্যমস্তিষ্ক (খ) সেরেবেলাম (গ) সুষুম্নাশীর্ষক (ঘ) থালামাস\nউত্তর: ক\n১৮. মধ্যমস্তিষ্কের মূল কাজ কিসের সাথে সম্পর্কিত?\n(ক) চিন্তা-চেতনা ও স্মৃতি (খ) দৃষ্টিশক্তি ও শ্রবণশক্তি \n(গ) দেহের ভারসাম্য রক্ষা (ঘ) হৃদস্পন্দন নিয়ন্ত্রণ\nউত্তর: খ\n১৯. পশ্চাৎ বা লঘুমস্তিষ্ক কোথায় অবস্থিত?\n(ক) গুরুমস্তিষ্কের ওপরে (খ) গুরুমস্তিষ্কের নিচে ও পশ্চাতে \n(গ) পন্সের নিচে (ঘ) মেডুলার ভেতরে\nউত্তর: খ\n২০. দেহের ভারসাম্য রক্ষা করা মস্তিষ্কের কোন অংশের প্রধান কাজ?\n(ক) গুরুমস্তিষ্ক (খ) পশ্চাৎ বা লঘুমস্তিষ্ক \n(গ) মধ্যমস্তিষ্ক (ঘ) হাইপোথালামাস\nউত্তর: খ\n২১. লঘুমস্তিষ্কের অংশ কয়টি?\n(ক) ২টি (খ) ৩টি (গ) ৪টি (ঘ) ৫টি\nউত্তর: খ\n২২. লঘুমস্তিষ্কের তিনটি অংশ কী কী?\n(ক) সেরিব্রাম, থালামাস, হাইপোথালামাস \n(খ) সেরেবেলাম, পন্স, মেডুলা বা সুষুম্নাশীর্ষক \n(গ) মধ্যমস্তিষ্ক, পন্স, করোটি \n(ঘ) গ্রে ম্যাটার, হোয়াইট ম্যাটার, মেনিনজেস\nউত্তর: খ\n২৩. পন্সের বিপরীতদিকে অবস্থিত ঝুলন্ত অবস্থায় থাকা খণ্ডটির নাম কী?\n(ক) সেরেবেলাম (খ) মেডুলা (গ) থালামাস (ঘ) গুরুমস্তিষ্ক\nউত্তর: ক\n২৪. লঘুমস্তিষ্কের সামনে ও নিচে অবস্থিত অংশকে কী বলে, যাকে মস্তিষ্কের যোজক বলা হয়?\n(ক) সেরেবেলাম (খ) পন্স (গ) মেডুলা (ঘ) হাইপোথালামাস\nউত্তর: খ\n২৫. গুরুমস্তিষ্ক, লঘুমস্তিষ্ক ও মধ্যমস্তিষ্ককে সুষুম্নাশীর্ষকের সাথে সংযোজিত করে কোনটি?\n(ক) থালামাস (খ) পন্স (গ) সেরেবেলাম (ঘ) করোটি\nউত্তর: খ\n২৬. মস্তিষ্কের কোন অংশকে মস্তিষ্কের বোঁটা বলা হয়?\n(ক) পন্স (খ) মেডুলা বা সুষুম্নাশীর্ষক \n(গ) সেরেবেলাম (ঘ) থালামাস\nউত্তর: খ\n২৭. সুষুম্নাশীর্ষক মস্তিষ্ককে কিসের সাথে সংযোজিত করে?\n(ক) গুরুমস্তিষ্কের সাথে (খ) মেরুরজ্জুর সাথে \n(গ) কান ও চোখের সাথে (ঘ) করোটিক স্নায়ুর সাথে\nউত্তর: খ\n২৮. হৃদস্পন্দন, খাদ্যগ্রহণ ও শ্বসন ইত্যাদি কাজ নিয়ন্ত্রণ করে মস্তিষ্কের কোন অংশ?\n(ক) গুরুমস্তিষ্ক (খ) মেডুলা বা সুষুম্নাশীর্ষক \n(গ) থালামাস (ঘ) সেরেবেলাম\nউত্তর: খ"},{"id":"block_1785085589479kbs1b","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:royalblue;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b><u> নিচের তথ্যের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও: </u></b>    \nরহিম সাহেব হঠাৎ মাথায় আঘাত পেয়ে হাসপাতালে ভর্তি হলেন। ডাক্তার পরীক্ষার পর জানালেন, তার মস্তিষ্কের যে অংশটি চিন্তা-চেতনা, স্মৃতি, জ্ঞান ও বুদ্ধি নিয়ন্ত্রণ করে সেই অংশটি নিরাপদ আছে। তবে মস্তিষ্কের আবরণী পর্দায় সামান্য আঘাত লেগেছে।\n২৯. মানুষের মস্তিষ্ককে আবৃত করে রাখা পর্দাটির নাম কী?\n(ক) পেরিকার্ডিয়াম (খ) মেনিনজেস (গ) প্লেওরা (ঘ) পন্স\nউত্তর: খ\n৩০. উদ্দীপকে রহিম সাহেবের আঘাত থেকে বেঁচে যাওয়া মস্তিষ্কের প্রধান অংশটির নাম কী?\n(ক) গুরুমস্তিষ্ক (খ) মধ্যমস্তিষ্ক (গ) লঘুমস্তিষ্ক (ঘ) মেডুলা\nউত্তর: ক\n<b><u> নিচের তথ্যের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও: </u></b>    \nঅয়ন ক্রিকেট খেলার সময় হঠাৎ ভারসাম্য হারিয়ে পড়ে গেল। তার শিক্ষক তাকে বললেন, দেহের ভারসাম্য রক্ষা করার পেছনে মস্তিষ্কের একটি বিশেষ অংশের প্রধান ভূমিকা রয়েছে। আবার অতিরিক্ত গরমে অয়নের যে অস্বস্তি হচ্ছিল, তা মস্তিষ্কের অন্য একটি অংশের অন্তর্গত থালামাস ও হাইপোথালামাস দ্বারা নিয়ন্ত্রিত হয়।\n৩১. অয়নের দেহের ভারসাম্য রক্ষা করার কাজটি মস্তিষ্কের কোন অংশের প্রধান কাজ?\n(ক) গুরুমস্তিষ্ক (খ) পশ্চাৎ বা লঘুমস্তিষ্ক \n(গ) মধ্যমস্তিষ্ক (ঘ) সুষুম্নাশীর্ষক\nউত্তর: খ\n৩২. উদ্দীপকে উল্লেখিত থালামাস ও হাইপোথালামাস মস্তিষ্কের কোন অংশের নিচে অবস্থিত?\n(ক) সেরেবেলাম (খ) সেরিব্রাম (গ) পন্স (ঘ) মেডুলা\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও: </u></b>    \nআজমল বিজ্ঞান ক্লাসে মানুষের মস্তিষ্কের চিত্র পর্যবেক্ষণ করছিল। সে দেখল লঘুমস্তিষ্কের পন্স নামক অংশটিকে 'মস্তিষ্কের যোজক' বলা হয়। আর পন্সের নিম্নাংশ থেকে মেরুরজ্জুর উপরিভাগ পর্যন্ত বিস্তৃত অংশটি হৃদস্পন্দন, খাদ্যগ্রহণ ও শ্বসন নিয়ন্ত্রণ করে।\n৩৩. উদ্দীপকের তথ্য অনুযায়ী মস্তিষ্কের কোন অংশকে 'মস্তিষ্কের যোজক' বলা হয়?\n(ক) পন্স (খ) সেরেবেলাম (গ) মেডুলা (ঘ) থালামাস\nউত্তর: ক\n৩৪. আজমলের দেখা হৃদস্পন্দন, খাদ্যগ্রহণ ও শ্বসন নিয়ন্ত্রণকারী অংশটিকে কী বলা হয়?\n(ক) সেরিব্রাম (খ) সুষুম্নাশীর্ষক বা মেডুলা \n(গ) হাইপোথালামাস (ঘ) সেরিব্রাল হেমিসফিয়ার\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও: </u></b>    \nঅনন্যা বইয়ে মস্তিষ্কের একটি খণ্ড বা অংশের ছবি দেখছিল। সে লক্ষ্য করল অংশটির উপরিভাগ ঢেউ তোলা ও ধূসর বর্ণের, কিন্তু এর ভিতরের স্তরটি সাদা বা শ্বেত পদার্থের মতো। শিক্ষিকা বুঝিয়ে বললেন, এটিই মানব মস্তিষ্কের সবচেয়ে উন্নত অংশ যা ডান ও বাম দুটি খণ্ডে বিভক্ত।\n৩৫. উদ্দীপকে অনন্যার দেখা ধূসর বর্ণের উপরিভাগটিকে কী বলা হয়?\n(ক) শ্বেত পদার্থ (খ) ধূসর পদার্থ বা গ্রে ম্যাটার \n(গ) পন্স (ঘ) মেনিনজেস\nউত্তর: খ\n৩৬. উদ্দীপকে উল্লেখিত ডান ও বাম দুটি খণ্ডকে কী বলা হয়?\n(ক) সেরিব্রাল হেমিসফিয়ার (খ) সেরেবেলাম \n(গ) থালামাস (ঘ) করোটি\nউত্তর: ক\n<b><u> নিচের চিত্রের আলোকে (৩৭ ও ৩৮) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785085638806skz1p","type":"image","value":"https://iili.io/CenVrWQ.md.jpg"},{"id":"block_17850856428760lsk4","type":"text","value":"৩৭. চিত্রে 'A' চিহ্নিত অংশের নাম কী?\n(ক) গুরুমস্তিষ্ক বা সেরিব্রাম (খ) লঘুমস্তিষ্ক \n(গ) মধ্যমস্তিষ্ক (ঘ) মেডুলা\nউত্তর: ক\n৩৮. উদ্দীপকের 'A' চিহ্নিত অংশটির প্রধান কাজ কোনটি?\n(ক) দেহের ভারসাম্য রক্ষা করা \n(খ) চিন্তা-চেতনা, স্মৃতি, জ্ঞান ও বুদ্ধি নিয়ন্ত্রণ করা \n(গ) হৃদস ুতন্ত্রের অন্তর্ভুক্ত হলো—\ni. মস্তিষ্ক ii. মেরুরজ্জু iii. স্নায়ুকোষ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৬. মানুষের মস্তিষ্কের গঠনগত বৈশিষ্ট্য হলো—\ni. এটি করোটির মধ্যে সুরক্ষিত থাকে\nii. এটি মেনিনজেস নামক পর্দা দ্বারা আবৃত\niii. এর প্রধান অংশ তিনটি\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৭. গুরুমস্তিষ্ক বা সেরিব্রামের ক্ষেত্রে সঠিক তথ্য হলো—\ni. এটি ডান ও বাম সেরিব্রাল হেমিস্ফিয়ারে বিভক্ত \nii. এর উপরিভাগ ঢেউ তোলা ও ধূসর বর্ণের\niii. এর ভিতরের স্তরের নাম শ্বেত পদার্থ বা হোয়াইট ম্যাটার\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৮. গুরুমস্তিষ্কে যেসব কাজের ক্রিয়াকেন্দ্র অবস্থিত—\ni. দর্শন, শ্রবণ, ঘ্রাণ ও চিন্তা-চেতনা\nii. স্মৃতি, জ্ঞান, বুদ্ধি ও বিবেক iii. পেশি চালনা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৯. থালামাস ও হাইপোথালামাসের কাজের মধ্যে রয়েছে—\ni. ক্রোধ, লজ্জা, গরম ও শীত অনুভব\nii. নিদ্রা, তাপ সংরক্ষণ ও শাসন \niii. দেহের ভারসাম্য রক্ষা করা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫০. মধ্যমস্তিষ্কের বৈশিষ্ট্য ও কাজ হলো—\ni. এটি গুরুমস্তিষ্ক ও পন্স-এর মাঝখানে অবস্থিত\nii. এটি দৃষ্টিশক্তির সাথে সম্পর্কিত\niii. এটি শ্রবণশক্তির সাথে সম্পর্কিত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫১. পশ্চাৎ বা লঘুমস্তিষ্কের ক্ষেত্রে সঠিক তথ্য হলো—\ni. এটি গুরুমস্তিষ্কের নিচে ও পশ্চাতে অবস্থিত\nii. দেহের ভারসাম্য রক্ষা করা এর প্রধান কাজ\niii. এটি কথা বলা ও চলাফেরা নিয়ন্ত্রণ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫২. লঘুমস্তিষ্কের অংশগুলো হলো—\ni. সেরেবেলাম ii. পন্স iii. মেডুলা বা সুষুম্নাশীর্ষক\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৩. পন্স (Pons) সম্পর্কিত সঠিক উক্তি হলো—\ni. এটি লঘুমস্তিষ্কের সামনে ও নিচে অবস্থিত\nii. একে মস্তিষ্কের যোজক বলা হয়\niii. এটি গুরুমস্তিষ্ক, লঘুমস্তিষ্ক ও মধ্যমস্তিষ্ককে সুষুম্নাশীর্ষকের সাথে সংযোজিত করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৪. মেডুলা বা সুষুম্নাশীর্ষকের কাজ ও বৈশিষ্ট্য হলো—\ni. একে মস্তিষ্কের বোঁটা বলা হয়\nii. এটি মস্তিষ্ককে মেরুরজ্জুর সাথে সংযোজিত করে\niii. এটি হৃদস্পন্দন, খাদ্যগ্রহণ ও শ্বসন ইত্যাদি কাজ নিয়ন্ত্রণ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"}]},{"id":"topic_1785086162640kyq38","title":"পাঠ: (৮-১০)","blocks":[{"id":"block_178522729648195n9x","type":"text","value":"<span style=\"color:darkblue;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. মেরুদণ্ডের মধ্যে কোনটি সংরক্ষিত থাকে?\n(ক) মস্তিষ্ক (খ) মেরুরজ্জু \n(গ) স্নায়ুকোষ (ঘ) সেন্ট্রিওল\nউত্তর: খ\n২. মেরুরজ্জুর ক্ষেত্রে ধূসর পদার্থ ও শ্বেত পদার্থের অবস্থান কেমন?\n(ক) ধূসর পদার্থ বাইরে এবং শ্বেত পদার্থ ভেতরে \n(খ) ধূসর পদার্থ ভেতরে এবং শ্বেত পদার্থ বাইরে \n(গ) দুটিই ভেতরে অবস্থিত \n(ঘ) দুটিই বাইরে অবস্থিত\nউত্তর: খ\n৩. মস্তিষ্কের তুলনায় মেরুরজ্জুর ধূসর ও শ্বেত পদার্থের অবস্থান কেমন?\n(ক) একই রকম (খ) ঠিক উল্টা \n(গ) অস্পষ্ট (ঘ) সম্পূর্ণ আলাদা নয়\nউত্তর: খ\n৪. মেরুরজ্জুর কিসের ভেতর দিয়ে আজ্ঞাবাহী এবং অনুভূতিবাহী স্নায়ুতন্তু যাতায়াত করে?\n(ক) ধূসর পদার্থের (খ) কেন্দ্রীয় নালির \n(গ) শ্বেত পদার্থের (ঘ) ত্বক বা গ্রাহক যন্ত্রের\nউত্তর: গ\n৫. আমরা মশার কামড় অনুভব করি কিসের জন্য?\n(ক) রক্তের চাপের জন্য (খ) স্নায়ুর উদ্দীপনার জন্য \n(গ) পেশির সংকোচনের জন্য (ঘ) হরমোনের জন্য\nউত্তর: খ\n৬. স্নায়ুর ভেতর দিয়ে যে সংবাদ বা অনুভূতি প্রবাহিত হয় তাকে কী বলে?\n(ক) স্নায়ু তাড়না (খ) প্রতিবর্ত চক্র \n(গ) চলন (ঘ) উদ্দীপক\nউত্তর: ক\n৭. হাতে মশা বসলে স্নায়ুর গ্রাহক প্রান্তের উদ্দীপক কোনটি?\n(ক) রক্ত (খ) মশা (গ) পিন (ঘ) বাতাস\nউত্তর: খ\n৮. যেসব ক্রিয়া অনুভূতির উত্তেজনা দ্বারা উৎপন্ন হয়, কিন্তু মস্তিষ্ক দ্বারা চালিত হয় না তাকে কী বলে?\n(ক) ঐচ্ছিক ক্রিয়া (খ) অনৈচ্ছিক চলন \n(গ) প্রতিবর্ত ক্রিয়া (ঘ) ট্রপিক চলন\nউত্তর: গ\n৯. প্রতিটি প্রতিবর্ত চক্রের কয়টি অংশ থাকে?\n(ক) ৩টি (খ) ৪টি (গ) ৫টি (ঘ) ৬টি\nউত্তর: গ\n১০. নিচের কোনটি প্রতিবর্ত চক্রের অংশগুলোর অন্তর্ভুক্ত?\n(ক) গ্রাহক অঙ্গ, অনুভূতিবাহী স্নায়ু, প্রতিবর্ত কেন্দ্র, আজ্ঞাবাহী স্নায়ু ও সাড়া প্রদানকারী অঙ্গ \n(খ) মস্তিষ্ক, মেরুরজ্জু, পন্স, থালামাস ও ডেনড্রাইট \n(গ) অ্যাক্সন, ডেনড্রন, কোষদেহ, সিন্যাপস ও নিউক্লিয়াস \n(ঘ) চোখ, কান, নাক, জিহ্বা ও ত্বক\nউত্তর: ক\n১১. তাৎক্ষণিক আত্মরক্ষার জন্য কোনো অঙ্গের তড়িৎক্রিয়ার নাম কী?\n(ক) সংবেদী ক্রিয়া (খ) প্রতিবর্ত ক্রিয়া \n(গ) আজ্ঞাবাহী ক্রিয়া (ঘ) ট্রপিক ক্রিয়া\nউত্তর: খ\n১২. চোখে প্রখর আলো পড়ামাত্র চোখের পাতা বন্ধ হয়ে যাওয়া কিসের উদাহরণ?\n(ক) প্রতিবর্ত ক্রিয়া (খ) ট্রপিক চলন \n(গ) মস্তিষ্কের ঐচ্ছিক নির্দেশ (ঘ) রাসায়নিক সমন্বয়\nউত্তর: ক\n১৩. হাতের চামড়ায় পিন ফোটামাত্র পিন ফোটার যন্ত্রণা কে গ্রহণ করে?\n(ক) আজ্ঞাবাহী স্নায়ুতন্তু (খ) অনুভূতিবাহী স্নায়ুতন্তু \n(গ) ঐচ্ছিক পেশি (ঘ) কেন্দ্রীয় নালি\nউত্তর: খ\n১৪. পিন ফোটার যন্ত্রণাদায়ক তাড়না অনুভূতিবাহী স্নায়ুতন্তুর মাধ্যমে কোথায় পৌঁছায়?\n(ক) মস্তিষ্কে (খ) মেরুরজ্জুতে \n(গ) হৃৎপিণ্ডে (ঘ) ত্বকের ওপর\nউত্তর: খ\n১৫. অনুভূতিবাহী স্নায়ুকোষ থেকে তাড়না আজ্ঞাবাহী স্নায়ুতে প্রবাহিত হওয়ার পর আজ্ঞাবাহী কোষ কোথায় প্রেরণ করে?\n(ক) রক্তে (খ) মস্তিষ্কে (গ) পেশিতে (ঘ) ত্বকে\nউত্তর: গ\n১৬. আজ্ঞাবাহী কোষ উদ্দীপনা পেশিতে প্রেরণ করলে পেশির কী ঘটে?\n(ক) প্রসারিত হয় (খ) সংকুচিত হয় \n(গ) অবশ হয়ে যায় (ঘ) স্থবির হয়ে যায়\nউত্তর: খ\n১৭. প্রতিবর্ত ক্রিয়ায় উৎপন্ন হওয়া অনুভূতি মস্তিষ্কে পৌঁছানোর ফলে কী ঘটে?\n(ক) শরীর হাত নাড়াতে পারে না \n(খ) কি ঘটেছে শরীর তা জানতে পারে \n(গ) মস্তিষ্ক সরাসরি হাত সরাতে বাধা দেয় \n(ঘ) রক্তপ্রবাহ বন্ধ হয়\nউত্তর: খ\n১৮. প্রতিবর্ত ক্রিয়া কেমন ধরনের কার্যক্রম?\n(ক) একক কার্যক্রম (খ) সমন্বিত কার্যক্রম \n(গ) বিচ্ছিন্ন কার্যক্রম (ঘ) ঐচ্ছিক কার্যক্রম\nউত্তর: খ\n১৯. প্রতিবর্ত ক্রিয়ায় নিয়োজিত পাঁচটি অংশের মধ্যে কয়টি অংশের অভাবে কাজটি সঠিকভাবে হতে পারে না?\n(ক) যে কোনো একটির (খ) কেবল দুটি অংশের \n(গ) সবগুলোরই অনুপস্থিতিতে \n(ঘ) কোনোটিরই প্রভাব নেই\nউত্তর: ক"},{"id":"block_1785227454490l8jbu","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:darkblue;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b><u> নিচের তথ্যের আলোকে (২০ ও ২১) নং প্রশ্নের উত্তর দাও: </u></b>    \nতানভীর রাতের বেলা পড়ার ঘরে বসে বই পড়ছিল। হঠাৎ তার পায়ে একটি মশা কামড় দিলে সে না দেখেই এক পলকে সেখানে থাপ্পড় দিয়ে মশাটিকে মেরে ফেলল। তার শিক্ষক বললেন, এটি একটি বিশেষ অনৈচ্ছিক ক্রিয়া যা তাৎক্ষণিক আত্মরক্ষার জন্য দ্রুত ঘটে থাকে।\n২০. উদ্দীপকে তানভীরের না দেখেও মশা মারার পেছনে যে সংবাদ বা অনুভূতি কাজ করেছে, তাকে কী বলে?\n(ক) প্রতিবর্ত কেন্দ্র (খ) স্নায়ু তাড়না \n(গ) স্নায়ুকোষ (ঘ) প্রতিবর্ত চক্র\nউত্তর: খ\n২১. উদ্দীপকে উল্লেখিত তাৎক্ষণিক আত্মরক্ষার এই অনৈচ্ছিক ক্রিয়াটিকে কী বলে?\n(ক) ঐচ্ছিক ক্রিয়া (খ) ট্রপিক চলন \n(গ) প্রতিবর্ত ক্রিয়া (ঘ) ট্যাকটিক চলন\nউত্তর: গ\n<b><u> নিচের তথ্যের আলোকে (২২ ও ২৩) নং প্রশ্নের উত্তর দাও: </u></b>    \nরাফিদ খালি পায়ে হাঁটছিল। হঠাৎ তার পায়ে একটি তীক্ষ্ণ পিন ফুটতেই সে নিমেষেই পা তুলে নিল। ঘটনার কিছুক্ষণ পর তার মাথায় ব্যথার অনুভূতি পৌঁছাল এবং সে বুঝতে পারল পায়ে কী ঘটেছে।\n২২. রাফিদের পায়ে পিন ফোটার যন্ত্রণাদায়ক তাড়না অনুভূতিবাহী স্নায়ুতন্তুর মাধ্যমে প্রথম কোথায় পৌঁছায়?\n(ক) মস্তিষ্কে (খ) মেরুরজ্জুতে \n(গ) পেশিতে (ঘ) হৃদপিণ্ডে\nউত্তর: খ\n২৩. পিন ফুটলে পেশি সংকুচিত হয়ে পা সরে আসার জন্য তাড়না বহন করে আনেন কোন ধরনের স্নায়ু?\n(ক) অনুভূতিবাহী স্নায়ু (খ) আজ্ঞাবাহী স্নায়ু \n(গ) সংবেদী স্নায়ু (ঘ) কেন্দ্রীয় স্নায়ু\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (২৪ ও ২৫) নং প্রশ্নের উত্তর দাও: </u></b>    \nশ্রেণিকক্ষে শিক্ষক মানবদেহের একটি অঙ্গের চিত্র আঁকলেন যা মেরুদণ্ডের মধ্যে সুরক্ষিত থাকে। তিনি বললেন, এই অঙ্গের ভেতর দিয়ে আজ্ঞাবাহী ও অনুভূতিবাহী স্নায়ুতন্তু যাতায়াত করে। তবে এতে ধূসর ও শ্বেত পদার্থের অবস্থান মস্তিষ্কের একদম উল্টো।\n২৪. শিক্ষকের আলোচিত মেরুদণ্ডের ভেতরে সুরক্ষিত অঙ্গটির নাম কী?\n(ক) মেরুরজ্জু (খ) মস্তিষ্ক (গ) সুষুম্নাশীর্ষক (ঘ) পন্স\nউত্তর: ক\n২৫. উদ্দীপকের অঙ্গটিতে শ্বেত পদার্থ ও ধূসর পদার্থের অবস্থান কেমন?\n(ক) শ্বেত পদার্থ ভেতরে এবং ধূসর পদার্থ বাইরে \n(খ) ধূসর পদার্থ ভেতরে এবং শ্বেত পদার্থ বাইরে \n(গ) দুটিই ভেতরে অবস্থিত \n(ঘ) দুটিই বাইরে অবস্থিত\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (২৬ ও ২৭) নং প্রশ্নের উত্তর দাও: </u></b>    \nসায়মা হারিকেনের গরম চিমনিতে ভুলবশত হাত ছোঁয়াতেই দ্রুত হাতটি সরিয়ে নিল। শিক্ষক তাকে বুঝিয়ে বললেন, এটি ৫টি অংশের সমন্বয়ে গঠিত একটি চক্রের মাধ্যমে সম্পন্ন হয় এবং এর যে কোনো একটি অংশের অভাব থাকলে পুরো কাজটি ব্যাহত হতো।\n২৬. উদ্দীপকে উল্লেখিত ঘটনাটি যে চক্রের মাধ্যমে ঘটে তাতে কয়টি অংশ থাকে?\n(ক) ৩টি (খ) ৪টি (গ) ৫টি (ঘ) ৬টি\nউত্তর: গ\n২৭. উদ্দীপকের ঘটনায় সাঈমা চিমনিতে হাত দেওয়ার পর কোন অঙ্গটির মাধ্যমে অনুভূতি স্নায়ুতে পৌঁছায়?\n(ক) অনুভূতিবাহী স্নায়ু (খ) ত্বক বা গ্রাহক অঙ্গ \n(গ) প্রতিবর্ত কেন্দ্র (ঘ) আজ্ঞাবাহী স্নায়ু\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (২৮ ও ২৯) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_17852275158481t0u0","type":"image","value":"https://iili.io/CengAPe.md.jpg"},{"id":"block_178522752008444724","type":"text","value":"২৮. উদ্দীপকের চিত্রে মশার কামড় অনুভূতির ফলে স্নায়ুর ভেতর দিয়ে যে সংবাদ প্রবাহিত হয় তাকে কী বলে?\r\n(ক) প্রতিবর্ত কেন্দ্র (খ) স্নায়ু তাড়না \r\n(গ) ট্রপিক চলন (ঘ) প্রতিবর্ত চক্র\r\nউত্তর: খ\r\n২৯. চিত্রে উল্লেখিত মশার উপস্থিতি অনুভব করার সঙ্গে সঙ্গে কোনটি প্রথম উদ্দীপনা গ্রহণ করে সাড়াজাগায়?\r\n(ক) কোষ প্রান্তের স্নায়ু বা গ্রাহক অঙ্গ \r\n(খ) আজ্ঞাবাহী স্নায়ু \r\n(গ) মস্তিষ্কের শ্বেত পদার্থ (ঘ) ঐচ্ছিক পেশি\r\nউত্তর: ক\r\n<b><u> নিচের চিত্রের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও: </u></b>"},{"id":"block_1785227557252xbya7","type":"image","value":"https://iili.io/CenPd5G.md.jpg"},{"id":"block_1785227560566owodj","type":"text","value":"৩০. চিত্রে 'M' চিহ্নিত অংশটি প্রতিবর্ত চক্রের কোন উপাদানকে নির্দেশ করে?\r\n(ক) গ্রাহক অঙ্গ (খ) অনুভূতিবাহী স্নায়ু \r\n(গ) আজ্ঞাবাহী স্নায়ু (ঘ) প্রতিবর্ত কেন্দ্র\r\nউত্তর: ক\r\n৩১. চিত্রে 'N' চিহ্নিত স্নায়ুটির প্রধান কাজ কোনটি?\r\n(ক) মস্তিষ্ক থেকে নির্দেশ পেশিতে নিয়ে যাওয়া \r\n(খ) যন্ত্রণাদায়ক তাড়না গ্রহণ করে মেরুরজ্জুতে পৌঁছে দেওয়া \r\n(গ) সরাসরি হাতকে সংকুচিত করা \r\n(ঘ) ধূসর পদার্থ তৈরি করা\r\nউত্তর: খ\r\n<b><u> নিচের চিত্রের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও: </u></b>"},{"id":"block_17852276090726r3c0","type":"image","value":"https://iili.io/Ce5VatI.jpg"},{"id":"block_1785227611564ljy58","type":"text","value":"৩২. চিত্রে 'Y' চিহ্নিত শ্বেত পদার্থের ভেতর দিয়ে কোন কোন স্নায়ুতন্তু যাতায়াত করে? \r\n(ক) কেবল আজ্ঞাবাহী স্নায়ুতন্তু \r\n(খ) কেবল অনুভূতিবাহী স্নায়ুতন্তু \r\n(গ) আজ্ঞাবাহী এবং অনুভূতিবাহী স্নায়ুতন্তু \r\n(ঘ) কেবল ট্রপিক তন্তু \r\nউত্তর: গ\r\n৩৩. চিত্রে 'X' চিহ্নিত অংশটির অবস্থান মস্তিষ্কের অবস্থানের সাথে তুলনা করলে কেমন? \r\n(ক) ঠিক একই রকম (খ) ঠিক উল্টা \r\n(গ) সম্পূর্ণ অনুপস্থিত (ঘ) অস্পষ্ট \r\nউত্তর: খ\r\n<b><u> নিচের চিত্রের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও: </u></b>"},{"id":"block_1785227675525qllmk","type":"image","value":"https://iili.io/Ceos43P.jpg"},{"id":"block_1785227678826adwou","type":"text","value":"৩৪. উদ্দীপকের চিত্রে প্রদর্শিত চোখের পাতা স্বয়ংক্রিয়ভাবে বন্ধ হয়ে যাওয়ার ঘটনাটি কিসের উদাহরণ?\r\n(ক) ঐচ্ছিক চলন (খ) প্রতিবর্ত ক্রিয়া \r\n(গ) ট্রপিক চলন (ঘ) মস্তিষ্কের জটিল চিন্তা\r\nউত্তর: খ\r\n৩৫. উদ্দীপকে প্রদর্শিত ক্রিয়াটির ক্ষেত্রে নিচের কোনটি সঠিক?\r\n(ক) এটি মস্তিষ্ক দ্বারা চালিত হয় \r\n(খ) এটি মস্তিষ্ক দ্বারা চালিত হয় না \r\n(গ) এতে ৫টি অংশের প্রয়োজন হয় না \r\n(ঘ) এটি ধীরে ধীরে সংঘটিত হয়\r\nউত্তর: খ"},{"id":"block_1785227711120w1a77","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:darkblue;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩৬. মেরুরজ্জু (Spinal cord) সম্পর্কিত সঠিক তথ্য হলো—\ni. এটি মেরুদণ্ডের মধ্যে সংরক্ষিত থাকে\nii. এর ধূসর পদার্থ থাকে ভেতরে এবং শ্বেত পদার্থ থাকে বাইরে\niii. এর শ্বেত পদার্থের ভিতর দিয়ে আজ্ঞাবাহী ও অনুভূতিবাহী স্নায়ুতন্তু যাতায়াত করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৭. স্নায়ু তাড়না (Nerve impulse) সম্পর্কে সত্য উক্তি হলো—\ni. স্নায়ুর ভিতর দিয়ে অনুভূতি বা সংবাদ প্রবাহিত হওয়াকে স্নায়ু তাড়না বলে\nii. মশার কামড় অনুভব করা স্নায়ুর উদ্দীপনার জন্য ঘটে\niii. এটি কেবল মস্তিষ্কের আদেশেই কাজ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৮. প্রতিবর্ত ক্রিয়া (Reflex action)-এর বৈশিষ্ট্য হলো—\ni. এটি অনুভূতির উত্তেজনা দ্বারা উৎপন্ন হয়\nii. এটি মস্তিষ্ক দ্বারা চালিত হয় না\niii. এটি আকস্মিক বা আপনার আপনি ঘটে থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৯. প্রতিবর্ত ক্রিয়া সংঘটনের উদাহরণ হলো—\ni. আগুনে হাত লাগা মাত্র হাত টেনে নেওয়া\nii. পিনে হাত ফোটা মাত্র হাত টেনে নেওয়া\niii. চোখে প্রখর আলো পড়ামাত্র চোখের পাতা বন্ধ হয়ে যাওয়া\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪০. প্রতিবর্ত চক্রের (Reflex arc) পাঁচটি অংশের অন্তর্ভুক্ত হলো—\ni. গ্রাহক অঙ্গ ও অনুভূতিবাহী স্নায়ু\nii. প্রতিবর্ত কেন্দ্র ও আজ্ঞাবাহী স্নায়ু\niii. সাড়া প্রদানকারী অঙ্গ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪১. হাতে পিন ফুটলে প্রতিবর্ত ক্রিয়ার প্রক্রিয়ায় কী ঘটে?\ni. অনুভূতিবাহী স্নায়ুতন্তু পিন ফোটার যন্ত্রণা গ্রহণ করে মেরুরজ্জুতে পৌঁছায়\nii. মেরুরজ্জু থেকে আজ্ঞাবাহী স্নায়ু উদ্দীপনা পেশিতে প্রেরণ করে\niii. পেশি প্রসারিত হয়ে যন্ত্রণার উৎস থেকে হাত সরিয়ে নেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪২. প্রতিবর্ত ক্রিয়ার ক্ষেত্রে সঠিক বক্তব্য হলো—\ni. তাৎক্ষণিক আত্মরক্ষার জন্য কোনো অঙ্গের তড়িৎক্রিয়াকে প্রতিবর্ত ক্রিয়া বলে\nii. প্রতিবর্ত ক্রিয়া একটি সমন্বিত কার্যক্রম\niii. এর পাঁচটি অংশের যে কোনো একটির অভাবে কাজ সঠিকভাবে হতে পারে না\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৩. পিন ফোটানোর ঘটনার ক্ষেত্রে—\ni. হাতের চামড়ায় পিন ফোটামাত্র গ্রাহক অঙ্গ সাড়া জাগায়\nii. অনুভূতিবাহী স্নায়ুর মাধ্যমে উদ্দীপনা মস্তিষ্কেও পৌঁছায়, ফলে কী ঘটেছে শরীর তা জানতে পারে\niii. আজ্ঞাবাহী স্নায়ু পেশিতে নির্দেশ পৌঁছালে পেশি সংকুচিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"}]},{"id":"topic_1785227869362fkpzk","title":"পাঠ: (১১-১২)","blocks":[{"id":"block_17852279332049sr3d","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. দেহের জন্য ক্ষতিকর ও অপ্রয়োজনীয় পদার্থকে কী বলে?\n(ক) রেচন পদার্থ (খ) পরিপাক পদার্থ \n(গ) প্রয়োজনীয় পদার্থ (ঘ) এনজাইম\nউত্তর: ক\n২. রেচন বলতে কী বোঝায়?\n(ক) খাদ্য গ্রহণ করার প্রক্রিয়া \n(খ) দেহের বর্জ্য পদার্থ নিষ্কাশন ব্যবস্থা \n(গ) রক্ত সঞ্চালন প্রক্রিয়া \n(ঘ) শ্বাস গ্রহণ করার পদ্ধতি\nউত্তর: খ\n৩. বিপাকের ফলে দেহে ক্ষতিকর কী কী বিষাক্ত পদার্থ প্রস্তুত হয়?\n(ক) পানি, কার্বন ডাইঅক্সাইড ও ইউরিয়া \n(খ) গ্লুকোজ, প্রোটিন ও স্নেহ \n(গ) অক্সিন ও জিব্বেরেলিন \n(ঘ) অক্সিজেন ও নাইট্রোজেন\nউত্তর: ক\n৪. দূষিত পদার্থসমূহ নিয়মিত ত্যাগ না করলে কী ঘটে?\n(ক) হজম বৃদ্ধি পায় \n(খ) স্বাস্থ্যহানি ও বিষক্রিয়ায় মৃত্যু ঘটতে পারে \n(গ) রক্ত তৈরি বৃদ্ধি পায় (ঘ) হরমোন নিঃসরণ বৃদ্ধি পায়\nউত্তর: খ\n৫. বর্জ্য পদার্থ প্রধানত কিসের মাধ্যমে দেহের বাইরে চলে যায়?\n(ক) কেবল ঘামের মাধ্যমে \n(খ) নিঃশ্বাস বায়ু, ঘাম এবং মূত্রের মাধ্যমে \n(গ) চোখের জল ও লালার মাধ্যমে \n(ঘ) কেবল নিঃশ্বাসের মাধ্যমে\nউত্তর: খ\n৬. মানবদেহের তিনটি প্রধান রেচন অঙ্গ কোনটি?\n(ক) হৃদপিণ্ড, ফুসফুস ও যকৃত (খ) ফুসফুস, চর্ম ও বৃক্ক \n(গ) পাকস্থলী, অন্ত্র ও বৃক্ক (ঘ) মস্তিষ্ক, মেরুরজ্জু ও স্নায়ু\nউত্তর: খ\n৭. কার্বন ডাইঅক্সাইড কিসের মাধ্যমে বের হয়ে যায়?\n(ক) চর্মের মাধ্যমে (খ) বৃক্কের মাধ্যমে \n(গ) ফুসফুসের মাধ্যমে (ঘ) যকৃতের মাধ্যমে\nউত্তর: গ\n৮. লবণ জাতীয় ক্ষতিকর পদার্থ কিসের মাধ্যমে বের হয়ে যায়?\n(ক) ফুসফুসের মাধ্যমে (খ) চর্মের মাধ্যমে \n(গ) ধমনীর মাধ্যমে (ঘ) শিরার মাধ্যমে\nউত্তর: খ\n৯. বৃক্কের মাধ্যমে দেহের কোন ধরণের বর্জ্য পরিত্যক্ত হয়?\n(ক) নাইট্রোজেনযুক্ত তরল, দূষিত পদার্থ (খ) কঠিন মল \n(গ) কেবল কার্বন ডাইঅক্সাইড (ঘ) স্নেহ পদার্থ\nউত্তর: ক\n১০. দেহের শতকরা কত ভাগ নাইট্রোজেন ঘটিত বর্জ্য পদার্থ মূত্রের মাধ্যমে পরিত্যক্ত হয়?\n(ক) ৫০ ভাগ (খ) ৬০ ভাগ (গ) ৭০ ভাগ (ঘ) ৮০ ভাগ\nউত্তর: ঘ\n১১. মানবদেহের প্রধান রেচন অঙ্গ কোনটি?\n(ক) ফুসফুস (খ) চর্ম (গ) বৃক্ক (ঘ) যকৃত\nউত্তর: গ\n১২. যে তন্ত্র রেচন কার্য পরিচালনা ও সাহায্যে ভূমিকা রাখে তাকে কী বলে?\n(ক) স্নায়ুতন্ত্র (খ) রেচনতন্ত্র (গ) সংবহনতন্ত্র (ঘ) শ্বসনতন্ত্র\nউত্তর: খ\n১৩. নিঃশ্বাসের বায়ুতে কার্বন ডাইঅক্সাইডের উপস্থিতি পরীক্ষা করতে কোন দ্রবণ ব্যবহার করা হয়?\n(ক) স্যালাইন পানি (খ) পরিষ্কার চুনের পানি \n(গ) লবণের পানি (ঘ) মিষ্টি পানি\nউত্তর: খ\n১৪. কার্বন ডাইঅক্সাইড গ্যাস স্বচ্ছ চুনের পানিকে কেমন করে?\n(ক) লাল করে (খ) ঘোলাটে করে \n(গ) নীল করে (ঘ) স্বচ্ছ রাখে\nউত্তর: খ\n১৫. নিঃশ্বাসের বায়ুতে শতকরা কত ভাগ কার্বন ডাইঅক্সাইড থাকে?\n(ক) ২ ভাগ (খ) ৪ ভাগ (গ) ৬ ভাগ (ঘ) ৮ ভাগ\nউত্তর: খ\n১৬. নিঃশ্বাসের বায়ুতে কার্বন ডাইঅক্সাইডের সাথে আর কী থাকে?\n(ক) নাইট্রোজেন (খ) জলীয় বাষ্প \n(গ) হাইড্রোজেন (ঘ) অক্সিজেন\nউত্তর: খ\n১৭. শীতের সকালে কাচ বা আয়নার ওপর মুখ দিয়ে নিঃশ্বাস ছাড়লে কাচটি ঘোলাটে ও কিছুটা অস্বচ্ছ দেখায় কেন?\n(ক) ধুলাবালির জন্য \n(খ) জলীয় বাষ্প ঠান্ডা কাচে জলীয় কণার সৃষ্টি করার জন্য \n(গ) কার্বন ডাইঅক্সাইড জমা হওয়ার জন্য \n(ঘ) ঘামের জন্য\nউত্তর: খ\n১৮. মানবদেহের বহিরাবরণ কোনটি?\n(ক) চর্ম বা ত্বক (খ) হাড় (গ) পেশি (ঘ) ঝিল্লি\nউত্তর: ক\n১৯. ত্বকের অসংখ্য ক্ষুদ্র ক্ষুদ্র ছিদ্রগুলোকে কী বলে?\n(ক) কোষ (খ) লোমকূপ (গ) রন্ধ্র (ঘ) নেফ্রন\nউত্তর: খ\n২০. ঘামে সাধারণত পানির সাথে আর কী কী পদার্থ থাকে?\n(ক) লবণ, সামান্য কার্বন ডাইঅক্সাইড এবং অন্যান্য ক্ষতিকর/অপ্রয়োজনীয় পদার্থ \n(খ) ইউরিয়া ও ইউরিক এসিড \n(গ) গ্লুকোজ ও শ্বেতসার \n(ঘ) শ্বেত রক্তকণিকা\nউত্তর: ক\n২১. মানবদেহে মূত্র তৈরির কারখানা হিসেবে অভিহিত করা হয় কোন অঙ্গকে?\n(ক) ফুসফুসকে (খ) ত্বককে (গ) বৃক্ককে (ঘ) যকৃতকে\nউত্তর: গ\n২২. মানবদেহে মেরুদণ্ডের দুই পাশে কয়টি বৃক্ক থাকে?\n(ক) ১টি (খ) ২টিতে (গ) ৩টি (ঘ) ৪টি\nউত্তর: খ\n২৩. বৃক্ক কিসের মতো কাজ করে?\n(ক) ছাকনির মতো (খ) পাম্পের মতো \n(গ) লিভারের মতো (ঘ) সংযোগকারীর মতো\nউত্তর: ক\n২৪. যকৃতে অতিরিক্ত অ্যামাইনো এসিড ভেঙে নিচের কোন নাইট্রোজেন ঘটিত বর্জ্য পদার্থগুলো তৈরি হয়?\n(ক) ইউরিয়া, ইউরিক এসিড, অ্যামোনিয়া \n(খ) গ্লুকোজ ও ফ্রুক্টোজ \n(গ) পেপসিন ও ট্রিপসিন (ঘ) অক্সিন ও জিব্বেরেলিন\nউত্তর: ক\n২৫. বৃক্ক কর্তৃক ছাঁকা ক্ষতিকর বর্জ্য পদার্থসমূহ পানির সাথে মিশে হালকা হলুদ বর্ণের কী তৈরি করে?\n(ক) ঘাম (খ) পিত্তরস (গ) মূত্র (ঘ) রক্তের প্লাজমা\nউত্তর: গ\n২৬. বৃক্ক থেকে মূত্র কিসের মাধ্যমে মূত্রথলিতে এসে জমা হয়?\n(ক) সংগ্রাহী নালি (খ) ইউরেটারের মাধ্যমে \n(গ) ধমনীর মাধ্যমে (ঘ) লোমকূপের মাধ্যমে\nউত্তর: খ\n২৭. মূত্রথলির দ্বারে সংকোচন ও প্রসারণশীল পেশি থাকে, একে কী বলে?\n(ক) হৃৎপেশি (খ) অনৈচ্ছিক পেশি \n(গ) মূত্রপথ (ঘ) ইউরেটার\nউত্তর: গ"},{"id":"block_17852280343983ixdd","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b><u> নিচের তথ্যের আলোকে (২৮ ও ২৯) নং প্রশ্নের উত্তর দাও: </u></b>    \nকরিম সাহেব গ্রীষ্মের দুপুরে মাঠ থেকে কাজ করে ফিরে দেখলেন তাঁর দেহ থেকে প্রচুর ঘাম বের হচ্ছে। তিনি জানেন যে নিঃশ্বাস বায়ু ও মূত্রের মতো ঘামও মানবদেহের একটি অন্যতম বর্জ্য পদার্থ, যা চর্মের লোমকূপ দিয়ে নিষ্কাশিত হয়।\n২৮. নিঃশ্বাস বায়ু, ঘাম ও মূত্রের মাধ্যমে বর্জ্য নিষ্কাশনকারী এই সামগ্রিক প্রক্রিয়াকে কী বলে?\n(ক) শ্বসন (খ) রেচন (গ) পরিপাক (ঘ) সংবহন\nউত্তর: খ\n২৯. উদ্দীপকে উল্লিখিত ঘামে পানির সাথে সাধারণত ক্ষতিকর বা অপ্রয়োজনীয় আর কোন পদার্থগুলো থাকে?\n(ক) ইউরিয়া ও ইউরিক এসিড \n(খ) লবণ ও সামান্য কার্বন ডাইঅক্সাইড \n(গ) গ্লুকোজ ও অ্যামাইনো এসিড (ঘ) অম্ল ও ক্ষার\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও: </u></b>    \nবিজ্ঞান ক্লাসে শিক্ষক বললেন, মানবদেহের বিপাক প্রক্রিয়ায় পানি ও কার্বন ডাইঅক্সাইডের পাশাপাশি নানা ধরনের নাইট্রোজেনঘটিত বিষাক্ত বর্জ্য তৈরি হয়। শরীরের শতকরা ৮০ ভাগ নাইট্রোজেনঘটিত বর্জ্য একটি বিশেষ তরল মাধ্যমে দেহ থেকে নিষ্কাশিত হয়।\n৩০. উদ্দীপকে বর্ণিত শতকরা ৮০ ভাগ নাইট্রোজেনঘটিত বর্জ্য নিষ্কাশনকারী মাধ্যমটি কোনটি?\n(ক) ঘাম (খ) মূত্র (গ) নিঃশ্বাস বায়ু (ঘ) লালা\nউত্তর: খ\n৩১. উক্ত নাইট্রোজেনঘটিত বর্জ্য (যেমন: ইউরিয়া, ইউরিক এসিড) তৈরিতে যকৃতে কোন এসিডটি ভেঙে যায়?\n(ক) ফ্যাটি এসিড (খ) সাইট্রিক এসিড \n(গ) অ্যামাইনো এসিড (ঘ) নাইট্রিক এসিড\nউত্তর: গ\n<b><u> নিচের তথ্যের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও: </u></b>    \nপরীক্ষাগারে শিক্ষার্থী রাফি একটি টেস্টটিউবে কিছুটা স্বচ্ছ চুনের পানি নিয়ে প্লাস্টিকের নল দিয়ে ফুঁ দিল। কিছুক্ষণ পর সে লক্ষ্য করল স্বচ্ছ চুনের পানিটি ঘোলাটে হয়ে গেছে। শিক্ষক তাকে বললেন, আমাদের ফুসফুস দ্বারা ত্যাগ করা একটি গ্যাসের কারণে এমনটি ঘটেছে।\n৩২. উদ্দীপকে প্লাস্টিকের নল দিয়ে ফুঁ দেওয়ার ফলে চুনের পানি ঘোলাটে হওয়ার কারণ কোন গ্যাসের উপস্থিতি?\n(ক) অক্সিজেন (খ) নাইট্রোজেন \n(গ) কার্বন ডাইঅক্সাইড (ঘ) হাইড্রোজেন\nউত্তর: গ\n৩৩. আমাদের নিঃশ্বাসের বায়ুতে শতকরা কত ভাগ উক্ত গ্যাসটি থাকে?\n(ক) ২ ভাগ (খ) ৪ ভাগ (গ) ৬ ভাগ (ঘ) ৮ ভাগ\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও: </u></b>    \nসাজিদ লক্ষ্য করল তার শরীরের পেছনে মেরুদণ্ডের দুই পাশে অবস্থিত ছাঁকনযন্ত্রের মতো দুটি অঙ্গ রক্ত থেকে ক্ষতিকর বর্জ্য পদার্থ ছেঁকে নিয়ে হালকা হলুদ বর্ণের মূত্র তৈরি করছে, যা একটি বিশেষ নালির মাধ্যমে মূত্রথলিতে এসে জমা হয়।\n৩৪. উদ্দীপকে সাজিদের পর্যবেক্ষণ করা মূত্র তৈরি ও ছাঁকনযন্ত্র হিসেবে পরিচিত অঙ্গটির নাম কী?\n(ক) ফুসফুস (খ) ত্বক (গ) বৃক্ক (ঘ) যকৃত\nউত্তর: গ\n৩৫. উদ্দীপকে বর্ণিত বৃক্ক থেকে তৈরি মূত্র কোন নালির মাধ্যমে মূত্রথলিতে পৌঁছে জমা হয়?\n(ক) ইউরেটার (খ) মূত্রপথ (গ) সুষুম্নানালি (ঘ) কেন্দ্রীয় নালি\nউত্তর: ক\n<b><u> নিচের চিত্রের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785228058884bdpxb","type":"image","value":"https://iili.io/Ceobq2p.jpg"},{"id":"block_1785228062125yt0hp","type":"text","value":"৩৬. চিত্রে 'A' চিহ্নিত অঙ্গটিকে কীসের কারখানা হিসেবে অভিহিত করা হয়?\r\n(ক) রক্ত (খ) মূত্র (গ) হরমোন (ঘ) এনজাইম\r\nউত্তর: খ\r\n৩৭. চিত্রে 'B' চিহ্নিত নালিটির কাজ কী?\r\n(ক) রেচন পদার্থ রক্তে ফিরিয়ে আনা \r\n(খ) বৃক্ক থেকে মূত্র বহন করে মূত্রথলিতে নিয়ে যাওয়া \r\n(গ) খাদ্যসার পরিবহন করা \r\n(ঘ) কার্বন ডাইঅক্সাইড নিষ্কাশন করা\r\nউত্তর: খ\r\n<b><u> নিচের চিত্রের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও: </u></b>"},{"id":"block_1785228157953c365o","type":"image","value":"https://iili.io/CeopTg4.jpg"},{"id":"block_17852281612713pyqr","type":"text","value":"৩৮. চিত্রে 'X' স্থানে কাচটি ঘোলাটে ও অস্বচ্ছ হওয়ার কারণ নিঃশ্বাসের বায়ুতে কোন উপাদানের উপস্থিতি?\r\n(ক) কেবল অক্সিজেন (খ) জলীয় বাষ্প \r\n(গ) নাইট্রোজেন (ঘ) ধূলাবালি\r\nউত্তর: খ\r\n৩৯. উদ্দীপকে উল্লিখিত প্রক্রিয়ায় কাচটিতে জলীয় বাষ্প ছাড়াও আর কোন ক্ষতিকর গ্যাস বের হয়?\r\n(ক) সালফার ডাইঅক্সাইড (খ) কার্বন ডাইঅক্সাইড \r\n(গ) কার্বন মনোক্সাইড (ঘ) মিথেন\r\nউত্তর: খ\r\n<b><u> নিচের চিত্রের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও: </u></b>"},{"id":"block_17852281898504dojr","type":"image","value":"https://iili.io/Cex9IHl.jpg"},{"id":"block_1785228193687iqe9o","type":"text","value":"৪০. চিত্রে 'P' দ্বারা চিহ্নিত ছিদ্রপথের মাধ্যমে নিচের কোনটি প্রধানত নিষ্কাশিত হয়?\r\n(ক) মূত্র (খ) ঘাম (গ) পিত্তরস (ঘ) লালা\r\nউত্তর: খ\r\n৪১. উদ্দীপকের 'P' চিহ্নিত অংশের মাধ্যমে নিষ্কাশিত বর্জ্য পদার্থে সাধারণত পানির সাথে কোন ক্ষতিকর/অপ্রয়োজনীয় উপাদান থাকে?\r\n(ক) ইউরিয়া ও ইউরিক এসিড \r\n(খ) লবণ ও সামান্য কার্বন ডাইঅক্সাইড \r\n(গ) অ্যামাইনো এসিড (ঘ) গ্লুকোজ\r\nউত্তর: খ\r\n<b><u> নিচের চিত্রের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও: </u></b>"},{"id":"block_1785228240228rjnj7","type":"image","value":"https://iili.io/CexHW74.jpg"},{"id":"block_1785228243531ko3iu","type":"text","value":"৪২. চিত্রে 'Y' চিহ্নিত টেস্টটিউবের স্বচ্ছ চুনের পানি ঘোলাটে হওয়ার মাধ্যমে নিঃশ্বাসের বায়ুতে কোন গ্যাসের উপস্থিতি প্রমাণিত হয়?\r\n(ক) নাইট্রোজেন (খ) কার্বন ডাইঅক্সাইড \r\n(গ) অক্সিজেন (ঘ) হাইড্রোজেন\r\nউত্তর: খ\r\n৪৩. মানবদেহের শ্বসন প্রক্রিয়ায় উৎপন্ন এই 'Y' গ্যাসটি রক্ত কোথায় বহন করে নিয়ে যায়?\r\n(ক) বৃক্কে (খ) ফুসফুসে (গ) যকৃতে (ঘ) ত্বকে\r\nউত্তর: খ"},{"id":"block_178522825460513ykv","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৪৪. রেচন পদার্থ (Excretory products) সম্পর্কে সঠিক তথ্য হলো—\ni. রেচন পদার্থ দেহের জন্য ক্ষতিকর ও অপ্রয়োজনীয়\nii. বিপাকের ফলে পানি, কার্বন ডাইঅক্সাইড ও ইউরিয়া ইত্যাদি দুষিত পদার্থ দেহে প্রস্তুত হয়\niii. এগুলো নিয়মিত ত্যাগ না করলে স্বাস্থ্যহানি ঘটে এবং বিষক্রিয়ায় মৃত্যু ঘটতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৫. মানবদেহের রেচন অঙ্গগুলো হলো—\ni. ফুসফুস ii. চর্ম বা ত্বক iii. বৃক্ক\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৬. ফুসফুস ও শ্বসন প্রক্রিয়ার ক্ষেত্রে সঠিক বক্তব্য হলো—\ni. কার্বন ডাইঅক্সাইড ফুসফুসের মাধ্যমে বের হয়ে যায়\nii. নিঃশ্বাসের বায়ুতে শতকরা ৪ ভাগ কার্বন ডাইঅক্সাইড থাকে\niii. নিঃশ্বাসের বায়ুতে কার্বন ডাইঅক্সাইডের সাথে জলীয় বাষ্প থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৭. চর্ম বা ত্বকের মাধ্যমে বর্জ্য নিষ্কাশন সম্পর্কিত তথ্য হলো—\ni. ত্বকে অসংখ্য ক্ষুদ্র ক্ষুদ্র ছিদ্র বা লোমকূপ থাকে\nii. ঘামে সাধারণত পানির সাথে লবণ, সামান্য কার্বন ডাইঅক্সাইড ও অন্যান্য ক্ষতিকর পদার্থ থাকে\niii. ক্ষতিকর লবণ জাতীয় পদার্থ চর্মের মাধ্যমে বের হয়ে যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৮. বৃক্ক (Kidney) সম্পর্কিত সত্য উক্তি হলো—\ni. এটি মানবদেহের প্রধান রেচন অঙ্গ\nii. একে মূত্র তৈরির কারখানা হিসেবে অভিহিত করা হয়\niii. এটি ছাঁকনির মতো কাজ করে রক্ত থেকে ক্ষতিকর পদার্থ ছেঁকে নেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৯. মূত্র তৈরি ও নিষ্কাশন প্রক্রিয়ার ক্ষেত্রে—\ni. যকৃতে অতিরিক্ত অ্যামাইনো এসিড ভেঙে ইউরিয়া, ইউরিক এসিড, অ্যামোনিয়া তৈরি হয়\nii. মূত্রের মাধ্যমেই দেহের শতকরা ৮০ ভাগ নাইট্রোজেন ঘটিত বর্জ্য পদার্থ পরিত্যক্ত হয়\niii. ছাঁকা ক্ষতিকর পদার্থসমূহ পানির সাথে মিশে হালকা হলুদ বর্ণের মূত্র তৈরি করে ইউরেটারের মাধ্যমে মূত্রথলিতে জমা হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫০. নিঃশ্বাসের বায়ুর উপাদান পরীক্ষা সংক্রান্ত তথ্য—\ni. কার্বন ডাইঅক্সাইড স্বচ্ছ চুনের পানিকে ঘোলাটে করে\nii. আয়না বা কাচের ওপর মুখ দিয়ে নিঃশ্বাস ছাড়লে তা ঘোলাটে ও অস্বচ্ছ দেখায়\niii. শীতের সকালে কাচে গঠিত জলীয় কণা কিছুক্ষণ পর উঠে গেলে আয়নাটি আবার স্বচ্ছ দেখায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n\n\n<span style=\"color:red;\"><center><b>————————🌸 সমাপ্ত 🌸————————</b></center></span>"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
