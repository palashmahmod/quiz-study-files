ুক্ত বোতল (ঘ) টিনের বোতল\nউত্তর: গ\n২৮. আলোকমুখিতার পরীক্ষায় বোতলে চারাগাছটি এমনভাবে ঢোকাতে হবে যাতে মূলগুলো কিসে ডুবে থাকে?\n(ক) পুষ্টি দ্রবণে (খ) বিশুদ্ধ পানিতে (গ) এসিডে (ঘ) ক্ষার দ্রবণে\nউত্তর: ক\n২৯. আলোকমুখিতার পরীক্ষায় কত দিন পর চারাগাছের কাণ্ডের অংশ জানালার বাইরের দিকে বেঁকে যায়?\n(ক) ১/২ দিন (খ) ২/৩ দিন (গ) ৪/৫ দিন (ঘ) ৭/৮ দিন\nউত্তর: গ\n৩০. আলোকমুখিতার পরীক্ষায় উদ্ভিদের মূলগুলো কোন দিকে বেঁকে থাকে?\n(ক) আলোক উৎসের দিকে \n(খ) আলোক উৎসের বিপরীত দিকে \n(গ) ছিপির সমান্তরালে (ঘ) জানালার কাচের দিকে\nউত্তর: খ\n৩১. উদ্ভিদের আলোকমুখিতার পরীক্ষণ থেকে কী প্রমাণিত হয়?\n(ক) কাণ্ডে আলোকমুখী ও মূলে আলোকবিমুখী বৃদ্ধি ও চলন ঘটে \n(খ) কাণ্ডে আলোকবিমুখী ও মূলে আলোকমুখী বৃদ্ধি ও চলন ঘটে \n(গ) কাণ্ড ও মূল উভয়ই আলোকমুখী \n(ঘ) কাণ্ড ও মূল উভয়ই আলোকবিমুখী\nউত্তর: ক\n৩২. নিচের কোনটি এক ধরনের অক্সিন?\n(ক) জিব্বেরেলিক এসিড (খ) ইন্ডোল অ্যাসেটিক এসিড \n(গ) অ্যাবসিসিক এসিড (ঘ) ইথানয়িক এসিড\nউত্তর: খ\n৩৩. উদ্ভিদের ক্ষতস্থান পূরণে সাহায্য করে কোনটি?\n(ক) ইন্ডোল অ্যাসেটিক এসিড (খ) ইথিলিন \n(গ) জিব্বেরেলিন (ঘ) ফ্লোরিজেন\nউত্তর: ক\n৩৪. অক্সিন প্রয়োগে ফলের কী বিলম্বিত হয়?\n(ক) পেকে যাওয়া (খ) মোচন \n(গ) বৃদ্ধি (ঘ) ঝরে পড়া ত্বরান্বিত হওয়া\nউত্তর: খ\n৩৫. নিচের কোন উদ্দীপকগুলো উদ্ভিদের বৃদ্ধিকে প্রভাবিত করে?\n(ক) আলো, বাতাস ও মাটি \n(খ) আলো, পানি ও অভিকর্ষ \n(গ) নাইট্রোজেন, ফসফরাস ও পটাশিয়াম \n(ঘ) তাপ, চাপ ও আর্দ্রতা\nউত্তর: খ"},{"id":"block_17849849810670gqww","type":"text","value":"<span style=\"color:red;\"><center><b><u>উদ্দীপক যুক্ত MCQ</u></b></center></span>\n<b><u> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </u></b>\nরনি তার বাগানের একটি টবে একটি চারাগাছ রোপণ করে ঘরের জানালার পাশে রেখে দিল। কয়েকদিন পর সে লক্ষ্য করল, গাছটির কাণ্ড জানালার বাইরের দিকে অর্থাৎ আলোর উৎসের দিকে বেঁকে গেছে। কিন্তু টবটি উল্টে গিয়ে যখন মূলটি দেখা গেল, তখন দেখা গেল মূলটি আলোর বিপরীত দিকে বেঁকে বৃদ্ধি পেয়েছে।\n৩৬. উদ্দীপকে চারাগাছটির কাণ্ডে ও মূলে যে চলন ঘটেছে তাকে কী বলে?\n(ক) ট্যাকটিক চলন (খ) ট্রপিক চলন \n(গ) ন্যাস্টিক চলন (ঘ) রসস্ফীতি চলন\nউত্তর: খ\n৩৭. উদ্দীপকের পরীক্ষাটি থেকে কী প্রমাণিত হয়?\n(ক) কাণ্ডে আলোকবিমুখী ও মূলে আলোকমুখী চলন ঘটে\n(খ) কাণ্ডে আলোকমুখী ও মূলে আলোকবিমুখী চলন ঘটে\n(গ) কাণ্ড ও মূল উভয়ই আলোকমুখী\n(ঘ) কাণ্ড ও মূল কোনোটিই আলো দ্বারা প্রভাবিত হয় না\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও: </u></b>  \nবিজ্ঞান শিক্ষক ক্লাসে দুই ধরনের হরমোন নিয়ে আলোচনা করছিলেন। প্রথম হরমোনটি উদ্ভিদের ভ্রূণমুকুলাবরণীর অগ্রভাগে থাকে, যা শাখা কলমে মূল গজাতে এবং অকালে ফল ঝরে পড়া রোধে সাহায্য করে। দ্বিতীয় হরমোনটি একটি গ্যাসীয় পদার্থ, যা ফল পাকাতে সাহায্য করে এবং পাতা, ফুল ও ফলের ঝরে পড়া ত্বরান্বিত করে।\n৩৮. উদ্দীপকের প্রথম হরমোনটি চার্লস ডারউইন আবিষ্কার করেন। এর নাম কী?\n(ক) জিব্বেরেলিন (খ) ইথিলিন (গ) অক্সিন (ঘ) ফ্লোরিজেন\nউত্তর: গ\n৩৯. উদ্দীপকে উল্লেখিত দ্বিতীয় গ্যাসীয় হরমোনটির নাম কী?\n(ক) অক্সিন (খ) ইথিলিন \n(গ) সাইটোকাইনিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও: </u></b>    \nটমি তার বাগানের একটি খাটো জাতের উদ্ভিদের দ্রুত বৃদ্ধির জন্য একটি বিশেষ ফাইটোহরমোন প্রয়োগ করল। এর ফলে উদ্ভিদটি অন্যান্য সাধারণ উদ্ভিদ থেকেও অনেক বেশি লম্বা হয়ে গেল। অন্যদিকে, সে দেখল বাগানের কিছু উদ্ভিদের পাতায় অন্য একটি হরমোন উৎপন্ন হওয়ার কারণে সেগুলো পুষ্পমুকুলে পরিণত হয়ে ফুল ফোটাচ্ছে।\n৪০. টমি খাটো উদ্ভিদটি লম্বা করার জন্য কোন হরমোনটি প্রয়োগ করেছিল?\n(খ) অক্সিন (খ) ইথিলিন \n(গ) জিব্বেরেলিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: গ\n৪১. উদ্দীপকের শেষের অংশে পাতার পত্রমূলে স্থানান্তরিত হয়ে ফুল উৎপন্নকারী হরমোনটির নাম কী?\n(ক) সাইটোকাইনিন (খ) ফ্লোরিজেন \n(গ) অক্সিন (ঘ) জিব্বেরেলিন\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও: </u></b>    \nকৃষিবিদ আসিফ সাহেব তার ল্যাবরেটরিতে উদ্ভিদের বৃদ্ধি ও চলনসহ বিভিন্ন শারীরবৃত্তীয় কাজ সুশৃঙ্খলভাবে নিয়ন্ত্রণের জন্য 'ফাইটোহরমোন' বা বৃদ্ধিকারক বস্তু নিয়ে গবেষণা করছেন। তিনি গবেষণায় এক ধরনের বিশেষ অক্সিন ব্যবহার করলেন যা উদ্ভিদের ক্ষতস্থান পূরণে দারুণ ভূমিকা রাখে।\n৪২. উদ্ভিদের জীবনের সকল কাজ নিয়ন্ত্রণকারী এই ফাইটোহরমোন বা জৈব রাসায়নিক পদার্থটি কোথায় উৎপন্ন হয়?\n(ক) কোষে (খ) মাটিতে (গ) ফলমূলে (ঘ) বাতাসে\nউত্তর: ক\n৪৩. আসিফ সাহেবের গবেষণায় ব্যবহৃত ক্ষতস্থান পূরণে সাহায্যকারী বিশেষ অক্সিনটির নাম কী?\n(ক) জিব্বেরেলিক এসিড (খ) ইন্ডোল অ্যাসেটিক এসিড \n(গ) অ্যাবসিসিক এসিড (ঘ) সাইট্রিক এসিড\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও: </u></b>   "},{"id":"block_1784985198550vxq1h","type":"image","value":"https://iili.io/CO4krGa.md.jpg\" alt=\"CO4krGa.md.jpg"},{"id":"block_1784985297607esm31","type":"text","value":"৪৪. উদ্দীপকের চিত্রে প্রদর্শিত শাখা কলমে মূল গজাতে এবং ফলের অকালে ঝরেপড়া রোধ করতে কোন হরমোনটি সাহায্য করে?\n(ক) জিব্বেরেলিন (খ) ইথিলিন \n(গ) অক্সিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: গ\n৪৫. চার্লস ডারউইন উদ্ভিদের কোন অংশের ওপর আলোর প্রভাব লক্ষ্য করে এই হরমোনটি প্রথম আবিষ্কার করেন?\n(ক) পত্ররন্ধ্র (খ) ভ্রূণমুকুলাবরণী (গ) কাণ্ডের ত্বক (ঘ) মূলরোম\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪৬ ও ৪৭) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1784985349601jf4t5","type":"image","value":"https://iili.io/CO6F2wl.md.jpg"},{"id":"block_1784985392368by2ls","type":"text","value":"৪৬. উদ্ভিদের চারাগাছ, বীজপত্র ও পত্রের বর্ধিষ্ণু অঞ্চলে নিচের কোন হরমোনটি দেখা যায়?\n(ক) ইথিলিন (খ) জিব্বেরেলিন (গ) ফ্লোরিজেন (ঘ) অক্সিন\nউত্তর: খ\n৪৭. উদ্দীপকের চিত্রে প্রদর্শিত হরমোনটির প্রধান কার্যকারিতা নিচের কোনটি?\n(ক) ফল পাকানো (খ) ফলের অকালে ঝরেপড়া রোধ \n(গ) বীজের সুপ্তাবস্থা কাটানো (ঘ) ফুল উৎপন্ন করা\nউত্তর: গ\n<b><u> নিচের চিত্রের আলোকে (৪৮ ও ৪৯) নং প্রশ্নের উত্তর দাও: </u></b>  "},{"id":"block_17849854165891wp0s","type":"image","value":"https://iili.io/CO6aMbV.md.jpg"},{"id":"block_17849855031561546r","type":"text","value":"৪৮. উদ্দীপকের চিত্রে ফল পাকাতে সাহায্যকারী গ্যাসীয় হরমোনটির নাম কী?\n(ক) অক্সিন (খ) ইথিলিন (গ) সাইটোকাইনিন (ঘ) জিব্বেরেলিন\nউত্তর: খ\n৪৯. চিত্রে প্রদর্শিত পাতা, ফুল এবং ফলের ঝরে পড়া ত্বরান্বিত করতে কোন পদার্থটি ভূমিকা রাখে?\n(ক) ইন্ডোল অ্যাসেটিক এসিড (খ) ইথিলিন \n(গ) ফ্লোরিজেন (ঘ) জিব্বেরেলিক এসিড\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৫০ ও ৫১) নং প্রশ্নের উত্তর দাও: </u></b>  "},{"id":"block_1784985539752ug68o","type":"image","value":"https://iili.io/CO6sq9n.md.jpg"},{"id":"block_1784985564382kxce8","type":"text","value":"৫০. উদ্দীপকের চিত্রটি উদ্ভিদের কোন ধরনের পরীক্ষাকে নির্দেশ করে?\n(ক) সালোকসংশ্লেষণ পরীক্ষা (খ) প্রস্বেদন পরীক্ষা \n(গ) আলোকমুখিতার পরীক্ষা (ঘ) শ্বসন পরীক্ষা\nউত্তর: গ\n৫১. উদ্দীপকের চিত্রের পরীক্ষাটি সম্পন্ন করতে গাছটির মূলগুলোকে কিসের মধ্যে ডুবিয়ে রাখতে হয়?\n(ক) বিশুদ্ধ পানি (খ) পুষ্টি দ্রবণ (গ) ক্ষার দ্রবণ (ঘ) লবণাক্ত পানি\nউত্তর: খ"},{"id":"block_1784985746514rmmzz","type":"text","value":"<span style=\"color:red;\"><center><b><u>অনুধাবন মূলক MCQ</u></b></center></span>\n৫২. উদ্ভিদের জীবন চক্রের পর্যায়গুলোর অন্তর্ভুক্ত হলো—\ni. অঙ্কুরোদগম ও পুষ্পায়ন     \nii. ফল সৃষ্টি ও বার্ধক্য প্রাপ্তি iii. সুপ্তাবস্থা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৩. উদ্ভিদের বৃদ্ধি সহায়ক হরমোন হলো—\ni. অক্সিনii. জিব্বেরেলিন iii. অ্যাবসিসিক অ্যাসিড\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৪. অক্সিন হরমোনের ক্ষেত্রে সঠিক তথ্য হলো—\ni. চার্লস ডারউইন এই হরমোন প্রথম আবিষ্কার করেন \nii. এটি প্রয়োগে শাখা কলমে মূল গজের কাজ হয় \niii. এটি ফলের অকালে ঝরেপড়া ত্বরান্বিত করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৫. জিব্বেরেলিন হরমোনের প্রভাবে উদ্ভিদে কী ঘটে?\ni. পর্বমধ্যগুলো দৈর্ঘ্যে বৃদ্ধি পায় ii. বীজের সুপ্তাবস্থা কাটে\niii. ফল দ্রুত পেকে যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৬. ইথিলিন হরমোনের বৈশিষ্ট্য হলো—\ni. এটি একটি গ্যাসীয় পদার্থ ii. এটি ফল পাকাতে সাহায্য করে\niii. এটি পাতা, ফুল এবং ফলের ঝরে পড়া ত্বরান্বিত করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৭. উদ্ভিদের ইথিলিন হরমোনটি দেখা যায়—\ni. ফল ও ফুলে  ii. বীজ ও পাতায় iii. মূলে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৮. ফ্লোরিজেন হরমোন সম্পর্কে সঠিক উক্তি হলো—\ni. এই হরমোন পাতায় উৎপন্ন হয়\nii. এটি উদ্ভিদে ফুল উৎপন্ন করে\niii. এটি উদ্ভিদের কাণ্ডকে খাটো করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৯. উদ্ভিদের চলনের ক্ষেত্রে ট্রপিক চলন বলা হয় যখন—\ni. অভ্যন্তরীণ উদ্দীপক উদ্ভিদদেহে উদ্দীপনা সৃষ্টি করে\nii. বাহ্যউদ্দীপক উদ্ভিদদেহে উদ্দীপনা সৃষ্টি করে\niii. উদ্ভিদের শিকড় বা মূল মাটিতে অনুপস্থিত থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৬০. উদ্ভিদের আলোকমুখিতার পরীক্ষার সিদ্ধান্ত থেকে জানা যায়—\ni. কাণ্ডে আলোকমুখী চলন ঘটে\nii. মূলে আলোকবিমুখী চলন ঘটে\niii. কাণ্ড ও মূল উভয়েই আলোকবিমুখী চলন ঘটে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৬১. ইন্ডোল অ্যাসেটিক এসিডের কার্যকারিতা হলো—\ni. এটি উদ্ভিদের ক্ষতস্থান পূরণে সাহায্য করে\nii. এটি এক ধরনের অক্সিন হরমোন\niii. এটি উদ্ভিদের পর্বমধ্যকে খাটো করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"}]},{"id":"topic_1784985809543ugyi5","title":"পাঠ: (৪-৫)","blocks":[{"id":"block_1785068606906yoxy8","type":"text","value":"<span style=\"color:green;\"><center><b><u>সাধারণ MCQ</u></b></center></span>\n১. কারো দুঃখে কান্না পাওয়া বা পরীক্ষায় ভালো ফলে আনন্দ হওয়া—এই কাজগুলো কিসের কার্যকারিতার ফলে ঘটে?\n(ক) হরমোনের (খ) বিভিন্ন উদ্দীপকের \n(গ) রক্তের চাপের (ঘ) এনজাইমের\nউত্তর: খ\n২. দেহের বিভিন্ন অংশের উদ্দীপনা বহন করা, বিভিন্ন অঙ্গের কাজের সমন্বয় সাধন করা ও পরিবেশের সাথে সম্পর্ক রাখা কার প্রধান কাজ?\n(ক) রেচনতন্ত্রের (খ) সংবহনতন্ত্রের \n(গ) স্নায়ুতন্ত্রের (ঘ) পরিপাকতন্ত্রের\nউত্তর: গ\n৩. প্রাণীদেহের যে তন্ত্র দেহের বিভিন্ন অঙ্গের সংযোগ রক্ষা করে, বিভিন্ন জৈবিক কার্যাবলীর সমন্বয় সাধন করে এবং উদ্দীপনায় সাড়া দিয়ে উপযুক্ত প্রতিবেদন সৃষ্টি করে, তাকে কী বলে?\n(ক) পেশীতন্ত্র (খ) কঙ্কালতন্ত্র (গ) স্নায়ুতন্ত্র (ঘ) পরিপাকতন্ত্র\nউত্তর: গ\n৪. স্নায়ুতন্ত্রের প্রধান অংশ কোনটি?\n(ক) নিউরন (খ) মস্তিষ্ক (গ) অ্যাক্সন (ঘ) মেরুরজ্জু\nউত্তর: খ\n৫. মানুষ সৃষ্টির সেরা জীব হিসেবে পরিগণিত হয় কেন?\n(ক) উন্নত মস্তিষ্কের কারণে (খ) উন্নত মেরুদণ্ডের কারণে \n(গ) বড় হৃদপিণ্ডের কারণে (ঘ) বেশি ওজনের কারণে\nউত্তর: ক\n৬. মস্তিষ্ক অসংখ্য যে বিশেষ কোষ দ্বারা গঠিত, তাদের কী বলা হয়?\n(ক) নেফ্রন (খ) লোহিত রক্তকণিকা \n(গ) নিউরন বা স্নায়ুকোষ (ঘ) শ্বেত রক্তকণিকা\nউত্তর: গ\n৭. স্নায়ুতন্ত্রের গাঠনিক ও কার্যকরী একককে কী বলে?\n(ক) টিস্যু (খ) নেফ্রন (গ) নিউরন (ঘ) হরমোন\nউত্তর: গ\n৮. মানবদেহের দীর্ঘতম কোষ কোনটি?\n(ক) যকৃত কোষ (খ) নিউরন (গ) পেশী কোষ (ঘ) লোহিত রক্তকণিকা\nউত্তর: খ\n৯. একটি নিউরন কয়টি প্রধান অংশ নিয়ে গঠিত?\n(ক) দুটি (খ) তিনটি (গ) চারটি (ঘ) পাঁচটি\nউত্তর: ক\n১০. নিউরনের প্রধান দুটি অংশ কী কী?\n(ক) কোষদেহ ও নিউক্লিয়াস (খ) কোষদেহ ও প্রলম্বিত অংশ \n(গ) অ্যাক্সন ও ডেনড্রন (ঘ) সাইটোপ্লাজম ও সিন্যাপস\nউত্তর: খ\n১১. নিউরনের প্রধান অংশ কোনটি?\n(ক) অ্যাক্সন (খ) ডেনড্রন (গ) কোষদেহ (ঘ) ডেনড্রাইট\nউত্তর: গ\n১২. নিউরনের কোষদেহ নিচের কোন আকৃতির হতে পারে?\n(ক) গোলাকার, ডিম্বাকার বা নক্ষত্রাকার \n(খ) শুধুমাত্র চৌকোণাকার \n(গ) নলাকার বা সূত্রাকার (ঘ) ত্রিভুজাকার\nউত্তর: ক\n১৩. কোষদেহ নিচের কোন কোন অংশ দ্বারা গঠিত?\n(ক) কোষ আবরণী, সাইটোপ্লাজম ও নিউক্লিয়াস \n(খ) শুধুমাত্র নিউক্লিয়াস ও সেন্ট্রিওল \n(গ) ডেনড্রন ও ডেনড্রাইট (ঘ) অ্যাক্সন ও সিন্যাপস\nউত্তর: ক\n১৪. নিউরনের কোষদেহে কোনটি থাকে না, যার কারণে এরা অন্যান্য কোষের মতো বিভাজিত হয় না?\n(ক) নিউক্লিয়াস (খ) সেন্ট্রিওল \n(গ) সাইটোপ্লাজম (ঘ) কোষ আবরণী\nউত্তর: খ\n১৫. কোষদেহ থেকে উৎপন্ন শাখা-প্রশাখাকে কী বলে?\n(ক) অ্যাক্সন (খ) ডেনড্রন (গ) প্রলম্বিত অংশ (ঘ) সিন্যাপস\nউত্তর: গ\n১৬. প্রলম্বিত অংশ কয় প্রকার?\n(ক) দুই (খ) তিন (গ) চার (ঘ) পাঁচ\nউত্তর: ক\n১৭. প্রলম্বিত অংশের প্রকার দুটি কী কী?\n(ক) কোষদেহ ও নিউক্লিয়াস (খ) অ্যাক্সন ও ডেনড্রন \n(গ) সাইটোপ্লাজম ও ডেনড্রাইট (ঘ) সিন্যাপস ও মায়েলিন সিথ\nউত্তর: খ\n১৮. কোষদেহ থেকে উৎপন্ন লম্বা সুতার মতো অংশকে কী বলে?\n(ক) ডেনড্রন (খ) ডেনড্রাইট (গ) অ্যাক্সন (ঘ) সিন্যাপস\nউত্তর: গ\n১৯. সাধারণত একটি নিউরনে কয়টি অ্যাক্সন থাকে?\n(ক) একটি মাত্র (খ) দুটি (গ) তিনটি (ঘ) অসংখ্য\nউত্তর: ক\n২০. কোষদেহের চারদিক থেকে উৎপন্ন শাখাগুলোকে কী বলে?\n(ক) অ্যাক্সন (খ) ডেনড্রন (গ) সিন্যাপস (ঘ) মায়েলিন সিথ\nউত্তর: খ\n২১. ডেনড্রন থেকে সৃষ্ট শাখাগুলোকে কী বলে?\n(ক) অ্যাক্সন (খ) ডেনড্রাইট (গ) কোষদেহ (ঘ) সিন্যাপস\nউত্তর: খ\n২২. ডেনড্রাইটের মাধ্যমে স্নায়ুতাড়না কোন দিকে পরিবাহিত হয়?\n(ক) নিউরনের দেহের দিকে \n(খ) নিউরনের দেহের বিপরীত দিকে \n(গ) রক্তের দিকে (ঘ) শুধুমাত্র মায়েলিন সিথের দিকে\nউত্তর: ক\n২৩. একটি স্নায়ুকোষের অ্যাক্সন অন্য একটি স্নায়ুকোষের ডেনড্রাইটের সাথে মিলিত হওয়ার স্থানকে কী বলে?\n(ক) সিন্যাপস (খ) সেন্ট্রিওল (গ) ডেনড্রন (ঘ) কোষদেহ\nউত্তর: ক\n২৪. কিসের মাধ্যমে স্নায়ুতাড়না এক স্নায়ুকোষ থেকে অন্য স্নায়ুকোষে পরিবাহিত হয়?\n(ক) রক্ত (খ) লিম্ফ (গ) সিন্যাপস (ঘ) হরমোন\nউত্তর: গ\n২৫. উদ্দীপনা বহন করা, মস্তিষ্ক স্মৃতিধারণ করা, চিন্তা করা ও বিভিন্ন কাজের নির্দেশ দেওয়া কার কাজ?\n(ক) হৃদপিণ্ডের (খ) নিউরনের (গ) ফুসফুসের (ঘ) যকৃতের\nউত্তর: খ\n২৬. স্নায়ুতন্ত্রের উদ্দীপনা বহনের প্রবাহ চিত্রে চোখ, কান, নাক, জিহ্বা, ত্বক থেকে কেন্দ্রীয় স্নায়ুতন্ত্রে উদ্দীপনা পরিবহন করে কোন তন্তু?\n(ক) আজ্ঞাবাহী নিউরন তন্তু (খ) সংবেদী নিউরন তন্তু \n(গ) রক্তবাহিকা তন্তু (ঘ) পেশী তন্তু\nউত্তর: খ\n২৭. স্নায়ুতন্ত্রের উদ্দীপনা বহনের প্রবাহ চিত্রে কেন্দ্রীয় স্নায়ুতন্ত্র থেকে উদ্দীপনা শরীরের সংশ্লিষ্ট অংশে পরিবহন করে কোন তন্তু?\n(ক) সংবেদী নিউরন তন্তু (খ) আজ্ঞাবাহী নিউরন তন্তু \n(গ) লসিকা তন্তু (ঘ) পেশী তন্তু\nউত্তর: খ\n২৮. স্নায়ুতন্ত্রকে কয় ভাগে ভাগ করা হয়?\n(ক) দুই ভাগে (খ) তিন ভাগে (গ) চার ভাগে (ঘ) পাঁচ ভাগে\nউত্তর: খ\n২৯. নিচের কোনটি স্নায়ুতন্ত্রের ভাগের অন্তর্ভুক্ত?\n(ক) কেন্দ্রীয় স্নায়ুতন্ত্র, প্রান্তীয় স্নায়ুতন্ত্র ও স্বয়ংক্রিয় স্নায়ুতন্ত্র \n(খ) শুধুমাত্র কেন্দ্রীয় ও প্রান্তীয় স্নায়ুতন্ত্র \n(গ) রক্ত সংবহনতন্ত্র ও রেচনতন্ত্র \n(ঘ) ঐচ্ছিক ও অনৈচ্ছিক স্নায়ুতন্ত্র\nউত্তর: ক"},{"id":"block_1785084739009pi7wn","type":"text","value":"<span style=\"color:green;\"><center><b><u>উদ্দীপক যুক্ত MCQ</u></b></center></span>\n<b><u> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও: </u></b>    \nসিয়াম পরীক্ষায় ভালো ফল করায় তার বাবা-মা অনেক আনন্দিত হলেন এবং সিয়াম খুশিতে কেঁদে ফেলল। তার শিক্ষক বললেন, মানবদেহের একটি বিশেষ তন্ত্রের কারণে আমরা পরিবেশের উদ্দীপনায় এভাবে সাড়া দিতে পারি এবং এই তন্ত্রের প্রধান অংশের কারণেই মানুষ সৃষ্টির সেরা জীব।\n৩০. উদ্দীপকে সিয়ামের খুশিতে কেঁদে ফেলার মতো ঘটনাগুলো কিসের কার্যকারিতার ফলে ঘটে?\n(ক) হরমোনের (খ) বিভিন্ন উদ্দীপকের \n(গ) এনজাইমের (ঘ) রক্তচাপের\nউত্তর: খ\n৩১. শিক্ষকের ইঙ্গিত করা তন্ত্রটির প্রধান অংশের নাম কী?\n(ক) নিউরন (খ) মস্তিষ্ক (গ) মেরুরজ্জু (ঘ) অ্যাক্সন\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও: </u></b>    \nঅমি ল্যাবরেটরিতে মানবদেহের দীর্ঘতম কোষটি পর্যবেক্ষণ করছিল। সে দেখল কোষটির প্রধান অংশটি দেখতে নক্ষত্রাকার এবং এর ভেতরে সাইটোপ্লাজম ও নিউক্লিয়াস থাকলেও একটি বিশেষ অঙ্গাণু অনুপস্থিত। এই অনুপস্থিতির কারণে কোষটি অন্যান্য সাধারণ কোষের মতো বিভাজিত হতে পারে না।\n৩২. অমি ল্যাবরেটরিতে যে কোষটি দেখছিল, তার নাম কী?\n(ক) নেফ্রন (খ) লোহিত রক্তকণিকা \n(গ) নিউরন বা স্নায়ুকোষ (ঘ) পেশীকোষ\nউত্তর: গ\n৩৩. কোষটিতে কোন অঙ্গাণুটি না থাকার কারণে এটি বিভাজিত হয় না?\n(ক) নিউক্লিয়াস (খ) সেন্ট্রিওল \n(গ) মাইটোকন্ড্রিয়া (ঘ) সাইটোপ্লাজম\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও: </u></b>    \nসাজিদ বিজ্ঞানের বইয়ে একটি চিত্র দেখছিল যেখানে একটি স্নায়ুকোষের লম্বা সুতার মতো অংশটি আরেকটি স্নায়ুকোষের ডেনড্রন থেকে সৃষ্ট ছোট শাখাগুলোর সাথে মিলিত হয়েছে। শিক্ষক বললেন, এই বিশেষ মিলনস্থলের মাধ্যমেই স্নায়ুতাড়না এক কোষ থেকে অন্য কোষে পরিবাহিত হয়।\n৩৪. উদ্দীপকের বর্ণনা অনুযায়ী, স্নায়ুকোষের লম্বা সুতার মতো অংশটিকে কী বলা হয়?\n(ক) ডেনড্রন (খ) ডেনড্রাইট (গ) অ্যাক্সন (ঘ) মায়েলিন সিথ\nউত্তর: গ\n৩৫. উদ্দীপকে উল্লেখিত দুইটি স্নায়ুকোষের মিলনস্থলকে কী বলা হয়?\n(ক) সেন্ট্রিওল (খ) সিন্যাপস (গ) কোষদেহ (ঘ) প্রলম্বিত অংশ\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও: </u></b>    \nসুমি গরম চায়ের কাপে হাত দিতেই দ্রুত হাতটি সরিয়ে নিল। তার বিজ্ঞান শিক্ষক একটি প্রবাহচিত্রের সাহায্যে বোঝালেন যে, ত্বক থেকে একটি বিশেষ নিউরন তন্তুর মাধ্যমে উদ্দীপনা প্রথমে কেন্দ্রীয় স্নায়ুতন্ত্রে পৌঁছায় এবং সেখান থেকে অন্য একটি তন্তুর মাধ্যমে শরীরের সংশ্লিষ্ট অংশে নির্দেশ আসে। শিক্ষক আরও জানালেন, পুরো স্নায়ুতন্ত্রটি প্রধানত তিন ভাগে বিভক্ত।\n৩৬. উদ্দীপকের বর্ণনা ও বইয়ের প্রবাহচিত্র অনুযায়ী, ত্বক থেকে কেন্দ্রীয় স্নায়ুতন্ত্রে উদ্দীপনা পরিবহন করে কোন তন্তু?\n(ক) আজ্ঞাবাহী নিউরন তন্তু (খ) সংবেদী নিউরন তন্তু \n(গ) লসিকা তন্তু (ঘ) পেশী তন্তু\nউত্তর: খ\n৩৭. উদ্দীপকে শিক্ষকের উল্লেখিত স্নায়ুতন্ত্রের তিন ভাগের মধ্যে কেন্দ্রীয় স্নায়ুতন্ত্র ছাড়া বাকি দুটি ভাগ কী কী?\n(ক) ঐচ্ছিক ও অনৈচ্ছিক স্নায়ুতন্ত্র \n(খ) সংবেদী ও আজ্ঞাবাহী স্নায়ুতন্ত্র \n(গ) প্রান্তীয় স্নায়ুতন্ত্র ও স্বয়ংক্রিয় স্নায়ুতন্ত্র \n(ঘ) কোষদেহ ও প্রলম্বিত স্নায়ুতন্ত্র\nউত্তর: গ\n<b><u> নিচের চিত্রের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785084789466hhk6i","type":"image","value":"https://iili.io/CO6pt8Q.md.jpg"},{"id":"block_1785084806315v2cl5","type":"text","value":"৩৮. চিত্রে 'A' চিহ্নিত অংশের আকৃতি নিচের কোনটি হতে পারে?\n(ক) গোলাকার, ডিম্বাকার বা নক্ষত্রাকার (খ) শুধুমাত্র নলাকার \n(গ) চৌকোণাকার (ঘ) ত্রিভুজাকার\nউত্তর: ক\n৩৯. 'A' চিহ্নিত অংশে নিচের কোনটি থাকে না বলে এটি অন্যান্য সাধারণ কোষের মতো বিভাজিত হয় না?\n(ক) নিউক্লিয়াস (খ) সাইটোপ্লাজম \n(গ) সেন্ট্রিওল (ঘ) কোষ আবরণী\nউত্তর: গ\n<b><u> নিচের চিত্রের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785084847092djp0t","type":"image","value":"https://iili.io/COPdAL7.md.jpg"},{"id":"block_17850848513009z853","type":"text","value":"৪০. চিত্রে 'X' চিহ্নিত লম্বা সুতার মতো অংশটির নাম কী?\n(ক) ডেনড্রন (খ) ডেনড্রাইট (গ) অ্যাক্সন (ঘ) সিন্যাপস\nউত্তর: গ\n৪১. চিত্রে 'Y' চিহ্নিত ডেনড্রন থেকে সৃষ্ট শাখাগুলোকে কী বলে, যার দ্বারা স্নায়ুতাড়না নিউরনের দেহের দিকে পরিবাহিত হয়?\n(ক) অ্যাক্সন (খ) ডেনড্রাইট \n(গ) মায়েলিন সিথ (ঘ) র্যানভিয়ারের পর্ব\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785084904204h0aa9","type":"image","value":"https://iili.io/COPqQyu.md.jpg"},{"id":"block_1785084906557dxhap","type":"text","value":"৪২. চিত্রে 'P' দ্বারা নির্দেশিত মিলনস্থলটিকে কী বলা হয়?\n(ক) সেন্ট্রিওল (খ) ডেনড্রন (গ) সিন্যাপস (ঘ) কোষদেহ\nউত্তর: গ\n৪৩. উদ্দীপকের চিত্রে প্রদর্শিত 'P' এর প্রধান কাজ কী?\n(ক) কোষ বিভাজন করা \n(খ) এক স্নায়ুকোষ থেকে অন্য স্নায়ুকোষে স্নায়ুতাড়না পরিবাহিত করা \n(গ) রক্ত তৈরি করা (ঘ) হরমোন নিঃসরণ করা\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1785084963671bdhnt","type":"image","value":"https://iili.io/COPoiVj.md.jpg"},{"id":"block_1785084966843k1204","type":"text","value":"৪৪. চিত্রে 'M' চিহ্নিত পথটি দিয়ে কোন তন্তু উদ্দীপনা পরিবহন করে?\n(ক) আজ্ঞাবাহী নিউরন তন্তু (খ) সংবেদী নিউরন তন্তু \n(গ) পেশী তন্তু (ঘ) রক্তবাহিকা তন্তু\nউত্তর: খ\n৪৫. চিত্রে 'N' চিহ্নিত পথটি মূলত কোন কাজটির নির্দেশ করে?\n(ক) চোখ বা ত্বক থেকে কেন্দ্রীয় স্নায়ুতন্ত্রে উদ্দীপনা নেওয়া \n(খ) কেন্দ্রীয় স্নায়ুতন্ত্র থেকে আজ্ঞাবাহী নিউরন তন্তুর মাধ্যমে উদ্দীপনা সংশ্লিষ্ট অংশে পরিবহন করা \n(গ) পরিবেশের তাপমাত্রা পরিমাপ করা \n(ঘ) রক্ত সংবহন সচল রাখা\nউত্তর: খ"},{"id":"block_178508498412762z7v","type":"text","value":"<span style=\"color:green;\"><center><b><u>অনুধাবন মূলক MCQ</u></b></center></span>\n৪৬. স্নায়ুতন্ত্রের প্রধান কাজগুলোর অন্তর্ভুক্ত হলো—\ni. দেহের বিভিন্ন অংশের উদ্দীপনা বহন করা\nii. দেহের বিভিন্ন অঙ্গের কাজের সমন্বয় সাধন করা\niii. পরিবেশের সাথে সম্পর্ক রাখা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৭. স্নায়ুকোষ বা নিউরনের বৈশিষ্ট্য হলো—\ni. এটি স্নায়ুতন্ত্রের গাঠনিক ও কার্যকরী একক\nii. এটি মানবদেহের দীর্ঘতম কোষ\niii. এটি কোষদেহ ও প্রলম্বিত অংশ নিয়ে গঠিত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৮. নিউরনের কোষদেহের ক্ষেত্রে কোন তথ্যগুলো সঠিক?\ni. এটি গোলাকার, ডিম্বাকার বা নক্ষত্রাকার হতে পারে\nii. এটি কোষ আবরণী, সাইটোপ্লাজম ও নিউক্লিয়াস দ্বারা গঠিত\niii. এতে সেন্ট্রিওল থাকে না বলে এটি বিভাজিত হয় না\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৯. প্রলম্বিত অংশের বিবরণ অনুযায়ী—\ni. কোষদেহ থেকে উৎপন্ন শাখা-প্রশাখাকে প্রলম্বিত অংশ বলে\nii. প্রলম্বিত অংশ দুই প্রকার, যথা- অ্যাক্সন ও ডেনড্রন\niii. সাধারণত একটি নিউরনে একাধিক অ্যাক্সন থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫০. ডেনড্রন ও ডেনড্রাইটের ক্ষেত্রে সঠিক তথ্য হলো—\ni. কোষদেহের চারদিক থেকে উৎপন্ন শাখাগুলোকে ডেনড্রন বলে\nii. ডেনড্রন থেকে সৃষ্ট শাখাগুলোকে ডেনড্রাইট বলে\niii. এদের দ্বারা স্নায়ুতাড়না নিউরনের দেহের দিকে পরিবাহিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫১. সিন্যাপস (Synapse) সম্পর্কে সঠিক উক্তি হলো—\ni. একটি স্নায়ুকোষের অ্যাক্সন অন্য একটি স্নায়ুকোষের ডেনড্রাইটের সাথে মিলিত হওয়ার স্থানকে সিন্যাপস বলে\nii. সিন্যাপসের মাধ্যমে স্নায়ুতাড়না এক স্নায়ুকোষ থেকে অন্য স্নায়ুকোষে পরিবাহিত হয়\niii. এটি কোষদেহকে সরাসরি বিভাজিত হতে সাহায্য করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫২. নিউরনের কাজগুলোর অন্তর্ভুক্ত হলো—\ni. উদ্দীপনা বহন করা ও স্মৃতিধারণ করা\nii. চিন্তা করা ও বিভিন্ন কাজের নির্দেশ দেওয়া\niii. রক্তের মাধ্যমে হরমোন উৎপাদন করা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৩. স্নায়ুতন্ত্রের উদ্দীপনা বহন প্রক্রিয়ায়—\ni. সংবেদী নিউরন তন্তু চোখ, কান, নাক, জিহ্বা, ত্বক থেকে উদ্দীপনা বহন করে\nii. আজ্ঞাবাহী নিউরন তন্তু কেন্দ্রীয় স্নায়ুতন্ত্র থেকে উদ্দীপনা পরিবহন করে\niii. উদ্দীপনা সরাসরি রক্তবাহিকার মাধ্যমে পরিবাহিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৪. স্নায়ুতন্ত্রকে যে যে ভাগে ভাগ করা হয়—\ni. কেন্দ্রীয় স্নায়ুতন্ত্র ii. প্রান্তীয় স্নায়ুতন্ত্র  iii. স্বয়ংক্রিয় স্নায়ুতন্ত্র\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৫. মানবদেহে বিভিন্ন উদ্দীপকের কার্যকারিতার ফলে ঘটে—\ni. কারো দুঃখে কান্না পাওয়া ii. কারো খুশিতে খুশি হওয়া\niii. পরীক্ষায় ভালো ফল করলে আনন্দ হওয়া\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
