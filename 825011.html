ুক্ত বোতল (ঘ) টিনের বোতল\nউত্তর: গ\n২৮. আলোকমুখিতার পরীক্ষায় বোতলে চারাগাছটি এমনভাবে ঢোকাতে হবে যাতে মূলগুলো কিসে ডুবে থাকে?\n(ক) পুষ্টি দ্রবণে (খ) বিশুদ্ধ পানিতে (গ) এসিডে (ঘ) ক্ষার দ্রবণে\nউত্তর: ক\n২৯. আলোকমুখিতার পরীক্ষায় কত দিন পর চারাগাছের কাণ্ডের অংশ জানালার বাইরের দিকে বেঁকে যায়?\n(ক) ১/২ দিন (খ) ২/৩ দিন (গ) ৪/৫ দিন (ঘ) ৭/৮ দিন\nউত্তর: গ\n৩০. আলোকমুখিতার পরীক্ষায় উদ্ভিদের মূলগুলো কোন দিকে বেঁকে থাকে?\n(ক) আলোক উৎসের দিকে \n(খ) আলোক উৎসের বিপরীত দিকে \n(গ) ছিপির সমান্তরালে (ঘ) জানালার কাচের দিকে\nউত্তর: খ\n৩১. উদ্ভিদের আলোকমুখিতার পরীক্ষণ থেকে কী প্রমাণিত হয়?\n(ক) কাণ্ডে আলোকমুখী ও মূলে আলোকবিমুখী বৃদ্ধি ও চলন ঘটে \n(খ) কাণ্ডে আলোকবিমুখী ও মূলে আলোকমুখী বৃদ্ধি ও চলন ঘটে \n(গ) কাণ্ড ও মূল উভয়ই আলোকমুখী \n(ঘ) কাণ্ড ও মূল উভয়ই আলোকবিমুখী\nউত্তর: ক\n৩২. নিচের কোনটি এক ধরনের অক্সিন?\n(ক) জিব্বেরেলিক এসিড (খ) ইন্ডোল অ্যাসেটিক এসিড \n(গ) অ্যাবসিসিক এসিড (ঘ) ইথানয়িক এসিড\nউত্তর: খ\n৩৩. উদ্ভিদের ক্ষতস্থান পূরণে সাহায্য করে কোনটি?\n(ক) ইন্ডোল অ্যাসেটিক এসিড (খ) ইথিলিন \n(গ) জিব্বেরেলিন (ঘ) ফ্লোরিজেন\nউত্তর: ক\n৩৪. অক্সিন প্রয়োগে ফলের কী বিলম্বিত হয়?\n(ক) পেকে যাওয়া (খ) মোচন \n(গ) বৃদ্ধি (ঘ) ঝরে পড়া ত্বরান্বিত হওয়া\nউত্তর: খ\n৩৫. নিচের কোন উদ্দীপকগুলো উদ্ভিদের বৃদ্ধিকে প্রভাবিত করে?\n(ক) আলো, বাতাস ও মাটি \n(খ) আলো, পানি ও অভিকর্ষ \n(গ) নাইট্রোজেন, ফসফরাস ও পটাশিয়াম \n(ঘ) তাপ, চাপ ও আর্দ্রতা\nউত্তর: খ"},{"id":"block_17849849810670gqww","type":"text","value":"<span style=\"color:red;\"><center><b><u>উদ্দীপক যুক্ত MCQ</u></b></center></span>\n<b><u> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </u></b>\nরনি তার বাগানের একটি টবে একটি চারাগাছ রোপণ করে ঘরের জানালার পাশে রেখে দিল। কয়েকদিন পর সে লক্ষ্য করল, গাছটির কাণ্ড জানালার বাইরের দিকে অর্থাৎ আলোর উৎসের দিকে বেঁকে গেছে। কিন্তু টবটি উল্টে গিয়ে যখন মূলটি দেখা গেল, তখন দেখা গেল মূলটি আলোর বিপরীত দিকে বেঁকে বৃদ্ধি পেয়েছে।\n৩৬. উদ্দীপকে চারাগাছটির কাণ্ডে ও মূলে যে চলন ঘটেছে তাকে কী বলে?\n(ক) ট্যাকটিক চলন (খ) ট্রপিক চলন \n(গ) ন্যাস্টিক চলন (ঘ) রসস্ফীতি চলন\nউত্তর: খ\n৩৭. উদ্দীপকের পরীক্ষাটি থেকে কী প্রমাণিত হয়?\n(ক) কাণ্ডে আলোকবিমুখী ও মূলে আলোকমুখী চলন ঘটে\n(খ) কাণ্ডে আলোকমুখী ও মূলে আলোকবিমুখী চলন ঘটে\n(গ) কাণ্ড ও মূল উভয়ই আলোকমুখী\n(ঘ) কাণ্ড ও মূল কোনোটিই আলো দ্বারা প্রভাবিত হয় না\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও: </u></b>  \nবিজ্ঞান শিক্ষক ক্লাসে দুই ধরনের হরমোন নিয়ে আলোচনা করছিলেন। প্রথম হরমোনটি উদ্ভিদের ভ্রূণমুকুলাবরণীর অগ্রভাগে থাকে, যা শাখা কলমে মূল গজাতে এবং অকালে ফল ঝরে পড়া রোধে সাহায্য করে। দ্বিতীয় হরমোনটি একটি গ্যাসীয় পদার্থ, যা ফল পাকাতে সাহায্য করে এবং পাতা, ফুল ও ফলের ঝরে পড়া ত্বরান্বিত করে।\n৩৮. উদ্দীপকের প্রথম হরমোনটি চার্লস ডারউইন আবিষ্কার করেন। এর নাম কী?\n(ক) জিব্বেরেলিন (খ) ইথিলিন (গ) অক্সিন (ঘ) ফ্লোরিজেন\nউত্তর: গ\n৩৯. উদ্দীপকে উল্লেখিত দ্বিতীয় গ্যাসীয় হরমোনটির নাম কী?\n(ক) অক্সিন (খ) ইথিলিন \n(গ) সাইটোকাইনিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও: </u></b>    \nটমি তার বাগানের একটি খাটো জাতের উদ্ভিদের দ্রুত বৃদ্ধির জন্য একটি বিশেষ ফাইটোহরমোন প্রয়োগ করল। এর ফলে উদ্ভিদটি অন্যান্য সাধারণ উদ্ভিদ থেকেও অনেক বেশি লম্বা হয়ে গেল। অন্যদিকে, সে দেখল বাগানের কিছু উদ্ভিদের পাতায় অন্য একটি হরমোন উৎপন্ন হওয়ার কারণে সেগুলো পুষ্পমুকুলে পরিণত হয়ে ফুল ফোটাচ্ছে।\n৪০. টমি খাটো উদ্ভিদটি লম্বা করার জন্য কোন হরমোনটি প্রয়োগ করেছিল?\n(খ) অক্সিন (খ) ইথিলিন \n(গ) জিব্বেরেলিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: গ\n৪১. উদ্দীপকের শেষের অংশে পাতার পত্রমূলে স্থানান্তরিত হয়ে ফুল উৎপন্নকারী হরমোনটির নাম কী?\n(ক) সাইটোকাইনিন (খ) ফ্লোরিজেন \n(গ) অক্সিন (ঘ) জিব্বেরেলিন\nউত্তর: খ\n<b><u> নিচের তথ্যের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও: </u></b>    \nকৃষিবিদ আসিফ সাহেব তার ল্যাবরেটরিতে উদ্ভিদের বৃদ্ধি ও চলনসহ বিভিন্ন শারীরবৃত্তীয় কাজ সুশৃঙ্খলভাবে নিয়ন্ত্রণের জন্য 'ফাইটোহরমোন' বা বৃদ্ধিকারক বস্তু নিয়ে গবেষণা করছেন। তিনি গবেষণায় এক ধরনের বিশেষ অক্সিন ব্যবহার করলেন যা উদ্ভিদের ক্ষতস্থান পূরণে দারুণ ভূমিকা রাখে।\n৪২. উদ্ভিদের জীবনের সকল কাজ নিয়ন্ত্রণকারী এই ফাইটোহরমোন বা জৈব রাসায়নিক পদার্থটি কোথায় উৎপন্ন হয়?\n(ক) কোষে (খ) মাটিতে (গ) ফলমূলে (ঘ) বাতাসে\nউত্তর: ক\n৪৩. আসিফ সাহেবের গবেষণায় ব্যবহৃত ক্ষতস্থান পূরণে সাহায্যকারী বিশেষ অক্সিনটির নাম কী?\n(ক) জিব্বেরেলিক এসিড (খ) ইন্ডোল অ্যাসেটিক এসিড \n(গ) অ্যাবসিসিক এসিড (ঘ) সাইট্রিক এসিড\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও: </u></b>   "},{"id":"block_1784985198550vxq1h","type":"image","value":"https://iili.io/CO4krGa.md.jpg\" alt=\"CO4krGa.md.jpg"},{"id":"block_1784985297607esm31","type":"text","value":"৪৪. উদ্দীপকের চিত্রে প্রদর্শিত শাখা কলমে মূল গজাতে এবং ফলের অকালে ঝরেপড়া রোধ করতে কোন হরমোনটি সাহায্য করে?\n(ক) জিব্বেরেলিন (খ) ইথিলিন \n(গ) অক্সিন (ঘ) অ্যাবসিসিক অ্যাসিড\nউত্তর: গ\n৪৫. চার্লস ডারউইন উদ্ভিদের কোন অংশের ওপর আলোর প্রভাব লক্ষ্য করে এই হরমোনটি প্রথম আবিষ্কার করেন?\n(ক) পত্ররন্ধ্র (খ) ভ্রূণমুকুলাবরণী (গ) কাণ্ডের ত্বক (ঘ) মূলরোম\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৪৬ ও ৪৭) নং প্রশ্নের উত্তর দাও: </u></b>    "},{"id":"block_1784985349601jf4t5","type":"image","value":"https://iili.io/CO6F2wl.md.jpg"},{"id":"block_1784985392368by2ls","type":"text","value":"৪৬. উদ্ভিদের চারাগাছ, বীজপত্র ও পত্রের বর্ধিষ্ণু অঞ্চলে নিচের কোন হরমোনটি দেখা যায়?\n(ক) ইথিলিন (খ) জিব্বেরেলিন (গ) ফ্লোরিজেন (ঘ) অক্সিন\nউত্তর: খ\n৪৭. উদ্দীপকের চিত্রে প্রদর্শিত হরমোনটির প্রধান কার্যকারিতা নিচের কোনটি?\n(ক) ফল পাকানো (খ) ফলের অকালে ঝরেপড়া রোধ \n(গ) বীজের সুপ্তাবস্থা কাটানো (ঘ) ফুল উৎপন্ন করা\nউত্তর: গ\n<b><u> নিচের চিত্রের আলোকে (৪৮ ও ৪৯) নং প্রশ্নের উত্তর দাও: </u></b>  "},{"id":"block_17849854165891wp0s","type":"image","value":"https://iili.io/CO6aMbV.md.jpg"},{"id":"block_17849855031561546r","type":"text","value":"৪৮. উদ্দীপকের চিত্রে ফল পাকাতে সাহায্যকারী গ্যাসীয় হরমোনটির নাম কী?\n(ক) অক্সিন (খ) ইথিলিন (গ) সাইটোকাইনিন (ঘ) জিব্বেরেলিন\nউত্তর: খ\n৪৯. চিত্রে প্রদর্শিত পাতা, ফুল এবং ফলের ঝরে পড়া ত্বরান্বিত করতে কোন পদার্থটি ভূমিকা রাখে?\n(ক) ইন্ডোল অ্যাসেটিক এসিড (খ) ইথিলিন \n(গ) ফ্লোরিজেন (ঘ) জিব্বেরেলিক এসিড\nউত্তর: খ\n<b><u> নিচের চিত্রের আলোকে (৫০ ও ৫১) নং প্রশ্নের উত্তর দাও: </u></b>  "},{"id":"block_1784985539752ug68o","type":"image","value":"https://iili.io/CO6sq9n.md.jpg"},{"id":"block_1784985564382kxce8","type":"text","value":"৫০. উদ্দীপকের চিত্রটি উদ্ভিদের কোন ধরনের পরীক্ষাকে নির্দেশ করে?\n(ক) সালোকসংশ্লেষণ পরীক্ষা (খ) প্রস্বেদন পরীক্ষা \n(গ) আলোকমুখিতার পরীক্ষা (ঘ) শ্বসন পরীক্ষা\nউত্তর: গ\n৫১. উদ্দীপকের চিত্রের পরীক্ষাটি সম্পন্ন করতে গাছটির মূলগুলোকে কিসের মধ্যে ডুবিয়ে রাখতে হয়?\n(ক) বিশুদ্ধ পানি (খ) পুষ্টি দ্রবণ (গ) ক্ষার দ্রবণ (ঘ) লবণাক্ত পানি\nউত্তর: খ"},{"id":"block_1784985746514rmmzz","type":"text","value":"<span style=\"color:red;\"><center><b><u>অনুধাবন মূলক MCQ</u></b></center></span>\n৫২. উদ্ভিদের জীবন চক্রের পর্যায়গুলোর অন্তর্ভুক্ত হলো—\ni. অঙ্কুরোদগম ও পুষ্পায়ন     \nii. ফল সৃষ্টি ও বার্ধক্য প্রাপ্তি iii. সুপ্তাবস্থা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৩. উদ্ভিদের বৃদ্ধি সহায়ক হরমোন হলো—\ni. অক্সিনii. জিব্বেরেলিন iii. অ্যাবসিসিক অ্যাসিড\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৪. অক্সিন হরমোনের ক্ষেত্রে সঠিক তথ্য হলো—\ni. চার্লস ডারউইন এই হরমোন প্রথম আবিষ্কার করেন \nii. এটি প্রয়োগে শাখা কলমে মূল গজের কাজ হয় \niii. এটি ফলের অকালে ঝরেপড়া ত্বরান্বিত করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৫. জিব্বেরেলিন হরমোনের প্রভাবে উদ্ভিদে কী ঘটে?\ni. পর্বমধ্যগুলো দৈর্ঘ্যে বৃদ্ধি পায় ii. বীজের সুপ্তাবস্থা কাটে\niii. ফল দ্রুত পেকে যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫৬. ইথিলিন হরমোনের বৈশিষ্ট্য হলো—\ni. এটি একটি গ্যাসীয় পদার্থ ii. এটি ফল পাকাতে সাহায্য করে\niii. এটি পাতা, ফুল এবং ফলের ঝরে পড়া ত্বরান্বিত করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৭. উদ্ভিদের ইথিলিন হরমোনটি দেখা যায়—\ni. ফল ও ফুলে  ii. বীজ ও পাতায় iii. মূলে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৮. ফ্লোরিজেন হরমোন সম্পর্কে সঠিক উক্তি হলো—\ni. এই হরমোন পাতায় উৎপন্ন হয়\nii. এটি উদ্ভিদে ফুল উৎপন্ন করে\niii. এটি উদ্ভিদের কাণ্ডকে খাটো করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii (গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর:     function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
</body>
</html>
