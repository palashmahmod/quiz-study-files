    var dataset = [{"id":"topic_17877645997539hmoo","title":"পাঠ-( 6.1 ও 6.1.1)","blocks":[{"id":"block_1787764690768ysyuu","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. পলিমার ($Polymer$) শব্দটি কোন ভাষার শব্দ থেকে এসেছে?\n(ক) ল্যাটিন (খ) গ্রিক\n(গ) ইংরেজি (ঘ) ফরাসি\nউত্তর: খ\n২. গ্রিক শব্দ ‘পলি’ ($Poly$) শব্দের অর্থ কী?\n(ক) অংশ (খ) অনেক\n(গ) একক (ঘ) শিকল\nউত্তর: খ\n৩. গ্রিক শব্দ ‘মেরোস’ ($Meros$) শব্দের অর্থ কী?\n(ক) অনেক (খ) অংশ\n(গ) যৌগ (ঘ) অণু\nউত্তর: খ\n৪. রসায়ন বিজ্ঞানের ভাষায় যে ছোট অণু থেকে পলিমার তৈরি হয়, তাদের কী বলে?\n(ক) মনোমার ($Monomer$) (খ) ডাইমার\n(গ) পলিমার (ঘ) অনুঘটক\nউত্তর: ক\n৫. পলিথিন ব্যাগ কোন মনোমার থেকে তৈরি পলিমার?\n(ক) ভিনাইল ক্লোরাইড (খ) ফেনল\n(গ) মেলামাইন (ঘ) ইথিলিন\nউত্তর: ঘ\n৬. পিভিসি ($PVC$) পাইপ তৈরিতে কোন মনোমার ব্যবহৃত হয়?\n(ক) ইথিলিন (খ) ভিনাইল ক্লোরাইড\n(গ) ফরমালডিহাইড (ঘ) স্টাইরিন\nউত্তর: খ\n৭. বৈদ্যুতিক সুইচ বোর্ড বা ব্যাকোলাইট কোন দুটি মনোমার থেকে তৈরি পলিমার?\n(ক) ইথিলিন ও প্রোপিলিন \n(খ) ফেনল ও ফরমালডিহাইড\n(গ) মেলামাইন ও ফরমালডিহাইড \n(ঘ) ভিনাইল ক্লোরাইড ও ফেনল\nউত্তর: খ\n৮. মেলামাইন রেজিন নামক পলিমার তৈরিতে কোন দুটি মনোমার ব্যবহৃত হয়?\n(ক) মেলামাইন ও ফরমালডিহাইড \n(খ) ফেনল ও মেলামাইন\n(গ) ইথিলিন ও ফরমালডিহাইড \n(ঘ) ভিনাইল ক্লোরাইড ও ফরমালডিহাইড\nউত্তর: ক\n৯. নিচের কোনটি প্রাকৃতিক পলিমারের উদাহরণ?\n(ক) মেলামাইন \n(খ) পিভিসি\n(গ) ব্যাকোলাইট \n(ঘ) পাট, সিল্ক, সুতি কাপড়, রাবার\nউত্তর: ঘ\n১০. নিচের কোনটি কৃত্রিম পলিমার?\n(ক) পাট \n(খ) মেলামাইন, রেজিন, ব্যাকোলাইট, পিভিসি, পলিথিন\n(গ) সিল্ক (ঘ) সুতি কাপড়\nউত্তর: খ\n১১. যে নির্দিষ্ট প্রক্রিয়ার মাধ্যমে মনোমার যুক্ত করে পলিমার তৈরি হয়, তাকে কী বলে?\n(ক) পলিমারকরণ প্রক্রিয়া (খ) জারণ প্রক্রিয়া\n(গ) বিজারণ প্রক্রিয়া (ঘ) পাতন প্রক্রিয়া\nউত্তর: ক\n১২. পলিমারকরণ প্রক্রিয়ায় সাধারণত কিসের প্রয়োজন হয়?\n(ক) নিম্ন চাপ ও উচ্চ তাপ (খ) কেবল নিম্ন তাপ\n(গ) উচ্চ চাপ ও তাপ (ঘ) কেবল বায়ুমণ্ডলের চাপ\nউত্তর: গ\n১৩. দুটি মনোমার একসাথে যুক্ত হলে উৎপন্ন পদার্থটিকে কীভাবে প্রকাশ করা হয়?\n(ক) $(\\text{মনোমার})_1$ \n(খ) $(\\text{মনোমার})_2$\n(গ) $(\\text{মনোমার})_3$ \n(ঘ) $(\\text{মনোমার})_n$\nউত্তর: খ\n১৪. $n$ সংখ্যক মনোমার যুক্ত হয়ে পলিমার গঠনের সাংকেতিক রূপ কোনটি?\n(ক) $(\\text{মনোমার})_n$ \n(খ) $n(\\text{পলিমার})$\n(গ) $n + \\text{মনোমার}$ \n(ঘ) $(\\text{মনোমার})_2$\nউত্তর: ক\n১৫. ঐতিহ্যবাহী উচ্চ চাপ পদ্ধতিতে ইথিলিন গ্যাস থেকে পলিথিন তৈরিতে কত তাপমাত্রার প্রয়োজন হয়?\n(ক) $100^\\circ\\text{C}$ \n(খ) $500^\\circ\\text{C}$\n(গ) $300^\\circ\\text{C}$ \n(ঘ) $200^\\circ\\text{C}$\nউত্তর: ঘ\n১৬. ঐতিহ্যবাহী পদ্ধতিতে ইথিলিন থেকে পলিথিন তৈরির সময় কত বায়ুমণ্ডলীয় চাপ ব্যবহার করা হতো?\n(ক) $100\\text{--}500$ \n(খ) $1000\\text{--}1200$\n(গ) $2000\\text{--}2500$ \n(ঘ) $50\\text{--}100$\nউত্তর: খ\n১৭. ইথিলিন থেকে উচ্চ চাপে পলিথিন তৈরির পলিমারকরণ বিক্রিয়ায় অনুঘটক বা প্রভাবক হিসেবে কোনটি ব্যবহৃত হয়?\n(ক) নাইট্রোজেন গ্যাস \n(খ) কার্বন ডাই-অক্সাইড\n(গ) হাইড্রোজেন গ্যাস \n(ঘ) অক্সিজেন গ্যাস ($O_2$)\nউত্তর: ঘ\n১৮. ইথিলিনের রাসায়নিক সংকেত কোনটি?\n(ক) $\\text{CH}_4$ \n(খ) $\\text{CH}_2 = \\text{CH}_2$\n(গ) $\\text{CH}_3 - \\text{CH}_3$ \n(ঘ) $\\text{C}_2\\text{H}_2$\nউত্তর: খ\n১৯. পলিথিনের সংকেত কোনটি?\n(ক) $(-\\text{CH}_2 - \\text{CH}_2-)_n$ \n(খ) $(\\text{CH}_2 = \\text{CH}_2)_n$\n(গ) $(\\text{CH}_3 - \\text{CH}_3)_n$ \n(ঘ) $(-\\text{CH} = \\text{CH}-)_n$\nউত্তর: ক\n২০. বর্তমানে বায়ুমণ্ডলীয় চাপেই পলিথিন তৈরিতে কোন প্রভাবকটি ব্যবহৃত হয়?\n(ক) টাইটেনিয়াম ট্রাইক্লোরাইড ($\\text{TiCl}_3$) (খ) আয়রন গুঁড়া ($\\text{Fe}$)\n(গ) নিকেল চূর্ণ ($\\text{Ni}$) \n(ঘ) প্ল্যাটিনাম ($\\text{Pt}$)\nউত্তর: ক\n২১. টাইটেনিয়াম ট্রাইক্লোরাইডের রাসায়নিক সংকেত কোনটি?\n(ক) $\\text{TiCl}_2$ \n(খ) $\\text{TiCl}_3$\n(গ) $\\text{TiCl}_4$ \n(ঘ) $\\text{Ti}_2\\text{Cl}_3$\nউত্তর: খ\n২২. বর্তমানে পলিথিন তৈরির ক্ষেত্রে টাইটেনিয়াম ট্রাইক্লোরাইড ব্যবহারের প্রধান সুবিধা কী?\n(ক) উচ্চ তাপ লাগে না \n(খ) বায়ুমণ্ডলীয় চাপেই পলিথিন তৈরি করা যায়\n(গ) অনুঘটক লাগে না \n(ঘ) মনোমার লাগে না\nউত্তর: খ"},{"id":"block_1787764717035ifn90","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৩. পলিমার ($Polymer$) ও মনোমার ($Monomer$) সম্পর্কিত তথ্য—\ni. 'পলি' শব্দের অর্থ অনেক এবং 'মেরোস' শব্দের অর্থ অংশ\nii. একই ধরনের অনেকগুলো ছোট অণু যুক্ত হয়ে পলিমার গঠন করে\niii. যে ছোট অণু থেকে পলিমার তৈরি হয় তাকে মনোমার বলে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৪. বিভিন্ন পলিমার ও তাদের ব্যবহৃত মনোমার—\ni. পলিথিন ব্যাগ তৈরি হয় ইথিলিন মনোমার থেকে\nii. পিভিসি ($PVC$) পাইপ তৈরি হয় ভিনাইল ক্লোরাইড থেকে\niii. মেলামাইন রেজিন তৈরি হয় কেবল ফেনল মনোমার থেকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৫. একাধিক মনোমার থেকে গঠিত পলিমারসমূহ—\ni. বৈদ্যুতিক সুইচ বোর্ড বা ব্যাকোলাইট তৈরি হয় ফেনল ও ফরমালডিহাইড থেকে\nii. মেলামাইন রেজিন তৈরি হয় মেলামাইন ও ফরমালডিহাইড থেকে\niii. পিভিসি তৈরি হয় ইথিলিন ও ভিনাইল ক্লোরাইড থেকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৬. প্রাকৃতিক ও কৃত্রিম পলিমার সম্পর্কিত শ্রেণিবিভাগ—\ni. পাট, সিল্ক, সুতি কাপড় ও রাবার হলো প্রাকৃতিক পলিমার\nii. মেলামাইন, রেজিন, ব্যাকোলাইট, পিভিসি ও পলিথিন হলো কৃত্রিম পলিমার\niii. কৃত্রিম পলিমারসমূহ প্রকৃতিতে হুবহু পাওয়া যায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৭. পলিমারকরণ প্রক্রিয়া সম্পর্কিত বক্তব্য—\ni. এটি নির্দিষ্ট প্রক্রিয়ার মাধ্যমে মনোমার যুক্ত করে পলিমার তৈরির প্রক্রিয়া\nii. এ প্রক্রিয়ায় সাধারণত উচ্চ চাপ ও তাপের প্রয়োজন হয়\niii. $n$ সংখ্যক মনোমার যুক্ত হয়ে $(\\text{মনোমার})_n$ গঠিত হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৮. ঐতিহ্যবাহী উচ্চ চাপ পদ্ধতিতে ইথিলিন থেকে পলিথিন তৈরি—\ni. $1000\\text{--}1200$ বায়ুমণ্ডলীয় চাপ এবং $200^\\circ\\text{C}$ তাপমাত্রার প্রয়োজন হয়\nii. বিক্রিয়া দ্রুত করার জন্য প্রভাবক হিসেবে অক্সিজেন ($O_2$) গ্যাস ব্যবহৃত হয়\niii. ইথিলিনের বিক্রিয়াটির সংকেত $n (\\text{CH}_2 = \\text{CH}_2) \\xrightarrow[(\\text{O}_2 \\text{ প্রভাবক})]{\\text{উচ্চতাপ ও চাপ}} (-\\text{CH}_2 - \\text{CH}_2-)_n$\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৯. পলিথিন তৈরির আধুনিক ও সহজতর পদ্ধতি—\ni. উচ্চ চাপ পদ্ধতি সহজসাধ্য না হওয়ায় বর্তমানে বিকল্প পদ্ধতি ব্যবহৃত হয়\nii. টাইটেনিয়াম ট্রাইক্লোরাইড ($\\text{TiCl}_3$) নামক প্রভাবক ব্যবহৃত হয়\niii. বর্তমানে স্বাভাবিক বায়ুমণ্ডলীয় চাপেই পলিথিন তৈরি করা সম্ভব\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_17877647643613ii2z","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও:   </b> \nপ্লাস্টিক সামগ্রী প্রস্তুতকারী একটি কারখানায় নির্দিষ্ট মনোমার যুক্ত করে পাইপ ও পলিথিন ব্যাগ তৈরি করা হয়। অন্যদিকে আরেকটি বিশেষ বৈদ্যুতিক সরঞ্জাম তৈরির ইউনিটে দুটি ভিন্ন মনোমার যুক্ত করে সুইচের প্লাস্টিক কভার (ব্যাকোলাইট) তৈরি করা হয়।\n৩০. উদ্দীপকে উল্লেখিত পিভিসি ($PVC$) পাইপ তৈরির সময় প্রধান মনোমার হিসেবে কোনটি ব্যবহৃত হয়?\n(ক) ইথিলিন (খ) ভিনাইল ক্লোরাইড\n(গ) মেলামাইন (ঘ) ফরমালডিহাইড\nউত্তর: খ\n৩১. উদ্দীপকে ব্যাকোলাইট বা বৈদ্যুতিক সুইচ বোর্ড তৈরিতে যে দুটি মনোমার যুক্ত করা হয় সেগুলোর নাম কী?\n(ক) মেলামাইন ও ফরমালডিহাইড\n(খ) ইথিলিন ও প্রোপিলিন\n(গ) ফেনল ও ফরমালডিহাইড\n(ঘ) ভিনাইল ক্লোরাইড ও মেলামাইন\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও:   </b>  \nবিজ্ঞান শিক্ষক ক্লাসে বললেন, \"আমরা দৈনন্দিন জীবনে যে পাট, সিল্ক ও সুতি কাপড় ব্যবহার করি সেগুলো প্রকৃতিতেই নির্দিষ্ট উপায়ে গঠিত হয়। অন্যদিকে মেলামাইনের থালা-বাসন বা পলিথিন রাসায়নিক উপায়ে শিল্প-কারখানায় তৈরি করতে হয়।\"\n৩২. উদ্দীপকে উল্লেখিত প্রথম দলের পদার্থগুলো (পাট, সিল্ক, সুতি কাপড়) রাসায়নিক গঠন বিচারে কোন প্রকৃতির অন্তর্গত?\n(ক) কৃত্রিম পলিমার (খ) প্রাকৃতিক পলিমার\n(গ) প্রাকৃতিক মনোমার (ঘ) কৃত্রিম মনোমার\nউত্তর: খ\n৩৩. উদ্দীপকের মেলামাইন রেজিন নামক কৃত্রিম পলিমারটি তৈরিতে কোন দুটি রাসায়নিক উপাদান যুক্ত হয়?\n(ক) মেলামাইন ও ফরমালডিহাইড \n(খ) ফেনল ও ফরমালডিহাইড\n(গ) ইথিলিন ও অক্সিজেন \n(ঘ) মেলামাইন ও ইথিলিন\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও:   </b>  \nরসায়ন পরীক্ষাগারে শিক্ষার্থীরা উচ্চ চাপ ও তাপমাত্রার ঐতিহ্যবাহী প্রক্রিয়ায় ইথিলিন গ্যাস থেকে পলিথিন তৈরির কৌশল পর্যবেক্ষণ করছিল। শিক্ষক তাদের জানান যে, উচ্চ চাপের ঝামেলা এড়াতে বর্তমানে একটি বিশেষ প্রভাবকের সাহায্যে বায়ুমণ্ডলীয় চাপেই এই বিক্রিয়াটি ঘটানো সম্ভব।\n৩৪. ঐতিহ্যবাহী পদ্ধতিতে ইথিলিন থেকে পলিথিন তৈরির সময় কত চাপ ও তাপমাত্রার প্রয়োজন হয়?\n(ক) $১০০\\text{--}২০০\\text{ atm}$ ও $১০০^\\circ\\text{C}$ \n(খ) $১০০০\\text{--}১২০০\\text{ atm}$ ও $২০০^\\circ\\text{C}$\n(গ) $৫০০\\text{--}৬০০\\text{ atm}$ ও $৩০০^\\circ\\text{C}$ \n(ঘ) $২০০০\\text{ atm}$ ও $৫০০^\\circ\\text{C}$\nউত্তর: খ\n৩৫. উদ্দীপকে উল্লিখিত আধুনিক বায়ুমণ্ডলীয় চাপের পদ্ধতিতে পলিথিন তৈরিতে কোন প্রভাবকটি ব্যবহৃত হয়?\n(ক) অক্সিজেন গ্যাস ($\\text{O}_2$) \n(খ) টাইটেনিয়াম ট্রাইক্লোরাইড ($\\text{TiCl}_3$)\n(গ) নিকেল চূর্ণ ($\\text{Ni}$) \n(ঘ) প্ল্যাটিনাম ($\\text{Pt}$)\nউত্তর: খ"}]},{"id":"topic_1787764786406rpvzi","title":"পাঠ-( 6.2)","blocks":[{"id":"block_1787764885453ddynj","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. আমাদের মৌলিক চাহিদার অন্যতম কোনটি, যা পোশাক তৈরিতে ব্যবহৃত হয়?\n(ক) বস্ত্র বা কাপড় (খ) পলিমার\n(গ) ধাতু (ঘ) প্লাস্টিক\nউত্তর: ক\n২. সুতা কিসের সাহায্যে তৈরি হয়?\n(ক) কাপড় (খ) প্লাস্টিক\n(গ) তন্তু (ঘ) পলিমার\nউত্তর: গ\n৩. বস্ত্রশিল্পে তন্তু বলতে মূলত কী বোঝায়?\n(ক) যেকোনো কঠিন পদার্থ \n(খ) বুনন এবং বয়নের কাজে ব্যবহৃত আঁশসমূহ\n(গ) যেকোনো ধাতব তার \n(ঘ) প্লাস্টিকের সূক্ষ্ম দড়ি\nউত্তর: খ\n৪. তন্তু দিয়ে সুতা ও কাপড় ছাড়াও নিচের কোনটি তৈরি করা হয়?\n(ক) প্লাস্টিকের পাইপ\n(খ) কাচের থালা\n(গ) লোহা ও ইস্পাত \n(ঘ) কার্পেট, ফিল্টার ও তড়িৎ নিরোধক দ্রব্য\nউত্তর: ঘ\n৫. উৎস অনুযায়ী তন্তু কত প্রকার?\n(ক) ২ প্রকার (খ) ৩ প্রকার\n(গ) ৪ প্রকার (ঘ) ৫ প্রকার\nউত্তর: ক\n৬. প্রাকৃতিকভাবে পাওয়া তন্তুগুলোকে কী বলা হয়?\n(ক) কৃত্রিম তন্তু (খ) প্রাকৃতিক তন্তু\n(গ) সেলুলোজিক তন্তু (ঘ) নন-সেলুলোজিক তন্তু\nউত্তর: খ\n৭. নিচের কোনটি প্রাকৃতিক তন্তুর উদাহরণ?\n(ক) রেয়ন \n(খ) তুলা, পাট, লিনেন, রেশম, পশম, উল, সিল্ক\n(গ) নাইলন (ঘ) ডেক্সন\nউত্তর: খ\n৮. রাসায়নিক বিক্রিয়া দ্বারা কৃত্রিম উপায়ে তৈরি তন্তুকে কী বলা হয়?\n(ক) খনিজ তন্তু (খ) প্রাণিজ তন্তু\n(গ) উদ্ভিদ তন্তু (ঘ) কৃত্রিম তন্তু\nউত্তর: ঘ\n৯. নিচের কোনটি কৃত্রিম তন্তুর উদাহরণ?\n(ক) অ্যাজবেস্টস\n(খ) তুলা ও পাট\n(গ) রেশম ও পশম (ঘ) পলিয়েস্টার, রেয়ন, ডেক্সন, নাইলন\nউত্তর: ঘ\n১০. উৎসভেদে প্রাকৃতিক তন্তুকে কত ভাগে ভাগ করা যায়?\n(ক) ২ ভাগে (খ) ৩ ভাগে\n(গ) ৪ ভাগে (ঘ) ৫ ভাগে\nউত্তর: খ\n১১. উদ্ভিদ থেকে প্রাপ্ত তুলা, পাট ইত্যাদি তন্তুকে কী বলা হয়?\n(ক) খনিজ তন্তু (খ) প্রাণিজ তন্তু\n(গ) উদ্ভিদ তন্তু (ঘ) কৃত্রিম তন্তু\nউত্তর: খ\n১২. প্রাণী থেকে প্রাপ্ত রেশম, পশম ইত্যাদি তন্তুকে কী বলা হয়?\n(ক) উদ্ভিদ তন্তু (খ) প্রাণিজ তন্তু\n(গ) খনিজ তন্তু (ঘ) কৃত্রিম তন্তু\nউত্তর: খ\n১৩. প্রাকৃতিক খনিতে পাওয়া ধাতব তন্তুকে কী বলা হয়?\n(ক) উদ্ভিদ তন্তু (খ) কৃত্রিম তন্তু\n(গ) খনিজ তন্তু (ঘ) সেলুলোজিক তন্তু\nউত্তর: গ\n১৪. গঠন উপাদান ও প্রস্তুত প্রণালী অনুযায়ী কৃত্রিম তন্তু কত প্রকার?\n(ক) ২ প্রকার (খ) ৩ প্রকার\n(গ) ৪ প্রকার (ঘ) ৫ প্রকার\nউত্তর: ক\n১৫. সেলুলোজ কী?\n(ক) এক ধরনের সূক্ষ্ম আঁশযুক্ত পদার্থ যা দিয়ে উদ্ভিদ ও প্রাণী কোষ তৈরি হয় \n(খ) বিশেষ ধরনের খনিজ লবণ\n(গ) ধাতব অণু \n(ঘ) এক ধরনের কৃত্রিম প্লাস্টিক\nউত্তর: ঘ\n১৬. সেলুলোজকে নানাভাবে প্রক্রিয়াজাত করে তৈরি করা তন্তুকে কী বলা হয়?\n(ক) নন-সেলুলোজিক তন্তু (খ) সেলুলোজিক তন্তু\n(গ) প্রাণিজ তন্তু (ঘ) খনিজ তন্তু\nউত্তর: খ\n১৭. নিচের কোনটি সেলুলোজিক তন্তুর উদাহরণ?\n(ক) রেয়ন, এসিটেট রেয়ন, ভিসকোস রেয়ন, কিউপ্রা অ্যামোনিয়াম-রেয়ন \n(খ) নাইলন ও ডেক্সন\n(গ) পলিয়েস্টার ও পলি প্রোপিলিন \n(ঘ) তুলা ও পাট\nউত্তর: ক\n১৮. যেসব কৃত্রিম তন্তু সেলুলোজ থেকে তৈরি না করে অন্যান্য পদার্থের মধ্যে রাসায়নিক বিক্রিয়া ঘটিয়ে তৈরি করা হয়, তাদের কী বলে?\n(ক) সেলুলোজিক তন্তু (খ) খনিজ তন্তু\n(গ) উদ্ভিদ তন্তু (ঘ) নন-সেলুলোজিক তন্তু\nউত্তর: ঘ\n১৯. নিচের কোনটি নন-সেলুলোজিক কৃত্রিম তন্তুর উদাহরণ?\n(ক) ভিসকোস রেয়ন \n(খ) নাইলন, পলিয়েস্টার, পলি প্রোপিলিন, ডেক্সন\n(গ) এসিটেট রেয়ন \n(ঘ) কিউপ্রা অ্যামোনিয়াম-রেয়ন\nউত্তর: খ"},{"id":"block_1787764917920142a8","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২০. তন্তুর ব্যবহার ও বৈশিষ্ট্য সংক্রান্ত সত্য বক্তব্য—\ni. সব ধরনের বস্ত্র বা কাপড় তৈরি হয় সুতা থেকে\nii. সুতা তৈরি হয় ক্ষুদ্র আঁশ তথা তন্তু থেকে\niii. তন্তু কেবল কাপড় ও সুতা তৈরিতেই ব্যবহৃত হয়, অন্য কাজে নয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২১. উৎস অনুযায়ী বিভিন্ন প্রকার প্রাকৃতিক তন্তু—\ni. তুলা ও পাট হলো উদ্ভিদ থেকে প্রাপ্ত উদ্ভিদ তন্তু\nii. রেশম ও পশম হলো প্রাণী থেকে প্রাপ্ত প্রাণিজ তন্তু\niii. খনিতে পাওয়া ধাতব তন্তু ও অ্যাজবেস্টস হলো খনিজ তন্তু\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২২. সেলুলোজিক কৃত্রিম তন্তুর উদাহরণসমূহ—\ni. এসিটেট রেয়ন ও ভিসকোস রেয়ন\nii. নাইলন ও পলিয়েস্টার\niii. কিউপ্রা অ্যামোনিয়াম-রেয়ন\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n২৩. নন-সেলুলোজিক কৃত্রিম তন্তু সম্পর্কিত তথ্য—\ni. এগুলো সেলুলোজ থেকে তৈরি করা হয় না\nii. রাসায়নিক পদার্থের মধ্যে বিক্রিয়া ঘটিয়ে এগুলো প্রস্তুত করা হয়\niii. নাইলন, পলিয়েস্টার, পলি প্রোপিলিন ও ডেক্সন এর অন্তর্ভুক্ত\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1787764940669ptbg7","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৪ ও ২৫) নং প্রশ্নের উত্তর দাও:   </b> \nবস্ত্রশিল্পের একটি কারখানায় দুই ধরনের কাঁচামাল আনা হলো। এক প্রকার কাঁচামাল তুলা ও পাট গাছ থেকে সংগৃহীত, যা সরাসরি প্রকৃতি থেকে পাওয়া যায়। অন্য প্রকার কাঁচামাল কারখানায় রাসায়নিক প্রক্রিয়ায় প্রস্তুতকৃত নাইলন ও ডেক্সন।\n২৪. উদ্দীপকের তুলা ও পাট কোন ধরনের প্রাকৃতিক তন্তুর উদাহরণ?\n(ক) খনিজ তন্তু (খ) উদ্ভিদ তন্তু\n(গ) প্রাণিজ তন্তু (ঘ) কৃত্রিম তন্তু\nউত্তর: খ\n২৫. উদ্দীপকে উল্লিখিত দ্বিতীয় প্রকারের কাঁচামাল (নাইলন ও ডেক্সন) কোন শ্রেণির কৃত্রিম তন্তু?\n(ক) সেলুলোজিক তন্তু (খ) নন-সেলুলোজিক তন্তু\n(গ) প্রাণিজ তন্তু (ঘ) খনিজ তন্তু\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২৬ ও ২৭) নং প্রশ্নের উত্তর দাও:   </b> \nবস্ত্র প্রকৌশলী জামিল সাহেব বিশেষ উপায়ে তৈরি দুটি কাপড়ের নমুনা পরীক্ষা করছিলেন। প্রথম নমুনাটি প্রস্তুত করতে কাঠ বা উদ্ভিদের সূক্ষ্ম আঁশযুক্ত উপাদান সেলুলোজকে রাসায়নিকভাবে প্রক্রিয়াজাত করে ভিসকোস রেয়ন তৈরি করা হয়েছে। দ্বিতীয় নমুনাটির তন্তু তৈরিতে কোনো সেলুলোজ ব্যবহার না করে সরাসরি রাসায়নিক বিক্রিয়ার মাধ্যমে পলিয়েস্টার তৈরি করা হয়েছে।\n২৬. উদ্দীপকে প্রথম নমুনা তৈরিতে ব্যবহৃত 'রেয়ন' কোন ধরনের তন্তুর অন্তর্ভুক্ত?\n(ক) সেলুলোজিক কৃত্রিম তন্তু (খ) নন-সেলুলোজিক কৃত্রিম তন্তু\n(গ) প্রাকৃতিক উদ্ভিদ তন্তু (ঘ) প্রাকৃতিক প্রাণিজ তন্তু\nউত্তর: ক\n২৭. উদ্দীপকে নির্দেশিত প্রথম ও দ্বিতীয় উভয় প্রকার তন্তুই প্রস্তুত প্রণালীর বিচারে কোন মূল শ্রেণির তন্তু?\n(ক) প্রাকৃতিক তন্তু (খ) কৃত্রিম তন্তু\n(গ) খনিজ তন্তু (ঘ) উদ্ভিদ তন্তু\nউত্তর: খ"}]},{"id":"topic_1787764790618ahkgt","title":"পাঠ-( 6.2.1)","blocks":[{"id":"block_1787765026899upjwp","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. প্রাকৃতিক উদ্ভিজ্জ তন্তুর মধ্যে প্রধান কোনটি?\n(ক) রেশম (খ) সুতা\n(গ) তুলা (ঘ) পশম\nউত্তর: গ\n২. তুলার অতি সূক্ষ্ম নলের মতো অংশে যে গহ্বর থাকে তাকে কী বলে?\n(ক) প্রোটোপ্লাজম (খ) লুমেন ($Lumen$)\n(গ) ফিব্রোইন (ঘ) ক্যারেটিন\nউত্তর: খ\n৩. তুলার আঁশ যখন কাঁচা থাকে তখন লুমেন কীসে পূর্ণ থাকে?\n(ক) বায়ু (খ) প্রোটিন\n(গ) ফ্যাট (ঘ) তরল পদার্থ\nউত্তর: ঘ\n৪. একটি ক্রসিংয়ে তুলার কতটি থেকে কতটি পর্যন্ত প্যাঁচ বা মোচড় থাকে?\n(ক) ৫০ থেকে ১০০টি \n(খ) ১০০ থেকে ২৫০টি\n(গ) ২৫০ থেকে ৫০০টি \n(ঘ) ৫০০ থেকে ১০০০টি\nউত্তর: খ\n৫. সুতা তৈরির সময় কাপড়ের মসৃণতার জন্য কিসের প্রয়োজন হয়?\n(ক) অতিরিক্ত তাপ \n(খ) ময়েশ্চারাইজেশন ($Moisturization$)\n(গ) পানি নিষ্কাশন \n(ঘ) শুষ্ক বাতাস\nউত্তর: খ\n৬. সুতি কাপড়ের বিশেষ বৈশিষ্ট্য কোনটি?\n(ক) তাপে সংকুচিত হয় \n(খ) খুব তাড়াতাড়ি নষ্ট হয়ে যায়\n(গ) তাপ পরিবাহিতা ও তাপন সহন ক্ষমতা বেশি\n(ঘ) পোকা সহজেই এটি কাটতে পারে\nউত্তর: গ\n৭. কোন কাপড়ে বিচ্ছুরণ প্রতিফলিত না হয়ে শোষিত হয়?\n(ক) রেশম (খ) সুতি কাপড়\n(গ) নাইলন (ঘ) উল\nউত্তর: খ\n৮. সুন্দর পোশাক তৈরির জন্য সকল তন্তুর রাজা ও সেরা কোনটি?\n(ক) তুলা (খ) নাইলন\n(গ) পশম (ঘ) রেশম ($Silk$)\nউত্তর: ঘ\n৯. রেশম পোকা থেকে কোন প্রক্রিয়ায় রেশমি তন্তু পাওয়া যায়?\n(ক) একটি নির্দিষ্ট কায়দায় গুটাই থেকে \n(খ) গাছের পাতা থেকে\n(গ) রাসায়নিক বিক্রিয়া ঘটিয়ে \n(ঘ) তুলা ফুটিয়ে\nউত্তর: ক\n১০. রেশম তন্তু মূলত কোন নামক প্রোটিন-জাতীয় পদার্থ দিয়ে তৈরি?\n(ক) ক্যারেটিন (খ) ফিব্রোইন ($Fibroin$)\n(গ) সেলুলোজ (ঘ) মেলামাইন\nউত্তর: খ\n১১. রেশম তন্তুর প্রধান গুণাবলী কোনটি?\n(ক) এটি খুব সহজে ছিঁড়ে যায়\n(খ) এটি খুব ভারী ও খসখসে\n(গ) সবচেয়ে হালকা কিন্তু অনন্য উজ্জ্বলতা ও স্থায়িত্ব\n(ঘ) তাপে গলে যায়\nউত্তর: গ\n১২. সূর্যের আলোতে রেশম তন্তুর কী ঘটে?\n(ক) রঙ আরও উজ্জ্বল হয় \n(খ) সাময়িক শক্তি বাড়ে\n(গ) শক্তি তাড়াতাড়ি নষ্ট হয়ে যায় \n(ঘ) কোনো প্রভাব পড়ে না\nউত্তর: গ\n১৩. শীতের হাত থেকে বাঁচার জন্য কোন পোশাক বিশেষভাবে ব্যবহৃত হয়?\n(ক) সুতি পোশাক (খ) রেয়ন\n(গ) নাইলনের পোশাক (ঘ) পশমি বা উলের পোশাক\nউত্তর: ঘ\n১৪. পশম বা উলের কুঁকড়ানো প্রকৃতির কারণ কী?\n(ক) এর নমনীয়তা, স্থিতিস্থাপকতা, তাপ অপরিবাহিতা ও সচ্ছলতা \n(খ) এটি কৃত্রিম তন্তু বলে\n(গ) এর উচ্চ তাপ পরিবাহিতা \n(ঘ) এর ভঙ্গুরতা\nউত্তর: ক\n১৫. উলের তৈরি কাপড়ে কিসের সৃষ্টি হয় না?\n(ক) ভাঁজ বা টোল (খ) উজ্জ্বলতা\n(গ) স্থায়িত্ব (ঘ) ছিদ্র\nউত্তর: ক\n১৬. উলের তৈরি কাপড়ের বিশেষ ধর্ম কোনটি?\n(ক) তাপ দ্রুত পরিবহন করা\n(খ) বাতাস আটকে রাখতে পারা\n(গ) আলো প্রতিফলিত করা \n(ঘ) পানিতে সহজে দ্রবীভূত হওয়া\nউত্তর: খ\n১৭. বিভিন্ন জাতের ভেড়া বা মেষের লোম থেকে বছরে কত থেকে কত পাউন্ড পশম পাওয়া যায়?\n(ক) ১ থেকে ১০ পাউন্ড (খ) ১ থেকে ৩০০ পাউন্ড\n(গ) ৪০ থেকে ২০০ পাউন্ড (ঘ) ৫০০ থেকে ১০০০ পাউন্ড\nউত্তর: গ\n১৮. জীবন্ত মেষের দেহ থেকে কেটে নেওয়া পশমকে কী বলে?\n(ক) পল্ড উল (খ) ফ্লিস উল ($Fleece\\ wool$)\n(গ) প্রাকৃতিক উল (ঘ) রেশমি উল\nউত্তর: খ\n১৯. জবাই করা বা মারা যাওয়া মেষের চামড়া থেকে ছাড়িয়ে নেওয়া পশমকে কী বলে?\n(ক) ফ্লিস উল (খ) ভেড়ার ছাল\n(গ) কৃত্রিম উল (ঘ) পল্ড উল ($Pulled\\ wool$)\nউত্তর: ঘ\n২০. পশম বা উলের মধ্যে কোনটি প্রধান উপাদান হিসেবে থাকে?\n(ক) ক্যারেটিন ($Keratin$) নামক প্রোটিন \n(খ) সেলুলোজ\n(গ) ফিব্রোইন (ঘ) টাইটেনিয়াম\nউত্তর: ক\n২১. ক্যারেটিনের মূল রাসায়নিক গঠন উপাদান কোনটি?\n(ক) কেবল কার্বন ও হাইড্রোজেন \n(খ) ক্যালসিয়াম ও আয়রন\n(গ) অ্যামিনো এসিড, নাইট্রোজেন, সালফার, হাইড্রোজেন\n(ঘ) কেবল অক্সিজেন\nউত্তর: গ\n২২. নন-সেলুলোজিক তন্তুর মধ্যে সবচেয়ে প্রধান ও জনপ্রিয় কোনটি?\n(ক) রেয়ন (খ) নাইলন\n(গ) তুলা (ঘ) রেশম\nউত্তর: খ\n২৩. সাধারণত কোন দুটি রাসায়নিক পদার্থের পলিমারকরণ প্রক্রিয়ার মাধ্যমে নাইলন তৈরি হয়?\n(ক) মেলামাইন ও সালফিউরিক এসিড\n(খ) ফেনল ও ফরমালডিহাইড\n(গ) ইথিলিন ও অক্সিজেন \n(ঘ) এডিপিক এসিড এবং হেক্সামিথিলিন ডাইএমিন\nউত্তর: ঘ\n২৪. নাইলনকে প্রধানত কয়টি শ্রেণিতে ভাগ করা যায়?\n(ক) ২ শ্রেণিতে (নাইলন ৬:৬ এবং নাইলন ৬) \n(খ) ৩ শ্রেণিতে\n(গ) ৪ শ্রেণিতে (ঘ) ৫ শ্রেণিতে\nউত্তর: ক\n২৫. নাইলনের প্রধান প্রধান সুবিধা ও বৈশিষ্ট্য কোনটি?\n(ক) খুব হালকা ও শক্ত, আগুনে পোড়ে না তবে গলে বোরাক্স বিডের মতো মার্বেল তৈরি করে \n(খ) খুব সহজে ছিঁড়ে যায়\n(গ) পানিতে দ্রুত গলে যায় \n(ঘ) তাপে সংকুচিত হয় না\nউত্তর: ক\n২৬. কৃত্রিম তন্তুর মধ্যে প্রথম এবং প্রধান কোনটি?\n(ক) নাইলন (খ) ডেক্সন\n(গ) পলিয়েস্টার (ঘ) রেয়ন\nউত্তর: ঘ\n২৭. রেয়ন প্রস্তুতকরণের মূল কাঁচামাল কোনটি?\n(ক) উলের ক্যারেটিন \n(খ) উদ্ভিদ সেলুলোজ ও এসিড\n(গ) পেট্রোলিয়াম (ঘ) সিল্কের ফিব্রোইন\nউত্তর: খ\n২৮. রেয়ন প্রধানত কত প্রকার?\n(ক) ২ প্রকার \n(খ) ৩ প্রকার (ভিসকোস, কিউপ্রাঅ্যামোনিয়াম, এসিটেট)\n(গ) ৪ প্রকার (ঘ) ৫ প্রকার\nউত্তর: খ\n২৯. রেয়নের প্রধান প্রধান বৈশিষ্ট্যসমূহ কোনটি?\n(ক) আগুনে একেবারেই পোড়ে না\n(খ) সহজে দুমড়ে মুচড়ে যায়\n(গ) আকর্ষণীয়, সুন্দর, উজ্জ্বল ও টেকসই\n(ঘ) খসখসে ও অনমনীয়\nউত্তর: গ\n৩০. রেয়ন কাপড়ের একটি প্রধান সীমাবদ্ধতা বা অসুবিধা কী?\n(ক) এটি অত্যধিক উত্তাপে নষ্ট হয়ে যায় \n(খ) এটি খুবই ভারী হয়\n(গ) এতে পোকা কাটে না \n(ঘ) এটি পানিতে ভিজলে শক্তি বাড়ে\nউত্তর: ক"},{"id":"block_1787765052394lm4um","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩১. তুলা তন্তুর বৈশিষ্ট্য ও গঠন—\ni. এটি একটি প্রধান প্রাকৃতিক উদ্ভিজ্জ তন্তু\nii. এর অতি সূক্ষ্ম নলের মতো অংশকে লুমেন ($Lumen$) বলে\niii. একটি ক্রসিংয়ে ১০০ থেকে ২৫০টি মোচড় বা প্যাঁচ থাকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩২. সুতি কাপড়ের বৈশিষ্ট্যসমূহ—\ni. সুতি কাপড়ের তাপ পরিবাহিতা ও তাপন সহন ক্ষমতা বেশি\nii. এতে বিচ্ছুরণ প্রতিফলিত না হয়ে শোষিত হয়\niii. ইস্ত্রি করার সময় কাপড় স্প্রে করে ময়েশ্চারাইজেশন করতে হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৩. রেশম ($Silk$) তন্তুর বিশেষ বৈশিষ্ট্য—\ni. এটিকে সব তন্তুর রাজা ও সেরা বলা হয়\nii. সূর্যের আলোতে বেশিক্ষণ রাখলে রেশমের শক্তি বৃদ্ধি পায়\niii. এটি ফিব্রোইন ($Fibroin$) নামক প্রোটিন-জাতীয় পদার্থ দিয়ে তৈরি\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৪. পশম বা উল তন্তুর বৈশিষ্ট্য ও শ্রেণিবিন্যাস—\ni. এটি শীতবস্ত্র তৈরির কাজে ব্যাপকভাবে ব্যবহৃত হয়\nii. জীবন্ত মেষের লোম থেকে সংগৃহীত উলকে ফ্লিস উল ($Fleece\\ wool$) বলে\niii. মৃত বা জবাই করা মেষ থেকে প্রাপ্ত উলকে পল্ড উল ($Pulled\\ wool$) বলে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৫. পশমি তন্তুর রাসায়নিক গঠন—\ni. উলে কোনো প্রোটিন-জাতীয় উপাদান থাকে না\nii. ক্যারেটিন তৈরিতে অ্যামিনো এসিড, নাইট্রোজেন, সালফার ও হাইড্রোজেন থাকে\niii. উলে মূল উপাদান হিসেবে ক্যারেটিন ($Keratin$) নামক প্রোটিন থাকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: গ\n৩৬. নাইলন তন্তুর বৈশিষ্ট্য ও শ্রেণিবিভাগ—\ni. এডিপিক এসিড ও হেক্সামিথিলিন ডাইএমিন নামক পদার্থের বিক্রিয়ায় এটি তৈরি হয়\nii. নাইলন প্রধানত দুই প্রকার: নাইলন ৬৬ এবং নাইলন ৬\niii. নাইলন আগুনে পোড়ে না, তবে গলে মার্বেলের মতো বোরাক্স বিড গঠন করে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৭. রেয়ন তন্তু সংক্রান্ত সত্য তথ্য—\ni. এটি কৃত্রিম তন্তুর মধ্যে প্রথম এবং প্রধান তন্তু\nii. রেয়ন কাপড়ে অত্যধিক উত্তাপ প্রয়োগ করলেও কোনো ক্ষতি হয় না\niii. তিন প্রকার রেয়ন হলো— ভিসকোস, কিউপ্রাঅ্যামোনিয়াম ও এসিটেট\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ"},{"id":"block_1787765079292xux3v","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও:   </b>\nতাফসীর তার দাদুর জন্য শীতের কাপড়ের দোকানে গিয়ে দুটি ভিন্ন পোশাক দেখল। প্রথম পোশাকটি জীবন্ত ভেড়ার লোম কেটে তৈরি উলের পোশাক। দ্বিতীয় পোশাকটি মসৃণ ও উজ্জ্বল, যা ফিব্রোইন প্রোটিন দ্বারা গঠিত রেশম পোকার গুটি থেকে প্রস্তুত করা হয়েছে।\n৩৮. উদ্দীপকে উল্লিখিত প্রথম পোশাকের উলটি কোন ধরনের উলের অন্তর্ভুক্ত?\n(ক) পল্ড উল (খ) ফ্লিস উল\n(গ) কৃত্রিম উল (ঘ) কিউপ্রা উল\nউত্তর: খ\n৩৯. উদ্দীপকে উল্লিখিত দ্বিতীয় পোশাকটির (রেশমি পোশাক) বিশেষ গুণাবলী কোনটি?\n(ক) এটি সকল তন্তুর রাজা এবং অত্যন্ত হালকা ও প্রফেশনাল উজ্জ্বলতাসম্পন্ন \n(খ) এটি আগুনে পোড়ে না\n(গ) এটি সূর্যের আলোতে রাখলে শক্তি বৃদ্ধি পায় \n(ঘ) এটি তাপে গলে যায়\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও:   </b>\nবস্ত্র শিল্প কারখানায় টেক্সটাইল প্রকৌশলী আরিফ সাহেব দুই ধরনের তন্তু প্রস্তুত করছিলেন। প্রথম তন্তুটিতে এডিপিক এসিড ও হেক্সামিথিলিন ডাইএমিন নামক দুটি রাসায়নিক যৌগের পলিমারকরণ ঘটানো হলো। দ্বিতীয় তন্তুটি তৈরিতে উদ্ভিদজাত সেলুলোজকে রাসায়নিকভাবে প্রক্রিয়াজাত করে তিনটি ভিন্ন রূপ (ভিসকোস, কিউপ্রাঅ্যামোনিয়াম, এসিটেট) তৈরি করা হলো।\n৪০. উদ্দীপকে বর্ণিত প্রথম উপায়ে প্রস্তুতকৃত তন্তুটির নাম কী?\n(ক) রেয়ন (খ) পশম\n(গ) সুতা (ঘ) নাইলন\nউত্তর: ঘ\n৪১. উদ্দীপকের দ্বিতীয় উপায়ে প্রস্তুতকৃত রেয়ন তন্তুর ব্যবহার ও বৈশিষ্ট্য কোনটি?\n(ক) এটি অত্যন্ত উত্তাপ সহ্য করতে পারে \n(খ) এটি সুন্দর, আকর্ষণীয় ও টেকসই কৃত্রিম তন্তু\n(গ) এটি কেবল খনিজ উৎস থেকে তৈরি \n(ঘ) এটি ধুলে সংকুচিত হয়ে যায়\nউত্তর: খ"}]},{"id":"topic_178776480318179q3p","title":"পাঠ-( 6.2.2)","blocks":[{"id":"block_1787765353417m9sv0","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. তন্তু থেকে সুতা তৈরির প্রথম ধাপ কোনটি?\n(ক) কার্ডিং (খ) তন্তু সংগ্রহ\n(গ) স্পিনিং (ঘ) কম্বিং\nউত্তর: খ\n২. তুলা গাছের বীজ থেকে তুলা আলাদা করার প্রক্রিয়াকে কী বলা হয়?\n(ক) জেনিং (খ) ব্য্যাচিং\n(গ) ব্লেন্ডিং (ঘ) স্পিনিং\nউত্তর: ক\n৩. জেনিং প্রক্রিয়ায় পাওয়া তুলার পাতলা আস্তরণকে কী বলে?\n(ক) বেল (খ) স্লাইভার\n(গ) কটন লিফ (ঘ) কটন লিস্ট\nউত্তর: ঘ\n৪. পাট গাছ কাটার পর কত দিন মাঠে ভিজিয়ে একসাথ করে রাখা হয়?\n(ক) ১-২ দিন (খ) ৫-৮ দিন\n(গ) ১০-১৫ দিন (ঘ) ২০-২৫ দিন\nউত্তর: খ\n৫. পাট গাছ পচানোর জন্য কত দিন পানিতে ডুবিয়ে রাখা হয়?\n(ক) ২-৩ দিন (খ) ৫-৮ দিন\n(গ) ১০-১৫ দিন (ঘ) ২০-২৫ দিন\nউত্তর: গ\n৬. পাট তন্তু সংগ্রহের প্রক্রিয়ায় পাট গাছ পচানোর জন্য যে পানির সাহায্য নেওয়া হয় তাকে কী বলে?\n(ক) জেনিং (খ) গ্যাচিং\n(গ) জাক (ঘ) স্পিনিং\nউত্তর: গ\n৭. জীবন্ত মেষের লোম কেটে সংগৃহীত উলকে কী বলা হয়?\n(ক) ফ্লিস উল (খ) পল্ড উল\n(গ) রেশমি উল (ঘ) সিন্থেটিক উল\nউত্তর: ক\n৮. তন্তু থেকে সুতা কাটার প্রক্রিয়ার নাম কী?\n(ক) কম্বিং (খ) স্পিনিং ($Spinning$)\n(গ) কার্ডিং (ঘ) মিক্সিং\nউত্তর: খ\n৯. বিভিন্ন খণ্ড বা বেল থেকে পাওয়া তুলার মিশ্রণ তৈরির প্রক্রিয়াকে কী বলে?\n(ক) ব্লেন্ডিং ও মিক্সিং (খ) কার্ডিং ও কম্বিং\n(গ) হ্যাকলিং (ঘ) টুইস্টিং\nউত্তর: ক\n১০. পাট তন্তুর বেলায় ব্লেন্ডিং ও মিক্সিং প্রক্রিয়াকে কী বলা হয়?\n(ক) জেনিং (খ) ব্যাচিং ($Batching$)\n(গ) কম্বিং (ঘ) পাক দেওয়া\nউত্তর: খ\n১১. সুতা কাটার দ্বিতীয় ধাপ কোনটি?\n(ক) জেনিং \n(খ) কার্ডিং ও কম্বিং ($Carding\\ \\&\\ Combing$)\n(গ) টুইস্টিং (ঘ) স্পিনিং\nউত্তর: খ\n১২. কোন তন্তুর বেলায় এক বিশেষ ধরনের কম্বিং করা হয় যা 'হ্যাকলিং' নামে পরিচিত?\n(ক) সুতি তন্তু (খ) উলের তন্তু\n(গ) লিনেন তন্তু (ঘ) রেশম তন্তু\nউত্তর: গ\n১৩. কার্ডিং ও কম্বিং করে প্রাপ্ত পাতলা আস্তরণের মতো অংশকে কী বলা হয়?\n(ক) স্লাইভার ($Sliver$) (খ) লিস্ট\n(গ) বেল (ঘ) কুকুন\nউত্তর: ক\n১৪. স্লাইভারকে টেনে সরু করার প্রক্রিয়া এবং মোচড়ানো বা পাক দেওয়াকে কী বলে?\n(ক) রোভিং ও টুইস্টিং  \n(খ) জেনিং\n(গ) ব্যাচিং (ঘ) হেল্কিং\nউত্তর: ক\n১৫. সুতায় পাক বা মোচড়ের পরিমাণ মাপার জন্য কোন যন্ত্র ব্যবহার করা হয়?\n(ক) স্কেল (খ) ব্যারোমিটার\n(গ) স্পিনারেট (ঘ) টুইস্ট কাউন্টার\nউত্তর: ঘ\n১৬. রেশম পোকা থেকে সুতা তৈরির সময় গুটিকে কী বলা হয়?\n(ক) স্লাইভার (খ) কুকুন \n(গ) বেল (ঘ) রোভিং\nউত্তর: খ\n১৭. রেশমের গুটি বা কুকুন কিসের কড়াইতে সেদ্ধ করা হয়?\n(ক) তামার (খ) অ্যালুমিনিয়ামের\n(গ) সাবান পানিতে লোহার (ঘ) কাচের\nউত্তর: গ\n১৮. চিকন বা মিহি রেশমি সুতার জন্য কতটি কোকুনের নল একসাথে টানা হয়?\n(ক) ১-২টি (খ) ৫-৭টি\n(গ) ১২-২০টি (ঘ) ২৫-৩০টি\nউত্তর: খ\n১৯. মোটা রেশমি সুতার জন্য কতটি কোকুনের নল একসাথে নেওয়া হয়?\n(ক) ২-৩টি (খ) ৫-৭টি\n(গ) ১২-২০টি (ঘ) ৩০-৪০টি\nউত্তর: গ\n২০. রেশমের কুকুন থেকে সুতা তোলার কাজে ঐতিহ্যগতভাবে কোনটি ব্যবহার করা হয়?\n(ক) স্পিনারেট (খ) জেনিং মেসিন\n(গ) টুইস্ট কাউন্টার (ঘ) চরকা\nউত্তর: ঘ\n২১. কৃত্রিম তন্তু থেকে সুতা তৈরির জন্য তন্তুর উপযুক্ত দ্রাবক দিয়ে তৈরি ঘন ও আঠালো দ্রবণকে কী বলে?\n(ক) স্পিনিং দ্রবণ (খ) সাবান দ্রবণ\n(গ) স্লাইভার (ঘ) ব্লেন্ডিং দ্রবণ\nউত্তর: ক\n২২. কৃত্রিম তন্তুর দ্রবণ থেকে সুতা বের করার জন্য ব্যবহৃত বিশেষ যন্ত্রের নাম কী?\n(ক) টুইস্ট কাউন্টার (খ) জেনিং কড়ই\n(গ) চরকা (ঘ) স্পিনারেট\nউত্তর: ঘ"},{"id":"block_1787765374821y2stk","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৩. তন্তু সংগ্রহ প্রক্রিয়া সম্পর্কিত সত্য বক্তব্য—\ni. তুলা গাছ থেকে কার্পাস ফল সংগ্রহ করে বীজ থেকে তুলা আলাদা করার প্রক্রিয়া হলো জেনিং\nii. পাট গাছ কাটার পর ৫-৮ দিন মাঠে রেখে ১০-১৫ দিন পানিতে ডুবিয়ে রাখা হয়\niii. জীবন্ত মেষের দেহ থেকে লোম কেটে নেওয়াকে ফ্লিস উল বলা হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৪. সুতা কাটার জন্য ব্লেন্ডিং, মিক্সিং ও ব্যাচিং প্রক্রিয়া—\ni. বিভিন্ন গুণমানের তুলা একত্রে মেশানোর প্রক্রিয়া হলো ব্লেন্ডিং ও মিক্সিং\nii. বাণিজ্যিক সুবিধা ও সুতার সঠিক মান বজায় রাখতে মিক্সিং প্রয়োজন হয়\niii. পাট তন্তুর বেলায় এই প্রক্রিয়ার নাম ব্যাচিং ($Batching$)\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৫. কার্ডিং ও কম্বিং প্রক্রিয়া সংক্রান্ত তথ্য—\ni. এটি সুতা কাটার দ্বিতীয় গুরুত্বপূর্ণ ধাপ\nii. সুতি, লিনেন ও উলে অপরিহার্যভাবে এটি প্রয়োগ করা হয়\niii. লিনেন তন্তুর জন্য এক বিশেষ ধরনের কম্বিং করা হয় যা হেল্কিং নামে পরিচিত\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৬. স্লাইভার, রোভিং ও টুইস্টিং—\ni. কার্ডিং ও কম্বিং করে প্রাপ্ত পাতলা আস্তরণের মতো অংশ হলো স্লাইভার ($Sliver$)\nii. স্লাইভারকে টেনে সরু করার প্রক্রিয়া হলো রোভিং এবং মোচড় দেওয়া হলো টুইস্টিং ($Twisting$)\niii. সুতায় পাক বা মোচড়ের পরিমাণ নির্ধারণে টুইস্ট কাউন্টার ($Twist\\ Counter$) ব্যবহৃত হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৭. রেশম তন্তু থেকে সুতা তৈরি সংক্রান্ত বক্তব্য—\ni. পরিপক্ব কোকুন বা গুটিকে সাবান পানিতে লোহার কড়াইতে সেদ্ধ করা হয়\nii. চিকন সুতার জন্য ৫-৭টি এবং মোটা সুতার জন্য ১২-২০টি কোকুনের নল নেওয়া হয়\niii. রেশম কোকুন থেকে সুতা সংগ্রহের জন্য ঐতিহ্যগতভাবে চরকা ব্যবহার করা হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৮. কৃত্রিম তন্তু থেকে সুতা তৈরির পদ্ধতি—\ni. উপযুক্ত দ্রাবকে দ্রবীভূত করে ঘন ও আঠালো স্পিনিং দ্রবণ তৈরি করা হয়\nii. স্পিনিং দ্রবণকে স্পিনারেট নামক যন্ত্রের সাহায্যে উচ্চ চাপে প্রবাহিত করা হয়\niii. স্পিনারেট থেকে কৃত্রিম সুতার দীর্ঘ নল বের হয়ে সরাসরি ব্যবহারের উপযোগী হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_17877653990710j31l","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>\nকরিম সাহেব তাঁর কারখানায় সংগৃহীত তুলার বীজ পৃথক করে প্রাপ্ত আঁশ থেকে সুতা তৈরি করেন। পরবর্তীতে বিভিন্ন মান ও জাতের তুলা মিশিয়ে সঠিক গুণগত মান বজায় রেখে স্লাইভার তৈরি করা হয় এবং বিশেষ যন্ত্র দিয়ে মোচড় মেপে শক্ত সুতা প্রস্তুত করা হয়।\n২৯. উদ্দীপকে করিম সাহেবের বীজ থেকে তুলা পৃথক করার প্রক্রিয়াটিকে কী বলা হয়?\n(ক) ব্যাচিং (খ) জেনিং\n(গ) স্পিনিং (ঘ) হেল্কিং\nউত্তর: খ\n৩০. উদ্দীপকে সুতার মোচড় বা পাকের পরিমাণ মাপার জন্য করিম সাহেব কোন যন্ত্র ব্যবহার করেন?\n(ক) স্পিনারেট (খ) ডায়াল গেজ\n(গ) চরকা (ঘ) টুইস্ট কাউন্টার\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>\nবস্ত্র কারখানার প্রকৌশলী সিয়াম দুই ধরনের তন্তু নিয়ে কাজ করছেন। প্রথম ক্ষেত্রে লিনেন তন্তুকে বিশেষ প্রক্রিয়ায় কম্বিং করে পাতলা স্লাইভার বানানো হলো। দ্বিতীয় ক্ষেত্রে পশমি তন্তুর স্লাইভারকে টেনে সরু করে মোচড় দিয়ে শক্ত সুতায় রূপান্তর করা হলো।\n৩১. উদ্দীপকের লিনেন তন্তুর জন্য ব্যবহৃত বিশেষ কম্বিং প্রক্রিয়াটির নাম কী?\n(ক) ব্যাচিং (খ) হেল্কিং\n(গ) জেনিং (ঘ) স্পিনিং\nউত্তর: খ\n৩২. উদ্দীপকের দ্বিতীয় ক্ষেত্রে স্লাইভারকে টেনে সরু করা এবং মোচড় দেওয়ার প্রক্রিয়া দুটিকে যথাক্রমে কী বলা হয়?\n(ক) জেনিং ও ব্যাচিং (খ) রোভিং ও টুইস্টিং\n(গ) কম্বিং ও কার্ডিং (ঘ) ব্লেন্ডিং ও মিক্সিং\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b>\nরেশম চাষী শফিক সাহেব কিছু পরিপক্ব কোকুন সাবান পানিতে ফুটন্ত লোহার কড়াইতে সেদ্ধ করলেন। এরপর তিনি সুতার মিহিনতার ওপর ভিত্তি করে নির্দিষ্ট সংখ্যক কোকুনের নল একসাথে এনে ঐতিহ্যবাহী একটি সরঞ্জামের সাহায্যে লম্বা সুতা তুলে আনলেন।\n৩৩. উদ্দীপকে মিহি বা চিকন সুতা তৈরির জন্য শফিক সাহেবকে কতটি কোকুনের নল একসাথে নিয়ে টানতে হবে?\n(ক) ১–২টি (খ) ৫–৭টি\n(গ) ১২–২০টি (ঘ) ২৫–৩০টি\nউত্তর: খ\n৩৪. উদ্দীপকে কোকুন থেকে সুতা তোলার কাজে শফিক সাহেব ঐতিহ্যগতভাবে কোন সরঞ্জামটি ব্যবহার করেছিলেন?\n(ক) স্পিনারেট (খ) কম্বিং ফ্রেম\n(গ) টুইস্ট কাউন্টার (ঘ) চরকা\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও:   </b>\nএকটি গবেষণাগারে বৈজ্ঞানিকরা কৃত্রিম তন্তু থেকে সুতা তৈরির জন্য রাসায়নিক দ্রাবকে ঘন ও আঠালো দ্রবণ তৈরি করলেন। এরপর দ্রবণটি একটি সূক্ষ্ম ছিদ্রযুক্ত বিশেষ যন্ত্রের মধ্য দিয়ে উচ্চ চাপে প্রবাহিত করে সরু সুতার নল তৈরি করলেন।\n৩৫. উদ্দীপকে কৃত্রিম তন্তুর জন্য প্রস্তুতকৃত ঘন ও আঠালো দ্রবণটিকে কী বলা হয়?\n(ক) স্পিনিং দ্রবণ (খ) ব্যাচিং দ্রবণ\n(গ) স্লাইভার (ঘ) প্রোটিন দ্রবণ\nউত্তর: ক\n৩৬. উদ্দীপকে ব্যবহৃত উচ্চ চাপে সূক্ষ্ম ছিদ্র দিয়ে দ্রবণ প্রবাহিত করার যন্ত্রটির নাম কী?\n(ক) টুইস্ট কাউন্টার (খ) স্পিনারেট\n(গ) চরকা (ঘ) জেনিং কড়াই\nউত্তর: খ"}]},{"id":"topic_1787765411683v54zf","title":"পাঠ-( 6.3.1 ও 6.3.2 ও 6.3.3)","blocks":[{"id":"block_17877654564579k4yr","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. পেন্সিলের লেখা মোছার ইরেজার কী দিয়ে তৈরি?\n(ক) কাচ (খ) প্লাস্টিক\n(গ) রাবার (ঘ) সুতা\nউত্তর: গ\n২. প্রাকৃতিক রাবার সাধারণত কোথায় অদ্রবণীয়?\n(ক) পানিতে (খ) অ্যাসিটোনে\n(গ) পেট্রোলে (ঘ) বেনজিনে\nউত্তর: ক\n৩. নিচে উল্লিখিত কোন জৈব দ্রাবকে রাবার সহজে দ্রবণীয়?\n(ক) কেবল পানিতে \n(খ) অ্যাসিটোন, পেট্রোল, ইথার, বেনজিন\n(গ) এসিড ও ক্ষার (ঘ) তরল নাইট্রোজেন\nউত্তর: খ\n৪. সাধারণত রাবারের বর্ণ কেমন হয়?\n(ক) ঘন কালো (খ) নীল\n(গ) লালচে হলুদ (ঘ) সাদা বা হালকা বাদামি\nউত্তর: ঘ\n৫. রাবারের একটি বিশেষ ভৌত ধর্ম কোনটি?\n(ক) এটি টানলে লম্বা হয় এবং ছেড়ে দিলে আগের অবস্থায় ফিরে যায় \n(খ) এটি খুব ভঙ্গুর\n(গ) এটি তাপে কখনো গলে না \n(ঘ) এটি বিদ্যুৎ সুপরিবাহী\nউত্তর: ক\n৬. তাপ দিলে বিশুদ্ধ রাবারের আয়তনের কী পরিবর্তন ঘটে?\n(ক) আয়তন বৃদ্ধি পায় (খ) আয়তন কমে যায়\n(গ) আয়তন অপরিবর্তিত থাকে \n(ঘ) এটি সাথে সাথে শক্ত হয়\nউত্তর: খ\n৭. দুর্বল ক্ষার বা এসিডের সাথে রাবার কী ধরনের আচরণ করে?\n(ক) দ্রুত বিক্রিয়া করে গলে যায় \n(খ) আগুন ধরে যায়\n(গ) কোনো বিক্রিয়া করে না (ঘ) গ্যাস উৎপন্ন করে\nউত্তর: গ\n৮. দীর্ঘদিন রেখে দিলে রাবার নষ্ট হয়ে যাওয়ার মূল কারণ কোনটি?\n(ক) বাতাসের অক্সিজেনের সাথে বিক্রিয়া \n(খ) পানির উপস্থিতি\n(গ) আলোর অভাব (ঘ) অণুজীবের আক্রমণ\nউত্তর: ক\n৯. প্রাকৃতিক রাবারের সাথে রাসায়নিক বিক্রিয়া করে এটিকে নষ্ট করে কোনটি?\n(ক) ওজোন ($\\text{O}_3$) (খ) নাইট্রোজেন\n(গ) হাইড্রোজেন (ঘ) হেলিয়াম\nউত্তর: ক\n১০. 'প্লাস্টিক' শব্দের অর্থ কী?\n(ক) সহজে ভাঙনশীল (খ) তাপ প্রতিরোধক\n(গ) অত্যন্ত শক্ত (ঘ) সহজেই ছাঁচযোগ্য\nউত্তর: ঘ\n১১. গলিত অবস্থায় ইচ্ছামতো যেকোনো আকার দেওয়া যায় এবং ঠান্ডা করলে শক্ত হয়— এদের কী বলে?\n(ক) থার্মোপ্লাস্টিক  (খ) থার্মোসেটিং প্লাস্টিক\n(গ) মেলামাইন (ঘ) ব্যাকোলাইট\nউত্তর: ক\n১২. নিচের কোনটি থার্মোপ্লাস্টিকের উদাহরণ?\n(ক) মেলামাইন ও ব্যাকোলাইট \n(খ) পলিথিন, পিভিসি পাইপ, পলিয়েস্টার কাপড়\n(গ) রাবার ও কাচ (ঘ) সিরামিক\nউত্তর: খ\n১৩. তাপ দিলে নরম হয় না বরং পুড়ে শক্ত হয়ে যায় এবং যা বারবার গলানো যায় না— তাকে কী বলে?\n(ক) থার্মোপ্লাস্টিক \n(খ) প্রাকৃতিক পলিমার\n(গ) থার্মোসেটিং প্লাস্টিক (ঘ) কৃত্রিম তন্তু\nউত্তর: গ\n১৪. নিচের কোনটি থার্মোসেটিং প্লাস্টিকের উদাহরণ?\n(ক) পলিথিন (খ) মেলামাইন ও ব্যাকোলাইট\n(গ) পিভিসি পাইপ (ঘ) পলিয়েস্টার\nউত্তর: খ\n১৫. প্লাস্টিক পোড়ালে পিভিসি থেকে কোন ক্ষতিকর এসিড গ্যাস নির্গত হয়?\n(ক)  কার্বনিক এসিড\n(খ) সালফিউরিক এসিড\n(গ) নাইট্রিক এসিড (ঘ) হাইড্রোজেন ক্লোরাইড\nউত্তর: ঘ\n১৬. পলিউরেথেন ($\\text{Polyurethane}$) প্লাস্টিক পোড়ালে কোন কোন বিষাক্ত গ্যাস তৈরি হয়?\n(ক) কার্বন মনোক্সাইড ও হাইড্রোজেন সায়ানাইড \n(খ) অক্সিজেন ও নাইট্রোজেন\n(গ) মিথেন ও কার্বন ডাই-অক্সাইড \n(ঘ) ক্লোরিন ও সালফার ডাই-অক্সাইড\nউত্তর: ক\n১৭. প্লাস্টিক ও রাবার বর্জ্য মাটিতে জমে থাকলে কী ক্ষতি হয়?\n(ক) মাটির উর্বরতা বাড়ে \n(খ) মাটির পানি ধারণ ক্ষমতা বাড়ে\n(গ) মাটির উর্বরতা নষ্ট হয়\n(ঘ) মাটির ক্ষারীয়তা বাড়ে\nউত্তর: গ\n১৮. সমুদ্রে বা নদীতে ফেলা প্লাস্টিক বর্জ্য সামুদ্রিক জীবনের কী ক্ষতি করে?\n(ক) ক্যানসারের মতো মারাত্মক রোগ সৃষ্টি করতে পারে \n(খ) মাছের বংশবৃদ্ধি বাড়ায়\n(গ) পানি বিশুদ্ধ করে \n(ঘ) কোনো প্রভাব ফেলে না\nউত্তর: ক"},{"id":"block_1787765491794ja2x6","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n১৯. রাবারের ভৌত ও রাসায়নিক ধর্ম—\ni. এটি পানিতে অদ্রবণীয় হলেও পেট্রোল, অ্যাসিটোন ও বেনজিনে দ্রবণীয়\nii. রাবার দুর্বল এসিড ও ক্ষারের সাথে দ্রুত বিক্রিয়া করে নষ্ট হয়ে যায়\niii. তাপ দিলে অধিকাংশ পদার্থের আয়তন বাড়লেও রাবারের আয়তন কমে যায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n২০. রাবার নষ্ট হওয়ার কারণসমূহ—\ni. এটি দীর্ঘদিন রেখে দিলে বাতাসের অক্সিজেনের সাথে বিক্রিয়া করে\nii. ওজোন ($\\text{O}_3$) গ্যাসের প্রভাবে রাবার ধীরে ধীরে তাপে বা বাতাসে নষ্ট হয়\niii. এটি পানির সান্নিধ্যে এলে সাথে সাথে গলে যায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২১. থার্মোপ্লাস্টিকের বৈশিষ্ট্য—\ni. মেলামাইন ও ব্যাকোলাইট হলো থার্মোপ্লাস্টিকের চমৎকার উদাহরণ\nii. একে যতবার খুশি গলানো যায় এবং ইচ্ছেমতো আকার দেওয়া যায়\niii. তাপ দিলে এটি নরম হয় এবং ঠান্ডা করলে পুনরায় শক্ত হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: গ\n২২. থার্মোসেটিং প্লাস্টিকের ধর্মসমূহ—\ni. এটিকে তাপ দিলে নরম হয় না বরং পুড়ে শক্ত হয়ে যায়\nii. মেলামাইন ও ব্যাকোলাইট জাতীয় প্লাস্টিক এই শ্রেণির অন্তর্গত\niii. একে বারবার গলিয়ে ইচ্ছামতো নতুন আকৃতি দেওয়া সম্ভব\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৩. প্লাস্টিক পোড়ানোর ক্ষতিকর প্রভাব—\ni. পিভিসি প্লাস্টিক পোড়ালে বিষাক্ত হাইড্রোজেন ক্লোরাইড ($\\text{HCl}$) গ্যাস তৈরি হয়\nii. প্লাস্টিক পোড়ানো পরিবেশের জন্য সম্পূর্ণ নিরাপদ\niii. পলিউরেথেন পোড়ালে কার্বন মনোক্সাইড ও হাইড্রোজেন সায়ানাইড গ্যাস নির্গত হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n২৪. পরিবেশের ওপর প্লাস্টিক ও রাবার বর্জ্যের অপপ্রভাব—\ni. ড্রেন বা নালায় জমে জলাবদ্ধতা সৃষ্টি করে এবং নদীর নাব্যতার সংকট তৈরি করে\nii. মাটিতে বছরের পর বছর অবিকৃত থেকে মাটির উর্বরতা নষ্ট করে\niii. গবাদিপশু ও সামুদ্রিক মাছের খাদ্যের সাথে পুষ্টি হিসেবে গৃহীত হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_1787765516138ta2uz","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৫ ও ২৬) নং প্রশ্নের উত্তর দাও:   </b>\nনাফিস একটি বিজ্ঞান প্রদর্শনীতে দুটি পদার্থ প্রদর্শন করল। প্রথম পদার্থটি পানিতে অদ্রবণীয় হলেও পেট্রোল ও বেনজিনে সহজেই দ্রবীভূত হয় এবং টানা দিলে লম্বা হয়। দ্বিতীয় পদার্থটি সাধারণ অবস্থায় নরম ও সহজে ছাঁচে ফেলে যেকোনো আকৃতি দেওয়া যায়, তবে আগুনে পোড়ালে অত্যন্ত বিষাক্ত হাইড্রোজেন ক্লোরাইড ($\\text{HCl}$) গ্যাস নির্গত হয়।\n২৫. উদ্দীপকের প্রথম পদার্থটির (রাবার) আয়তনে কী ঘটে যখন এতে তাপ প্রয়োগ করা হয়?\n(ক) আয়তন বৃদ্ধি পায় (খ) আয়তন কমে যায়\n(গ) আয়তন অপরিবর্তিত থাকে \n(ঘ) পদার্থটি বাষ্পীভূত হয়\nউত্তর: খ\n২৬. উদ্দীপকের দ্বিতীয় পদার্থটিতে (পিভিসি) তাপ দিলে কেমন পরিবর্তন ঘটে এবং এটি কোন শ্রেণির অন্তর্গত?\n(ক) নরম হয় ও গলানো যায়; থার্মোপ্লাস্টিক \n(খ) পুড়ে শক্ত হয়; থার্মোসেটিং\n(গ) অপরিবর্তিত থাকে; প্রাকৃতিক পলিমার \n(ঘ) পুরোপুরি অদৃশ্য হয়ে যায়; সেলুলোজিক\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (২৭ ও ২৮) নং প্রশ্নের উত্তর দাও:   </b>\nসাজিদ তার রান্নার ফ্রাইপ্যানের হাতলে ব্যবহৃত শক্ত কালো প্লাস্টিক কভার (ব্যাকোলাইট) এবং এক টুকরো সাধারণ পলিথিন নিয়ে পরীক্ষা করছিল। সে দেখল, পলিথিন তাপ দিলে গলে নরম হয়ে যায় এবং ঠান্ডা করলে আবার শক্ত হয়। কিন্তু ফ্রাইপ্যানের হাতলের প্লাস্টিকটিতে বেশি তাপ দিলেও তা নরম হয় না, বরং পুড়ে শক্ত হয়ে যায়।\n২৭. উদ্দীপকের পলিথিন তন্তুটি কোন শ্রেণির প্লাস্টিকের অন্তর্গত?\n(ক) থার্মোসেটিং প্লাস্টিক (খ) থার্মোপ্লাস্টিক\n(গ) প্রাকৃতিক প্লাস্টিক (ঘ) বায়ো-প্লাস্টিক\nউত্তর: খ\n২৮. উদ্দীপকে ফ্রাইপ্যানের হাতলে ব্যবহৃত ব্যাকোলাইট প্লাস্টিকটিকে 'থার্মোসেটিং প্লাস্টিক' বলা হয় কেন?\n(ক) একে বারবার গলিয়ে ইচ্ছামতো আকার দেওয়া যায় \n(খ) এটি পানিতে দ্রুত গলে যায়\n(গ) এটি তাপ দিলে নরম হয় না এবং দ্বিতীয়বার ছাঁচে ফেলা যায় না \n(ঘ) এটি অত্যন্ত নরম ও অনমনীয়\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>\nএকটি পরিবেশবাদী সংগঠন শহরের নালা-নর্দমা পর্যবেক্ষণ করে দেখল যে, জমে থাকা পলিথিন ও বোতলের কারণে সামান্য বৃষ্টিতেই শহরের রাস্তাগুলো পানিতে তলিয়ে জলাবদ্ধতা সৃষ্টি করছে। অন্যদিকে খোলা স্থানে ফেলে রাখা পলিউরেথেন ($\\text{Polyurethane}$) প্লাস্টিক পোড়ানোর ফলে চারপাশের বাতাসে মারাত্মক ক্ষতিকর গ্যাস ছড়িয়ে পড়ছে।\n২৯. উদ্দীপকে উল্লিখিত অপচনশীল প্লাস্টিক বর্জ্য ড্রেন ও নদীতে ফেলার ফলে কী পরিবেশগত সংকট তৈরি হয়?\n(ক) ড্রেনের পানি প্রবাহ বন্ধ হয়ে জলাবদ্ধতা সৃষ্টি হয় এবং নদীর গভীরতা কমে যায় \n(খ) মাটির উর্বরতা বৃদ্ধি পায়\n(গ) নদী ও নালা স্বয়ংক্রিয়ভাবে পরিষ্কার হয়ে যায় \n(ঘ) বাতাসের অক্সিজেন বৃদ্ধি পায়\nউত্তর: ক\n৩০. উদ্দীপকের পলিউরেথেন প্লাস্টিক বর্জ্য পোড়ালে কোন কোন মারাত্মক বিষাক্ত গ্যাস উৎপন্ন হয়?\n(ক) হাইড্রোজেন ও অক্সিজেন \n(খ) কার্বন মনোক্সাইড ও হাইড্রোজেন সায়ানাইড\n(গ) নাইট্রোজেন ডাই-অক্সাইড ও হেলিয়াম \n(ঘ) কার্বন ডাই-অক্সাইড ও মিথেন\nউত্তর: খ\n\n\n<span style=\"color:red;\"><center><b>————————🌸 সমাপ্ত 🌸————————</b></center></span>\n\n\n"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>

</html>
