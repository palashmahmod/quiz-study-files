\n২১. উদ্ভিদের সালোকসংশ্লেষণ প্রক্রিয়া সম্পর্কিত সত্য উক্তি—\ni. এই প্রক্রিয়ার জন্য উদ্ভিদ বায়ু থেকে $CO_2$ গ্রহণ করে\nii. এই প্রক্রিয়ার উপজাত হিসেবে উদ্ভিদ $O_2$ ত্যাগ করে\niii. এটি দিবারাত্রি $২৪\\text{ ঘণ্টা}$ সমান হারে চলতে থাকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২২. উদ্ভিদের শ্বসন প্রক্রিয়া সংক্রান্ত তথ্য—\ni. এই প্রক্রিয়ার জন্য উদ্ভিদ বায়ুমণ্ডল থেকে $O_2$ গ্রহণ করে\nii. শ্বসন প্রক্রিয়ার ফলে বায়ুমণ্ডলে $CO_2$ ত্যাগ করা হয়\niii. এটি দিবারাত্রি $২৪\\text{ ঘণ্টা}$ অনবরত সংঘটিত হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৩. উদ্ভিদের যেসব অঙ্গের মাধ্যমে গ্যাসের বিনিময় ঘটে—\ni. পাতার স্টোমাটা\nii. পরিণত কাণ্ডের লেন্টিসেল ($Lenticel$)\niii. মূলের মাধ্যমে শোষিত পানির স্থান\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৪. দিনের বেলা উদ্ভিদের গ্যাসীয় বিনিময়ের অবস্থা—\ni. পর্যাপ্ত আলোর উপস্থিতিতে সালোকসংশ্লেষণের হার অধিক হয়\nii. সালোকসংশ্লেষণে উৎপন্ন $O_2$-এর কিছু অংশ শ্বসনে ব্যবহৃত হয়\niii. আদান-প্রদানকৃত $O_2$ ও $CO_2$ গ্যাসের পরিমাণ প্রায় সমান থাকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৫. রাতের বেলা উদ্ভিদের গ্যাসীয় বিনিময়ের প্রকৃতি—\ni. আলোর অভাবে সালোকসংশ্লেষণের আলোক পর্যায় বন্ধ থাকে\nii. আলোক পর্যায় বন্ধ থাকায় $O_2$ গ্যাস উৎপন্ন হয় না\niii. শ্বসন প্রক্রিয়া চালু থাকায় অনবরত $CO_2$ গ্যাস উৎপন্ন হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৬. রাতের বেলা বড় গাছের নিচে ঘুমানো সংক্রান্ত তথ্য—\ni. গাছের নিচে ঘুমালে মানুষের শ্বাসকষ্ট দেখা দিতে পারে\nii. শ্বসন প্রক্রিয়ায় নির্গত $CO_2$ গ্যাস জমা হওয়াই এর কারণ\niii. প্রস্বেদন প্রক্রিয়া বন্ধ থাকার কারণে এটি ঘটে থাকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৭. উদ্ভিদদেহে পানি ও গ্যাসের বিক্রিয়া সংক্রান্ত সঠিক তথ্য—\ni. পাতা বায়ু থেকে $O_2$ ও $CO_2$ গ্যাস গ্রহণ করে\nii. মূল মাটি থেকে পানি শোষণ করে\niii. শোষিত পানির সাথে $CO_2$-এর বিক্রিয়ার ফলে $O_2$ গ্যাস উৎপন্ন হয় যা বায়ুমণ্ডলে চলে যায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1788004936829forp4","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৮ ও ২৯) নং প্রশ্নের উত্তর দাও:   </b>  \nনবম শ্রেণির শিক্ষার্থী তানভীর একটি উদ্ভিদের পর্যবেক্ষণ চালিয়ে দেখল যে, আলোর উপস্থিতিতে উদ্ভিদটি বায়ুমণ্ডল থেকে এক ধরনের গ্যাস গ্রহণ করছে এবং অন্য একটি গ্যাস বর্জন করছে। আবার রাতের বেলা আলো না থাকায় একটি নির্দিষ্ট গ্যাসীয় বিক্রিয়া বন্ধ রয়েছে, তবে আর একটি শারীরবৃত্তীয় প্রক্রিয়া অনবরত চলছে।\n২৮. উদ্দীপকে আলোর উপস্থিতিতে উদ্ভিদ বায়ুমণ্ডল থেকে কোন গ্যাসটি গ্রহণ করে?\n(ক) $O_2$ (খ) $CO_2$\n(গ) $N_2$ (ঘ) $CH_4$\nউত্তর: খ\n২৯. উদ্দীপকে রাতের বেলা বন্ধ থাকা প্রক্রিয়াটিতে কোন গ্যাস উৎপন্ন হওয়া বন্ধ হয়ে যায়?\n(ক) $CO_2$ (খ) $N_2$\n(গ) $NH_3$ (ঘ) $O_2$\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও:   </b> \nরাতের বেলা বাড়ির উঠানে থাকা বড় মেহগনি গাছের নিচে ঘুমিয়ে পড়েছিলেন একজন পথচারী। কিছুক্ষণ পর তিনি প্রচণ্ড শ্বাসকষ্ট অনুভব করে জেগে উঠলেন। পরবর্তীতে একজন বিজ্ঞান শিক্ষক তাকে ব্যাখ্যা করলেন যে, রাতে গাছের বিশেষ এক শারীরবৃত্তীয় প্রক্রিয়ার কারণে এমন ঘটনা ঘটে থাকে।\n৩০. উদ্দীপকে উল্লেখিত ঘটনাটিতে রাতের বেলা বড় গাছের নিচে শ্বাসকষ্ট হওয়ার কারণ কোনটি?\n(ক) অনবরত $CO_2$ নির্গত হওয়া\n(খ) অতিরিক্ত $O_2$ জমা হওয়া\n(গ) গাছের প্রস্বেদন বন্ধ হওয়া \n(ঘ) উদ্ভিদে পানি শোষণ বন্ধ হওয়া\nউত্তর: ক\n৩১. উদ্দীপকে রাতের বেলা গাছে কোন শারীরবৃত্তীয় প্রক্রিয়াটি ২৪ ঘণ্টা অনবরত চালু থাকার কারণে উক্ত গ্যাস নির্গত হচ্ছিল?\n(ক) সালোকসংশ্লেষণ (খ) শ্বসন\n(গ) প্রস্বেদন (ঘ) ইম্বাইবিশন\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও:   </b> \nপরীক্ষাগারে একটি টবের উদ্ভিদের পাতার ও কাণ্ডের গঠন পর্যবেক্ষণ করা হলো। দেখা গেল পাতার গায়ে থাকা বিশেষ এক প্রকার ছিদ্র এবং কাণ্ডের বাকলে থাকা অন্য এক প্রকার ছিদ্রের মাধ্যমে পরিবেশের সাথে গ্যাসের বিনিময় ঘটছে।\n৩২. উদ্দীপকে বর্ণিত পাতার যে ছিদ্রের মাধ্যমে উদ্ভিদের গ্যাসীয় বিনিময় ঘটে তার নাম কী?\n(ক) লেন্টিসেল (খ) কিউটিকেল\n(গ) ট্রাইকোম (ঘ) স্টোমাটা\nউত্তর: ঘ\n৩৩. উদ্দীপকে পরিণত কাণ্ডের বাকলে থাকা বিশেষ ছিদ্রটিকে কী বলা হয়?\n(ক) স্টোমাটা (খ) লেন্টিসেল ($Lenticel$)\n(গ) ক্যামবিয়াম (ঘ) রক্ষীকোষ\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও:   </b> \nদিনের বেলা পর্যাপ্ত সূর্যালোকের উপস্থিতিতে একটি উদ্ভিদের দেহের অভ্যন্তরে সালোকসংশ্লেষণ ও শ্বসন উভয় প্রক্রিয়াই দ্রুতগতিতে চলছিল। ফলে দেখা গেল উদ্ভিদটি কর্তৃক আদান-প্রদানকৃত দুটি গ্যাসের পরিমাণের মধ্যে একটি বিশেষ সমতা বজায় রয়েছে।\n৩৪. উদ্দীপকের প্রক্রিয়া দুটির ফলে দিনের বেলা আদান-প্রদানকৃত $O_2$ ও $CO_2$ গ্যাসের পরিমাণ কেমন থাকে?\n(ক) $O_2$ দ্বিগুণের বেশি থাকে \n(খ) $CO_2$ দ্বিগুণের বেশি থাকে\n(গ) প্রায় সমান থাকে\n(ঘ) $O_2$ শূন্য হয়ে যায়\nউত্তর: গ\n৩৫. উদ্দীপকে উল্লেখিত শ্বসন প্রক্রিয়ায় উৎপন্ন কার্বন ডাই-অক্সাইড গ্যাসের কিছু অংশ দিনে কোন প্রক্রিয়ায় পুনঃব্যবহৃত হয়?\n(ক) সালোকসংশ্লেষণ (খ) প্রস্বেদন\n(গ) পরিবহন (ঘ) পরিস্রাবণ\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </b> \nউদ্ভিদ তার বৃদ্ধি ও শারীরবৃত্তীয় কাজের জন্য মূল দিয়ে মাটি থেকে পানি শোষণ করে। শোষিত পানি কান্ড ও পাতা পর্যন্ত পৌঁছানোর পর পাতা বাতাস থেকে শোষিত একটি গ্যাসের সাথে ঐ পানির বিক্রিয়া ঘটায়, যার ফলে বায়ুমণ্ডলে জীবনধারণের জন্য অপরিহার্য একটি গ্যাস নির্গত হয়।\n৩৬. উদ্দীপকের শোষিত পানির সাথে শোষিত $CO_2$-এর বিক্রিয়ার ফলে কোন গ্যাস উৎপন্ন হয়?\n(ক) $CO_2$ (খ) $H_2$\n(গ) $N_2$ (ঘ) $O_2$\nউত্তর: ঘ\n৩৭. উদ্দীপকে উদ্ভিদ বায়ুমণ্ডলে উক্ত গ্যাসীয় বিনিময় কোন উপায়ে সম্পন্ন করে?\n(ক) কেবল ভৌত উপায়ে \n(খ) রাসায়নিক বিক্রিয়ার মাধ্যমে\n(গ) চাপ প্রয়োগের মাধ্যমে \n(ঘ) যান্ত্রিক উপায়ে\nউত্তর: খ"}]},{"id":"topic_17880053206336a6uc","title":"পাঠ-( 7.2 ও 7.2.1)","blocks":[{"id":"block_1788076361932oeiaf","type":"text","value":"<span style=\"color:green;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. মানবদেহে খাদ্যবস্তু অক্সিজেনের সাথে জারিত হয়ে কী উৎপন্ন হয়?\n(ক) শক্তি ও কার্বন ডাই-অক্সাইড\n(খ) গ্লুকোজ ও পানি\n(গ) নাইট্রোজেন ও শক্তি \n(ঘ) কেবল অক্সিজেন\nউত্তর: ক\n২. শ্বসন প্রক্রিয়ায় উৎপন্ন কোন উপাদানটি মানবদেহকে উষ্ণ রাখে?\n(ক) শ্লেষ্মা (খ) তাপ\n(গ) গ্লুকোজ (ঘ) প্রোটিন\nউত্তর: খ\n৩. কত মিনিটের বেশি দেহে অক্সিজেনের সরবরাহ বন্ধ থাকলে মানুষের মৃত্যু অনিবার্য?\n(ক) $১\\text{--}২\\text{ মিনিট}$ \n(খ) $৩\\text{--}৪\\text{ মিনিট}$\n(গ) $৫\\text{--}৬\\text{ মিনিট}$ \n(ঘ) $৭\\text{--}৮\\text{ মিনিট}$\nউত্তর: খ\n৪. শ্বসনের সঠিক রাসায়নিক সমীকরণ কোনটি?\n(ক) $C_6H_{12}O_6 + 6O_2 \\longrightarrow 6CO_2 + 6H_2O + \\text{শক্তি (ATP)}$ \n(খ) $6CO_2 + 6H_2O \\longrightarrow C_6H_{12}O_6 + 6O_2$\n(গ) $C_6H_{12}O_6 + O_2 \\longrightarrow CO_2 + H_2O$ \n(ঘ) $C_6H_{12}O_6 + 6CO_2 \\longrightarrow 6O_2 + \\text{শক্তি}$\nউত্তর: ক\n৫. শ্বসনতন্ত্রের প্রথম অংশের নাম কী?\n(ক) গলবিল (খ) শ্বাসনালি\n(গ) স্বরযন্ত্র (ঘ) নাসিকা বা নাক\nউত্তর: ঘ\n৬. নাসাপথের ভিতরের কোন অঙ্গটি সুগন্ধ বা দুর্গন্ধে উদ্দীপিত হয়?\n(ক) ঘ্রাণ স্নায়ু (খ) স্বররজ্জু\n(গ) আলজিভ (ঘ) লেন্টিসেল\nউত্তর: ক\n৭. নাসাপথের সামনের অংশে কী থাকে যা ধূলিকণা ও জীবাণু আটকে দেয়?\n(ক) উপজিহ্বা (খ) আলভিওলাস\n(গ) লোম (ঘ) প্লুরা\nউত্তর: গ\n৮. মুখ হাঁ করলে মুখগহ্বরের পিছনে যে অংশটি দেখা যায় তাকে কী বলে?\n(ক) স্বরযন্ত্র (খ) গলবিল\n(গ) ট্রাকিয়া (ঘ) ব্রঙ্কাস\nউত্তর: খ\n৯. গলবিলের পিছনের অংশের উপরিভাগে অবস্থিত ছোট জিভের মতো অংশটিকে কী বলা হয়?\n(ক) আলজিভ ($Soft\\ palate$) (খ) উপজিহ্বা ($Epiglottis$)\n(গ) স্বররজ্জু ($Vocal\\ cord$) (ঘ) আলভিওলাস\nউত্তর: ক\n১০. কোনটি কেবল মানুষেরই সবচেয়ে বেশি বিকশিত?\n(ক) উপজিহ্বা (খ) মধ্যচ্ছদা\n(গ) শ্বাসনালি (ঘ) আলজিভ\nউত্তর: ঘ\n১১. গলবিলের নিচে এবং শ্বাসনালির উপরে কোনটি অবস্থিত?\n(ক) ব্রঙ্কাস (খ) মধ্যচ্ছদা\n(গ) স্বরযন্ত্র (ঘ) আলভিওলাস\nউত্তর: গ\n১২. স্বরযন্ত্রের দুই পাশে অবস্থিত দুটি পেশিকে কী বলে?\n(ক) আলজিভ (খ) স্বররজ্জু \n(গ) উপজিহ্বা (ঘ) ব্রঙ্কিওল\nউত্তর: খ\n১৩. স্বরযন্ত্রের উপরে অবস্থিত জিহ্বা আকৃতির ঢাকনাটিকে কী বলা হয়?\n(ক) লেন্টিসেল  (খ) আলজিভ\n(গ) ভোকাল কর্ড (ঘ) উপজিহ্বা\nউত্তর: ঘ\n১৪. উপজিহ্বা সম্পর্কে কোন উক্তিটি সত্য?\n(ক) এটি শব্দ সৃষ্টি করে \n(খ) শ্বাস-প্রশ্বাসে এর কোনো ভূমিকা নেই\n(গ) এটি রক্ত পরিষ্কার করে \n(ঘ) এটি অক্সিজেন পরিবহন করে\nউত্তর: খ\n১৫. খাবার গ্রহণের সময় স্বরযন্ত্রের মুখ ঢেকে দেয় কোনটি?\n(ক) স্বররজ্জু (খ) উপজিহ্বা\n(গ) আলজিভ (ঘ) ট্রাকিয়া\nউত্তর: খ\n১৬. শ্বাসনালি বা ট্রাকিয়া কীভাবে গঠিত?\n(ক) সম্পূর্ণ বলায়াকার অস্থি \n(খ) কাইটিনযুক্ত আবরণ\n(গ) অসম্পূর্ণ বলায়াকার তরুণাস্থি ও পেশি\n(ঘ) কেবল ফ্যাট বা চর্বি\nউত্তর: গ\n১৭. শ্বাসনালির অন্তঃপ্রাচীরের সূক্ষ্ম লোমগুলোর কাজ কী?\n(ক) শব্দ তৈরি করা \n(খ) অপ্রয়োজনীয় কণা শ্লেষ্মার সাথে বাইরে বের করা\n(গ) গ্যাস বিনিময় করা (ঘ) খাদ্য পরিপাক করা\nউত্তর: খ\n১৮. শ্বাসনালি নিম্নংশে দুভাগে বিভক্ত হয়ে যে শাখা গঠন করে তাদের কী বলে?\n(ক) আলভিওলাস (খ) ট্রাকিওল\n(গ) ব্রঙ্কিওল (ঘ) ব্রঙ্কাই (একবচনে ব্রঙ্কাস)\nউত্তর: ঘ\n১৯. ব্রঙ্কাস ফুসফুসে প্রবেশ করার পর যে অসংখ্য শাখা-প্রশাখায় বিভক্ত হয় তাদের কী বলে?\n(ক) অনুব্রঙ্কাস  (খ) আলভিওলাস\n(গ) ট্রাকিয়া (ঘ) ভোকাল কর্ড\nউত্তর: ক\n২০. অনুব্রঙ্কাসের গঠনশৈলী কিসের অনুরূপ?\n(ক) হৃদপিণ্ডের (খ) শ্বাসনালির\n(গ) খাদ্যনালির (ঘ) যকৃতের\nউত্তর: খ\n২১. মানব শ্বসনতন্ত্রের প্রধান অঙ্গ কোনটি?\n(ক) হৃদপিণ্ড (খ) মধ্যচ্ছদা\n(গ) ট্রাকিয়া (ঘ) ফুসফুস\nউত্তর: ঘ\n২২. ফুসফুসের রঙ কেমন?\n(ক) হালকা লালচে (খ) গাঢ় কালো\n(গ) হলদেটে (ঘ) নীলচে\nউত্তর: ক\n২৩. মানুষের ডান ফুসফুস ও বাম ফুসফুস যথাক্রমে কত খণ্ডে বিভক্ত?\n(ক) ডান $৩$ খণ্ড, বাম $২$ খণ্ড \n(খ) ডান $২$ খণ্ড, বাম $৩$ খণ্ড\n(গ) ডান $৪$ খণ্ড, বাম $২$ খণ্ড (ঘ) উভয়ই $৩$ খণ্ড\nউত্তর: ক\n২৪. ফুসফুস কোন দ্বিস্তরী পর্দা দিয়ে আবৃত থাকে?\n(ক) পেরিকার্ডিয়াম (খ) প্লুরা ($Pleura$)\n(গ) পেরিটোনিয়াম (ঘ) মেনিনজেস\nউত্তর: খ\n২৫. ফুসফুসের দুই ভাঁজযুক্ত প্লুরার মাঝখানের রসের কাজ কী?\n(ক) রক্ত তৈরি করা \n(খ) শ্বসনের সময় বক্ষপ্রাচীরের সাথে ঘর্ষণ রোধ করা\n(গ) গ্যাস শোষণ করা (ঘ) জীবাণু ধ্বংস করা\nউত্তর: খ\n২৬. ফুসফুসের সূক্ষ্ম বায়ুকোঠরি বা বায়ুকোষগুলোকে কী বলে?\n(ক) নেফ্রন (খ) ট্রাকিওল\n(গ) নিউরন (ঘ) আলভিওলাস\nউত্তর: ঘ\n২৭. বাতাস প্রবেশ করলে আলভিওলাসগুলো কীভাবে সাড়া দেয়?\n(ক) শক্ত হয়ে যায় \n(খ) বন্ধ হয়ে যায়\n(গ) সংকুচিত হয়ে ভেঙে পড়ে \n(ঘ) বেলুনের মতো ফুলে ওঠে\nউত্তর: ঘ\n২৮. আলভিওলাসগুলো কোন রক্তনালি দিয়ে পরিবেষ্টিত থাকে?\n(ক) ধমনি (খ) মহাধমনি\n(গ) লসিকানালি (ঘ) কৈশিকনালিকা\nউত্তর: ঘ\n২৯. মানবদেহে মূলত কোথায় গ্যাসীয় আদান-প্রদান ঘটে?\n(ক) আলভিওলাস ও কৈশিক নালিকার পাতলা প্রাচীরে \n(খ) ট্রাকিয়ায়\n(গ) গলবিলে (ঘ) ব্রঙ্কাসে\nউত্তর: ক\n৩০. বক্ষগহ্বর ও উদরগহ্বর পৃথককারী পেশিবহুল পর্দাকে কী বলে?\n(ক) পেরিকার্ডিয়াম (খ) মধ্যচ্ছদা ($Diaphragm$)\n(গ) প্লুরা (ঘ) ট্রাকিয়া\nউত্তর: খ\n৩১. মধ্যচ্ছদা দেখতে কিসের মতো?\n(ক) প্রসারিত ছাতার মতো (খ) ত্রিভুজাকার\n(গ) নলাকার (ঘ) গোল গোলকের মতো\nউত্তর: ক\n৩২. মধ্যচ্ছদা সংকুচিত হলে কোন ঘটনাটি ঘটে?\n(ক) এটি উপরের দিকে ওঠে \n(খ) এটি নিচের দিকে নামে এবং বক্ষগহ্বরের আয়তন বৃদ্ধি পায়\n(গ) বক্ষগহ্বরের আয়তন কমে \n(ঘ) প্রশ্বাস নেওয়া বন্ধ হয়\nউত্তর: খ\n৩৩. মধ্যচ্ছদা প্রধানত কোন প্রক্রিয়ায় গুরুত্বপূর্ণ ভূমিকা পালন করে?\n(ক) খাদ্য পরিপাকে (খ) রক্ত পরিশ্রুতকরণে\n(গ) প্রশ্বাস গ্রহণে (ঘ) হরমোন ক্ষরণে\nউত্তর: গ"},{"id":"block_17880763958079ozzm","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩৪. শ্বসন প্রক্রিয়ার গুরুত্ব ও বৈশিষ্ট্য—\ni. এটি কোষে খাদ্যবস্তুকে অক্সিজেনের সাহায্যে জারিত করে শক্তি উৎপন্ন করে\nii. এতে উৎপাদিত তাপ মানবদেহকে উষ্ণ রাখে\niii. ৪-৫ মিনিটের বেশি দেহে অক্সিজেনের সরবরাহ বন্ধ থাকলে মানুষের মৃত্যু নিশ্চিত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৫. নাসাপথ ($Nasal\\ cavity\\ and\\ Nasal\\ passage$) সংক্রান্ত তথ্য—\ni. এটি সামনের দিকে নাসারন্ধ্র এবং পিছনে গলবিল পর্যন্ত বিস্তৃত\nii. এর সামনের অংশে লোম এবং পিছনের অংশে শ্লেষ্মা প্রস্তুতকারী পর্দা থাকে\niii. এটি প্রশ্বাসের সময় বাতাসকে গরম, ভেজা ও নির্মল করে ফুসফুসে প্রবেশের উপযোগী করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৬. গলবিল ($Pharynx$) ও আলজিভ ($Soft\\ palate$) সংক্রান্ত সত্য উক্তি—\ni. নাসাপথের পিছনের অংশ থেকে স্বরযন্ত্রের উপরিভাগ পর্যন্ত গলবিল বিস্তৃত\nii. এটি কেবল অন্যান্য স্তন্যপায়ী প্রাণীর দেহে সবচেয়ে বেশি বিকশিত\niii. খাবার গ্রহণের সময় আলজিভ নাসাপথের পশ্চাদ্ভাগ বন্ধ করে দেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n৩৭. স্বরযন্ত্র ($Larynx$) ও উপজিহ্বা ($Epiglottis$) সম্পর্কিত তথ্য—\ni. স্বরযন্ত্রের দুই পাশে অবস্থিত দুটি পেশিকে ভোকাল কর্ড বলে\nii. স্বরযন্ত্রের উপরে অবস্থিত জিহ্বা আকৃতির ঢাকনাটি হলো উপজিহ্বা\niii. উপজিহ্বা খাদ্য গ্রহণের সময় স্বরযন্ত্রের মুখ ঢেকে রাখে যাতে খাদ্য শ্বাসনালিতে না ঢোকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৮. শ্বাসনালি বা ট্রাকিয়া ($Trachea$) সংক্রান্ত তথ্য—\ni. এটি স্বরযন্ত্রের নিচের অংশ থেকে শুরু করে দুটি ফুসফুসীয় শাখায় বিভক্ত হয়\nii. এর প্রাচীরগুলো অসম্পূর্ণ বলায়াকার তরুণাস্থি ও পেশি দিয়ে গঠিত\niii. এর অন্তঃপ্রাচীরের লোমগুলো ধূলিকণা ও অপ্রয়োজনীয় উপাদান শ্লেষ্মার সাথে বাইরে পাঠায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৯. ব্রঙ্কাস ($Bronchus$) ও অনুব্রঙ্কাস ($Bronchiole$) সম্পর্কিত তথ্য—\ni. শ্বাসনালি নিম্নংশে বিভক্ত হয়ে দুটি ব্রঙ্কাই বা ব্রঙ্কাস গঠন করে\nii. ব্রঙ্কাস ফুসফুসে প্রবেশ করে ডান ও বাম শাখায় বিভক্ত হয়\niii. ব্রঙ্কাসের সূক্ষ্ম শাখা-প্রশাখাগুলোকে অনুব্রঙ্কাস বলে, যার গঠনশৈলী শ্বাসনালির অনুরূপ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪০. ফুসফুস ($Lung$) সংক্রান্ত সঠিক তথ্য—\ni. এটি বক্ষগহ্বরের ভিতরে হৃদপিণ্ডের দুই পাশে অবস্থিত দুটি কোমল অঙ্গ\nii. ডান ফুসফুস ২ খণ্ডে এবং বাম ফুসফুস ৩ খণ্ডে বিভক্ত\niii. ফুসফুস দ্বিত্তরী 'প্লুরা' নামক পর্দা দিয়ে আবৃত থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n৪১. আলভিওলাস ($Alveolus$) ও গ্যাসীয় বিনিময় সংক্রান্ত তথ্য—\ni. আলভিওলাস হলো সূক্ষ্ম সূক্ষ্ম বায়ুকোঠরি যা দেখতে থোকা ধরা আঙুরের মতো\nii. এতে বাতাস প্রবেশ করলে এটি বেলুনের মতো ফুলে ওঠে এবং পরে সংকুচিত হয়\niii. আলভিওলাস ও কৈশিক নালিকার পাতলা প্রাচীরের ভিতর দিয়ে রক্ত ও বায়ুর মধ্যে গ্যাসীয় আদান-প্রদান ঘটে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪২. মধ্যচ্ছদা ($Diaphragm$) সংক্রান্ত তথ্য—\ni. এটি বক্ষগহ্বর ও উদরগহ্বর পৃথককারী অস্থি\nii. এটি দেখতে অনেকটা প্রসারিত ছাতার মতো\niii. এটি সংকুচিত হয়ে নিচে নামলে বক্ষগহ্বরের আয়তন বৃদ্ধি পায় এবং প্রশ্বাস গ্রহণে সাহায্য করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: গ"},{"id":"block_1788076607393i46hl","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে ( ৪৩ ও ৪৪) নং প্রশ্নের উত্তর দাও:   </b> \nমানবদেহে কোষীয় স্তরে খাদ্যবস্তু জারিত হয়ে প্রয়োজনীয় শক্তি ও তাপ উৎপন্ন হয়। এই জৈব রাসায়নিক প্রক্রিয়ায় বায়ুমণ্ডল থেকে গৃহীত বিশেষ একটি গ্যাসের প্রয়োজন হয় এবং ক্ষতিকর একটি গ্যাস উৎপন্ন হয়ে দেহ থেকে নিষ্ক্রান্ত হয়।\n৪৩. উদ্দীপকে খাদ্যবস্তুকে জারিত করে শক্তি উৎপন্ন করার সমীকরণে ব্যবহৃত উপাদান কোনটি?\n(ক) $C_6H_{12}O_6 + 6O_2 \\longrightarrow 6CO_2 + 6H_2O + \\text{শক্তি}$ \n(খ) $6CO_2 + 6H_2O \\longrightarrow C_6H_{12}O_6 + 6O_2$\n(গ) $C_6H_{12}O_6 + O_2 \\longrightarrow CO_2 + H_2O$ \n(ঘ) $C_6H_{12}O_6 + 6CO_2 \\longrightarrow 6O_2 + \\text{শক্তি}$\nউত্তর: ক\n৪৪. মানবদেহে উদ্দীপকে বর্ণিত বায়ুমণ্ডল থেকে গৃহীত গ্যাসীয় উপাদানের সরবরাহ কত মিনিটের বেশি বন্ধ থাকলে মৃত্যু অনিবার্য?\n(ক) $১\\text{--}২\\text{ মিনিট}$ (খ) $৩\\text{--}৪\\text{ মিনিট}$\n(গ) $৫\\text{--}৬\\text{ মিনিট}$ (ঘ) $৭\\text{--}৮\\text{ মিনিট}$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৫ ও ৪৬) নং প্রশ্নের উত্তর দাও:   </b>  \nনিশ্বাস-প্রশ্বাসের সময় বাতাস নাসারন্ধ্র দিয়ে প্রবেশ করে নাসাপথে পৌঁছায়। নাসাপথের সামনের অংশের বিশেষ গঠন ধূলিকণা আটকে দেয় এবং পেছনের অংশ আর্দ্র শ্লেষ্মা নিঃসরণ করে বাতাসকে ফুসফুসে গমনের উপযোগী করে তোলে।\n৪৫. উদ্দীপকে নাসাপথের সামনের অংশের কোন গঠনটি শ্বাস-প্রশ্বাসের বাতাসে থাকা ধূলিকণা ও জীবাণু আটকে দেয়?\n(ক) ব্রঙ্কাস (খ) আলভিওলাস\n(গ) উপজিহ্বা (ঘ) লোম\nউত্তর: ঘ\n৪৬. উদ্দীপকে উল্লিখিত নাসাপথের ভিতরের কোন বিশেষ অংশটি আমাদের সুগন্ধ বা দুর্গন্ধে উদ্দীপিত হতে সাহায্য করে?\n(ক) স্বররজ্জু (খ) ঘ্রাণ স্নায়ু\n(গ) আলজিভ (ঘ) লেন্টিসেল\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৭ ও ৪৮) নং প্রশ্নের উত্তর দাও:   </b>  \nআরিফ খাবার খাওয়ার সময় কথা বলতে গিয়ে হঠাৎ কেশে উঠল। তার শিক্ষক তাকে বুঝিয়ে বললেন যে, গলবিলের নিচে অবস্থিত স্বরযন্ত্রের উপরে একটি বিশেষ ঢাকনা রয়েছে যা খাবার গ্রহণের সময় স্বরযন্ত্রের মুখ ঢেকে রাখে, কিন্তু কথা বলার সময় তা খোলা থাকায় খাদ্যকণা ভুল পথে প্রবেশ করতে চায়।\n৪৭. উদ্দীপকে খাবার খাওয়ার সময় স্বরযন্ত্রের মুখ ঢেকে রাখা বিশেষ জিহ্বা আকৃতির ঢাকনাটির নাম কী?\n(ক) আলজিভ ($Soft\\ palate$) (খ) উপজিহ্বা ($Epiglottis$)\n(গ) স্বররজ্জু ($Vocal\\ cord$) (ঘ) ব্রঙ্কিওল\nউত্তর: খ\n৪৮. উদ্দীপকে বর্ণিত স্বরযন্ত্রের দুই পাশে অবস্থিত পেশি জোড়াকে কী বলা হয় যা শব্দ সৃষ্টিতে ভূমিকা রাখে?\n(ক) লেন্টিসেল  (খ) ট্রাকিওল\n(গ) ভোকাল কর্ড (ঘ) ট্রেইনি\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৪৯ ও ৫০) নং প্রশ্নের উত্তর দাও:   </b>  \nশ্বাসনালি বা ট্রাকিয়া নলাকার গঠন নিয়ে স্বরযন্ত্রের নিচ থেকে শুরু হয়ে ফুসফুসের কাছাকাছি গিয়ে দুটি শাখায় বিভক্ত হয়ে ডান ও বাম ফুসফুসে প্রবেশ করে। ফুসফুসে প্রবেশের পর এ শাখাগুলো আরও অনেক শাখা-প্রশাখায় বিস্তৃত হয়।\n৪৯. উদ্দীপকে শ্বাসনালি বিভক্ত হয়ে গঠিত যে শাখা দুটি ফুসফুসে প্রবেশ করে তাদের কী বলা হয়?\n(ক) আলভিওলাস (খ) ব্রঙ্কাস\n(গ) ট্রাকিওল (ঘ) উপজিহ্বা\nউত্তর: খ\n৫০. উদ্দীপকের ব্রঙ্কাস ফুসফুসে প্রবেশ করার পর যে অজস্র সূক্ষ্ম শাখা-প্রশাখায় বিভক্ত হয় সেগুলোকে কী বলে?\n(ক) আলভিওলাস (খ) প্লুরা\n(গ) ট্রাকিওল (ঘ) অনুব্রঙ্কাস\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৫১ ও ৫২) নং প্রশ্নের উত্তর দাও:   </b>  \nফুসফুস বক্ষগহ্বরের ভিতরে হৃদপিণ্ডের দুই পাশে অবস্থিত দুটি প্রধান শ্বসন অঙ্গ। এটি একটি বিশেষ দ্বিত্বরী পাতলা পর্দা দিয়ে আবৃত থাকে। এর ভেতরে অসংখ্য ক্ষুদ্র ক্ষুদ্র বায়ুকোঠরি রয়েছে যা দেখতে থোকা ধরা আঙুরের মতো।\n৫১. উদ্দীপকে ফুসফুসকে আবৃত করে রাখা দ্বিস্তরী পর্দাটির নাম কী?\n(ক) পেরিকার্ডিয়াম (খ) প্লুরা \n(গ) পেরিটোনিয়াম (ঘ) মেনিনজেস\nউত্তর: খ\n৫২. উদ্দীপকে ফুসফুসের অভ্যন্তরে অবস্থিত অঙ্গানুটিতে প্রবেশকৃত বাতাস ও রক্তের মধ্যে গ্যাসীয় বিনিময় ঘটে, তার নাম কী?\n(ক) নেফ্রন (খ) আলভিওলাস \n(গ) নিউরন (ঘ) ট্রাকিওল\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫৩ ও ৫৪) নং প্রশ্নের উত্তর দাও:   </b>  \nপরীক্ষাগারে ব্যবচ্ছেদ করে দেখা গেল, বক্ষগহ্বর ও উদরগহ্বরের মাঝে একটি ছাতার মতো বাঁকা পেশিবহুল পর্দা অবস্থান করছে। প্রশ্বাস গ্রহণের সময় পর্দাটি সংকুচিত হয়ে নিচে নেমে যায় এবং নিশ্বাস ত্যাগের সময় তা পুনরায় প্রসারিত হয়ে স্বাভাবিক জায়গায় ফিরে আসে।\n৫৩. উদ্দীপকে বর্ণিত পেশিবহুল পর্দাটির নাম কী?\n(ক) মধ্যচ্ছদা ($Diaphragm$) (খ) প্লুরা\n(গ) ট্র্যাকিয়া (ঘ) আলভিওলাস\nউত্তর: ক\n৫৪. উদ্দীপকে বর্ণিত পর্দাটি সংকুচিত হয়ে নিচে নেমে গেলে বক্ষগহ্বরের আয়তনের কী পরিবর্তন ঘটে?\n(ক) বক্ষগহ্বরের আয়তন কমে যায় \n(খ) বক্ষগহ্বরের আয়তন বৃদ্ধি পায়\n(গ) আয়তন অপরিবর্তিত থাকে \n(ঘ) বায়ুচাপ শূন্য হয়ে যায়\nউত্তর: খ"}]},{"id":"topic_1788076291768j4n1n","title":"পাঠ-( 7.2.2)","blocks":[{"id":"block_1788076832966k75u6","type":"text","value":"<span style=\"color:green;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. শ্বাস-প্রশ্বাসের অঙ্গগুলো কেবল কোন দিকে খোলা থাকে?\n(ক) নাসাপথের দিকে (খ) গলবিলের দিকে\n(গ) শ্বাসনালির দিকে (ঘ) স্বরযন্ত্রের দিকে\nউত্তর: খ\n২. মানবদেহে কিসের সাহায্যে শ্বাসকার্য পরিচালিত হয়?\n(ক) হরমোনজনিত উদ্দীপনা \n(খ)  পেশির টান\n(গ) রক্তচাপ (ঘ) স্নায়বিক উদ্দীপনা\nউত্তর: ঘ\n৩. স্নায়বিক উদ্দীপনার কারণে প্রশ্বাস গ্রহণের সময় কোন অঙ্গগুলো সংকুচিত হয়?\n(ক) কেবল হৃদপেশি \n(খ) কেবল ফুসফুস\n(গ) পিঞ্জরাস্থির মাংসপেশি ও মধ্যচ্ছদা\n(ঘ) শ্বাসনালি ও আলভিওলাস\nউত্তর: গ\n৪. মধ্যচ্ছদা সংকুচিত হয়ে নিচের দিকে নেমে গেলে বক্ষগহ্বরের কোন পরিবর্তনটি ঘটে?\n(ক) প্রসারিত হয় (খ) সংকুচিত হয়\n(গ) চাপ বৃদ্ধি পায় (ঘ) আয়তন হ্রাস পায়\nউত্তর: ক\n৫. বক্ষগহ্বরের আয়তন বেড়ে গেলে ফুসফুসের ভিতরের বায়ুর চাপের কী ঘটে?\n(ক) চাপ বৃদ্ধি পায় \n(খ) বায়ুর চাপ শূন্য হয়\n(গ) বাইরের চাপের সমান থাকে \n(ঘ) বাইরের বায়ুর চাপের চেয়ে কমে যায়\nউত্তর: ঘ\n৬. সংকুচিত পেশিগুলো প্রসারিত হয়ে মধ্যচ্ছদা উপরের দিকে উঠলে কোন ঘটনাটি ঘটে?\n(ক) প্রশ্বাস বায়ু ভিতরে প্রবেশ করে \n(খ) বক্ষগহ্বরের আয়তন বৃদ্ধি পায়\n(গ) ফুসফুসের ভিতরের বায়ুর চাপ বেড়ে যায় \n(ঘ) রক্তচাপ হ্রাস পায়\nউত্তর: গ\n৭. নিশ্বাস বায়ুর মাধ্যমে ফুসফুস থেকে কোনটি বাইরে বের হয়ে যায়?\n(ক) অক্সিজেন ও নাইট্রোজেন \n(খ) কার্বন ডাই-অক্সাইড ও জলীয় বাষ্প\n(গ) কেবল কার্বন ডাই-অক্সাইড \n(ঘ) কার্বন মনোক্সাইড ও পানি\nউত্তর: খ\n৮. শ্বাসক্রিয়া মূলত কোন ধরনের শ্বসনের অন্তর্গত?\n(ক) অন্তঃশ্বসন (খ) অবাত শ্বসন\n(গ) বহিস্মসন (ঘ) টিস্যু শ্বসন\nউত্তর: গ\n৯. গ্যাসীয় বিনিময় বলতে মূলত কোন দুটি গ্যাসের বিনিময়কে বোঝায়?\n(ক) $O_2$ ও $N_2$ (খ) $O_2$ ও $CO_2$\n(গ) $CO_2$ ও $CO$ (ঘ) $H_2$ ও $O_2$\nউত্তর: খ\n১০. সব ধরনের গ্যাসীয় বিনিময়ের মূলে কোন ভৌত প্রক্রিয়াটি বিদ্যমান?\n(ক) অভিস্রবণ (খ) পরিস্রাবণ\n(গ) ইম্বাইবিশন (ঘ) ব্যাপন\nউত্তর: ঘ\n১১. ফুসফুসের বায়ুখলি বা আলভিওলি থেকে রক্তে অক্সিজেন প্রবেশ করে কোন প্রক্রিয়ায়?\n(ক) ব্যাপন প্রক্রিয়া (খ) সক্রিয় শোষণ\n(গ) অভিস্রবণ (ঘ) পরিপাক\nউত্তর: গ\n১২. রক্তে অক্সিজেন কতভাবে পরিবাহিত হয়?\n(ক) $১$ ভাবে (খ) $২$ ভাবে\n(গ) $৩$ ভাবে (ঘ) $৪$ ভাবে\nউত্তর: খ\n১৩. অক্সিজেনের বেশিরভাগ অংশ লোহিত রক্তকণিকার কিসের সাথে যুক্ত হয়?\n(ক) হিমোগ্লোবিনের লৌহ অংশ (খ) প্লাজমা প্রোটিন\n(গ) সোডিয়াম আয়ন (ঘ) গ্লুকোজ\nউত্তর: ক\n১৪. হিমোগ্লোবিন ও অক্সিজেনের রাসায়নিক বিক্রিয়ায় গঠিত অস্থায়ী যৌগটির নাম কী?\n(ক) কার্বামিনো হিমোগ্লোবিন \n(খ) পটাশিয়াম বাইকার্বোনেট\n(গ) সোডিয়াম বাইকার্বোনেট (ঘ) অক্সিহিমোগ্লোবিন \nউত্তর: ঘ\n১৫. রক্ত কৈশিকনালিতে পৌঁছানোর পর মুক্ত অক্সিজেন কোথায় প্রবেশ করে?\n(ক) প্রথমে লোহিত রক্তকণিকার আবরণ ও পরে লসিকাতে \n(খ) সরাসরি কোষে\n(গ) শ্বাসনালিতে (ঘ) প্লাজমায়\nউত্তর: ক\n১৬. খাদ্য জারণ প্রক্রিয়ায় কোষে কোন গ্যাসটি তৈরি হয়?\n(ক) $O_2$ (খ) $CO_2$\n(গ) $N_2$ (ঘ) $CH_4$\nউত্তর: খ\n১৭. কোষে উৎপন্ন কার্বন ডাই-অক্সাইড প্রথমে কোষ আবরণ ভেদ করে কোথায় প্রবেশ করে?\n(ক) লোহিত রক্তকণিকায় \n(খ) সরাসরি আলভিওলাসে\n(গ) আন্তঃকোষীয় তরল ও লসিকাতে (ঘ) ব্রঙ্কাসে\nউত্তর: গ\n১৮. কার্বন ডাই-অক্সাইড প্রধানত রক্তের প্লাজমায় কী রূপে পরিবাহিত হয়?\n(ক) সোডিয়াম বাইকার্বোনেট \n(খ) পটাশিয়াম বাইকার্বোনেট \n(গ) অক্সিহিমোগ্লোবিন (ঘ) কার্বনিক এসিড\nউত্তর: ক\n১৯. লোহিত রক্তকণিকা দিয়ে কার্বন ডাই-অক্সাইড কী রূপে পরিবাহিত হয়?\n(ক) সোডিয়াম বাইকার্বোনেট \n(খ) কার্বামিনো হিমোগ্লোবিন\n(গ) পটাশিয়াম বাইকার্বোনেট\n(ঘ) সোডিয়াম কার্বোনেট\nউত্তর: গ\n২০. $\\text{NaHCO}_3$ ও $\\text{KHCO}_3$ সংকেত দুটি যথাক্রমে কোন যৌগগুলোর?\n(ক) সোডিয়াম কার্বোনেট ও পটাশিয়াম কার্বোনেট \n(খ) সোডিয়াম বাইকার্বোনেট ও পটাশিয়াম বাইকার্বোনেট\n(গ) সোডিয়াম ক্লোরাইড ও পটাশিয়াম ক্লোরাইড \n(ঘ) ক্যালসিয়াম কার্বোনেট ও সোডিয়াম বাইকার্বোনেট\nউত্তর: খ"},{"id":"block_1788076870647glq90","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\r\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\r\n২১. প্রশ্বাস গ্রহণের সময় ঘটে যাওয়া ঘটনাবলি—\r\ni. স্নায়বিক উত্তেজনায় পিঞ্জরাস্থির মাংসপেশি ও মধ্যচ্ছদা সংকুচিত হয়\r\nii. মধ্যচ্ছদা নিচের দিকে নেমে যায় এবং বক্ষগহ্বর প্রসারিত হয়\r\niii. ফুসফুসের ভিতরের বায়ুর চাপ বাইরের বায়ুর চাপের চেয়ে কমে যায়\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: ঘ\r\n২২. নিশ্বাস ত্যাগের সময় ঘটে যাওয়া ঘটনাবলি—\r\ni. সংকুচিত পেশিগুলো প্রসারিত হয়ে মধ্যচ্ছদা উপরের দিকে উঠে যায়\r\nii. বক্ষগহ্বরের আয়তন কমে যায় এবং ফুসফুসের ভিতরের বায়ুর চাপ বেড়ে যায়\r\niii. ফুসফুস থেকে $CO_2$ ও জলীয় বাষ্প বাইরে বের হয়ে যায়\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: ঘ\r\n২৩. শ্বাসক্রিয়া বা বহিশ্বসন সংক্রান্ত তথ্য—\r\ni. শ্বাস-প্রশ্বাসের অঙ্গগুলো কেবল গলবিলের দিকে খোলা থাকে\r\nii. শ্বাসকার্য মূলত স্নায়বিক উত্তেজনার মাধ্যমে পরিচালিত হয়\r\niii. মধ্যচ্ছদা ও পিঞ্জরাস্থির পেশির ধারাবাহিক সংকোচন ও প্রসারণে এটি ঘটে\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: ঘ\r\n২৪. গ্যাসীয় বিনিময় সম্পর্কিত সত্য তথ্য—\r\ni. এটি মূলত বায়ু ও ফুসফুসের রক্তনালির ভিতরে ঘটে\r\nii. সব ধরনের গ্যাসীয় বিনিময়ের মূলে রয়েছে অভিস্রবণ প্রক্রিয়া\r\niii. এটি অক্সিজেন শোষণ ও কার্বন ডাই-অক্সাইড ত্যাগ—এই দুটি পর্যায়ে বিভক্ত\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: খ\r\n২৫. রক্তে অক্সিজেন পরিবহনের উপায়—\r\ni. সামান্য পরিমাণ অক্সিজেন রক্তরসে দ্রবীভূত হয়ে বাহিত হয়\r\nii. বেশিরভাগ অক্সিজেন হিমোগ্লোবিনের সাথে যুক্ত হয়ে অক্সিহিমোগ্লোবিন তৈরি করে\r\niii. সম্পূর্ণ অক্সিজেন পটাশিয়ামের সাথে যুক্ত হয়ে কোষ আবরণ ভেদ করে\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: ক\r\n২৬. অক্সিহিমোগ্লোবিন ($Oxyhemoglobin$) যৌগ সংক্রান্ত তথ্য—\r\ni. এটি একটি স্থায়ী যৌগ যা ভাঙা সম্ভব নয়\r\nii. এটি হিমোগ্লোবিনের লৌহ অংশের সাথে অক্সিজেনের হালকা বন্ধনে তৈরি হয়\r\niii. এটি থেকে অক্সিজেন খুব সহজেই বিচ্ছিন্ন হতে পারে\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: গ\r\n২৭. রক্ত কৈশিকনালি থেকে অক্সিজেন কোষে পৌঁছানোর ধারাবাহিক প্রক্রিয়া—\r\ni. প্রথমে লোহিত রক্তকণিকার আবরণ ভেদ করে\r\nii. তারপর কৈশিকনালির প্রাচীর ভেদ করে লসিকাতে প্রবেশ করে\r\niii. পরিশেষে লসিকা থেকে কোষ আবরণ ভেদ করে কোষে পৌঁছায়\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: ঘ\r\n২৮. কার্বন ডাই-অক্সাইড উৎপন্ন ও রক্তে প্রবেশের পথ—\r\ni. খাদ্য জারণ প্রক্রিয়ায় কোষে কার্বন ডাই-অক্সাইড তৈরি হয়\r\nii. কোষে উৎপন্ন $CO_2$ প্রথমে আন্তঃকোষীয় তরল ও লসিকাতে প্রবেশ করে\r\niii. লসিকা থেকে কৈশিকনালির প্রাচীর ভেদ করে রক্তরসে প্রবেশ করে\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: ঘ\r\n২৯. রক্তে কার্বন ডাই-অক্সাইড পরিবহনের রূপসমূহ—\r\ni. প্রধানত সোডিয়াম বাইকার্বোনেট ($\\text{NaHCO}_3$) রূপে রক্তরসের মাধ্যমে\r\nii. পটাশিয়াম বাইকার্বোনেট ($\\text{KHCO}_3$) রূপে লোহিত রক্তকণিকা দিয়ে\r\niii. সরাসরি অক্সিহিমোগ্লোবিন রূপে রক্তরসে দ্রবীভূত হয়ে\r\n(ক) i ও ii (খ) i ও iii\r\n(গ) ii ও iii (ঘ) i, ii ও iii\r\nউত্তর: ক"},{"id":"block_1788076977884t80q0","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও:   </b>  \nশফিক দ্রুত দৌড়ানোর পর গভীরভাবে শ্বাস গ্রহণ করছে। স্নায়বিক উত্তেজনার ফলে তার পিঞ্জরাস্থির মাংসপেশি ও মধ্যচ্ছদা পরপর সংকুচিত ও প্রসারিত হচ্ছে, যা এক বিশেষ শারীরবৃত্তীয় প্রক্রিয়ার অন্তর্গত।\n৩০. উদ্দীপকে প্রশ্বাস গ্রহণের সময় মধ্যচ্ছদা সংকুচিত হয়ে নিচের দিকে নেমে গেলে ফুসফুসের অভ্যন্তরের বায়ুর চাপের কী পরিবর্তন ঘটে?\n(ক) বায়ুর চাপ অত্যন্ত বৃদ্ধি পায় \n(খ) বায়ুর চাপ বাইরের বায়ুর চাপের চেয়ে কমে যায়\n(গ) বায়ুর চাপ শূন্য হয়ে যায় \n(ঘ) বায়ুর চাপ অপরিবর্তিত থাকে\nউত্তর: খ\n৩১. উদ্দীপকের সম্পূর্ণ শ্বাসক্রিয়া প্রক্রিয়াটি মূলত কোন ধরনের শ্বসনের অন্তর্গত?\n(ক) অন্তঃশ্বসন (খ) অবাত শ্বসন\n(গ) বহিস্মসন (ঘ) টিস্যু শ্বসন\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৩২ ও ৩৩) নং প্রশ্নের উত্তর দাও:   </b>  \nফুসফুসের বায়ুখলি ও রক্তনালির মধ্যে অনবরত গ্যাসের আদান-প্রদান ঘটতে থাকে। শিক্ষক ক্লাসে বললেন, সকল প্রকার গ্যাসীয় বিনিময়ের মূলে একটি বিশেষ ভৌত প্রক্রিয়া কাজ করে যা চাপের পার্থক্যের ওপর নির্ভরশীল।\n৩২. উদ্দীপকে বায়ুখলি ও রক্তনালির মধ্যে গ্যাসীয় বিনিময়ের মূলে কোন ভৌত প্রক্রিয়াটি কাজ করে?\n(ক) ব্যাপন (খ) অভিস্রবণ\n(গ) ইম্বাইবিশন (ঘ) পরিস্রাবণ\nউত্তর: ক\n৩৩. উদ্দীপকের প্রক্রিয়ায় প্রধানত কোন দুটি গ্যাসের আদান-প্রদান ঘটে?\n(ক) $O_2$ ও $N_2$ (খ) $O_2$ ও $CO_2$\n(গ) $CO_2$ ও $CO$ (ঘ) $H_2$ ও $O_2$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৪ ও ৩৫) নং প্রশ্নের উত্তর দাও:   </b>  \nলোহিত রক্তকণিকার রক্তরঞ্জক প্রোটিনের লৌহ অংশের সাথে অক্সিজেন যুক্ত হয়ে একটি অস্থায়ী যৌগ গঠন করে। পরবর্তীতে রক্ত কৈশিকনালিতে পৌঁছানোর পর এই অস্থায়ী যৌগটি ভেঙে মুক্ত অক্সিজেনে পরিণত হয়।\n৩৪. উদ্দীপকে অক্সিজেন ও লোহিত রক্তকণিকার উপাদান যুক্ত হয়ে গঠিত অস্থায়ী যৌগটির নাম কী?\n(ক) কার্বামিনো হিমোগ্লোবিন \n(খ) পটাশিয়াম বাইকার্বোনেট\n(গ) সোডিয়াম বাইকার্বোনেট \n(ঘ) অক্সিহিমোগ্লোবিন\nউত্তর: ঘ\n৩৫. উদ্দীপকে বর্ণিত অস্থায়ী যৌগ ভেঙে উৎপন্ন মুক্ত অক্সিজেন রক্ত কৈশিকনালি থেকে কোন ক্রমানুসারে কোষে পৌঁছায়?\n(ক) লোহিত রক্তকণিকার আবরণ $\\rightarrow$ লসিকা $\\rightarrow$ কৈশিকনালির প্রাচীর $\\rightarrow$ কোষ আবরণ \n(খ) লোহিত রক্তকণিকার আবরণ $\\rightarrow$ কৈশিকনালির প্রাচীর $\\rightarrow$ লসিকা $\\rightarrow$ কোষ আবরণ\n(গ) লসিকা $\\rightarrow$ লোহিত রক্তকণিকার আবরণ $\\rightarrow$ কৈশিকনালির প্রাচীর $\\rightarrow$ কোষ আবরণ \n(ঘ) কৈশিকনালির প্রাচীর $\\rightarrow$ লসিকা $\\rightarrow$ লোহিত রক্তকণিকার আবরণ $\\rightarrow$ কোষ আবরণ\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </b>  \nকোষে খাদ্য জারণের ফলে উৎপাদিত কার্বন ডাই-অক্সাইড ক্ষতিকর হওয়ায় রক্তরসে সোডিয়াম এবং লোহিত রক্তকণিকায় পটাশিয়ামের রাসায়নিক যৌগ হিসেবে পরিবাহিত হয়ে ফুসফুসে আসে।\n৩৬. উদ্দীপকের কার্বন ডাই-অক্সাইড রক্তরসের মাধ্যমে প্রধানত কোন যৌগ রূপে ফুসফুসে পরিবাহিত হয়?\n(ক) পটাশিয়াম বাইকার্বোনেট ($\\text{KHCO}_3$) \n(খ) সোডিয়াম কার্বোনেট ($\\text{Na}_2\\text{CO}_3$)\n(গ) সোডিয়াম বাইকার্বোনেট ($\\text{NaHCO}_3$)\n(ঘ) অক্সিহিমোগ্লোবিন\nউত্তর: গ\n৩৭. উদ্দীপকের ক্ষতিকর গ্যাসটি লোহিত রক্তকণিকা দিয়ে পরিবাহিত হওয়ার সময় কোন রাসায়নিক রূপ ধারণ করে?\n(ক) সোডিয়াম বাইকার্বোনেট ($\\text{NaHCO}_3$) \n(খ) পটাশিয়াম কার্বোনেট\n(গ) ক্যালসিয়াম কার্বোনেট ($\\text{CaCO}_3$) \n(ঘ) পটাশিয়াম বাইকার্বোনেট ($\\text{KHCO}_3$) ($\\text{K}_2\\text{CO}_3$)\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও:   </b>  \nশ্বসন প্রক্রিয়ার দ্বিতীয় ধাপে সংকুচিত পেশিগুলো প্রসারিত হয়ে মধ্যচ্ছদা পুনরায় উপরে উঠে যায়, যার ফলে ফুসফুসের ভেতরের বায়ুর চাপ বৃদ্ধি পায় এবং গ্যাসীয় বর্জ্য পদার্থ বাইরে বের হয়ে যায়।\n৩৮. উদ্দীপকের নিশ্বাস প্রক্রিয়ায় ফুসফুস থেকে কোনটি দেহের বাইরে নির্গত হয়?\n(ক) অক্সিজেন ও নাইট্রোজেন \n(খ) কার্বন ডাই-অক্সাইড ও জলীয় বাষ্প\n(গ) কেবল অক্সিজেন \n(ঘ) নাইট্রোজেন ও অ্যামোনিয়া\nউত্তর: খ\n৩৯. উদ্দীপকে বর্ণিত নিশ্বাস প্রক্রিয়াটি ঘটার প্রধান কারণ কোনটি?\n(ক) বক্ষগহ্বরের আয়তন বেড়ে যাওয়া \n(খ) মধ্যচ্ছদা প্রসারিত হয়ে উপরে ওঠা ও বক্ষগহ্বরের আয়তন কমে যাওয়া\n(গ) বায়ুখলিতে অক্সিজেন বৃদ্ধি পাওয়া \n(ঘ) রক্তে পটাশিয়ামের মাত্রা বৃদ্ধি পাওয়া\nউত্তর: খ"}]},{"id":"topic_1788076295850pgjhf","title":"পাঠ-( 7.3 (a))","blocks":[{"id":"block_17880770419301k476","type":"text","value":"<span style=\"color:green;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. ফুসফুস প্রধানত কিসের আক্রমণে বা প্রভাবে ক্ষতিগ্রস্ত হতে পারে?\n(ক) ভাইরাস, ব্যাকটেরিয়া ও বায়ুদূষণ \n(খ) খাদ্যের বিষাক্ততা\n(গ) অতিরিক্ত শারীরিক পরিশ্রম \n(ঘ) রক্তের উচ্চচাপ\nউত্তর: ক\n২. আজমা বা হাঁপানি ($Asthma$) সাধারণত কিসের ফলস্বরূপ ঘটে থাকে?\n(ক) ব্যাকটেরিয়া সংক্রমণ \n(খ) ভিটামিনের ঘাটতি\n(গ) রক্তাল্পতা \n(ঘ) রোগ প্রতিরোধ-ব্যবস্থার অতিরিক্ত প্রতিক্রিয়া\nউত্তর: ঘ\n৩. আজমা বা হাঁপানি রোগটি সম্পর্কিত কোন তথ্যটি সত্য?\n(ক) এটি একটি ছোঁয়াচে রোগ \n(খ) এটি জীবাণুবাহিত রোগ\n(গ) এটি ছোঁয়াচে বা জীবাণুবাহিত রোগ নয় \n(ঘ) এটি বংশগত নয়\nউত্তর: গ\n৪. আজমা আক্রান্ত শিশুর বা ব্যক্তির পরিবারে প্রায়ই কিসের ইতিহাস থাকে?\n(ক) ডায়াবেটিস (খ) হাঁপানি বা অ্যালার্জি\n(গ) বাতজ্বর (ঘ) জন্ডিস\nউত্তর: খ\n৫. খাদ্যজনিত অ্যালার্জির কারণে হাঁপানি হতে পারে এমন কিছু খাদ্য হলো—\n(ক) চিংড়ি, গরুর মাংস, ইলিশ মাছ \n(খ) শাকসবজি ও ফলমূল\n(গ) মুরগির মাংস ও ডিম (ঘ) মিষ্টি ও দুধ\nউত্তর: ক\n৬. বায়ুর সাথে কোন বস্তুগুলো ফুসফুসে প্রবেশ করলে হাঁপানি হতে পারে?\n(ক) অক্সিজেন ও নাইট্রোজেন \n(খ) ধোঁয়া, ধুলাবালি ও ফুলের রেণু\n(গ) জলীয় বাষ্প ও শিশির \n(ঘ) কার্বন ডাই-অক্সাইড\nউত্তর: খ\n৭. শিশুদের ক্ষেত্রে সাধারণত কিসের থেকে হাঁপানি হওয়ার আশঙ্কা থাকে?\n(ক) পেটের অসুখ (খ) চোখের ছানি\n(গ) ত্বকের র্যাশ (ঘ) সর্দি কাশি\nউত্তর: খ\n৮. বছরের কোন সময় হাঁপানি রোগটির তীব্রতা বেড়ে যেতে পারে?\n(ক) বছরের শেষ দিনে (খ) কেবল বর্ষাকালে\n(গ) কেবল গ্রীষ্মকালে \n(ঘ) বিশেষ ঋতুতে বা ঋতু পরিবর্তনের সময়\nউত্তর: ঘ\n৯. হাঁপানির লক্ষণ হিসেবে শ্বাসনালিতে কী ঘটার কারণে রোগীর প্রচণ্ড কষ্ট হয়?\n(ক) ফুসফুসের বায়ুখলিতে ঠিকমতো অক্সিজেন সরবরাহ হয় না \n(খ) হৃদপিণ্ড বন্ধ হয়ে যায়\n(গ) রক্তচাপ শূন্য হয়ে যায় \n(ঘ) খাবার হজম হয় না\nউত্তর: ক\n১০. আজমা রোগীর শ্বাস নেওয়ার সময় বুকের ভেতর কেমন শব্দ হয়?\n(ক) কটকট শব্দ (খ) ঘড়ঘড় শব্দ\n(গ) সাঁই সাঁই শব্দ (ঘ) থকথক শব্দ\nউত্তর: গ\n১১. আজমা রোগীর শ্বাসকষ্টের সময় দেহের বাহ্যিক কোন পরিবর্তনটি দৃশ্যমান হয়?\n(ক) ঠোঁট নীল হয় এবং পাজরের মাঝে চামড়া ভেতরে ঢোকে \n(খ) ত্বক লাল হয়ে যায়\n(গ) নখ হলুদ হয় (ঘ) চোখ লাল হয়ে ওঠে\nউত্তর: ক\n১২. আজমা রোগের ক্ষেত্রে কাশি ও জ্বরের স্বাভাবিক অবস্থা কোনটি?\n(ক) কফের সাথে রক্ত আসে ও তেজালো জ্বর থাকে \n(খ) কাশির সাথে সাদা কফ বের হতে পারে এবং সাধারণত জ্বর থাকে না\n(গ) তীব্র জ্বর থাকে ও কফ বের হয় না \n(ঘ) কেবল রাতে জ্বর আসে\nউত্তর: খ\n১৩. আজমা রোগের চিকিৎসায় কোনটি ঘটে?\n(ক) চিকিৎসা নিলে রোগটি সম্পূর্ণ নিরাময় হয় \n(খ) চিকিৎসায় রোগ সম্পূর্ণ নিরাময় হয় না, তবে ঔষধে কিছুটা আরাম বোধ হয়\n(গ) অ্যান্টিবায়োটিক খেলে দুই দিনে সেরে যায় \n(ঘ) অস্ত্রোপচারের মাধ্যমে ভালো হয়\nউত্তর: খ\n১৪. হাঁপানি রোগীর জন্য গৃহের পরিবেশ কেমন হওয়া উচিত?\n(ক) আবদ্ধ ও অন্ধকার (খ) ধোঁয়াচ্ছন্ন\n(গ) শীতাতপ নিয়ন্ত্রিত (ঘ) আলো-বাতাসপূর্ণ\nউত্তর: ঘ\n১৫. কোন জিনিসগুলোর স্পর্শ হাঁপানি বাড়াতে পারে?\n(ক) পশুর লোম ও কৃত্রিম আঁশ (খ) সুতি কাপড়\n(গ) প্লাস্টিকের পাত্র (ঘ) কাচের পাত্র\nউত্তর: ক\n১৬. আজমার চিকিৎসায় কোন ক্ষতিকারক উপাদানের উচ্চমাত্রা ব্যবহার তাৎক্ষণিক উপশম দিলেও দীর্ঘমেয়াদি ক্ষতি করে?\n(ক) অ্যান্টিবায়োটিক (খ) স্টেরয়েড\n(গ) পেনিসিলিন (ঘ) প্যারাসিটামল\nউত্তর: খ\n১৭. শ্বাসকষ্টের সময় আজমা রোগীকে কোন ধরনের খাদ্য দেওয়া উচিত?\n(ক) শক্ত খাবার (খ) তরল খাদ্য\n(গ) চর্বিযুক্ত খাবার (ঘ) মশলাযুক্ত খাবার\nউত্তর: খ\n১৮. হাঁপানি রোগীকে প্রতিরোধমূলক ব্যবস্থা হিসেবে সবসময় সাথে কী রাখার পরামর্শ দেওয়া হয়?\n(ক) ইনসুলিন (খ) অক্সিজেন সিলিন্ডার\n(গ) ঔষধ (ঘ) নেবুলাইজার\nউত্তর: গ\n১৯. তামাকজাত কোন সামগ্রী পরিহার করা আজমা রোগীর প্রতিকারের অন্তর্গত?\n(ক) ধূমপান, গুল, সাদা পাতা ও জর্দা \n(খ) কেবল চা-কফি\n(গ) সাধারণ পান \n(ঘ) মিষ্টি খাবার\nউত্তর: ক"},{"id":"block_1788077065910hdxjo","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২০. আজমা বা হাঁপানি ($Asthma$) রোগের কারণ ও প্রকৃতি—\ni. এটি রোগ প্রতিরোধ-ব্যবস্থার অতিরিক্ত প্রতিক্রিয়ার ফলে ঘটে\nii. এটি একটি ছোঁয়াচে ও জীবাণুবাহিত রোগ\niii. হাঁপানি আক্রান্ত ব্যক্তির বংশে হাঁপানি বা অ্যালার্জির ইতিহাস থাকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n২১. যেসব বস্তুর স্পর্শে বা প্রভাবে হাঁপানি বৃদ্ধি পেতে পারে—\ni. চিংড়ি, গরুর মাংস ও ইলিশ মাছ\nii. ধোঁয়া, ধুলাবালি ও ফুলের রেণু\niii. পশুর লোম ও কৃত্রিম আঁশ\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২২. আজমা বা হাঁপানি রোগের লক্ষণসমূহ—\ni. হঠাৎ শ্বাসকষ্ট বেড়ে যায় এবং ঠোঁট নীল হয়ে যায়\nii. রোগীর জোরে জোরে শ্বাস নেওয়ার চেষ্টায় বুকে সাঁই সাঁই আওয়াজ হয়\niii. সাধারণত তীব্র জ্বর থাকে এবং কফের সাথে রক্ত আসে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৩. আজমা রোগীর শ্বাসকষ্টজনিত শারীরিক অবস্থা—\ni. ফুসফুসের বায়ুখলিতে ঠিকমতো অক্সিজেন সরবরাহ হয় না\nii. শ্বাস নেওয়ার সময় রোগীর পাঁজরের মাঝে চামড়া ভিতরের দিকে ঢুকে যায়\niii. গলার শিরা ফুলে যায় এবং রোগী দুর্বল হয়ে পড়ে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৪. আজমা রোগের প্রতিকারে করণীয়—\ni. আলো-বাতাসপূর্ণ গৃহে বসবাস করা\nii. ধূমপান, গুল, সাদা পাতা, জর্দা ইত্যাদি পরিহার করা\niii. শ্বাসকষ্টের সময় রোগীকে তরল খাদ্য খাওয়ানো\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৫. আজমা রোগের চিকিৎসা ও প্রতিরোধ সম্পর্কিত তথ্য—\ni. চিকিৎসায় এ রোগ সম্পূর্ণ নিরাময় হয় না, তবে ঔষধে আরাম বোধ হয়\nii. হাঁপানি রোগীর শ্বাসকষ্ট লাঘবের জন্য সবসময় সাথে ঔষধ রাখা উচিত\niii. হাতুড়ে চিকিৎসকের উচ্চমাত্রার স্টেরয়েড প্রয়োগে দীর্ঘমেয়াদি ও অপূরণীয় ক্ষতি হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1788077094079ma4ih","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৬ ও ২৭) নং প্রশ্নের উত্তর দাও:   </b>  \nরাফিদ শীতকাল আসলেই হঠাৎ তীব্র শ্বাসকষ্টে ভোগে। শ্বাস নেওয়ার সময় তার বুক থেকে সাঁই সাঁই শব্দ বের হয় এবং পাঁজরের মাঝে চামড়া ভেতরের দিকে ঢুকে যায়। সে খেয়াল করল, ধুলাবালি বা চিংড়ি মাছ খেলে তার এই সমস্যা আরও বেড়ে যায়।\n২৬. উদ্দীপকে রাফিদের সমস্যাটির মূল কারণ কোনটি?\n(ক) জীবাণুর সংক্রমণ \n(খ) রোগ প্রতিরোধ-ব্যবস্থার অতিরিক্ত প্রতিক্রিয়া\n(গ) শ্বাসনালিতে ক্যানসার \n(ঘ) রক্তে হিমোগ্লোবিন কমে যাওয়া\nউত্তর: খ\n২৭. উদ্দীপকের রোগটির লক্ষণ কোনটি?\n(ক) তীব্র জ্বর থাকা \n(খ) গলার শিরা ফুলে যাওয়া ও ঠোঁট নীল হওয়া\n(গ) কফের সাথে ঘন রক্ত আসা \n(ঘ) শরীরে অ্যালার্জি না থাকা\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২৮ ও ২৯) নং প্রশ্নের উত্তর দাও:   </b>  \nসুমনের বাবা দীর্ঘদিন ধরে একটি শ্বাসযন্ত্রের রোগে ভুগছেন। একজন হাতুড়ে চিকিৎসক তাকে একটি উচ্চমাত্রার ওষুধ দিল, যা সেবনের পর তিনি তাৎক্ষণিক উপশম পেলেন। কিন্তু মূল চিকিৎসক তাকে সতর্ক করে বললেন যে, এই জাতীয় ওষুধ চিকিৎসকের পরামর্শ ছাড়া গ্রহণ করলে দীর্ঘমেয়াদি অপূরণীয় ক্ষতি হতে পারে।\n২৮. উদ্দীপকে হাতুড়ে চিকিৎসক সুমনের বাবাকে কোন ধরনের ক্ষতিকারক ওষুধ উচ্চমাত্রায় দিয়েছিলেন?\n(ক) অ্যান্টিবায়োটিক (খ) স্টেরয়েড\n(গ) পেনিসিলিন (ঘ) পেইনকিলার\nউত্তর: খ\n২৯. উদ্দীপকে বর্ণিত রোগটির প্রতিকারে কোনটি করা উচিত?\n(ক) আবদ্ধ ঘরে বসবাস করা \n(খ) পশুর লোমের সংস্পর্শে থাকা\n(গ) রোগীকে শক্ত ও শুকনা খাবার দেওয়া \n(ঘ) ধূমপান, জর্দা ও সাদা পাতা পরিহার করা\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৩০ ও ৩১) নং প্রশ্নের উত্তর দাও:   </b>  \nশ্রেণিকক্ষে শিক্ষক বললেন, ফুসফুসের এমন কিছু রোগ রয়েছে যা কোনো জীবাণুর মাধ্যমে ছড়ায় না বা একজন থেকে অন্যজনে সংক্রমিত হয় না। তবে পরিবারের কারও এই হিস্ট্রি থাকলে পরবর্তী বংশধরদের এতে আক্রান্ত হওয়ার ঝুঁকি থাকে।\n৩০. উদ্দীপকে শিক্ষক কোন রোগের ইঙ্গিত করেছেন?\n(ক) যক্ষ্মা (খ) আজমা বা হাঁপানি\n(গ) ব্রঙ্কাইটিস (ঘ) নিউমোনিয়া\nউত্তর: খ\n৩১. উদ্দীপকে উল্লেখিত রোগটি প্রতিরোধের জন্য কোনটি সবচেয়ে জরুরি?\n(ক) নিয়মিত অ্যান্টিবায়োটিক খাওয়া \n(খ) অ্যালার্জি ও শ্বাসকষ্ট তৈরি করে এমন পরিবেশ ও বস্তুর স্পর্শ পরিহার করা\n(গ) ঘরের আলো-বাতাস বন্ধ রাখা \n(ঘ) চিকিৎসায় পুরোপুরি নিরাময় করা\nউত্তর: খ"}]},{"id":"topic_1788076305045y8ba2","title":"পাঠ-( 7.3 (b,c))","blocks":[{"id":"block_1788077116925e2xw4","type":"text","value":"<span style=\"color:green;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. শ্বাসনালির ভিতরের আবৃত প্রদাহকে কী বলে?\n(ক) নিউমোনিয়া (খ) ব্রঙ্কাইটিস \n(গ) আজমা (ঘ) যক্ষ্মা\nউত্তর: খ\n২. শ্বাসনালির ঝিল্লিগাত্রে কিসের সংক্রমণে প্রদাহ হতে পারে?\n(ক) ব্যাকটেরিয়ার আক্রমণে \n(খ) ভাইরাসের আক্রমণে\n(গ) ছত্রাকের আক্রমণে \n(ঘ) প্রোটোজোয়ার আক্রমণে\nউত্তর: ক\n৩. ব্রঙ্কাইটিস রোগে মূলত কারা বেশি আক্রান্ত হয়?\n(ক) কেবল কিশোররা (খ) কেবল যুবকরা\n(গ) শিশু এবং বয়স্ক ব্যক্তিরা (ঘ) কেবল নারীরা\nউত্তর: গ\n৪. ব্রঙ্কাইটিস রোগের প্রধান কারণ হিসেবে কোনটি গণ্য করা হয়?\n(ক) অতিরিক্ত মিষ্টি খাওয়া \n(খ) কম ঘুমানো\n(গ) ধূমপান, অস্বাস্থ্যকর পরিবেশ ও দূষণ\n(ঘ) অতিরিক্ত পানি পান\nউত্তর: গ\n৫. ব্রঙ্কাইটিসে আক্রান্ত রোগীরা নিচের কোনটি খেতে পারে না?\n(ক) পুষ্টিকর তরল খাবার (খ) শক্ত খাবার\n(গ) গরম দুধ (ঘ) গরম স্যুপ\nউত্তর: খ\n৬. যদি কমপক্ষে একটানা ৩ মাস কাশির সাথে কফ থাকে এবং এরকম অসুস্থতা পরপর ২ বছর দেখা যায়, তবে তাকে কী বলে?\n(ক) অ্যাকিউট ব্রঙ্কাইটিস (খ) নিউমোনিয়া\n(গ) আজমা (ঘ) ক্রনিক ব্রঙ্কাইটিস\nউত্তর: ঘ\n৭. ক্রনিক ব্রঙ্কাইটিস নির্ণয়ের ক্ষেত্রে কফসহ কাশির ন্যূনতম সময়সীমা কত?\n(ক) একটানা $১\\text{ মাস}$ ও পরপর $১\\text{ বছর}$ \n(খ) একটানা $৩\\text{ মাস}$ ও পরপর $২\\text{ বছর}$\n(গ) একটানা $৬\\text{ মাস}$ ও পরপর $৩\\text{ বছর}$ \n(ঘ) একটানা $২\\text{ মাস}$ ও পরপর $১\\text{ বছর}$\nউত্তর: খ\n৮. ব্রঙ্কাইটিস রোগীর প্রতিকারে কোন ধরনের পরিবেশে রাখা উচিত?\n(ক) সহনীয় উষ্ণতা ও শুষ্ক পরিবেশে\n(খ) স্যাঁতসেঁতে ও ঠান্ডা পরিবেশে\n(গ) অতিরিক্ত ধোঁয়াময় পরিবেশে \n(ঘ) অন্ধাকারাচ্ছন্ন স্থানে\nউত্তর: ক\n৯. ব্রঙ্কাইটিস রোগীর জন্য উপযুক্ত পুষ্টিকর খাবার কোনটি?\n(ক) শক্ত ও শুকনা খাবার \n(খ) ঠান্ডা পানীয়\n(গ) অতিরিক্ত তেল-ঝাল যুক্ত খাবার\n (ঘ) গরম দুধ, স্যুপ ইত্যাদি পুষ্টিকর তরল ও গরম খাবার\nউত্তর: ঘ\n১০. ব্রঙ্কাইটিস প্রতিরোধের জন্য কোনটি করা প্রয়োজন?\n(ক) মাথায় ঠান্ডা লাগতে দেওয়া \n(খ) ধূলিবালি ও ধোঁয়াপূর্ণ পরিবেশে কাজ করা\n(গ) ধূমপান ও তামাক সেবনের বদ অভ্যাস ত্যাগ করা \n(ঘ) ধূমপান শুরু করা\nউত্তর: গ\n১১. নিউমোনিয়া ($Pneumonia$) প্রধানত কোন অঙ্গের একটি মারাত্মক রোগ?\n(ক) হৃদপিণ্ডের (খ) ফুসফুসের\n(গ) যকৃতের (ঘ) বৃক্কের\nউত্তর: খ\n১২. কোন রোগের পর অতিরিক্ত ঠান্ডা লেগে নিউমোনিয়া হতে দেখা যায়?\n(ক) হাম ও ব্রঙ্কাইটিস (খ) বসন্ত ও আজমা\n(গ) জন্ডিস ও টাইফয়েড (ঘ) রক্তস্বল্পতা ও ডায়াবেটিস\nউত্তর: ক\n১৩. নিউমোনিয়া রোগের অন্যতম প্রধান জীবাণু কোনটি?\n(ক) নিউমোকোক্কাস  (খ) মাইকোব্যাকটেরিয়াম\n(গ) সালমোনেলা (ঘ) ট্রিপানোসোমা\nউত্তর: ক\n১৪. নিউমোকোক্কাস কোন ধরনের অণুজীব?\n(ক) ভাইরাস (খ) ব্যাকটেরিয়া\n(গ) ছত্রাক (ঘ) প্রোটোজোয়া\nউত্তর: খ\n১৫. নিউমোনিয়া রোগটি সৃষ্টির পেছনের জীবাণু কোনটি হতে পারে?\n(ক) কেবল নিউমোকোক্কাস ব্যাকটেরিয়া \n(খ) বিভিন্ন ধরনের ব্যাকটেরিয়া, ভাইরাস ও ছত্রাক\n(গ) কেবল ভাইরাস (ঘ) কেবল প্রোটোজোয়া\nউত্তর: খ\n১৬. বিষম খেয়ে খাদ্যনালির রস শ্বাসনালিতে ঢুকলে কোন রোগটি হতে পারে?\n(ক) আজমা (খ) যক্ষ্মা\n(গ) ব্রঙ্কাইটিস (ঘ) নিউমোনিয়া\nউত্তর: ঘ\n১৭. নিউমোনিয়া রোগের একটি বিশেষ লক্ষণ কোনটি?\n(ক) ফুসফুসে শ্লেষ্মা-জাতীয় তরল পদার্থ জমে কফ সৃষ্টি হওয়া \n(খ) রক্তচাপ কমে যাওয়া\n(গ) শরীরে চর্মরোগ হওয়া \n(ঘ) গায়ে জ্বর না থাকা\nউত্তর: ক\n১৮. নিউমোনিয়া রোগের চূড়ান্ত পর্যায়ে রোগীর বুকে কেমন আওয়াজ হয়?\n(ক) সাইঁ সাঁই আওয়াজ (খ) টিকটিক আওয়াজ\n(গ) ঘড়ঘড় আওয়াজ (ঘ) কোনো শব্দ হয় না\nউত্তর: গ\n১৯. নিউমোনিয়া রোগীর গায়ের তাপমাত্রার অবস্থা কেমন থাকে?\n(ক) শরীরের তাপমাত্রা স্বাভাবিক থাকে \n(খ) দেহের তাপমাত্রা বৃদ্ধি পায় অর্থাৎ বেশি জ্বর হয়\n(গ) শরীরের তাপমাত্রা বরফের মতো ঠান্ডা হয় \n(ঘ) তাপমাত্রা ঘন ঘন ওঠানামা করে না\nউত্তর: খ\n২০. নিউমোনিয়া রোগীর চিকিৎসার ক্ষেত্রে প্রতিকারমূলক ব্যবস্থা কোনটি?\n(ক) রোগীকে পানি পান না করানো \n(খ) বেশি করে পানি পান করানো ও তরল পুষ্টিকর খাবার দেওয়া\n(গ) ঠান্ডা পরিবেশে রাখা \n(ঘ) চিকিৎসকের কাছে না যাওয়া\nউত্তর: খ"},{"id":"block_1788077157244tprab","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২১. ব্রঙ্কাইটিস ($Bronchitis$) রোগের কারণ ও আক্রান্ত ব্যক্তি সম্পর্কিত তথ্য—\ni. এটি শ্বাসনালির ভিতরের আবৃত ঝিল্লির ব্যাকটেরিয়াজনিত প্রদাহ\nii. সাধারণত শিশু এবং বয়স্ক ব্যক্তিরা এ রোগে বেশি আক্রান্ত হয়\niii. ধূমপান, স্যাঁতসেঁতে ধূলিকণামিশ্রিত আবহাওয়া ও ঠান্ডা লাগা এর অন্যতম কারণ\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২২. ক্রনিক ব্রঙ্কাইটিস রোগের লক্ষণসমূহ—\ni. কাশি, বুকে ব্যথা ও প্রচণ্ড শ্বাসকষ্ট অনুভব করা\nii. রোগী শক্ত খাবার খেতে পারে \niii. টানা ৩ মাস কাশির সাথে কফ থাকা এবং পরপর ২ বছর এমন অসুস্থতা থাকা\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: গ\n২৩. ব্রঙ্কাইটিস রোগের প্রতিকার ও প্রতিরোধে করণীয়—\ni. ধূমপান, মদ্যপান, তামাক বা সাদাপাতা খাওয়া বন্ধ করা\nii. রোগীকে সহনীয় উষ্ণতা ও শুষ্ক পরিবেশে রাখা এবং পূর্ণ বিশ্রাম দেওয়া\niii. পুষ্টিকর তরল ও গরম খাবার (যেমন: গরম দুধ, স্যুপ) খাওয়ানো\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৪. নিউমোনিয়া ($Pneumonia$) রোগের কারণ ও উৎস—\ni. এটি নিউমোকোক্কাস ($Pneumococcus$) নামক ব্যাকটেরিয়ার আক্রমণে হয়\nii. হাম ও ব্রঙ্কাইটিস রোগের পর অতিরিক্ত ঠান্ডা লাগলে এ রোগ হতে পারে\niii. বিষম খেয়ে খাদ্যনালির রস শ্বাসনালিতে ঢুকলে নিউমোনিয়া হতে পারে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৫. নিউমোনিয়া রোগের শারীরিক লক্ষণসমূহ—\ni. ফুসফুসে শ্লেষ্মা-জাতীয় তরল পদার্থ জমে কফ সৃষ্টি হয়\nii. দেহের তাপমাত্রা বৃদ্ধি পায় অর্থাৎ বেশি জ্বর হয়\niii. চূড়ান্ত পর্যায়ে বুকের মধ্যে ঘড়ঘড় আওয়াজ হয় এবং মারাত্মক শ্বাসকষ্ট হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৬. নিউমোনিয়া রোগের প্রতিকার ও প্রতিরোধমূলক ব্যবস্থা—\ni. চিকিৎসকের পরামর্শ অনুযায়ী সুচিকিৎসা ও বেশি করে পানি পান করানো\nii. রোগীকে সহনীয় উষ্ণতা ও শুষ্ক পরিবেশে রাখা এবং আলো-বাতাসপূর্ণ গৃহে বসবাস করা\niii. শিশু ও বয়স্কদের যেন মাথায় ঠান্ডা না লাগে সেদিকে নজর রাখা ও ধূমপান পরিহার করা\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1788077179472fqha7","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৭ ও ২৮) নং প্রশ্নের উত্তর দাও:   </b>  \nপনেরো বছরের কিশোর সাব্বির ধূমপান ও কারখানার ধোঁয়াময় পরিবেশে কাজ করার কারণে কিছুদিন ধরে বুকে তীব্র ব্যথা ও শ্বাসকষ্ট অনুভব করছে। তার টানা ৩ মাস ধরে কাশির সাথে কফ বের হচ্ছে এবং ডাক্তার তাকে জানান যে, গত বছরও তার একই সমস্যা দেখা গিয়েছিল।\n২৭. উদ্দীপকে বর্ণিত সাব্বিরের কাশির সাথে কফসহ ক্রনিক অসুস্থতার বয়সসীমা কত বছর বা কত সময় দেখা দিলে একে ক্রনিক ব্রঙ্কাইটিস বলা হয়?\n(ক) টানা $১\\text{ মাস}$ ও পরপর $১\\text{ বছর}$ \n(খ) টানা $৩\\text{ মাস}$ ও পরপর $২\\text{ বছর}$\n(গ) টানা $৬\\text{ মাস}$ ও পরপর $৩\\text{ বছর}$ \n(ঘ) টানা $২\\text{ মাস}$ ও পরপর $১\\text{ বছর}$\nউত্তর: খ\n২৮. উদ্দীপকে উল্লেখিত সাব্বিরের রোগটি প্রতিরোধের সবচেয়ে কার্যকর উপায় কোনটি?\n(ক) শক্ত খাবার খাওয়া \n(খ) দিনে একাধিকবার ঠান্ডা স্যুপ খাওয়া\n(গ) ঠান্ডা পানিতে গোসল করা \n(ঘ) ধূমপান পরিহার ও ধোঁয়ামুক্ত সুস্থ পরিবেশে বাস করা\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>  \nপাঁচ বছরের শিশু আয়ান কিছুদিন আগে হামে আক্রান্ত হয়েছিল। সম্প্রতি অতিরিক্ত ঠান্ডা লাগার পর তার তীব্র জ্বর দেখা দেয় এবং ফুসফুসে কফ জমে শ্বাসকষ্ট হতে থাকে। মারাত্মক অবস্থায় তার বুকের ভেতর ঘড়ঘড় আওয়াজ হতে শুরু করে।\n২৯. উদ্দীপকে আয়ানের ফুসফুসে আক্রান্ত রোগটির প্রধান সৃষ্টিকারী অণুজীব কোনটি?\n(ক) নিউমোকোক্কাস  (খ) মাইকোব্যাকটেরিয়াম\n(গ) সালমোনেলা (ঘ) ট্রিপানোসোমা\nউত্তর: ক\n৩০. উদ্দীপকের রোগটিতে আয়ানের মতো আক্রান্ত শিশুদের ক্ষেত্রে ডাক্তারের পরামর্শে প্রতিকারমূলক ব্যবস্থা কোনটি?\n(ক) ঠান্ডা ঘরে রোগীকে শুইয়ে রাখা \n(খ) শক্ত ও মসলাযুক্ত খাবার দেওয়া\n(গ) বেশি করে পানি পান করানো ও পুষ্টিকর তরল খাবার দেওয়া\n(ঘ) যেকোনো ওষুধ না খেয়ে কেবল অপেক্ষা করা\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>  \nএক বয়স্ক লোক তামাক সেবন এবং স্যাঁতসেঁতে ধূলিকণামিশ্রিত আবহাওয়ায় দীর্ঘদিন কাজ করার পর শ্বাসনালির ভেতরের আবৃত ঝিল্লির প্রদাহে আক্রান্ত হন। তিনি বুকে তীব্র ব্যথা অনুভব করায় কোনো শক্ত খাবার খেতে পারছিলেন না।\n৩১. উদ্দীপকে বয়স্ক লোকটির শ্বাসনালির ঝিল্লিগাত্রে যে রোগটি সংঘটিত হয়েছে তার নাম কী?\n(ক) নিউমোনিয়া (খ) যক্ষ্মা\n(গ) আজমা (ঘ) ব্রঙ্কাইটিস\nউত্তর: খ\n৩২. উদ্দীপকে উল্লেখিত রোগীকে দ্রুত সুস্থ করে তুলতে কোন ধরনের পথ্য ও পরিবেশে রাখা উচিত?\n(ক) ঠান্ডা বাতাসযুক্ত অন্ধকার ঘর ও শক্ত খাবার \n(খ) সহনীয় উষ্ণতা, শুষ্ক পরিবেশ ও গরম তরল খাবার\n(গ) স্যাঁতসেঁতে ঘর ও ঠান্ডা দুধ \n(ঘ) উচ্চমাত্রার স্টেরয়েড চিকিৎসা ও ঠান্ডা পানি\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b>  \nখাওয়ার সময় অসাবধানতাবশত বিষম খেয়ে এক ব্যক্তির খাদ্যনালির কিছু রস শ্বাসনালিতে ঢুকে যায়। পরবর্তীতে তাঁর ফুসফুসে শ্লেষ্মা-জাতীয় তরল জমে প্রদাহ সৃষ্টি হয় এবং প্রচণ্ড জ্বর আসে।\n৩৩. উদ্দীপকের ব্যক্তির বিষম খাওয়ার মাধ্যমে শ্বাসনালিতে খাবার ঢুকে কোন রোগের সংক্রমণ ঘটাতে পারে?\n(ক) আজমা (খ) নিউমোনিয়া\n(গ) ব্রঙ্কাইটিস (ঘ) যক্ষ্মা\nউত্তর: খ\n৩৪. উদ্দীপকে বর্ণিত রোগটির চূড়ান্ত পর্যায়ের প্রধান লক্ষণ কোনটি?\n(ক) গায়ে জ্বর না থাকা \n(খ) বুকের মধ্যে ঘড়ঘড় আওয়াজ হওয়া ও মারাত্মক শ্বাসকষ্ট\n(গ) চামড়া নীল হয়ে যাওয়া \n(ঘ) রক্তচাপ অস্বাভাবিক কমে যাওয়া\nউত্তর: খ"}]},{"id":"topic_1788076311098zon15","title":"পাঠ-( 7.3 (d,e))","blocks":[{"id":"block_1788077216824x8g8j","type":"text","value":"<span style=\"color:green;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. যক্ষ্মা ($Tuberculosis$) একটি মারাত্মক কী ধরনের রোগ?\n(ক) বায়ুবাহিত সংক্রামক রোগ \n(খ) পানিবাহিত রোগ\n(গ) বংশগত রোগ (ঘ) অসংক্রামক রোগ\nউত্তর: ক\n২. কার দ্বারা যক্ষ্মা সহজে সংক্রামিত হয়?\n(ক) যক্ষ্মা রোগীর কফ ও থুতু (খ) পশুর স্পর্শ\n(গ) নোংরা পানি (ঘ) মশার কামড়\nউত্তর: ক\n৩. যক্ষ্মা দেহের কোথায় কোথায় হতে পারে?\n(ক) কেবল ফুসফুসে (খ) যকৃৎ, হাড়, ফুসফুস ইত্যাদিতে\n(গ) কেবল রক্তে (ঘ) কেবল ত্বকে\nউত্তর: খ\n৪. দেহে যক্ষ্মার জীবাণু প্রবেশ করলে কখন এর লক্ষণ প্রকাশ পায়?\n(ক) জীবাণু প্রবেশের সাথে সাথে \n(খ) রোগ প্রতিরোধ ব্যবস্থা শ্বেতরক্তকণিকাকে পরাস্ত করে দেহকে দুর্বল করলে\n(গ) প্রোটিনের অভাব হলে \n(ঘ) পর্যাপ্ত ঘুম না হলে\nউত্তর: খ\n৫. যক্ষ্মা রোগ সৃষ্টিকারী ব্যাকটেরিয়ার নাম কী?\n(ক) Vibrio cholerae\n(খ) Pneumococcus\n(গ) Salmonella typhi \n(ঘ) Mycobacterium tuberculosis\nউত্তর: ঘ\n৬. যক্ষ্মা নির্ণয়ের জন্য কোনটি ব্যবহৃত হয়?\n(ক) কফ পরীক্ষা, সাইটোলজি ও ডট ব্লট \n(খ) কফ পরীক্ষা, চামড়ার পরীক্ষা (MT test), সাইটোলজি, হিস্টোপ্যাথোলজি ও এক্স-রে\n(গ) কেবল ইসিজি \n(ঘ) কেবল রক্তের গ্রুপ পরীক্ষা\nউত্তর: খ\n৭. সম্প্রতি বাংলাদেশে রোগীর কফের কিসের ভিত্তিতে যক্ষ্মা জীবাণু নির্ণয়ের পরীক্ষা চালু হয়েছে?\n(ক) প্রোটিন ভিত্তিক (খ) ফ্যাট ভিত্তিক\n(গ) DNA ভিত্তিক (ঘ) হরমোন ভিত্তিক\nউত্তর: গ\n৮. যক্ষ্মা রোগের একটি বিশেষ লক্ষণ কোনটি?\n(ক) সাধারণত তিন সপ্তাহের বেশি সময় কাশি থাকা \n(খ) একটানা কোষ্ঠকাঠিন্য হওয়া\n(গ) উচ্চ রক্তচাপ হওয়া \n(ঘ) ওজন হঠাৎ বৃদ্ধি পাওয়া\nউত্তর: ক\n৯. যক্ষ্মা রোগের কাশিতে নিচের কোনটি ঘটে?\n(ক) শুকনো কাশি হয় (খ) কফের সাথে রক্ত যায়\n(গ) হাঁচি হয় (ঘ) কাশির সাথে থুতু বের হয় না\nউত্তর: খ\n১০. যক্ষ্মা রোগীর শরীরের তাপমাত্রা কেমন থাকে?\n(ক) রাতে ঘাম হয় ও বিকেলের দিকে জ্বর আসে \n(খ) সকালে প্রচণ্ড জ্বর থাকে\n(গ) সারা দিন অতিরিক্ত তাপমাত্রা থাকে \n(ঘ) তাপমাত্রা সবসময় স্বাভাবিকের চেয়ে কম থাকে\nউত্তর: ক\n১১. যক্ষ্মা রোগে আক্রান্ত ব্যক্তির বুকে ও পেটে কী ধরনের অনুভূতি হতে পারে?\n(ক) কোনো পরিবর্তন হয় না \n(খ) তীব্র চুলকানি\n(গ) বুকে পিঠে ব্যথা ও অজির্ণ বা পেটের পীড়া\n(ঘ) কোনো ব্যথা থাকে না\nউত্তর: গ\n১২. যক্ষ্মা রোগীর চিকিৎসায় ডাক্তারের পরামর্শ অনুযায়ী কী করা আবশ্যক?\n(ক) সুস্থ বোধ করলেই ওষুধ বন্ধ করা \n(খ) ডাক্তারের নির্দেশ ব্যতীত কোনো অবস্থায় ওষুধ সেবন বন্ধ না করা\n(গ) ওষুধ অল্প কয়েক দিন খাওয়া \n(ঘ) প্রতিদিন নতুন ডাক্তারের চিকিৎসা নেওয়া\nউত্তর: খ\n১৩. শিশুদের যক্ষ্মা প্রতিরোধে কোন টিকা দিতে হয়?\n(ক) ডিপিটি টিকা (খ) বিসিজি (BCG) টিকা\n(গ) পোলিও টিকা (ঘ) টাইফয়েড টিকা\nউত্তর: খ\n১৪. বিসিজি টিকা শিশুর কোন বয়সের মধ্যে দেওয়া উচিত?\n(ক) জন্মের পর থেকে এক বছর বয়সের মধ্যে \n(খ) পাঁচ বছর বয়সের পর\n(গ) ১০ বছর বয়সে \n(ঘ) জন্মের সাথে সাথে ১ম দিনে\nউত্তর: ক\n১৫. সব ধরনের ক্যানসারের মধ্যে কোন ক্যানসারের হার সবচেয়ে বেশি?\n(ক) যকৃত ক্যানসার (খ) রক্তের ক্যানসার\n(গ) ত্বকের ক্যানসার (ঘ) ফুসফুসের ক্যানসার\nউত্তর: ঘ\n১৬. আমাদের দেশে পুরুষের ক্যানসারজনিত মৃত্যুর প্রধান কারণ কোনটি?\n(ক) ব্রেন ক্যানসার (খ) ফুসফুসের ক্যানসার\n(গ) স্টোমাক ক্যানসার (ঘ) বোন ক্যানসার\nউত্তর: খ\n১৭. ফুসফুসের ক্যানসারের অন্যতম প্রধান কারণ কোনটি?\n(ক) ধূমপান (খ) অতিরিক্ত মিষ্টি খাওয়া\n(গ) কম পানি পান করা (ঘ) কায়িক পরিশ্রম\nউত্তর: ক\n১৮. কোন পদার্থগুলোর সংস্পর্শ ফুসফুস ক্যানসারের জন্য দায়ী হতে পারে?\n(ক) অ্যাসবেস্টস, আর্সেনিক, ক্রোমিয়াম, নিকেল, কঠিন ধাতুর গুঁড়া \n(খ) ক্যালসিয়াম ও সোডিয়াম\n(গ) গ্লুকোজ ও শর্করা \n(ঘ) পটাশিয়াম ও আইরিন\nউত্তর: ক\n১৯. ফুসফুস ক্যানসারের প্রাথমিক লক্ষণসমূহের মধ্যে কোনটি অন্তর্ভুক্ত?\n(ক) পায়ের পেশিতে টান পড়া\n(খ) তীব্র কোষ্ঠকাঠিন্য\n(গ) দৃষ্টিশক্তি হ্রাস পাওয়া\n (ঘ) দীর্ঘদিন ধরে শুকনো কাশি ও বুকে ব্যথা\nউত্তর: ঘ\n২০. ফুসফুস ক্যানসার প্রাথমিক অবস্থায় শনাক্তের জন্য কোনটি করা হয়?\n(ক) থুতু বা কফ বিশ্লেষণ, বুকের এক্স-রে, সিটি স্ক্যান, এমআরআই \n(খ) ইসিজি ও রক্তচাপ পরীক্ষা\n(গ) ডায়াবেটিস পরীক্ষা \n(ঘ) প্রস্রাব পরীক্ষা\nউত্তর: ক\n২১. ফুসফুস ক্যানসারের চূড়ান্ত রোগনির্ণয়ের জন্য কোনটি করা আবশ্যক?\n(ক) রক্তের গ্রুপ পরীক্ষা\n(খ) অ্যালার্জি পরীক্ষা\n(গ) সাইটোলজি ও হিস্টোপ্যাথোলজি পরীক্ষা\n(ঘ) চোখ পরীক্ষা\nউত্তর: গ\n২২. ফুসফুস ক্যানসার চিকিৎসায় ক্যানসার কোষ ধ্বংস করতে কোন থেরাপি প্রয়োগ করা হয়?\n(ক) ফিজিওথেরাপি (খ) রেডিয়েশন থেরাপি\n(গ) ইনসুলিন থেরাপি (ঘ) মেসোথেরাপি\nউত্তর: খ"},{"id":"block_1788077246541s1eqx","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৩. যক্ষ্মা ($Tuberculosis$) রোগের বৈশিষ্ট্য ও সংক্রামক প্রকৃতি—\ni. এটি একটি মারাত্মক বায়ুবাহিত সংক্রামক রোগ\nii. জীবাণুমুক্ত পরিবেশে বসবাসকারী ব্যক্তিরা এ রোগে দ্রুত আক্রান্ত হয়\niii. যক্ষ্মা কেবল ফুসফুসেই নয়, যকৃৎ, হাড় ও অন্যান্য অঙ্গেও হতে পারে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n২৪. যক্ষ্মা রোগের লক্ষণসমূহ—\ni. সাধারণত তিন সপ্তাহের বেশি সময় কাশি থাকা এবং কাশির সাথে কফ বা রক্ত যাওয়া\nii. ওজন কমতে থাকা ও আস্তে আস্তে শরীর দুর্বল হওয়া\niii. বিকেলে জ্বর আসা ও রাতে ঘাম হওয়া\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৫. যক্ষ্মা রোগের নির্ণয় ও পরীক্ষা ব্যবস্থা—\ni. কফ পরীক্ষা, চামড়ার পরীক্ষা (MT test), সাইটোলজি ও এক্স-রে এর মাধ্যমে রোগ নির্ণয় করা যায়\nii. রোগীর কফের স্পুটাম নমুনা পরীক্ষা করে জীবাণু নির্ণয়ে DNA ভিত্তিক পরীক্ষা ব্যবহৃত হয়\niii. কোনো ধরনের পরীক্ষা ছাড়াই কেবল বাহ্যিক লক্ষণ দেখে এটি নিশ্চিত করা যায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৬. যক্ষ্মা রোগের প্রতিকার ও প্রতিরোধমূলক ব্যবস্থা—\ni. চিকিৎসকের নির্দেশ ব্যতীত কোনো অবস্থায় ওষুধ সেবন বন্ধ করা যাবে না\nii. শিশুদের যক্ষ্মা প্রতিরোধে বিসিজি (BCG) টিকা দেওয়া বাধ্যতামূলক\niii. বিসিজি টিকা দিলে বয়স্ক ব্যক্তিরাও আজীবন যক্ষ্মা থেকে পুরোপুরি সুরক্ষায় থাকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৭. ফুসফুসের ক্যানসারের কারণসমূহ—\ni. ফুসফুস ক্যানসারের অন্যতম প্রধান কারণ ধূমপান\nii. আর্সেনিক, ক্রোমিয়াম, নিকেল ও অ্যাসবেস্টসের সংস্পর্শ\niii. কর্মক্ষেত্রে কঠিন ধাতুর গুঁড়া ও বাতাস দূষণকারী বস্তুর প্রভাব\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৮. ফুসফুস ক্যানসারের প্রাথমিক ও সাধারণ লক্ষণসমূহ—\ni. দীর্ঘদিন ধরে ফুসফুসে কাশি ও বুকে ব্যথা\nii. হাঁপানি, ঘন ঘন জ্বর হওয়া এবং ওজন হ্রাস পাওয়া\niii. বারবার ব্রঙ্কাইটিস বা নিউমোনিয়ায় সংক্রমিত হওয়া\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৯. ফুসফুসের ক্যানসার নির্ণয় সংক্রান্ত সত্য তথ্য—\ni. প্রাথমিক অবস্থায় শনাক্তকরণের জন্য থুতু বিশ্লেষণ, এক্স-রে, সিটি স্ক্যান ও এমআরআই করা হয়\nii. চূড়ান্ত রোগনির্ণয়ের জন্য সাইটোলজি ও হিস্টোপ্যাথোলজি পরীক্ষা প্রয়োজন\niii. রক্তচাপ পরীক্ষা করে ক্যানসার আক্রান্ত স্থান হুবহু নিশ্চিত করা যায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩০. ফুসফুস ক্যানসারের চিকিৎসা—\ni. রোগের লক্ষণ দেখা দিলে অবিলম্বে ডাক্তারের পরামর্শ নেওয়া\nii. প্রয়োজনে রেডিয়েশন থেরাপি প্রয়োগের মাধ্যমে ক্যানসার কোষ ধ্বংস করা\niii. যক্ষ্মার প্রতিরোধক বিসিজি টিকা দিয়ে তাৎক্ষণিক ক্যানসার কোষ নিরাময় করা\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_1788077269149kqijj","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>  \nপঁচাশিশু সিয়ামের হঠাৎ ওজন কমতে শুরু করে এবং একটানা ৩ সপ্তাহের বেশি সময় ধরে কফসহ কাশি হতে থাকে। মাঝে মাঝে কাশির সাথে রক্তও বের হয়। চিকিৎসকের কাছে নিয়ে গেলে তিনি রোগীর স্পুটাম পরীক্ষা ও বুকের এক্স-রে করার পর নিশ্চিত হন যে এটি একটি ক্ষতিকারক ব্যাকটেরিয়াজনিত বায়ুবাহিত সংক্রামক রোগ।\n৩১. উদ্দীপকে বর্ণিত সিয়ামের সংক্রামক রোগটির পেছনে দায়ী ব্যাকটেরিয়ার নাম কী?\n(ক) Pneumococcus \n(খ) Mycobacterium tuberculosis\n(গ) Salmonella typhi \n(ঘ) Vibrio cholerae\nউত্তর: খ\n৩২. উদ্দীপকের রোগটি থেকে সুরক্ষা পেতে শিশুদের জন্মের পর এক বছর বয়সের মধ্যে কোন প্রতিষেধক টিকা দেওয়া উচিত?\n(ক) ডিপিটি টিকা (খ) হেপাটাইটিস টিকা\n(গ) পোলিও টিকা (ঘ) বিসিজি  টিকা\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b>  \nরহিম সাহেব দীর্ঘ ৪০ বছর ধরে ধূমপানে অভ্যস্ত। পাশাপাশি তিনি একটি অ্যাসবেস্টস ও কেমিক্যাল কারখানায় কাজ করেন। সম্প্রতি তাঁর দীর্ঘদিন ধরে বুকে তীব্র ব্যথা, শুকনো কাশি এবং প্রায়ই ঘন ঘন নিউমোনিয়ায় আক্রান্ত হওয়ার প্রবণতা দেখা দিচ্ছে। চিকিৎসক চূড়ান্ত রোগনির্ণয়ের জন্য সাইটোলজি ও হিস্টোপ্যাথোলজি পরীক্ষার নির্দেশ দিলেন।\n৩৩. উদ্দীপকের রহিম সাহেব কোন মারাত্মক ব্যাধিতে আক্রান্ত হওয়ার চরম ঝুঁকিতে রয়েছেন?\n(ক) আজমা (খ) ফুসফুসের ক্যানসার\n(গ) ব্রঙ্কাইটিস (ঘ) যক্ষ্মা\nউত্তর: খ\n৩৪. উদ্দীপকের ব্যাধিটি নিয়ন্ত্রণে ও চিকিৎসায় ক্যানসার কোষ ধ্বংস করার জন্য কোন থেরাপি প্রয়োগ করা হয়ে থাকে?\n(ক) ইনসুলিন থেরাপি (খ) ফিজিওথেরাপি\n(গ) মেসোথেরাপি (ঘ) রেডিয়েশন থেরাপি\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও:   </b>  \nআজমল সাহেব বিগত এক মাস ধরে অনবরত কাশির সাথে হালকা জ্বর অনুভব করছিলেন। কিন্তু সুস্থ বোধ করায় তিনি ডাক্তারের দেওয়া যক্ষ্মার নিয়মিত ওষুধগুলো চিকিৎসকের নির্দেশ ছাড়াই হঠাৎ বন্ধ করে দিলেন। পরবর্তীতে তিনি আরও গুরুতর শারীরিক জটিলতায় আক্রান্ত হলেন।\n৩৫. উদ্দীপকে উল্লেখিত রোগটি সম্পর্কে সত্য তথ্য কোনটি?\n(ক) এটি কেবল ফুসফুসেই সীমাবদ্ধ থাকে \n(খ) এটি বংশগত রোগ\n(গ) এটি একটি বায়ুবাহিত সংক্রামক রোগ যা যকৃৎ ও হাড়েও হতে পারে\n(ঘ) এটি পানির মাধ্যমে ছড়ায়\nউত্তর: গ\n৩৬. উদ্দীপকে আজমল সাহেবের চিকিৎসার ক্ষেত্রে কোন ভুলটি সম্পূর্ণভাবে পরিহার করা উচিত ছিল?\n(ক) সুষম খাদ্য গ্রহণ করা \n(খ) ডাক্তারের নির্দেশ ব্যতীত কোনো অবস্থায় ওষুধ সেবন বন্ধ করা\n(গ) আলাদা কক্ষে থাকা \n(ঘ) কফ ও থুতু মাটিতে পুঁতে ফেলা\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৭ ও ৩৮) নং প্রশ্নের উত্তর দাও:   </b>  \nকারখানার শ্রমিক শফিক সাহেব বহুদিন ধরে আর্সেনিক, ক্রোমিয়াম ও নিকেল মিশ্রিত বাতাসে কাজ করেন। সম্প্রতি তাঁর অস্বাভাবিক ওজন হ্রাস পেয়েছে, হাঁপানির মতো সমস্যা দেখা দিচ্ছে এবং কাশির সাথে কফ বের হচ্ছে। চিকিৎসকের সন্দেহ হওয়ায় তিনি প্রাথমিকভাবে সিটি স্ক্যান ও এমআরআই করানোর পরামর্শ দেন।\n৩৭. উদ্দীপকে শফিক সাহেবের রোগটির প্রাথমিক শনাক্তকরণের জন্য কোন পরীক্ষাটি করা যেতে পারে?\n(ক) কেবল রক্তচাপ পরীক্ষা \n(খ) থুতু বিশ্লেষণ, বুকের এক্স-রে ও সিটি স্ক্যান\n(গ) কেবল রক্তে শর্করার মাত্রা পরীক্ষা \n(ঘ) প্রস্রাব ও মল পরীক্ষা\nউত্তর: খ\n৩৮. উদ্দীপকে উল্লিখিত ক্ষতিকারক রাসায়নিক পদার্থগুলোর সংস্পর্শ ছাড়াও শফিক সাহেবের ব্যাধিটি হওয়ার অন্যতম প্রধান কারণ কোনটি হতে পারে?\n(ক) ধূমপান (খ) অতিরিক্ত পানি পান\n(গ) ঠান্ডা লাগানো (ঘ) বেশি বিশ্রাম নেওয়া\nউত্তর: ক\n\n\n<span style=\"color:red;\"><center><b>————————🌸 সমাপ্ত 🌸————————</b></center></span>\n\n\n\n"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
