দান-প্রদানকৃত অক্সিজেন ও কার্বন ডাই-অক্সাইড গ্যাসের পরিমাণ কেমন থাকে?\n(ক) অক্সিজেনের পরিমাণ দ্বিগুণ \n(খ) কার্বন ডাই-অক্সাইডের পরিমাণ দ্বিগুণ\n(গ) প্রায় সমান (ঘ) অক্সিজেনের পরিমাণ শূন্য\nউত্তর: গ\n১৩. রাতের বেলা সালোকসংশ্লেষণ প্রক্রিয়ার কোন পর্যায় বন্ধ থাকে?\n(ক) অন্ধকার পর্যায় (খ) আলোক পর্যায়\n(গ) সি-৩ পর্যায় (ঘ) সি-৪ পর্যায়\nউত্তর: খ\n১৪. রাতের বেলা উদ্ভিদে কোন গ্যাসটি উৎপন্ন হয় না?\n(ক) $CO_2$ (খ) $O_2$\n(গ) $N_2$ (ঘ) $NH_3$\nউত্তর: খ\n১৫. উদ্ভিদদেহে শ্বসন প্রক্রিয়া কতক্ষণ সংঘটিত হয়?\n(ক) কেবল দিনের বেলা (খ) কেবল রাতের বেলা\n(গ) দিবারাত্রি $২৪\\text{ ঘণ্টা}$ (ঘ) কেবল আলোর উপস্থিতিতে\nউত্তর: গ\n১৬. রাতের বেলা বড় গাছের নিচে ঘুমালে মানুষের কোন শারীরিক সমস্যা দেখা দিতে পারে?\n(ক) রক্তস্বল্পতা (খ) চর্মরোগ\n(গ) উচ্চ রক্তচাপ (ঘ) শ্বাসকষ্ট\nউত্তর: ঘ\n১৭. রাতের বেলা বড় গাছের নিচে শ্বাসকষ্ট হওয়ার মূল কারণ কোনটি?\n(ক) অতিরিক্ত $O_2$ তৈরি হওয়া \n(খ) শ্বসন প্রক্রিয়ায় অনবরত $CO_2$ উৎপন্ন হওয়া\n(গ) উদ্ভিদের প্রস্বেদন বন্ধ থাকা \n(ঘ) তাপমাত্রা অতিরিক্ত হ্রাস পাওয়া\nউত্তর: খ\n১৮. উদ্ভিদ পাতা দিয়ে বায়ু থেকে $O_2$ ও $CO_2$ সংগ্রহের পাশাপাশি মূল দিয়ে মাটি থেকে কী শোষণ করে?\n(ক) পানি (খ) গ্লুকোজ\n(গ) স্টার্চ (ঘ) অ্যামিনো এসিড\nউত্তর: ক\n১৯. শোষিত পানির সাথে $CO_2$-এর বিক্রিয়ার ফলে কোন গ্যাস উৎপন্ন হয় যা বায়ুমণ্ডলে চলে যায়?\n(ক) $CO_2$ (খ) $O_2$\n(গ) $N_2$ (ঘ) $H_2$\nউত্তর: খ"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
