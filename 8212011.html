যায়\nii. গ্রহ, নক্ষত্র, ছায়াপথ ইত্যাদির মাঝখানের খালি জায়গাকে মহাকাশ বা মহাশূন্য বলে\niii. মহাকাশের দিকে তাকালে যেসব বস্তুকে দেখতে পাওয়া যায় তা হলো পদার্থ\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n১১. পৃথিবীর বায়ুমণ্ডল ও মহাকাশের শুরু সংক্রান্ত বিষয়—\ni. পৃথিবীর বায়ুমণ্ডল পৃথিবীর সাথেই মহাকাশে ঘোরে এবং একে পৃথিবীর অংশ হিসেবে বিবেচনা করা হয়\nii. পৃথিবী পৃষ্ঠ থেকে দূরত্ব যত বাড়তে থাকে, বায়ুমণ্ডল তত হালকা হতে থাকে\niii. বেশিরভাগ বিজ্ঞানীর মতে, পৃথিবী থেকে $160\\ km$ উচ্চতায় বায়ুমণ্ডলের শেষ এবং মহাকাশের শুরু\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n১২. মহাকাশের বিস্তার ও মানুষের ধারণার পরিবর্তন—\ni. এক সময় মানুষ ভাবত মহাকাশের সীমা আছে এবং মহাকাশ বৃত্তাকার\nii. দূরবীক্ষণ যন্ত্র আবিষ্কারের পর মানুষ তার দৃষ্টিসীমার বাইরের অনেক গ্রহ ও নক্ষত্র দেখতে পেল\niii. মহাকাশের কোনো নির্দিষ্ট সীমারেখা বা শেষ নেই বলে মানুষ প্রথম থেকেই জানত\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_1793983480548b4ssx","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (১৩ ও ১৪) নং প্রশ্নের উত্তর দাও:   </b> \nরাকিব রাতের আকাশে দূরবীক্ষণ যন্ত্র দিয়ে তাকিয়ে দেখল অসংখ্য গ্রহ, নক্ষত্র ও গ্যালাক্সি ছড়িয়ে রয়েছে। সে শিক্ষককে জিজ্ঞেস করল, এই বিশাল মহাকাশের শুরু কোথা থেকে? শিক্ষক বললেন, পৃথিবী পৃষ্ঠ থেকে নির্দিষ্ট উচ্চতার পর বায়ুমণ্ডল শেষ হয়ে মহাকাশ শুরু হয়।\n১৩. উদ্দীপকে কোন যন্ত্রের সাহায্যে রাকিব রাতের আকাশে গ্রহ ও নক্ষত্রগুলো স্পষ্ট দেখতে পেল?\n(ক) অণুবীক্ষণ যন্ত্র (খ) দূরবীক্ষণ যন্ত্র\n(গ) থার্মোমিটার (ঘ) ব্যারোমিটার\nউত্তর: খ\n১৪. বেশিরভাগ বিজ্ঞানীর মতে, পৃথিবী পৃষ্ঠ থেকে কত উচ্চতায় বায়ুমণ্ডলের শেষ এবং মহাকাশের শুরু ধরা হয়?\n(ক) ৫০ কিলোমিটার (খ) ১০০ কিলোমিটার\n(গ) ১৬০ কিলোমিটার ($160\\ km$) (ঘ) ৫০০ কিলোমিটার\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (১৫ ও ১৬) নং প্রশ্নের উত্তর দাও:   </b>  \nবিজ্ঞান ক্লাসে শিক্ষক বললেন, পৃথিবীর বায়ুমণ্ডল পৃথিবীর সাথেই মহাকাশে ঘোরে। পৃথিবী থেকে যতই ওপরে ওঠা যায়, বায়ুমণ্ডল ততই হালকা হতে থাকে এবং একসময় তা আর থাকে না বললেই চলে।\n১৫. পৃথিবীর বায়ুমণ্ডল কার সাথে মহাকাশে ঘুরছে?\n(ক) সূর্যের (খ) চাঁদের\n(গ) পৃথিবীর (ঘ) গ্যালাক্সির\nউত্তর: গ\n১৬. বায়ুমণ্ডলকে মহাকাশের অংশ হিসেবে বিবেচনা না করে প্রধানত কিসের অংশ হিসেবে বিবেচনা করা হয়?\n(ক) সূর্যের (খ) পৃথিবীর\n(গ) চাঁদের (ঘ) গ্যালাক্সির\nউত্তর: খ"}]},{"id":"topic_17939835053380qjsd","title":"পাঠ - (২)","blocks":[{"id":"block_17939835552121cfd9","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. এই সৃষ্টি জগতে যা কিছু আছে তার সবকিছু নিয়েই কী গঠিত?\n(ক) সৌরজগৎ (খ) গ্যালাক্সি\n(গ) মহাবিশ্ব (ঘ) বায়ুমণ্ডল\nউত্তর: গ\n২. মহাবিশ্বের যেসব অংশে পদার্থ বা বস্তু বেশি জড়ো বা ঘনীভূত হয়েছে সেগুলোকে কী বলা হয়?\n(ক) ধূলিকণা (খ) গ্যালাক্সি বা নক্ষত্রজগৎ\n(গ) সৌরজগৎ (ঘ) উপগ্রহ\nউত্তর: খ\n৩. আমাদের বাসভূমি পৃথিবী যে গ্যালাক্সিতে অবস্থিত তার নাম কী?\n(ক) এন্ড্রোমেডা (খ) আলফা সেন্টোরি\n(গ) বিগ ব্যাং (ঘ) মিল্কিওয়ে বা ছায়াপথ\nউত্তর: ঘ\n৪. আলো এক সেকেন্ডে প্রায় কত কিলোমিটার পথ যেতে পারে?\n(ক) ১ লক্ষ কিলোমিটার (খ) ২ লক্ষ কিলোমিটার\n(গ) ৩ লক্ষ কিলোমিটার  (ঘ) ১৫ কোটি কিলোমিটার\nউত্তর: গ\n৫. পৃথিবী ও সূর্যের মধ্যবর্তী দূরত্ব প্রায় কত?\n(ক) ৩ লক্ষ কিলোমিটার (খ) ১৫ কোটি কিলোমিটার \n(গ) ১৩.৭৫ বিলিয়ন কিলোমিটার \n(ঘ) ১ বিলিয়ন কিলোমিটার\nউত্তর: খ\n৬. সূর্য থেকে পৃথিবীতে আলো আসতে সময় লাগে প্রায় কত?\n(ক) ৮ সেকেন্ড (খ) ৮ মিনিট ২০ সেকেন্ড\n(গ) ৪ বছর (ঘ) ১৩.৭৫ মিনিট\nউত্তর: খ\n৭. সূর্য থেকে এর সবচেয়ে নিকটবর্তী নক্ষত্র আলফা সেন্টোরিতে আলো পৌঁছাতে কত সময় লাগে?\n(ক) ৮ মিনিট ২০ সেকেন্ড (খ) ১৩.৭৫ বিলিয়ন বছর\n(গ) কয়েক মিলিয়ন বছর (ঘ) ৪ বছরের চেয়ে বেশি\nউত্তর: ঘ\n৮. সূর্য থেকে এর সবচেয়ে নিকটবর্তী নক্ষত্রের নাম কী?\n(ক) মিল্কিওয়ে (খ) আলফা সেন্টোরি\n(গ) ছায়াপথ (ঘ) আকাশগঙ্গা\nউত্তর: খ\n৯. এক দূরবর্তী নক্ষত্র থেকে অন্য দূরবর্তী নক্ষত্রে আলোর পৌঁছাতে সময় লাগতে পারে কতদিন?\n(ক) ৮ মিনিট (খ) ৪ বছর\n(গ) কয়েক মিলিয়ন বছর (ঘ) ১৩.৭৫ কোটি বছর\nউত্তর: গ\n১০. নক্ষত্রগুলো প্রত্যেকটি কীসের এক একটি পিণ্ড?\n(ক) কঠিন শিলার পিণ্ড (খ) বরফের পিণ্ড\n(গ) জ্বলন্ত গ্যাসপিণ্ড (ঘ) তরল শিলার পিণ্ড\nউত্তর: গ\n১১. মহাবিশ্বের নক্ষত্রগুলোকে কীসের তীব্রতা অনুসারে বিভিন্ন বর্ণে ভাগ করা হয়েছে?\n(ক) আকারের (খ) আলোর\n(গ) দূরত্বের (ঘ) ভরের\nউত্তর: খ\n১২. অতি বৃহৎ নক্ষত্রের রং কেমন হয়ে থাকে?\n(ক) লাল (খ) হলুদ\n(গ) নীল (ঘ) সাদা\nউত্তর: ক\n১৩. মাঝারি নক্ষত্রের রং কেমন হয়ে থাকে?\n(ক) লাল (খ) হলুদ\n(গ) নীল (ঘ) সবুজ\nউত্তর: খ\n১৪. ছোট নক্ষত্রের রং কেমন হয়ে থাকে?\n(ক) লাল (খ) হলুদ\n(গ) নীল (ঘ) বেগুনি\nউত্তর: গ\n১৫. মহাবিশ্বের উৎপত্তি ও বিকাশ সংক্রান্ত তত্ত্বগুলোর মধ্যে সবচেয়ে বহুল প্রচলিত তত্ত্ব কোনটি?\n(ক) গ্যালাক্সি তত্ত্ব\n(খ) সৌর তত্ত্ব\n(গ) স্থির অবস্থা তত্ত্ব \n(ঘ) বিগ ব্যাং তত্ত্ব বা মহাবিস্ফোরণ তত্ত্ব\nউত্তর: ঘ\n১৬. বিগ ব্যাং তত্ত্ব মতে, মহাবিশ্ব শুরুতে অত্যন্ত উত্তপ্ত ও কী অবস্থায় ছিল?\n(ক) একক বিন্দুতে অসীম ঘনত্বের  \n(খ) গ্যাসীয় ও হালকা\n(গ) শীতল ও কঠিন (ঘ) বিশালাকার গ্যালাক্সি\nউত্তর: ক\n১৭. বিগ ব্যাং বা মহাবিস্ফোরণ সংঘটিত হয়েছিল প্রায় কত বছর পূর্বে?\n(ক) ১৫ কোটি বছর (খ) ৩ লক্ষ বছর\n(গ) ৪ বিলিয়ন বছর (ঘ) ১৩.৭৫ বিলিয়ন বছর\nউত্তর: ঘ\n১৮. ১৩.৭৫ বিলিয়ন বছর বা কত কোটি বছরপূর্বে বিগ ব্যাং ঘটেছিল?\n(ক) ১৩৭৫ কোটি বছর (খ) ১৫ কোটি বছর\n(গ) ৪ কোটি বছর (ঘ) ৩০০ কোটি বছর\nউত্তর: ক\n১৯. বিগ ব্যাং তত্ত্বের পক্ষে সমর্থন ব্যক্ত করেছেন বর্তমান কালের কোন বিখ্যাত পদার্থবিজ্ঞানী?\n(ক) আইজ্যাক নিউটন (খ) স্টিফেন হকিং\n(গ) আলবার্ট আইনস্টাইন (ঘ) গ্যালিলিও\nউত্তর: খ"},{"id":"block_1793983583880b13nq","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২০. মহাবিশ্ব ও গ্যালাক্সি সম্পর্কিত সত্য তথ্য হলো—\ni. অতি ক্ষুদ্র পোকামাকড় ও ধূলিকণা থেকে শুরু করে দূর-দূরান্তের গ্যালাক্সি নিয়ে মহাবিশ্ব গঠিত\nii. যেসব অংশে বস্তু বা পদার্থ বেশি জড়ো বা ঘনীভূত হয়েছে সেগুলোকে গ্যালাক্সি বা নক্ষত্রজগৎ বলে\niii. আমাদের বাসভূমি পৃথিবী 'মিল্কিওয়ে' বা 'ছায়াপথ' নামক গ্যালাক্সিতে অবস্থিত\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২১. মহাজাগতিক দূরত্ব সংক্রান্ত তথ্যগুলো লক্ষ করো—\ni. আলো এক সেকেন্ডে প্রায় $3$ লক্ষ কিলোমিটার পথ অতিক্রম করে\nii. পৃথিবী থেকে সূর্যের দূরত্ব প্রায় $15$ কোটি কিলোমিটার\niii. সূর্য থেকে পৃথিবীতে আলো আসতে সময় লাগে প্রায় $8$ মিনিট $20$ সেকেন্ড\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২২. নক্ষত্র ও এর দূরত্ব সম্পর্কিত তথ্য হলো—\ni. সূর্য থেকে এর নিকটবর্তী নক্ষত্র আলফা সেন্টোরিতে আলো পৌঁছাতে $4$ বছরের বেশি সময় লাগে\nii. এক দূরবর্তী নক্ষত্র থেকে অন্য দূরবর্তী নক্ষত্রে আলোর পৌঁছাতে কয়েক মিলিয়ন বছর লাগতে পারে\niii. নক্ষত্রগুলো গ্যালাক্সিতে পরস্পর খুব কাছাকাছি অবস্থান করে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৩. নক্ষত্রের বৈশিষ্ট্য ও বর্ণ সংক্রান্ত তথ্য—\ni. নক্ষত্রগুলো প্রত্যেকটি এক একটি জ্বলন্ত গ্যাসপিণ্ড এবং এদের আলো ও উত্তাপ আছে\nii. অতি বৃহৎ নক্ষত্রের রং লাল এবং মাঝারি নক্ষত্রের রং হলুদ\niii. ছোট নক্ষত্রের রং নীল হয়ে থাকে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৪. মহাবিশ্বের উৎপত্তি সংক্রান্ত 'বিগ ব্যাং' বা 'মহাবিস্ফোরণ' তত্ত্বের বিষয়সমূহ—\ni. বিগ ব্যাং তত্ত্ব মতে মহাবিশ্ব শুরুতে একক বিন্দুতে অসীম ঘনত্বের ($Infinitely\\ dense$) অবস্থায় ছিল\nii. দ্রুত প্রসারণের ফলে মহাবিশ্ব ঠান্ডা হয়ে বর্তমান প্রসারমাণ অবস্থায় পৌঁছায়\niii. বিগ ব্যাং বা মহাবিস্ফোরণ সংঘটিত হয়েছিল প্রায় $13.75$ বিলিয়ন ($1375$ কোটি) বছর পূর্বে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1793983620730r7mhn","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৫ ও ২৬) নং প্রশ্নের উত্তর দাও:   </b>\nরাফসান মহাকাশ সম্পর্কিত একটি বই পড়ার সময় জানতে পারল, আকাশে মিটমিট করে জ্বলতে থাকা নক্ষত্রগুলো প্রকৃতপক্ষে এক একটি বিশাল জ্বলন্ত গ্যাসপিণ্ড। এদের আলোর তীব্রতা ও আকার অনুযায়ী বর্ণ ভিন্ন ভিন্ন হয়। কোনোটির রং লাল, কোনোটির হলুদ আবার কোনোটির রং নীল।\n২৫. উদ্দীপকে উল্লেখিত মাঝারি আকারের নক্ষত্রের রং কেমন হয়ে থাকে?\n(ক) লাল (খ) হলুদ\n(গ) নীল (ঘ) সাদা\nউত্তর: খ\n২৬. উদ্দীপকের অতি বৃহৎ ও ছোট নক্ষত্রগুলোর ক্ষেত্রে প্রযোজ্য—\ni. অতি বৃহৎ নক্ষত্রের রং লাল\nii. ছোট নক্ষত্রের রং নীল\niii. নক্ষত্রগুলোর নিজস্ব আলো ও উত্তাপ নেই\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (২৭ ও ২৮) নং প্রশ্নের উত্তর দাও:   </b> \nবিজ্ঞান ক্লাসে শিক্ষক বললেন, আলো এক সেকেন্ডে প্রায় $3$ লক্ষ কিলোমিটার পথ অতিক্রম করে। সূর্য থেকে পৃথিবীতে আলো আসতে কিছুটা সময় লাগলেও, সূর্য থেকে এর নিকটবর্তী নক্ষত্রে আলো পৌঁছাতে কয়েক বছর লেগে যায়।\n২৭. সূর্য থেকে পৃথিবীতে আলো আসতে প্রায় কত সময় লাগে?\n(ক) $8$ সেকেন্ড (খ) $8$ মিনিট $20$ সেকেন্ড\n(গ) $4$ বছর (ঘ) $13.75$ মিনিট\nউত্তর: খ\n২৮. সূর্য থেকে এর সবচেয়ে নিকটবর্তী নক্ষত্র আলফা সেন্টোরিতে আলো পৌঁছাতে কত সময় লাগে?\n(ক) $8$ মিনিট $20$ সেকেন্ড \n(খ) $4$ বছরের চেয়ে বেশি\n(গ) কয়েক মিলিয়ন বছর \n(ঘ) $13.75$ বিলিয়ন বছর\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>\nপদার্থবিজ্ঞানী স্টিফেন হকিং মহাবিশ্বের সৃষ্টি ও বিকাশ সংক্রান্ত একটি বিশেষ বৈজ্ঞানিক তত্ত্বকে সমর্থন করেন। এই তত্ত্ব মতে, মহাবিশ্ব একসময় অতি উত্তপ্ত ও অসীম ঘনত্বের বিন্দু অবস্থায় ছিল, যা পরবর্তীতে দ্রুত প্রসারিত ও শীতল হতে শুরু করে।\n২৯. উদ্দীপকে নির্দেশিত মহাবিশ্বের উৎপত্তি সংক্রান্ত সবচেয়ে বহুল প্রচলিত তত্ত্বটির নাম কী?\n(ক) স্থির অবস্থা তত্ত্ব (খ) সৌরজগৎ তত্ত্ব\n(গ) বিগ ব্যাং বা মহাবিস্ফোরণ তত্ত্ব \n(ঘ) গ্যালাক্সি সৃষ্টি তত্ত্ব\nউত্তর: গ\n৩০. উদ্দীপকে উল্লিখিত ঘটনাটি আজ থেকে প্রায় কত বছর পূর্বে সংঘটিত হয়েছিল?\n(ক) $15$ কোটি বছর (খ) $13.75$ বিলিয়ন বছর\n(গ) $4$ বিলিয়ন বছর (ঘ) $3$ লক্ষ বছর\nউত্তর: খ\n<b> নিচের চিত্রের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1793983642935p03yk","type":"image","value":"https://i.postimg.cc/jqFKvyWh/IMG-20261101-172913.jpg"},{"id":"block_17939836855017kevn","type":"text","value":"৩১. চিত্রটিতে মহাবিশ্বের উৎপত্তি সংক্রান্ত কোন বহুল প্রচলিত তত্ত্বকে ইঙ্গিত করা হয়েছে?\n(ক) স্থির অবস্থা তত্ত্ব \n(খ) বিগ ব্যাং বা মহাবিস্ফোরণ তত্ত্ব\n(গ) সৌরজগৎ সৃষ্টি তত্ত্ব (ঘ) ছায়াপথ তত্ত্ব\nউত্তর: খ\n৩২. চিত্রে প্রদর্শিত তত্ত্ব মতে, বিস্ফোরণের পূর্বে মহাবিশ্ব কেমন অবস্থায় ছিল?\n(ক) অত্যন্ত শীতল ও কঠিন \n(খ) একক বিন্দুতে অসীম ঘনত্বের \n(গ) বিশালাকার শীতল গ্যাসীয় মেঘ \n(ঘ) শুন্য ও হালকা\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (১৫ ও ১৬) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1793983694071q03lk","type":"image","value":"https://i.postimg.cc/3wsfdJW3/IMG-20261101-175156.jpg"},{"id":"block_179398372648370adx","type":"text","value":"৩৩. চিত্রে সূর্য থেকে পৃথিবীতে আলো পৌঁছাতে কত সময় লাগবে?\n(ক) $8$ সেকেন্ড (খ) $8$ মিনিট $20$ সেকেন্ড\n(গ) $4$ বছর (ঘ) $13.75$ মিনিট\nউত্তর: খ\n৩৪. চিত্রে প্রদর্শিত সূর্য থেকে $4$ বছরেরও বেশি দূরে অবস্থিত নিকটবর্তী নক্ষত্রটির নাম কী?\n(ক) আলফা সেন্টোরি (খ) এন্ড্রোমেডা\n(গ) মিল্কিওয়ে (ঘ) গ্যালাক্সি\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1793983766611yawa6","type":"image","value":"https://i.postimg.cc/tgNnVB4N/IMG-20261101-175757.jpg"},{"id":"block_17939837739808bhbj","type":"text","value":"৩৫. চিত্রে প্রদর্শিত 'B' চিহ্নিত মাঝারি নক্ষত্রটির বর্ণ হলুদ হলে, আমাদের সূর্য কোন নক্ষত্রের অন্তর্ভুক্ত?\n(ক) A চিহ্নিত লাল নক্ষত্র (খ) B চিহ্নিত হলুদ নক্ষত্র\n(গ) C চিহ্নিত নীল নক্ষত্র (ঘ) কোনটিই নয়\nউত্তর: খ\n৩৬. উদ্দীপকের চিত্র বিশ্লেষণ করলে দেখা যায়, নক্ষত্রের বর্ণ বা রং কিসের ওপর নির্ভর করে?\n(ক) নক্ষত্রের আলোর তীব্রতা ও আকারের ওপর \n(খ) নক্ষত্রটির দূরত্বের ওপর\n(গ) নক্ষত্রটির গতির ওপর (ঘ) নক্ষত্রের বয়সের ওপর\nউত্তর: ক"}]},{"id":"topic_1793983509394e2tk9","title":"পাঠ - (৩)","blocks":[{"id":"block_1793983863122706s0","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. যে গ্যালাক্সি বা ছায়াপথে আমরা বাস করি তার নাম কী?\n(ক) এন্ড্রোমেডা (খ) আকাশ গঙ্গা \n(গ) আলফা সেন্টোরি (ঘ) সৌরজগৎ\nউত্তর: খ\n২. সৌরজগতে সূর্যকে ঘিরে আবর্তনশীল গ্রহের সংখ্যা কয়টি?\n(ক) ৭টি (খ) ৮টি\n(গ) ৯টি (ঘ) ১০টি\nউত্তর: খ\n৩. যেসব বৃহৎ বস্তু সূর্যের চারদিকে ঘোরে তাদের কী বলা হয়?\n(ক) উপগ্রহ (খ) গ্রহ\n(গ) ধূমকেতু (ঘ) নক্ষত্র\nউত্তর: খ\n৪. নিচের কোনটি সূর্যকে ঘিরে আবর্তনশীল আটটি গ্রহের অন্তর্ভুক্ত নয়?\n(ক) বুধ (খ) প্লুটো\n(গ) মঙ্গল (ঘ) নেপচুন\nউত্তর: খ\n৫. যারা গ্রহকে কেন্দ্র করে ঘোরে তাদের কী বলা হয়?\n(ক) গ্রহ (খ) নক্ষত্র\n(গ) উপগ্রহ (ঘ) গ্যালাক্সি\nউত্তর: গ\n৬. পৃথিবীকে কেন্দ্র করে কে ঘুরছে?\n(ক) সূর্য (খ) চাঁদ\n(গ) মঙ্গল (ঘ) বুধ\nউত্তর: খ\n৭. পৃথিবী সূর্যের একটি—\n(ক) উপগ্রহ (খ) নক্ষত্র\n(গ) গ্রহ (ঘ) ধূমকেতু\nউত্তর: গ\n৮. চাঁদ পৃথিবীর একটি—\n(ক) গ্রহ (খ) উপগ্রহ\n(গ) নক্ষত্র (ঘ) গ্যালাক্সি\nউত্তর: খ\n৯. জ্যোতির্বিজ্ঞানীদের ধারণা অনুযায়ী গ্রহের জন্মের সময় কোনটির কারণে মহাজাগতিক মেঘ ঘনীভূত হয়ে জমাট বাঁধে?\n(ক) কেন্দ্রমুখী বল (খ) মহাকর্ষ বল\n(গ) তড়িৎ বল (ঘ) নিউক্লীয় বল\nউত্তর: খ\n১০. গ্রহের চারপাশে উপাদান জমা হয়ে কিসের সৃষ্টি হয়েছে?\n(ক) নক্ষত্র (খ) কৃত্রিম উপগ্রহ\n(গ) প্রাকৃতিক উপগ্রহ (ঘ) গ্যালাক্সি\nউত্তর: গ\n১১. গ্রহ ও উপগ্রহের কোনটি নেই?\n(ক) আলো ও ভর (খ) আলো ও উত্তাপ\n(গ) আকার ও ভর (ঘ) কোনোটিই নয়\nউত্তর: খ\n১২. গ্রহ ও উপগ্রহের ওপর কার আলো পড়লে তা প্রতিফলিত হয়?\n(ক) সূর্যের (খ) চাঁদের\n(গ) পৃথিবীর (ঘ) নক্ষত্রের\nউত্তর: ক\n১৩. পৃথিবীর প্রাকৃতিক উপগ্রহ কয়টি?\n(ক) ১টি (খ) ২টি\n(গ) ২৭টি (ঘ) ৬২টি\nউত্তর: ক\n১৪. মঙ্গলের প্রাকৃতিক উপগ্রহের সংখ্যা কয়টি?\n(ক) ১টি (খ) ২টি\n(গ) ১৪টি (ঘ) ২৭টি\nউত্তর: খ\n১৫. বৃহস্পতির প্রাকৃতিক উপগ্রহ কয়টি?\n(ক) ২৭টি (খ) ৬২টি\n(গ) ৬৭টি (ঘ) ১৪টি\nউত্তর: গ\n১৬. শনির প্রাকৃতিক উপগ্রহের সংখ্যা কয়টি?\n(ক) ৬৭টি (খ) ৬২টি\n(গ) ২৭টি (ঘ) ১৪টি\nউত্তর: খ\n১৭. ইউরেনাসের প্রাকৃতিক উপগ্রহ কতটি?\n(ক) ২৭টি (খ) ১৪টি\n(গ) ৬২টি (ঘ) ৬৭টি\nউত্তর: ক\n১৮. নেপচুনের প্রাকৃতিক উপগ্রহ কয়টি?\n(ক) ২৭টি (খ) ১৪টি\n(গ) ৬২টি (ঘ) ২টি\nউত্তর: খ\n১৯. উপগ্রহগুলো কিসের প্রভাবে গ্রহের চারদিকে ঘোরে?\n(ক) কেন্দ্রবিমুখী বল (খ) মাধ্যাকর্ষণ বল\n(গ) চুম্বক বল (ঘ) আলোক চাপ\nউত্তর: খ"},{"id":"block_1793983888217adk4p","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২০. সৌরজগৎ ও এর গ্রহসমূহ সম্পর্কিত তথ্য—\ni. আমাদের সূর্য ও তার পরিবার আকাশ গঙ্গা  নামক ছায়াপথে অবস্থিত\nii. সৌরজগতে সূর্যকে ঘিরে আবর্তনশীল ৮টি গ্রহ রয়েছে\niii. বুধ, শুক্র, পৃথিবী, মঙ্গল, বৃহস্পতি, শনি, ইউরেনাস ও নেপচুন হলো সৌরজগতের ৮টি গ্রহ\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২১. গ্রহ ও উপগ্রহের বৈশিষ্ট্য সংক্রান্ত সত্য তথ্য হলো—\ni. যেসব বৃহৎ বস্তু সূর্যের চারদিকে ঘোরে তাদের গ্রহ বলে\nii. যারা গ্রহকে কেন্দ্র করে ঘোরে তাদের উপগ্রহ বলে\niii. পৃথিবী সূর্যের একটি গ্রহ এবং চাঁদ পৃথিবীর একটি উপগ্রহ\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২২. প্রাকৃতিক গ্রহ ও উপগ্রহের উৎপত্তি এবং ভৌত ধর্ম সম্পর্কিত তথ্য—\ni. মহাকর্ষ বলের কারণে মহাজাগতিক মেঘ ঘনীভূত হয়ে গ্রহ ও উপগ্রহের সৃষ্টি হয়েছে\nii. গ্রহ ও উপগ্রহের নিজস্ব কোনো আলো ও উত্তাপ নেই\niii. এদের ওপর সূর্যের যে আলো পড়ে তা প্রতিফলিত হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৩. সৌরজগতের অভ্যন্তরীণ গ্রহসমূহের প্রাকৃতিক উপগ্রহের সংখ্যা সম্পর্কিত বিষয়—\ni. পৃথিবীর প্রাকৃতিক উপগ্রহ রয়েছে ১টি\nii. মঙ্গলের প্রাকৃতিক উপগ্রহ রয়েছে ২টি\niii. বুধ ও শুক্র গ্রহের নিজস্ব একাধিক প্রাকৃতিক উপগ্রহ রয়েছে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৪. সৌরজগতের দূরবর্তী বৃহৎ গ্রহগুলোর প্রাকৃতিক উপগ্রহ সংক্রান্ত সঠিক তথ্য—\ni. বৃহস্পতির ৬৭টি এবং শনির ৬২টি প্রাকৃতিক উপগ্রহ আছে\nii. ইউরেনাসের ২৭টি এবং নেপচুনের ১৪টি প্রাকৃতিক উপগ্রহ আছে\niii. উপগ্রহগুলো এদের গ্রহের মাধ্যাকর্ষণ বলের প্রভাবে গ্রহের চারদিকে ঘোরে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1793983928241qpokv","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২৫ ও ২৬) নং প্রশ্নের উত্তর দাও:   </b> \nশ্রেণিকক্ষে বিজ্ঞান শিক্ষক বোর্ড চিত্র এঁকে শিক্ষার্থীদের বললেন, \"আমরা যে গ্যালাক্সিতে বাস করি তার একটি পরিবার রয়েছে, যার কেন্দ্রে রয়েছে সূর্য এবং একে ঘিরে নির্দিষ্ট কিছু বৃহৎ বস্তু আবর্তিত হচ্ছে।\" \n২৫. উদ্দীপকে উল্লেখিত সূর্য এবং এর পরিবারকে একত্রে কী বলা হয়? \n(ক) গ্যালাক্সি (খ) সৌরজগৎ \n(গ) মহাশূন্য (ঘ) মহাজাগতিক মেঘ \nউত্তর: খ\n২৬. উদ্দীপকে উল্লেখিত সূর্যকে ঘিরে আবর্তনশীল বৃহৎ বস্তুর সংখ্যা কয়টি? \n(ক) ৭টি (খ) ৮টি \n(গ) ৯টি (ঘ) ১০টি \nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২৭ ও ২৮) নং প্রশ্নের উত্তর দাও:   </b> \nআরিফ তার বন্ধু রাফিকে একটি নির্দিষ্ট স্থানে দাঁড় করিয়ে বড় বৃত্ত আঁকল। তারপর রাফিকে কেন্দ্র করে আরিফ ঘুরতে শুরু করল এবং আরেক বন্ধু সিয়াম আরিফের চারদিকে ঘুরতে লাগল। শিক্ষক বললেন, \"এখানে প্রথম বন্ধু হলো সূর্য, তুমি হলে পৃথিবী এবং দ্বিতীয় বন্ধু হলো অন্য একটি জ্যোতিষ্ক।\" \n২৭. উদ্দীপকের সিয়াম কোন জ্যোতিষ্কের ভূমিকা পালন করছে? \n(ক) গ্রহ (খ) উপগ্রহ \n(গ) নক্ষত্র (ঘ) ধূমকেতু \nউত্তর: খ\n২৮. আরিফ ও সিয়ামকে নিয়ে গঠিত ব্যবস্থার ক্ষেত্রে সত্য কোনটি? \n(ক) উভয়ের নিজস্ব আলো আছে \n(খ) উভয়ের নিজস্ব আলো নেই \n(গ) আরিফের আলো আছে কিন্তু সিয়ামের নেই \n(ঘ) সিয়ামের আলো আছে কিন্তু আরিফের নেই \nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b> \n জ্যোতির্বিজ্ঞানীদের মতে, বহু বছর আগে নক্ষত্রকে ঘিরে ঘূর্ণায়মান মহাজাগতিক মেঘ আকর্ষণের কারণে ঘনীভূত হয়ে জমাট বেঁধে গ্রহ সৃষ্টি হয়। একইভাবে গ্রহের চারপাশে জমা হয়ে কিছু প্রাকৃতিক বস্তু তৈরি হয়। \n২৯. মহাজাগতিক মেঘ ঘনীভূত হতে কোন বল কাজ করেছিল? \n(ক) মহাকর্ষ বল (খ) তড়িৎ বল \n(গ) নিউক্লীয় বল (ঘ) ঘর্ষণ বল \nউত্তর: ক\n৩০. গ্রহের চারপাশে জমা হয়ে সৃষ্টি হওয়া বস্তুলোকে কী বলে? \n(ক) কৃত্রিম উপগ্রহ (খ) প্রাকৃত গ্রহ \n(গ) প্রাকৃতিক উপগ্রহ (ঘ) নক্ষত্রমণ্ডল \nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b> \nসৌরজগতের বিভিন্ন গ্রহের প্রাকৃতিক উপগ্রহের সংখ্যা ভিন্ন ভিন্ন। যেমন— পৃথিবীর ১টি এবং মঙ্গলের ২টি প্রাকৃতিক উপগ্রহ রয়েছে। তবে দুটি বৃহদাকার গ্রহের উপগ্রহের সংখ্যা ষাটটিরও বেশি। \n৩১. উদ্দীপকে উল্লিখিত ষাটটির বেশি উপগ্রহ থাকা গ্রহ দুটি কী কী? \n(ক) ইউরেনাস ও নেপচুন (খ) বৃহস্পতি ও শনি \n(গ) মঙ্গল ও বৃহস্পতি (ঘ) শনি ও ইউরেনাস \nউত্তর: খ\n৩২. বৃহস্পতি ও শনির প্রাকৃতিক উপগ্রহের মোট সংখ্যা কত? \n(ক) ১২৯টি (খ) ১২৭টি \n(গ) ১৩৯টি (ঘ) ১৪৭টি \nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b> \nরাতের আকাশে চাঁদের দিকে তাকিয়ে রহিম চিন্তা করল, চাঁদ কীভাবে আলো দেয়? শিক্ষক তাকে বুঝিয়ে বললেন যে, চাঁদ বা অন্যান্য উপগ্রহগুলোর নিজস্ব কোনো আলো বা উত্তাপ নেই। \n৩৩. উপগ্রহগুলোর ওপর কার আলো পড়ার পর তা প্রতিফলিত হয়? \n(ক) পৃথিবীর (খ) সূর্যের \n(গ) অন্যান্য গ্রহের (ঘ) গ্যালাক্সির \nউত্তর: খ\n৩৪. প্রাকৃতিক উপগ্রহগুলো কোন বলের প্রভাবে গ্রহের চারদিকে ঘোরে? \n(ক) সূর্যের মহাকর্ষ বলের \n(খ) গ্রহের মাধ্যাকর্ষণ বলের \n(গ) বাহ্যিক কোনো বলের \n(ঘ) কেন্দ্রবিমুখী বলের \nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও:   </b> \nসৌরজগতের দূরবর্তী দুটি গ্রহ হলো ইউরেনাস ও নেপচুন। এগুলোরও নিজ নিজ প্রাকৃতিক উপগ্রহ রয়েছে যা এদের পরিভ্রমণ করে। \n৩৫. ইউরেনাসের প্রাকৃতিক উপগ্রহের সংখ্যা কয়টি? \n(ক) ১৪টি (খ) ২৭টি \n(গ) ৬২টি (ঘ) ৬৭টি \nউত্তর: খ\n৩৬. ইউরেনাস ও নেপচুনের মোট প্রাকৃতিক উপগ্রহের সংখ্যা কত? \n(ক) ৪১টি (খ) ৩৯টি \n(গ) ৩৫টি (ঘ) ৪৭টি \nউত্তর: ক\n<b> নিচের চিত্রের আলোকে (৩৭ ও ৩৮) নং প্রশ্নের উত্তর দাও:   </b> "},{"id":"block_17939839918870j11e","type":"image","value":"https://i.postimg.cc/QdmNm4Dg/image-6ce97421.jpg"},{"id":"block_17939840023308to48","type":"text","value":"৩৭. উদ্দীপকেরচিত্রে কেন্দ্রের সূর্য এবং এর চারপাশের ৮টি জ্যোতিষ্ককে নিয়ে গঠিত ব্যবস্থাকে কী বলা হয়?\n(ক) গ্যালাক্সি (খ) সৌরজগৎ\n(গ) নিহারিকা (ঘ) মহাজাগতিক মেঘ\nউত্তর: খ\n৩৮. উদ্দীপকের মডেল অনুযায়ী সূর্যকে ঘিরে আবর্তনশীল গ্রহগুলোর মধ্যে কোনটি পৃথিবীর নিকটতম বাইরের গ্রহ?\n(ক) বুধ (খ) শুক্র\n(গ) মঙ্গল (ঘ) বৃহস্পতি\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৩৯ ও ৪০) নং প্রশ্নের উত্তর দাও:   </b>"},{"id":"block_1793984152797r0vh2","type":"image","value":"https://i.postimg.cc/y8HXcd67/image-5cdab119.jpg"},{"id":"block_1793984185826r1n2g","type":"text","value":"৩৯. উদ্দীপকের চিত্রে 'গ' চিহ্নিত জ্যোতিষ্কটি কোন ধরনের মহাজাগতিক বস্তু?\n(ক) নক্ষত্র (খ) গ্রহ\n(গ) প্রাকৃতিক উপগ্রহ (ঘ) কৃত্রিম উপগ্রহ\nউত্তর: গ\n৪০. উদ্দীপকের চিত্রে 'খ' ও 'গ' উভয় জ্যোতিষ্কের ক্ষেত্রে নিচের কোনটি প্রযোজ্য?\n(ক) এদের নিজস্ব আলো ও উত্তাপ রয়েছে \n(খ) এদের নিজস্ব আলো ও উত্তাপ নেই\n(গ) এরা উভয়েই নক্ষত্রকে ঘিরে ঘোরে \n(ঘ) এরা স্থির জ্যোতিষ্ক\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪১ ও ৪২) নং প্রশ্নের উত্তর দাও:   </b> "},{"id":"block_1793984219768e5dq2","type":"image","value":"https://i.postimg.cc/Qx4hWBJS/image-daf38927.jpg"},{"id":"block_1793984228398khh9f","type":"text","value":"৪১. উদ্দীপকের চিত্রে দৃশ্যমান মহাজাগতিক মেঘ ঘনীভূত হওয়ার মূল কারণ কোনটি?\n(ক) মহাকর্ষ বল (খ) তড়িৎ বল\n(গ) চৌম্বক বল (ঘ) পারমাণবিক বল\nউত্তর: ক\n৪২. চিত্রটিতে ঘনীভূত হয়ে জমাট বাঁধা এসব বস্তু থেকে কী সৃষ্টি হয়?\n(ক) সূর্য ও গ্যালাক্সি (খ) গ্রহ ও উপগ্রহ\n(গ) ধুমকেতু ও উল্কা (ঘ) নক্ষত্রমণ্ডল\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৩ ও ৪৪) নং প্রশ্নের উত্তর দাও:   </b> "},{"id":"block_1793984279591fozss","type":"image","value":"https://i.postimg.cc/nc6gMzV7/image-9ca51cb2.jpg"},{"id":"block_1793984287322o3gqg","type":"text","value":"৪৩. উদ্দীপকের চিত্রে সবচেয়ে বেশি সংখ্যক প্রাকৃতিক উপগ্রহ দেখানো হয়েছে কোন গ্রহটির?\n(ক) শনি (খ) বৃহস্পতি\n(গ) ইউরেনাস (ঘ) নেপচুন\nউত্তর: খ\n৪৪. উদ্দীপকের চিত্র অনুযায়ী নেপচুন অপেক্ষা ইউরেনাসের প্রাকৃতিক উপগ্রহের সংখ্যা কতটি বেশি?\n(ক) ১৩টি (খ) ১৪টি\n(গ) ১৫টি (ঘ) ২৬টি\nউত্তর: ক"}]},{"id":"topic_17939835137416snev","title":"পাঠ - (৪)","blocks":[{"id":"block_1793984341810bepv9","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. মানুষের পাঠানো যেসব বস্তু বা মহাকাশযান পৃথিবীকে কেন্দ্র করে নির্দিষ্ট কক্ষপথে ঘোরে তাদের কী বলা হয়?\n(ক) প্রাকৃতিক উপগ্রহ (খ) কৃত্রিম উপগ্রহ\n(গ) মহাকাশযান (ঘ) ধূমকেতু\nউত্তর: খ\n২. কৃত্রিম উপগ্রহ মহাশূন্যে উৎক্ষেপণ করা হয় কিসের সাহায্যে?\n(ক) বিমানের সাহায্যে (খ) রকেটের সাহায্যে\n(গ) বেলুনের সাহায্যে (ঘ) মহাকাশ স্টেশনের সাহায্যে\nউত্তর: খ\n৩. কৃত্রিম উপগ্রহ কার প্রভাবে তার নিজস্ব কক্ষপথে ঘোরে?\n(ক) সূর্যের মাধ্যাকর্ষণ বলের \n(খ) চাঁদের অভিকর্ষ বলের\n(গ) পৃথিবীর মাধ্যাকর্ষণ বা অভিকর্ষ বলের \n(ঘ) কৃত্রিম চুম্বক বলের\nউত্তর: গ\n৪. চাঁদের তুলনায় কৃত্রিম উপগ্রহের আকার কেমন এবং এটি কোথা দিয়ে ঘোরে?\n(ক) অনেক বড় ও উঁচুতে \n(খ) অনেক ছোট ও নিচু দিয়ে\n(গ) সমান ও সমান উচ্চতায় \n(ঘ) অনেক ছোট ও অনেক উঁচুতে\nউত্তর: খ\n৫. পৃথিবী থেকে কৃত্রিম উপগ্রহের উচ্চতা বেশি হলে এর দ্রুতি কেমন হবে?\n(ক) তত বেশি হবে (খ) শূন্য হবে\n(গ) অপরিবর্তিত থাকবে (ঘ) তত কম হবে\nউত্তর: ঘ\n৬. পৃথিবী থেকে কৃত্রিম উপগ্রহের উচ্চতা বেশি হলে পৃথিবীকে প্রদক্ষিণ করতে এর কেমন সময় লাগবে?\n(কম) কম সময় লাগবে (খ) বেশি সময় লাগবে\n(গ) সমান সময় লাগবে (ঘ) সময় লাগবে না\nউত্তর: খ\n৭. পৃথিবী তার নিজ অক্ষের চারপাশে একবার পাক খেতে কত সময় নেয়?\n(ক) ১২ ঘণ্টায় (খ) ২৪ ঘণ্টায়\n(গ) ৪৮ ঘণ্টায় (ঘ) ৩৬ ঘণ্টায়\nউত্তর: খ\n৮. কোনো কৃত্রিম উপগ্রহ কত সময়ে পৃথিবীর চারদিকে একবার ঘুরে এলে তাকে পৃথিবী থেকে স্থির বলে মনে হবে?\n(ক) ১২ ঘণ্টায় (খ) ৪৮ ঘণ্টায়\n(গ) ২৪ ঘণ্টায় (ঘ) ৩৬ ঘণ্টায়\nউত্তর: গ\n৯. মহাকাশযাত্রার প্রথম পদক্ষেপটির সূচনা হয়েছিল কত সালে?\n(ক) ১৯৫৭ সালের ৮ই অক্টোবর \n(খ) ১৯৫৮ সালের ২রা ফেব্রুয়ারি\n(গ) ১৯৬১ সালের ১২ই এপ্রিল (ঘ) ১৯৬৩ সালে\nউত্তর: ক\n১০. মহাকাশযাত্রার প্রথম পদক্ষেপ হিসেবে কোন দেশ কৃত্রিম উপগ্রহ মহাকাশে উৎক্ষেপণ করেছিল?\n(ক) মার্কিন যুক্তরাষ্ট্র \n(খ) তৎকালীন সোভিয়েত ইউনিয়ন\n(গ) চীন (ঘ) ফ্রান্স\nউত্তর: খ\n১১. তৎকালীন সোভিয়েত ইউনিয়ন কর্তৃক মহাকাশে উৎক্ষেপিত প্রথম কৃত্রিম উপগ্রহের নাম কী?\n(ক) স্পুটনিক-১ (খ) স্পুটনিক-২\n(গ) এক্সপ্লোরার-১ (ঘ) ভস্টক-১\nউত্তর: ক\n১২. 'স্পুটনিক' শব্দের অর্থ কী?\n(ক) মহাকাশচারী (খ) ধূমকেতু\n(গ) কৃত্রিম যন্ত্র (ঘ) ভ্রমণসঙ্গী বা সহযাত্রী\nউত্তর: ঘ\n১৩. স্পুটনিক-২ কবে মহাকাশে পাঠানো হয়?\n(ক) ১৯৫৭ সালের ৮ই অক্টোবর \n(খ) ১৯৫৭ সালের ২রা নভেম্বর\n(গ) ১৯৫৮ সালের ২রা ফেব্রুয়ারি \n(ঘ) ১৯৬১ সালের ১২ই এপ্রিল\nউত্তর: খ\n১৪. প্রথম মার্কিন কৃত্রিম উপগ্রহের নাম কী?\n(ক) স্পুটনিক-১ (খ) ল্যান্ডসেট-১\n(গ) ভস্টক-১ (ঘ) এক জ টেস্ট প্রজেক্ট পাঠানো হয় ১৯৭৫ সালে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: গ\n৩৪. বর্তমান কৃত্রিম উপগ্রহের পরিস্থিতি হলো—\ni. হাজার হাজার কৃত্রিম উপগ্রহ মহাকাশে পাঠানো হয়েছে\nii. বর্তমানে পাঠানো সমস্ত উপগ্রহই সচল রয়েছে\niii. হাজার হাজার অব্যবহৃত কৃত্রিম উপগ্রহ বা অংশবিশেষ মহাকাশে ধ্বংসাবশেষ হিসেবে ঘুরছে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ"},{"id":"block_179398440940564kzn","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও:   </b> \nরাফি একটি বিজ্ঞানের বইয়ে দেখল যে রকেটের সাহায্যে মানুষের তৈরি কিছু মহাকাশযান নির্দিষ্ট কক্ষপথে পৃথিবীকে প্রদক্ষিণ করছে। কৃত্রিম উপগ্রহ নামের এসব যান চাঁদের তুলনায় ছোট হলেও পৃথিবীর মাধ্যাকর্ষণ বলের প্রভাবে ঘুরছে।\n৩৫. কৃত্রিম উপগ্রহের উচ্চতা বেশি হলে এর দ্রুতির কী পরিবর্তন ঘটে?\n(ক) দ্রুতি বাড়ে (খ) দ্রুতি শূন্য হয়\n(গ) দ্রুতি একই থাকে (ঘ) দ্রুতি কমে\nউত্তর: ঘ\n৩৬. কোনো কৃত্রিম উপগ্রহকে পৃথিবী থেকে স্থির বলে মনে হওয়ার কারণ এটি পৃথিবীর চারদিকে একবার ঘুরে আসে—\n(ক) ১২ ঘণ্টায় (খ) ২৪ ঘণ্টায়\n(গ) ৪৮ ঘণ্টায় (ঘ) ৩৬ ঘণ্টায়\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৭ ও ৩৮) নং প্রশ্নের উত্তর দাও:   </b> \n১৯৫৭ সালের ৮ই অক্টোবর তৎকালীন সোভিয়েত ইউনিয়ন 'স্পুটনিক-১' নামের কৃত্রিম উপগ্রহ উৎক্ষেপণের মাধ্যমে মহাকাশযাত্রার সূচনা করে। পরবর্তী সময়ে মার্কিন যুক্তরাষ্ট্রও তাদের প্রথম কৃত্রিম উপগ্রহ উৎক্ষেপণ করে।\n৩৭. 'স্পুটনিক' শব্দের অর্থ কী?\n(ক) মহাকাশচারী (খ) ভ্রমণসঙ্গী বা সহযাত্রী\n(গ) কৃত্রিম যন্ত্র (ঘ) ধূমকেতু\nউত্তর: খ\n৩৮. মার্কিন যুক্তরাষ্ট্র প্রেরিত প্রথম কৃত্রিম উপগ্রহের নাম কী?\n(ক) স্পুটনিক-২ (খ) ল্যান্ডসেট-১\n(গ) ভস্টক-১ (ঘ) এক্সপ্লোরার-১\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (৩৯ ও ৪০) নং প্রশ্নের উত্তর দাও:   </b> \nমহাকাশযাত্রার ইতিহাসে মানববাহী মিশন ছিল এক অনন্য বিপ্লব। সোভিয়েত ইউনিয়ন ভস্টক-১ এবং ভস্টক-৬ নামক দুটি মহাকাশযানের মাধ্যমে প্রথম মানব ও প্রথম নারীকে মহাকাশে পাঠায়।\n৩৯. ভস্টক-১ কৃত্রিম উপগ্রহে চড়ে প্রথম কোন মানুষ মহাকাশে যান?\n(ক) ইউরি গ্যাগারিন (খ) ভেসেনটিনা তেরেসকোভা\n(গ) নিল আর্মস্ট্রং (ঘ) এডউইন অলড্রিন\nউত্তর: ক\n৪০. প্রথম নারী মহাকাশচারী ভেসেনটিনা তেরেসকোভা কত সালে মহাকাশে ঘুরে আসেন?\n(ক) ১৯৬১ সালে (খ) ১৯৬৩ সালে\n(গ) ১৯৭২ সালে (ঘ) ১৯৭৫ সালে\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪১ ও ৪২) নং প্রশ্নের উত্তর দাও:   </b> \nবিজ্ঞানের অগ্রগতির সাথে সাথে মানবকল্যাণে নানা ধরণের উপগ্রহ পাঠানো হয়। এর মধ্যে যোগাযোগের জন্য ইন্টেলস্যাট-১ এবং দূর অনুধাবনের জন্য ল্যান্ডসেট-১ কৃত্রিম উপগ্রহ মহাকাশে পাঠানো হয়।\n৪১. রিমোটসেনসিং বা দূর অনুধাবনের জন্য পাঠানো প্রথম উপগ্রহ ল্যান্ডসেট-১ কত সালে পাঠানো হয়?\n(ক) ১৯৬৩ সালে (খ) ১৯৭২ সালে\n(গ) ১৯৭৫ সালে (ঘ) ১৯৫৮ সালে\nউত্তর: খ\n৪২. আন্তর্জাতিক যুগসূত্র স্থাপনের জন্য ১৯৭৫ সালে প্রেরিত কৃত্রিম উপগ্রহটির নাম কী?\n(ক) এক্সপ্লোরার-১\n(খ) ইন্টেলস্যাট-১\n(গ) অ্যাপোলো-সয়োজ টেস্ট প্রজেক্ট \n(ঘ) স্পুটনিক-১\nউত্তর: গ"}]},{"id":"topic_1793984466506i5iv2","title":"পাঠ - (৫)","blocks":[{"id":"block_1793984501462dbk4y","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. পৃথিবীর চারদিকে ঘোরার জন্য কোন বল বা টানের প্রয়োজন হয়?\n(ক) কেন্দ্রবিমুখী বল (খ) কেন্দ্রমুখী বল\n(গ) ঘর্ষণ বল (ঘ) চৌম্বক বল\nউত্তর: খ\n২. কৃত্রিম উপগ্রহের ওপর পৃথিবীর আকর্ষণ বল বা কোন বল কেন্দ্রমুখী বল যোগায়?\n(ক) মহাকর্ষ বল (খ) নিউক্লীয় বল\n(গ) তড়িৎ বল (ঘ) অভিকর্ষ বল\nউত্তর: ঘ\n৩. কোনো কৃত্রিম উপগ্রহকে পৃথিবী পৃষ্ঠ থেকে প্রায় কত কিলোমিটার উপরে তোলা হয়?\n(ক) ২৫০ কিলোমিটার (খ) ৩৫০ কিলোমিটার\n(গ) ১৫০ কিলোমিটার (ঘ) ৪৫০ কিলোমিটার\nউত্তর: ক\n৪. কৃত্রিম উপগ্রহকে পৃথিবীর প্রায় ২৫০ কিলোমিটার উপরে তুলে পৃথিবী পৃষ্ঠের সমান্তরালে প্রতি সেকেন্ডে কত বেগ দিতে হয়?\n(ক) প্রায় ৫ কিলোমিটার (খ) প্রায় ১০ কিলোমিটার\n(গ) প্রায় ৮ কিলোমিটার (ঘ) প্রায় ১২ কিলোমিটার\nউত্তর: গ\n৫. বায়ুস্তরের সাথে তীব্র সংঘর্ষে কী উৎপন্ন হয়?\n(ক) আলো (খ) চাপ\n(গ) বিদ্যুৎ (ঘ) তাপ\nউত্তর: ঘ\n৬. বায়ুস্তরের সাথে তীব্র সংঘর্ষে প্রচুর তাপ উৎপন্ন হলে বস্তুর কী অবস্থা ঘটে?\n(ক) গলে তরল হয়ে যায় (খ) পুড়ে ছাই হয়ে যায়\n(গ) জমাট বেঁধে যায় (ঘ) ভেঙে টুকরো হয়\nউত্তর: খ\n৭. কৃত্রিম উপগ্রহকে নির্দিষ্ট উচ্চতায় তুলতে কিসের সাহায্য নেওয়া হয়?\n(ক) বিমানের (খ) বেলুনের\n(গ) একাধিক রকেটের (ঘ) কৃত্রিম উপগ্রহের\nউত্তর: গ\n৮. ভূপৃষ্ঠের সমান্তরালে প্রয়োজনীয় বেগ দেওয়ার পর কৃত্রিম উপগ্রহ কোথায় ঘুরতে থাকে?\n(ক) মহাশূন্যের বাইরে (খ) পৃথিবীর চারপাশে\n(গ) চাঁদের চারপাশে (ঘ) সূর্যের চারপাশে\nউত্তর: খ\n৯. আবর্তন সংক্রান্ত কাজের জন্য টেনিস বলটি কত মিটার লম্বা সুতার এক মাথায় বাঁধা হয়েছিল?\n(ক) প্রায় ১ মিটার (খ) প্রায় ২ মিটার\n(গ) প্রায় ৩ মিটার (ঘ) প্রায় ৪ মিটার\nউত্তর: ক\n১০. সুতার এক মাথা শক্ত করে ধরে বলটি কীভাবে ছুড়ে দেওয়া হয়েছিল?\n(ক) ভূপৃষ্ঠের লম্বভাবে (খ) কৌণিকভাবে\n(গ) ভূপৃষ্ঠের সমান্তরালে (ঘ) নিচের দিকে\nউত্তর: গ\n১১. কাজের পর্যবেক্ষণ অনুযায়ী কৃত্রিম উপগ্রহের ক্ষেত্রে পরীক্ষা প্রদানকারী ব্যক্তি কার ভূমিকা পালন করে?\n(ক) সূর্য (খ) পৃথিবী\n(গ) চাঁদ (ঘ) কৃত্রিম উপগ্রহ\nউত্তর: খ\n১২. সুতায় বাঁধা ঘোরানো বলটি কার ভূমিকা পালন করে?\n(ক) সূর্য (খ) পৃথিবী\n(গ) কৃত্রিম উপগ্রহ (ঘ) নক্ষত্র\nউত্তর: গ\n১৩. কাজের মধ্যে সুতার টান কিসের সাথে তুলনা করা হয়েছে?\n(ক) মহাকর্ষ বল (খ) অভিকর্ষ বল\n(গ) ঘর্ষণ বল (ঘ) কেন্দ্রবিমুখী বল\nউত্তর: খ\n১৪. টেনিস বলটি সুতার টানে যে পথে ঘোরে তাকে কী বলা হয়েছে?\n(ক) গ্যালাক্সি (খ) নক্ষত্রপথ\n(গ) কৃত্রিম উপগ্রহের কক্ষপথ (ঘ) উপবৃত্তাকার পথ\nউত্তর: গ"},{"id":"block_1793984537732ncwjk","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n১৫. কৃত্রিম উপগ্রহের গতি ও বল সম্পর্কিত তথ্য—\ni. পৃথিবীর চারদিকে ঘোরার জন্য কেন্দ্রমুখী বল বা টানের প্রয়োজন হয়\nii. কৃত্রিম উপগ্রহের ওপর পৃথিবীর আকর্ষণ বল কেন্দ্রমুখী বল জোগায়\niii. কৃত্রিম উপগ্রহকে পৃথিবী পৃষ্ঠের সমান্তরালে প্রতি সেকেন্ডে প্রায় ৫ কিলোমিটার বেগ দিতে হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n১৬. কৃত্রিম উপগ্রহ উৎক্ষেপণ ও বেগ সম্পর্কিত তথ্য—\ni. কৃত্রিম উপগ্রহকে পৃথিবীর প্রায় ২৫০ কিলোমিটার উপরে তোলা হয়\nii. বায়ুমণ্ডলের সাথে তীব্র সংঘর্ষে প্রচুর তাপ উৎপন্ন হতে পারে\niii. একাধিক রকেটের সাহায্যে কৃত্রিম উপগ্রহকে নির্দিষ্ট উচ্চতায় তোলা হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n১৭. কৃত্রিম উপগ্রহের কক্ষপথ ও বায়ুমণ্ডলীয় সংঘর্ষ—\ni. বায়ুস্তরের সাথে তীব্র সংঘর্ষে বস্তু পুড়ে ছাই হয়ে যেতে পারে\nii. ভূপৃষ্ঠের সমান্তরালে প্রতি সেকেন্ডে প্রায় ৮ কিলোমিটার বেগ দিতে হয়\niii. কৃত্রিম উপগ্রহকে প্রথমে নির্দিষ্ট উচ্চতায় তুলে পরে লম্বভাবে বেগ দেওয়া হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: গ\n১৮. কৃত্রিম উপগ্রহের আবর্তন সংক্রান্ত কাজের ক্ষেত্রে প্রযোজ্য—\ni. টেনিস বলটিকে প্রায় ১ মিটার লম্বা সুতার এক মাথায় বাঁধা হয়\nii. বলটিকে ভূপৃষ্ঠের সমান্তরালে ছুড়ে দেওয়া হয়\niii. এখানে বলটি পৃথিবীর ভূমিকা পালন করে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n১৯. কৃত্রিম উপগ্রহের আবর্তন প্রমাণের কাজের সাথে তুলনাসমূহ—\ni. সুতার টান হলো অভিকর্ষ বলের অনুরূপ\nii. কাজটিতে সুতার দৈর্ঘ্য প্রায় ২ মিটার রাখা হয়\niii. বৃত্তাকার পথটি হলো কৃত্রিম উপগ্রহের কক্ষপথ\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n২০. কৃত্রিম উপগ্রহের কক্ষপথে চলাচলের শর্তসমূহ—\ni. কৃত্রিম উপগ্রহকে নির্দিষ্ট উচ্চতায় তোলার জন্য একাধিক রকেট ব্যবহার করা হয়\nii. ভূপৃষ্ঠের সমান্তরালে প্রয়োজনীয় বেগ পেলে কৃত্রিম উপগ্রহ চারপাশে ঘুরতে থাকে\niii. উপগ্রহের ঘূর্ণনের জন্য চাঁদের আকর্ষণ বল কেন্দ্রমুখী বল জোগায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_17939845676511zycr","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (২১ ও ২২) নং প্রশ্নের উত্তর দাও:   </b>\nবিজ্ঞান শিক্ষক শ্রেণিকক্ষে কৃত্রিম উপগ্রহ উৎক্ষেপণের কৌশল পড়াচ্ছিলেন। তিনি বললেন, একটি উপগ্রহকে পৃথিবী পৃষ্ঠ থেকে ২৫০ কিলোমিটার উপরে তুলে নির্দিষ্ট বেগে অনুভূমিকভাবে পাঠালে তা পৃথিবীর চারপাশে ঘুরতে থাকে।\n২১. কৃত্রিম উপগ্রহকে ২৫০ কিলোমিটার উপরে তুলে প্রতি সেকেন্ডে কত বেগ দেওয়া প্রয়োজন?\n(ক) প্রায় ৫ কিলোমিটার (খ) প্রায় ৮ কিলোমিটার\n(গ) প্রায় ১০ কিলোমিটার (ঘ) প্রায় ১২ কিলোমিটার\nউত্তর: খ\n২২. কৃত্রিম উপগ্রহের ওপর পৃথিবীর কোন বল কেন্দ্রমুখী বল যোগায়?\n(ক) মহাকর্ষ বল (খ) নিউক্লীয় বল\n(গ) তড়িৎ বল (ঘ) অভিকর্ষ বল\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (২৩ ও ২৪) নং প্রশ্নের উত্তর দাও:   </b>\nসাজিদ পরীক্ষা করার জন্য ১ মিটার লম্বা একটি সুতার এক মাথায় টেনিস বল বেঁধে হাতের সাহায্যে ঘুরতে শুরু করল। এতে বলটি সুতার টানে বৃত্তাকার পথে ঘুরতে লাগল।\n২৩. সাজিদের সম্পাদিত কাজটিতে সুতার টান কিসের নির্দেশক?\n(ক) মহাকর্ষ বল (খ) অভিকর্ষ বল\n(গ) কেন্দ্রবিমুখী বল (ঘ) ঘর্ষণ বল\nউত্তর: খ\n২৪. উক্ত পরীক্ষায় ঘূর্ণায়মান টেনিস বলটি কোনটির সাথে তুলনীয়?\n(ক) সূর্য (খ) পৃথিবী\n(গ) কৃত্রিম উপগ্রহ (ঘ) গ্যালাক্সি\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (২৫ ও ২৬) নং প্রশ্নের উত্তর দাও:   </b>\nকৃত্রিম উপগ্রহকে সরাসরি উচ্চ বেগে বায়ুমণ্ডলের মধ্য দিয়ে উৎক্ষেপণ করলে প্রচুর তাপ উৎপন্ন হয়ে তা পুড়ে যাওয়ার আশঙ্কা থাকে। তাই একাধিক রকেটের সাহায্যে প্রথমে একে নির্দিষ্ট উচ্চতায় তোলা হয়।\n২৫. বায়ুস্তরের সাথে তীব্র সংঘর্ষের ফলে বস্তুটি পুড়ে ছাই হওয়ার মূল কারণ কোনটি?\n(ক) আলোর উপস্থিতি (খ) উচ্চ চাপ\n(গ) তীব্র তাপ সৃষ্টি (ঘ) শব্দ তরঙ্গ\nউত্তর: গ\n২৬. কৃত্রিম উপগ্রহকে নির্দিষ্ট উচ্চতায় তোলার পর কীভাবে প্রয়োজনীয় বেগ দেওয়া হয়?\n(ক) ভূপৃষ্ঠের লম্বভাবে (খ) ভূপৃষ্ঠের সমান্তরালে\n(গ) নিচের দিকে (ঘ) যেকোনো কোণে\nউত্তর: খ"}]},{"id":"topic_17939844716430jjih","title":"পাঠ - (৬ ও ৭)","blocks":[{"id":"block_1793984629254f7jwq","type":"text","value":"<span style=\"color:orange;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. কৃত্রিম উপগ্রহকে ব্যবহারের ওপর ভিত্তি করে বিভিন্ন নামে অভিহিত করার কারণ কী?\n(ক) এটি বিভিন্ন আকৃতির হয় \n(খ) এটি বিভিন্ন দেশে তৈরি হয়\n(গ) এটি নানা রকম কাজে ব্যবহৃত হয়\n(ঘ) এটি বিভিন্ন উচ্চতায় থাকে\nউত্তর: গ\n২. বিদেশে অবস্থানরত আত্মীয়-স্বজনের সাথে টেলিফোনে কথা বলার সময় বেতার সংকেত প্রথম কোথায় প্রেরিত হয়?\n(ক) অন্য দেশের ডিশ এন্টেনায় \n(খ) আমাদের দেশের কোনো যোগাযোগের ডিশ এন্টেনায়\n(গ) সরাসরি প্রাপকের মোবাইলে \n(ঘ) স্যাটেলাইট স্টেশনে\nউত্তর: খ\n৩. টেলিকমিউনিকেশনে যোগাযোগ উপগ্রহ মূলত কীসের কাজ করে?\n(ক) বিদ্যুৎ উৎপাদন কেন্দ্র (খ) রিলে স্টেশন\n(গ) সংকেত রূপান্তরকারী (ঘ) বার্তা সংরক্ষক\nউত্তর: খ\n৪. আমরা টিভিতে বিভিন্ন দেশে অনুষ্ঠিত বিশ্বকাপ বা অলিম্পিক গেইমস সরাসরি দেখতে পাই কোন উপগ্রহের সাহায্যে?\n(ক) যোগাযোগ উপগ্রহ\n(খ) আবহাওয়া উপগ্রহ\n(গ) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ \n(ঘ) নৌপরিবহন উপগ্রহ\nউত্তর: ক\n৫. টেলিভিশন প্রোগ্রাম ও টেলিফোন সংবাদ পৃথিবীর একপ্রান্ত থেকে অন্যপ্রান্তে বয়ে নিয়ে যায় কোনটি?\n(ক) আবহাওয়া উপগ্রহ \n(খ) জ্যোতির্বিদ্যা বিষয়ক উপগ্রহ\n(গ) সামরিক উপগ্রহ \n(ঘ) যোগাযোগ উপগ্রহ\nউত্তর: ঘ\n৬. কোথায় মেঘ সৃষ্টি হচ্ছে বা কোথায় বৃষ্টি হতে পারে তার পূর্বাভাস দেয় কোন উপগ্রহ?\n(ক) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ \n(খ) আবহাওয়া উপগ্রহ\n(গ) জ্যোতির্বিদ্যা বিষয়ক উপগ্রহ \n(ঘ) নৌপরিবহন উপগ্রহ\nউত্তর: খ\n৭. বায়ু প্রবাহ, সাইক্লোন সৃষ্টি হওয়া এবং মেঘ ঘনীভূত হওয়ার পূর্বাভাস কোন উপগ্রহের মাধ্যমে পাওয়া যায়?\n(ক) আবহাওয়া উপগ্রহ (খ) সামরিক উপগ্রহ\n(গ) যোগাযোগ উপগ্রহ (ঘ) নৌপরিবহন উপগ্রহ\nউত্তর: ক\n৮. সমুদ্রের কোনো জাহাজ থেকে তেল চুইয়ে পরিবেশ দূষণ নির্ণয়ে সাহায্য করে কোনটি?\n(ক) সামরিক উপগ্রহ \n(খ) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ\n(গ) নৌপরিবহন উপগ্রহ \n(ঘ) আবহাওয়া উপগ্রহ\nউত্তর: খ\n৯. কোনো শহরের বায়ু দূষিত ও ময়লা কিনা তা নির্ণয়ে সাহায্য করে কোনটি?\n(ক) যোগাযোগ উপগ্রহ \n(খ) আবহাওয়া উপগ্রহ\n(গ) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ\n(ঘ) জ্যোতির্বিদ্যা বিষয়ক উপগ্রহ\nউত্তর: গ\n১০. কোন মাঠে ফসল ভালো হচ্ছে কিংবা কোন ফসলে রোগবালাই আক্রান্ত হয়েছে তা কোন উপগ্রহের মাধ্যমে জানা যায়?\n(ক) আবহাওয়া উপগ্রহ \n(খ) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ\n(গ) নৌপরিবহন উপগ্রহ \n(ঘ) গোয়েন্দা উপগ্রহ\nউত্তর: খ\n১১. বনে কোথায় আগুন লেগেছে বা জাহাজের যাত্রাপথে হিমবাহ আছে কিনা তা নিশ্চিত করে কোনটি?\n(ক) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ \n(খ) আবহাওয়া উপগ্রহ\n(গ) নৌপরিবহন উপগ্রহ \n(ঘ) জ্যোতির্বিদ্যা বিষয়ক উপগ্রহ\nউত্তর: ক\n১২. মাটি, পানি ও বায়ু দূষণ নির্ণয়ের জন্য কোন উপগ্রহটি ব্যবহৃত হয়?\n(ক) যোগাযোগ উপগ্রহ (খ) আবহাওয়া উপগ্রহ\n(গ) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ (ঘ) সামরিক উপগ্রহ\nউত্তর: গ\n১৩. প্রতিপক্ষ যোদ্ধারা কোথায় লুকিয়ে আছে বা গোপন আক্রমণ হচ্ছে কিনা তা জানার জন্য ব্যবহৃত হয় কোনটি?\n(ক) নৌপরিবহন উপগ্রহ \n(খ) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ\n(গ) সামরিক বা গোয়েন্দা উপগ্রহ\n(ঘ) যোগাযোগ উপগ্রহ\nউত্তর: গ\n১৪. সামরিক বাহিনীতে গোয়েন্দার কাজ করার জন্য কোন উপগ্রহটি ব্যবহার করা হয়?\n(ক) আবহাওয়া উপগ্রহ \n(খ) জ্যোতির্বিদ্যা বিষয়ক উপগ্রহ\n(গ) নৌপরিবহন উপগ্রহ \n(ঘ) সামরিক বা গোয়েন্দা উপগ্রহ\nউত্তর: ঘ\n১৫. গাড়ি, সামুদ্রিক জাহাজ ও বিমানের সঠিক অবস্থান নির্ণয়ের জন্য কোনটি ব্যবহার করা হয়?\n(ক) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ \n(খ) নৌপরিবহন উপগ্রহ\n(গ) আবহাওয়া উপগ্রহ \n(ঘ) যোগাযোগ উপগ্রহ\nউত্তর: খ\n১৬. আকাশে উড্ডয়নরত বিমান বা সমুদ্রে চলমান জাহাজ কোথায় আছে তা জানা যায় কোন উপগ্রহের মাধ্যমে?\n(ক) নৌপরিবহন উপগ্রহ (খ) সামরিক উপগ্রহ\n(গ) আবহাওয়া উপগ্রহ (ঘ) যোগাযোগ উপগ্রহ\nউত্তর: ক\n১৭. মহাবিশ্ব সম্পর্কে বিভিন্ন অজানা তথ্য জ্যোতির্বিজ্ঞানীদের দিতে কোন উপগ্রহে টেলিস্কোপ বা দূরবীক্ষণযন্ত্র রাখা হয়?\n(ক) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ \n(খ) জ্যোতির্বিদ্যা বিষয়ক উপগ্রহ\n(গ) সামরিক উপগ্রহ (ঘ) নৌপরিবহন উপগ্রহ\nউত্তর: খ\n১৮. জ্যোতির্বিদ্যা বিষয়ক উপগ্রহে মূল কোন যন্ত্রটি বসানো থাকে?\n(ক) ডিশ এন্টেনা (খ) টেলিস্কোপ বা দূরবীক্ষণযন্ত্র\n(গ) রাডার যন্ত্র (ঘ) রিলে সেন্সর\nউত্তর: খ"},{"id":"block_1793984661832exe44","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:orange;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n১৯. যোগাযোগ উপগ্রহ সম্পর্কিত তথ্য—\ni. টেলিভিশন প্রোগ্রাম ও টেলিফোন সংবাদ পৃথিবীর একপ্রান্ত থেকে অন্যপ্রান্তে বয়ে নিয়ে যায়\nii. মহাকাশে এই উপগ্রহ রিলে স্টেশনের কাজ করে\niii. এটি আবহাওয়ার পূর্বাভাস প্রদানে সরাসরি সাহায্য করে\n ধি বাংলাদেশ থেকে আমেরিকার এক আত্মীয়ের সাথে টেলিফোনে কথা বলল এবং টিভিতে অলিম্পিক গেমসের সরাসরি সম্প্রচার দেখল।\n২৫. উদ্দীপকে বর্ণিত কাজগুলো সম্পন্ন করতে কোন ধরনের কৃত্রিম উপগ্রহ সাহায্য করে?\n(ক) আবহাওয়া উপগ্রহ (খ) যোগাযোগ উপগ্রহ\n(গ) নৌপরিবহন উপগ্রহ (ঘ) সামরিক উপগ্রহ\nউত্তর: খ\n২৬. যোগাযোগ উপগ্রহ কৃত্রিম উপগ্রহ হিসেবে মহাশূন্যে মূলত কার কাজ করে?\n(ক) বিদ্যুৎ উৎপাদন কেন্দ্র (খ) রাডার সেন্সর\n(গ) তাপ পরিবাহী (ঘ) রিলে স্টেশন\nউত্তর: ঘ\n<b> নিচের তথ্যের আলোকে (২৭ ও ২৮) নং প্রশ্নের উত্তর দাও:   </b>\nআবহাওয়া অধিদপ্তর থেকে আগামী কয়েকদিনের আবহাওয়া কেমন হবে, কোথায় বৃষ্টি হতে পারে এবং সাইক্লোন সৃষ্টির আশঙ্কা রয়েছে তা জানিয়ে পূর্বাভাস দেওয়া হলো।\n২৭. এই ধরনের পূর্বাভাস প্রদানে কোন উপগ্রহটি পর্যবেক্ষণ করে তথ্য দেয়?\n(ক) আবহাওয়া উপগ্রহ (খ) যোগাযোগ উপগ্রহ\n(গ) গোয়েন্দা উপগ্রহ (ঘ) নৌপরিবহন উপগ্রহ\nউত্তর: ক\n২৮. আবহাওয়ার পূর্বাভাস দেওয়ার সময় আবহাওয়া উপগ্রহ নিচের কোনটি পর্যবেক্ষণ করে?\n(ক) শহরের ময়লা-আবর্জনা (খ) সাইক্লোন সৃষ্টি হওয়া\n(গ) প্রতিপক্ষের অবস্থান (ঘ) জাহাজের হিমবাহের পথ\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (২৯ ও ৩০) নং প্রশ্নের উত্তর দাও:   </b>\nবিজ্ঞানীরা একটি বিশেষ উপগ্রহের সাহায্যে সমুদ্রের পানিতে তেল চুইয়ে পড়ার কারণে পরিবেশ দূষণ এবং বনে আগুন লাগার দৃশ্য পর্যবেক্ষণ করলেন।\n২৯. পরিবেশ ও প্রকৃতি পর্যবেক্ষণের জন্য ব্যবহৃত এই উপগ্রহটি কিসের ছবি দিতে পারে?\n(ক) পৃথিবীর পৃষ্ঠের স্পষ্ট চিত্র \n(খ) মহাবিশ্বের অজানা গ্যালাক্সি\n(গ) প্রতিপক্ষের গোপন আস্তানা \n(ঘ) তারকামণ্ডলীর গতিবিধি\nউত্তর: ক\n৩০. মাটি, পানি ও বায়ু দূষণ এবং ফসলের রোগবালাই নির্ণয়ে কোন উপগ্রহ সাহায্য করে?\n(ক) যোগাযোগ উপগ্রহ\n(খ) জ্যোতির্বিদ্যা বিষয়ক উপগ্রহ\n(গ) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ\n(ঘ) নৌপরিবহন উপগ্রহ\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৩১ ও ৩২) নং প্রশ্নের উত্তর দাও:   </b>\nসামরিক বাহিনী দেশের নিরাপত্তা রক্ষার্থে প্রতিপক্ষ যোদ্ধারা কোথায় লুকিয়ে আছে এবং কোনো গোপন আক্রমণ হচ্ছে কি না তা জানার জন্য একটি বিশেষ উপগ্রহ ব্যবহার করল।\n৩১. সামরিক বাহিনী কর্তৃক ব্যবহৃত এই উপগ্রহটির নাম কী?\n(ক) যোগাযোগ উপগ্রহ \n(খ) নৌপরিবহন উপগ্রহ\n(গ) আবহাওয়া উপগ্রহ \n(ঘ) সামরিক বা গোয়েন্দা উপগ্রহ\nউত্তর: ঘ\n৩২. গোয়েন্দার কাজ করার জন্য এই উপগ্রহটি মূলত কী ধরনের তথ্য সংগ্রহ করে?\n(ক) আবহাওয়ার পূর্বাভাস \n(খ) গোপন আক্রমণ বা লুকিয়ে থাকা যোদ্ধার তথ্য\n(গ) বিমানের অবস্থান (ঘ) মহাকাশের তারার তথ্য\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৩ ও ৩৪) নং প্রশ্নের উত্তর দাও:   </b>\nবিশাল সমুদ্রে একটি জাহাজ এবং আকাশে চলাচলকারী একটি বিমান তাদের সঠিক অবস্থান নির্ণয় করতে কৃত্রিম উপগ্রহের সহায়তা নিচ্ছে।\n৩৩. গাড়ি, বিমান ও জাহাজের সঠিক অবস্থান নির্ণয়ের জন্য ব্যবহৃত উপগ্রহটি কোনটি?\n(ক) নৌপরিবহন উপগ্রহ \n(খ) পৃথিবী পর্যবেক্ষণকারী উপগ্রহ\n(গ) যোগাযোগ উপগ্রহ \n(ঘ) আবহাওয়া উপগ্রহ\nউত্তর: ক\n৩৪. নৌপরিবহন উপগ্রহের প্রধান কাজ নিচের কোনটি?\n(ক) আবহাওয়া সম্পর্কে জানানো \n(খ) সঠিক অবস্থান নির্ণয় করা\n(গ) টেলিস্কোপ দিয়ে ছবি তোলা \n(ঘ) টেলিভিশন প্রোগ্রাম সম্প্রচার করা\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৫ ও ৩৬) নং প্রশ্নের উত্তর দাও:   </b>\nজ্যোতির্বিজ্ঞানীরা মহাবিশ্ব সম্পর্কে বিভিন্ন অজানা তথ্য জানার জন্য একটি বিশেষ উপগ্রহে টেলিস্কোপ বা দূরবীক্ষণযন্ত্র স্থাপন করেছেন।\n৩৫. মহাবিশ্বের অজানা তথ্য অনুসন্ধানে কোন উপগ্রহে টেলিস্কোপ রাখা হয়?\n(ক) জ্যোতির্বিদ্যা বিষয়ক উপগ্রহ (খ) সামরিক উপগ্রহ\n(গ) নৌপরিবহন উপগ্রহ (ঘ) আবহাওয়া উপগ্রহ\nউত্তর: ক\n৩৬. জ্যোতির্বিদ্যা বিষয়ক উপগ্রহে মূল কোন যন্ত্রটি ব্যবহার করা হয়?\n(ক) ডিশ এন্টেনা (খ) টেলিস্কোপ বা দূরবীক্ষণযন্ত্র\n(গ) রিলে স্টেশন (ঘ) রাডার যন্ত্র\nউত্তর: খ\n\n\n\n<span style=\"color:red;\"><center><b>————————🌸 সমাপ্ত 🌸————————</b></center></span>\n\n\n\n"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>

</html>
