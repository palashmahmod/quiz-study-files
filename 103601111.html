. সেলুলোজ, স্টার্চ ও জিলাটিন এগুলো কী ধরনের পদার্থ?\n(ক) হাইড্রোফোবিক (খ) হাইড্রোফিলিক\n(গ) অদ্রবণীয় (ঘ) বিষাক্ত\nউত্তর: খ"},{"id":"block_1787667456682dbzsk","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৭. প্রোটোপ্লাজম এবং পানির সম্পর্ক বিষয়ে বলা যায়—\ni. প্রোটোপ্লাজম হলো জীবদেহের ভৌত ভিত্তি\nii. প্রোটোপ্লাজমের শতকরা $৯০\\text{ ভাগ}$ পানি\niii. পানির পরিমাণ কমে গেলে প্রোটোপ্লাজম স্ফীত হয়ে ওঠে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৮. উদ্ভিদের দেহে পানির প্রয়োজনীয় দিকগুলো হলো—\ni. প্রোটোপ্লাজমকে সজীব রাখা\nii. প্রশ্বেদন ও সালোকসংশ্লেষণ প্রক্রিয়া চালু রাখা\niii. কোষের বৃদ্ধি ও চলনে ভূমিকা রাখা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৯. উদ্ভিদ দেহে পানির গুরুত্ব ও ভূমিকা হলো—\ni. পানি একটি গুরুত্বপূর্ণ দ্রাবক হিসেবে কাজ করে\nii. বিপাকীয় ক্রিয়াসমূহ সচল রাখতে পানির ভূমিকা অপরিসীম\niii. শুষ্ক মৌসুমে সেচ দেওয়া ছাড়াই বড় উদ্ভিদ সতেজ থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩০. উদ্ভিদ দেহে পানি শোষণের বৈশিষ্ট্যসমূহ হলো—\ni. উদ্ভিদ প্রধানত মূলের মাধ্যমে মাটি থেকে পানি শোষণ করে\nii. তিনটি সম্মিলিত প্রক্রিয়ার মাধ্যমে শোষণ কাজ সম্পন্ন হয়\niii. শোষণ প্রক্রিয়ার মধ্যে ইমবাইবিশন, ব্যাপন ও অভিস্রবণ অন্তর্ভুক্ত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩১. ইমবাইবিশন প্রক্রিয়া সম্পর্কে বলা যায়—\ni. কলয়েড জাতীয় শুকনা বা আধা শুকনা পদার্থ তরল চুষে নেয়\nii. কোষপ্রাচীর ও প্রোটোপ্লাজম কলয়েডধর্মী\niii. পানি শোষণের এটি অন্যতম একটি প্রক্রিয়া\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩২. হাইড্রোফিলিক বা পানিপ্রিয় পদার্থসমূহ হলো—\ni. সেলুলোজ ii. স্টার্চ iii. জিলাটিন\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৩. হাইড্রোফিলিক পদার্থের বৈশিষ্ট্য হলো—\ni. এরা তরল পদার্থের সংস্পর্শে এলে তা চুষে নেয়\nii. তরল পদার্থের অভাবে এগুলো সংকুচিত হয়ে যায়\niii. এরা পানিকে সম্পূর্ণ বিকর্ষণ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৪. ব্যাপন প্রক্রিয়া সম্পর্কে সঠিক তথ্য হলো—\ni. এটি একটি ভৌত প্রক্রিয়া\nii. দ্রবের অণু বেশি ঘনত্বের এলাকা থেকে কম ঘনত্বের এলাকায় ছড়িয়ে পড়ে\niii. ঘরের কোণে সুগন্ধি ছিটিয়ে দিলে তা ছড়িয়ে পড়া ব্যাপনের উদাহরণ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৫. ব্যাপন চাপ ও ব্যাপন চাপ ঘাটতি সম্পর্কিত বক্তব্য—\ni. বেশি ঘনত্বের দ্রবণ থেকে কম ঘনত্বের দ্রবণের দিকে দ্রাবকের ব্যাপিত হওয়ার ক্ষমতাকে ব্যাপন চাপ বলে\nii. দ্রবণ ও দ্রাবকের ব্যাপন চাপের পার্থক্যকে ব্যাপন চাপ ঘাটতি বলে\niii. পাতার মেসোফিল টিস্যুতে ব্যাপন চাপ ঘাটতি ঘটলে পাশের কোষ থেকে পানি টেনে নেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৬. কিসমিশের ক্ষেত্রে অভিস্রবণ প্রক্রিয়ার ঘটনাগুলো হলো—\ni. শুকনা কিসমিশ পানিতে ভিজিয়ে রাখলে ফুলে ওঠে\nii. স্ফীত কিসমিশ ঘন চিনির দ্রবণে রাখলে চুপসে যায়\niii. কিসমিশ সব সময় পানি ত্যাগ করে সংকুচিত থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৭. অভিস্রবণ প্রক্রিয়ার শর্ত ও বৈশিষ্ট্য হলো—\ni. দুটি ভিন্ন ঘনত্বের দ্রবণ বৈষম্যভেদ্য পর্দা দিয়ে আলাদা থাকে\nii. দ্রাবক কম ঘনত্বের দ্রবণ থেকে বেশি ঘনত্বের দ্রবণের দিকে প্রবাহিত হয়\niii. এটি কেবল জীবন্ত কোষে ঘটে, ল্যাবরেটরিতে ঘটানো সম্ভব নয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৮. অভিস্রবণের দ্রাবক প্রবাহের বৈশিষ্ট্য হলো—\ni. অভিস্রবণ প্রকৃতপক্ষে দ্রাবকের ব্যাপন\nii. দ্রাবকের পরিমাণ আপেক্ষিক বেশি থাকা দিক থেকে কম থাকা দিকে প্রবাহ ঘটে\niii. বৈষম্যভেদ্য পর্দা অতিক্রম করে দ্রবের অণু প্রবাহিত হওয়া সম্ভব\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_178766751426706nxj","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩৯ ও ৪০) নং প্রশ্নের উত্তর দাও:   </b> \nরাহাত তার বিজ্ঞান প্রজেক্টের জন্য এক খণ্ড শুকনা কাঠ পানিতে ডুবিয়ে রাখল। কিছু সময় পর সে লক্ষ্য করল কাঠের খণ্ডটি কিছু পানি চুষে নিয়ে সামান্য স্ফীত হয়েছে। \n৩৯. উদ্দীপকে কাঠের খণ্ডটির পানি চুষে নেওয়ার ঘটনাটি কোন প্রক্রিয়ার অন্তর্ভুক্ত? \n(ক) অভিস্রবণ (খ) ব্যাপন \n(গ) ইমবাইবিশন (ঘ) প্রশ্বেদন \nউত্তর: গ \n৪০. উদ্দীপকের প্রক্রিয়ার মাধ্যমে উদ্ভিদের কোন অংশ দুটি পানি শোষণ করে স্ফীত হয়ে ওঠে? \n(ক) কোষপ্রাচীর ও প্রোটোপ্লাজম \n(খ) মাইটোকন্ড্রিয়া ও প্লাস্টিড \n(গ) কোষগহ্বর ও নিউক্লিয়াস \n(ঘ) ক্রোমোজোম ও সাইটোপ্লাজম \nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৪১ ও ৪২) নং প্রশ্নের উত্তর দাও:   </b>\n রিনা ঘরের এক কোণে কিছুটা সুগন্ধি ছিটিয়ে দিল। কিছুক্ষণ পর অন্য কোণে থাকা তার ভাই সেই সুগন্ধ পেল। পরবর্তীতে সে এক গ্লাস পানিতে কিছু চিনি ছেড়ে দিয়ে নাড়া দিল, যার ফলে পুরো পানি মিষ্টি হয়ে গেল। \n৪১. উদ্দীপকে বর্ণিত ঘটনাগুলো পদার্থের কোন ভৌত প্রক্রিয়াকে নির্দেশ করে? \n(ক) ইমবাইবিশন (খ) অভিস্রবণ \n(গ) ব্যাপন (ঘ) পরিস্রুতকরণ \nউত্তর: গ \n৪২. উদ্দীপকের প্রক্রিয়ার ফলে উদ্ভিদের কোন টিস্যুতে চাপ ঘাটতি তৈরি হলে পাশের কোষ থেকে পানি শোষিত হয়? \n(ক) জাইলেম টিস্যু (খ) মেসোফিল টিস্যু \n(গ) ফ্লোয়েম টিস্যু (ঘ) ভাজক টিস্যু \nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৩ ও ৪৪) নং প্রশ্নের উত্তর দাও:   </b>\nসুমন বাটিতে থাকা পানিতে কিছু শুকনা কিশমিশ ভিজিয়ে রাখায় সেগুলো ফুলে টসটসে হয়ে উঠল। পরবর্তীতে সে স্ফীত কিশমিশগুলো একটি অতি ঘন চিনির দ্রবণে ডুবিয়ে রাখলে সেগুলো আবার চুপসে গেল। \n৪৩. উদ্দীপকের কিশমিশের ফুলে ওঠা ও পরবর্তীতে চুপসে যাওয়ার ঘটনাটি কোন প্রক্রিয়াকে প্রদর্শন করে? \n(ক) ইমবাইবিশন (খ) অভিস্রবণ (গ) ব্যাপন (ঘ) প্রশ্বেদন \nউত্তর: খ \n৪৪. উদ্দীপকের প্রক্রিয়ায় দুটি ভিন্ন ঘনত্বের দ্রবণকে পৃথক রাখতে কোন ধরনের পর্দার প্রয়োজন হয়? \n(ক) অভেদ্য পর্দা (খ) ভেদ্য পর্দা \n(গ) বৈষম্যভেদ্য পর্দা (ঘ) পলিথিন পর্দা \nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৪৫ ও ৪৬) নং প্রশ্নের উত্তর দাও:   </b>\n জীববিজ্ঞানের শিক্ষক ক্লাসে বললেন, \"প্রোটোপ্লাজম হলো জীবদেহের ভৌত ভিত্তি এবং এতে প্রচুর পরিমাণে পানি থাকে। পানির পরিমাণ কমে গেলে কোষের কার্যক্ষমতা বন্ধ হয়ে যায়, এমনকি জীব মারাও যেতে পারে।\" \n৪৫. উদ্দীপকের প্রোটোপ্লাজমে শতকরা কত ভাগ পানি থাকে বলে পাঠ্যবইয়ে উল্লিখিত আছে? \n(ক) $৭০\\%$ (খ) $৮০\\%$ (গ) $৯০\\%$ (ঘ) $৯৫\\%$ \nউত্তর: গ \n৪৬. উদ্দীপক অনুযায়ী পানির অপর নাম 'ফ্লুইড অফ লাইফ' হওয়ার প্রধান কারণ কোনটি? \n(ক) এটি প্রোটোপ্লাজমকে সংকুচিত করে \n(খ) এটি প্রোটোপ্লাজমকে সজীব ও সচল রাখে \n(গ) এটি উদ্ভিদের পরিবহন স্তব্ধ করে \n(ঘ) এটি কোষপ্রাচীর ধ্বংস করে \nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৭ ও ৪৮) নং প্রশ্নের উত্তর দাও:   </b>\nকৃষক রহিম মিয়া শুষ্ক মৌসুমে লক্ষ্য করলেন তার বাগানের বড় বড় গাছগুলোতে নিয়মিত সেচ না দিলে গাছগুলো নিস্তেজ হয়ে পড়ে। তিনি জানেন পানি ছাড়া উদ্ভিদের খাদ্য তৈরি ও অতিরিক্ত পানি বাষ্পাকারে বের করার প্রক্রিয়া বন্ধ হয়ে যায়। \n৪৭. উদ্দীপকে উল্লিখিত সেচ না দিলে উদ্ভিদের কোন গুরুত্বপূর্ণ শারীরবৃত্তীয় প্রক্রিয়া দুটি বন্ধ হয়ে যাবে? \n(ক) শ্বসন ও রেচন (খ) স্ফীতকরণ ও সংকোচন\n(গ) অভিস্রবণ ও ইমবাইবিশন \n(ঘ) প্রশ্বেদন ও সালোকসংশ্লেষণ\nউত্তর: ঘ \n৪৮. উদ্ভিদ প্রধানত কোন অঙ্গের সাহায্যে মাটি থেকে এই প্রয়োজনীয় পানি শোষণ করে? \n(ক) পাতা (খ) কাণ্ড (গ) মূল (ঘ) ফুল \nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৪৯ ও ৫০) নং প্রশ্নের উত্তর দাও:   </b>\nল্যাব সহকারী সুবীর বাবু পাত্রে সেলুলোজ, স্টার্চ ও জিলাটিন নিয়ে পানি যোগ করলেন। তিনি দেখলেন এই পদার্থগুলো দ্রুত পানি চুষে নিচ্ছে।\n৪৯. উদ্দীপকের পদার্থগুলোকে বৈশিষ্ট্যের বিচারে কী ধরনের পদার্থ বলা হয়?\n(ক) হাইড্রোফোবিক (খ) হাইড্রোফিলিক\n(গ) পানিবিরোধী (ঘ) অদ্রবণীয়\nউত্তর: খ\n৫০. উদ্দীপকে উল্লিখিত পদার্থগুলোর তরল চুষে নেওয়ার প্রক্রিয়াটি উদ্ভিদ জীবনে কীভাবে সাহায্য করে?\n(ক) ফল পাকাতে (খ) পানি শোষণে\n(গ) খাদ্য পরিবহনে (ঘ) ফুল ফোটাতে\nউত্তর: খ"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
