 হয় \n(ঘ) কপাটিকার প্রয়োজন হয় না\nউত্তর: খ"},{"id":"block_17876701272934g2j5","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:tomato;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৪১. হূৎপিণ্ডের অবস্থান ও আকৃতি সংক্রান্ত তথ্য—\ni. এটি বক্ষগহ্বরের বাম দিকে দুই ফুসফুসের মাঝখানে অবস্থিত\nii. এটি একটি মোচাকৃতির ফাঁপা অঙ্গ\niii. এটি পেরিকার্ডিয়াম নামক দ্বিস্তরী পর্দা দ্বারা আবৃত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪২. হূৎপিণ্ডের এপিকার্ডিয়াম (বহিঃস্তর) স্তরটির বৈশিষ্ট্য—\ni. এটি মূলত যোজক কলা দিয়ে গঠিত\nii. এতে চর্বি অবস্থান করে\niii. এটি অনৈচ্ছিক হৃদপেশি দ্বারা গঠিত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৩. মায়োকার্ডিয়াম (মধ্যস্তর) স্তর সম্পর্কে সত্য হলো—\ni. এটি বহিঃস্তর ও অন্তঃস্তরের মাঝখানে অবস্থান করে\nii. এটি মজবুত অনৈচ্ছিক হৃদপেশি দিয়ে গঠিত\niii. হূৎপিণ্ডের সংকোচন ও প্রসারণে এটি ভূমিকা রাখে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৪. এন্ডোকার্ডিয়াম (অন্তঃস্তর) সম্পর্কে প্রযোজ্য—\ni. এটি হূৎপিণ্ডের সবচেয়ে ভেতরের স্তর\nii. এটি হূৎপিণ্ডের প্রকোষ্ঠগুলোকে ভেতরে আবৃত রাখে\niii. হূৎপিণ্ডের কপাটিকাগুলো এই স্তর দিয়ে আবৃত থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৫. হূৎপিণ্ডের প্রকোষ্ঠগুলোর বৈশিষ্ট্য হলো—\ni. অলিন্দ দুটি আকারে ছোট এবং এদের প্রাচীর পাতলা\nii. নিলয় দুটি আকারে বড় এবং এদের প্রাচীর পুরু\niii. ডান ও বাম অলিন্দ আন্তঃনিলয় পর্দা দ্বারা পৃথক থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৬. হূৎপিণ্ডের কপাটিকাগুলোর অবস্থান সংক্রান্ত সঠিক তথ্য—\ni. ডান অলিন্দ ও ডান নিলয়ের ছিদ্রপথে বাইকাসপিড কপাটিকা থাকে\nii. বাম অলিন্দ ও বাম নিলয়ের ছিদ্রপথে ট্রাইকাসপিড কপাটিকা থাকে\niii. মহাধমনি ও ফুসফুসীয় ধমনির মুখে সেমিলুনার বা অর্ধচন্দ্রাকৃতির কপাটিকা থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n৪৭. হূৎপিণ্ডের কপাটিকা (Valves) সম্পর্কিত বক্তব্য—\ni. ট্রাইকাসপিড কপাটিকা তিন পাল্লাবিশিষ্ট\nii. বাইকাসপিড কপাটিকার অপর নাম মিট্রাল ভালভ\niii. কপাটিকাগুলো রক্ত প্রবাহকে যেকোনো দিকে চলাচলে সাহায্য করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৮. হূৎস্পন্দন (Heart beat) এবং হূৎপিণ্ডের গতির ক্ষেত্রে—\ni. হূৎপিণ্ডের নিয়মিত সংকোচনকে সিস্টোল বলে\nii. হূৎপিণ্ডের নিয়মিত প্রসারণকে ডায়াস্টোল বলে\niii. পর পর একটি সিস্টোল ও একটি ডায়াস্টোলকে একত্রে হূৎস্পন্দন বলে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৯. অলিন্দ দুটির ডায়াস্টোল (প্রসারণ) ঘটলে—\ni. দেহের বিভিন্ন অংশ থেকে কার্বন ডাই-অক্সাইড যুক্ত রক্ত ডান অলিন্দে আসে\nii. ফুসফুস থেকে অক্সিজেন যুক্ত রক্ত বাম অলিন্দে প্রবেশ করে\niii. কপাটিকাগুলো বন্ধ থাকায় অলিন্দে রক্ত জমা হতে পারে না\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫০. অলিন্দ দুটির সিস্টোল (সংকোচন) ঘটলে—\ni. ডান অলিন্দ থেকে কার্বন ডাই-অক্সাইড যুক্ত রক্ত ডান নিলয়ে প্রবেশ করে\nii. বাম অলিন্দ থেকে অক্সিজেন যুক্ত রক্ত বাম নিলয়ে প্রবেশ করে\niii. ট্রাইকাসপিড ও বাইকাসপিড ভালভ খুলে যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫১. নিলয় দুটির সিস্টোল (সংকোচন) ঘটলে—\ni. ডান নিলয় থেকে কার্বন ডাই-অক্সাইড যুক্ত রক্ত ফুসফুসীয় ধমনিতে প্রবেশ করে\nii. বাম নিলয় থেকে অক্সিজেন যুক্ত রক্ত মহাধমনিতে প্রবেশ করে\niii. ট্রাইকাসপিড ও বাইকাসপিড কপাটিকাগুলো সশব্দে বন্ধ হয়ে যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫২. হূৎপিণ্ডে রক্তের প্রবাহ এবং কপাটিকার ভূমিকা—\ni. নিলয় সংকুচিত হলে বাইকাসপিড ও ট্রাইকাসপিড কপাটিকা বন্ধ হয় যাতে রক্ত অলিন্দে না ফেরে\nii. নিলয় প্রসারিত হলে অর্ধচন্দ্রাকৃতির কপাটিকা বন্ধ হয় যাতে রক্ত ধমনি থেকে নিলয়ে না ফেরে\niii. কপাটিকাগুলোর কারণে রক্ত কেবল একদিকে প্রবাহিত হতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৩. রক্ত সংবহন ও ফুসফুসের ভূমিকা সম্পর্কে সঠিক উক্তি—\ni. ফুসফুসীয় ধমনির মাধ্যমে রক্ত পরিশোধিত হওয়ার জন্য ফুসফুসে যায়\nii. ফুসফুসে রক্ত থেকে কার্বন ডাই-অক্সাইড ত্যাগ করা হয় এবং অক্সিজেন যুক্ত হয়\niii. হূৎপিণ্ডের প্রকোষ্ঠগুলো সম্পূর্ণ আলাদা থাকায় অক্সিজেন ও কার্বন ডাই-অক্সাইড যুক্ত রক্ত মিশে যায় না\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৪. হূৎপিণ্ডের প্রকোষ্ঠ ও পর্দা সম্পর্কিত সত্য তথ্য—\ni. দুটি অলিন্দ আন্তঃঅলিন্দ পর্দা দ্বারা পৃথক\nii. দুটি নিলয় আন্তঃনিলয় পর্দা দ্বারা পৃথক\niii. নিলয়ের প্রাচীর অলিন্দের প্রাচীরের চেয়ে বেশি পুরু\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৫. হূৎপিণ্ডের রক্তনালি ও রক্ত বহনের দিক সম্পর্কে তথ্য—\ni. ঊর্ধ্ব ও নিম্ন মহাশির কার্বন ডাই-অক্সাইড যুক্ত রক্ত ডান অলিন্দে আনে\nii. ফুসফুসীয় শিরা অক্সিজেন যুক্ত রক্ত বাম অলিন্দে নিয়ে আসে\niii. মহাধমনি অক্সিজেন যুক্ত রক্ত সারা দেহে পরিবাহিত করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1787670174646bhd8l","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color: tomato;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৫৬ ও ৫৭) নং প্রশ্নের উত্তর দাও:   </b> \nরফিক শিক্ষক মহোদয়ের কাছ থেকে জানতে পারল যে মানবদেহের হূৎপিণ্ড তিনটি স্তর নিয়ে গঠিত। মধ্যস্তরটি অত্যন্ত মজবুত অনৈচ্ছিক পেশি দ্বারা গঠিত যা হূৎপিণ্ডের সংকোচন-প্রসারণে প্রধান ভূমিকা পালন করে। অন্যদিকে অভ্যন্তরীণ স্তরটি হূৎপিণ্ডের প্রকোষ্ঠ ও কপাটিকাগুলোকে আবৃত রাখে।\n৫৬. উদ্দীপকে বর্ণিত হূৎপিণ্ডের মধ্যস্তরটির নাম কী?\n(ক) এপিকার্ডিয়াম (খ) মায়োকার্ডিয়াম\n(গ) এন্ডোকার্ডিয়াম (ঘ) পেরিকার্ডিয়াম\nউত্তর: খ\n৫৭. উদ্দীপকে উল্লিখিত অভ্যন্তরীণ স্তরটি (এন্ডোকার্ডিয়াম) সম্পর্কে কোনটি সঠিক?\n(ক) এটি মূলত যোজক কলা ও চর্বি দিয়ে গঠিত \n(খ) এটি হূৎপিণ্ডের প্রকোষ্ঠ ও কপাটিকাগুলোকে ঢেকে রাখে\n(গ) এটি একটি দ্বিস্তরী পাতলা আবরণী পর্দা \n(ঘ) এটি বক্ষগহ্বরের বাইরে অবস্থান করে\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫৮ ও ৫৯) নং প্রশ্নের উত্তর দাও:   </b> \nমানবদেহের সংবহনতন্ত্রের প্রধান পাম্প অঙ্গটি ভেতরে ফাঁপা এবং চারটি প্রকোষ্ঠে বিভক্ত। ওপরের দুটি প্রকোষ্ঠের প্রাচীর পাতলা এবং এদের মাঝখানে একটি পর্দা থাকে। নিচের দুটি প্রকোষ্ঠের প্রাচীর বেশ পুরু এবং এদের মধ্যে পৃথককারী পর্দা রয়েছে।\n৫৮. উদ্দীপকে বর্ণিত হূৎপিণ্ডের ওপরের ও নিচের প্রকোষ্ঠ দুটিকে যথাক্রমে কী বলা হয়?\n(ক) অলিন্দ ও নিলয় (খ) নিলয় ও অলিন্দ\n(গ) ধমনি ও শিরা (ঘ) কপাটিকা ও পর্দা\nউত্তর: ক\n৫৯. উদ্দীপকে উল্লিখিত প্রকোষ্ঠগুলোকে পৃথককারী পর্দা দুটির নাম যথাক্রমে কী?\n(ক) আন্তঃনিলয় পর্দা ও পেরিকার্ডিয়াম \n(খ) আন্তঃঅলিন্দ পর্দা ও আন্তঃনিলয় পর্দা\n(গ) এন্ডোকার্ডিয়াম ও এপিকার্ডিয়াম \n(ঘ) মাইওকার্ডিয়াম ও পেরিকার্ডিয়াম\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬০ ও ৬১) নং প্রশ্নের উত্তর দাও:   </b> \nডাক্তার অনিক একটি চিত্রে হূৎপিণ্ডের প্রকোষ্ঠগুলোর ছিদ্রপথ দেখালেন। সেখানে ডান অলিন্দ ও ডান নিলয়ের সংযোগস্থলে $৩$ পাল্লাবিশিষ্ট একটি কপাটিকা এবং বাম অলিন্দ ও বাম নিলয়ের সংযোগস্থলে $২$ পাল্লাবিশিষ্ট একটি কপাটিকা রয়েছে, যা রক্তপ্রবাহ একমুখী রাখে।\n৬০. উদ্দীপকে বর্ণিত ডান অলিন্দ ও ডান নিলয়ের সংযোগস্থলে অবস্থিত কপাটিকাটির নাম কী?\n(ক) বাইকাসপিড কপাটিকা (খ) ট্রাইকাসপিড কপাটিকা\n(গ) মিট্রাল ভালভ (ঘ) সেমিলুনার ভালভ\nউত্তর: খ\n৬১. উদ্দীপকে উল্লিখিত বাম অলিন্দ ও বাম নিলয়ের মাঝখানের ২ পাল্লাবিশিষ্ট কপাটিকাটির অপর নাম কী?\n(ক) ট্রাইকাসপিড ভালভ (খ) মিট্রাল ভালভ\n(গ) পালমোনারি ভালভ (ঘ) সেমিলুনার ভালভ\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬২ ও ৬৩) নং প্রশ্নের উত্তর দাও:   </b> \nজীববিজ্ঞান ক্লাসে শিক্ষক বললেন, হূৎপিণ্ড ছান্দিকভাবে সংকুচিত ও প্রসারিত হয়ে সারা দেহে রক্ত পাম্প করে। এর নিয়মিত সংকোচনকে সিস্টোল এবং প্রসারণকে ডায়াস্টোল বলা হয়।\n৬২. উদ্দীপক অনুযায়ী হূৎপিণ্ডের পর পর একটি সিস্টোল ও একটি ডায়াস্টোলকে একত্রে কী বলা হয়?\n(ক) হূৎস্পন্দন ($Heart\\ beat$) (খ) রক্তচাপ ($Blood\\ pressure$)\n(গ) রক্ত তঞ্চন ($Blood\\ clotting$) (ঘ) পালস রেট ($Pulse\\ rate$)\nউত্তর: ক\n৬৩. অলিন্দ দুটির ডায়াস্টোল (প্রসারণ) ঘটলে দেহে কী ঘটে?\n(ক) অলিন্দ থেকে রক্ত নিলয়ে প্রবেশ করে \n(খ) মহাশিরার মাধ্যমে কার্বন ডাই-অক্সাইড যুক্ত রক্ত ডান অলিন্দে আসে\n(গ) নিলয় সংকুচিত হয়ে রক্ত মহাধমনিতে যায় \n(ঘ) কপাটিকাগুলো সশব্দে বন্ধ হয়ে যায়\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬৪ ও ৬৫) নং প্রশ্নের উত্তর দাও:   </b> \nহূৎপিণ্ডের নিলয় দুটি যখন সজোরে সংকুচিত হয়, তখন ডান নিলয় থেকে কার্বন ডাই-অক্সাইড যুক্ত রক্ত একটি নালির মাধ্যমে ফুসফুসে এবং বাম নিলয় থেকে অক্সিজেন যুক্ত রক্ত মহাধমনির দিকে ধাবিত হয়। রক্তপ্রবাহ শেষ হলে ধমনির মুখের বিশেষ কপাটিকাগুলো বন্ধ হয়ে যায়।\n৬৪. উদ্দীপক অনুযায়ী ডান নিলয় সংকুচিত হলে রক্ত কোন নালির মাধ্যমে ফুসফুসে প্রবেশ করে?\n(ক) ফুসফুসীয় ধমনি (খ) ফুসফুসীয় শিরা\n(গ) ঊর্ধ্ব মহাশিরা (ঘ) নিম্ন মহাশিরা\nউত্তর: ক\n৬৫. উদ্দীপকে উল্লিখিত মহাধমনি ও ফুসফুসীয় ধমনির মুখে অবস্থিত কপাটিকাগুলোর আকৃতি কেমন?\n(ক) দুই পাল্লাবিশিষ্ট (খ) তিন পাল্লাবিশিষ্ট\n(গ) অর্ধচন্দ্রাকৃতির ($Semilunar$) (ঘ) চতুর্ভুজাকৃতির\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৬৬ ও ৬৭) নং প্রশ্নের উত্তর দাও:   </b> \nমানবদেহের হূৎপিণ্ডের গঠন এমনভাবে তৈরি যাতে এর ডান দিক এবং বাম দিক সম্পূর্ণ পৃথক থাকে। ফলে অক্সিজেন যুক্ত রক্ত এবং কার্বন ডাই-অক্সাইড যুক্ত রক্ত কখনোই পরস্পরের সাথে মিশে যেতে পারে না।\n৬৬. উদ্দীপকে উল্লিখিত কার্বন ডাই-অক্সাইড যুক্ত রক্ত পরিশোধিত করার জন্য হূৎপিণ্ড থেকে প্রধানত কোথায় প্রেরিত হয়?\n(ক) যকৃতে (খ) ফুসফুসে\n(গ) বৃক্কে (ঘ) মস্তিষ্কে\nউত্তর: খ\n৬৭. ফুসফুস থেকে রক্ত পরিশোধিত হওয়ার পর (অক্সিজেন যুক্ত হয়ে) কোন নালির মাধ্যমে হূৎপিণ্ডের বাম অলিন্দে ফিরে আসে?\n(ক) ফুসফুসীয় ধমনি (খ) ফুসফুসীয় শিরা\n(গ) ঊর্ধ্ব মহাশিরা (ঘ) নিম্ন মহাশিরা\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬৮ ও ৬৯) নং প্রশ্নের উত্তর দাও:   </b> \nমানবদেহের সংবহনতন্ত্রের একটি গুরুত্বপূর্ণ অঙ্গ মোচাকৃতির ও ফাঁপা। এটি বক্ষগহ্বরে দুটি ফুসফুসের মধ্যবর্তী স্থানে অবস্থিত এবং পেরিকার্ডিয়াম নামক একটি পাতলা পর্দা দিয়ে আবৃত থাকে।\n৬৮. উদ্দীপকে বর্ণিত অঙ্গটির নাম কী?\n(ক) ফুসফুস (খ) হূৎপিণ্ড\n(গ) যকৃৎ (ঘ) বৃক্ক\nউত্তর: খ\n৬৯. উদ্দীপকে উল্লিখিত পেরিকার্ডিয়াম পর্দাটি কত স্তরবিশিষ্ট?\n(ক) এক স্তরবিশিষ্ট (খ) দ্বিস্তরবিশিষ্ট\n(গ) ত্রিস্তরবিশিষ্ট (ঘ) চার স্তরবিশিষ্ট\nউত্তর: খ"}]},{"id":"topic_1787669559592rc0r4","title":"পাঠ-(6.4.3)","blocks":[{"id":"block_1787670280629tzgs0","type":"text","value":"<span style=\"color:deepskyblue;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. যেসব নালির ভিতর দিয়ে রক্ত প্রবাহিত বা সঞ্চালিত হয়, তাকে কী বলে?\n(ক) লসিকানালি (খ) রক্তবাহিকা\n(গ) স্নায়ুরজ্জু (ঘ) নালিকাগ্রন্থি\nউত্তর: খ\n২. গঠন, আকৃতি এবং কাজের ভিত্তিতে রক্তবাহিকা বা রক্তনালি কত ধরনের?\n(ক) $২$ ধরনের (খ) $৩$ ধরনের\n(গ) $৪$ ধরনের (ঘ) $৫$ ধরনের\nউত্তর: খ\n৩. নিচের কোনটি রক্তবাহিকার তিন প্রকারভেদের অন্তর্ভুক্ত?\n(ক) ধমনি, শিরা ও কৈশিক জালিকা (খ) ধমনি, স্নায়ু ও লসিকা\n(গ) শিরা, প্লাজমা ও অনুচক্রিকা \n(ঘ) মহাধমনি, উপশিরা ও লোহিত কণিকানালি\nউত্তর: ক\n৪. যেসব রক্তনালির মাধ্যমে সাধারণত অক্সিজেনসমৃদ্ধ রক্ত হূৎপিণ্ড থেকে সারাদেহে বাহিত হয়, তাকে কী বলে?\n(ক) শিরা (খ) কৈশিক জালিকা\n(গ) ধমনি (ঘ) উপশিরা\nউত্তর: গ\n৫. কোন ধমনিটি সাধারণ নিয়মের ব্যতিক্রম হিসেবে কার্বন ডাই-অক্সাইডযুক্ত রক্ত পরিবহন করে?\n(ক) ক্যালিফোর্নিয়া ধমনি (খ) ফুসফুসীয় ধমনি\n(গ) বৃক্কীয় ধমনি (ঘ) যকৃৎ ধমনি\nউত্তর: খ\n৬. ফুসফুসীয় ধমনি হূৎপিণ্ড থেকে কার্বন ডাই-অক্সাইডযুক্ত রক্ত কোথায় পৌঁছে দেয়?\n(ক) ফুসফুসে (খ) মস্তিষ্কে\n(গ) যকৃতে (ঘ) বৃক্কে\nউত্তর: ক\n৭. ধমনির প্রাচীর কত স্তরবিশিষ্ট?\n(ক) $২$ স্তরবিশিষ্ট (খ) $৩$ স্তরবিশিষ্ট\n(গ) $৪$ স্তরবিশিষ্ট (ঘ) $৫$ স্তরবিশিষ্ট\nউত্তর: খ\n৮. ধমনির প্রাচীরের তন্তুময় যোজক কলা দিয়ে তৈরি বাইরের স্তরটির নাম কী?\n(ক) টিউনিকা মিডিয়া (খ) টিউনিকা ইন্টার্না\n(গ) টিউনিকা এক্সটার্না (ঘ) পেরিকার্ডিয়াম\nউত্তর: গ\n৯. টিউনিকা মিডিয়া ($Tunica\\ media$) ধমনির কোন স্তর এবং এটি কী দিয়ে তৈরি?\n(ক) বাইরের স্তর, যোজক কলা \n(খ) মাঝের স্তর, বৃত্তাকার অনৈচ্ছিক পেশি\n(গ) ভেতরের স্তর, সরল আবরণী কলা \n(ঘ) বাইরের স্তর, স্নায়ুকলা\nউত্তর: খ\n১০. ধমনির প্রাচীরের সবচেয়ে ভেতরের স্তর কোনটি?\n(ক) টিউনিকা এক্সটার্না (খ) টিউনিকা ইন্টার্না\n(গ) টিউনিকা মিডিয়া (ঘ) এন্ডোকার্ডিয়াম\nউত্তর: খ\n১১. টিউনিকা ইন্টার্না ($Tunica\\ interna$) কোন ধরনের কলা দিয়ে গঠিত?\n(ক) বৃত্তাকার অনৈচ্ছিক পেশি (খ) তন্তুময় যোজক কলা\n(গ) সরল আবরণী কলা (ঘ) তরল যোজক কলা\nউত্তর: গ\n১২. ধমনির প্রাচীরের ভৌতিক বৈশিষ্ট্য কোনটি?\n(ক) পাতলা ও অস্থিতিস্থাপক (খ) পুরু ও স্থিতিস্থাপক\n(গ) কম পুরু ও কম পেশিময় (ঘ) অস্থিতিস্থাপক ও চওড়া\nউত্তর: খ\n১৩. ধমনির নালিপথ ও কপাটিকার ক্ষেত্রে কোনটি সঠিক?\n(ক) নালিপথ সরু এবং কপাটিকা থাকে না \n(খ) নালিপথ চওড়া এবং কপাটিকা থাকে\n(গ) নালিপথ সরু এবং কপাটিকা থাকে \n(ঘ) নালিপথ চওড়া এবং কপাটিকা থাকে না\nউত্তর: ক\n১৪. হূৎপিণ্ডের প্রতিটি সংকোচনের ফলে ধমনিগাত্রের স্ফীতি এবং সংকোচনকে কী বলে?\n(ক) অ্যাগ্লুটিনেশন (খ) নাড়িস্পন্দন ($Pulse$)\n(গ) ডায়ালাইসিস (ঘ) রক্ত তঞ্চন\nউত্তর: খ\n১৫. শরীরের কোন স্থানে হাত রেখে সহজে নাড়িস্পন্দন অনুভব করা যায়?\n(ক) হাতের কবজির ধমনির উপর \n(খ) পায়ের গোড়ালির শিরার উপর\n(গ) কানের লতির রক্তনালিতে \n(ঘ) কনুইয়ের হাড়ের উপর\nউত্তর: ক\n১৬. যেসব নালি দিয়ে রক্ত দেহের বিভিন্ন অংশ থেকে হূৎপিণ্ডে ফিরে আসে, তাদের কী বলে?\n(ক) ধমনি (খ) শিরা\n(গ) কৈশিক নালি (ঘ) লসিকানালি\nউত্তর: খ\n১৭. সূক্ষ্ম শিরা ও উপশিরাগুলো একত্রে মিলে পর্যায়ক্রমে কিসে পরিণত হয়ে হূৎপিণ্ডে ফিরে আসে?\n(ক) কৈশিক জালিকা (খ) মহাশিরা\n(গ) মহাধমনি (ঘ) ধমনিকা\nউত্তর: খ\n১৮. ধমনির তুলনায় শিরার প্রাচীরের গঠন কেমন?\n(ক) বেশি পুরু ও বেশি পেশিময় \n(খ) কম পুরু, কম স্থিতিস্থাপক ও কম পেশিময়\n(গ) অত্যন্ত পুরু ও শক্ত \n(ঘ) কপাটিকাহীন ও অতি সংকুচিত\nউত্তর: খ\n১৯. শিরার নালিপথ ও কপাটিকার বৈশিষ্ট্য কোনটি?\n(ক) নালিপথ একটু চওড়া এবং কপাটিকা থাকে \n(খ) নালিপথ সরু এবং কপাটিকা থাকে না\n(গ) নালিপথ অত্যন্ত সরু এবং কপাটিকা থাকে \n(ঘ) নালিপথ চওড়া এবং কপাটিকা থাকে না\nউত্তর: ক\n২০. কোন শিরাটি ছাড়া অন্য সব শিরা কার্বন ডাই-অক্সাইডসমৃদ্ধ রক্ত পরিবহন করে?\n(ক) যকৃৎ শিরা (খ) ফুসফুসীয় শিরা\n(গ) বৃক্কীয় শিরা (ঘ) ঊর্ধ্ব মহাশিরা\nউত্তর: খ\n২১. ফুসফুসীয় শিরা কোন ধরনের রক্ত ফুসফুস থেকে হূৎপিণ্ডে নিয়ে আসে?\n(ক) কার্বন ডাই-অক্সাইডসমৃদ্ধ রক্ত (খ) অক্সিজেনসমৃদ্ধ রক্ত\n(গ) নাইট্রোজেনযুক্ত রক্ত (ঘ) রক্তরসবিহীন রক্ত\nউত্তর: খ\n২২. পেশিতন্তুতে দেখতে পাওয়া চুলের মতো অতি সূক্ষ্ম রক্তনালিকে কী বলে?\n(ক) উপশিরা (খ) কৈশিক জালিকা\n(গ) মহাধমনি (ঘ) লসিকানালি\nউত্তর: খ\n২৩. ক্ষুদ্রতম ধমনি এবং ক্ষুদ্রতম শিরার মধ্যে সংযোগ সাধন করে কোনটি?\n(ক) মহাশিরা (খ) কৈশিক জালিকা\n(গ) হূৎপিণ্ড (ঘ) ট্রাইকাসপিড ভালভ\nউত্তর: খ\n২৪. ধমনি শাখা-প্রশাখায় বিভক্ত হয়ে ক্রমে সূক্ষ্মতর কৈশিক নালিতে পরিণত হয়ে কাকে পরিবেষ্টন করে রাখে?\n(ক) প্রতিটি অঙ্গকে (খ) প্রতিটি কোষকে\n(গ) প্রতিটি অস্থিকে (ঘ) প্রতিটি স্নায়ুকে\nউত্তর: খ\n২৫. কৈশিক জালিকার প্রাচীর কেমন?\n(ক) অত্যন্ত পুরু (খ) অত্যন্ত পাতলা\n(গ) ত্রিস্তরবিশিষ্ট (ঘ) কপাটিকাযুক্ত\nউত্তর: খ\n২৬. কৈশিক জালিকার পাতলা প্রাচীর ভেদ করে রক্তে দ্রবীভূত সব বস্তু কোন প্রক্রিয়ায় কোষে প্রবেশ করে?\n(ক) অভিস্রবণ (খ) ব্যাপন\n(গ) ইম্বাইবিশন (ঘ) পরিস্রাবণ\nউত্তর: খ"},{"id":"block_1787670328138672bl","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:deepskyblue;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৭. রক্তবাহিকা সম্পর্কে সত্য তথ্য—\ni. এটি হূৎপিণ্ড থেকে দেহে এবং দেহ থেকে হূৎপিণ্ডে রক্ত সংবহন করে\nii. গঠন, আকৃতি ও কাজের ভিত্তিতে এটি $৩$ প্রকার\niii. ধমনি, শিরা ও কৈশিক জালিকা রক্তবাহিকার অন্তর্ভুক্ত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৮. ধমনির (Artery) সাধারণ বৈশিষ্ট্যসমূহ—\ni. এটি সাধারণত অক্সিজেনসমৃদ্ধ রক্ত পরিবহন করে\nii. রক্ত হূৎপিণ্ড থেকে সারাদেহে বহন করে নিয়ে যায়\niii. এর নালিপথে কপাটিকা বিদ্যমান থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৯. ফুসফুসীয় ধমনির ক্ষেত্রে প্রযোজ্য তথ্য—\ni. এটি সাধারণ ধমনির নিয়মের ব্যতিক্রম\nii. এটি কার্বন ডাই-অক্সাইডযুক্ত রক্ত পরিবহন করে\niii. এটি হূৎপিণ্ড থেকে রক্ত ফুসফুসে পৌঁছে দেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩০. ধমনির প্রাচীরের গঠন সংক্রান্ত সত্য তথ্য—\ni. ধমনির প্রাচীর $৩$ স্তরবিশিষ্ট\nii. এর প্রাচীর পুরু ও স্থিতিস্থাপক\niii. এর নালিপথ অত্যন্ত চওড়া\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩১. ধমনির প্রাচীরের স্তরসমূহ ও তাদের উপাদান—\ni. টিউনিকা এক্সটার্না তন্তুময় যোজক কলা দিয়ে তৈরি বাইরের স্তর\nii. টিউনিকা মিডিয়া বৃত্তাকার অনৈচ্ছিক পেশি দিয়ে তৈরি মাঝের স্তর\niii. টিউনিকা ইন্টার্না সরল আবরণী কলা দিয়ে তৈরি ভেতরের স্তর\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩২. নাড়িস্পন্দনের ($Pulse$) মূল কারণ—\ni. ধমনির ভেতরের রক্তপ্রবাহ\nii. ধমনিগাত্রের সংকোচন ও প্রসারণ\niii. ধমনিগাত্রের স্থিতিস্থাপকতা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৩. নাড়িস্পন্দন ($Pulse$) সম্পর্কে সঠিক উক্তি—\ni. এটি হূৎপিণ্ডের প্রতিটি সংকোচনের ফলে ঘটে\nii. ছোট-বড় সব ধমনিতে রক্ত তরঙ্গের মতো প্রবাহিত হয়\niii. হাতের কবজির ধমনির ওপর হাত রেখে এটি অনুভব করা যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৪. শিরা (Vein) সৃষ্টির ক্রম ও প্রবাহ—\ni. কৈশিকনালি থেকে সূক্ষ্ম শিরা ও উপশিরা তৈরি হয়\nii. উপশিরা থেকে অন্তঃপর শিরা ও মহাশিরা সৃষ্টি হয়\niii. মহাশিরার মাধ্যমে রক্ত হূৎপিণ্ডে ফিরে আসে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৫. ধমনি ও শিরার প্রাচীরের তুলনামূলক রূপ—\ni. শিরার প্রাচীর ধমনির চেয়ে কম পুরু ও কম পেশিময়\nii. শিরার প্রাচীর ধমনির চেয়ে কম স্থিতিস্থাপক\niii. শিরার নালিপথ সরু কিন্তু ধমনির নালিপথ চওড়া\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৬. শিরা (Vein)-এর কার্যগত বৈশিষ্ট্য—\ni. দেহের বিভিন্ন অংশ থেকে রক্ত হূৎপিণ্ডে ফিরিয়ে আনে\nii. এর নালিপথে কপাটিকা থাকে\niii. সাধারণত কার্বন ডাই-অক্সাইডসমৃদ্ধ রক্ত পরিবহন করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৭. ফুসফুসীয় শিরার ক্ষেত্রে সত্য—\ni. এটি অন্য সব শিরার নিয়মের ব্যতিক্রম\nii. এটি অক্সিজেনসমৃদ্ধ রক্ত পরিবহন করে\niii. এটি ফুসফুস থেকে রক্ত হূৎপিণ্ডে পৌঁছে দেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৮. কৈশিক জালিকা (Capillaries) সম্পর্কে প্রযোজ্য তথ্য—\ni. এটি পেশিতন্তুতে চুলের মতো অতি সূক্ষ্ম রক্তনালি\nii. এটি ক্ষুদ্রতম ধমনি ও ক্ষুদ্রতম শিরার মধ্যে সংযোগ সাধন করে\niii. এর প্রাচীর পুরু এবং একাধিক পেশি স্তরবিশিষ্ট\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৯. কৈশিক জালিকা ও কোষের পদার্থের আদান-প্রদান—\ni. কৈশিক জালিকার প্রাচীর অত্যন্ত পাতলা\nii. এটি প্রতিটি কোষকে পরিবেষ্টন করে রাখে\niii. রক্তে দ্রবীভূত সব বস্তু ব্যাপন প্রক্রিয়ায় কোষে প্রবেশ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪০. রক্তবাহিকাসমূহে কপাটিকা এবং নালিপথের বৈশিষ্ট্য—\ni. ধমনিতে কোনো কপাটিকা থাকে না এবং নালিপথ সরু\nii. শিরার নালিপথ চওড়া এবং এতে কপাটিকা থাকে\niii. কপাটিকার উপস্থিতির কারণে শিরায় রক্তপ্রবাহের দিক নিয়ন্ত্রিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1787670391704xv9iu","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:chocolate;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৪১ ও ৪২) নং প্রশ্নের উত্তর দাও:   </b> \nহাসান ল্যাবরেটরিতে এক ধরনের রক্তনালির স্লাইড পর্যবেক্ষণ করল যার প্রাচীর $৩$ স্তরবিশিষ্ট এবং প্রাচীরের মধ্যস্তরটি বৃত্তাকার অনৈচ্ছিক পেশি দিয়ে তৈরি। এই রক্তনালির ভেতরে কোনো কপাটিকা নেই এবং এর নালিপথ সরু।\n৪১. উদ্দীপকে বর্ণিত রক্তনালিটি কোনটি?\n(ক) ধমনি (খ) শিরা\n(গ) কৈশিক জালিকা (ঘ) মহাশিরা\nউত্তর: ক\n৪২. উদ্দীপকের রক্তনালিটি সাধারণ নিয়মের ব্যতিক্রম হিসেবে কোন অঙ্গের দিকে কার্বন ডাই-অক্সাইডযুক্ত রক্ত পরিবহন করে?\n(ক) যকৃৎ (খ) ফুসফুস\n(গ) বৃক্ক (ঘ) মস্তিষ্ক\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৩ ও ৪৪) নং প্রশ্নের উত্তর দাও:   </b> \nডাক্তার সাহেব রোগী রফিকের হাতের কবজিতে হাত রেখে একটি নিয়মিত স্পন্দন অনুভব করলেন। তিনি বললেন, হূৎপিণ্ডের প্রতিটি সংকোচনের ফলে একটি বিশেষ রক্তনালিতে রক্ত তরঙ্গের মতো প্রবাহিত হওয়ায় এই স্পন্দন পাওয়া যায়।\n৪৩. উদ্দীপকে ডাক্তার সাহেব রফিকের শরীরে কী অনুভব করলেন?\n(ক) অ্যাগ্লুটিনেশন (খ) নাড়িস্পন্দন\n(গ) হিমোলাইসিস (ঘ) ডায়ালাইসিস\nউত্তর: খ\n৪৪. উদ্দীপকে বর্ণিত স্পন্দন সৃষ্টির প্রধান কারণ কোনটি?\n(ক) শিরার প্রাচীরে কপাটিকার উপস্থিতি \n(খ) ধমনিগাত্রের সংকোচন, প্রসারণ ও স্থিতিস্থাপকতা\n(গ) কৈশিক জালিকার অতি পাতলা প্রাচীর \n(ঘ) রক্তে প্লাজমার পরিমাণ বৃদ্ধি পাওয়া\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৫ ও ৪৬) নং প্রশ্নের উত্তর দাও:   </b> \nদেহের বিভিন্ন অংশের কৈশিক নালিগুলো যুক্ত হয়ে সূক্ষ্ম শিরা, উপশিরা ও সবশেষে মহাশিরা তৈরি করে হূৎপিণ্ডে ফিরে আসে। এসব রক্তনালির প্রাচীর ধমনির তুলনায় কম পুরু ও কম স্থিতিস্থাপক এবং এদের নালিপথে কপাটিকা বিদ্যমান।\n৪৫. উদ্দীপকে বর্ণিত রক্তনালিসমূহ সাধারণত কোন ধরনের রক্ত পরিবহন করে?\n(ক) অক্সিজেনসমৃদ্ধ রক্ত (খ) কার্বন ডাই-অক্সাইডসমৃদ্ধ রক্ত\n(গ) নাইট্রোজেনযুক্ত রক্ত (ঘ) রক্তরসবিহীন রক্ত\nউত্তর: খ\n৪৬. উদ্দীপকে উল্লিখিত রক্তনালিগুলোর মধ্যে কোনটি ব্যতিক্রম হিসেবে ফুসফুস থেকে হূৎপিণ্ডে অক্সিজেনসমৃদ্ধ রক্ত নিয়ে আসে?\n(ক) যকৃৎ শিরা (খ) ফুসফুসীয় শিরা\n(গ) ঊর্ধ্ব মহাশিরা (ঘ) নিম্ন মহাশিরা\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৭ ও ৪৮) নং প্রশ্নের উত্তর দাও:   </b> \nজীববিজ্ঞান ক্লাসে শিক্ষক একটি চিত্র দেখিয়ে বললেন, এটি ধমনি ও শিরার মধ্যবর্তী সংযোগকারী এমন এক ধরনের সূক্ষ্ম রক্তনালি যা পেশিতন্তুতে চুলের মতো বিস্তৃত থাকে। এর প্রাচীর অত্যন্ত পাতলা।\n৪৭. উদ্দীপকে শিক্ষক কোন রক্তনালির কথা বলেছেন?\n(ক) মহাশিরা (খ) কৈশিক জালিকা\n(গ) মহাধমনি (ঘ) উপশিরা\nউত্তর: খ\n৪৮. উদ্দীপকে বর্ণিত রক্তনালিটির পাতলা প্রাচীর ভেদ করে রক্তে দ্রবীভূত প্রয়োজনীয় বস্তু কোষে প্রবেশ করার প্রক্রিয়া কোনটি?\n(ক) অভিস্রবণ (খ) ব্যাপন\n(গ) ইম্বাইবিশন (ঘ) পরিস্রাবণ\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৯ ও ৫০) নং প্রশ্নের উত্তর দাও:   </b> \nরক্তনালির প্রাচীরের গঠন পর্যবেক্ষণ করে দেখা গেল এর সবচেয়ে বাইরের স্তরটি তন্তুময় যোজক কলা দিয়ে তৈরি এবং সবচেয়ে ভেতরের স্তরটি সরল আবরণী কলা দিয়ে তৈরি।\n৪৯. উদ্দীপকে বর্ণিত সবচেয়ে বাইরের স্তরটির ($Tunica\\ externa$) গঠনকারী উপাদান কোনটি?\n(ক) বৃত্তাকার অনৈচ্ছিক পেশি (খ) তন্তুময় যোজক কলা\n(গ) সরল আবরণী কলা (ঘ) তরল যোজক কলা\nউত্তর: খ\n৫০. উদ্দীপকে উল্লিখিত সবচেয়ে ভেতরের স্তরটির নাম কী?\n(ক) টিউনিকা এক্সটার্না (খ) টিউনিকা ইন্টার্না\n(গ) টিউনিকা মিডিয়া (ঘ) এন্ডোকার্ডিয়াম\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫১ ও ৫২) নং প্রশ্নের উত্তর দাও:   </b> \nপরীক্ষাগারে দুটি ভিন্ন রক্তনালি $X$ ও $Y$ পর্যবেক্ষণ করা হলো। দেখা গেল $X$ রক্তনালির নালিপথ চওড়া এবং এতে কপাটিকা রয়েছে, যা রক্তকে একমুখী প্রবাহিত করে। অপরদিকে $Y$ রক্তনালির নালিপথ সরু এবং এতে কোনো কপাটিকা নেই।\n৫১. উদ্দীপকের $X$ চিহ্নিত রক্তনালিটি কোনটি?\n(ক) ধমনি (খ) শিরা\n(গ) কৈশিক নালি (ঘ) লসিকানালি\nউত্তর: খ\n৫২. উদ্দীপকের $Y$ চিহ্নিত রক্তনালি সম্পর্কে কোনটি সঠিক?\n(ক) এটি সাধারণত অক্সিজেনসমৃদ্ধ রক্ত বয়ে নিয়ে যায় \n(খ) এর প্রাচীর কম পুরু ও কম পেশিময়\n(গ) এতে কপাটিকা বিদ্যমান থাকে \n(ঘ) এটি অঙ্গ থেকে রক্ত হূৎপিণ্ডে ফেরত আনে\nউত্তর: ক"}]},{"id":"topic_1787670436340yb5wb","title":"পাঠ-(6.4.4)","blocks":[{"id":"block_17876704982682v5va","type":"text","value":"<span style=\"color:chocolate;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. রক্তপ্রবাহের সময় ধমনির গায়ে যে চাপ সৃষ্টি হয়, তাকে কী বলে?\n(ক) রক্তচাপ (খ) পালস রেট\n(গ) হৃদস্পন্দন (ঘ) রক্ত তঞ্চন\nউত্তর: ক\n২. হৃদপিণ্ডের সংকোচন বা সিস্টোল অবস্থায় ধমনির গায়ে সৃষ্ট রক্তচাপকে কী বলে?\n(ক) ডায়াস্টোলিক চাপ (খ) সিস্টোলিক চাপ\n(গ) নাড়িঘাত চাপ (ঘ) পালস প্রেসার\nউত্তর: খ\n৩. হৃদপিণ্ডের (নিলয়ের) প্রসারণ বা ডায়াস্টোল অবস্থায় ধমনির গায়ে যে রক্তচাপ থাকে তাকে কী বলে?\n(ক) সিস্টোলিক চাপ (খ) ডায়াস্টোলিক চাপ\n(গ) ধমনিঘাত চাপ (ঘ) নাড়িঘাত চাপ\nউত্তর: খ\n৪. হৃদপিণ্ডের কোন অবস্থায় ধমনির গায়ে রক্তচাপের মাত্রা সর্বাধিক থাকে?\n(ক) ডায়াস্টোল অবস্থায় (খ) সিস্টোলিক অবস্থায়\n(গ) অলিন্দের প্রসারণে (ঘ) নিশ্চল অবস্থায়\nউত্তর: খ\n৫. হৃদপিণ্ডের কোন অংশের প্রসারণ অবস্থায় রক্তচাপ সবচেয়ে কম থাকে?\n(ক) অলিন্দের (খ) নিলয়ের\n(গ) কপাটিকার (ঘ) ধমনির\nউত্তর: খ\n৬. চিকিৎসকদের মতে, পরিণত বয়সে একজন মানুষের আদর্শ রক্তচাপ সাধারণত কত?\n(ক) $১০০/৬০\\text{ মিলিমিটার}$ (খ) $১২০/৮০\\text{ মিলিমিটার}$\n(গ) $১৪০/৯০\\text{ মিলিমিটার}$ (ঘ) $৮০/১২০\\text{ মিলিমিটার}$\nউত্তর: খ\n৭. রক্তচাপ পরিমাপের দুই মানের প্রথম সংখ্যাটি কী নির্দেশ করে?\n(ক) ডায়াস্টোলিক চাপ (খ) সিস্টোলিক চাপ\n(গ) পালস চাপ (ঘ) হৃদস্পন্দন রেট\nউত্তর: খ\n৮. রক্তচাপ পরিমাপের দুই মানের দ্বিতীয় সংখ্যাটি কী নির্দেশ করে?\n(ক) সিস্টোলিক চাপ (খ) ডায়াস্টোলিক চাপ\n(গ) ধমনিঘাত চাপ (ঘ) পালস রেট\nউত্তর: খ\n৯. একজন মানুষের কাঙ্ক্ষিত আদর্শ সিস্টোলিক চাপের মান কত?\n(ক) $১২০\\text{ মিলিমিটারের}$ নিচে (খ) $৮০\\text{ মিলিমিটারের}$ নিচে\n(গ) $১০০\\text{ মিলিমিটারের}$ নিচে (ঘ) $১৪০\\text{ মিলিমিটারের}$ নিচে\nউত্তর: ক\n১০. একজন মানুষের কাঙ্ক্ষিত আদর্শ ডায়াস্টোলিক চাপের মান কত?\n(ক) $১২০\\text{ মিলিমিটারের}$ নিচে (খ) $৮০\\text{ মিলিমিটারের}$ নিচে\n(গ) $৯০\\text{ মিলিমিটারের}$ নিচে (ঘ) $৬০\\text{ মিলিমিটারের}$ নিচে\nউত্তর: খ\n১১. রক্তনালিতে ডায়াস্টোলিক চাপ কখন সৃষ্টি হয়?\n(ক) সিস্টোল চলাকালে \n(খ) হৃদপিণ্ডের দুটি বিটের মাঝামাঝি সময়\n(গ) রক্ত সঞ্চালন বন্ধ থাকলে \n(ঘ) প্রতিটি বিটের শুরুতে\nউত্তর: খ\n১২. দুই ধরনের রক্তচাপের (সিস্টোলিক ও ডায়াস্টোলিক) পার্থক্যকে কী বলা হয়?\n(ক) রক্তচাপ (খ) ধমনিঘাত বা নাড়িঘাত চাপ\n(গ) সিস্টোলিক চাপ (ঘ) ডায়াস্টোলিক চাপ\nউত্তর: খ\n১৩. সাধারণ সুস্থ অবস্থায় মানুষের হাতের কবজিতে পালস রেট তথা হৃদস্পন্দনের মান প্রতি মিনিটে কত?\n(ক) $৫০\\text{--}৮০$ (খ) $৬০\\text{--}১০০$\n(গ) $৭০\\text{--}১১০$ (ঘ) $৮০\\text{--}১২০$\nউত্তর: খ\n১৪. রক্তচাপ মাপার যন্ত্রের নাম কী?\n(ক) থার্মোমিটার (খ) স্ফিগমোম্যানোমিটার\n(গ) স্ট্রেথোস্কোপ (ঘ) ব্যালেন্স মিটার\nউত্তর: খ\n১৫. স্ফিগমোম্যানোমিটারকে সংক্ষেপে কী যন্ত্র বলা হয়?\n(ক) ইসিজি যন্ত্র (খ) বিপি যন্ত্র\n(গ) আলট্রাসনোগ্রাম যন্ত্র (ঘ) এক্স-রে যন্ত্র\nউত্তর: খ\n১৬. নিচের কোন শারীরিক অবস্থাটিকে 'নীরব ঘাতক' হিসেবে গণ্য করা হয়?\n(ক) অ্যানিমিয়া (খ) উচ্চ রক্তচাপ\n(গ) অ্যাজমা (ঘ) ডায়াবেটিস\nউত্তর: খ\n১৭. বিশ্ব স্বাস্থ্য সংস্থার রিপোর্ট অনুযায়ী বর্তমানে বিশ্বে এক নম্বর মরণব্যাধি কোনটি?\n(ক) যক্ষ্মা ও ক্যান্সার\n (খ) করোনারি ধমনির রোগ ও স্ট্রোক\n(গ) অ্যাজমা ও অ্যানিমিয়া \n(ঘ) কিডনি রোগ ও ডায়াবেটিস\nউত্তর: খ\n১৮. হৃদরোগ এবং স্ট্রোকের প্রধান কারণ কোনটি?\n(ক) নিম্ন রক্তচাপ (খ) উচ্চ রক্তচাপ\n(গ) কম রক্তকণিকা (ঘ) কম হিমোগ্লোবিন\nউত্তর: খ\n১৯. মানসিক বা স্নায়বিক চাপ ($Tension$) এবং ধূমপানের অভ্যাস কোন শারীরিক সমস্যার সম্ভাবনা বাড়ায়?\n(ক) উচ্চ রক্তচাপ (খ) নিম্ন রক্তচাপ\n(গ) রক্তস্বল্পতা (ঘ) রিকোটাইটিস\nউত্তর: ক\n২০. সন্তান প্রসবের সময় কোন রোগের কারণে মায়ের রক্তচাপ বৃদ্ধি পেতে পারে?\n(ক) থ্যালাসেমিয়া (খ) একলাম্পসিয়া ($Eclampsia$)\n(গ) অ্যানিমিয়া (ঘ) অস্টিওপোরেসিস\nউত্তর: খ\n২১. উচ্চ রক্তচাপের প্রাথমিক লক্ষণ কোনটি?\n(ক) পায়ে পানি আসা \n(খ) মাথাধরা, বিশেষ করে মাথার পিছনের দিকে ব্যথা করা\n(গ) কাশি হওয়া (ঘ) পেট ব্যথা করা\nউত্তর: খ\n২২. উচ্চ রক্তচাপের কারণে আক্রান্ত রোগীর নাকের কী সমস্যা দেখা দিতে পারে?\n(ক) নাক বন্ধ হয়ে যাওয়া (খ) নাক দিয়ে রক্ত পড়া\n(গ) নাক দিয়ে পানি পড়া (ঘ) হাঁচি হওয়া\nউত্তর: খ\n২৩. কত শতাংশ ক্ষেত্রে উচ্চ রক্তচাপ হলে রোগীর দেহে কোনো লক্ষণই প্রকাশ পায় না?\n(ক) প্রায় $২০\\%$ (খ) প্রায় $৫০\\%$\n(গ) প্রায় $৭০\\%$ (ঘ) প্রায় $৯০\\%$\nউত্তর: খ\n২৪. রক্তচাপ নির্ণয়ের জন্য রোগী সোজা হয়ে শুয়ে থাকার পর পরিমাপের মধ্যে কমপক্ষে কত মিনিটের ব্যবধান রাখা ভালো?\n(ক) $১$ থেকে $৫\\text{ মিনিট}$ (খ) $১৫$ থেকে $২০\\text{ মিনিট}$\n(গ) $৩০$ থেকে $৪০\\text{ মিনিট}$ (ঘ) $১$ ঘণ্টা\nউত্তর: খ\n২৫. উচ্চ রক্তচাপ প্রতিরোধের জন্য খাবারে কোনটি গ্রহণ থেকে বিরত থাকা উচিত?\n(ক) টাটকা ফল (খ) অতিরিক্ত কাঁচা লবণ\n(গ) শাকসবজি (ঘ) পর্যাপ্ত পানি\nউত্তর: খ\n২৬. অনিয়ন্ত্রিত উচ্চ রক্তচাপের ফলে মস্তিষ্কে রক্তক্ষরণ ঘটে কোন ব্যাধি সৃষ্টি হতে পারে?\n(ক) হার্ট অ্যাটাক (খ) স্ট্রোক\n(গ) খিঁচুনি (ঘ) নিমোনিয়া\nউত্তর: খ"},{"id":"block_1787670536465kvlf1","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:magenta;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৭. রক্তচাপ ($Blood\\ Pressure$) সম্পর্কিত সঠিক তথ্য—\ni. সিস্টোল অবস্থায় ধমনির গায়ে রক্তচাপের মাত্রা সর্বাধিক থাকে\nii. ডায়াস্টোল অবস্থায় ধমনির গায়ে রক্তচাপ সবচেয়ে কম থাকে\niii. নিলয়ের প্রসারণ অবস্থাকে ডায়াস্টোলিক অবস্থা বলা হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৮. আদর্শ রক্তচাপের মান ও বৈশিষ্ট্য—\ni. একজন মানুষের আদর্শ রক্তচাপ সাধারণত $১২০/৮০\\text{ মিলিমিটার}$ মানের কাছাকাছি\nii. প্রথম মানটি সিস্টোলিক চাপ নির্দেশ করে যার আদর্শ মান $১২০\\text{ মিলিমিটারের}$ নিচে\niii. দ্বিতীয় মানটি ডায়াস্টোলিক চাপ নির্দেশ করে যার আদর্শ মান $৮০\\text{ মিলিমিটারের}$ নিচে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৯. ধমনিঘাত চাপ ($Pulse\\ pressure$) এবং পালস রেট সংক্রান্ত তথ্য—\ni. সিস্টোলিক ও ডায়াস্টোলিক চাপের পার্থক্যকে ধমনিঘাত বা নাড়িঘাত চাপ বলে\nii. ডায়াস্টোলিক চাপ হূৎপিণ্ডের দুটি বিটের মাঝামাঝি সময়ে সৃষ্টি হয়\niii. স্বাভাবিক সুস্থ অবস্থায় হাতের কবজিতে পালস রেট প্রতি মিনিটে $৬০\\text{--}১০০$\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩০. উচ্চ রক্তচাপ ($Hypertension$) সম্পর্কে সত্য উক্তি—\ni. উচ্চ রক্তচাপকে নীরব ঘাতক হিসেবে গণ্য করা হয়\nii. হৃদ্রোগ এবং স্ট্রোকের প্রধান কারণ হলো উচ্চ রক্তচাপ\niii. সিস্টোলিক চাপ $১২০\\text{ মিলিমিটারের}$ নিচে ও ডায়াস্টোলিক চাপ $৮০\\text{ মিলিমিটারের}$ নিচে থাকা কাঙ্ক্ষিত\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩১. উচ্চ রক্তচাপ সৃষ্টির ঝুঁকিপূর্ণ কারণসমূহ—\ni. পরিবারে বা পিতা-মাতার উচ্চ রক্তচাপের ইতিহাস থাকা\nii. মানসিক চাপ ($Tension$), চর্বিযুক্ত খাবার গ্রহণ ও ধূমপানের অভ্যাস\niii. সন্তান প্রসবের সময় মায়ের একলাম্পসিয়া ($Eclampsia$) রোগ হওয়া\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩২. উচ্চ রক্তচাপের লক্ষণসমূহ—\ni. মাথাধরা, বিশেষ করে মাথার পিছনের দিকে ব্যথা করা\nii. বুক ধড়ফড় করা, দুর্বল বোধ করা এবং নাক দিয়ে রক্ত পড়া\niii. প্রায় $৫০\\%$ ক্ষেত্রে উচ্চ রক্তচাপ হলে কোনো লক্ষণই প্রকাশ পায় না\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৩. উচ্চ রক্তচাপ প্রতিরোধ ও প্রতিকারের উপায়—\ni. নিয়মিত শারীরিক পরিশ্রম করা এবং দেহের ওজন নিয়ন্ত্রণে রাখা\nii. খাবারের সাথে অতিরিক্ত কাঁচা লবণ বা কোঁটা লবণ খাওয়া পরিহার করা\niii. টাটকা ফল ও শাক-সবজি খাওয়ার অভ্যাস গড়ে তোলা এবং ধূমপান ত্যাগ করা\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৪. অনিয়ন্ত্রিত উচ্চ রক্তচাপের পরিণতি—\ni. মস্তিষ্কের রক্তনালি ফেটে রক্তক্ষরণ ঘটতে পারে\nii. মস্তিষ্কে রক্তক্ষরণের ফলে রোগী স্ট্রোকে আক্রান্ত হতে পারে\niii. করোনারি ধমনির রোগ এবং হার্ট অ্যাটাকের ঝুঁকি বৃদ্ধি পায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৫. রক্তচাপ নির্ণয় ও পরিমাপ সংক্রান্ত তথ্য—\ni. রক্তচাপ মাপার যন্ত্রকে স্ফিগমোম্যানোমিটার ($Sphygmomanometer$) বা বিপি যন্ত্র বলে\nii. রক্তচাপ নির্ণয়ের পূর্বে রোগীকে কমপক্ষে $১৫$ থেকে $২০\\text{ মিনিটের}$ ব্যবধান রেখে শান্ত হয়ে শুয়ে থাকতে হয়\niii. বিপি যন্ত্রের সাহায্যে সিস্টোলিক ও ডায়াস্টোলিক উভয় চাপই দেখা যায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_17876705836969ijs2","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:chocolate;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </b> \nজনাব রফিক একজন সুস্থ প্রাপ্তবয়স্ক ব্যক্তি। সম্প্রতি চিকিৎসকের কাছে গিয়ে তিনি রক্তচাপ মেপে জানলেন তাঁর রক্তচাপ $১২০/৮০\\text{ মিলিমিটার}$। চিকিৎসক বললেন, ১ম সংখ্যাটি হূৎপিণ্ডের সংকোচনকালের এবং ২য় সংখ্যাটি হূৎপিণ্ডের প্রসারণকালের চাপ নির্দেশ করে।\n৩৬. উদ্দীপক অনুসারে জনাব রফিকের সিস্টোলিক ও ডায়াস্টোলিক চাপের পার্থক্য বা নাড়িঘাত চাপ কত?\n(ক) $২০\\text{ মিলিমিটার}$ (খ) $৪০\\text{ মিলিমিটার}$\n(গ) $৬০\\text{ মিলিমিটার}$ (ঘ) $৮০\\text{ মিলিমিটার}$\nউত্তর: খ\n৩৭. উদ্দীপকে বর্ণিত দ্বিতীয় সংখ্যাটি (ডায়াস্টোলিক চাপ) রক্তনালিতে কখন সৃষ্টি হয়?\n(ক) হূৎপিণ্ডের দুটি বিটের মাঝামাঝি সময়ে \n(খ) অলিন্দের সংকোচনের প্রাক্কালে\n(গ) কেবল রক্ত সঞ্চালন বন্ধ থাকলে \n(ঘ) নাড়িস্পন্দন পরিমাপের পরপরই\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও:   </b> \nআরিফ সাহেবের প্রায়ই মাথার পিছনের দিকে ব্যথা করে, বুক ধড়ফড় করে এবং অল্প পরিশ্রমে হাঁপিয়ে ওঠেন। চিকিৎসকের নিকট গেলে বিপি যন্ত্রের মাধ্যমে পরীক্ষা করে তাঁর রক্তচাপ পাওয়া গেল $১৫০/৯৫\\text{ মিলিমিটার}$।\n৩৮. উদ্দীপকের আরিফ সাহেব কোন শারীরিক সমস্যায় ভুগছেন?\n(ক) উচ্চ রক্তচাপ (খ) নিম্ন রক্তচাপ\n(গ) রক্তস্বল্পতা (ঘ) হৃদকপাটিকার ত্রুটি\nউত্তর: ক\n৩৯. উদ্দীপকে আরিফ সাহেবের উচ্চ রক্তচাপ নির্ণয়ে ব্যবহৃত 'বিপি যন্ত্র'-এর পূর্ণ বৈজ্ঞানিক নাম কী?\n(ক) থার্মোমিটার (খ) স্ফিগমোম্যানোমিটার\n(গ) স্ট্রেথোস্কোপ (ঘ) ব্যালেন্স মিটার\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও:   </b> \nবিশ্ব স্বাস্থ্য সংস্থার রিপোর্ট অনুযায়ী বর্তমানে স্ট্রোক ও করোনারি ধমনির রোগ বিশ্বব্যাপী মারাত্মক আকার ধারণ করেছে। চিকিৎসক সালমা জানান, অনিয়ন্ত্রিত উচ্চ রক্তচাপকে বলা হয় 'নীরব ঘাতক', কারণ প্রায় $৫০\\%$ ক্ষেত্রে কোনো লক্ষণই প্রকাশ পায় না।\n৪০. উদ্দীপক অনুযায়ী অনিয়ন্ত্রিত উচ্চ রক্তচাপের ফলে মস্তিষ্কের রক্তনালি ফেটে গিয়ে কোন ব্যাধি সৃষ্টি হতে পারে?\n(ক) হার্ট অ্যাটাক (খ) স্ট্রোক\n(গ) অ্যানিমিয়া (ঘ) একলাম্পসিয়া\nউত্তর: খ\n৪১. উদ্দীপকে বর্ণিত ব্যাধি ও উচ্চ রক্তচাপের প্রকোপ থেকে বাঁচতে খাবারের সাথে কোনটি গ্রহণ বন্ধ করা উচিত?\n(ক) টাটকা শাকসবজি (খ) কাঁচা বা কোঁটা লবণ\n(গ) ফলমূল (ঘ) পর্যাপ্ত পানি\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও:   </b> \nরাহেলা বেগম সন্তান প্রসবের সময়ে এক বিশেষ রোগে আক্রান্ত হলেন, যার ফলে তাঁর রক্তচাপ অতিরিক্ত বৃদ্ধি পেল। চিকিৎসক জানান, মানসিক চাপ, স্থূলতা, অতিরিক্ত চর্বিযুক্ত খাবার খাওয়া বা বংশগত কারণেও এই সমস্যা হতে পারে।\n৪২. সন্তান প্রসবের সময় উদ্দীপকের রাহেলা বেগমের রক্তচাপ বৃদ্ধির জন্য দায়ী ব্যাধিটির নাম কী?\n(ক) স্ট্রোক (খ) একলাম্পসিয়া\n(গ) ডায়াবেটিস (ঘ) অ্যানিমিয়া\nউত্তর: খ\n৪৩. উদ্দীপক অনুসারে রাহেলা বেগমের সন্তানের ক্ষেত্রে কোন শারীরিক সমস্যাটির সম্ভাবনা বেশি থাকবে?\n(ক) নিম্ন রক্তচাপ (খ) উচ্চ রক্তচাপ\n(গ) রক্তস্বল্পতা (ঘ) খিঁচুনি রোগ\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও:   </b> \nমেডিকেল ক্যাম্পে স্বাস্থ্য পরীক্ষার সময় সজীবের হাতের কবজিতে হালকা চাপ দিয়ে প্রতি মিনিটে হূৎস্পন্দনের মান পাওয়া গেল $৭৫$। এরপর স্ফিগমোম্যানোমিটার দিয়ে তাঁর রক্তচাপ সঠিক নিয়মে মেপে দেখার সিদ্ধান্ত নেওয়া হলো।\n৪৪. উদ্দীপকে সজীবের হাতের কবজিতে মেপে পাওয়া হূৎস্পন্দনের এই মানটিকে কী বলা হয়?\n(ক) রক্তচাপ (খ) পালস রেট\n(গ) ধমনিঘাত চাপ (ঘ) সিস্টোলিক চাপ\nউত্তর: খ\n৪৫. উদ্দীপকে সঠিক নিয়মে রক্তচাপ পরিমাপের পূর্বে সজীবকে কমপক্ষে কত মিনিটের ব্যবধান রেখে শান্তভাবে শুয়ে থাকতে হবে?\n(ক) $১$ থেকে $৫\\text{ মিনিট}$ (খ) $১৫$ থেকে $২০\\text{ মিনিট}$\n(গ) $৩০$ থেকে $৪০\\text{ মিনিট}$ (ঘ) $৪৫$ থেকে $৬০\\text{ মিনিট}$\nউত্তর: খ"}]},{"id":"topic_1787670442052jzsju","title":"পাঠ-(6.4.5)","blocks":[{"id":"block_1787670687495ivu77","type":"text","value":"<span style=\"color:magenta;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. কোলেস্টেরল কোন হাইড্রোকার্বন থেকে উৎপন্ন একটি যৌগ?\n(ক) প্রোপেন (খ) কোলেস্টেইন ($Cholestane$)\n(গ) সাইক্লোহেক্সেন (ঘ) বিউটেন\nউত্তর: খ\n২. উচ্চশ্রেণীর প্রাণিজ কোষের একটি গুরুত্বপূর্ণ উপাদান কোনটি?\n(ক) সেলুলোজ (খ) কোলেস্টেরল\n(গ) কাইটিন (ঘ) পেকটিন\nউত্তর: খ\n৩. কোলেস্টেরল রক্তে কী নামক যৌগ সৃষ্টির মাধ্যমে প্রবাহিত হয়?\n(ক) লিপোপ্রোটিন (খ) হিমোগ্লোবিন\n(গ) গ্লাইকোপ্রোটিন (ঘ) ফসফোলিপিড\nউত্তর: ক\n৪. মানব রক্তে কয় ধরনের লিপোপ্রোটিন দেখা যায়?\n(ক) $২$ ধরনের (খ) $৩$ ধরনের\n(গ) $৪$ ধরনের (ঘ) $৫$ ধরনের\nউত্তর: খ\n৫. $LDL$-এর পূর্ণরূপ কী?\n(ক) Low Density Lipoprotein \n(খ) Low Density Lipid\n(গ) Light Density Lipoprotein \n(ঘ) Level Density Lipoprotein\nউত্তর: ক\n৬. রক্তে কোন লিপোপ্রোটিনকে 'খারাপ কোলেস্টেরল' বলা হয়?\n(ক) $HDL$ (খ) $LDL$\n(গ) ট্রাই-গ্লিসারাইড (ঘ) কোলেস্টেইন\nউত্তর: খ\n৭. সাধারণত আমাদের রক্তে কত শতাংশ $LDL$ থাকে?\n(ক) $৫০\\%$ (খ) $৬০\\%$\n(গ) $৭০\\%$ (ঘ) $৮০\\%$\nউত্তর: গ\n৮. $HDL$-এর পূর্ণরূপ কী?\n(ক) High Density Lipoprotein \n(খ) Heavy Density Lipoprotein\n(গ) High Density Lipid \n(ঘ) High Density Level\nউত্তর: ক\n৯. রক্তে কোন লিপোপ্রোটিনকে সাধারণত 'ভালো কোলেস্টেরল' বলা হয়?\n(ক) $LDL$ (খ) $HDL$\n(গ) ট্রাই-গ্লিসারাইড (ঘ) কোলেস্টেইন\nউত্তর: খ\n১০. ট্রাই-গ্লিসারাইড কোলেস্টেরল চর্বি হিসেবে রক্তের কোথায় অবস্থান করে?\n(ক) লোহিত কণিকায় (খ) রক্তের প্লাজমায়\n(গ) শ্বেত কণিকায় (ঘ) অনুচক্রিকায়\nউত্তর: খ\n১১. ট্রাই-গ্লিসারাইড আমাদের খাদ্যের কোন উপাদান থেকে তৈরি হয়?\n(ক) প্রাণিজ চর্বি অথবা কার্বোহাইড্রেট (খ) শুধুমাত্র ভিটামিন\n(গ) খনিজ লবণ ও পানি (ঘ) সেলুলোজ\nউত্তর: ক\n১২. রক্তে $LDL$-এর আদর্শ মান কত?\n(ক) $< ১.৮\\text{ মিলিফোল/লিটার}$ \n(খ) $> ১.৫\\text{ মিলিফোল/লিটার}$\n(গ) $< ১.৭\\text{ মিলিফোল/লিটার}$ \n(ঘ) $> ২.০\\text{ মিলিফোল/লিটার}$\nউত্তর: ক\n১৩. রক্তে $HDL$-এর আদর্শ মান কত?\n(ক) $< ১.৮\\text{ মিলিফোল/লিটার}$ \n(খ) $> ১.৫\\text{ মিলিফোল/লিটার}$\n(গ) $< ১.৭\\text{ মিলিফোল/লিটার}$ \n(ঘ) $> ২.৫\\text{ মিলিফোল/লিটার}$\nউত্তর: খ\n১৪. রক্তে ট্রাই-গ্লিসারাইডের আদর্শ মান কত?\n(ক) $< ১.৮\\text{ মিলিফোল/লিটার}$ \n(খ) $> ১.৫\\text{ মিলিফোল/লিটার}$\n(গ) $< ১.৭\\text{ মিলিফোল/লিটার}$ \n(ঘ) $> ১.৮\\text{ মিলিফোল/লিটার}$\nউত্তর: গ\n১৫. অধিক মাত্রার কোলেস্টেরল উপস্থিত এমন খাবার কোনটি?\n(ক) শাকসবজি (খ) ডিমের কুসুম\n(গ) চাল (ঘ) ফলমূল\nউত্তর: খ\n১৬. হূৎপিণ্ডের করোনারি ধমনিগাত্রে চর্বি জমা হয়ে রক্ত চলাচল কমে গেলে বুকে যে ব্যথা অনুভূত হয় তাকে কী বলে?\n(ক) অ্যানজিনা ($Angina$) (খ) স্ট্রোক\n(গ) অ্যাজমা (ঘ) আলসার\nউত্তর: ক\n১৭. কোনটি প্রতি কোষের ভেদ্যতা ($Permeability$) নির্ণয় করে বিভিন্ন দ্রব্যাদি কোষে প্রবেশ নিয়ন্ত্রণ করে?\n(ক) কোলেস্টেরল (খ) গ্লুকোজ\n(গ) শ্বেত রক্তকণিকা (ঘ) প্লেটলেট\nউত্তর: ক\n১৮. মানবদেহের জনন হরমোন এনড্রোজেন ও ইস্ট্রোজেন তৈরিতে কোনটি সাহায্য করে?\n(ক) ইনসুলিন (খ) কোলেস্টেরল\n(গ) থাইরক্সিন (ঘ) পিত্ত লবণ\nউত্তর: খ\n১৯. সূর্যালোকের উপস্থিতিতে চামড়ার কোলেস্টেরল থেকে কোন ভিটামিন তৈরি হয়?\n(ক) ভিটামিন 'এ' (খ) ভিটামিন 'ডি'\n(গ) ভিটামিন 'ই' (ঘ) ভিটামিন 'কে'\nউত্তর: খ\n২০. ভিটামিন 'ডি' চামড়ায় তৈরি হওয়ার পর রক্তের মাধ্যমে কোথায় গিয়ে কার্যকর রূপে পরিণত হয়?\n(ক) যকৃতে (খ) কিডনিতে\n(গ) হূৎপিণ্ডে (ঘ) পাকস্থলীতে\nউত্তর: খ\n২১. স্নেহে বা চর্বিতে দ্রবণীয় ভিটামিন কোনগুলো, যা বিপাকে কোলেস্টেরল সাহায্য করে?\n(ক) বি ও সি (খ) এ, ডি, ই এবং কে\n(গ) এ ও বি (ঘ) সি ও ডি\nউত্তর: খ\n২২. পিত্তরসের অন্যতম উপাদান হলেও এটি একটি বর্জ্য পদার্থ এবং কিসের মাধ্যমে দেহ থেকে অপসারিত হয়?\n(ক) লালাগ্রন্থি (খ) যকৃৎ\n(গ) অগ্ন্যাশয় (ঘ) বৃক্ক\nউত্তর: খ\n২৩. পিত্তরসে কোলেস্টেরলের মাত্রা বেড়ে গেলে তা তলাণির মতো জমা হয়ে শক্ত হলে তাকে কী বলে?\n(ক) কিডনির পাথর \n(খ) পিত্থথলির পাথর ($Gallbladder\\ stone$)\n(গ) অ্যাপেন্ডিসাইটিস (ঘ) অ্যানজিনা\nউত্তর: খ\n২৪. কোলেস্টেরল ছাড়াও আর কোন উপাদানগুলো জমে পিত্তথলির পাথর হতে পারে?\n(ক) পিত্ত, ফসফেট, ক্যালসিয়াম \n(খ) গ্লুকোজ, শ্বেতকণিকা, পিত্ত\n(গ) সোডিয়াম, ইউরিয়া, কাইটিন \n(ঘ) আয়রন, তামা, পটাসিয়াম\nউত্তর: ক"},{"id":"block_17876707391208fpyk","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:magenta;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৫. কোলেস্টেরল সম্পর্কে সঠিক তথ্য—\ni. এটি কোলেস্টেইন ($Cholestane$) থেকে উৎপন্ন একটি হাইড্রোকার্বন যৌগ\nii. এটি উচ্চশ্রেণীর প্রাণিজ কোষের একটি গুরুত্বপূর্ণ উপাদান\niii. এটি রক্তে লিপোপ্রোটিন নামক যৌগ সৃষ্টির মাধ্যমে প্রবাহিত হয়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৬. লিপোপ্রোটিনের প্রকারভেদ সম্পর্কিত তথ্য—\ni. $LDL$ হৃদরোগের ঝুঁকি বাড়ায় বিধায় এটি খারাপ কোলেস্টেরল\nii. $HDL$ হৃদরোগের ঝুঁকি কমায় বিধায় এটি ভালো কোলেস্টেরল\niii. ট্রাই-গ্লিসারাইড চর্বি হিসেবে রক্তের প্লাজমায় অবস্থান করে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৭. $LDL$ ও ট্রাই-গ্লিসারাইড সংক্রান্ত সত্য উক্তি—\ni. আমাদের রক্তে সাধারণত $৭০\\%$ $LDL$ থাকে\nii. ট্রাই-গ্লিসারাইড কেবল খাদ্যের উদ্ভিদজাত শর্করা থেকে তৈরি হয়\niii. ব্যক্তিবিশেষে রক্তে $LDL$-এর পরিমাণের পার্থক্য দেখা যায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: খ\n২৮. রক্তে কোলেস্টেরলের আদর্শ মান—\ni. $LDL$-এর মান $< ১.৮\\text{ মিলিফোল/লিটার}$\nii. $HDL$-এর মান $> ১.৫\\text{ মিলিফোল/লিটার}$\niii. ট্রাই-গ্লিসারাইডের মান $< ১.৭\\text{ মিলিফোল/লিটার}$\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৯. যেসব খাদ্যে অধিক মাত্রার কোলেস্টেরল থাকে—\ni. মাখন ও ডিমের কুসুম\nii. চিংড়ি, ঝিনুক ও গবাদিপশুর যকৃৎ\niii. টাটকা ফলমূল ও শাকসবজি\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩০. রক্তে উচ্চ কোলেস্টেরলজনিত শারীরিক সমস্যা—\ni. করোনারি ধমনিগাত্রে চর্বি জমে রক্তপ্রবাহ বিঘ্নিত হয়\nii. হূৎপিণ্ডে পর্যাপ্ত অক্সিজেন সরবরাহের অভাবে বুকে ব্যথা বা অ্যানজিনা দেখা দেয়\niii. করোনারি হৃদরোগের আশঙ্কা বৃদ্ধি পায়\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩১. কোলেস্টেরলের শারীরিক উপকারিতা সংক্রান্ত তথ্য—\ni. এটি প্রতিটি কোষের ভেদ্যতা ($Permeability$) নির্ণয় করে\nii. এটি স্নায়ুকোষের কার্যকারিতা বজায় রাখতে সাহায্য করে\niii. এটি দেহের রোগ প্রতিরোধ ব্যবস্থার সাথে ঘনিষ্ঠভাবে জড়িত\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩২. হরমোন ও পিত্তরস সংশ্লেষে কোলেস্টেরলের ভূমিকা—\ni. মানবদেহের এনড্রোজেন ও ইস্ট্রোজেন তৈরিতে সাহায্য করে\nii. অ্যাড্রেনাল গ্রন্থির হরমোন তৈরিতে ভূমিকা রাখে\niii. পিত্তরস তৈরিতে কোলেস্টেরলের বিশেষ ভূমিকা রয়েছে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৩. ভিটামিন 'ডি' এবং কোলেস্টেরল সম্পর্কিত তথ্য—\ni. সূর্লোকের উপস্থিতিতে চামড়ার কোলেস্টেরল থেকে ভিটামিন 'ডি' তৈরি হয়\nii. এই ভিটামিন 'ডি' রক্তের মাধ্যমে কিডনিতে গিয়ে কার্যকর রূপে পরিণত হয়\niii. কোলেস্টেরল পানিতে দ্রবণীয় ভিটামিন বিপাকে সাহায্য করে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৪. চর্বিতে দ্রবণীয় ভিটামিন যা বিপাকে কোলেস্টেরল সাহায্য করে—\ni. ভিটামিন 'এ' ও ভিটামিন 'ডি'\nii. ভিটামিন 'ই' ও ভিটামিন 'কে'\niii. ভিটামিন 'বি' ও ভিটামিন 'সি'\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৫. পিত্তথলির পাথর ($Gallbladder\\ stone$) সংক্রান্ত তথ্য—\ni. পিত্তরসে কোলেস্টেরলের মাত্রা বেড়ে গেলে তা পিত্তথলিতে তলানি হিসেবে জমা হয়\nii. পিত্তরসের বর্জ্য কোলেস্টেরল যকৃতের মাধ্যমে দেহ থেকে অপসারিত হয়\niii. পিত্ত, ফসফেট ও ক্যালসিয়াম জমেও পিত্তথলির পাথর গঠিত হতে পারে\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1787670783093xvgid","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:darkgreen;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩৬ ও ৩৭) নং প্রশ্নের উত্তর দাও:   </b> \nরহিম সাহেব রক্ত পরীক্ষা করিয়ে জানতে পারলেন তাঁর রক্তে এমন এক ধরনের লিপোপ্রোটিনের পরিমাণ বেশি যা হৃদ্রোগের ঝুঁকি বাড়ায়। অন্যদিকে তাঁর শরীরে অন্য এক প্রকার লিপোপ্রোটিনের মাত্রা সন্তোষজনক, যা হৃদ্রোগের ঝুঁকি কমায়।\n৩৬. উদ্দীপকে উল্লিখিত হৃদ্রোগের ঝুঁকি বাড়ানো 'খারাপ কোলেস্টেরল' কোনটি?\n(ক) $HDL$ (খ) $LDL$\n(গ) ট্রাই-গ্লিসারাইড (ঘ) কোলেস্টেইন\nউত্তর: খ\n৩৭. একজন সুস্থ ব্যক্তির রক্তে উদ্দীপকের $HDL$-এর আদর্শ মান কত হওয়া কাঙ্ক্ষিত?\n(ক) $< ১.৮\\text{ মিলিমোল/লিটার}$ \n(খ) $> ১.৫\\text{ মিলিমোল/লিটার}$\n(গ) $< ১.৭\\text{ মিলিমোল/লিটার}$ \n(ঘ) $> ২.৫\\text{ মিলিমোল/লিটার}$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৩৭ ও ৩৯) নং প্রশ্নের উত্তর দাও:   </b> \nশাহীন দীর্ঘদিন ধরে অতিরিক্ত মাখন, ডিমের কুসুম ও গবাদিপশুর যকৃৎ খেয়ে আসছেন। সম্প্রতি তিনি বুকে ব্যথা অনুভব করলে ডাক্তার জানান, তাঁর হূৎপিণ্ডের করোনারি ধমনিগাত্রে চর্বি জমা হয়ে রক্তপ্রবাহ ক্ষতিগ্রস্ত হয়েছে।\n৩৮. উদ্দীপকে রক্তপ্রবাহ কমে যাওয়ার কারণে শাহীনের বুকে যে বিশেষ ব্যথা অনুভূত হয় তাকে কী বলে?\n(ক) অ্যানজিনা ($Angina$) (খ) স্ট্রোক\n(গ) একলাম্পসিয়া (ঘ) অ্যানিমিয়া\nউত্তর: ক\n৩৯. উদ্দীপকে শাহীনের ভক্ষিত খাদ্যের কোন উপাদানটির কারণে ধমনিগাত্রে চর্বি জমেছিল?\n(ক) সেলুলোজ (খ) কোলেস্টেরল\n(গ) হিমোগ্লোবিন (ঘ) কাইটিন\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও:   </b> \nসূর্যালোকের উপস্থিতিতে সুমনের ত্বকের এক বিশেষ উপাদান থেকে একটি ভিটামিন তৈরি হলো, যা রক্তের মাধ্যমে বৃক্কে পৌঁছে তার কার্যকর রূপ ধারণ করল। এছাড়া উক্ত উপাদানটি পুরুষ ও স্ত্রীর জনন হরমোন এনড্রোজেন ও ইস্ট্রোজেন তৈরিতেও সাহায্য করে।\n৪০. উদ্দীপকে সুমনের ত্বকের কোন উপাদানটি সূর্লোকের উপস্থিতিতে ভিটামিন তৈরি করেছিল?\n(ক) কোলেস্টেরল (খ) কেরাটিন\n(গ) মেলানিন (ঘ) সেলুলোজ\nউত্তর: ক\n৪১. উদ্দীপকে প্রস্তুতকৃত ভিটামিন 'ডি' ছাড়া উদ্দীপকের উপাদানটি আর কোন চর্বিতে দ্রবণীয় ভিটামিন বিপাকে সাহায্য করে?\n(ক) ভিটামিন 'বি' ও 'সি' (খ) ভিটামিন 'এ', 'ই' ও 'কে'\n(গ) কেবল ভিটামিন 'সি' (ঘ) কেবল ভিটামিন 'বি'\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও:   </b> \nযকৃৎ থেকে উৎপন্ন একটি বর্জ্য উপাদান পিত্তরসের সাথে মিশে দেহ থেকে অপসারিত হয়। তবে পিত্তরসে উপাদানটির মাত্রা বেড়ে গেলে তা পিত্তথলিতে তলাণির মতো জমা হয়ে শক্ত রূপ ধারণ করে বিশেষ জটিলতা সৃষ্টি করে।\n৪২. উদ্দীপকে পিত্তথলিতে তলানি জমা হয়ে শক্ত হওয়া উপাদানটির নাম কী?\n(ক) গ্লুকোজ (খ) কোলেস্টেরল\n(গ) ইউরিয়া (ঘ) ক্রিয়েটিনিন\nউত্তর: খ\n৪৩. উদ্দীপকে বর্ণিত পাথর ($Gallbladder\\ stone$) তৈরি হতে কোলেস্টেরল ছাড়া আর কোন উপাদানগুলো জমা হতে পারে?\n(ক) পিত্ত, ফসফেট ও ক্যালসিয়াম \n(খ) আয়রন, তামা ও জিঙ্ক\n(গ) ল্যাকটেট, কাইটিন ও পেকটিন \n(ঘ) পোটাসিয়াম, নাইট্রেট ও ক্লোরাইড\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও:   </b> \nপরীক্ষাগারে স্যাম্পল বিশ্লেষণ করে দেখা গেল রক্তের প্লাজমায় চর্বি হিসেবে এক ধরনের বিশেষ লিপোপ্রোটিন অবস্থান করছে। এটি প্রধানত আমাদের খাদ্যের প্রাণিজ চর্বি বা কার্বোহাইড্রেট থেকে তৈরি হয়।\n৪৪. উদ্দীপকে রক্তের প্লাজমায় অবস্থানকারী লিপোপ্রোটিনটির নাম কী?\n(ক) $LDL$ (খ) ট্রাই-গ্লিসারাইড ($Tryglyceride$)\n(গ) $HDL$ (ঘ) কোলেস্টেইন ($Cholestane$)\nউত্তর: খ\n৪৫. রক্তে উদ্দীপকের উপাদানটির আদর্শ মান কত হওয়া উচিত?\n(ক) $< ১.৮\\text{ মিলিমোল/লিটার}$ \n(খ) $< ১.৭\\text{ মিলিমোল/লিটার}$\n(গ) $> ১.৫\\text{ মিলিমোল/লিটার}$ \n(ঘ) $> ২.০\\text{ মিলিমোল/লিটার}$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৬ ও ৪৭) নং প্রশ্নের উত্তর দাও:   </b> \nপ্রাণিবিজ্ঞানের শিক্ষক ক্লাসে বললেন, উচ্চশ্রেণীর প্রাণিজ কোষে এমন একটি উপাদান থাকে যা কোষপ্রাচীর তৈরি ও রক্ষা করে, প্রতিটি কোষের ভেদ্যতা ($Permeability$) নির্ণয় করে এবং অ্যাড্রেনাল গ্রন্থির হরমোন তৈরিতে ভূমিকা রাখে।\n৪৬. উদ্দীপকে বর্ণিত উপাদানটি কোন হাইড্রোকার্বন থেকে উৎপন্ন হয়?\n(ক) বিউটেন (খ) কোলেস্টেইন ($Cholestane$)\n(গ) প্রোপেন (ঘ) মিথেন\nউত্তর: খ\n৪৭. উদ্দীপকের উপাদানটি কোন শারীরবৃত্তীয় ব্যবস্থার সাথে ঘনিষ্ঠভাবে জড়িত?\n(ক) রেচন ব্যবস্থা (খ) রোগ প্রতিরোধ ব্যবস্থা\n(গ) কঙ্কাল ব্যবস্থা (ঘ) পেশি ব্যবস্থা\nউত্তর: খ"}]},{"id":"topic_1787670831965wmjt3","title":"পাঠ-(6.4.6 – 6.5)","blocks":[{"id":"block_1787670885493utxdy","type":"text","value":"<span style=\"color:darkgreen;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. ভ্রূণ অবস্থায় মানবদেহের লোহিত রক্তকণিকা কোথায় উৎপন্ন হয়?\n(ক) যকৃৎ ও প্লীহা (খ) লাল অস্থিমজ্জা\n(গ) থাইমাস ও লসিকানালি (ঘ) অগ্ন্যাশয় ও বৃক্ক\nউত্তর: ক\n২. শিশুদের জন্মের পর থেকে লোহিত রক্তকণিকা প্রধানত কোথায় উৎপন্ন হয়?\n(ক) যকৃৎ (খ) লাল অস্থিমজ্জা\n(গ) প্লীহা (ঘ) হূৎপিণ্ড\nউত্তর: খ\n৩. লোহিত রক্তকণিকা প্রধানত দেহে কোন গ্যাস সরবরাহের কাজ করে?\n(ক) $CO_2$ (খ) $O_2$\n(গ) $N_2$ (ঘ) $H_2$\nউত্তর: খ\n৪. অস্থিমজ্জা অত্যধিক হারে শ্বেত রক্তকণিকা উৎপাদন করলে পর্যায়ক্রমে কোন কণিকাগুলোর উৎপাদন কমে যায়?\n(ক) লোহিত রক্তকণিকা ও অনুচক্রিকা \n(খ) অণুজীব ও প্লাজমা\n(গ) অ্যান্টিবডি ও অ্যান্টিজেন \n(ঘ) লসিকা ও অণুচক্রিকা\nউত্তর: ক\n৫. লিউকেমিয়া রোগের ক্ষেত্রে প্রধানত দেহের কোন অঙ্গটি আক্রান্ত হয়?\n(ক) যকৃৎ (খ) অস্থিমজ্জা\n(গ) বৃক্ক (ঘ) ফুসফুস\nউত্তর: খ\n৬. লিউকেমিয়া রোগে লোহিত রক্তকণিকার অভাবে নিচের কোনটি ঘটে?\n(ক) শরীরের স্থান বিশেষে রক্তক্ষরণ \n(খ) অক্সিজেনের ঘাটতি ও শ্বাসকষ্ট\n(গ) উচ্চ রক্তচাপ (ঘ) রক্তচাপ বৃদ্ধি পাওয়া\nউত্তর: খ\n৭. লিউকেমিয়া রোগে কোন কণিকার অভাবে আঘাত ছাড়াই নাক বা মাড়ি থেকে রক্তক্ষরণ হয়?\n(ক) লোহিত রক্তকণিকা (খ) শ্বেত রক্তকণিকা\n(গ) অনুচক্রিকা (ঘ) প্লাজমা\nউত্তর: গ\n৮. বিশ্ব স্বাস্থ্য সংস্থার শ্রেণিবিন্যাস অনুসারে লিউকেমিয়া কত প্রকারের রয়েছে?\n(ক) $২০$-র বেশি (খ) $৩০$-র বেশি\n(গ) অর্ধশতাধিক (ঘ) শতাধিক\nউত্তর: গ\n৯. লিউকেমিয়া আক্রান্ত রোগীর অতিরিক্ত শ্বেত রক্তকণিকাগুলো বস্তুত কী হিসেবে কাজ করে?\n(ক) ক্যান্সার কোষ (খ) অ্যান্টিবডি\n(গ) প্যাথোজেন (ঘ) হরমোন\nউত্তর: ক\n১০. লিউকেমিয়া রোগের চিকিৎসায় প্রধানত কোন পদ্ধতিগুলো ব্যবহৃত হয়?\n(ক) কেমোথেরাপি ও অস্থিমজ্জা প্রতিস্থাপন \n(খ) অ্যান্টিবায়োটিক ও ইনসুলিন\n(গ) ডায়ালাইসিস ও অস্ত্রোপচার \n(ঘ) ইসিজি ও এনজিওপ্লাস্টি\nউত্তর: ক\n১১. বর্তমানে বাংলাদেশের কোন সরকারি হাসপাতালে অস্থিমজ্জা প্রতিস্থাপনের ব্যবস্থা আছে?\n(ক) সলিমুল্লাহ মেডিকেল কলেজ \n(খ) ঢাকা মেডিকেল কলেজ হাসপাতাল\n(গ) চট্টগ্রাম মেডিকেল কলেজ \n(ঘ) রাজশাহী মেডিকেল কলেজ\nউত্তর: খ\n১২. হৃদপিণ্ডের কোষ বা হৃদপেশি ক্ষতিগ্রস্ত হওয়ার ফলে সৃষ্ট মায়োকার্ডিয়াল ইনফার্কশন বা করোনারি থ্রম্বোসিসকে একসাথে কী বলা হয়?\n(ক) হার্ট অ্যাটাক (খ) স্ট্রোক\n(গ) বাতজ্বর (ঘ) লিউকেমিয়া\nউত্তর: ক\n১৩. হৃদপিণ্ডের নিজের কাজের জন্য হৃদপেশিতে অক্সিজেন ও পুষ্টি সরবরাহকারী প্রধান রক্তনালি কয়টি?\n(ক) $২$ টি (খ) $৩$ টি\n(গ) $৪$ টি (ঘ) $৫$ টি\nউত্তর: খ\n১৪. করোনারি রক্তনালিতে কোনটি জমা হওয়ার ফলে রক্ত চলাচলে বাধা সৃষ্টি হয়ে হার্ট অ্যাটাক হয়?\n(ক) ক্যালসিয়াম (খ) চর্বি\n(গ) গ্লুকোজ (ঘ) প্রোটিন\nউত্তর: খ\n১৫. বর্তমানে কত বছর বয়সী সুস্থ লোকেরাও হার্ট অ্যাটাকে আক্রান্ত হচ্ছে?\n(ক) $২০\\text{--}৩০$ বছর (খ) $৩০\\text{--}৪০$ বছর\n(গ) $৪০\\text{--}৬০$ বছর (ঘ) $৬০\\text{--}৮০$ বছর\nউত্তর: গ\n১৬. হার্ট অ্যাটাকের প্রাথমিক ব্যথা অ্যানটাসিড ওষুধ খেলেও সাধারণত কেমন হয়?\n(ক) সঙ্গে সঙ্গে কমে যায় (খ) কমে না\n(গ) বৃদ্ধি পেয়ে থেমে যায় (ঘ) মাথা ব্যথায় রূপ নেয়\nউত্তর: খ\n১৭. কোন রোগে আক্রান্ত রোগীদের ক্ষেত্রে কোনো ধরনের ব্যথা ছাড়াই হার্ট অ্যাটাক হতে পারে?\n(ক) হাঁপানি (খ) ডায়াবেটিস\n(গ) বাতজ্বর (ঘ) লিউকেমিয়া\nউত্তর: খ\n১৮. হার্ট অ্যাটাক সন্দেহ হলে রোগীকে অবহেলা না করে দ্রুত কোনটি করানো দরকার?\n(ক) এক্স-রে (খ) ইসিজি ($ECG$)\n(গ) সিটি স্ক্যান (ঘ) এনজিওগ্রাম\nউত্তর: খ\n১৯. বাতজ্বর ($Rheumatic\\ Fever$) কোন অণুজীবের সংক্রমণে সৃষ্টি হয়?\n(ক) Streptococcus (খ) Salmonella\n(গ) Vibrio (ঘ) Penicillium\nউত্তর: ক\n২০. বাতজ্বরের প্রাদুর্ভাব সাধারণত কাদের মধ্যে বেশি দেখা যায়?\n(ক) বৃদ্ধদের (খ) শিশুদের\n(গ) কিশোরদের (ঘ) প্রাপ্তবয়স্কদের\nউত্তর: খ\n২১. স্ট্রেপ্টোকক্কাস অণুজীবের সংক্রমণে শুরুতে শরীরের কোন অঙ্গগুলোতে প্রদাহ সৃষ্টি হয়?\n(ক) শ্বাসনালি, টনসিল ও ফুসফুস (খ) যকৃৎ ও বৃক্ক\n(গ) পাকস্থলী ও ক্ষুদ্রান্ত্র (ঘ) চোখ ও মস্তিষ্ক\nউত্তর: ক\n২২. বাতজ্বর হৃদপিণ্ডে সম্পূর্ণভাবে আক্রমণ করলে প্রধানত কোন অংশটি ক্ষতিগ্রস্ত হয়?\n(ক) মহাধমনি (খ) হৃদপেশি ও কপাটিকা\n(গ) মহাশিরার প্রাচীর (ঘ) পেরিকার্ডিয়াম\nউত্তর: খ\n২৩. বাতজ্বরের প্রাথমিক পর্যায়ে কোন জাতীয় ওষুধ ব্যবহারে রোগের সংক্রমণ থেকে রেহাই পাওয়া যায়?\n(ক) প্যারাসিটামল (খ) পেনিসিলিন\n(গ) অ্যানটাসিড (ঘ) অ্যান্টিহিস্টামিন\nউত্তর: খ\n২৪. চিকিৎসকেরা বাতজ্বরে আক্রান্ত রোগীদের কত বছর বয়স না পৌঁছানো পর্যন্ত নিয়মিত পেনিসিলিন খাওয়ার পরামর্শ দেন?\n(ক) $১৫$ বছর (খ) $১৮$ বছর\n(গ) $২১$ বছর (ঘ) $২৫$ বছর\nউত্তর: গ\n২৫. সিগারেটের তামাক বা জর্দার কোন উপাদানটি হৃদপেশির ক্ষতি করে?\n(ক) নিকোটিন (খ) ক্যাফেইন\n(গ) মরফিন (ঘ) ট্যানিন\nউত্তর: ক\n২৬. কিসের সেবনে হৃদযন্ত্রের ক্রিয়া ও স্পন্দন স্বাভাবিক মান থেকে বৃদ্ধি পায়?\n(ক) ভিটামিন (খ) মাদক\n(গ) শর্করা (ঘ) পিত্তরস\nউত্তর: খ"},{"id":"block_1787670921152u2bl8","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:darkgreen;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৭. লোহিত রক্তকণিকা সৃষ্টির স্থান ও কাজ—\ni. ভ্রূণ অবস্থায় যকৃৎ ও প্লীহায় উৎপন্ন হয়\nii. শিশুদের জন্মের পর থেকে প্রধানত লাল অস্থিমজ্জায় উৎপন্ন হয়\niii. এটি দেহে প্রধানত $O_2$ সরবরাহের কাজ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৮. লিউকেমিয়া রোগের লক্ষণসমূহ—\ni. লোহিত রক্তকণিকার অভাবে অক্সিজেনের ঘাটতি, দুর্বলতা ও শ্বাসকষ্ট হয়\nii. অনুচক্রিকার অভাবে ত্বক, মাড়ি ও নাকে আঘাত ছাড়াই রক্তক্ষরণ হয়\niii. রোগ প্রতিরোধ ক্ষমতা হ্রাস পায় এবং লসিকাগন্থি ফুলে যেতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৯. লিউকেমিয়া রোগের বৈশিষ্ট্য ও চিকিৎসা—\ni. এটি মূলত অস্থিমজ্জার রোগ\nii. বিশ্ব স্বাস্থ্য সংস্থার শ্রেণিবিন্যাস অনুসারে এটি অর্ধশতাধিক প্রকারের\niii. এর চিকিৎসায় কেমোথেরাপি ও অস্থিমজ্জা প্রতিস্থাপন করা হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩০. হার্ট অ্যাটাকের ঝুঁকির কারণসমূহ—\ni. করোনারি রক্তনালিতে চর্বি জমা হয়ে রক্তপ্রবাহ বাধাগ্রস্ত হওয়া\nii. রক্তে গ্লুকোজের মাত্রা অনিয়ন্ত্রিত থাকা ও অলস জীবনযাপন করা\niii. অনবরত হতাশা, দুশ্চিন্তাগ্রস্ত ও বিমর্ষ থাকা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩১. হার্ট অ্যাটাকের লক্ষণসমূহ—\ni. বুকে অসহনীয় ব্যথা ও তা বাঁ হাতে ছড়িয়ে পড়া\nii. রোগী প্রচুুর ঘামতে থাকা এবং বুকে ভারি চাপ অনুভব করা\niii. ডায়াবেটিস রোগীদের ক্ষেত্রে বুকে ব্যথা ছাড়াও হার্ট অ্যাটাক হতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩২. হার্ট অ্যাটাক প্রতিরোধ ও প্রতিকার—\ni. লক্ষণ দেখা দিলে অবহেলা না করে দ্রুত ইসিজি ($ECG$) করানো\nii. ধূমপান না করা এবং রক্তচাপ নিয়ন্ত্রণে রাখা\niii. শাকসবজি ও ফলমূল বেশি খাওয়া এবং চর্বিযুক্ত খাবার পরিহার করা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৩. বাতজ্বর ($Rheumatic\\ Fever$) সম্পর্কিত সঠিক তথ্য—\ni. এটি Streptococcus অণুজীবের সংক্রমণে ঘটে\nii. সাধারণত শিশুদের মধ্যে এ রোগের প্রাদুর্ভাব বেশি দেখা যায়\niii. এতে শুরুতে শ্বাসনালি, টনসিল বা গলার প্রদাহ সৃষ্টি হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৪. বাতজ্বরের ক্ষতিকর প্রভাব—\ni. হূৎপিণ্ডের পেশি ও কপাটিকা ক্ষতিগ্রস্ত হয়\nii. হূৎপিণ্ড কার্যকরভাবে রক্ত পাম্প করতে সক্ষম হয় না\niii. গিরায় গিরায় ব্যথা, জ্বর, রক্তস্বল্পতা ও ক্লান্তি দেখা দেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৫. বাতজ্বরের চিকিৎসা সংক্রান্ত তথ্য—\ni. প্রাথমিক পর্যায়ে পেনিসিলিন জাতীয় ওষুধ ব্যবহারে রেহাই পাওয়া যায়\nii. চিকিৎসকের পরামর্শে রোগীকে $২১$ বছর বয়স পর্যন্ত নিয়মিত পেনিসিলিন খেতে হয়\niii. সময়ের সাথে চিকিৎসা না করালে হূৎপিণ্ড মারাত্মকভাবে ক্ষতিগ্রস্ত হতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৬. হৃদপিণ্ড সুস্থ রাখার উপায়—\ni. তামাক বা জর্দার নিকোটিন থেকে হূৎপেশিকে মুক্ত রাখা\nii. খাবারে চর্বি, অতিরিক্ত শর্করা ও তেল জাতীয় খাদ্য পরিহার করা\niii. প্রতিদিন পরিমিত ব্যায়াম ও হাঁটাচলার অভ্যাস গড়ে তোলা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৭. মাদক সেবনের ক্ষতিকর দিক—\ni. এটি হূদ্যন্ত্রের ক্রিয়া ও স্পন্দন স্বাভাবিক মান থেকে বৃদ্ধি করে\nii. এটি সাময়িক মানসিক শান্তি দিলেও হূদ্যন্ত্রের অনেক ক্ষতি করে\niii. এটি রক্তের কোলেস্টেরল কমিয়ে ধমনি পরিষ্কার রাখে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_1787670964210k1w2i","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:darkgreen;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩৮ ও ৩৯) নং প্রশ্নের উত্তর দাও:   </b> \n১০ বছরের বালক তানভীর বেশ কিছুদিন ধরে দুর্বলতা, ফ্যাকাশে ভাব ও শ্বাসকষ্টে ভুগছে। ইদানীং কোনো আঘাত ছাড়াই তার নাক ও মাড়ি দিয়ে রক্ত পড়ছে। পরীক্ষায় দেখা গেল তার অস্থিমজ্জায় অস্বাভাবিকভাবে শ্বেত রক্তকণিকা বৃদ্ধি পেয়েছে।\n৩৮. উদ্দীপকে তানভীর চিকিৎসাবিজ্ঞানের ভাষায় কোন রোগে আক্রান্ত?\n(ক) বাতজ্বর (খ) লিউকেমিয়া\n(গ) হার্ট অ্যাটাক (ঘ) অ্যানজিনা\nউত্তর: খ\n৩৯. উদ্দীপকে তানভীরের নাক ও মাড়ি দিয়ে রক্ত পড়ার প্রধান কারণ কোনটি?\n(ক) অনুচক্রিকার উৎপাদন কমে যাওয়া \n(খ) লোহিত রক্তকণিকা অত্যধিক বৃদ্ধি পাওয়া\n(গ) রক্তরসের পরিমাণ বেড়ে যাওয়া \n(ঘ) অ্যান্টিবডির পরিমাণ কমে যাওয়া\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৪০ ও ৪১) নং প্রশ্নের উত্তর দাও:   </b> \nরফিক সাহেবের রক্তের একটি মারাত্মক ব্যাধি ধরা পড়ল যা মূলত অস্থিমজ্জার রোগ। বিশ্ব স্বাস্থ্য সংস্থার তথ্য অনুযায়ী এ জাতীয় রোগ অর্ধশতাধিক ধরনের হতে পারে।\n৪০. উদ্দীপকে উল্লিখিত ব্যাধিটির উন্নত চিকিৎসায় বাংলাদেশে কোন বিশেষ পদ্ধতিটি ঢাকা মেডিকেল কলেজ হাসপাতালে উপলব্ধ?\n(ক) এনজিওপ্লাস্টি (খ) অস্থিমজ্জা প্রতিস্থাপন\n(গ) ওপেন হার্ট সার্জারি (ঘ) কিডনি ডায়ালাইসিস\nউত্তর: খ\n৪১. উদ্দীপকের রোগে আক্রান্ত ব্যক্তির শরীরে অতিরিক্ত শ্বেত রক্তকণিকাগুলো কিসে পরিণত হওয়ার কারণে তা আর স্বাভাবিক রোগ প্রতিরোধমূলক কাজ করতে পারে না?\n(ক) অণুজীব কোষে (খ) ক্যান্সার কোষে\n(গ) পিত্ত কোষে (ঘ) লসিকা কোষে\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪২ ও ৪৩) নং প্রশ্নের উত্তর দাও:   </b> \n৫০ বছর বয়সী ব্যবসায়ী জহির সাহেব ফাস্টফুড ও চর্বিযুক্ত খাবার বেশি পছন্দ করেন এবং শারীরিক পরিশ্রম করেন না। একদিন হঠাৎ তাঁর বুকে অসহনীয় তীব্র ব্যথা অনুভূত হলো এবং সেই ব্যথা বাঁ হাতে ছড়িয়ে পড়ল।\n৪২. উদ্দীপকে জহির সাহেবের আকস্মিক অসুস্থতার মূল কারণ কোনটি?\n(ক) করোনারি রক্তনালিতে চর্বি জমে রক্তপ্রবাহ বন্ধ হওয়া \n(খ) রক্তে শ্বেত রক্তকণিকা বৃদ্ধি পাওয়া\n(গ) শ্বাসনালিতে অণুজীবের সংক্রমণ ঘটে যাওয়া \n(ঘ) পিত্তথলিতে পাথর জমা হওয়া\nউত্তর: ক\n৪৩. জহির সাহেবের এইরূপ অবস্থা দেখা দিলে অবহেলা না করে তাৎক্ষণিকভাবে কোন পরীক্ষাটি করানো জরুরি?\n(ক) আলট্রাসনোগ্রাম (খ) ইসিজি ($ECG$)\n(গ) বায়োপসি (ঘ) এন্ডোস্কোপি\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও:   </b> \nডায়াবেটিসে আক্রান্ত জনাব মতিন হঠাৎ কপালে ঘাম ও বুকে ভারী চাপ অনুভব করলেন, তবে তাঁর তীব্র বুক ব্যথা ছিল না। ডাক্তার জানালেন, এটি এক প্রকার হৃদরোগের লক্ষণ।\n৪৪. উদ্দীপকে বর্ণিত চিকিৎসকের বক্তব্য অনুযায়ী জনাব মতিনের তীব্র বুক ব্যথা না থাকার কারণ কোনটি?\n(ক) তাঁর পূর্বে বাতজ্বর হওয়া \n(খ) তিনি ডায়াবেটিসে আক্রান্ত হওয়া\n(গ) রক্তে অনুচক্রিকার সংখ্যা বেশি থাকা \n(ঘ) তিনি নিয়মিত ব্যায়াম করেন বলে\nউত্তর: খ\n৪৫. উদ্দীপকে বর্ণিত ব্যাধিটি প্রতিরোধের জন্য জনাব মতিনের জীবনযাত্রায় কোন ধরনের পরিবর্তনের পরামর্শ প্রযোজ্য?\n(ক) চর্বিযুক্ত ও লবণাক্ত খাবার বাড়িয়ে দেওয়া \n(খ) শাকসবজি ও কাঁচা ফলমূল বেশি খাওয়া\n(গ) কার্বোহাইড্রেট ও প্রোটিন বর্জন করা \n(ঘ) অতিরিক্ত ফাস্টফুড খাওয়া\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৬ ও ৪৭) নং প্রশ্নের উত্তর দাও:   </b> \n৮ বছরের শিশু সামিউল কিছুদিন ধরে গলার প্রদাহ ও শ্বাসনালির সংক্রমণে ভুগছিল। পরবর্তীতে তার জ্বর, গিরায় গিরায় ব্যথা এবং হৃৎপিণ্ডের কপাটিকার সমস্যা দেখা দিল। ডাক্তার বললেন, এক প্রকার অণুজীবের সংক্রমণে এ রোগটি হয়েছে।\n৪৬. উদ্দীপকে সামিউল কোন রোগে আক্রান্ত হয়েছে?\n(ক) লিউকেমিয়া (খ) বাতজ্বর ($Rheumatic\\ Fever$)\n(গ) অ্যানজিনা (ঘ) স্ট্রোক\nউত্তর: খ\n৪৭. উদ্দীপকের রোগের অণুজীবজনিত আক্রমণ থেকে সামিউলকে রেহাই দিতে প্রাথমিক পর্যায়ে কোন ওষুধ প্রয়োগ করা উচিত ছিল?\n(ক) অ্যানটাসিড (খ) পেনিসিলিন\n(গ) কেমোথেরাপি (ঘ) অ্যান্টিহিস্টামিন\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৮ ও ৪৯) নং প্রশ্নের উত্তর দাও:   </b> \nডা. ইকবাল একজন শিশু রোগ বিশেষজ্ঞ। তিনি বাতজ্বরে আক্রান্ত এক ছোট রোগীকে নিয়মিত বিশেষ ওষুধ গ্রহণের নির্দেশ দিলেন এবং নির্দিষ্ট বয়স পর্যন্ত এই চিকিৎসা চালিয়ে যাওয়ার পরামর্শ দিলেন।\n৪৮. উদ্দীপকে উল্লিখিত রোগীটিকে কত বছর বয়স না পৌঁছানো পর্যন্ত নিয়মিত পেনিসিলিন সেবন করতে হবে?\n(ক) $১৫\\text{ বছর}$ (খ) $১৮\\text{ বছর}$\n(গ) $২১\\text{ বছর}$ (ঘ) $২৫\\text{ বছর}$\nউত্তর: গ\n৪৯. উদ্দীপকে বর্ণিত রোগটির সঠিক ও সময়মতো চিকিৎসা না করালে শরীরের কোন অঙ্গটি মারাত্মকভাবে ক্ষতিগ্রস্ত হয়ে কার্যক্ষমতা হারাতে পারে?\n(ক) যকৃৎ (খ) হূৎপিণ্ড\n(গ) পাকস্থলী (ঘ) মস্তিষ্ক\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫০ ও ৫১) নং প্রশ্নের উত্তর দাও:   </b> \nআসিফ প্রতিদিন সিগারেট ও মাদক সেবন করে। কিছুদিন পর তার হৃদযন্ত্রের ক্রিয়া ও স্পন্দনের হার স্বাভাবিকের চেয়ে অনেক বৃদ্ধি পেল এবং হৃদপেশির ক্ষতি হতে শুরু করল।\n৫০. উদ্দীপকের আসিফের ব্যবহৃত সিগারেটের তামাক ও জর্দার কোন রাসায়নিক উপাদানটি হৃদপেশির ক্ষতির জন্য দায়ী?\n(ক) ক্যাফেইন (খ) নিকোটিন\n(গ) মরফিন (ঘ) ট্যানিন\nউত্তর: খ\n৫১. উদ্দীপকের মাদক সেবনের ফলে আসিফের ক্ষেত্রে কোন পরিবর্তনটি ঘটেছে?\n(ক) হৃদযন্ত্রের ক্রিয়া ও স্পন্দন স্বাভাবিকের চেয়ে বৃদ্ধি পাওয়া \n(খ) রক্তে লোহিত রক্তকণিকা বেড়ে যাওয়া\n(গ) পিত্তথলিতে পাথর জমা \n(ঘ) অস্থিমজ্জায় অনুচক্রিকা বেড়ে যাওয়া\nউত্তর: ক\n\n\n<span style=\"color:red;\"><center><b>————————🌸 সমাপ্ত 🌸————————</b></center></span>\n\n\n"}]}];
    var currentActiveId = null;
    window.onload = function() {
        if(dataset && dataset.length > 0) {
            setupNavigation();
        } else {
            document.getElementById("mainContentArea").innerHTML = "<p style=\"text-align:center;color:#94a3b8;\">কোনো কন্টেন্ট পাওয়া যায়নি।</p>";
        }
    };
    function setupNavigation() {
        var container = document.getElementById("topicButtons");
        currentActiveId = dataset[0].id;
        dataset.forEach(function(topic) {
            var btn = document.createElement("button");
            btn.className = "topic-trigger";
            btn.id = "btn_" + topic.id;
            btn.innerText = topic.title || "পাঠ";
            btn.onclick = function() { switchTopic(topic.id); };
            container.appendChild(btn);
        });
        renderActiveContent();
    }
    function switchTopic(id) {
        currentActiveId = id;
        renderActiveContent();
    }
    function renderActiveContent() {
        var buttons = document.querySelectorAll(".topic-trigger");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        var activeBtn = document.getElementById("btn_" + currentActiveId);
        if(activeBtn) activeBtn.classList.add("active");
        var displayArea = document.getElementById("mainContentArea");
        displayArea.innerHTML = "";
        var targetTopic = null;
        for (var j = 0; j < dataset.length; j++) {
            if (dataset[j].id === currentActiveId) {
                targetTopic = dataset[j];
                break;
            }
        }
        if(targetTopic && targetTopic.blocks && targetTopic.blocks.length > 0) {
            targetTopic.blocks.forEach(function(block) {
                if(!block.value || !block.value.trim()) return;
                var div = document.createElement("div");
                div.className = "block-item";
                if(block.type === "text") {
                    var text = block.value.replace(/\n/g, "<br>");
                    text = text.replace(/(উত্তর:\s*[কখগঘ])/g, '<span class="hidden-ans" onclick="reveal(this)">$1</span>');
                    div.innerHTML = text;
                } else if(block.type === "image") {
                    var img = document.createElement("img");
                    img.src = block.value;
                    img.className = "content-img";
                    img.alt = "Study Image";
                    img.onerror = function() { this.style.display = "none"; };
                    div.appendChild(img);
                }
                displayArea.appendChild(div);
            });
        } else {
            displayArea.innerHTML = "<p style=\"text-align:center;color:#94a3b8;padding-top:20px;\">এই পাঠে কোনো প্রশ্ন নেই।</p>";
        }
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }
    function reveal(el) {
        if (el.classList.contains("reveal")) return;
        el.classList.add("reveal");
        setTimeout(function() { el.classList.remove("reveal"); }, 2000);
    }
</script>
</body>
</html>
