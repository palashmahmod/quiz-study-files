\n২৬. সেলুলোজ, স্টার্চ ও জিলাটিন এগুলো কী ধরনের পদার্থ?\n(ক) হাইড্রোফোবিক (খ) হাইড্রোফিলিক\n(গ) অদ্রবণীয় (ঘ) বিষাক্ত\nউত্তর: খ"},{"id":"block_1787667456682dbzsk","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n২৭. প্রোটোপ্লাজম এবং পানির সম্পর্ক বিষয়ে বলা যায়—\ni. প্রোটোপ্লাজম হলো জীবদেহের ভৌত ভিত্তি\nii. প্রোটোপ্লাজমের শতকরা $৯০\\text{ ভাগ}$ পানি\niii. পানির পরিমাণ কমে গেলে প্রোটোপ্লাজম স্ফীত হয়ে ওঠে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n২৮. উদ্ভিদের দেহে পানির প্রয়োজনীয় দিকগুলো হলো—\ni. প্রোটোপ্লাজমকে সজীব রাখা\nii. প্রশ্বেদন ও সালোকসংশ্লেষণ প্রক্রিয়া চালু রাখা\niii. কোষের বৃদ্ধি ও চলনে ভূমিকা রাখা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n২৯. উদ্ভিদ দেহে পানির গুরুত্ব ও ভূমিকা হলো—\ni. পানি একটি গুরুত্বপূর্ণ দ্রাবক হিসেবে কাজ করে\nii. বিপাকীয় ক্রিয়াসমূহ সচল রাখতে পানির ভূমিকা অপরিসীম\niii. শুষ্ক মৌসুমে সেচ দেওয়া ছাড়াই বড় উদ্ভিদ সতেজ থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩০. উদ্ভিদ দেহে পানি শোষণের বৈশিষ্ট্যসমূহ হলো—\ni. উদ্ভিদ প্রধানত মূলের মাধ্যমে মাটি থেকে পানি শোষণ করে\nii. তিনটি সম্মিলিত প্রক্রিয়ার মাধ্যমে শোষণ কাজ সম্পন্ন হয়\niii. শোষণ প্রক্রিয়ার মধ্যে ইমবাইবিশন, ব্যাপন ও অভিস্রবণ অন্তর্ভুক্ত\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩১. ইমবাইবিশন প্রক্রিয়া সম্পর্কে বলা যায়—\ni. কলয়েড জাতীয় শুকনা বা আধা শুকনা পদার্থ তরল চুষে নেয়\nii. কোষপ্রাচীর ও প্রোটোপ্লাজম কলয়েডধর্মী\niii. পানি শোষণের এটি অন্যতম একটি প্রক্রিয়া\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩২. হাইড্রোফিলিক বা পানিপ্রিয় পদার্থসমূহ হলো—\ni. সেলুলোজ ii. স্টার্চ iii. জিলাটিন\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৩. হাইড্রোফিলিক পদার্থের বৈশিষ্ট্য হলো—\ni. এরা তরল পদার্থের সংস্পর্শে এলে তা চুষে নেয়\nii. তরল পদার্থের অভাবে এগুলো সংকুচিত হয়ে যায়\niii. এরা পানিকে সম্পূর্ণ বিকর্ষণ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৪. ব্যাপন প্রক্রিয়া সম্পর্কে সঠিক তথ্য হলো—\ni. এটি একটি ভৌত প্রক্রিয়া\nii. দ্রবের অণু বেশি ঘনত্বের এলাকা থেকে কম ঘনত্বের এলাকায় ছড়িয়ে পড়ে\niii. ঘরের কোণে সুগন্ধি ছিটিয়ে দিলে তা ছড়িয়ে পড়া ব্যাপনের উদাহরণ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৫. ব্যাপন চাপ ও ব্যাপন চাপ ঘাটতি সম্পর্কিত বক্তব্য—\ni. বেশি ঘনত্বের দ্রবণ থেকে কম ঘনত্বের দ্রবণের দিকে দ্রাবকের ব্যাপিত হওয়ার ক্ষমতাকে ব্যাপন চাপ বলে\nii. দ্রবণ ও দ্রাবকের ব্যাপন চাপের পার্থক্যকে ব্যাপন চাপ ঘাটতি বলে\niii. পাতার মেসোফিল টিস্যুতে ব্যাপন চাপ ঘাটতি ঘটলে পাশের কোষ থেকে পানি টেনে নেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৬. কিসমিশের ক্ষেত্রে অভিস্রবণ প্রক্রিয়ার ঘটনাগুলো হলো—\ni. শুকনা কিসমিশ পানিতে ভিজিয়ে রাখলে ফুলে ওঠে\nii. স্ফীত কিসমিশ ঘন চিনির দ্রবণে রাখলে চুপসে যায়\niii. কিসমিশ সব সময় পানি ত্যাগ করে সংকুচিত থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৭. অভিস্রবণ প্রক্রিয়ার শর্ত ও বৈশিষ্ট্য হলো—\ni. দুটি ভিন্ন ঘনত্বের দ্রবণ বৈষম্যভেদ্য পর্দা দিয়ে আলাদা থাকে\nii. দ্রাবক কম ঘনত্বের দ্রবণ থেকে বেশি ঘনত্বের দ্রবণের দিকে প্রবাহিত হয়\niii. এটি কেবল জীবন্ত কোষে ঘটে, ল্যাবরেটরিতে ঘটানো সম্ভব নয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৮. অভিস্রবণের দ্রাবক প্রবাহের বৈশিষ্ট্য হলো—\ni. অভিস্রবণ প্রকৃতপক্ষে দ্রাবকের ব্যাপন\nii. দ্রাবকের পরিমাণ আপেক্ষিক বেশি থাকা দিক থেকে কম থাকা দিকে প্রবাহ ঘটে\niii. বৈষম্যভেদ্য পর্দা অতিক্রম করে দ্রবের অণু প্রবাহিত হওয়া সম্ভব\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_178766751426706nxj","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:green;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৩৯ ও ৪০) নং প্রশ্নের উত্তর দাও:   </b> \nরাহাত তার বিজ্ঞান প্রজেক্টের জন্য এক খণ্ড শুকনা কাঠ পানিতে ডুবিয়ে রাখল। কিছু সময় পর সে লক্ষ্য করল কাঠের খণ্ডটি কিছু পানি চুষে নিয়ে সামান্য স্ফীত হয়েছে। \n৩৯. উদ্দীপকে কাঠের খণ্ডটির পানি চুষে নেওয়ার ঘটনাটি কোন প্রক্রিয়ার অন্তর্ভুক্ত? \n(ক) অভিস্রবণ (খ) ব্যাপন \n(গ) ইমবাইবিশন (ঘ) প্রশ্বেদন \nউত্তর: গ \n৪০. উদ্দীপকের প্রক্রিয়ার মাধ্যমে উদ্ভিদের কোন অংশ দুটি পানি শোষণ করে স্ফীত হয়ে ওঠে? \n(ক) কোষপ্রাচীর ও প্রোটোপ্লাজম \n(খ) মাইটোকন্ড্রিয়া ও প্লাস্টিড \n(গ) কোষগহ্বর ও নিউক্লিয়াস \n(ঘ) ক্রোমোজোম ও সাইটোপ্লাজম \nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৪১ ও ৪২) নং প্রশ্নের উত্তর দাও:   </b>\n রিনা ঘরের এক কোণে কিছুটা সুগন্ধি ছিটিয়ে দিল। কিছুক্ষণ পর অন্য কোণে থাকা তার ভাই সেই সুগন্ধ পেল। পরবর্তীতে সে এক গ্লাস পানিতে কিছু চিনি ছেড়ে দিয়ে নাড়া দিল, যার ফলে পুরো পানি মিষ্টি হয়ে গেল। \n৪১. উদ্দীপকে বর্ণিত ঘটনাগুলো পদার্থের কোন ভৌত প্রক্রিয়াকে নির্দেশ করে? \n(ক) ইমবাইবিশন (খ) অভিস্রবণ \n(গ) ব্যাপন (ঘ) পরিস্রুতকরণ \nউত্তর: গ \n৪২. উদ্দীপকের প্রক্রিয়ার ফলে উদ্ভিদের কোন টিস্যুতে চাপ ঘাটতি তৈরি হলে পাশের কোষ থেকে পানি শোষিত হয়? \n(ক) জাইলেম টিস্যু (খ) মেসোফিল টিস্যু \n(গ) ফ্লোয়েম টিস্যু (ঘ) ভাজক টিস্যু \nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৩ ও ৪৪) নং প্রশ্নের উত্তর দাও:   </b>\nসুমন বাটিতে থাকা পানিতে কিছু শুকনা কিশমিশ ভিজিয়ে রাখায় সেগুলো ফুলে টসটসে হয়ে উঠল। পরবর্তীতে সে স্ফীত কিশমিশগুলো একটি অতি ঘন চিনির দ্রবণে ডুবিয়ে রাখলে সেগুলো আবার চুপসে গেল। \n৪৩. উদ্দীপকের কিশমিশের ফুলে ওঠা ও পরবর্তীতে চুপসে যাওয়ার ঘটনাটি কোন প্রক্রিয়াকে প্রদর্শন করে? \n(ক) ইমবাইবিশন (খ) অভিস্রবণ (গ) ব্যাপন (ঘ) প্রশ্বেদন \nউত্তর: খ \n৪৪. উদ্দীপকের প্রক্রিয়ায় দুটি ভিন্ন ঘনত্বের দ্রবণকে পৃথক রাখতে কোন ধরনের পর্দার প্রয়োজন হয়? \n(ক) অভেদ্য পর্দা (খ) ভেদ্য পর্দা \n(গ) বৈষম্যভেদ্য পর্দা (ঘ) পলিথিন পর্দা \nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৪৫ ও ৪৬) নং প্রশ্নের উত্তর দাও:   </b>\n জীববিজ্ঞানের শিক্ষক ক্লাসে বললেন, \"প্রোটোপ্লাজম হলো জীবদেহের ভৌত ভিত্তি এবং এতে প্রচুর পরিমাণে পানি থাকে। পানির পরিমাণ কমে গেলে কোষের কার্যক্ষমতা বন্ধ হয়ে যায়, এমনকি জীব মারাও যেতে পারে।\" \n৪৫. উদ্দীপকের প্রোটোপ্লাজমে শতকরা কত ভাগ পানি থাকে বলে পাঠ্যবইয়ে উল্লিখিত আছে? \n(ক) $৭০\\%$ (খ) $৮০\\%$ (গ) $৯০\\%$ (ঘ) $৯৫\\%$ \nউত্তর: গ \n৪৬. উদ্দীপক অনুযায়ী পানির অপর নাম 'ফ্লুইড অফ লাইফ' হওয়ার প্রধান কারণ কোনটি? \n(ক) এটি প্রোটোপ্লাজমকে সংকুচিত করে \n(খ) এটি প্রোটোপ্লাজমকে সজীব ও সচল রাখে \n(গ) এটি উদ্ভিদের পরিবহন স্তব্ধ করে \n(ঘ) এটি কোষপ্রাচীর ধ্বংস করে \nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৭ ও ৪৮) নং প্রশ্নের উত্তর দাও:   </b>\nকৃষক রহিম মিয়া শুষ্ক মৌসুমে লক্ষ্য করলেন তার বাগানের বড় বড় গাছগুলোতে নিয়মিত সেচ না দিলে গাছগুলো নিস্তেজ হয়ে পড়ে। তিনি জানেন পানি ছাড়া উদ্ভিদের খাদ্য তৈরি ও অতিরিক্ত পানি বাষ্পাকারে বের করার প্রক্রিয়া বন্ধ হয়ে যায়। \n৪৭. উদ্দীপকে উল্লিখিত সেচ না দিলে উদ্ভিদের কোন গুরুত্বপূর্ণ শারীরবৃত্তীয় প্রক্রিয়া দুটি বন্ধ হয়ে যাবে? \n(ক) শ্বসন ও রেচন (খ) স্ফীতকরণ ও সংকোচন\n(গ) অভিস্রবণ ও ইমবাইবিশন \n(ঘ) প্রশ্বেদন ও সালোকসংশ্লেষণ\nউত্তর: ঘ \n৪৮. উদ্ভিদ প্রধানত কোন অঙ্গের সাহায্যে মাটি থেকে এই প্রয়োজনীয় পানি শোষণ করে? \n(ক) পাতা (খ) কাণ্ড (গ) মূল (ঘ) ফুল \nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৪৯ ও ৫০) নং প্রশ্নের উত্তর দাও:   </b>\nল্যাব সহকারী সুবীর বাবু পাত্রে সেলুলোজ, স্টার্চ ও জিলাটিন নিয়ে পানি যোগ করলেন। তিনি দেখলেন এই পদার্থগুলো দ্রুত পানি চুষে নিচ্ছে।\n৪৯. উদ্দীপকের পদার্থগুলোকে বৈশিষ্ট্যের বিচারে কী ধরনের পদার্থ বলা হয়?\n(ক) হাইড্রোফোবিক (খ) হাইড্রোফিলিক\n(গ) পানিবিরোধী (ঘ) অদ্রবণীয়\nউত্তর: খ\n৫০. উদ্দীপকে উল্লিখিত পদার্থগুলোর তরল চুষে নেওয়ার প্রক্রিয়াটি উদ্ভিদ জীবনে কীভাবে সাহায্য করে?\n(ক) ফল পাকাতে (খ) পানি শোষণে\n(গ) খাদ্য পরিবহনে (ঘ) ফুল ফোটাতে\nউত্তর: খ"}]},{"id":"topic_178766820809237p4n","title":"পাঠ-( 6.2 – 6.2.1)","blocks":[{"id":"block_1787668492996yi2da","type":"text","value":"<span style=\"color:navy;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. উদ্ভিদ তার মূলরোমের মাধ্যমে মাটির কোন পানি শোষণ করে?\n(ক) গ্রাভিটেশনাল পানি (খ) কৈশিক পানি\n(গ) আর্দ্রতাগ্রাহী পানি (ঘ) রাসায়নিক পানি\nউত্তর: খ\n২. কৈশিক পানিকে ইংরেজিতে কী বলা হয়?\n(ক) Capillary water (খ) Cell sap\n(গ) Mineral water (ঘ) Soil water\nউত্তর: ক\n৩. প্রশ্বেদনের ফলে পাতার কোষে কিসের সৃষ্টি হয়?\n(ক) অভিস্রবণ চাপ (খ) ব্যাপন চাপ ঘাটতি\n(গ) মূলজ চাপ (ঘ) ইমবাইবিশন চাপ\nউত্তর: খ\n৪. পাতার কোষে সৃষ্ট ব্যাপন চাপ ঘাটতির ফলে মূলরোম পর্যন্ত কোনটি বিস্তৃত হয়?\n(ক) সালোকসংশ্লেষণ চাপ (খ) প্রোটোপ্লাজমীয় চাপ\n(গ) অভিস্রবণ চাপ ঘাটতি (ঘ) চোষক শক্তি\nউত্তর: ঘ\n৫. চোষক শক্তির টানে মাটির কৈশিক পানি মূলরোমে কোন কোন প্রক্রিয়ায় প্রবেশ করে?\n(ক) ইমবাইবিশন ও অভিস্রবণ (খ) অভিস্রবণ ও ব্যাপন\n(গ) ব্যাপন ও প্রশ্বেদন (ঘ) ইমবাইবিশন ও ব্যাপন\nউত্তর: খ\n৬. মূলরোম থেকে পানি মূলের কোন অংশে প্রবেশ করে?\n(ক) কর্টেক্সে (খ) জাইলেমে\n(গ) ফ্লোয়েমে (ঘ) কাইনেটিসে\nউত্তর: ক\n৭. মূলরোম থেকে পানি মূলের কর্টেক্সে প্রবেশ করার পদ্ধতিকে কী বলে?\n(ক) কোষ থেকে কোষান্তরে অভিস্রবণ \n(খ) কোষ থেকে কোষান্তরে ব্যাপন\n(গ) সক্রিয় পরিবহন (ঘ) ইমবাইবিশন\nউত্তর: ক\n৮. 'Cell to cell osmosis' বলতে কোনটি বোঝায়?\n(ক) মূলরোম থেকে পানিতে দ্রাবকের ব্যাপন \n(খ) কোষ থেকে কোষান্তরে অভিস্রবণ\n(গ) ফ্লোয়েম থেকে পাতায় পরিবহন \n(ঘ) বায়ুমণ্ডল থেকে পাতায় বাষ্পীভবন\nউত্তর: খ\n৯. পানি মূলের কর্টেক্স থেকে কোথায় পৌঁছায়?\n(ক) অন্তঃত্বক ও পরিচক্র হয়ে পরিবহন কলাগুচ্ছে \n(খ) কেবল ত্বক হয়ে প্রোটোপ্লাজমে\n(গ) সিভনল হয়ে মেসোফিলে (ঘ) সরাসরি ফ্লোয়েমে\nউত্তর: ক\n১০. পরিবহন কলাগুচ্ছকে ইংরেজিতে কী বলা হয়?\n(ক) Cortex (খ) Vascular bundles\n(গ) Cell sap (ঘ) Ascent of sap\nউত্তর: খ\n১১. পানি একবার পরিবহন কলায় পৌঁছে গেলে কোন কলার মাধ্যমে উপরের ও পাশের দিকে প্রবাহিত হতে থাকে?\n(ক) ফ্লোয়েম কলার (খ) জাইলেম কলার\n(গ) প্যারেনকাইমা কলার (ঘ) মেসোফিল কলার\nউত্তর: খ\n১২. মূলরোম থেকে শোষিত পানি পাতায় পৌঁছানোর কাজে মূলত কোন দুটি গুরুত্বপূর্ণ প্রক্রিয়া কাজ করে?\n(ক) অভিস্রবণ ও প্রশ্বেদন \n(খ) ইমবাইবিশন ও ব্যাপন\n(গ) শ্বসন ও সালোকসংশ্লেষণ \n(ঘ) রেচন ও ব্যাপন\nউত্তর: ক\n১৩. অধিকাংশ উদ্ভিদ পানির সাথে কিছু পরিমাণ খনিজ লবণ শোষণ করলেও মূলত মূলের কোন অঞ্চলটি লবণ শোষণ অঞ্চল হিসেবে কাজ করে?\n(ক) মূলরোম অঞ্চল \n(খ) মূলের অগ্রভাগের কোষ বিভাজন অঞ্চল\n(গ) স্থায়ী অঞ্চল (ঘ) মূলত্র অঞ্চল\nউত্তর: খ\n১৪. খনিজ লবণ শোষিত হয় কী হিসেবে?\n(ক) অণু হিসেবে (খ) যৌগের কণা হিসেবে\n(গ) পরমাণু হিসেবে (ঘ) আয়নিক হিসেবে\nউত্তর: ঘ\n১৫. খনিজ লবণ শোষণ প্রধানত কয়টি উপায়ে হয়ে থাকে?\n(ক) $২$ টি (খ) $৩$ টি (গ) $৪$ টি (ঘ) $৫$ টি\nউত্তর: ক\n১৬. কোন শোষণে কোনো বিপাকীয় শক্তির প্রয়োজন হয় না?\n(ক) সক্রিয় শোষণ (খ) নিষ্ক্রিয় শোষণ\n(গ) কোষান্তর অভিস্রবণ (ঘ) ব্যাপন চাপ শোষণ\nউত্তর: খ\n১৭. নিষ্ক্রিয় শোষণে উদ্ভিদ কোন দুটি প্রক্রিয়ায় লবণ শোষণ করে?\n(ক) ইমবাইবিশন ও অভিস্রবণ (খ) ব্যাপন ও অভিস্রবণ\n(গ) প্রশ্বেদন ও ব্যাপন (ঘ) অভিস্রবণ ও সক্রিয় পরিবহন\nউত্তর: ক\n১৮. সক্রিয় শোষণে (Active absorption) খনিজ লবণ পরিবহনের জন্য কিসের প্রয়োজন হয়?\n(ক) সূর্যালোকের (খ) অতিরিক্ত পানির\n(গ) মূলজ চাপের (ঘ) কোষে উৎপন্ন বিপাকীয় শক্তির\nউত্তর: ঘ\n১৯. উদ্ভিদে পরিবহন বলতে মূলতঃ কাদের চলাচলকে বোঝায়?\n(ক) মাটি থেকে শোষিত পানি, খনিজ লবণ ও পাতায় প্রস্তুতকৃত খাদ্য \n(খ) কেবল মাটি থেকে পানি\n(গ) কেবল বায়ু থেকে অক্সিজেন ও কার্বন ডাই-অক্সাইড \n(ঘ) কেবল পাতার বর্জ্য পদার্থ\nউত্তর: ক\n২০. পানি ও খনিজ লবণ উদ্ভিদের পাতায় পৌঁছায় কিসের মাধ্যমে?\n(ক) ফ্লোয়েম সিভনলের (খ) জাইলেম ভেসেলের\n(গ) কর্টেক্স কোষের (ঘ) মেসোফিল টিস্যুর\nউত্তর: খ\n২১. বিজ্ঞানীরা প্রবর্তন করেছেন যে, কোন বলগুলোর ফলে কোষরস উদ্ভিদের পাতায় পৌঁছায়?\n(ক) প্রশ্বেদন টান, কৈশিক শক্তি এবং মূলজ চাপ \n(খ) চোষক টান, অভিস্রবণ চাপ এবং ইমবাইবিশন\n(গ) দ্রাবক চাপ, ব্যাপন চাপ এবং অভিস্রবণ \n(ঘ) সালোকসংশ্লেষণ চাপ ও রেচন চাপ\nউত্তর: ক\n২২. পাতায় প্রস্তুতকৃত খাদ্য উদ্ভিদের বিভিন্ন এলাকায় পরিবহনের দায়িত্ব গ্রহণ করে কোন টিস্যু?\n(ক) জাইলেম টিস্যু (খ) কর্টেক্স টিস্যু\n(গ) মেসোফিল টিস্যু (ঘ) ফ্লোয়েম টিস্যু\nউত্তর: ঘ\n২৩. প্রস্তুত খাদ্য ফ্লোয়েমের কোন অংশের মাধ্যমে প্রবাহিত হয়?\n(ক) ট্রাকিড (খ) সিভনল\n(গ) ভেসেল (ঘ) ফ্লোয়েম প্যারেনকাইমা\nউত্তর: খ\n২৪. ফ্লোয়েম টিস্যুর মাধ্যমে খাদ্য পরিবহনের ক্ষেত্রে নিচের কোন তথ্যটি সঠিক?\n(ক) কেবল উপরের দিকে প্রবাহিত হয় \n(খ) কেবল নিচের দিকে প্রবাহিত হয়\n(গ) নিচের অংশ নিচের দিকে, উপরের অংশ উপরে এবং মাঝামাঝি সংগৃহীত পদার্থ যেকোনো দিকে \n(ঘ) কেবল মাঝামাঝি এলাকায় সংগৃহীত হয়\nউত্তর: গ\n২৫. 'পরিবহন' শব্দের মূল অর্থ কী?\n(ক) একস্থান থেকে অন্য স্থানে কোনো পদার্থের স্থানান্তর \n(খ) কোষে রাসায়নিক পদার্থের সংশ্লেষ\n(গ) উদ্ভিদের অঙ্গ বৃদ্ধি পাওয়া \n(ঘ) পাতার মাধ্যমে বাষ্পীভবন\nউত্তর: ক\n২৬. পানি এবং খনিজ লবণ শোষিত হয়ে কোন শোষণের টানে জাইলেমে পৌঁছায়?\n(ক) চোষক টান (খ) অভিস্রবণ চাপ\n(গ) তাপীয় চাপ (ঘ) দ্রাবক টান\nউত্তর: ক\n২৭. জাইলেম ভেসেল বা ফ্লোয়েমের সিভনল কোনো কারণে বন্ধ হয়ে গেলে উদ্ভিদের কী ঘটবে?\n(ক) দ্রুত ফুল ফুটবে (খ) উদ্ভিদের মৃত্যু অবধারিত\n(গ) মূলের বৃদ্ধি ত্বরান্বিত হবে (ঘ) পাতাগুলো সবুজ হবে\nউত্তর: খ\n২৮. পানি ও খনিজ পদার্থের পরিবহনকে ইংরেজি পরিভাষায় কী বলে?\n(ক) Transpiration of water \n(খ) Translocation of water and minerals\n(গ) Ascent of sap (ঘ) Osmosis of minerals\nউত্তর: খ\n২৯. কোষের ভিতরকার পানি এবং পানিতে দ্রবীভূত খনিজ লবণকে একসাথে কী বলে?\n(ক) ফ্লুইড অব লাইফ (খ) কোষরস (cell sap)\n(গ) রক্তরস (ঘ) প্রোটোপ্লাজম\nউত্তর: খ\n৩০. কোষরসের আরোহণকে ইংরেজিতে কী বলে?\n(ক) Diffusion pressure (খ) Ascent of sap\n(গ) Cell to cell osmosis (ঘ) Vascular transport\nউত্তর: খ\n৩১. কোষরস বিভিন্ন প্রক্রিয়ার প্রভাবে কলার মাধ্যমে কোন দিকে উঠতে থাকে?\n(ক) মাটির গভীরে (খ) ধীরে ধীরে উপরের দিকে\n(গ) কেবল পাতার প্রান্তভাগে (ঘ) মূলের নিচের দিকে\nউত্তর: খ\n৩২. মূলরোম দিয়ে শোষিত পানি এবং খনিজ পদার্থ কোন প্রক্রিয়ায় মূলরোম থেকে পাশের কোষে যায়?\n(ক) অভিস্রবণ (খ) ইমবাইবিশন\n(গ) প্রশ্বেদন (ঘ) পরিশ্রুতকরণ\nউত্তর: ক\n৩৩. মূলের পরিবহন কলা থেকে পানি ও খনিজ লবণ পরিবাহিত হয়ে কাণ্ড বেয়ে পাতার কোন কলায় পৌঁছায়?\n(ক) কর্টেক্স কলায় (খ) মেসোফিল কলায়\n(গ) এপিডার্মিস কলায় (ঘ) ক্যামবিয়াম কলায়\nউত্তর: খ\n৩৪. উদ্ভিদের রস উত্তোলন পরীক্ষায় কোন উদ্ভিদটি ব্যবহার করা হয়েছে?\n(ক) Hydrilla (খ) Peperomia\n(গ) Pisum (ঘ) Hibiscus\nউত্তর: খ\n৩৫. উদ্ভিদের রস উত্তোলন পরীক্ষায় পানিতে কোন রঞ্জক বা কালি যোগ করা হয়?\n(ক) মিথিলিন ব্লু (খ) স্যাফ্রানিন বা লাল কালি\n(গ) ক্রিস্টাল ভায়োলেট (ঘ) ইওসিন\nউত্তর: খ\n৩৬. Peperomia উদ্ভিদটি দিয়ে পরীক্ষার জন্য মূলগুলো পানিতে ডুবিয়ে কতক্ষণ রেখে দেওয়ার নির্দেশ দেওয়া হয়েছে?\n(ক) কয়েক মিনিট (খ) কয়েক ঘণ্টা\n(গ) $২\\text{ দিন}$ (ঘ) $১\\text{ সপ্তাহ}$\nউত্তর: খ\n৩৭. Passive absorption-এর বাংলা পরিভাষা কোনটি?\n(ক) সক্রিয় শোষণ (খ) নিষ্ক্রিয় শোষণ\n(গ) পরোক্ষ পরিবহন (ঘ) দ্রুত শোষণ\nউত্তর: খ\n৩৮. Active absorption-এর বাংলা পরিভাষা কোনটি?\n(ক) সক্রিয় শোষণ (খ) নিষ্ক্রিয় শোষণ\n(গ) প্রত্যক্ষ পরিবহন (ঘ) চোষক শোষণ\nউত্তর: ক\n৩৯. 'Cell sap' কথাটির সঠিক বাংলা রূপ কোনটি?\n(ক) কোষপ্রাচীর (খ) কোষরস\n(গ) প্রোটোপ্লাজম (ঘ) কোষ গহ্বর\nউত্তর: খ\n৪০. মাটির কৈশিক পানি শোষণে পাতা থেকে মূলরোম পর্যন্ত কোন ঘাটতিটি ক্রমশ বিস্তৃত হয়?\n(ক) অভিস্রবণ চাপ ঘাটতি (খ) ব্যাপন চাপ ঘাটতি\n(গ) মূলজ চাপ (ঘ) ইমবাইবিশন চাপ\nউত্তর: খ"},{"id":"block_1787668596332fxj0u","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:navy;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n\n\n৪১. মাটির কৈশিক পানি ও মূলরোমের পানি শোষণ প্রক্রিয়া সম্পর্কে বলা যায়—\ni. মূলরোমের মাধ্যমে মাটির কৈশিক পানি শোষিত হয়\nii. প্রশ্বেদনের ফলে পাতার কোষে ব্যাপন চাপ ঘাটতি সৃষ্টি হয়\niii. সৃষ্টি হওয়া চোষক শক্তির টানে পানি মূলরোমে প্রবেশ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪২. উদ্ভিদের কোষ থেকে কোষান্তরে অভিস্রবণ (Cell to cell osmosis) বিষয়ে সঠিক তথ্য হলো—\ni. মাটির পানি মূলরোম থেকে প্রথমে কর্টেক্সে প্রবেশ করে\nii. কর্টেক্স থেকে পানি অন্তঃত্বক ও পরিচক্র অতিক্রম করে পরিবহন কলায় পৌঁছায়\niii. পরিচক্র পার হয়ে পানি কেবল ফ্লোয়েম কলায় জমা হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৩. উদ্ভিদের খনিজ লবণ শোষণ সম্পর্কে সত্য তথ্য হলো—\ni. অধিকাংশ লবণ মূলের অগ্রভাগের কোষ বিভাজন অঞ্চল দিয়ে শোষিত হয়\nii. খনিজ লবণ অণু হিসেবে শোষিত না হয়ে অনয়ন হিসেবে শোষিত হয়\niii. খনিজ লবণ শোষণ পদ্ধতি মূলত দুটি উপায়ে সম্পন্ন হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৪. নিষ্ক্রিয় খনিজ লবণ শোষণের (Passive absorption) বৈশিষ্ট্য হলো—\ni. এতে কোনো বিপাকীয় শক্তির প্রয়োজন হয় না\nii. ইমবাইবিশন ও অভিস্রবণ প্রক্রিয়ায় লবণ শোষিত হয়\niii. কোষে উৎপন্ন বিপাকীয় শক্তি সরাসরি ব্যবহৃত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৫. সক্রিয় খনিজ লবণ শোষণের (Active absorption) ক্ষেত্রে কোনটি সঠিক?\ni. খনিজ লবণ পরিবহনের জন্য কোষে উৎপন্ন বিপাকীয় শক্তির প্রয়োজন হয়\nii. এটি নিষ্ক্রিয় শোষণের বিপরীত নীতিতে ঘটে\niii. এতে মূলরোমের কোনো ভূমিকা নেই\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৬. উদ্ভিদে জাইলেম ও ফ্লোয়েমের পরিবহন কাজ সম্পর্কে বলা যায়—\ni. জাইলেম ভেসেল পানি ও খনিজ লবণ পাতায় পৌঁছে দেয়\nii. ফ্লোয়েম সিভনল পাতায় তৈরি খাদ্য বিভিন্ন অঙ্গ-প্রত্যঙ্গে পরিবহন করে\niii. জাইলেম ও ফ্লোয়েম উভয়ই কেবল নিচের দিকে উপাদান পরিবহন করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৭. মূলজ চাপ ও রস উত্তোলনে বিজ্ঞানীরা যেসব বলের প্রবর্তনার কথা বলেছেন—\ni. প্রশ্বেদন টান\nii. কৈশিক শক্তি\niii. মূলজ চাপ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৮. ফ্লোয়েম টিস্যুর সিভনলের মাধ্যমে প্রস্তুতকৃত খাদ্য পরিবহনের দিকগুলো হলো—\ni. নিচের দিকের যৌগে প্রস্তুত খাদ্য নিচের দিকে পাঠায়\nii. উপরে সংগৃহীত উপাদান উপরের দিকে পাঠায়\niii. মাঝামাঝি এলাকার উপাদান উপরে বা নিচে যেকোনো দিকে পাঠাতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৯. কোষরস (Cell sap) এবং এর আরোহণ (Ascent of sap) সম্পর্কে তথ্য হলো—\ni. কোষে থাকা পানি ও পানিতে দ্রবীভূত খনিজ লবণকে কোষরস বলে\nii. কোষরস বিভিন্ন প্রক্রিয়ার প্রভাবে ধীরে ধীরে উপরের দিকে উঠে যায়\niii. কোষরস কাণ্ড বেয়ে পাতার মেসোফিল কলায় পৌঁছায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫০. উদ্ভিদের রস উত্তোলন পরীক্ষা (Peperomia উদ্ভিদ দিয়ে) সম্পর্কিত তথ্য হলো—\ni. এটি প্রমাণ করে যে পানি কাণ্ডের মাধ্যমে উপরে বাহিত হয়\nii. পরীক্ষায় স্যাফ্রানিন বা লাল কালি মেশানো পানি ব্যবহার করা হয়\niii. উদ্ভিদের মূলগুলো পানিতে সম্পূর্ণ ডুবিয়ে রাখা আবশ্যক\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫১. উদ্ভিদের পরিবহন ব্যবস্থা ও এর প্রয়োজনীয়তা বিষয়ে সত্য কথা হলো—\ni. জাইলেম বা ফ্লোয়েমের পথ বন্ধ হলে উদ্ভিদের মৃত্যু অবধারিত\nii. পরিবহনের মাধ্যমে শোষিত উপাদান ও তৈরি খাদ্য যথাস্থানে স্থানান্তরিত হয়\niii. পরিবহন প্রক্রিয়া উদ্ভিদের কাণ্ড ও পাতার বৃদ্ধি নিয়ন্ত্রণ করে না\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_1787668656717admop","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:navy;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৫২ ও ৫৩) নং প্রশ্নের উত্তর দাও:   </b> \nতানভির তার টবের গাছে পানি দেওয়ার পর লক্ষ করল মাটির কণার ফাঁকে জমে থাকা পানি উদ্ভিদের মূলরোম শুষে নিচ্ছে। পরবর্তীতে ক্লাসে শিক্ষক ব্যাখ্যা করলেন, পাতার প্রস্বেদনের কারণে সৃষ্ট চাপের টানেই মূলত মূলরোমে পানির প্রবাহ ঘটে।\n৫২. উদ্দীপকে উল্লিখিত মাটির কণার ফাঁকে আটকে থাকা যে পানি উদ্ভিদ মূলরোম দিয়ে শোষণ করে, তাকে কী বলে?\n(ক) গ্রাভিটেশনাল পানি (খ) কৈশিক পানি\n(গ) আর্দ্রতাগ্রাহী পানি (ঘ) কেমিক্যাল পানি\nউত্তর: খ\n৫৩. উদ্দীপকে বর্ণিত পাতার কোষে শোষক টান সৃষ্টিকারী চাপ ঘাটতিকে কী বলা হয়?\n(ক) ইমবাইবিশন চাপ (খ) ব্যাপন চাপ ঘাটতি\n(গ) অভিস্রবণ চাপ (ঘ) দ্রাবক চাপ\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫৪ ও ৫৫) নং প্রশ্নের উত্তর দাও:   </b> \nউদ্ভিদবিজ্ঞানের ল্যাবরেটরিতে শিক্ষক শিক্ষার্থীদের দুটি পাত্রের মূল দ্বারা খনিজ লবণ শোষণের প্রক্রিয়া দেখালেন। প্রথম পাত্রের উদ্ভিদটি কোষে উৎপন্ন বিপাকীয় শক্তি ব্যবহার করে লবণ শোষণ করছে এবং দ্বিতীয় পাত্রের উদ্ভিদটি কোনো প্রকার শক্তি ব্যয় না করেই লবণ শোষণ সম্পন্ন করছে।\n৫৪. উদ্দীপকে প্রথম পাত্রের উদ্ভিদের মতো বিপাকীয় শক্তির প্রভাবে লবণ শোষণ প্রক্রিয়াকে কী বলে?\n(ক) নিষ্ক্রিয় শোষণ (খ) সক্রিয় শোষণ\n(গ) ইমবাইবিশন (ঘ) অভিস্রবণ\nউত্তর: খ\n৫৫. উদ্দীপকে দ্বিতীয় পাত্রের উদ্ভিদের মতো শক্তি ছাড়া লবণ শোষণে মূলত কোন দুটি প্রক্রিয়া অংশ নেয়?\n(ক) ইমবাইবিশন ও অভিস্রবণ (খ) প্রশ্বেদন ও ব্যাপন\n(গ) সক্রিয় পরিবহন ও ব্যাপন \n(ঘ) সালোকসংশ্লেষণ ও শ্বসন\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৫৬ ও ৫৭) নং প্রশ্নের উত্তর দাও:   </b> \nপরীক্ষাগারে একটি পাত্রে লাল কালি বা স্যাফ্রানিন মিশ্রিত পানি নিয়ে তাতে মূলসহ একটি $Peperomia$ উদ্ভিদ স্থাপন করা হলো। কয়েক ঘণ্টা পর দেখা গেল উদ্ভিদটির কাণ্ড এবং পাতার শিরাগুলোর মধ্য দিয়ে লাল রঙের দ্রবণ ধীরে ধীরে উপরিভাগে উঠে গেছে।\n৫৬. উদ্দীপকের $Peperomia$ উদ্ভিদের মাধ্যমে সম্পাদিত পরীক্ষাটি দিয়ে মূলত কী প্রমাণ করা হয়?\n(ক) উদ্ভিদের খাদ্য তৈরি \n(খ) উদ্ভিদে রস উত্তোলন বা পরিবহন\n(গ) উদ্ভিদের অক্সিজেন ত্যাগ \n(ঘ) উদ্ভিদের পাতায় বাষ্পীভবন\nউত্তর: খ\n৫৭. উদ্দীপকে লাল কালিযুক্ত দ্রবণটি উদ্ভিদের কাণ্ড বেয়ে পাতার মেসোফিল কলায় পৌঁছাতে কোন পরিবহন কলা ব্যবহার করেছে?\n(ক) ফ্লোয়েম (খ) জাইলেম\n(গ) কর্টেক্স (ঘ) এপিডার্মিস\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫৮ ও ৫৯) নং প্রশ্নের উত্তর দাও:   </b> \nউদ্ভিদের পাতার মেসোফিল কলায় সালোকসংশ্লেষণ প্রক্রিয়ায় খাদ্য প্রস্তুত হয়। এই প্রস্তুতকৃত খাদ্য একটি বিশেষ পরিবাহী কলার মাধ্যমে কাণ্ডের উপরের অংশে, নিচের অংশে এবং মাঝের অঞ্চলগুলোতে প্রয়োজন অনুযায়ী পরিবাহিত হয়।\n৫৮. উদ্দীপকে প্রস্তুতকৃত খাদ্য উদ্ভিদের সমস্ত অঙ্গ-প্রত্যঙ্গে স্থানান্তরের দায়িত্ব পালন করে কোন টিস্যু?\n(ক) জাইলেম (খ) ফ্লোয়েম\n(গ) কর্টেক্স (ঘ) ক্যামবিয়াম\nউত্তর: খ\n৫৯. উদ্দীপকে উল্লিখিত পরিবাহী টিস্যুর কোন উপাদানটির মাধ্যমে তৈরি খাদ্য বিভিন্ন দিকে পরিবাহিত হয়?\n(ক) ট্রাকিড (খ) সিভনল\n(গ) ভেসেল (ঘ) ফ্লোয়েম ফাইবার\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬০ ও ৬১) নং প্রশ্নের উত্তর দাও:   </b> \nউদ্ভিদের মূলরোম দিয়ে শোষিত মাটির কৈশিক পানি সরাসরি পরিবাহী কলায় প্রবেশ করতে পারে না। পানি প্রথমে বাইরের কোষস্তর থেকে একে একে একাধিক অভ্যন্তরীণ কোষস্তরে স্থানান্তরিত হয়ে অবশেষে মূলের কেন্দ্রে থাকা কলায় প্রবেশ করে।\n৬০. উদ্দীপকে মূলরোম থেকে পানি মূলের কর্টেক্স অতিক্রম করার এই প্রক্রিয়াটিকে কী বলে?\n(ক) নিষ্ক্রিয় শোষণ \n(খ) কোষ থেকে কোষান্তরে অভিস্রবণ\n(গ) সক্রিয় পরিবহন (ঘ) ইমবাইবিশন\nউত্তর: খ\n৬১. উদ্দীপকের পানি মূলের কর্টেক্স অতিক্রম করে কোন স্তর দুটি পার হয়ে জাইলেম কলায় পৌঁছায়?\n(ক) মূলত্র ও বহিঃত্বক (খ) অন্তঃত্বক ও পরিচক্র\n(গ) সিভনল ও সঙ্গীকোষ \n(ঘ) মেসোফিল ও এপিডার্মিস\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬২ ও ৬৩) নং প্রশ্নের উত্তর দাও:   </b> \nড. রশীদ শিক্ষার্থীদের পড়ানোর সময় বললেন, \"উদ্ভিদের বেঁচে থাকার জন্য পানি ও খনিজ লবণ অতি প্রয়োজনীয় উপাদান। উদ্ভিদের কোষে থাকা পানি এবং তাতে দ্রবীভূত খনিজ লবণ মিলে যে বিশেষ তরল তৈরি হয়, তা মূলের অগ্রভাগের কোষ বিভাজন অঞ্চলের সাহায্যে আয়নিক অবস্থায় শোষিত হয়ে উপরে উঠে যায়।\"\n৬২. উদ্দীপকে উল্লিখিত কোষে থাকা পানি এবং দ্রবীভূত খনিজ লবণের মিশ্রণকে এক কথায় কী বলে?\n(ক) প্রোটোপ্লাজম (খ) কোষরস ($cell\\ sap$)\n(গ) সাইটোপ্লাজম (ঘ) প্লাজমা\nউত্তর: খ\n৬৩. উদ্দীপকে বর্ণিত খনিজ উপাদানগুলো মূলত কোন অঞ্চলটি ব্যবহার করে উদ্ভিদদেহে শোষিত হয়?\n(ক) মূলরোম অঞ্চল \n(খ) মূলের অগ্রভাগের কোষ বিভাজন অঞ্চল\n(গ) স্থায়ী অঞ্চল (ঘ) মূলত্র অঞ্চল\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬৪ ও ৬৫) নং প্রশ্নের উত্তর দাও:   </b> \nএক গবেষণা পত্রে দেখা গেল, বিশালাকার বৃক্ষরাজিতে মাটি থেকে শোষিত পানি ও খনিজ লবণ অত্যন্ত উঁচুতে পৌঁছানোর জন্য কয়েকটি ভৌত বলের যৌথ ক্রিয়া প্রয়োজন হয়। আবার কোনো কারণে যদি উদ্ভিদের পরিবহন পথ বন্ধ হয়ে যায়, তবে উদ্ভিদের জীবন ধারণ করা অসম্ভব হয়ে পড়ে।\n৬৪. উদ্দীপক অনুযায়ী কোষরস উপরে ওঠার জন্য বিজ্ঞানীরা কোন তিনটি সমন্বিত বলের কথা বলেছেন?\n(ক) অভিস্রবণ চাপ, ব্যাপন চাপ ও ইমবাইবিশন \n(খ) প্রশ্বেদন টান, কৈশিক শক্তি ও মূলজ চাপ\n(গ) শসন টান, আলোক শক্তি ও তাপ চাপ \n(ঘ) দ্রাবক চাপ, স্ফীতি চাপ ও রস চাপ\nউত্তর: খ\n৬৫. উদ্দীপক অনুযায়ী নিচের কোন নালিকাটির পথ সম্পূর্ণ রুদ্ধ হয়ে গেলে উদ্ভিদের মৃত্যু অবধারিত?\n(ক) জাইলেম ভেসেল বা ফ্লোয়েম সিভনল \n(খ) এপিডার্মিস বা কর্টেক্স\n(গ) মূলত্র বা মূলরোম (ঘ) মেসোফিল বা পত্ররন্ধ্র\nউত্তর: ক"}]},{"id":"topic_17876686775186jgal","title":"পাঠ-( 6.2.3 – 6.2.4)","blocks":[{"id":"block_17876687453181roir","type":"text","value":"<span style=\"color:blue;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. সালোকসংশ্লেষণ প্রক্রিয়ায় উৎপন্ন শর্করা জাতীয় খাদ্য কন্দ হিসেবে সঞ্চিত থাকে উদ্ভিদের কোন অংশে?\n(ক) গোল আলু (খ) মিষ্টি আলু\n(গ) ঘৃতকুমারী (ঘ) ব োল আলুর কন্দে এবং মিষ্টি আলুর মূলে অতিরিক্ত খাদ্য সঞ্চিত থাকে\niii. ঘৃতকুমারীর পাতায় খাদ্য জমা থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪২. সিভনল ($Sieve\\ tube$)-এর বৈশিষ্ট্যগুলো হলো—\ni. এটি এক ধরনের নিউক্লিয়াসবিহীন সজীব কোষ\nii. এর মধ্যবর্তী অনুপ্রস্থ প্রাচীর চালুনির মতো ছিদ্রযুক্ত\niii. শীতকালে এর রন্ধ্রগুলোতে ক্যালোজ নামক পদার্থ জমা হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৩. সিভনলে ক্যালোজ জমা হওয়া ও খাদ্য পরিবহন বিষয়ে সঠিক তথ্য—\ni. শীতকালে ক্যালোজ জমার কারণে খাদ্য চলাচল ব্যাহত হয়\nii. গ্রীষ্মের আগমনে জমা হওয়া ক্যালোজ গলে যায়\niii. ক্যালোজ গলে গেলে খাদ্য চলাচল পুনরায় স্বাভাবিক হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৪. বিট ($Beet$) উদ্ভিদে অতিরিক্ত খাদ্য সঞ্চয় কোথায় ঘটে?\ni. বিটের ফল ii. বিটের বীজকোষ iii. বিটের মূল\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৫. পত্ররন্ধ্রীয় প্রশ্বেদন ($Stomatal\\ transpiration$) সম্পর্কে সত্য তথ্য হলো—\ni. মোট প্রশ্বেদনের $৯০-৯৫\\%$ পত্ররন্ধ্রের মাধ্যমে ঘটে\nii. প্রতিটি পত্ররন্ধ্র দুটি রক্ষীকোষ ($Guard\\ cell$) দ্বারা পরিবেষ্টিত থাকে\niii. পাতায়, কচি কাণ্ডে, ফুলের বৃত্তি ও পাপড়িতে পত্ররন্ধ্র থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৬. লেন্টিকেলীয় প্রশ্বেদন ($Lenticular\\ transpiration$) এর ক্ষেত্রে কোনটি সঠিক?\ni. উদ্ভিদের গৌণ বৃদ্ধির ফলে কাণ্ডের বাকল ফেটে লেন্টিসেল সৃষ্টি হয়\nii. লেন্টিসেলের ভেতরের কোষগুলো আলগাভাবে সজ্জিত থাকে\niii. লেন্টিসেলের মাধ্যমে কিছু পানি বাষ্পাকারে বাইরে বেরিয়ে যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৭. কিউটিকুলার প্রশ্বেদনের ($Cuticular\\ transpiration$) বৈশিষ্ট্যসমূহ হলো—\ni. উদ্ভিদের বহিত্বকের ওপর কিউটিনের আস্তরণকে কিউটিকল বলে\nii. কিউটিকল ভেদ করে কিছু পানি বাষ্পাকারে বের হয়ে যায়\niii. এটি কাণ্ডের প্রধান বাকলের মাধ্যমে ঘটে থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪৮. প্রশ্বেদনের হার বৃদ্ধিতে বাহ্যিক প্রভাবকগুলোর ভূমিকা হলো—\ni. তাপমাত্রা বাড়লে বায়ুমণ্ডলের জলীয়বাষ্প ধারণক্ষমতা বাড়ে এবং প্রশ্বেদন বাড়ে\nii. আলোর উপস্থিতিতে পত্ররন্ধ্র খুলে যায় বলে প্রশ্বেদন হার বাড়ে\niii. আপেক্ষিক আর্দ্রতা কম থাকলে প্রশ্বেদনের হার বাড়ে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৯. প্রশ্বেদনের ওপর বায়ুপ্রবাহের প্রভাব সম্পর্কিত বাক্যগুলো হলো—\ni. বায়ুপ্রবাহ প্রশ্বেদনের ফলে সৃষ্ট সিক্ত বায়ুকে সরিয়ে দেয়\nii. বায়ুপ্রবাহের কারণে পত্ররন্ধ্রে চাপ পড়লে বাষ্পীভবন হ্রাস পায়\niii. বায়ুপ্রবাহ কমে গেলে বাষ্পীভবন প্রক্রিয়ার গতি বৃদ্ধি পায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৫০. প্রশ্বেদনের অভ্যন্তরীণ প্রভাবকসমূহ হলো—\ni. পত্ররন্ধ্রের সংখ্যা, আয়তন, গঠন ও অবস্থান\nii. পত্রফলকের আয়তন ও উদ্ভিদের বায়ব অঙ্গের কলেবর\niii. স্পঞ্জি প্যারেনকাইমার পরিমাণ ও কিউটিকলের উপস্থিতি\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫১. প্রশ্বেদনের ফলে উদ্ভিদদেহে ঘটে থাকে—\ni. জাইলেম বাহিকায় টান সৃষ্টি হয়ে পানি ও খনিজ লবণ পরিবাহিত হয়\nii. পাতার মেসোফিল টিস্যুতে ব্যাপন চাপ ঘাটতি বজায় থাকে\niii. পাতার কোষগুলোর তাপমাত্রা সহনশীল পর্যায়ে থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫২. বিজ্ঞানী কার্টিস প্রশ্বেদনকে '$Necessary\\ Evil$' বা 'প্রয়োজনীয় ক্ষতি' বলেছেন কারণ—\ni. প্রশ্বেদনের টানে মাটি থেকে পানি ও খনিজ লবণ পরিবাহিত হয়\nii. মাটিতে পানির ঘাটতি থাকলে অতিরিক্ত প্রশ্বেদনে উদ্ভিদের মৃত্যু হতে পারে\niii. এটি কিছুটা ক্ষতিকর হলেও উদ্ভিদের বেঁচে থাকার জন্য অত্যাবশ্যকীয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৩. শীতকালে উদ্ভিদের পাতা ঝরিয়ে দেওয়ার কারণ সম্পর্কিত তথ্য—\ni. শীতকালে মাটিতে পানির ঘাটতি থাকে\nii. পাতা ঝরিয়ে দিলে প্রশ্বেদনের হার হ্রাস পায়\niii. পানি হারানোর হাত থেকে গাছ নিজেকে রক্ষা করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৪. প্রশ্বেদনের ব্যবহারিক পরীক্ষা (সেলোফেন ব্যাগের পরীক্ষা) সম্পর্কিত বক্তব্য—\ni. টবটির মাটি সেলোফেন বা পলিথিন দিয়ে ভালোভাবে বেঁধে দিতে হয়\nii. সেলোফেন ব্যাগের ভেতরের গায়ে পানির ছোট ফোটা জমা হয়\niii. এই পরীক্ষাটি প্রমাণ করে যে উদ্ভিদ বায়ব অঙ্গ দিয়ে পানি বাইরে বের করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৫৫. পত্ররন্ধ্র ($Stomata$) উদ্ভিদের কোন কোন অঙ্গে অবস্থান করে?\ni. পাতায় ও কচি কাণ্ডে\nii. ফুলের বৃত্তিতে\niii. ফুলের পাপড়িতে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ"},{"id":"block_1787669194812712sj","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:blue;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৫৬ ও ৫৭) নং প্রশ্নের উত্তর দাও:   </b> \nরিহান তার বাগানের ঘৃতকুমারী গাছ কেটে পাতার ভেতরে জেলির মতো জমা উপাদান দেখল। তার শিক্ষক তাকে বললেন, সালোকসংশ্লেষণে প্রস্তুতকৃত খাদ্য উদ্ভিদের বিভিন্ন অঙ্গ যেমন— গোল আলু, মিষ্টি আলু ও ঘৃতকুমারীতে সঞ্চিত থাকে এবং ফ্লোয়েম কলায় থাকা একপ্রকার চালুনির মতো ছিদ্রযুক্ত বিশেষ কোষের মাধ্যমে পরিবাহিত হয়।\n৫৬. উদ্দীপকে বর্ণিত খাদ্য পরিবহনের মাধ্যম হিসেবে কাজ করা সজীব ও নিউক্লিয়াসবিহীন কোষ কোনটি?\n(ক) সিভনল (খ) ট্রাকিড\n(গ) জাইলেম ভেসেল (ঘ) বাস্ট ফাইবার\nউত্তর: ক\n৫৭. উদ্দীপক অনুযায়ী ঘৃতকুমারী উদ্ভিদের কোন অংশে অতিরিক্ত খাদ্য সঞ্চিত রাখে?\n(ক) কন্দে (খ) মূলে\n(গ) পাতায় (ঘ) ফলের বীজে\nউত্তর: গ\n<b> নিচের তথ্যের আলোকে (৫৮ ও ৫৯) নং প্রশ্নের উত্তর দাও:   </b> \nশীতকালে উদ্ভিদের ফ্লোয়েম টিস্যুর সিভনল রন্ধ্রে একটি বিশেষ রাসায়নিক পদার্থ জমা হয়ে খাদ্য চলাচল ব্যাহত হয়। তবে গ্রীষ্মের আগমনে তাপমাত্রার পরিবর্তনের ফলে তা গলে যায় এবং খাদ্য পরিবহন পুনরায় স্বাভাবিক হয়।\n৫৮. উদ্দীপকে বর্ণিত শীতকালে সিভনল রন্ধ্রে জমা হওয়া রাসায়নিক পদার্থটির নাম কী?\n(ক) ক্যালোজ (খ) সেলুলোজ\n(গ) পেকটিন (ঘ) লিগনিন\nউত্তর: ক\n৫৯. উদ্দীপকের রাসায়নিক পদার্থটি গলে যাওয়ার পর খাদ্য পরিবহন স্বাভাবিক হওয়ার প্রধান কারণ কোনটি?\n(ক) সিভনলের রন্ধ্রগুলো উন্মুক্ত হয় \n(খ) সিভনলে নিউক্লিয়াস গঠিত হয়\n(গ) ট্রাকিড ও ভেসেল যুক্ত হয় \n(ঘ) কোষপ্রাচীর পুরু হয়ে যায়\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৬০ ও ৬১) নং প্রশ্নের উত্তর দাও:   </b> \nনবম শ্রেণির শিক্ষার্থী আনিকা একটি টবসহ সতেজ গাছ নিল। সে গাছটির একটি পাতাযুক্ত ডালকে স্বচ্ছ সেলোফেন ব্যাগ দিয়ে ঢেকে সুতা দিয়ে ভালোভাবে বেঁধে দিল। কিছু সময় পর সে ব্যাগের ভেতরের গায়ে পানির ক্ষুদ্র ক্ষুদ্র ফোঁটা জমে থাকতে দেখতে পেল।\n৬০. উদ্দীপকের সেলোফেন ব্যাগের পরীক্ষাটির মাধ্যমে উদ্ভিদের কোন শারীরবৃত্তীয় প্রক্রিয়াটি প্রমাণিত হয়?\n(ক) অভিস্রবণ (খ) প্রশ্বেদন\n(গ) সালোকসংশ্লেষণ (ঘ) ইমবাইবিশন\nউত্তর: খ\n৬১. উদ্দীপকের পরীক্ষায় সেলোফেন ব্যাগের ভেতর সংগৃহীত পানির উৎস কোনটি?\n(ক) বায়ুমণ্ডলের জলীয়বাষ্প \n(খ) উদ্ভিদের বায়ব অঙ্গ থেকে নির্গত বাষ্প\n(গ) টবের মাটি থেকে বাষ্পীভূত পানি \n(ঘ) সুতার বাঁধন দিয়ে ঢোকা পানি\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬২ ও ৬৩) নং প্রশ্নের উত্তর দাও:   </b> \nশিক্ষক শ্রেণিকক্ষে তিনটি চিত্র আঁকলেন— ১. পাতায় দুটি রক্ষীকোষ দ্বারা পরিবেষ্টিত সূক্ষ্ম ছিদ্র, ২. বহিত্বকের ওপর কিউটিনের আবরণ, এবং ৩. উদ্ভিদের গৌণ বৃদ্ধির ফলে কাণ্ডের বাকল ফেটে সৃষ্ট ছিদ্র।\n৬২. উদ্দীপকের ১ নং চিত্রে প্রদর্শিত অংশের মাধ্যমে মোট প্রশ্বেদনের শতকরা কত ভাগ সম্পন্ন হয়?\n(ক) $৫০-৬০\\%$ (খ) $৭০-৭৫\\%$\n(গ) $৮০-৮৫\\%$ (ঘ) $৯০-৯৫\\%$\nউত্তর: ঘ\n৬৩. উদ্দীপকের ৩ নং চিত্রে কাণ্ডের বাকল ফেটে আলগাভাবে সজ্জিত কোষযুক্ত যে ছিদ্র গঠিত হয়, তাকে কী বলা হয়?\n(ক) লেন্টিসেল (খ) স্টোমাটা\n(গ) কিউটিকল (ঘ) জলরন্ধ্র\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৬৪ ও ৬৫) নং প্রশ্নের উত্তর দাও:   </b> \nগ্রীষ্মকালে তাপমাত্রা বৃদ্ধি পেলে বায়ুমণ্ডলের জলীয়বাষ্প ধারণক্ষমতা বাড়ে এবং প্রশ্বেদনের হারও ত্বরান্বিত হয়। এছাড়া তীব্র আলোর উপস্থিতিতে এবং বাতাসে আপেক্ষিক আর্দ্রতা কম থাকলে প্রশ্বেদনের গতি স্বাভাবিকের চেয়ে বৃদ্ধি পায়।\n৬৪. উদ্দীপকে উল্লিখিত তাপমাত্রা, আলো ও আপেক্ষিক আর্দ্রতা প্রশ্বেদনের কোন ধরনের প্রভাবক?\n(ক) অভ্যন্তরীণ প্রভাবক (খ) বাহ্যিক প্রভাবক\n(গ) রাসায়নিক প্রভাবক (ঘ) শারীরবৃত্তীয় প্রভাবক\nউত্তর: খ\n৬৫. উদ্দীপক অনুসারে আলোর উপস্থিতিতে প্রশ্বেদনের হার বৃদ্ধি পাওয়ার প্রধান কারণ কোনটি?\n(ক) পত্ররন্ধ্র খুলে যায় (খ) ক্যালোজ জমা হয়\n(গ) লেন্টিসেল বন্ধ হয়ে যায় (ঘ) কিউটিকল পুরু হয়\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৬৬ ও ৬৭) নং প্রশ্নের উত্তর দাও:   </b> \nপরীক্ষাগারে দুটি ভিন্ন গাছের পাতার ওপর পর্যবেক্ষণ করে দেখা গেল— প্রথম গাছের পাতাগুলোর আয়তন বড় এবং এতে স্পঞ্জি প্যারেনকাইমার পরিমাণ বেশি। অন্যদিকে দ্বিতীয় গাছের কাণ্ড ও পাতার বহিত্বকে কিউটিকলের আস্তরণ বেশ পুরু।\n৬৬. উদ্দীপকে উল্লেখিত পত্রফলকের আয়তন ও কিউটিকলের উপস্থিতি প্রশ্বেদনের কোন প্রভাবক গোষ্ঠীর অন্তর্ভুক্ত?\n(ক) বাহ্যিক প্রভাবক (খ) অভ্যন্তরীণ প্রভাবক\n(গ) পরিবেশগত প্রভাবক (ঘ) ভৌগোলিক প্রভাবক\nউত্তর: খ\n৬৭. উদ্দীপকের প্রথম গাছের পাতায় স্পঞ্জি প্যারেনকাইমার পরিমাণ বেশি ও আয়তন বড় হওয়ায় প্রশ্বেদনের হারের কী পরিবর্তন ঘটবে?\n(ক) প্রশ্বেদনের হার হ্রাস পাবে \n(খ) প্রশ্বেদনের হার বৃদ্ধি পাবে\n(গ) প্রশ্বেদন সম্পূর্ণ বন্ধ হবে \n(ঘ) কোনো পরিবর্তন হবে না\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৬৮ ও ৬৯) নং প্রশ্নের উত্তর দাও:   </b> \nবিজ্ঞানী কার্টিস উদ্ভিদের প্রশ্বেদন প্রক্রিয়াটিকে '$Necessary\\ Evil$' বা 'প্রয়োজনীয় ক্ষতি' বলে আখ্যায়িত করেছেন। তিনি জানান, শীতকালে মাটিতে পানির তীব্র ঘাটতি তৈরি হলে অতিরিক্ত প্রশ্বেদনের হাত থেকে নিজেকে বাঁচাতে অনেক বৃক্ষ তাদের পাতা ঝরিয়ে দেয়।\n৬৮. উদ্দীপকে বর্ণিত বিজ্ঞানী কার্টিস প্রশ্বেদনকে কেন '$Necessary\\ Evil$' বলেছেন?\n(ক) এটি মূলের বৃদ্ধিতে প্রতিবন্ধকতা সৃষ্টি করে \n(খ) এটি কেবল উদ্ভিদের ক্ষতি সাধন করে\n(গ) এটি খাদ্য তৈরিতে বাধা দেয় \n(ঘ) এটি পানির অপচয় করলেও জীবনধারণের জন্য অত্যাবশ্যকীয়\nউত্তর: ঘ\n৬৯. উদ্দীপক অনুযায়ী শীতকালে কিছু উদ্ভিদ তাদের পাতা ঝরিয়ে দেওয়ার মূল উদ্দেশ্য কোনটি?\n(ক) বাষ্পীভবনের মাধ্যমে অতিরিক্ত পানি হ্রাস রোধ করা \n(খ) খাদ্য উৎপাদন স্তব্ধ করা\n(গ) লেন্টিসেল ধ্বংস করা (ঘ) ক্যালোজ গলানো\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৭০ ও ৭১) নং প্রশ্নের উত্তর দাও:   </b> \nসজীব তার বাগানের আম গাছে লক্ষ করল যে, পাতা ছাড়াও কাণ্ড ও বহিত্বকের সূক্ষ্ম মাধ্যমের সাহায্যে গাছটি থেকে ক্রমাগত বাষ্পাকারে পানি বাইরে বের হয়ে যাচ্ছে।\n৭০. উদ্দীপকে উদ্ভিদের বহিত্বকের ওপর বিদ্যমান কিউটিনের আস্তরণকে কী বলা হয়?\n(ক) লেন্টিসেল (খ) কিউটিকল\n(গ) এপিডার্মিস (ঘ) স্টোমা\nউত্তর: খ\n৭১. উদ্দীপকে কাণ্ডের গৌণ বৃদ্ধির ফলে সৃষ্ট লেন্টিসেলের মাধ্যমে পানি বাইরে বেরিয়ে যাওয়ার প্রক্রিয়াটিকে কী বলে?\n(ক) পত্ররন্ধ্রীয় প্রশ্বেদন (খ) লেন্টিকেলীয় প্রশ্বেদন\n(গ) কিউটিকুলার প্রশ্বেদন (ঘ) কোষান্তর প্রশ্বেদন\nউত্তর: খ"}]},{"id":"topic_1787669273965w671r","title":"পাঠ-( 6.3 – 6.3.1)","blocks":[{"id":"block_1787669319863a339g","type":"text","value":"<span style=\"color:Gold;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. মানবদেহের রক্ত কেমন ধরনের তরল পদার্থ?\n(ক) লাল বর্ণের, ঈষৎ ক্ষারীয় ও লবণাক্ত \n(খ) হলুদ বর্ণের, অম্লীয় ও মিষ্টি\n(গ) বর্ণহীন, নিরপেক্ষ ও তেতো \n(ঘ) লাল বর্ণের, তীব্র অম্লীয় ও স্বাদহীন\nউত্তর: ক\n২. যে তন্ত্রের মাধ্যমে রক্ত প্রবাহিত হয়ে রক্তের প্রয়োজনীয় উপাদান, অক্সিজেন ও পরিপাক হওয়া খাদ্য উপাদান সারা দেহে পরিবাহিত হয় তাকে কী বলে?\n(ক) রেচনতন্ত্র (খ) রক্ত সংবহনতন্ত্র\n(গ) স্নায়ুতন্ত্র (ঘ) শ্বসনতন্ত্র\nউত্তর: খ\n৩. মানবদেহে রক্ত রক্তনালি ও হূৎপিণ্ডের মধ্যে সীমাবদ্ধ থেকে সংবহন সম্পন্ন করে বলে একে কোন ধরনের সংবহনতন্ত্র বলে?\n(ক) মুক্ত সংবহনতন্ত্র (খ) বন্ধ সংবহনতন্ত্র\n(গ) অর্ধ-মুক্ত সংবহনতন্ত্র (ঘ) উন্মুক্ত সংবহনতন্ত্র\nউত্তর: খ\n৪. মানবদেহের সংবহনতন্ত্রকে প্রধানত কয়টি ভাগে ভাগ করা যায়?\n(ক) $২$ টি (খ) $৩$ টি\n(গ) $৪$ টি (ঘ) $৫$ টি\nউত্তর: ক\n৫. মানবদেহের রক্ত সংবহনতন্ত্র কোন অঙ্গগুলো নিয়ে গঠিত?\n(ক) হূৎপিণ্ড, ধমনি, শিরা ও কৈশিকনালি \n(খ) লসিকা, লসিকানালি ও লসিকাগাাঁট\n(গ) বৃক্ক, ইউরেটার ও মূত্রথলি \n(ঘ) ফুসফুস, ট্রাকিয়া ও ব্রঙ্কাস\nউত্তর: ক\n৬. লসিকাতন্ত্র নিচের কোন উপাদানগুলো নিয়ে গঠিত?\n(ক) ধমনি, শিরা ও হূৎপিণ্ড \n(খ) লসিকা, লসিকানালি ও লসিকাগোষ্ঠী\n(গ) রক্তরস, রক্তকণিকা ও হিমোগ্লোবিন \n(ঘ) সিভনল, সঙ্গীকোষ ও ট্রাকিড\nউত্তর: খ\n৭. রক্ত এক ধরনের কী জাতীয় টিস্যু?\n(ক) আবরণী কলা (খ) তরল যোজক কলা\n(গ) পেশি কলা (ঘ) স্নায়ু কলা\nউত্তর: খ\n৮. রক্তের প্রধান উপাদান দুটি কী কী?\n(ক) পানি ও খনিজ লবণ (খ) রক্তরস ও রক্তকণিকা\n(গ) হিমোগ্লোবিন ও প্রোটিন (ঘ) অনুচক্রিকা ও লসিকা\nউত্তর: খ\n৯. রক্তের শতকরা কত ভাগ রক্তরস (Plasma)?\n(ক) $৪৫\\%$ (খ) $৫৫\\%$\n(গ) $৫০\\%$ (ঘ) $৬০\\%$\nউত্তর: খ\n১০. লোহিত রক্তকণিকায় কোন রঞ্জক পদার্থ থাকার কারণে রক্ত দেখতে লাল দেখায়?\n(ক) ক্লোরোফিল (খ) িগ্রস্ত হলে অনুচক্রিকা সক্রিয় হয়ে কোন কেমিক্যাল পদার্থ তৈরি করে?\n(ক) থ্রম্বোপ্লাস্টিন (খ) ফিব্রিনোজেন\n(গ) হিস্টামিন (ঘ) হেপারিন\nউত্তর: ক\n৫১. থ্রম্বোপ্লাস্টিন রক্তের প্রোটিন প্রোথ্রম্বিনকে কিসে পরিণত করে?\n(ক) থ্রম্বিনে (খ) ফিব্রিনে\n(গ) আলবুমিনে (ঘ) গ্লোবুলিনে\nউত্তর: ক\n৫২. থ্রম্বিন রক্তরসের প্রোটিন ফিব্রিনোজেনকে কিসে পরিণত করে রক্তের তঞ্চন ঘটায়?\n(ক) ফিব্রিন জালে (খ) প্রোটোইন জালে\n(গ) হেপারিন জালে (ঘ) প্লাজমা জালে\nউত্তর: ক\n৫৩. রক্ত তঞ্চনে সৃষ্ট ফিব্রিন কেমন ধরনের প্রোটিন?\n(ক) অদ্রবণীয় প্রোটিন (খ) দ্রবণীয় প্রোটিন\n(গ) ক্ষারীয় প্রোটিন (ঘ) তরল প্রোটিন\nউত্তর: ক\n৫৪. রক্ত তঞ্চন বা জমাট বাঁধার প্রক্রিয়ার জন্য কোন ভিটামিন এবং ক্যাটায়নযুক্ত আয়ন জড়িত থাকে?\n(ক) ভিটামিন $K$ ও ক্যালসিয়াম আয়নিক ($Ca^{2+}$) \n(খ) ভিটামিন $A$ ও আয়রন\n(গ) ভিটামিন $C$ ও সোডিয়াম \n(ঘ) ভিটামিন $D$ ও পটাশিয়াম\nউত্তর: ক\n৫৫. লোহিত রক্তকণিকা দেহের সব জায়গায় অক্সিজেন পরিবহন করে কোন যৌগ হিসেবে?\n(ক) অক্সিহিমোগ্লোবিন (খ) কার্বামিনো যৌগ\n(গ) সোডিয়াম বাইকার্বোনেট (ঘ) ফিব্রিনোজেন\nউত্তর: ক\n৫৬. টিস্যু থেকে রক্তরসের মাধ্যমে কার্বন ডাই-অক্সাইড ফুসফুসে বাহিত হয় প্রধানত কী হিসেবে?\n(ক) সোডিয়াম বাইকার্বোনেট (খ) অক্সিহিমোগ্লোবিন\n(গ) ইউরিয়া (ঘ) কার্বামিনো হিমোগ্লোবিন\nউত্তর: ক\n৫৭. দেহের নালিবিহীন বা অনাল গ্রন্থি থেকে উৎপন্ন হরমোন সরাসরি কিসের মাধ্যমে বিভিন্ন অঙ্গে বাহিত হয়?\n(ক) রক্ত (খ) লসিকা\n(গ) স্নায়ুরস (ঘ) পাচক রস\nউত্তর: ক\n৫৮. দেহের ভেতরে অনবরত ঘটা দহনক্রিয়ায় উৎপন্ন তাপ রক্তের মাধ্যমে সর্বত্র ছড়িয়ে পড়ে কিসের সমতা রক্ষা করে?\n(ক) তাপের সমতা (খ) অম্লতার সমতা\n(গ) চাপের সমতা (ঘ) ঘনত্বের সমতা\nউত্তর: ক\n৫৯. ক্ষতিকর ইউরিয়া, ইউরিক এসিড ও কার্বন ডাই-অক্সাইড ইত্যাদি বর্জ্য পদার্থ নিষ্কাশনের জন্য পরিবহন করে কোনটি?\n(ক) রক্ত (খ) পিত্তরস\n(গ) প্রোটোপ্লাজম (ঘ) শ্লেষ্মা\nউত্তর: ক\n৬০. শ্বেত রক্তকণিকা কোনো জীবাণু আক্রমণ করলে রক্তে অ্যান্টিবডি ও অ্যান্টিজেন উৎপাদনের মাধ্যমে কী বৃদ্ধি করে?\n(ক) রক্ত প্রতিরোধ ক্ষমতা (খ) হরমোন নিঃসরণ\n(গ) তাপমাত্রার মাত্রা (ঘ) সংবহনের গতি\nউত্তর: ক"},{"id":"block_17876694454048wlkj","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:Gold;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৬১. মানবদেহের বন্ধ রক্ত সংবহনতন্ত্র (Close circulatory system) সম্পর্কে বলা যায়—\ni. রক্ত রক্তনালি ও হূৎপিণ্ডের ভেতরে সীমাবদ্ধ থেকে প্রবাহিত হয়\nii. রক্তের মাধ্যমে উপাদানগুলো সরাসরি দেহের বিভিন্ন অবঙ্গে পৌঁছায়\niii. অঙ্গ ঘুরে রক্ত পুনরায় হূৎপিণ্ডে ফিরে আসে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৬২. মানবদেহের সংবহনতন্ত্রের উপাদানসমূহ বিষয়ে সঠিক তথ্য—\ni. রক্ত সংবহনতন্ত্র গঠিত হয় হূৎপিণ্ড, ধমনি, শিরা ও কৈশিকনালি দিয়ে\nii. লসিকাতন্ত্র গঠিত হয় লসিকা, লসিকানালি ও লসিকাগাঁট দিয়ে\niii. মানবদেহে রক্ত চলাচলের জন্য সংবহনতন্ত্রকে দুটি ভাগে ভাগ করা হয়েছে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৬৩. রক্তের ভৌত বৈশিষ্ট্য ও প্রকৃতি হলো—\ni. এটি লাল বর্ণের ও তরল যোজক কলা\nii. রক্ত ঈষৎ ক্ষারীয় ও লবণাক্ত তরল পদার্থ\niii. রক্তনালির ভেতরে রক্তপ্রবাহের মাধ্যমেই উপাদান পরিবাহিত হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৬৪. রক্তের উপাদান ও অনুপাত সম্পর্কে বলা যায়—\ni. রক্তের প্রধান দুটি উপাদান হলো রক্তরস ও রক্তকণিকা\nii. রক্তের প্রায় $৫৫\\%$ অংশ হলো রক্তরস (Plasma)\niii. রক্তকণিকার পরিমাণ মোট রক্তের প্রায় $৪৫\\%$\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৬৫. রক্তরসের (Plasma) ভৌত ও রাসায়নিক গঠন—\ni. রক্তরসের প্রধান উপাদান পানি\nii. এতে $৯-১০\\%$ দ্রবীভূত জৈব ও অজৈব পদার্থ থাকে\niii. আলবুমিন, গ্লোবুলিন, ফিব্রিনোজেন ও প্রোথ্রম্বিন নামক প্রোটিন এতে দ্রবীভূত থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৬৬. রক্তরসে বিদ্যমান জৈব ও নাইট্রোজেনঘটিত উপাদানসমূহ—\ni. গ্লুকোজ, স্নেহ পদার্থ, ভিটামিন ও হরমোন\nii. ইউরিয়া, ইউরিক এসিড ও কার্বন ডাই-অক্সাইড\niii. অ্যান্টিবডি ও বিভিন্ন খনিজ লবণ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৬৭. লোহিত রক্তকণিকা (RBC) সম্পর্কে সত্য তথ্য হলো—\ni. এটি মানবদেহে সবচেয়ে বেশি পরিমাণে বিদ্যমান রক্তকণিকা\nii. এটি লাল অস্থিমজ্জায় তৈরি হয়\niii. এর গড় আয়ু $১২০\\text{ দিন}$\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৬৮. মানুষের লোহিত রক্তকণিকার গঠনগত বৈশিষ্ট্যসমূহ—\ni. এটি নিউক্লিয়াসহীন ও দ্বি-অবতল বৃত্তের মতো\nii. প্রতি ঘনমিলিমিটার রক্তে এর সংখ্যা প্রায় $৫০\\text{ লাখ}$\niii. সুস্থ দেহে এর সংখ্যা শ্বেত রক্তকণিকার চেয়ে প্রায় $৫০০\\text{ গুণ}$ বেশি\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৬৯. লোহিত রক্তকণিকা ও হিমোগ্লোবিনের ভূমিকা—\ni. হিমোগ্লোবিন অক্সিজেনের সাথে যুক্ত হয়ে অক্সিহিমোগ্লোবিন গঠন করে\nii. এটি কার্বন ডাই-অক্সাইড পরিবহনে অংশ নেয়\niii. রক্তে হিমোগ্লোবিনের পরিমাণ কমে গেলে অ্যানিমিয়া বা রক্তশূন্যতা হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৭০. শ্বেত রক্তকণিকা (WBC) বা লিউকোসাইটের বৈচিত্র্যময় বৈশিষ্ট্য—\ni. এদের নির্দিষ্ট কোনো আকার নেই এবং নিউক্লিয়াসযুক্ত\nii. এদের সাইটোপ্লাজমে হিমোগ্লোবিন থাকে না\niii. এদের গড় আয়ু $১-১৫\\text{ দিন}$\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৭১. শ্বেত রক্তকণিকার চলাফেরা ও কাজ করার ক্ষমতা—\ni. এটি ফ্যাগোসাইটোসিস প্রক্রিয়ায় রোগজীবাণু ধ্বংস করে\nii. এটি অ্যামিবার মতো নিজের আকার পরিবর্তন করতে পারে\niii. এটি রক্তকৈশিকনালির প্রাচীর ভেদ করে টিস্যুর মধ্যে প্রবেশ করতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৭২. সুস্থ মানবদেহে শ্বেত রক্তকণিকার সংখ্যা ও উপাদান—\ni. প্রতি ঘনমিলিমিটার রক্তে এদের সংখ্যা $৪-১০\\text{ হাজার}$\nii. শ্বেত রক্তকণিকায় DNA থাকে\niii. দেহে জীবাণুর সংক্রমণ ঘটলে এর সংখ্যা দ্রুত বৃদ্ধি পায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৭৩. সাইটোপ্লাজমে দানার উপস্থিতির ভিত্তিতে শ্বেত রক্তকণিকার বিভাগ—\ni. অ্যাগ্রানুলোসাইট (দানাহীন)\nii. গ্রানুলোসাইট (দানাযুক্ত)\niii. প্লেটলেট (চাকতিযুক্ত)\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৭৪. অ্যাগ্রানুলোসাইট শ্বেত রক্তকণিকা সম্পর্কে সঠিক তথ্য হলো—\ni. এদের সাইটোপ্লাজম দানাহীন ও স্বচ্ছ\nii. এরা দুই ধরনের: লিম্ফোসাইট ও মোনোসাইট\niii. মোনোসাইট অ্যান্টিবডি তৈরি করে জীবাণু ধ্বংস করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৭৫. লিম্ফোসাইট শ্বেত রক্তকণিকার গঠন ও কাজের ক্ষেত্রে সত্য—\ni. এরা বড় নিউক্লিয়াসযুক্ত ছোট কণিকা\nii. এরা দেহের লিম্ফনোড, টনসিল ও প্লিহায় তৈরি হয়\niii. এরা অ্যান্টিবডি গঠন করে দেহের রোগ প্রতিরোধ ক্ষমতা বৃদ্ধি করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৭৬. মোনোসাইট শ্বেত রক্তকণিকার বৈশিষ্ট্য হলো—\ni. এটি ছোট, ডিম্বাকার ও বৃক্কাকার নিউক্লিয়াসবিশিষ্ট বড় কণিকা\nii. এটি ফ্যাগোসাইটোসিস প্রক্রিয়ায় রোগজীবাণু ধ্বংস করে\niii. এটি হিস্টামিন নিঃসৃত করে অ্যালার্জি প্রতিরোধ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৭৭. গ্রানুলোসাইট শ্বেত রক্তকণিকা সম্পর্কে সঠিক উক্তি—\ni. এদের সাইটোপ্লাজম সূক্ষ্ম দানাযুক্ত\nii. নিউক্লিয়াসের আকৃতির ভিত্তিতে এরা তিন প্রকার\niii. নিউট্রোফিল, ইওসিনোফিল ও বেসোফিল হলো এদের উদাহরণ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৭৮. বিভিন্ন প্রকার শ্বেত রক্তকণিকার বিশেষ কাজগুলো হলো—\ni. নিউট্রোফিল ফ্যাগোসাইটোসিস প্রক্রিয়ায় জীবাণু ভক্ষণ করে\nii. ইওসিনোফিল ও বেসোফিল হিস্টামিন নিঃসৃত করে অ্যালার্জি প্রতিরোধ করে\niii. বেসোফিল হেপারিন নিঃসৃত করে রক্তনালির ভেতরে রক্ত জমাট বাঁধতে বাধা দেয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৭৯. অনুচক্রিকা বা প্লেটলেট ($Platelet$)-এর গঠনগত বৈশিষ্ট্য—\ni. এরা গোলাকার, ডিম্বাকার অথবা রড আকারের হতে পারে\nii. এদের সাইটোপ্লাজম দানাদার এবং এতে মাইটোকন্ড্রিয়া ও গলগি বস্তু থাকে\niii. এরা নিউক্লিয়াসযুক্ত সম্পূর্ণ কোষ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৮০. অনুচক্রিকা সম্পর্কে সঠিক তথ্য হলো—\ni. এরা অস্থিমজ্জার বৃহৎ কোষের ছিন্ন অংশ\nii. এদের গড় আয়ু $৫-১০\\text{ দিন}$\niii. পরিণত মানবদেহে প্রতি ঘনমিলিমিটারে এদের সংখ্যা প্রায় আড়াই লাখ\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৮১. রক্ত তঞ্চন ($Blood\\ clotting$) প্রক্রিয়ার ধাপগুলো হলো—\ni. ক্ষতের অনুচক্রিকা সক্রিয় হয়ে থ্রম্বোপ্লাস্টিন তৈরি করে\nii. থ্রম্বোপ্লাস্টিন প্রোটিন প্রোথ্রম্বিনকে থ্রম্বিনে পরিণত করে\niii. থ্রম্বিন ফিব্রিনোজেনকে অদ্রবণীয় ফিব্রিন জালে পরিণত করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৮২. রক্ত জমাট বাঁধার রাসায়নিক উপাদান ও গুরুত্ব সম্পর্কে বলা যায়—\ni. রক্ত তঞ্চন প্রক্রিয়ায় ভিটামিন $K$ এবং ক্যালসিয়াম আয়ন ($Ca^{2+}$) জড়িত থাকে\nii. রক্তে উপযুক্ত পরিমাণ অনুচক্রিকা না থাকলে রক্তপাত সহজে বন্ধ হয় না\niii. ফিব্রিন এক ধরনের দ্রবণীয় প্রোটিন যা সহজে গলে যায়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৮৩. রক্তে গ্যাসেদের সংবহন বিষয়ে সত্য উক্তি হলো—\ni. লোহিত রক্তকণিকা অক্সিহিমোগ্লোবিন হিসেবে অক্সিজেন পরিবহন করে\nii. কার্বন ডাই-অক্সাইড রক্তরসের মাধ্যমে বাইকার্বোনেট হিসেবে ফুসফুসে আসে\niii. লোহিত রক্তকণিকা সরাসরি কার্বন ডাই-অক্সাইড নিষ্কাশন করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৮৪. মানবদেহে রক্তের অন্যান্য গুরুত্বপূর্ণ কাজগুলো হলো—\ni. পাচিত খাদ্যসার গ্লুকোজ ও অ্যামিনো এসিড কোষে সরবরাহ করা\nii. অনাল গ্রন্থিতে তৈরি হরমোন রক্তে মিশে বিভিন্ন অঙ্গে বাহিত হওয়া\niii. দেহের বিভিন্ন অঙ্গের দহনক্রিয়ায় সৃষ্ট তাপের সমতা রক্ষা করা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৮৫. বর্জ্য পদার্থ নিষ্কাশন ও রোগ প্রতিরোধে রক্তের ভূমিকা—\ni. ইউরিয়া, ইউরিক এসিড ও কার্বন ডাই-অক্সাইড নিষ্কাশনে রক্ত কাজ করে\nii. শ্বেত রক্তকণিকা অ্যান্টিবডি ও অ্যান্টিজেন উৎপাদনের মাধ্যমে রোগ প্রতিরোধ বাড়ায়\niii. অনুচক্রিকা ফ্যাগোসাইটোসিস প্রক্রিয়ায় জীবাণু ভক্ষণ করে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_1787669506824mm42s","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:Gold;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৮৬ ও ৮৭) নং প্রশ্নের উত্তর দাও:   </b> \nরফিক সাহেব অসুস্থ হয়ে হাসপাতালে গেলে ডাক্তার বললেন যে, মানবদেহে রক্ত হূৎপিণ্ড এবং রক্তের নির্দিষ্ট নালির ভেতরেই সীমাবদ্ধ থেকে পরিবাহিত হয় এবং সংবহন সম্পন্ন করে। তবে রক্ত সংবহনতন্ত্র ছাড়াও মানবদেহে অপর একটি সংবহনতন্ত্র সক্রিয় ভূমিকা পালন করে।\n৮৬. রফিক সাহেবের দেহে যে বিশেষ ব্যবস্থার মাধ্যমে রক্ত পরিবাহিত হয় তাকে কী বলা হয়?\n(ক) মুক্ত সংবহনতন্ত্র (খ) বন্ধ সংবহনতন্ত্র\n(গ) অর্ধ-মুক্ত সংবহনতন্ত্র (ঘ) উন্মুক্ত সংবহনতন্ত্র\nউত্তর: খ\n৮৭. উদ্দীপকে উল্লিখিত অপর সংবহনতন্ত্রের উপাদান কোনটি?\n(ক) ধমনি, শিরা ও হূৎপিণ্ড \n(খ) লসিকা, লসিকানালি ও লসিকাগাঁট\n(গ) জাইলেম, ফ্লোয়েম ও সিভনল \n(ঘ) প্রোটিন, গ্লুকোজ ও ইউরিয়া\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৮৮ ও ৮৯) নং প্রশ্নের উত্তর দাও:   </b> \nপরীক্ষাগারে ল্যাব অ্যাটেনডেন্ট রক্তকে সেন্ট্রিফিউজ যন্ত্রে পৃথক করে দেখালেন যে, রক্তের একটি প্রধান অংশ হলো তরল পদার্থ যা মোট রক্তের শতকরা $৫৫\\%$ এবং বাকি $৪৫\\%$ অংশ বিভিন্ন কণিকা দ্বারা গঠিত।\n৮৮. উদ্দীপকে বর্ণিত $৫৫\\%$ তরল অংশকে কী বলা হয়?\n(ক) রক্তরস (খ) রক্তকণিকা\n(গ) লসিকা (ঘ) অ্যান্টিবডি\nউত্তর: ক\n৮৯. উদ্দীপকে বর্ণিত $৪৫\\%$ অংশের মধ্যে মানবদেহে সর্বাধিক পরিমাণে বিদ্যমান উপাদান কোনটি?\n(ক) শ্বেত রক্তকণিকা (খ) লোহিত রক্তকণিকা\n(গ) অনুচক্রিকা (ঘ) থ্রম্বোসাইট\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৯০ ও ৯১) নং প্রশ্নের উত্তর দাও:   </b> \nরক্তরসে দ্রবীভূত পদার্থের মধ্যে শতকরা $৯-১০\\%$ অংশ জৈব ও অজৈব পদার্থ। এই জৈব উপাদানগুলোর মধ্যে রক্তের জমাট বাঁধার জন্য প্রয়োজনীয় আলবুমিন, গ্লোবুলিন, ফিব্রিনোজেন ও প্রোথ্রম্বিনের মতো বিশেষ উপাদান উপস্থিত থাকে।\n৯০. উদ্দীপকে বর্ণিত আলবুমিন, গ্লোবুলিন ও ফিব্রিনোজেন রক্তের কী ধরনের উপাদান?\n(ক) রক্তরস প্রোটিন (খ) খনিজ লবণ\n(গ) নাইট্রোজেনঘটিত বর্জ্য (ঘ) হরমোন\nউত্তর: ক\n৯১. উদ্দীপকের জৈব পদার্থ ছাড়াও রক্তরসে সামান্য পরিমাণে দ্রবীভূত থাকা অজৈব উপাদান কোনটি?\n(ক) সোডিয়াম ক্লোরাইড ও ক্যালসিয়াম বাইকার্বোনেট \n(খ) জিংক ও আইরিন\n(গ) ইউরিয়া ও ইউরিক এসিড \n(ঘ) গ্লুকোজ ও ফ্যাটি এসিড\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৯২ ও ৯৩) নং প্রশ্নের উত্তর দাও:   </b> \nএকটি সচিত্র চিত্রে দেখা গেল— লাল অস্থিমজ্জা থেকে একধরনের নিউক্লিয়াসহীন ও দ্বি-অবতল বৃত্তের মতো রক্তকণিকা তৈরি হচ্ছে। একজন সুস্থ পুরুষের প্রতি কিউবিক মিলিমিটারে এই কণিকার সংখ্যা প্রায় $৫০\\text{ লাখ}$।\n৯২. উদ্দীপকে বর্ণিত রক্তকণিকাটির নাম কী?\n(ক) লোহিত রক্তকণিকা (খ) শ্বেত রক্তকণিকা\n(গ) অনুচক্রিকা (ঘ) লিউকোসাইট\nউত্তর: ক\n৯৩. উদ্দীপকে উল্লেখিত রক্তকণিকাটির গড় আয়ু কত দিন?\n(ক) $১-১৫\\text{ দিন}$ (খ) $১২০\\text{ দিন}$\n(গ) $৫০\\text{ দিন}$ (ঘ) $১৮০\\text{ দিন}$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৯৪ ও ৯৫) নং প্রশ্নের উত্তর দাও:   </b> \nনবম শ্রেণির ছাত্র সজল বেশ কিছুদিন ধরে দুর্বলতা অনুভব করায় রক্ত পরীক্ষা করাল। ডাক্তার বললেন, তার রক্তে লোহিত রক্তকণিকার বিশেষ এক ধরনের রঞ্জক পদার্থের পরিমাণ কমে গেছে, যার কাজ ছিল অক্সিজেনের সাথে যুক্ত হয়ে অক্সিহিমোগ্লোবিন গঠন করা।\n৯৪. উদ্দীপকে সজলের রক্তে কোন রঞ্জক পদার্থের অভাবের কথা বলা হয়েছে?\n(ক) ক্লোরোফিল (খ) হিমোগ্লোবিন\n(গ) ক্যালোজ (ঘ) হেপারিন\nউত্তর: খ\n৯৫. উদ্দীপকে উল্লিখিত রঞ্জক পদার্থের উপস্থিতি কমে গেলে সজলের দেহে কোন রোগের সৃষ্টি হতে পারে?\n(ক) অ্যানিমিয়া বা রক্তশূন্যতা (খ) ডায়াবেটিস\n(গ) রিকেটস (ঘ) গইটার\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৯৬ ও ৯৭) নং প্রশ্নের উত্তর দাও:   </b> \nঅণুবীক্ষণ যন্ত্রে দেখা গেল— নির্দিষ্ট আকৃতিহীন ও নিউক্লিয়াসযুক্ত একপ্রকার রক্তকণিকা ক্ষণপদ সৃষ্টি করে অ্যামিবার মতো রূপ পরিবর্তন করছে এবং দেহের ভেতর প্রবেশ করা রোগজীবাণুকে ঘিরে ধরে বিনষ্ট করছে।\n৯৬. উদ্দীপকে বর্ণিত জীবাণু ধ্বংসকারী রক্তকণিকাটির নাম কী?\n(ক) লোহিত রক্তকণিকা (খ) শ্বেত রক্তকণিকা\n(গ) অনুচক্রিকা (ঘ) প্লেটলেট\nউত্তর: খ\n৯৭. উদ্দীপকে উল্লিখিত রক্তকণিকাটি যে প্রক্রিয়ায় রোগজীবাণু ধ্বংস করে তাকে কী বলা হয়?\n(ক) ফ্যাগোসাইটোসিস (খ) পিনোসাইটোসিস\n(গ) প্ল্যাজমোলাইসিস (ঘ) ইমবাইবিশন\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৯৮ ও ৯৯) নং প্রশ্নের উত্তর দাও:   </b> \nরক্ত পরীক্ষায় চিকিৎসাকেন্দ্রে জানা গেল একজন ব্যক্তির প্রতি ঘনমিলিমিটার রক্তে একটি নির্দিষ্ট কণিকার সংখ্যা $৪-১০\\text{ হাজার}$। তবে ওই ব্যক্তি জীবাণু দ্বারা সংক্রমিত হওয়ার কারণে এই কণিকার সংখ্যা দ্রুত বৃদ্ধি পেতে শুরু করেছে।\n৯৮. উদ্দীপকে উল্লেখিত রক্তকণিকাটির গড় আয়ু কত দিন?\n(ক) $১২০\\text{ দিন}$ (খ) $১-১৫\\text{ দিন}$\n(গ) $৫০\\text{ দিন}$ (ঘ) $১৮০\\text{ দিন}$\nউত্তর: খ\n৯৯. উদ্দীপক অনুযায়ী সুস্থ অবস্থায় শ্বেত রক্তকণিকা ও লোহিত রক্তকণিকার সংখ্যার অনুপাত কেমন থাকে?\n(ক) লোহিত রক্তকণিকার সংখ্যা শ্বেত রক্তকণিকার চেয়ে প্রায় $৫০০\\text{ গুণ}$ বেশি \n(খ) শ্বেত রক্তকণিকার সংখ্যা লোহিত রক্তকণিকার চেয়ে $৫০০\\text{ গুণ}$ বেশি\n(গ) উভয় রক্তকণিকার সংখ্যা সমান থাকে \n(ঘ) লোহিত রক্তকণিকা শ্বেত রক্তকণিকার চেয়ে $১০০০\\text{ গুণ}$ কম থাকে\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (১০০ ও ১০১) নং প্রশ্নের উত্তর দাও:   </b> \nঅসুস্থ হয়ে তানভীর হাসপাতালে ভর্তি হলে চিকিৎসক জানালেন যে, তার রক্তে দুই ধরনের দানাহীন শ্বেত রক্তকণিকা সক্রিয় রয়েছে। একটি বড় নিউক্লিয়াসযুক্ত ছোট কণিকা যা অ্যান্টিবডি তৈরি করছে, অন্যটি বৃক্কাকার নিউক্লিয়াসযুক্ত বড় কণিকা যা সরাসরি ফ্যাগোসাইটোসিস প্রক্রিয়ায় জীবাণু গ্রাস করছে।\n১০০. উদ্দীপকে বর্ণিত অ্যান্টিবডি তৈরি করে রোগ প্রতিরোধ ক্ষমতা বৃদ্ধি করা কণিকা কোনটি?\n(ক) লিম্ফোসাইট (খ) মোনোসাইট\n(গ) নিউট্রোফিল (ঘ) বেসোফিল\nউত্তর: ক\n১০১. উদ্দীপকের বর্ণিত দ্বিতীয় রক্তকণিকাটির (মোনোসাইট) নিউক্লিয়াসের আকৃতি কেমন?\n(ক) ছোট, ডিম্বাকার ও বৃক্কাকার (খ) বড় ও গোলাকার\n(গ) খণ্ডকযুক্ত (ঘ) চালুনির মতো\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (১০২ ও ১০৩) নং প্রশ্নের উত্তর দাও:   </b> \nগবেষণাগারে পর্যবেক্ষণ করে দেখা গেল যে, রক্তনালির অভ্যন্তরে একপ্রকার বিশেষ রাসায়নিক পদার্থ ক্ষরিত হওয়ায় রক্ত স্বাভাবিক অবস্থায় জমাট বাঁধে না। আবার অন্য একপ্রকার রাসায়নিক পদার্থ দেহে প্রবেশ করা অ্যালার্জি প্রতিরোধে সাহায্য করে। এই দুটি পদার্থই দানাযুক্ত শ্বেত রক্তকণিকা থেকে নিঃসৃত হয়।\n১০২. উদ্দীপকে উল্লিখিত রক্তকে রক্তনালির ভেতরে জমাট বাঁধতে বাধা দানকারী পদার্থের নাম কী?\n(ক) হেপারিন (খ) হিস্টামিন\n(গ) থ্রম্বোপ্লাস্টিন (ঘ) ফিব্রিনোজেন\nউত্তর: ক\n১০৩. উদ্দীপকের অ্যালার্জি প্রতিরোধকারী হিস্টামিন নামক রাসায়নিক পদার্থটি কোন রক্তকণিকা দুটি থেকে নিঃসৃত হয়?\n(ক) ইওসিনোফিল ও বেসোফিল \n(খ) নিউট্রোফিল ও মোনোসাইট\n(গ) লিম্ফোসাইট ও প্লাজমা \n(ঘ) লোহিত ও শ্বেত রক্তকণিকা\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (১০৪ ও ১০৫) নং প্রশ্নের উত্তর দাও:   </b> \nঅণুবীক্ষণ যন্ত্রের নিচে রক্তের এমন একটি উপাদান দেখা গেল যা গোলাকার, ডিম্বাকার বা রড আকারের এবং এতে কোনো নিউক্লিয়াস নেই। সুস্থ মানবদেহে প্রতি ঘনমিলিমিটার রক্তে এর সংখ্যা প্রায় আড়াই লাখ। কোনো কারণে দেহে এই কণিকার ঘাটতি হলে রক্তপাত সহজে বন্ধ হয় না।\n১০৪. উদ্দীপকে নির্দেশিত নিউক্লিয়াসহীন রক্ত উপাদানটির নাম কী?\n(ক) অনুচক্রিকা বা প্লেটলেট (খ) লোহিত রক্তকণিকা\n(গ) শ্বেত রক্তকণিকা (ঘ) লিম্ফোসাইট\nউত্তর: ক\n১০৫. উদ্দীপকে উল্লিখিত রক্ত উপাদানটির গড় আয়ু কত দিন?\n(ক) $৫-১০\\text{ দিন}$ (খ) $১-১৫\\text{ দিন}$\n(গ) $১২০\\text{ দিন}$ (ঘ) $৫০\\text{ দিন}$\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (১০৬ ও ১০৭) নং প্রশ্নের উত্তর দাও:   </b> \nখেলার মাঠে সোহানের পা কেটে রক্তপাত শুরু হলো। কিছুক্ষণ পর সেখানে রক্ত জমাট বেঁধে রক্তপাত বন্ধ হয়ে গেল। চিকিৎসকরা জানালেন, রক্তনালি ক্ষতিগ্রস্ত হওয়ায় অনুচক্রিকাগুলো সক্রিয় হয়ে একটি বিশেষ পদার্থ তৈরি করেছে, যা রক্তরসের প্রোটিনকে ফিব্রিন জালে পরিণত করে ক্ষতস্থান বন্ধ করেছে।\n১০৬. উদ্দীপকে রক্ত জমাট বাঁধার সূচনালগ্নে অনুচক্রিকা সক্রিয় হয়ে কোন উপাদানটি তৈরি করে?\n(ক) থ্রম্বোপ্লাস্টিন (খ) থ্রম্বিন\n(গ) ফিব্রিনোজেন (ঘ) হেপারিন\nউত্তর: ক\n১০৭. রক্ত জমাট বাঁধার এই জটিল প্রক্রিয়ায় নিচের কোন ক্যাটায়ন ও ভিটামিন সরাসরি জড়িত থাকে?\n(ক) ক্যালসিয়াম আয়ন ($Ca^{2+}$) ও ভিটামিন $K$ \n(খ) সোডিয়াম আয়ন ও ভিটামিন $A$\n(গ) আইরিন আয়ন ও ভিটামিন $C$ \n(ঘ) পটাশিয়াম আয়ন ও ভিটামিন $D$\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (১০৮ ও ১০৯) নং প্রশ্নের উত্তর দাও:   </b> \nমানবদেহের বিভিন্ন অঙ্গ ও পেশিতে অনবরত দহনক্রিয়া সম্পাদন হওয়ার ফলে প্রচুর তাপ উৎপন্ন হয়। রক্ত এই তাপ সারা দেহে ছড়িয়ে দিয়ে দেহের অভ্যন্তরীণ ভারসাম্য বজায় রাখে। পাশাপাশি এটি ক্ষতিকর বর্জ্য বহন করে রেচন অঙ্গের দিকে নিয়ে যায়।\n১০৮. উদ্দীপক অনুযায়ী দেহের সর্বত্র রক্তের মাধ্যমে তাপ ছড়িয়ে পড়ার প্রধান সুফল কোনটি?\n(ক) দেহের সর্বাঙ্গে তাপের সমতা রক্ষা হয় \n(খ) রক্ত তঞ্চনের গতি বাড়ে\n(গ) হরমোনের উৎপাদন বৃদ্ধি পায় \n(ঘ) অ্যান্টিবডি ধ্বংস প্রাপ্ত হয়\nউত্তর: ক\n১০৯. উদ্দীপকে বর্ণিত ক্ষতিকর বর্জ্য হিসেবে রক্ত কোন পদার্থসমূহ নিষ্কাশনের জন্য বহন করে?\n(ক) ইউরিয়া, ইউরিক এসিড ও কার্বন ডাই-অক্সাইড \n(খ) গ্লুকোজ ও ফ্যাটি এসিড\n(গ) আলবুমিন ও গ্লোবুলিন (ঘ) পিত্তরস ও এনজাইম\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (১১০ ও ১১১) নং প্রশ্নের উত্তর দাও:   </b> \nদেহের সজীব কোষগুলোতে শক্তি উৎপাদনের জন্য প্রয়োজনীয় অক্সিজেন লোহিত রক্তকণিকা দ্বারা বাহিত হয়। এছাড়া অনাল বা নালিবিহীন গ্রন্থিতে তৈরি এক ধরনের জৈব রাসায়নিক রস সরাসরি রক্তের মাধ্যমে দেহের বিভিন্ন কোষে পরিবাহিত হয়ে শারীরবৃত্তীয় কাজ নিয়ন্ত্রণ করে।\n১১০. উদ্দীপকে উল্লিখিত অনাল গ্রন্থিতে তৈরি জৈব রাসায়নিক রসকে কী বলা হয়?\n(ক) হরমোন (খ) এনজাইম\n(গ) ভিটামিন (ঘ) অ্যান্টিবডি\nউত্তর: ক\n১১১. উদ্দীপক অনুসারে লোহিত রক্তকণিকা কোন যৌগ হিসেবে অক্সিজেনকে কোষে সরবরাহ করে?\n(ক) অক্সিহিমোগ্লোবিন (খ) কার্বামিনো হিমোগ্লোবিন\n(গ) সোডিয়াম বাইকার্বোনেট (ঘ) থ্রম্বোপ্লাস্টিন\nউত্তর: ক"}]},{"id":"topic_1787669543737oln9m","title":"পাঠ-( 6.3.2)","blocks":[{"id":"block_1787669590890p3uqj","type":"text","value":"<span style=\"color:seagreen;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. মানুষের রক্তের শ্রেণিবিন্যাস বা 'রক্তের গ্রুপ' ১৯০১ সালে প্রথম কে আবিষ্কার করেন? \n(ক) কার্ল ল্যান্ডস্টেইনার (খ) কার্টিস \n(গ) রবার্ট হুক (ঘ) লুই পাস্তুর \nউত্তর: ক \n২. রক্তের লোহিত রক্তকণিকায় বিদ্যমান বিশেষ ধরনের প্রোটিনকে কী বলা হয়? \n(ক) অ্যান্টিবডি (খ) অ্যান্টিজেন \n(গ) হিমোগ্লোবিন (ঘ) ফিব্রিনোজেন \nউত্তর: খ \n৩. রক্তের প্লাজমা বা রক্তরসে বিদ্যমান প্রোটিন জাতীয় উপাদানকে কী বলা হয়? \n(ক) অ্যান্টিজেন (খ) অ্যান্টিবডি (গ) পেকটিন (ঘ) হেপারিন \nউত্তর: খ \n৪. বিজ্ঞানী কার্ল ল্যান্ডস্টেইনার মানুষের রক্তকে প্রধানত কয়টি গ্রুপে ভাগ করেন? \n(ক) $২$ টি (খ) $৪$ টি (গ) $৬$ টি (ঘ) $৮$ টি \nউত্তর: খ \n৫. 'A' গ্রুপের রক্তের লোহিত রক্তকণিকায় কোন অ্যান্টিজেন উপস্থিত থাকে? \n(ক) $A$ অ্যান্টিজেন (খ) $B$ অ্যান্টিজেন \n(গ) $a$ অ্যান্টিবডি (ঘ) কোনো অ্যান্টিজেন থাকে না \nউত্তর: ক \n৬. 'A' রক্তগ্রুপ বিশিষ্ট ব্যক্তির রক্তরসে কোন অ্যান্টিবডি থাকে? \n(ক) $a$ অ্যান্টিবডি (খ) $b$ অ্যান্টিবডি \n(গ) $a$ ও $b$ উভয়ই (ঘ) কোনোটিই নয় \nউত্তর: খ \n৭. 'B' রক্তের গ্রুপের লোহিত রক্তকণিকা ও রক্তরসে যথাক্রমে কী থাকে? \n(ক) $B$ অ্যান্টিজেন ও $a$ অ্যান্টিবডি \n(খ) $A$ অ্যান্টিজেন ও $b$ অ্যান্টিবডি \n(গ) $B$ অ্যান্টিজেন ও $b$ অ্যান্টিবডি \n(ঘ) $a$ অ্যান্টিজেন ও $B$ অ্যান্টিবডি \nউত্তর: ক \n৮. কোন রক্তগ্রুপের লোহিত রক্তকণিকায় $A$ ও $B$ উভয় অ্যান্টিজেন থাকে, কিন্তু রক্তরসে কোনো অ্যান্টিবডি থাকে না? \n(ক) $A$ (খ) $B$ (গ) $AB$ (ঘ) $O$ \nউত্তর: গ \n৯. 'O' রক্তের গ্রুপের বৈশিষ্ট্য কোনটি? \n(ক) লোহিত কণিকায় কোনো অ্যান্টিজেন থাকে না, তবে রক্তরসে $a$ ও $b$ অ্যান্টিবডি থাকে \n(খ) লোহিত কণিকায় $A$ ও $B$ উভয় অ্যান্টিজেন থাকে \n(গ) রক্তরসে কোনো অ্যান্টিবডি থাকে না \n(ঘ) লোহিত কণিকায় $A$ অ্যান্টিজেন ও রক্তরসে $b$ অ্যান্টিবডি থাকে \nউত্তর: ক \n১০. রক্তরস ও লোহিত রক্তকণিকার মধ্যে অসামঞ্জস্যপূর্ণ বিক্রিয়ায় লোহিত কণিকাসমূহ জমাট বেঁধে যাওয়াকে কী বলে? \n(ক) ফ্যাগোসাইটোসিস (খ) অ্যাগ্লুটিনেশন \n(গ) ডায়ালাইসিস (ঘ) হিমোফিলিয়া \nউত্তর: খ\n ১১. কোনো প্রকার অ্যান্টিজেন না থাকায় কোন রক্তগ্রুপ বিশিষ্ট ব্যক্তিকে সর্বজনীন রক্তদাতা ($Universal\\ Donor$) বলা হয়? \n(ক) $A$ (খ) $B$ (গ) $AB$ (ঘ) $O$ \nউত্তর: ঘ \n১২. রক্তরসে কোনো অ্যান্টিবডি না থাকায় কোন গ্রুপের রক্ত বিশিষ্ট ব্যক্তি অন্য সব গ্রুপের রক্ত গ্রহণ করতে পারে? \n(ক) $A$ (খ) $B$ (গ) $AB$ (ঘ) $O$ \nউত্তর: গ \n১৩. 'A' রক্তগ্রুপের ব্যক্তি কোন কোন গ্রুপের ব্যক্তিকে রক্ত দান করতে পারবে? \n(ক) $A$ ও $AB$ (খ) $A$ ও $O$ \n(গ) কেবল $A$ (ঘ) $A, B$ ও $O$ \nউত্তর: ক \n১৪. 'A' রক্তগ্রুপের ব্যক্তি কোন কোন গ্রুপ থেকে রক্ত গ্রহণ করতে পারবে? \n(ক) $A$ ও $O$ (খ) $A$ ও $AB$ \n(গ) কেবল $O$ (ঘ) $B$ ও $AB$ \nউত্তর: ক \n১৫. 'B' রক্তগ্রুপের ব্যক্তি কোন কোন গ্রুপ থেকে রক্ত গ্রহণ করতে পারে? \n(ক) $B$ ও $O$ (খ) $B$ ও $AB$ \n(গ) কেবল $B$ (ঘ) $A$ ও $B$ \nউত্তর: ক \n১৬. 'AB' রক্তগ্রুপের ব্যক্তি কোন কোন গ্রুপের রক্ত গ্রহণ করতে পারবে? \n(ক) কেবল $AB$ (খ) $A, B, AB$ ও $O$ \n(গ) $A$ ও $B$ (ঘ) $O$ ও $AB$ \nউত্তর: খ \n১৭. 'O' গ্রুপের রক্ত নিচের কোন কোন গ্রুপকে দেওয়া সম্ভব? \n(ক) কেবল $O$ (খ) $A, B, AB$ ও $O$ \n(গ) $A$ ও $B$ (ঘ) $AB$ ও $O$ \nউত্তর: খ \n১৮. রেসাস বানরের লোহিত রক্তকণিকার মতো মানবদেহের লোহিত কণিকায় বিদ্যমান বিশেষ প্রোটিনকে কী বলা হয়? \n(ক) $ABO$ ফ্যাক্টর (খ) $Rh$ ফ্যাক্টর \n(গ) হেপারিন (ঘ) ক্যালোজ \nউত্তর: খ \n১৯. রক্তে রেসাস অ্যান্টিজেন উপস্থিত থাকলে সে রক্তকে কী বলা হয়? \n(ক) $Rh$ পজিটিভ ($Rh^+$) (খ) $Rh$ নেগেটিভ ($Rh^-$) \n(গ) ইউনিভার্সাল ডোনার (ঘ) মাইনর গ্রুপ\n উত্তর: ক \n২০. লোহিত রক্তকণিকায় রেসাস অ্যান্টিজেন না থাকলে সে রক্তকে কী বলে? \n(ক) $Rh$ পজিটিভ ($Rh^+$) (খ) $Rh$ নেগেটিভ ($Rh^-$) \n(গ) ইউনিভার্সাল গ্রহীতা (ঘ) সেকেন্ডারি গ্রুপ \nউত্তর: খ \n২১. কোনো প্রকার অ্যান্টিজেন না থাকায় প্রকৃতপক্ষে সর্বজনীন রক্তদাতা গ্রুপ কোনটি? \n(ক) $O^+$ (খ) $O^-$ (গ) $AB^+$ (ঘ) $AB^-$ \nউত্তর: খ \n২২. রক্ত দেওয়ার পূর্বে $ABO$ গ্রুপ এবং $Rh$ ফ্যাক্টর মেলানোর পরীক্ষাকে কী বলা হয়? \n(ক) ক্রস ম্যাচিং ($Cross\\ matching$) (খ) স্ক্রিনিং টেস্ট \n(গ) হিমোগ্লোবিন টেস্ট (ঘ) এনজিওগ্রাম \nউত্তর: ক \n২৩. এডস, হেপাটাইটিস বি, হেপাটাইটিস সি বা সিফিলিসের মতো রোগের জীবাণু পরীক্ষা করতে রক্ত দেওয়ার আগে কোনটি করা হয়? \n(ক) স্ক্রিনিং টেস্ট ($Screening\\ test$) (খ) ক্রস ম্যাচিং \n(গ) আলট্রাসনোগ্রাফি (ঘ) রক্ত তঞ্চন \nউত্তর: ক \n২৪. পরোক্ষভাবে একজন সুস্থ ব্যক্তির দেহ থেকে অন্য অসুস্থ ব্যক্তির দেহে রক্ত সংবহন করাকে কী বলে? \n(ক) রক্ত তঞ্চন (খ) রক্ত সঞ্চালন ($Blood\\ transfusion$) \n(গ) ফ্যাগোসাইটোসিস (ঘ) ডায়ালাইসিস \nউত্তর: খ \n২৫. অসামঞ্জস্যপূর্ণ রক্ত সঞ্চালনের ফলে লোহিত রক্তকণিকা জমাট বেঁধে ভেঙে যাওয়ার ঘটনাকে কী বলা হয়? \n(ক) হিমোলাইসিস (খ) হিমোফিলিয়া \n(গ) অ্যাটেরোস্ক্লেরোসিস (ঘ) থ্রম্বোসিস \nউত্তর: ক \n২৬. ভুল বা অসামঞ্জস্যপূর্ণ রক্তের গ্রুপ প্রদান করলে রক্তকণিকা জমাট বেঁধে রোগীর কোন অঙ্গটি অকেজো হয়ে যেতে পারে? \n(ক) বৃক্ক (খ) ফুসফুস (গ) যকৃৎ (ঘ) পাকস্থলী \nউত্তর: ক \n২৭. একজন সুস্থ প্রাপ্তবয়স্ক ব্যক্তি একবারে শরীরের কতটুকু রক্ত দান করতে পারেন? \n(ক) প্রায় $২৫০\\text{ মিলি}$ (খ) প্রায় $৪৫০\\text{ মিলি}$ \n(গ) প্রায় $৬০০\\text{ মিলি}$ (ঘ) প্রায় $১০০০\\text{ মিলি}$ \nউত্তর: খ \n২৮. রক্তদানে একজন মানুষের শরীরের মোট লোহিত রক্তকণিকার কত শতাংশ হ্রাস পায়? \n(ক) প্রায় $১০\\%$ (খ) প্রায় $২০\\%$ \n(গ) প্রায় $৩০\\%$ (ঘ) প্রায় $৫০\\%$ \nউত্তর: খ \n২৯. নিচের কোন রোগটিতে আক্রান্ত ব্যক্তির রক্ত অন্য কোনো ব্যক্তিকে দেওয়া সম্পূর্ণরূপে নিষিদ্ধ? \n(ক) হেপাটাইটিস বি ও এইডস \n(খ) ডায়াবেটিস ও উচ্চ রক্তচাপ \n(গ) অ্যাজমা ও অ্যালার্জি \n(ঘ) গ্যাস্ট্রিক ও অ্যানিমিয়া \nউত্তর: ক \n৩০. রক্তের উপ-রক্তশ্রেণিকে কী বলা হয়? \n(ক) Major blood group (খ) Minor blood group \n(গ) Primary group (ঘ) Donor group \nউত্তর: খ"},{"id":"block_1787669672147mianl","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:seagreen;\"><center><b>🌸----------<u>অনুধাবন মূলক MCQ</u>---------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n৩১. রক্তের গ্রুপ আবিষ্কার ও প্রবর্তন সম্পর্কে তথ্য—\ni. ১৯০১ সালে বিজ্ঞানী কার্ল ল্যান্ডস্টেইনার রক্তের গ্রুপ আবিষ্কার করেন\nii. লোহিত রক্তকণিকায় বিদ্যমান অ্যান্টিজেন এবং রক্তরসে বিদ্যমান অ্যান্টিবডির ওপর ভিত্তি করে রক্তের গ্রুপ নির্ধারণ করা হয়\niii. মানুষের রক্তকে প্রধানত $A$, $B$, $AB$ এবং $O$— এই চারটি গ্রুপে ভাগ করা হয়েছে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩২. অ্যান্টিজেন ও অ্যান্টিবডির অবস্থান ও প্রকৃতি—\ni. অ্যান্টিজেন লোহিত রক্তকণিকার প্রাচীরে অবস্থিত বিশেষ প্রোটিন\nii. অ্যান্টিবডি রক্তরসে অবস্থিত প্রোটিন জাতীয় উপাদান\niii. লোহিত কণিকায় $A$ অ্যান্টিজেন থাকলে রক্তরসে $a$ অ্যান্টিবডি থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৩. 'A' গ্রুপের রক্তের বৈশিষ্ট্যসমূহ—\ni. এর লোহিত রক্তকণিকায় $A$ অ্যান্টিজেন থাকে\nii. এর রক্তরসে $b$ অ্যান্টিবডি থাকে\niii. এটি $A$ ও $AB$ গ্রুপকে রক্ত দান করতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৪. 'B' এবং 'AB' গ্রুপের রক্তের ক্ষেত্রে সত্য তথ্য—\ni. 'B' গ্রুপের রক্তে $B$ অ্যান্টিজেন ও $a$ অ্যান্টিবডি থাকে\nii. 'AB' গ্রুপের লোহিত কণিকায় $A$ ও $B$ উভয় অ্যান্টিজেন থাকে\niii. 'AB' গ্রুপের রক্তরসে $a$ ও $b$ উভয় অ্যান্টিবডি থাকে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৫. সর্বজনীন রক্তদাতা ও গ্রহীতার বৈশিষ্ট্য—\ni. 'O' গ্রুপের লোহিত কণিকায় কোনো অ্যান্টিজেন থাকে না বলে এটি সর্বজনীন রক্তদাতা ($Universal\\ donor$)\nii. 'AB' গ্রুপের রক্তরসে কোনো অ্যান্টিবডি থাকে না বলে এটি সর্বজনীন রক্তগ্রহীতা ($Universal\\ recipient$)\niii. 'O' গ্রুপের ব্যক্তি সব গ্রুপের ব্যক্তির কাছ থেকে রক্ত গ্রহণ করতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৬. রক্ত তঞ্চন বা অ্যাগ্লুটিনেশন ($Agglutination$) ঘটে যখন—\ni. $A$ অ্যান্টিজেনের সাথে $a$ অ্যান্টিবডি বিক্রিয়া করে\nii. $B$ অ্যান্টিজেনের সাথে $b$ অ্যান্টিবডি বিক্রিয়া করে\niii. রক্তরস ও লোহিত রক্তকণিকার মধ্যে অসামঞ্জস্য ঘটে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৭. রেসাস বা $Rh$ ফ্যাক্টর ($Rh\\ factor$) সম্পর্কে সঠিক উক্তি—\ni. রেসাস বানরের লোহিত কণিকায় বিদ্যমান অ্যান্টিজেনের নামানুসারে এর নামকরণ করা হয়েছে\nii. এটি লোহিত কণিকায় উপস্থিত থাকলে তাকে $Rh^+$ এবং অনুপস্থিত থাকলে $Rh^-$ বলা হয়\niii. $Rh$ ফ্যাক্টর না থাকায় $O^-$ রক্তগ্রুপ প্রকৃতপক্ষে প্রকৃত সর্বজনীন রক্তদাতা\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৩৮. রক্ত সঞ্চালনের পূর্বে গৃহীত নিরাপত্তামূলক পরীক্ষা—\ni. রক্তদাতার রক্তে প্রদেয় রক্তের ধরন মেলাতে ক্রস ম্যাচিং ($Cross\\ matching$) করা হয়\nii. ক্ষতিকর রোগের জীবাণু আছে কি না তা পরীক্ষা করতে স্ক্রিনিং টেস্ট ($Screening\\ test$) করা হয়\niii. স্ক্রিনিং টেস্টে কেবল হিমোগ্লোবিনের মাত্রা মাপা হয়\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৩৯. রক্ত সঞ্চালনের সময়ে রক্তরোগ স্ক্রিনিং করার মাধ্যমে যেসব জীবাণুর উপস্থিতি পরীক্ষা করা হয়—\ni. এইডস ও হেপাটাইটিস বি\nii. হেপাটাইটিস সি ও সিফিলিস\niii. ম্যালেরিয়া\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪০. অসামঞ্জস্যপূর্ণ রক্ত সঞ্চালনের ($Blood\\ transfusion$) কুফল—\ni. গ্রহীতার রক্তে দাতার লোহিত কণিকাসমূহ জমাট বেঁধে যায়\nii. লোহিত কণিকা ভেঙে গিয়ে হিমোলাইসিস ঘটে\niii. রোগীর বৃক্ক অকেজো হয়ে মৃত্যু ঘটতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪১. রক্তদান সম্পর্কিত শারীরিক তথ্য—\ni. একজন সুস্থ প্রাপ্তবয়স্ক ব্যক্তি একবারে প্রায় $৪৫০\\text{ মিলি}$ রক্ত দান করতে পারেন\nii. রক্তদানে দেহের মোট লোহিত রক্তকণিকার প্রায় $২০\\%$ হ্রাস পায়\niii. রক্তদানের ফলে দাতা অসুস্থ হয়ে পড়ে এবং এই ক্ষতি সহজে পূরণ হয় না\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক\n৪২. রক্তগ্রহীতার রক্তের সামঞ্জস্যতা বিষয়ে সত্য—\ni. 'A' রক্তের গ্রুপের ব্যক্তি $A$ ও $O$ গ্রুপ থেকে রক্ত নিতে পারে\nii. 'B' রক্তের গ্রুপের ব্যক্তি $B$ ও $O$ গ্রুপ থেকে রক্ত নিতে পারে\niii. 'AB' রক্তের গ্রুপের ব্যক্তি $A, B, AB, O$— সব গ্রুপ থেকে রক্ত নিতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ঘ\n৪৩. রক্তদানে বিধিনিষেধ সংক্রান্ত তথ্য—\ni. হেপাটাইটিস বি বা এইডস আক্রান্ত ব্যক্তির রক্ত দান করা সম্পূর্ণ নিষিদ্ধ\nii. সংক্রামক ব্যাধি থাকলে রক্ত প্রদান থেকে বিরত থাকা উচিত\niii. যেকোনো বয়সের শিশু একবারে $৪৫০\\text{ মিলি}$ রক্ত দিতে পারে\nনিচের কোনটি সঠিক?\n(ক) i ও ii (খ) i ও iii\n(গ) ii ও iii (ঘ) i, ii ও iii\nউত্তর: ক"},{"id":"block_1787669720256hgp29","type":"text","value":"<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<span style=\"color:seagreen;\"><center><b>🌸----------<u>উদ্দীপক যুক্ত MCQ</u>----------🌸</b></center></span>\n<span style=\"color:red;\"><center><b>-----------------------------------------------</b></center></span>\n<b> নিচের তথ্যের আলোকে (৪৪ ও ৪৫) নং প্রশ্নের উত্তর দাও:   </b> \nপরীক্ষাগারে রক্ত পরীক্ষার মাধ্যমে জানা গেল নবীন সাহেবের লোহিত রক্তকণিকায় $A$ অ্যান্টিজেন এবং রক্তরসে $b$ অ্যান্টিবডি রয়েছে। অন্যদিকে তার বন্ধু সাকিব সাহেবের লোহিত রক্তকণিকায় $A$ ও $B$ উভয় অ্যান্টিজেন থাকলেও রক্তরসে কোনো অ্যান্টিবডি নেই।\n৪৪. উদ্দীপক অনুযায়ী নবীন সাহেবের রক্তের গ্রুপ কোনটি?\n(ক) $A$ (খ) $B$\n(গ) $AB$ (ঘ) $O$\nউত্তর: ক\n৪৫. উদ্দীপকের সাকিব সাহেব কোন কোন রক্তগ্রুপের ব্যক্তির কাছ থেকে রক্ত গ্রহণ করতে পারবেন?\n(ক) কেবল $AB$ (খ) $A, B, AB$ ও $O$\n(গ) $A$ ও $B$ (ঘ) $O$ ও $AB$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৪৬ ও ৪৭) নং প্রশ্নের উত্তর দাও:   </b> \nদুর্ঘটনায় আহত রূপাকে হাসপাতালে নিয়ে যাওয়া হলে ডাক্তার জানালেন তার রক্তের গ্রুপ $O$। রূপার লোহিত রক্তকণিকায় কোনো অ্যান্টিজেন না থাকায় সে যেকোনো ব্যক্তির দেহে রক্ত দান করতে পারে, কিন্তু সে কেবল নিজের গ্রুপের রক্তই গ্রহণ করতে পারবে।\n৪৬. উদ্দীপকে বর্ণিত কোনো অ্যান্টিজেন না থাকায় রূপার রক্তগ্রুপকে কী বলা হয়?\n(ক) সর্বজনীন গ্রহীতা (খ) সেকেন্ডারি গ্রুপ\n(গ) সর্বজনীন রক্তদাতা (ঘ) মাইনর গ্রুপ\nউত্তর: গ\n৪৭. উদ্দীপক অনুযায়ী রূপা কেবল $O$ গ্রুপ ব্যতীত অন্য গ্রুপের রক্ত কেন গ্রহণ করতে পারে না?\n(ক) তার রক্তরসে $a$ ও $b$ উভয় অ্যান্টিবডি রয়েছে \n(খ) তার লোহিত কণিকায় $A$ অ্যান্টিজেন রয়েছে\n(গ) তার রক্তে কোনো অ্যান্টিবডি নেই \n(ঘ) তার রক্তে অ্যান্টিজেন ও অ্যান্টিবডি উভয়ই অনুপস্থিত\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৪৮ ও ৪৯) নং প্রশ্নের উত্তর দাও:   </b> \n$1901$ সালে বিজ্ঞানী কার্ল ল্যান্ডস্টেইনার লোহিত রক্তকণিকার বিশেষ প্রোটিন অ্যান্টিজেন এবং রক্তরসের অ্যান্টিবডির ওপর ভিত্তি করে মানবদেহের রক্তকে চারটি প্রধান গ্রুপে ভাগ করেন।\n৪৮. উদ্দীপক অনুযায়ী লোহিত রক্তকণিকার প্রাচীরে অবস্থিত বিশেষ প্রোটিনকে কী বলা হয়?\n(ক) অ্যান্টিবডি (খ) অ্যান্টিজেন\n(গ) ফিব্রিনোজেন (ঘ) হিমোগ্লোবিন\nউত্তর: খ\n৪৯. কোনো ব্যক্তির লোহিত কণিকায় $B$ অ্যান্টিজেন এবং রক্তরসে $a$ অ্যান্টিবডি উপস্থিত থাকলে তার রক্তের গ্রুপ কোনটি?\n(ক) $A$ (খ) $B$\n(গ) $AB$ (ঘ) $O$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫০ ও ৫১) নং প্রশ্নের উত্তর দাও:   </b> \nরক্ত সঞ্চালনের পূর্বে দাতা ও গ্রহীতার রক্তের $Rh$ ফ্যাক্টর পরীক্ষা করা হলো। ডাক্তার জানালেন, রেসাস বানরের লোহিত রক্তকণিকার অ্যান্টিজেনের সাথে মানুষের রক্তের এই বিশেষ প্রোটিনের মিল রয়েছে।\n৫০. মানবদেহের লোহিত রক্তকণিকায় রেসাস অ্যান্টিজেন না থাকলে সে রক্তকে কী বলা হয়?\n(ক) $Rh$ পজিটিভ ($Rh^+$) (খ) $Rh$ নেগেটিভ ($Rh^-$)\n(গ) সর্বজনীন গ্রহীতা (ঘ) মাইনর গ্রুপ\nউত্তর: খ\n৫১. লোহিত কণিকায় কোনো প্রকার অ্যান্টিজেন না থাকায় প্রকৃতপক্ষে কোনটি প্রকৃত সর্বজনীন রক্তদাতা গ্রুপ?\n(ক) $O^+$ (খ) $O^-$\n(গ) $AB^+$ (ঘ) $AB^-$\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫২ ও ৫৩) নং প্রশ্নের উত্তর দাও:   </b> \nএক মুমূর্ষু রোগীকে রক্ত দেওয়ার আগে রক্তে কোনো ক্ষতিকর সংক্রামক ব্যাধি (যেমন— এইডস, হেপাটাইটিস বি) আছে কি না তা জানার জন্য একটি বিশেষ পরীক্ষা সম্পন্ন করা হলো। এরপর দাতা ও গ্রহীতার গ্রুপ মেলানোর পরীক্ষা করা হলো।\n৫২. উদ্দীপকে উল্লিখিত সংক্রামক ব্যাধির উপস্থিতি নির্ণয়ে রক্ত সঞ্চালনের পূর্বে কোন পরীক্ষা করা হয়?\n(ক) স্ক্রিনিং টেস্ট ($Screening\\ test$) (খ) ক্রস ম্যাচিং ($Cross\\ matching$)\n(গ) আলট্রাসনোগ্রাফি (ঘ) রক্ত তঞ্চন\nউত্তর: ক\n৫৩. উদ্দীপক অনুযায়ী দাতা ও গ্রহীতার রক্তের $ABO$ গ্রুপ এবং $Rh$ ফ্যাক্টর মেলানোর পরীক্ষাকে কী বলা হয়?\n(ক) স্ক্রিনিং টেস্ট (খ) ক্রস ম্যাচিং\n(গ) অ্যান্ডোস্কোপি (ঘ) বিএমআই টেস্ট\nউত্তর: খ\n<b> নিচের তথ্যের আলোকে (৫৪ ও ৫৫) নং প্রশ্নের উত্তর দাও:   </b> \nজরুরি প্রয়োজনে এক রোগীকে ভুল গ্রুপের রক্ত প্রদান করা হলো। এর ফলে গ্রহীতার রক্তে দাতার লোহিত রক্তকণিকাসমূহ জমাট বেঁধে ভেঙে যেতে শুরু করল এবং রোগীর অবস্থা আশঙ্কাজনক হয়ে উঠল।\n৫৪. উদ্দীপকে অসামঞ্জস্যপূর্ণ রক্ত সঞ্চালনের ফলে লোহিত কণিকাসমূহ জমাট বেঁধে ভেঙে যাওয়ার প্রক্রিয়াটিকে কী বলে?\n(ক) হিমোলাইসিস (খ) অ্যাগ্লুটিনেশন\n(গ) ফ্যাগোসাইটোসিস (ঘ) ডায়ালাইসিস\nউত্তর: ক\n৫৫. উদ্দীপকের এই ভুল রক্ত সঞ্চালনের ফলে সৃষ্ট প্রতিক্রিয়ায় গ্রহীতার কোন অঙ্গটি প্রধানত অকেজো হয়ে পড়তে পারে?\n(ক) বৃক্ক (খ) হূৎপিণ্ড\n(গ) ফুসফুস (ঘ) যকৃৎ\nউত্তর: ক\n<b> নিচের তথ্যের আলোকে (৫৬ ও ৫৭) নং প্রশ্নের উত্তর দাও:   </b> \nসজীব স্বেচ্ছায় রক্তদান শিবিরের মাধ্যমে ১ ব্যাগ রক্ত দান করল। ডাক্তার তাকে আশ্বাস দিলেন যে, এতে তার শারীরিক কোনো ক্ষতি হবে না এবং অল্প দিনের মধ্যেই তার দেহে রক্তের ঘাটতি পূরণ হয়ে যাবে।\n৫৬. উদ্দীপক অনুসারে একজন সুস্থ প্রাপ্তবয়স্ক মানুষ একবারে সাধারণত কত পরিমাণ রক্ত দান করতে পারেন?\n(ক) প্রায় $২৫০\\text{ মিলি}$ (খ) প্রায় $৪৫০\\text{ মিলি}$\n(গ) প্রায় $৬০০\\text{ মিলি}$ (ঘ) প্রায় $১০০০\\text{ মিলি}$\nউত্তর: খ\n৫৭. উদ্দীপক অনুযায়ী একবারে রক্তদানের ফলে মানবদেহে শতকরা কত ভাগ লোহিত রক্তকণিকা হ্রাস পায়?\n(ক) প্রায় $১০\\%$ (খ) প্রায় $২০\\%$\n(গ) প্রায় $৩০\\%$ (ঘ) প্রায় $৫০\\%$\nউত্তর: খ"}]},{"id":"topic_1787669551768q0gfd","title":"পাঠ-( 6.4.1 – 6.4.2)","blocks":[{"id":"block_1787669760183og8l5","type":"text","value":"<span style=\"color:tomato;\"><center><b>🌸----------<u>সাধারণ MCQ</u>----------🌸</b></center></span>\n১. মানবদেহের হূৎপিণ্ড কোথায় অবস্থিত?\n(ক) ফুসফুসের উপরিভাগে \n(খ) বক্ষগহ্বরের বাম
